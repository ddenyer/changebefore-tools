<style>

.btn-row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1.5rem}
.sec-tag{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.5rem}
.pg-title{font-size:1.5rem;font-weight:600;color:#1a1a1a;line-height:1.3;margin-bottom:.3rem;font-family:'Cormorant Garamond',serif}
.pg-sub{font-size:.875rem;color:#666;margin-bottom:1.3rem;line-height:1.65}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;color:#888;cursor:pointer;padding:0;margin-bottom:1.25rem}

.row{display:flex;gap:.8rem;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.field{margin-bottom:.9rem}
.tag{display:inline-block;font-size:.63rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .5rem;border-radius:3px;background:#ebe7e0;color:#888}

/* Grid + analysis tables — house palette */
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:.8rem;background:#fff}
table.grid th,table.grid td{border:1px solid #d8d3cb;padding:.4rem .5rem;text-align:center}

.rowsel td.pole{color:#e07030}
.badge{display:inline-block;min-width:20px;padding:.05rem .5rem;border-radius:3px;font-size:.66rem;font-weight:700;color:#fff;text-align:center}
.badge.H{background:#16a34a}.badge.I{background:#c98a1e}.badge.L{background:#dc2626}
.chip{display:inline-block;padding:.2rem .6rem;border:1px solid #d8d3cb;border-radius:20px;font-size:.72rem;margin:.15rem;background:#fff}
.mini{font-size:.7rem;color:#888}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================ Honey engine (verified) ====================== */
function sumAbsDiff(a, b){
  let sum=0,n=0; const len=Math.min(a.length,b.length);
  for(let i=0;i<len;i++){ if(a[i]==null||b[i]==null) continue; sum+=Math.abs(a[i]-b[i]); n++; }
  return {sum,n};
}
function similarity(c,s,lo,hi){ const {sum,n}=sumAbsDiff(c,s); if(!n) return 0; return 1-(2*sum)/(n*(hi-lo)); }
function reverseRatings(r,lo,hi){ return r.map(x=> x==null?null:(hi+lo-x)); }
function analyseGrid(constructs, supplied, lo, hi){
  const rev=reverseRatings(supplied,lo,hi);
  const scored=constructs.map(c=>{
    const a=similarity(c.ratings,supplied,lo,hi), b=similarity(c.ratings,rev,lo,hi);
    return {c, simAligned:a, simReversed:b, orientation:a>=b?'aligned':'reversed', similarity:Math.max(a,b)};
  });
  const sims=scored.map(s=>s.similarity);
  const min=sims.length?Math.min.apply(null,sims):0, max=sims.length?Math.max.apply(null,sims):0;
  const width=(max-min)/3, high=max-width, low=high-width;
  const order=[...scored].sort((x,y)=>y.similarity-x.similarity);
  const rank={}; order.forEach((s,i)=>rank[s.c.id]=i+1);
  const results=scored.map(s=>({
    id:s.c.id,left:s.c.left,right:s.c.right,
    simAligned:s.simAligned,simReversed:s.simReversed,similarity:s.similarity,
    orientation:s.orientation,rank:rank[s.c.id],
    band:s.similarity>high?'H':(s.similarity<low?'L':'I')
  }));
  return {results, bands:{min,max,width,high,low}};
}
const STOP=new Set(['the','and','vs','not','with','for','was','very','from','into']);
function tokens(s){ return new Set((s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w))); }
function jaccard(a,b){ if(!a.size&&!b.size) return 0; let i=0; a.forEach(t=>{if(b.has(t))i++}); return i/(a.size+b.size-i); }
function suggestGroups(items, threshold){
  threshold=threshold||0.34;
  const toks=items.map(it=>tokens(it.text)), parent=items.map((_,i)=>i);
  const find=x=> parent[x]===x?x:(parent[x]=find(parent[x]));
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++) if(jaccard(toks[i],toks[j])>=threshold) parent[find(i)]=find(j);
  const groups={}; items.forEach((it,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(it); });
  return Object.values(groups).sort((a,b)=>b.length-a.length);
}

/* ====== Composite (content-analysis) helpers — Jankowicz/Honey step ====== */
function pnumOf(name){ const m=String(name||'').match(/\d+/); return m?m[0]:'?'; }
// Preference labels from the preferred-pole mean similarity %.
function prefLabel(left){
  if(left>=70) return 'Strong preference';
  if(left>=58) return 'Moderate preference';
  if(left>=54) return 'Slight preference';
  if(left>=46) return 'Balanced preference';
  if(left>=42) return 'Slight (opposite)';
  return 'Preference (opposite)';
}
// One row per (participant, construct). Honey metrics over an element subset
// (all, or a category e.g. SL / TL). leftAlignPct = how strongly the construct's
// LEFT pole (as recorded) associates with the supplied effectiveness construct.
// band = individual Honey H/I/L, per-participant tercile over the same subset.
// Elements used for Honey. Supplementary elements (e.g. a supplied "future"
// element) are rated and displayed but held OUT of the similarity calculation.
function honeyElements(config, filterCat){
  return (config.elements||[]).filter(e=> !e.supplementary && (!filterCat || e.category===filterCat));
}
// Elements in play for ONE response = prescribed (shared) elements + that
// interview's own elicited elements. Supplementary elements (e.g. the prescribed
// a prescribed "ideal" element) are held out of the Honey similarity. filterCat
// limits to an element category for the per-category Honey tables.
function elementsFor(config, response, filterCat){
  const eli=((response&&response.data&&response.data.elicitedElements)||[]).filter(e=> !e.supplementary && (!filterCat || e.category===filterCat));
  const pre=(config.elements||[]).filter(e=> !e.supplementary && (!filterCat || e.category===filterCat));
  return [...eli, ...pre];
}
// All elements shown in a grid (elicited first, then prescribed), INCLUDING
// supplementary — for display/export. Honey uses elementsFor (supplementary out).
function gridElementsFor(config, response){
  const eli=((response&&response.data&&response.data.elicitedElements)||[]);
  const pre=(config.elements||[]);
  return [...eli, ...pre];
}
// refId chooses the reference (effectiveness) construct every elicited construct
// is measured against. Default (null/'supplied') = the overall yardstick rated in
// the "supplied" row. Passing a prescribed construct id lets you produce a
// composite table against a DIFFERENT criterion ("varying levels of
// effectiveness") — that construct is then excluded from the pooled members.
// The element-ratings of the chosen reference (outcome) construct for a response.
// Supports MULTIPLE outcome/supplied constructs: refId can be an outcome id (rated
// in data.suppliedRatings), the legacy single 'supplied' row, or a prescribed
// construct id. Legacy studies keep working (default 'supplied' -> data.supplied).
function refRatingsFor(d, refId){
  if(d && d.suppliedRatings && d.suppliedRatings[refId]) return d.suppliedRatings[refId];   // multi-outcome store
  if(!refId || refId==='supplied') return (d&&d.supplied)||{};                              // legacy single supplied row
  return (d&&d.ratings&&d.ratings[refId])||{};                                              // prescribed construct as reference
}
function pooledMembers(responses, config, filterCat, refId){
  const lo=config.scaleMin, hi=config.scaleMax;
  const rows=[];
  responses.forEach(r=>{
    const elIds=elementsFor(config, r, filterCat).map(e=>e.id);
    const d=r.data||{}; const ratings=d.ratings||{}; const noPol=d.noPolarity||{};
    const refMap = refRatingsFor(d, refId);
    const sSub=elIds.map(e=> refMap[e]!=null?refMap[e]:null);
    if(!elIds.length || sSub.every(v=>v==null)) return;
    const sRev=reverseRatings(sSub,lo,hi);
    const cons=[...config.constructs, ...(d.elicited||[])].filter(c=> !noPol[c.id] && c.id!==refId);  // no-clear-polarity and the reference construct excluded
    const scored=cons.map(c=>{
      const cArr=elIds.map(e=> (ratings[c.id]&&ratings[c.id][e]!=null)?ratings[c.id][e]:null);
      if(cArr.every(v=>v==null)) return null;
      const aL=similarity(cArr,sSub,lo,hi), aR=similarity(cArr,sRev,lo,hi);
      return {c, aL, aR, sim:Math.max(aL,aR), orient:aL>=aR?'left':'right'};
    }).filter(Boolean);
    if(!scored.length) return;
    const sims=scored.map(s=>s.sim); const mn=Math.min.apply(null,sims), mx=Math.max.apply(null,sims);
    const w=(mx-mn)/3, hiT=mx-w, loT=hiT-w;
    scored.forEach(s=>{
      rows.push({
        key:r.participant_id+':'+s.c.id, participant:r.participant_name||r.participant_id,
        pnum:pnumOf(r.participant_name), left:s.c.left, right:s.c.right,
        leftAlignPct:(s.aL+1)/2*100, rightAlignPct:(s.aR+1)/2*100,
        effLabel: s.orient==='left'? s.c.left : s.c.right,
        band: s.sim>hiT?'H':(s.sim<loT?'L':'I')
      });
    });
  });
  return rows;
}
function totalParticipants(members){ return new Set(members.map(m=>m.participant)).size; }
// Fixed effective-pole orientation per construct, from the all-elements pass.
function fixedOrientOf(membersAll){ const o={}; membersAll.forEach(m=>{ o[m.key]=m.leftAlignPct>=m.rightAlignPct?'left':'right'; }); return o; }
// Aggregate members into composite constructs (Honey Content Table rows). The
// effective pole is fixed (fixedOrient) so its alignment can rise/fall by subset.
// Members of a category — a construct may be assigned to a PRIMARY and an
// optional SECONDARY composite (Jankowicz's "Complex Construct"), so it can count
// toward two categories.
function membersOf(members, assignments, catId){
  const out=[];
  members.forEach(m=>{
    const a=assignments[m.key]; if(!a) return;
    if(a.cat===catId) out.push({m, flip:a.flip, role:'primary'});
    else if(a.cat2===catId) out.push({m, flip:a.flip2, role:'secondary'});
  });
  return out;
}
function compositeRows(members, categories, assignments, totalP, fixedOrient){
  return categories.map(cat=>{
    const mem=membersOf(members, assignments, cat.id);
    const n=mem.length; let sum=0,H=0,I=0,L=0; const parts=new Set();
    mem.forEach(({m,flip})=>{
      const side=(fixedOrient&&fixedOrient[m.key])||(m.leftAlignPct>=m.rightAlignPct?'left':'right');
      const posAlign= side==='left'? m.leftAlignPct : m.rightAlignPct;
      sum += flip? (100-posAlign) : posAlign;
      parts.add(m.participant);
      if(m.band==='H')H++; else if(m.band==='L')L++; else I++;
    });
    const left=n?sum/n:0;
    return {cat, n, uniq:parts.size, uniquePct: totalP? parts.size/totalP*100:0,
      left, right:100-left, pref: n?prefLabel(left):'—',
      H:n?H/n*100:0, I:n?I/n*100:0, L:n?L/n*100:0};
  });
}
function autoFlip(effLabel, cat){
  return jaccard(tokens(effLabel), tokens(cat.right)) > jaccard(tokens(effLabel), tokens(cat.left));
}
// Cohen's kappa for a pair of coders.
function cohen(A,B){
  const keys=Object.keys(A).filter(k=>B[k]); const n=keys.length;
  if(!n) return {n:0,po:0,kappa:0};
  let match=0; const cA={},cB={};
  keys.forEach(k=>{ const a=A[k].cat,b=B[k].cat; cA[a]=(cA[a]||0)+1; cB[b]=(cB[b]||0)+1; if(a===b)match++; });
  const po=match/n; let pe=0;
  Object.keys(cA).forEach(c=>{ if(cB[c]) pe+=(cA[c]/n)*(cB[c]/n); });
  return {n, po, kappa: pe===1?1:(po-pe)/(1-pe)};
}
// Fleiss' kappa for m>2 coders over items all of them coded.
function fleiss(sets){
  const m=sets.length; if(m<2) return {n:0,po:0,kappa:0};
  const keys=Object.keys(sets[0]).filter(k=>sets.every(s=>s[k]));
  const N=keys.length; if(!N) return {n:0,po:0,kappa:0};
  const catSet=new Set(); keys.forEach(k=>sets.forEach(s=>catSet.add(s[k].cat)));
  const cats=[...catSet];
  let Pbar=0; const colTot={};
  keys.forEach(k=>{
    const cnt={}; sets.forEach(s=>{ const c=s[k].cat; cnt[c]=(cnt[c]||0)+1; colTot[c]=(colTot[c]||0)+1; });
    let sq=0; cats.forEach(c=>{ const v=cnt[c]||0; sq+=v*v; });
    Pbar += (sq-m)/(m*(m-1));
  });
  Pbar/=N;
  let Pe=0; cats.forEach(c=>{ const p=(colTot[c]||0)/(N*m); Pe+=p*p; });
  return {n:N, po:Pbar, kappa: Pe===1?1:(Pbar-Pe)/(1-Pe)};
}
// Krippendorff's alpha (nominal). Unlike kappa it tolerates missing codings —
// each unit coded by >=2 of the coders contributes. sets = [{unitKey:{cat}}...].
function krippendorff(sets){
  const units={};
  sets.forEach(s=>{ Object.keys(s).forEach(u=>{ (units[u]=units[u]||[]).push(s[u].cat); }); });
  const o={}; let n=0, coded=0;
  Object.values(units).forEach(vals=>{ const mu=vals.length; if(mu<2) return; n+=mu; coded++;
    for(let i=0;i<mu;i++) for(let j=0;j<mu;j++){ if(i===j) continue; const a=vals[i],b=vals[j];
      o[a]=o[a]||{}; o[a][b]=(o[a][b]||0)+1/(mu-1); } });
  const cats=Object.keys(o);
  if(!cats.length || n<2) return {alpha:null,n:0};
  const nc={}; cats.forEach(c=>{ nc[c]=cats.reduce((s,k)=>s+((o[c]&&o[c][k])||0),0); });
  let Do=0,De=0;
  cats.forEach(a=>cats.forEach(b=>{ if(a!==b){ Do+=((o[a]&&o[a][b])||0); De+=nc[a]*nc[b]; } }));
  De/=(n-1);
  return {alpha: De===0?1:1-Do/De, n:coded};
}
// Overall stats across any number of coder sets, plus the disagreeing items.
function multiStats(sets){
  const m=sets.length;
  if(m<2) return null;
  const keys=Object.keys(sets[0]).filter(k=>sets.every(s=>s[k]));
  const disagree=keys.filter(k=>!sets.every(s=>s[k].cat===sets[0][k].cat));
  const unanimous=keys.length-disagree.length;
  const stat = m===2? cohen(sets[0],sets[1]) : fleiss(sets);
  return {n:keys.length, unanimous, disagree, kappa:stat.kappa, krip:krippendorff(sets),
    po: keys.length? unanimous/keys.length : 0, kind: m===2?'Cohen’s κ':'Fleiss’ κ'};
}
// Majority pick for an item across coder sets (null if tied).
function majorityPick(sets,key){
  const cnt={}; sets.forEach(s=>{ if(s[key]){ const c=s[key].cat; cnt[c]=(cnt[c]||0)+1; } });
  const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  if(!e.length) return null;
  if(e.length>1 && e[0][1]===e[1][1]) return null;
  const winner=e[0][0];
  const src=sets.find(s=>s[key]&&s[key].cat===winner);
  return {cat:winner, flip:src[key].flip, votes:e[0][1]};
}

/* ================= Grid maps: variability, FOCUS cluster, PCA biplot ========= */
// Mean of a numeric array (nulls ignored).
function amean(a){ let s=0,n=0; a.forEach(v=>{ if(v!=null){s+=v;n++;} }); return n?s/n:0; }
// Average Normal Variability: mean, across constructs, of each construct's SD of
// element ratings expressed as % of the maximum possible SD on the scale.
// (Transparent measure of how much the grid's constructs discriminate elements.)
function averageVariability(M, lo, hi){
  if(!M.length) return 0;
  const maxSD=(hi-lo)/2;
  let tot=0,k=0;
  M.forEach(row=>{
    const vals=row.filter(v=>v!=null); if(vals.length<2) return;
    const mu=amean(vals); const varc=vals.reduce((a,v)=>a+(v-mu)*(v-mu),0)/vals.length;
    tot += (Math.sqrt(varc)/maxSD)*100; k++;
  });
  return k? tot/k : 0;
}
// Jacobi eigen-decomposition of a small symmetric matrix -> {values, vectors(cols)}.
function jacobiEigen(A){
  const n=A.length; let a=A.map(r=>r.slice());
  let v=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let sweep=0;sweep<100;sweep++){
    let off=0; for(let p=0;p<n;p++)for(let q=p+1;q<n;q++)off+=a[p][q]*a[p][q];
    if(off<1e-12) break;
    for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){
      if(Math.abs(a[p][q])<1e-14) continue;
      const th=(a[q][q]-a[p][p])/(2*a[p][q]);
      const t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1));
      const c=1/Math.sqrt(t*t+1), s=t*c;
      for(let i=0;i<n;i++){ const aip=a[i][p],aiq=a[i][q]; a[i][p]=c*aip-s*aiq; a[i][q]=s*aip+c*aiq; }
      for(let i=0;i<n;i++){ const api=a[p][i],aqi=a[q][i]; a[p][i]=c*api-s*aqi; a[q][i]=s*api+c*aqi; }
      for(let i=0;i<n;i++){ const vip=v[i][p],viq=v[i][q]; v[i][p]=c*vip-s*viq; v[i][q]=s*vip+c*viq; }
    }
  }
  const vals=a.map((r,i)=>r[i]);
  const idx=vals.map((val,i)=>[val,i]).sort((x,y)=>y[0]-x[0]);
  return { values: idx.map(x=>x[0]), vectors: idx.map(x=> v.map(r=>r[x[1]])) }; // vectors[k] = kth eigenvector
}
// PrinGrid / Slater-style biplot from a constructs x elements matrix (row-centred).
function pcaBiplot(M, lo, hi){
  const R=M.length, E=M[0]?M[0].length:0; if(!R||!E) return null;
  // mean-impute + centre each construct on its own mean
  const G=M.map(row=>{ const mu=amean(row); return row.map(v=> (v==null?mu:v)-mu); });
  // element-element covariance (E x E)
  const C=Array.from({length:E},()=>new Array(E).fill(0));
  for(let i=0;i<E;i++)for(let j=0;j<E;j++){ let s=0; for(let r=0;r<R;r++) s+=G[r][i]*G[r][j]; C[i][j]=s/(R||1); }
  const {values,vectors}=jacobiEigen(C);
  const total=values.reduce((a,b)=>a+Math.max(b,0),0)||1;
  const pc=[0,1].map(k=>({ ev:vectors[k], lambda:Math.max(values[k],0), pct:Math.max(values[k],0)/total*100 }));
  const elem=[]; for(let i=0;i<E;i++) elem.push([ pc[0].ev[i]*Math.sqrt(pc[0].lambda), pc[1].ev[i]*Math.sqrt(pc[1].lambda) ]);
  const con=G.map(row=>[0,1].map(k=>{ let s=0; for(let i=0;i<E;i++) s+=row[i]*pc[k].ev[i]; return pc[k].lambda>1e-9? s/Math.sqrt(pc[k].lambda):0; }));
  return { elem, con, pct:[pc[0].pct,pc[1].pct] };
}
// FOCUS single-linkage ordering of rows of a similarity matrix.
function focusOrder(sim){
  const n=sim.length; if(!n) return [];
  let cl=Array.from({length:n},(_,i)=>[i]);
  const link=(x,y)=>{ let b=-Infinity; x.forEach(i=>y.forEach(j=>{ if(sim[i][j]>b)b=sim[i][j]; })); return b; };
  while(cl.length>1){ let bi=0,bj=1,best=-Infinity;
    for(let i=0;i<cl.length;i++)for(let j=i+1;j<cl.length;j++){ const l=link(cl[i],cl[j]); if(l>best){best=l;bi=i;bj=j;} }
    const merged=[...cl[bi],...cl[bj]]; cl=cl.filter((_,k)=>k!==bi&&k!==bj); cl.push(merged);
  }
  return cl[0];
}
function simMatrix(rows, range){
  const n=rows.length; const m=Array.from({length:n},()=>new Array(n).fill(1));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    let s=0,c=0; for(let k=0;k<rows[i].length;k++){ if(rows[i][k]!=null&&rows[j][k]!=null){ s+=Math.abs(rows[i][k]-rows[j][k]); c++; } }
    const v=c? 1-s/(c*range):0; m[i][j]=v; m[j][i]=v;
  }
  return m;
}

/* ============ Structural indices (per-grid: constructs x elements) ============ */
// One participant's grid: non-supplementary elements, rated constructs, and the
// constructs x elements rating matrix (null = unrated cell).
function gridFor(config, r){
  const els=elementsFor(config,r,null);
  const d=r.data||{}; const ratings=d.ratings||{};
  const allCons=[...(config.constructs||[]), ...((d.elicited)||[])];
  const cons=allCons.filter(c=> els.some(e=> ratings[c.id]&&ratings[c.id][e.id]!=null));
  const M=cons.map(c=> els.map(e=> (ratings[c.id]&&ratings[c.id][e.id]!=null)?ratings[c.id][e.id]:null));
  return {els, cons, M};
}
function pearson(a,b){
  let sx=0,sy=0,sxx=0,syy=0,sxy=0,n=0;
  for(let i=0;i<a.length;i++){ if(a[i]==null||b[i]==null) continue; sx+=a[i];sy+=b[i];sxx+=a[i]*a[i];syy+=b[i]*b[i];sxy+=a[i]*b[i];n++; }
  if(n<2) return 0; const cov=sxy-sx*sy/n, vx=sxx-sx*sx/n, vy=syy-sy*sy/n;
  return (vx>0&&vy>0)? cov/Math.sqrt(vx*vy):0;
}
function corrMatrix(rows){
  const n=rows.length; const m=Array.from({length:n},()=>new Array(n).fill(1));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){ const r=pearson(rows[i],rows[j]); m[i][j]=r; m[j][i]=r; }
  return m;
}
function transpose(M){ return (M[0]||[]).map((_,j)=>M.map(row=>row[j])); }
function distMatrix(rows){
  const n=rows.length; const m=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){ let s=0,c=0; for(let k=0;k<rows[i].length;k++){ const a=rows[i][k],b=rows[j][k]; if(a!=null&&b!=null){ s+=(a-b)*(a-b); c++; } } const d=c?Math.sqrt(s/c*rows[i].length):0; m[i][j]=d; m[j][i]=d; }
  return m;
}
// PVAFF + variance spectrum from the element-element covariance of the row-centred
// grid (same basis as the biplot). High PVAFF = one-dimensional construing (simplicity).
function pvaff(M){
  const R=M.length, E=M[0]?M[0].length:0; if(!R||!E) return {pvaff:0,spectrum:[]};
  const G=M.map(row=>{ const mu=amean(row); return row.map(v=>(v==null?mu:v)-mu); });
  const C=Array.from({length:E},()=>new Array(E).fill(0));
  for(let i=0;i<E;i++)for(let j=0;j<E;j++){ let s=0; for(let r=0;r<R;r++) s+=G[r][i]*G[r][j]; C[i][j]=s/(R||1); }
  const {values}=jacobiEigen(C);
  const pos=values.map(v=>Math.max(v,0)); const tot=pos.reduce((a,b)=>a+b,0)||1;
  const spectrum=pos.map(v=>v/tot*100).filter(p=>p>0.01);
  return {pvaff: spectrum[0]||0, spectrum};
}
// Bieri matching: dichotomise around midpoint; % of element-cells where construct
// pairs agree. Higher % = more cognitively SIMPLE.
function bieriIndex(M, lo, hi){
  const mid=(lo+hi)/2; const R=M.length; if(R<2) return null;
  const D=M.map(row=>row.map(v=> v==null?null:(v>mid?1:0)));
  let match=0, tot=0;
  for(let i=0;i<R;i++)for(let j=i+1;j<R;j++){ for(let k=0;k<D[i].length;k++){ if(D[i][k]!=null&&D[j][k]!=null){ tot++; if(D[i][k]===D[j][k]) match++; } } }
  return tot? match/tot*100 : null;
}
// Grid Intensity (Bannister): mean of squared inter-construct correlations x100.
function intensityGrid(M){
  const R=M.length; if(R<2) return null; const C=corrMatrix(M);
  let s=0,n=0; for(let i=0;i<R;i++)for(let j=0;j<R;j++){ if(i!==j){ s+=C[i][j]*C[i][j]; n++; } }
  return n? s/n*100 : null;
}
// Role-tagged element id (self/ideal/…) for a response — elicited or prescribed.
function roleElId(config, r, role){
  const eli=((r.data&&r.data.elicitedElements)||[]).find(e=>e.role===role);
  if(eli) return eli.id;
  const pre=(config.elements||[]).find(e=>e.role===role);
  return pre?pre.id:null;
}
// Self–ideal analysis for one response: standardised distance + self-esteem correlation.
function selfIdeal(config, r){
  const selfId=roleElId(config,r,'self'), idealId=roleElId(config,r,'ideal');
  if(!selfId||!idealId) return null;
  const d=r.data||{}, ratings=d.ratings||{};
  const cons=[...(config.constructs||[]),...((d.elicited)||[])].filter(c=> ratings[c.id]&&ratings[c.id][selfId]!=null&&ratings[c.id][idealId]!=null);
  if(cons.length<2) return null;
  const sv=cons.map(c=>ratings[c.id][selfId]), iv=cons.map(c=>ratings[c.id][idealId]);
  let ss=0; for(let k=0;k<cons.length;k++) ss+=(sv[k]-iv[k])*(sv[k]-iv[k]);
  const dist=Math.sqrt(ss/cons.length);
  return {dist, pct:dist/(config.scaleMax-config.scaleMin)*100, esteem:pearson(sv,iv), n:cons.length};
}
// Implicative dilemmas for one response (needs a self and an ideal element).
function dilemmas(config, r){
  const selfId=roleElId(config,r,'self'), idealId=roleElId(config,r,'ideal');
  if(!selfId||!idealId) return null;
  const d=r.data||{}, ratings=d.ratings||{};
  const range=config.scaleMax-config.scaleMin;
  const congT=Math.max(1,Math.round(range/6)), discT=Math.round(range/2);
  const cons=[...(config.constructs||[]),...((d.elicited)||[])].filter(c=> ratings[c.id]&&ratings[c.id][selfId]!=null&&ratings[c.id][idealId]!=null);
  const els=elementsFor(config,r,null).map(e=>e.id);
  const info=cons.map(c=>{ const diff=Math.abs(ratings[c.id][selfId]-ratings[c.id][idealId]);
    const status= diff<=congT?'congruent':(diff>=discT?'discrepant':'other');
    return {c, status, vec:els.map(e=> (ratings[c.id]&&ratings[c.id][e]!=null)?ratings[c.id][e]:null)}; });
  const cong=info.filter(x=>x.status==='congruent'), disc=info.filter(x=>x.status==='discrepant');
  const found=[];
  cong.forEach(a=>disc.forEach(b=>{ const cr=pearson(a.vec,b.vec); if(Math.abs(cr)>=0.35) found.push({cong:a.c,disc:b.c,corr:cr}); }));
  const possible=cong.length*disc.length;
  return {found, nCong:cong.length, nDisc:disc.length, possible, pid: possible? found.length/possible*100:0, nCons:cons.length};
}
// Triadic-imbalance conflict (Slade & Sheehan 1979): a triad of constructs is
// "balanced" when the product of its three correlations is positive; a negative
// product is a logical inconsistency. Conflict = % of imbalanced triads.
function triadicConflict(M, labels){
  const C=corrMatrix(M); const n=C.length; if(n<3) return null;
  let imbal=0,total=0; const triads=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++){
    const p=C[i][j]*C[i][k]*C[j][k]; total++;
    if(p<0){ imbal++; triads.push({i,j,k,p}); }
  }
  triads.sort((a,b)=>a.p-b.p);
  return {pct: total? imbal/total*100:0, imbal, total, triads:triads.slice(0,12), labels:labels||[]};
}
// Average-linkage agglomerative clustering from a similarity matrix (0–100).
function hclust(sim){
  const n=sim.length; if(n<2) return null;
  const D=sim.map(row=>row.map(v=>100-v));
  let nodes=[...Array(n).keys()].map(i=>({members:[i],height:0,left:null,right:null,leaf:i}));
  const avg=(A,B)=>{let s=0,c=0; A.members.forEach(a=>B.members.forEach(b=>{s+=D[a][b];c++;})); return s/c;};
  while(nodes.length>1){
    let mi=0,mj=1,md=Infinity;
    for(let a=0;a<nodes.length;a++)for(let b=a+1;b<nodes.length;b++){const d=avg(nodes[a],nodes[b]); if(d<md){md=d;mi=a;mj=b;}}
    const A=nodes[mi],B=nodes[mj];
    nodes=nodes.filter((_,x)=>x!==mi&&x!==mj);
    nodes.push({members:[...A.members,...B.members],height:md,left:A,right:B,leaf:null});
  }
  return nodes[0];
}
// PEGASUS break-match detection. Two ELEMENTS "match" when they are rated
// almost identically across constructs (no construct tells them apart) → prompt
// for a distinguishing construct. Two CONSTRUCTS "match" when they rate elements
// almost identically (in either polarity) → prompt for a distinguishing element.
function findMatches(constructs, elements, ratings, lo, hi, tol){
  const rated=(cid,eid)=> ratings[cid]&&ratings[cid][eid]!=null;
  const elMatch=[], conMatch=[];
  for(let i=0;i<elements.length;i++)for(let j=i+1;j<elements.length;j++){
    const a=elements[i],b=elements[j]; let s=0,n=0;
    constructs.forEach(c=>{ if(rated(c.id,a.id)&&rated(c.id,b.id)){ s+=Math.abs(ratings[c.id][a.id]-ratings[c.id][b.id]); n++; } });
    if(n>=2 && s/n<=tol) elMatch.push({a,b,diff:s/n,n});
  }
  for(let i=0;i<constructs.length;i++)for(let j=i+1;j<constructs.length;j++){
    const a=constructs[i],b=constructs[j]; let sd=0,sr=0,n=0;
    elements.forEach(e=>{ if(rated(a.id,e.id)&&rated(b.id,e.id)){ const va=ratings[a.id][e.id],vb=ratings[b.id][e.id]; sd+=Math.abs(va-vb); sr+=Math.abs(va-((hi+lo)-vb)); n++; } });
    if(n>=2){ const d=Math.min(sd,sr)/n; if(d<=tol) conMatch.push({a,b,diff:d,n,reversed:sr<sd}); }
  }
  return {elMatch, conMatch};
}
// Cut a hclust tree into k clusters by repeatedly splitting the tallest node.
function cutTree(root,k){
  if(!root) return [];
  let cl=[root];
  while(cl.length<k){
    let idx=-1,mh=-1; cl.forEach((n,i)=>{ if(n.left&&n.height>mh){mh=n.height;idx=i;} });
    if(idx<0) break; const n=cl[idx]; cl.splice(idx,1,n.left,n.right);
  }
  return cl.map(n=>n.members);
}
// Per-participant content-category profile: how many of this person's constructs
// were coded into each category (primary + secondary), using the study assignments.
function categoryProfile(config, r){
  const cons=[...(config.constructs||[]), ...((r.data&&r.data.elicited)||[])];
  const A=config.assignments||{}, counts={}; (config.categories||[]).forEach(c=>counts[c.id]=0);
  cons.forEach(c=>{ const a=A[r.participant_id+':'+c.id]; if(!a) return;
    if(a.cat!=null&&counts[a.cat]!=null) counts[a.cat]++;
    if(a.cat2!=null&&counts[a.cat2]!=null) counts[a.cat2]++; });
  return counts;
}

            style={{textTransform:'uppercase',letterSpacing:'.05em'}}
            onChange={e=>{setInput(e.target.value); if(err)setErr('');}}
            onKeyDown={e=>{if(e.key==='Enter'&&!busy)checkCode();}}/>
          {err&&<div style={{marginTop:'.65rem',fontSize:'.82rem',color:'#c0392b',lineHeight:1.5}}>{err}</div>}
          <div className="btn-row"><button className="btn-p" disabled={!input.trim()||busy} onClick={checkCode}>{busy?'Checking…':'Continue →'}</button></div>
        </div>
      ) : (
        <div>
          <label className="field-lbl">Facilitator password</label>
          <input className="inp" type="password" value={pw} autoFocus
            onChange={e=>{setPw(e.target.value); if(err)setErr('');}}
            onKeyDown={e=>{if(e.key==='Enter')checkPw();}}/>
          {err&&<div style={{marginTop:'.65rem',fontSize:'.82rem',color:'#c0392b',lineHeight:1.5}}>{err}</div>}
          <div className="btn-row">
            <button className="btn-p" onClick={checkPw}>Open dashboard</button>
            <button className="btn-s btn-sm" onClick={()=>{setStep('code');setErr('');}}>← Back</button>
          </div>
          <div style={{marginTop:'1rem',paddingTop:'.9rem',borderTop:'1px solid #ebe7e0'}}>
            <p className="mini" style={{marginBottom:'.4rem'}}>Here to complete an interview? You don’t need the facilitator password.</p>
            <button className="btn-s btn-sm" onClick={()=>onUnlock(code,'participant')}>I’m a participant — start my interview →</button>
          </div>
        </div>
      )}
      <div className="card" style={{marginTop:'1.5rem'}}>
        <div className="sec-tag">A 2-minute primer — what is a repertory grid?</div>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.9rem'}}>
          A <b>repertory grid</b> is a structured interview that captures how a person makes sense of a topic <i>in their own words</i>, instead of forcing them into your categories. It comes from personal construct psychology (George Kelly, 1955) and is widely used in leadership, education and management research.
        </p>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.9rem',marginTop:'.55rem'}}>An interview has four moving parts:</p>
        <ul className="primer-list">
          <li><b>Elements</b> — the things being compared (for example, leaders, teams or situations the person knows well).</li>
          <li><b>Constructs</b> — the two-ended descriptions a person uses to tell elements apart (for example, “listens” vs “dictates”). You can prescribe some in advance; others come out during the interview (these are called <i>elicited</i> constructs).</li>
          <li><b>Ratings</b> — the person scores every element on every construct along a scale (for example, 1 to 10).</li>
          <li><b>Supplied construct</b> — one overall yardstick you give everyone (for example, “highly effective” vs “not effective at all”). Everything else is measured against it.</li>
        </ul>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.9rem',marginTop:'.55rem'}}>
          Once several people have been interviewed, <b>Honey’s (1979) content analysis</b> groups everyone’s constructs into shared <b>themes</b> and measures how strongly each theme tracks the supplied construct. That tells you which ways of thinking matter most for the topic — the payoff of the whole exercise.
        </p>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.86rem',marginTop:'.7rem',color:'#888'}}>The tool walks you through it in five stages:</p>
        <div className="primer-flow">
          <span className="stp">Setup</span><span className="arw">→</span>
          <span className="stp">Interviews</span><span className="arw">→</span>
          <span className="stp">1 · Individual Honey</span><span className="arw">→</span>
          <span className="stp">2 · Composite constructs</span><span className="arw">→</span>
          <span className="stp">3 · Composite table</span>
        </div>
      </div>

      <div className="card">
        <div className="sec-tag">What is it used for?</div>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.9rem'}}>The grid is one of the most flexible interview methods there is — anywhere you want to understand how people <i>see</i> something, in their own terms rather than yours.</p>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.88rem',marginTop:'.5rem'}}><b>In research (academic)</b></p>
        <ul className="primer-list">
          <li><b>Psychology &amp; counselling</b> — how a client construes themselves, others and their “ideal self”; tracking change over therapy (Winter, 1992).</li>
          <li><b>Education</b> — how learners or teachers construe a subject, and how understanding shifts over a course.</li>
          <li><b>Management &amp; leadership</b> — what practitioners mean by “effective” leadership, strategy or change (the worked examples in this tool).</li>
          <li><b>Nursing &amp; health</b> — patients’ and professionals’ experience of care, illness or recovery.</li>
          <li><b>Expertise &amp; knowledge elicitation</b> — capturing how experts tell cases apart, for training or knowledge systems.</li>
        </ul>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.88rem',marginTop:'.5rem'}}><b>In practice (commercial)</b></p>
        <ul className="primer-list">
          <li><b>Market &amp; brand research</b> — how customers really distinguish brands or products, beyond a pre-set questionnaire.</li>
          <li><b>Coaching &amp; development</b> — a coachee’s view of their roles, relationships and their gap to an ideal self.</li>
          <li><b>HR &amp; competencies</b> — building competency frameworks and job/role analysis from how good performers construe the work.</li>
          <li><b>UX &amp; product</b> — how users construe screens, features or competing products.</li>
          <li><b>Organisational &amp; culture change</b> — surfacing how a team or organisation construes “how we work”, and where views diverge.</li>
        </ul>
        <span className="help-ref">Foundational reading: Kelly, G. A. (1955) <i>The Psychology of Personal Constructs</i>. · Fransella, F., Bell, R. &amp; Bannister, D. (2004) <i>A Manual for Repertory Grid Technique</i> (2nd ed.). · Jankowicz, D. (2004) <i>The Easy Guide to Repertory Grids</i> — the friendliest starting point. · Honey, P. (1979) ‘The repertory grid in action’, <i>Industrial &amp; Commercial Training</i>, 11(11).</span>
      </div>
    </div>
  );
}

/* ============================ Grid table ====================== */
// constructs: array of {id,left,right,elicited?}. Elicited rows have editable poles.
function GridTable({elements, elementNames, constructs, scaleMin, scaleMax, outcomes,
                    ratings, suppliedRatings, selected, onSel, onRate, onRateSupplied, onPole, onRemoveElicited, readOnly}){
  outcomes = outcomes || [];
  suppliedRatings = suppliedRatings || {};
  const val=(m,cid,eid)=> (m[cid]&&m[cid][eid]!=null)?m[cid][eid]:'';
  const inp=(v,onCh)=> <input className="cellin" type="number" min={scaleMin} max={scaleMax} value={v} readOnly={readOnly}
    onChange={e=>{ if(readOnly) return; const x=e.target.value; if(x==='') return onCh(null); let n=Number(x); if(isNaN(n)) return; n=Math.max(scaleMin,Math.min(scaleMax,n)); onCh(n); }}/>;
  const hdr=(el,i)=> (elementNames&&elementNames[i])?elementNames[i]:el.name;
  return (
    <div className="scroll">
      <table className="grid">
        <thead><tr>
          <th className="pole">Left pole ({scaleMin})</th>
          {elements.map((el,i)=><th key={el.id}>{hdr(el,i)}{el.category?<div className="mini">{el.category}</div>:null}</th>)}
          <th className="pole">Right pole ({scaleMax})</th>
        </tr></thead>
        <tbody>
          {constructs.map(c=>(
            <tr key={c.id} className={selected===c.id?'rowsel':''}>
              <td className="pole" style={{cursor:'pointer'}} onClick={()=>onSel(c.id)}>
                {c.elicited
                  ? <input className="inp inp-sm" style={{minWidth:130}} value={c.left} readOnly={readOnly} onClick={e=>e.stopPropagation()} onChange={e=>onPole(c.id,'left',e.target.value)}/>
                  : c.left}
              </td>
              {elements.map(el=><td key={el.id} onClick={()=>onSel(c.id)}>{inp(val(ratings,c.id,el.id),v=>onRate(c.id,el.id,v))}</td>)}
              <td className="pole">
                {c.elicited
                  ? <span style={{display:'flex',gap:4,alignItems:'center'}}>
                      <input className="inp inp-sm" style={{minWidth:120}} value={c.right} readOnly={readOnly} onChange={e=>onPole(c.id,'right',e.target.value)}/>
                      {!readOnly&&<button className="x" title="Remove" onClick={()=>onRemoveElicited(c.id)}>✕</button>}
                    </span>
                  : c.right}
              </td>
            </tr>
          ))}
          {outcomes.map(oc=>(
            <tr key={oc.id} style={{background:'#f6efe8'}}>
              <td className="pole"><b>{oc.left}</b><div className="mini">{outcomes.length>1?'outcome construct':'overall effectiveness'}</div></td>
              {elements.map(el=><td key={el.id}>{el.supplementary? <span className="mini" title="held-out element — not rated on the outcome construct">—</span> : inp((suppliedRatings[oc.id]&&suppliedRatings[oc.id][el.id]!=null)?suppliedRatings[oc.id][el.id]:'',v=>onRateSupplied(oc.id,el.id,v))}</td>)}
              <td className="pole"><b>{oc.right}</b></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ============================ Interview ====================== */
function GuidedCheck({constructs, elements, ratings, lo, hi, onAddConstruct, onAddElement}){
  const [open,setOpen]=useState(false);
  const tol=Math.max(1,Math.round((hi-lo)*0.12));
  const {elMatch, conMatch}=useMemo(()=>findMatches(constructs, elements, ratings, lo, hi, tol),[JSON.stringify(ratings), constructs.length, elements.length]);
  const total=elMatch.length+conMatch.length;
  const elName=(e)=> e.name||'(unnamed element)';
  const conName=(c)=> (c.left||'?')+' – '+(c.right||'?');
  return (
    <div className="card" style={{borderColor: total?'#e07030':'#dcd7ce'}}>
      <div className="toolbar" style={{marginBottom: open?8:0}}>
        <div className="sec-tag" style={{margin:0}}>Guided check — break the matches {total?('· '+total+' to review'):'· all clear'}</div>
        <div className="grow"/>
        <button className="btn-s btn-sm" onClick={()=>setOpen(o=>!o)}>{open?'Hide':'Show'}</button>
      </div>
      {open && <React.Fragment>
        <p className="field-sub">A good grid discriminates. Where two elements are rated the same by every construct, add a construct that tells them apart; where two constructs rate every element the same, add an element they’d score differently. (Matches within ±{tol} per rating — the PEGASUS “break-match” method.)</p>
        {total===0 && <p className="mini">No matches — every element and construct is currently doing distinct work.</p>}
        {elMatch.length>0 && <div style={{marginBottom:'.5rem'}}>
          <div className="mini" style={{fontWeight:700}}>Elements construed identically — add a construct that separates them:</div>
          {elMatch.slice(0,6).map((m,i)=><div key={i} className="mini">• <b>{elName(m.a)}</b> ≈ <b>{elName(m.b)}</b> (avg gap {m.diff.toFixed(1)})</div>)}
          {onAddConstruct&&<button className="btn-s btn-sm" style={{marginTop:4}} onClick={onAddConstruct}>+ Add construct</button>}
        </div>}
        {conMatch.length>0 && <div>
          <div className="mini" style={{fontWeight:700}}>Constructs that don’t separate the elements — add an element they’d rate differently:</div>
          {conMatch.slice(0,6).map((m,i)=><div key={i} className="mini">• <b>{conName(m.a)}</b> ≈ <b>{conName(m.b)}</b>{m.reversed?' (opposite poles)':''} (avg gap {m.diff.toFixed(1)})</div>)}
          {onAddElement&&<button className="btn-s btn-sm" style={{marginTop:4}} onClick={onAddElement}>+ Add element</button>}
        </div>}
      </React.Fragment>}
    </div>
  );
}
function Interview({config, code, resp, onBack, readOnly, participant}){
  const [name,setName]=useState(resp.participant_name||'');
  const [ratings,setRatings]=useState((resp.data&&resp.data.ratings)||{});
  const outcomes=(config.suppliedConstructs&&config.suppliedConstructs.length)?config.suppliedConstructs:[{id:'supplied',left:config.suppliedLeft||'Preferred',right:config.suppliedRight||'Opposite'}];
  const [suppliedRatings,setSuppliedRatings]=useState(()=>{
    const sr=(resp.data&&resp.data.suppliedRatings)? {...resp.data.suppliedRatings} : {};
    if(resp.data&&resp.data.supplied&&!sr['supplied']) sr['supplied']={...resp.data.supplied};  // migrate legacy single supplied row
    return sr;
  });
  const [quotes,setQuotes]=useState((resp.data&&resp.data.quotes)||{});
  const [elicited,setElicited]=useState((resp.data&&resp.data.elicited)||[]);
  const [elicitedElements,setElicitedElements]=useState((resp.data&&resp.data.elicitedElements)||[]);
  const [noPolarity,setNoPolarity]=useState((resp.data&&resp.data.noPolarity)||{});
  const [status,setStatus]=useState((resp.data&&resp.data.status)||'in_progress');
  const [wave,setWave]=useState((resp.data&&resp.data.wave)||'');
  const cats=config.elementCategories||[];
  const preEls=config.elements||[];
  const gridEls=[...elicitedElements, ...preEls];       // elicited first, then prescribed
  const gridHoney=gridEls.filter(e=>!e.supplementary);
  const prescribed=(config.constructs||[]).map(c=>({...c,elicited:false}));
  const combined=[...prescribed, ...elicited.map(c=>({...c,elicited:true}))];
  const [selected,setSelected]=useState(combined[0]?combined[0].id:null);
  const [saveState,setSaveState]=useState('idle');
  const [triad,setTriad]=useState(null);
  const [triadN,setTriadN]=useState(0);
  const [dyad,setDyad]=useState(null);
  const [elicitMode,setElicitMode]=useState('triad');
  const timer=useRef(null);
  const elementNames=(resp.data&&resp.data.elementNames)||null;

  function scheduleSave(nextStatus){
    if(readOnly) return;
    setSaveState('saving'); clearTimeout(timer.current);
    const snap={ratings,suppliedRatings,supplied:suppliedRatings['supplied']||{},quotes,elicited,elicitedElements,noPolarity,elementNames,wave,status:nextStatus||status};
    timer.current=setTimeout(async()=>{
      try{
        await saveWithRetry({kind:'response',session_code:code,participant_id:resp.participant_id,participant_name:name,
          data:{...snap, completedAt: snap.status==='complete'? new Date().toISOString(): null}});
        setSaveState('saved');
      }catch(e){ setSaveState('error'); alert("We couldn't save right now. Please check your connection and try again."); }
    },300);
  }
  useEffect(()=>{ scheduleSave(); /* eslint-disable-next-line */ },[ratings,suppliedRatings,quotes,elicited,elicitedElements,noPolarity,name,wave]);

  const rate=(cid,eid,v)=> setRatings(p=>({...p,[cid]:{...(p[cid]||{}),[eid]:v}}));
  const rateSup=(oid,eid,v)=> setSuppliedRatings(p=>({...p,[oid]:{...(p[oid]||{}),[eid]:v}}));
  const setQuote=(cid,patch)=> setQuotes(p=>({...p,[cid]:{...(p[cid]||{}),...patch}}));
  // Elicited ELEMENTS (this interview only)
  const addElement=(catShort)=>{ const id=uid(); setElicitedElements(p=>[...p,{id,name:'',category:catShort||'',desc:''}]); };
  const setElement=(id,patch)=> setElicitedElements(p=>p.map(e=>e.id===id?{...e,...patch}:e));
  const removeElement=(id)=>{ setElicitedElements(p=>p.filter(e=>e.id!==id));
    setRatings(p=>{const n={}; Object.keys(p).forEach(k=>{ const row={...p[k]}; delete row[id]; n[k]=row; }); return n;});
    setSuppliedRatings(p=>{const n={}; Object.keys(p).forEach(k=>{ const row={...p[k]}; delete row[id]; n[k]=row; }); return n;});
    if(triad&&triad.some(t=>t.id===id)) setTriad(null);
    if(dyad&&dyad.some(t=>t.id===id)) setDyad(null);
  };
  // Elicited CONSTRUCTS
  const addElicited=()=>{ const id=uid(); setElicited(p=>[...p,{id,left:'',right:'',desc:'',origLeft:'',origRight:''}]); setSelected(id); };
  const setPole=(cid,side,v)=> setElicited(p=>p.map(c=>{ if(c.id!==cid) return c;
    const o={...c,[side]:v};
    if(side==='left'&&o.origLeft===undefined) o.origLeft=c.left;
    if(side==='right'&&o.origRight===undefined) o.origRight=c.right;
    return o; }));
  const setConDesc=(cid,v)=> setElicited(p=>p.map(c=>c.id===cid?{...c,desc:v}:c));
  const togglePolarity=(cid)=> setNoPolarity(p=>{ const n={...p}; if(n[cid]) delete n[cid]; else n[cid]=true; return n; });
  const removeElicited=(cid)=>{ setElicited(p=>p.filter(c=>c.id!==cid)); setRatings(p=>{const n={...p}; delete n[cid]; return n;}); if(selected===cid) setSelected(prescribed[0]?prescribed[0].id:null); };
  // Triad selector (Appendix 9 protocol): random group of three named elements
  function newTriad(){
    const named=elicitedElements.filter(e=>e.name&&e.name.trim());
    if(named.length<3){ setTriad(null); return; }
    const idx=named.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    setTriad(idx.slice(0,3).map(i=>named[i]));
    setTriadN(n=>n+1);
  }
  // Dyadic protocol: a random pair — "how are these two alike or different?"
  function newDyad(){
    const named=elicitedElements.filter(e=>e.name&&e.name.trim());
    if(named.length<2){ setDyad(null); return; }
    const idx=named.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    setDyad(idx.slice(0,2).map(i=>named[i]));
  }

  const total=combined.length*gridHoney.length + outcomes.length*gridHoney.length;
  let filled=0;
  combined.forEach(c=>gridEls.forEach(el=>{ if(ratings[c.id]&&ratings[c.id][el.id]!=null) filled++; }));
  outcomes.forEach(oc=> gridHoney.forEach(el=>{ if(suppliedRatings[oc.id]&&suppliedRatings[oc.id][el.id]!=null) filled++; }));

  const selC=combined.find(c=>c.id===selected), q=(quotes[selected]||{});
  const saveTxt={saving:'saving…',saved:'saved',error:'save error',idle:''}[saveState];
  const namedEls=elicitedElements.filter(e=>e.name&&e.name.trim());

  return (
    <div className="content-wide fade">
      {!participant&&<button className="back-btn" onClick={onBack}>← Dashboard</button>}
      <div className="topbar">
        <div><div className="sec-tag">Interview</div><div className="pg-title" style={{fontSize:'1.3rem'}}>{name||'New interview'}</div></div>
        <div style={{textAlign:'right'}}>
          <div className="mini">{filled}/{total} rated · {saveTxt}</div>
          <span className={"tag "+(status==='complete'?'done':'prog')} style={{marginTop:4,display:'inline-block'}}>{status}</span>
        </div>
      </div>

      {!readOnly&&<div className="help-box"><span className="help-h">Running the interview</span>Three steps: (1) capture the interviewee’s <b>elements</b> — the situations they bring — below; (2) use the <b>triad selector</b> to elicit their <b>constructs</b> (“considering these three, how are two alike and different from the third?”); (3) rate every element on every construct, then rate the elements on the overall effectiveness yardstick. Following the standard repertory-grid interview protocol.<span className="help-tip">Tip: elicit constructs first, rate afterwards. Aim for 6–10 elements and 6–12 constructs — enough to be rich without exhausting the interviewee. The <b>Guided check</b> below the grid tells you if two things aren’t being told apart.</span><span className="help-ref">Ref: Kelly, G. A. (1955) triadic method; Jankowicz, D. (2004) <i>The Easy Guide to Repertory Grids</i> (interview how-to); Fransella, Bell &amp; Bannister (2004), ch. 1–3.</span></div>}

      <div className="card">
        <div className="row" style={{gap:'.6rem',alignItems:'flex-end'}}>
          <div style={{flex:3}}><label className="field-lbl">Interviewee (display name)</label>
            <input className="inp inp-sm" value={name} readOnly={readOnly} onChange={e=>setName(e.target.value)} placeholder="e.g. P1 / initials"/></div>
          <div style={{flex:1}}><label className="field-lbl" title="Timepoint / wave — set the same person’s later interview to a different wave (e.g. Pre / Post) to track change">Wave / timepoint</label>
            <input className="inp inp-sm" value={wave} readOnly={readOnly} onChange={e=>setWave(e.target.value)} placeholder="e.g. Pre"/></div>
        </div>
        <p className="mini" style={{marginTop:'.3rem'}}>Optional. To track change over time, give the same interviewee two interviews with the same display name and different waves (e.g. “Pre” and “Post”).</p>
      </div>

      {/* 1 — Elements */}
      <div className="card">
        <div className="sec-tag">1 · Elements ({elicitedElements.length} elicited{preEls.length?' · '+preEls.length+' prescribed':''})</div>
        <p className="field-sub">The situations this person brings. {cats.length?<span>Ask for {cats.map(c=>(c.target||'?')+' '+c.name).join(' and ')}.</span>:null} Give each a short label (and a description if useful). Prescribed elements are added to every grid automatically.</p>
        {elicitedElements.map(el=>(
          <div key={el.id} style={{borderBottom:'1px solid #ebe7e0',paddingBottom:'.5rem',marginBottom:'.5rem'}}>
            <div className="list-row" style={{border:'none',padding:0}}>
              <input className="inp inp-sm" style={{flex:3}} value={el.name} readOnly={readOnly} placeholder="Situation label" onChange={e=>setElement(el.id,{name:e.target.value})}/>
              {cats.length
                ? <select className="inp inp-sm" style={{width:160,flex:'0 0 auto'}} value={el.category||''} disabled={readOnly} onChange={e=>setElement(el.id,{category:e.target.value})}>
                    <option value="">— category —</option>
                    {cats.map(c=><option key={c.id} value={c.short||c.name}>{c.name}</option>)}
                  </select>
                : <input className="inp inp-sm" style={{width:90,flex:'0 0 auto'}} value={el.category||''} readOnly={readOnly} placeholder="cat" onChange={e=>setElement(el.id,{category:e.target.value})}/>}
              <select className="inp inp-sm" style={{width:96,flex:'0 0 auto'}} value={el.role||''} disabled={readOnly} title="Optional role tag — needed for self–ideal and implicative-dilemma analysis" onChange={e=>setElement(el.id,{role:e.target.value||undefined})}>
                <option value="">— role —</option>
                <option value="self">Self</option>
                <option value="ideal">Ideal</option>
                <option value="other">Other</option>
              </select>
              {!readOnly&&<button className="x" onClick={()=>removeElement(el.id)}>✕</button>}
            </div>
            <input className="inp inp-sm" style={{marginTop:4}} value={el.desc||''} readOnly={readOnly} placeholder="Description (optional)" onChange={e=>setElement(el.id,{desc:e.target.value})}/>
            <div style={{display:'flex',gap:6,marginTop:4,alignItems:'center'}}>
              <input className="inp inp-sm" style={{flex:1}} value={el.img||''} readOnly={readOnly} placeholder="Image URL (optional — e.g. a photo, logo or screenshot)" onChange={e=>setElement(el.id,{img:e.target.value})}/>
              {el.img&&<img src={el.img} alt="" style={{height:40,width:40,objectFit:'cover',borderRadius:4,border:'1px solid #ddd'}} onError={e=>{e.target.style.display='none';}}/>}
            </div>
          </div>
        ))}
        {preEls.map(el=>(<div key={el.id} className="mini" style={{padding:'.2rem 0'}}>• {el.name||'(unnamed prescribed)'} <span className="tag">{el.supplementary?'held-out':'prescribed'}</span></div>))}
        {elicitedElements.length===0&&preEls.length===0&&<p className="mini">No elements yet.</p>}
        {!readOnly&&<div className="btn-row" style={{marginTop:'.4rem'}}>
          {cats.length? cats.map(c=><button key={c.id} className="btn-s btn-sm" onClick={()=>addElement(c.short||c.name)}>+ {c.name}</button>)
            : <button className="btn-s btn-sm" onClick={()=>addElement('')}>+ Add element</button>}
        </div>}
      </div>

      {/* 2 — Construct elicitation (triadic or dyadic) */}
      {!readOnly&&<div className="card">
        <div className="toolbar" style={{marginBottom:6}}>
          <div className="sec-tag" style={{margin:0}}>2 · Elicit constructs</div>
          <div className="grow"/>
          <div className="seg" style={{display:'inline-flex',gap:4}}>
            <button className="btn-s btn-sm" style={elicitMode==='triad'?{borderColor:'#1a1a1a'}:{}} onClick={()=>setElicitMode('triad')}>Triadic</button>
            <button className="btn-s btn-sm" style={elicitMode==='dyad'?{borderColor:'#1a1a1a'}:{}} onClick={()=>setElicitMode('dyad')}>Dyadic</button>
          </div>
        </div>
        {elicitMode==='triad'
          ? (namedEls.length<3
            ? <p className="mini">Add at least three named elements above to elicit constructs by triad.</p>
            : <div>
                {triad
                  ? <div className="inf-box" style={{marginBottom:'.6rem'}}>Considering these three situations, how are <b>two alike and different from the third</b>? <span className="mini">(then give the opposite pole)</span>
                      <div style={{marginTop:'.45rem',display:'flex',gap:'.4rem',flexWrap:'wrap'}}>{triad.map((t,i)=><span key={t.id} className="chip"><b>{String.fromCharCode(65+i)}</b> · {t.name}</span>)}</div></div>
                  : <p className="mini">Click “New triad” for a random group of three, ask the question, then capture the construct.</p>}
                <div className="btn-row">
                  <button className="btn-s btn-sm" onClick={newTriad}>🎲 New triad</button>
                  <button className="btn-s btn-sm" onClick={addElicited}>+ Construct from this triad</button>
                </div>
              </div>)
          : (namedEls.length<2
            ? <p className="mini">Add at least two named elements above to elicit constructs by pairs (dyadic).</p>
            : <div>
                <p className="mini" style={{marginBottom:'.4rem'}}>Dyadic elicitation is a lower-load alternative to triads: show one pair and ask how they compare.</p>
                {dyad
                  ? <div className="inf-box" style={{marginBottom:'.6rem'}}>Thinking about these two situations, <b>how are they alike, or how do they differ</b>? <span className="mini">(name the quality, then its opposite pole)</span>
                      <div style={{marginTop:'.45rem',display:'flex',gap:'.4rem',flexWrap:'wrap'}}>{dyad.map((t,i)=><span key={t.id} className="chip"><b>{String.fromCharCode(65+i)}</b> · {t.name}</span>)}</div></div>
                  : <p className="mini">Click “New pair” for a random two, ask the question, then capture the construct.</p>}
                <div className="btn-row">
                  <button className="btn-s btn-sm" onClick={newDyad}>🎲 New pair</button>
                  <button className="btn-s btn-sm" onClick={addElicited}>+ Construct from this pair</button>
                </div>
              </div>)}
      </div>}

      {/* 3 — Grid */}
      <div className="card">
        <div className="sec-tag">3 · Grid — rate every element</div>
        <p className="field-sub" style={{marginTop:'.2rem'}}>{readOnly?'Viewing a completed grid from the example study — read-only.':<span>Rate each element {config.scaleMin} (left pole) to {config.scaleMax} (right pole). Click a construct to attach a quote or description. The highlighted row is the overall effectiveness yardstick (not rated on held-out elements).</span>}</p>
        {gridEls.length===0
          ? <p className="mini">Add elements above to build the grid.</p>
          : <GridTable elements={gridEls} elementNames={elementNames} constructs={combined}
              scaleMin={config.scaleMin} scaleMax={config.scaleMax} outcomes={outcomes}
              ratings={ratings} suppliedRatings={suppliedRatings} selected={selected}
              onSel={setSelected} onRate={rate} onRateSupplied={rateSup} onPole={setPole} onRemoveElicited={removeElicited} readOnly={readOnly}/>}
        <div className="sp"/>
        {!readOnly&&<button className="btn-s btn-sm" onClick={addElicited}>+ Add construct</button>}
        <span className="mini" style={{marginLeft:8}}>{elicited.length} elicited · {prescribed.length} prescribed constructs</span>
      </div>

      {!readOnly&&gridHoney.length>=2&&combined.length>=2&&
        <GuidedCheck constructs={combined} elements={gridHoney} ratings={ratings} lo={config.scaleMin} hi={config.scaleMax} onAddConstruct={addElicited} onAddElement={()=>addElement('')}/>}

      {selC&&(
        <div className="card">
          <div className="toolbar" style={{marginBottom:6}}>
            <div className="sec-tag" style={{margin:0}}>Construct — {selC.left||'(left pole)'} vs {selC.right||'(right pole)'}</div>
            <div className="grow"/>
            <label className="anon-toggle" title="Flag constructs Honey should skip — e.g. no clear high/low (effective) direction">
              <input type="checkbox" checked={!!noPolarity[selected]} disabled={readOnly} onChange={()=>{ if(!readOnly) togglePolarity(selected); }}/> no clear polarity
            </label>
          </div>
          {selC.elicited && (selC.origLeft&&selC.origLeft!==selC.left || selC.origRight&&selC.origRight!==selC.right) &&
            <p className="mini">Post-transcript edit — originally: “{selC.origLeft||selC.left}” vs “{selC.origRight||selC.right}”.</p>}
          {selC.elicited&&<React.Fragment><label className="field-lbl">Construct description (optional)</label>
            <input className="inp inp-sm" value={selC.desc||''} readOnly={readOnly} onChange={e=>setConDesc(selC.id,e.target.value)} placeholder="What does this construct mean?"/><div className="sp"/></React.Fragment>}
          <label className="field-lbl">Illustrative quote</label>
          <textarea className="inp inp-ta" value={q.text||''} readOnly={readOnly} onChange={e=>setQuote(selected,{text:e.target.value})} placeholder="Illustrative quote…"/>
          <div className="sp"/>
          <input className="inp inp-sm" value={q.ref||''} readOnly={readOnly} onChange={e=>setQuote(selected,{ref:e.target.value})} placeholder="Reference (time / page)"/>
        </div>
      )}

      {!readOnly&&<div className="btn-row"><div className="grow"/><button className="btn-p" onClick={async()=>{
        setStatus('complete');
        if(participant){ const snap={ratings,suppliedRatings,supplied:suppliedRatings['supplied']||{},quotes,elicited,elicitedElements,noPolarity,elementNames,wave,status:'complete'};
          try{ await saveWithRetry({kind:'response',session_code:code,participant_id:resp.participant_id,participant_name:name,data:{...snap,completedAt:new Date().toISOString()}}); }catch(e){}
          onBack&&onBack();
        } else scheduleSave('complete');
      }}>{participant?'Submit my grid':'Mark interview complete'}</button></div>}
    </div>
  );
}

/* ============================ Setup ====================== */
const STUDY_TEMPLATES=[
  {id:'leadership', name:'Leadership effectiveness', apply:{
    title:'Leadership effectiveness', description:'How do people construe effective versus ineffective leadership, and which of their own constructs track effectiveness?',
    scaleMin:1, scaleMax:10,
    elementCategories:[{id:'eff',name:'Effective leader/situation',short:'E',target:3},{id:'ineff',name:'Less effective leader/situation',short:'L',target:3}],
    suppliedConstructs:[{id:'supplied',left:'Highly effective',right:'Not effective at all',desc:'The overall effectiveness yardstick.'}] }},
  {id:'brand', name:'Brand / product perception', apply:{
    title:'Brand perception', description:'How do people tell brands or products apart, and what drives appeal?',
    scaleMin:1, scaleMax:7,
    elementCategories:[{id:'br',name:'Brand / product',short:'B',target:6}],
    suppliedConstructs:[{id:'supplied',left:'Very appealing',right:'Not appealing',desc:'Overall appeal.'}] }},
  {id:'team', name:'Working relationships', apply:{
    title:'Working relationships', description:'How does someone construe the people they work with?',
    scaleMin:1, scaleMax:7,
    elementCategories:[{id:'col',name:'Colleague',short:'C',target:6}],
    suppliedConstructs:[{id:'supplied',left:'Easy to work with',right:'Hard to work with',desc:'Overall working relationship.'}] }},
  {id:'self', name:'Coaching · self & ideal', apply:{
    title:'Self and ideal self', description:'How does someone see themselves now versus their ideal, across their roles and situations?',
    scaleMin:1, scaleMax:7,
    elementCategories:[{id:'role',name:'Role / situation',short:'R',target:5}],
    suppliedConstructs:[{id:'supplied',left:'Like my ideal self',right:'Unlike my ideal self',desc:'Closeness to the ideal self.'}],
    elements:[{id:'self_el',name:'Me now',role:'self'},{id:'ideal_el',name:'My ideal self',role:'ideal'}] }},
];
function Setup({config,setConfig,onSave,saving,savedMsg,readOnly}){
  const c=config, set=(patch)=>setConfig({...c,...patch});
  const cats=c.elementCategories||[];
  const setCat=(id,patch)=>set({elementCategories:cats.map(x=>x.id===id?{...x,...patch}:x)});
  const [tpl,setTpl]=useState('');
  function applyTpl(){
    const t=STUDY_TEMPLATES.find(x=>x.id===tpl); if(!t||readOnly) return;
    if(!window.confirm('Apply the “'+t.name+'” template? It fills in the title, description, scale, element categories and outcome construct'+(t.apply.elements?' (and a self/ideal element pair)':'')+'. Existing interviews are not affected.')) return;
    const a=t.apply, o=(a.suppliedConstructs&&a.suppliedConstructs[0])||{};
    set({...a, suppliedLeft:o.left||'', suppliedRight:o.right||'', suppliedDesc:o.desc||''});
  }
  return (
    <div className="fade">
      {!readOnly&&<div className="help-box"><span className="help-h">Setup · define the study (do this first)</span>Set this up once. Give the study a <b>title</b> and a short <b>description</b>, choose the <b>rating scale</b> (1–10 is common), and define your <b>element categories</b> — the kinds of situation each interviewee brings (for example two categories with a target of three each). The actual elements and constructs are elicited from each person during their interview; shared (prescribed) ones — like the effectiveness yardstick and any “ideal” element — live on the next two tabs. New here? Pick a <b>template</b> or <b>Load example</b> to fill in a generic design you can adapt.</div>}
      {!readOnly&&<div className="card"><div className="toolbar">
        <div className="sec-tag" style={{margin:0}}>Start from a template</div><div className="grow"/>
        <select className="inp inp-sm" style={{width:220}} value={tpl} onChange={e=>setTpl(e.target.value)}>
          <option value="">— choose a starter design —</option>
          {STUDY_TEMPLATES.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <button className="btn-s btn-sm" disabled={!tpl} onClick={applyTpl}>Apply template</button>
      </div><p className="mini" style={{marginTop:'.3rem'}}>Templates are generic starting points — edit everything after applying.</p></div>}
      <div className="card">
        <div className="sec-tag">Study</div>
        <label className="field-lbl">Title</label>
        <input className="inp inp-sm" value={c.title} readOnly={readOnly} onChange={e=>set({title:e.target.value})}/>
        <div className="sp"/>
        <label className="field-lbl">Description</label>
        <textarea className="inp inp-ta" value={c.description||''} readOnly={readOnly} onChange={e=>set({description:e.target.value})} placeholder="What is this study about? What question does it explore?"/>
        <div className="sp"/>
        <div className="row">
          <div><label className="field-lbl">Scale min</label><input className="inp inp-sm" type="number" value={c.scaleMin} readOnly={readOnly} onChange={e=>set({scaleMin:Number(e.target.value)})}/></div>
          <div><label className="field-lbl">Scale max</label><input className="inp inp-sm" type="number" value={c.scaleMax} readOnly={readOnly} onChange={e=>set({scaleMax:Number(e.target.value)})}/></div>
        </div>
      </div>

      <div className="card">
        <div className="sec-tag">Element categories ({cats.length})</div>
        <p className="field-sub">The kinds of situation each interviewee elicits — for example <b>Category A</b> (short A, target 3) and <b>Category B</b> (short B, target 3). “Target” is how many of that kind you ask each person to bring.</p>
        {cats.map(cat=>(
          <div className="list-row" key={cat.id}>
            <input className="inp inp-sm" style={{flex:3}} value={cat.name} readOnly={readOnly} placeholder="e.g. Category A" onChange={e=>setCat(cat.id,{name:e.target.value})}/>
            <input className="inp inp-sm" style={{flex:1,minWidth:60}} value={cat.short||''} readOnly={readOnly} placeholder="SL" onChange={e=>setCat(cat.id,{short:e.target.value})}/>
            <input className="inp inp-sm" style={{width:66,flex:'0 0 auto'}} type="number" value={cat.target==null?'':cat.target} readOnly={readOnly} placeholder="qty" onChange={e=>setCat(cat.id,{target:e.target.value===''?null:Number(e.target.value)})}/>
            {!readOnly&&<button className="x" onClick={()=>set({elementCategories:cats.filter(x=>x.id!==cat.id)})}>✕</button>}
          </div>
        ))}
        {cats.length===0&&<p className="mini">No categories yet — add at least one, or leave empty for an un-categorised study.</p>}
        <div className="sp"/>
        {!readOnly&&<button className="btn-s btn-sm" onClick={()=>set({elementCategories:[...cats,{id:uid(),name:'',short:'',target:3}]})}>+ Add element category</button>}
      </div>

      {!readOnly&&<div className="btn-row">
        <button className="btn-s" onClick={()=>setConfig(freshExample())}>Load example</button>
        <div className="grow"/>
        {savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}
        <button className="btn-p" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save setup'}</button>
      </div>}
    </div>
  );
}

/* ==================== Prescribed constructs ==================== */
function PrescribedConstructs({config,setConfig,onSave,saving,savedMsg,readOnly}){
  const c=config, set=(patch)=>setConfig({...c,...patch});
  const cons=c.constructs||[];
  const setCon=(id,patch)=>set({constructs:cons.map(x=>x.id===id?{...x,...patch}:x)});
  const outcomes=(c.suppliedConstructs&&c.suppliedConstructs.length)?c.suppliedConstructs:[{id:'supplied',left:c.suppliedLeft||'',right:c.suppliedRight||'',desc:c.suppliedDesc||''}];
  const writeOutcomes=(list)=> set({suppliedConstructs:list, suppliedLeft:(list[0]||{}).left||'', suppliedRight:(list[0]||{}).right||'', suppliedDesc:(list[0]||{}).desc||''});
  const setOutcome=(id,patch)=> writeOutcomes(outcomes.map(o=>o.id===id?{...o,...patch}:o));
  const addOutcome=()=> writeOutcomes([...outcomes,{id:uid(),left:'',right:'',desc:''}]);
  const removeOutcome=(id)=> writeOutcomes(outcomes.filter(o=>o.id!==id));
  return (
    <div className="fade">
      {!readOnly&&<div className="help-box"><span className="help-h">Prescribed constructs · shared across every grid</span>Most constructs are <b>elicited</b> from each interviewee (through triads, during the interview). The essential shared ones are the <b>outcome constructs</b> below — the yardstick(s) Honey measures every elicited construct against. Most studies use one (e.g. “highly effective” → “not effective at all”); you can add several (e.g. Challenging, Confident, Aligned, Effective) to get a separate Honey table for each. They appear as highlighted rows in every grid. You can also add other shared prescribed constructs lower down.</div>}
      <div className="card" style={{borderColor:'#e07030'}}>
        <div className="sec-tag" style={{color:'#e07030'}}>Outcome constructs — the Honey yardstick(s) ({outcomes.length})</div>
        <p className="field-sub">Each elicited construct is scored for how closely it tracks these. Add more than one to analyse against several criteria.</p>
        {outcomes.map(o=>(
          <div key={o.id} style={{borderBottom:'1px solid #ebe7e0',paddingBottom:'.6rem',marginBottom:'.6rem'}}>
            <div className="row">
              <div><label className="field-lbl">Preferred pole (= {c.scaleMax})</label><input className="inp inp-sm" value={o.left||''} readOnly={readOnly} onChange={e=>setOutcome(o.id,{left:e.target.value})}/></div>
              <div><label className="field-lbl">Opposite pole (= {c.scaleMin})</label><input className="inp inp-sm" value={o.right||''} readOnly={readOnly} onChange={e=>setOutcome(o.id,{right:e.target.value})}/></div>
            </div>
            <div style={{display:'flex',gap:6,marginTop:4,alignItems:'center'}}>
              <input className="inp inp-sm" style={{flex:1}} value={o.desc||''} readOnly={readOnly} placeholder="Description (optional)" onChange={e=>setOutcome(o.id,{desc:e.target.value})}/>
              {!readOnly&&outcomes.length>1&&<button className="x" title="Remove outcome" onClick={()=>removeOutcome(o.id)}>✕</button>}
            </div>
          </div>
        ))}
        {!readOnly&&<button className="btn-s btn-sm" onClick={addOutcome}>+ Add outcome construct</button>}
      </div>

      <div className="card">
        <div className="sec-tag">Other prescribed constructs ({cons.length})</div>
        {cons.map(x=>(
          <div key={x.id} style={{borderBottom:'1px solid #ebe7e0',paddingBottom:'.6rem',marginBottom:'.6rem'}}>
            <div className="list-row" style={{border:'none',padding:0}}>
              <input className="inp inp-sm" style={{flex:2}} value={x.left} readOnly={readOnly} placeholder="Left pole" onChange={e=>setCon(x.id,{left:e.target.value})}/>
              <span className="mini">vs</span>
              <input className="inp inp-sm" style={{flex:2}} value={x.right} readOnly={readOnly} placeholder="Right pole" onChange={e=>setCon(x.id,{right:e.target.value})}/>
              {!readOnly&&<button className="x" onClick={()=>set({constructs:cons.filter(y=>y.id!==x.id)})}>✕</button>}
            </div>
            <input className="inp inp-sm" style={{marginTop:4}} value={x.desc||''} readOnly={readOnly} placeholder="Description (optional)" onChange={e=>setCon(x.id,{desc:e.target.value})}/>
          </div>
        ))}
        {cons.length===0&&<p className="mini">None. If all your constructs are elicited from interviewees, leave this empty.</p>}
        <div className="sp"/>
        {!readOnly&&<button className="btn-s btn-sm" onClick={()=>set({constructs:[...cons,{id:uid(),left:'',right:'',desc:''}]})}>+ Add prescribed construct</button>}
      </div>
      {!readOnly&&<div className="btn-row"><div className="grow"/>{savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}<button className="btn-p" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save'}</button></div>}
    </div>
  );
}

/* ==================== Prescribed elements ==================== */
function PrescribedElements({config,setConfig,onSave,saving,savedMsg,readOnly}){
  const c=config, set=(patch)=>setConfig({...c,...patch});
  const els=c.elements||[];
  const setEl=(id,patch)=>set({elements:els.map(e=>e.id===id?{...e,...patch}:e)});
  return (
    <div className="fade">
      {!readOnly&&<div className="help-box"><span className="help-h">Prescribed elements · shared in every grid</span>Most elements are <b>elicited</b> — each interviewee brings their own (captured at the start of their interview). <b>Prescribed</b> elements are shared across everyone. A common use is a single <b>“ideal”</b> element, tagged <b>held-out</b> so constructs are rated on it but it’s excluded from the effectiveness comparison. Add shared elements only if every interviewee should rate the same fixed situation.</div>}
      <div className="card">
        <div className="sec-tag">Prescribed elements ({els.length})</div>
        {els.map(el=>(
          <div key={el.id} style={{borderBottom:'1px solid #ebe7e0',paddingBottom:'.6rem',marginBottom:'.6rem'}}>
            <div className="list-row" style={{border:'none',padding:0}}>
              <input className="inp inp-sm" style={{flex:3}} value={el.name} readOnly={readOnly} placeholder="e.g. An ideal example" onChange={e=>setEl(el.id,{name:e.target.value})}/>
              <input className="inp inp-sm" style={{flex:1,minWidth:60}} value={el.category||''} readOnly={readOnly} placeholder="cat" onChange={e=>setEl(el.id,{category:e.target.value})}/>
              <label className="anon-toggle" title="Rated in the grid, but held out of the Honey similarity calculation">
                <input type="checkbox" checked={!!el.supplementary} disabled={readOnly} onChange={e=>setEl(el.id,{supplementary:e.target.checked})}/> held-out
              </label>
              {!readOnly&&<button className="x" onClick={()=>set({elements:els.filter(x=>x.id!==el.id)})}>✕</button>}
            </div>
            <input className="inp inp-sm" style={{marginTop:4}} value={el.desc||''} readOnly={readOnly} placeholder="Description (optional)" onChange={e=>setEl(el.id,{desc:e.target.value})}/>
          </div>
        ))}
        {els.length===0&&<p className="mini">None yet. A common one is a single “ideal” element, held-out.</p>}
        <div className="sp"/>
        {!readOnly&&<button className="btn-s btn-sm" onClick={()=>set({elements:[...els,{id:uid(),name:'',category:'',desc:'',supplementary:true}]})}>+ Add prescribed element</button>}
      </div>
      {!readOnly&&<div className="btn-row"><div className="grow"/>{savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}<button className="btn-p" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save'}</button></div>}
    </div>
  );
}

/* ==================== All elements (master list) ==================== */
function AllElements({config,setConfig,onSaveConfig,responses,onSaveResponse,readOnly}){
  const pre=(config.elements||[]);
  const [elic,setElic]=useState({});
  const [dirty,setDirty]=useState(false);
  useEffect(()=>{ const m={}; responses.forEach(r=>{ m[r.participant_id]=((r.data&&r.data.elicitedElements)||[]).map(e=>({...e})); }); setElic(m); setDirty(false); },[responses]);
  const setPre=(id,patch)=>{ setConfig({...config, elements: pre.map(e=>e.id===id?{...e,...patch}:e)}); setDirty(true); };
  const setEl=(pid,id,patch)=>{ setElic(m=>({...m,[pid]:(m[pid]||[]).map(e=>e.id===id?{...e,...patch}:e)})); setDirty(true); };
  async function saveAll(){
    if(onSaveConfig) await onSaveConfig();
    for(const r of responses){ const nd={...r.data, elicitedElements: elic[r.participant_id]||((r.data&&r.data.elicitedElements)||[]) }; await onSaveResponse({...r, data:nd}); }
  }
  const totalElic=Object.values(elic).reduce((s,a)=>s+a.length,0);
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">All elements</span>Every element in the study in one place — the shared <b>prescribed</b> elements plus every <b>elicited</b> element each interviewee brought, tagged with the interview it came from and its category. Edit a name, category or description here and press <b>Save changes</b>. Elicited elements belong to a single interview; prescribed ones appear in all.</div>
      <div className="card"><div className="scroll"><table className="grid" style={{fontSize:'.78rem'}}>
        <thead><tr><th className="pole">Element</th><th style={{width:64}}>Cat</th><th style={{width:76}}>Type</th><th className="pole">Interview</th><th className="pole">Description</th></tr></thead>
        <tbody>
          {pre.map(e=>(
            <tr key={e.id}>
              <td className="pole"><input className="inp inp-sm" value={e.name||''} readOnly={readOnly} onChange={ev=>setPre(e.id,{name:ev.target.value})}/></td>
              <td><input className="inp inp-sm" style={{width:52}} value={e.category||''} readOnly={readOnly} onChange={ev=>setPre(e.id,{category:ev.target.value})}/></td>
              <td><span className="tag">{e.supplementary?'held-out':'shared'}</span></td>
              <td className="pole muted">all</td>
              <td className="pole"><input className="inp inp-sm" value={e.desc||''} readOnly={readOnly} onChange={ev=>setPre(e.id,{desc:ev.target.value})}/></td>
            </tr>
          ))}
          {responses.map(r=> (elic[r.participant_id]||[]).map(e=>(
            <tr key={r.participant_id+e.id}>
              <td className="pole"><input className="inp inp-sm" value={e.name||''} readOnly={readOnly} onChange={ev=>setEl(r.participant_id,e.id,{name:ev.target.value})}/></td>
              <td><input className="inp inp-sm" style={{width:52}} value={e.category||''} readOnly={readOnly} onChange={ev=>setEl(r.participant_id,e.id,{category:ev.target.value})}/></td>
              <td><span className="tag prog">elicited</span></td>
