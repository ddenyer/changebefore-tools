<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================ Honey engine (verified) ====================== */
function sumAbsDiff(a, b){
  let sum=0,n=0; const len=Math.min(a.length,b.length);
  for(let i=0;i<len;i++){ if(a[i]==null||b[i]==null) continue; sum+=Math.abs(a[i]-b[i]); n++; }
  return {sum,n};
}
function similarity(c,s,lo,hi){ const {sum,n}=sumAbsDiff(c,s); if(!n) return 0; return 1-(2*sum)/(n*(hi-lo)); }
function reverseRatings(r,lo,hi){ return r.map(x=> x==null?null:(hi+lo-x)); }
function analyseGrid(constructs, supplied, lo, hi){
  const rev=reverseRatings(supplied,lo,hi);
  const scored=constructs.map(c=>{
    const a=similarity(c.ratings,supplied,lo,hi), b=similarity(c.ratings,rev,lo,hi);
    return {c, simAligned:a, simReversed:b, orientation:a>=b?'aligned':'reversed', similarity:Math.max(a,b)};
  });
  const sims=scored.map(s=>s.similarity);
  const min=sims.length?Math.min.apply(null,sims):0, max=sims.length?Math.max.apply(null,sims):0;
  const width=(max-min)/3, high=max-width, low=high-width;
  const order=[...scored].sort((x,y)=>y.similarity-x.similarity);
  const rank={}; order.forEach((s,i)=>rank[s.c.id]=i+1);
  const results=scored.map(s=>({
    id:s.c.id,left:s.c.left,right:s.c.right,
    simAligned:s.simAligned,simReversed:s.simReversed,similarity:s.similarity,
    orientation:s.orientation,rank:rank[s.c.id],
    band:s.similarity>high?'H':(s.similarity<low?'L':'I')
  }));
  return {results, bands:{min,max,width,high,low}};
}
const STOP=new Set(['the','and','vs','not','with','for','was','very','from','into']);
function tokens(s){ return new Set((s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w))); }
function jaccard(a,b){ if(!a.size&&!b.size) return 0; let i=0; a.forEach(t=>{if(b.has(t))i++}); return i/(a.size+b.size-i); }
function suggestGroups(items, threshold){
  threshold=threshold||0.34;
  const toks=items.map(it=>tokens(it.text)), parent=items.map((_,i)=>i);
  const find=x=> parent[x]===x?x:(parent[x]=find(parent[x]));
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++) if(jaccard(toks[i],toks[j])>=threshold) parent[find(i)]=find(j);
  const groups={}; items.forEach((it,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(it); });
  return Object.values(groups).sort((a,b)=>b.length-a.length);
}

/* ====== Composite (content-analysis) helpers — James/Jankowicz step ====== */
function pnumOf(name){ const m=String(name||'').match(/\d+/); return m?m[0]:'?'; }
// James's preference labels from the preferred-pole mean similarity %.
function prefLabel(left){
  if(left>=70) return 'Strong preference';
  if(left>=58) return 'Moderate preference';
  if(left>=54) return 'Slight preference';
  if(left>=46) return 'Balanced preference';
  if(left>=42) return 'Slight (opposite)';
  return 'Preference (opposite)';
}
// One row per (participant, construct). Honey metrics over an element subset
// (all, or a category e.g. SL / TL). leftAlignPct = how strongly the construct's
// LEFT pole (as recorded) associates with the supplied effectiveness construct.
// band = individual Honey H/I/L, per-participant tercile over the same subset.
// Elements used for Honey. Supplementary elements (e.g. a supplied "future"
// element) are rated and displayed but held OUT of the similarity calculation.
function honeyElements(config, filterCat){
  return (config.elements||[]).filter(e=> !e.supplementary && (!filterCat || e.category===filterCat));
}
// Elements in play for ONE response = prescribed (shared) elements + that
// interview's own elicited elements. Supplementary elements (e.g. the prescribed
// "Future NHS Leadership") are held out of the Honey similarity. filterCat limits
// to an element category (e.g. SL / TL) for the System / Traditional Honey tables.
function elementsFor(config, response, filterCat){
  const eli=((response&&response.data&&response.data.elicitedElements)||[]).filter(e=> !e.supplementary && (!filterCat || e.category===filterCat));
  const pre=(config.elements||[]).filter(e=> !e.supplementary && (!filterCat || e.category===filterCat));
  return [...eli, ...pre];
}
// All elements shown in a grid (elicited first, then prescribed), INCLUDING
// supplementary — for display/export. Honey uses elementsFor (supplementary out).
function gridElementsFor(config, response){
  const eli=((response&&response.data&&response.data.elicitedElements)||[]);
  const pre=(config.elements||[]);
  return [...eli, ...pre];
}
// refId chooses the reference (effectiveness) construct every elicited construct
// is measured against. Default (null/'supplied') = the overall yardstick rated in
// the "supplied" row. Passing a prescribed construct id lets you produce a
// composite table against a DIFFERENT criterion (James's "varying levels of
// effectiveness") — that construct is then excluded from the pooled members.
function pooledMembers(responses, config, filterCat, refId){
  const lo=config.scaleMin, hi=config.scaleMax;
  const useRef = refId && refId!=='supplied';
  const rows=[];
  responses.forEach(r=>{
    const elIds=elementsFor(config, r, filterCat).map(e=>e.id);
    const d=r.data||{}; const ratings=d.ratings||{}; const supplied=d.supplied||{}; const noPol=d.noPolarity||{};
    const refMap = useRef ? (ratings[refId]||{}) : supplied;
    const sSub=elIds.map(e=> refMap[e]!=null?refMap[e]:null);
    if(!elIds.length || sSub.every(v=>v==null)) return;
    const sRev=reverseRatings(sSub,lo,hi);
    const cons=[...config.constructs, ...(d.elicited||[])].filter(c=> !noPol[c.id] && c.id!==refId);  // no-clear-polarity and the reference construct excluded
    const scored=cons.map(c=>{
      const cArr=elIds.map(e=> (ratings[c.id]&&ratings[c.id][e]!=null)?ratings[c.id][e]:null);
      if(cArr.every(v=>v==null)) return null;
      const aL=similarity(cArr,sSub,lo,hi), aR=similarity(cArr,sRev,lo,hi);
      return {c, aL, aR, sim:Math.max(aL,aR), orient:aL>=aR?'left':'right'};
    }).filter(Boolean);
    if(!scored.length) return;
    const sims=scored.map(s=>s.sim); const mn=Math.min.apply(null,sims), mx=Math.max.apply(null,sims);
    const w=(mx-mn)/3, hiT=mx-w, loT=hiT-w;
    scored.forEach(s=>{
      rows.push({
        key:r.participant_id+':'+s.c.id, participant:r.participant_name||r.participant_id,
        pnum:pnumOf(r.participant_name), left:s.c.left, right:s.c.right,
        leftAlignPct:(s.aL+1)/2*100, rightAlignPct:(s.aR+1)/2*100,
        effLabel: s.orient==='left'? s.c.left : s.c.right,
        band: s.sim>hiT?'H':(s.sim<loT?'L':'I')
      });
    });
  });
  return rows;
}
function totalParticipants(members){ return new Set(members.map(m=>m.participant)).size; }
// Fixed effective-pole orientation per construct, from the all-elements pass.
function fixedOrientOf(membersAll){ const o={}; membersAll.forEach(m=>{ o[m.key]=m.leftAlignPct>=m.rightAlignPct?'left':'right'; }); return o; }
// Aggregate members into composite constructs (Honey Content Table rows). The
// effective pole is fixed (fixedOrient) so its alignment can rise/fall by subset.
// Members of a category — a construct may be assigned to a PRIMARY and an
// optional SECONDARY composite (James's "Complex Construct"), so it can count
// toward two categories.
function membersOf(members, assignments, catId){
  const out=[];
  members.forEach(m=>{
    const a=assignments[m.key]; if(!a) return;
    if(a.cat===catId) out.push({m, flip:a.flip, role:'primary'});
    else if(a.cat2===catId) out.push({m, flip:a.flip2, role:'secondary'});
  });
  return out;
}
function compositeRows(members, categories, assignments, totalP, fixedOrient){
  return categories.map(cat=>{
    const mem=membersOf(members, assignments, cat.id);
    const n=mem.length; let sum=0,H=0,I=0,L=0; const parts=new Set();
    mem.forEach(({m,flip})=>{
      const side=(fixedOrient&&fixedOrient[m.key])||(m.leftAlignPct>=m.rightAlignPct?'left':'right');
      const posAlign= side==='left'? m.leftAlignPct : m.rightAlignPct;
      sum += flip? (100-posAlign) : posAlign;
      parts.add(m.participant);
      if(m.band==='H')H++; else if(m.band==='L')L++; else I++;
    });
    const left=n?sum/n:0;
    return {cat, n, uniq:parts.size, uniquePct: totalP? parts.size/totalP*100:0,
      left, right:100-left, pref: n?prefLabel(left):'—',
      H:n?H/n*100:0, I:n?I/n*100:0, L:n?L/n*100:0};
  });
}
function autoFlip(effLabel, cat){
  return jaccard(tokens(effLabel), tokens(cat.right)) > jaccard(tokens(effLabel), tokens(cat.left));
}
// Cohen's kappa for a pair of coders.
function cohen(A,B){
  const keys=Object.keys(A).filter(k=>B[k]); const n=keys.length;
  if(!n) return {n:0,po:0,kappa:0};
  let match=0; const cA={},cB={};
  keys.forEach(k=>{ const a=A[k].cat,b=B[k].cat; cA[a]=(cA[a]||0)+1; cB[b]=(cB[b]||0)+1; if(a===b)match++; });
  const po=match/n; let pe=0;
  Object.keys(cA).forEach(c=>{ if(cB[c]) pe+=(cA[c]/n)*(cB[c]/n); });
  return {n, po, kappa: pe===1?1:(po-pe)/(1-pe)};
}
// Fleiss' kappa for m>2 coders over items all of them coded.
function fleiss(sets){
  const m=sets.length; if(m<2) return {n:0,po:0,kappa:0};
  const keys=Object.keys(sets[0]).filter(k=>sets.every(s=>s[k]));
  const N=keys.length; if(!N) return {n:0,po:0,kappa:0};
  const catSet=new Set(); keys.forEach(k=>sets.forEach(s=>catSet.add(s[k].cat)));
  const cats=[...catSet];
  let Pbar=0; const colTot={};
  keys.forEach(k=>{
    const cnt={}; sets.forEach(s=>{ const c=s[k].cat; cnt[c]=(cnt[c]||0)+1; colTot[c]=(colTot[c]||0)+1; });
    let sq=0; cats.forEach(c=>{ const v=cnt[c]||0; sq+=v*v; });
    Pbar += (sq-m)/(m*(m-1));
  });
  Pbar/=N;
  let Pe=0; cats.forEach(c=>{ const p=(colTot[c]||0)/(N*m); Pe+=p*p; });
  return {n:N, po:Pbar, kappa: Pe===1?1:(Pbar-Pe)/(1-Pe)};
}
// Overall stats across any number of coder sets, plus the disagreeing items.
function multiStats(sets){
  const m=sets.length;
  if(m<2) return null;
  const keys=Object.keys(sets[0]).filter(k=>sets.every(s=>s[k]));
  const disagree=keys.filter(k=>!sets.every(s=>s[k].cat===sets[0][k].cat));
  const unanimous=keys.length-disagree.length;
  const stat = m===2? cohen(sets[0],sets[1]) : fleiss(sets);
  return {n:keys.length, unanimous, disagree, kappa:stat.kappa,
    po: keys.length? unanimous/keys.length : 0, kind: m===2?'Cohen’s κ':'Fleiss’ κ'};
}
// Majority pick for an item across coder sets (null if tied).
function majorityPick(sets,key){
  const cnt={}; sets.forEach(s=>{ if(s[key]){ const c=s[key].cat; cnt[c]=(cnt[c]||0)+1; } });
  const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  if(!e.length) return null;
  if(e.length>1 && e[0][1]===e[1][1]) return null;
  const winner=e[0][0];
  const src=sets.find(s=>s[key]&&s[key].cat===winner);
  return {cat:winner, flip:src[key].flip, votes:e[0][1]};
}

/* ================= Grid maps: variability, FOCUS cluster, PCA biplot ========= */
// Mean of a numeric array (nulls ignored).
function amean(a){ let s=0,n=0; a.forEach(v=>{ if(v!=null){s+=v;n++;} }); return n?s/n:0; }
// Average Normal Variability: mean, across constructs, of each construct's SD of
// element ratings expressed as % of the maximum possible SD on the scale.
// (Transparent measure of how much the grid's constructs discriminate elements.)
function averageVariability(M, lo, hi){
  if(!M.length) return 0;
  const maxSD=(hi-lo)/2;
  let tot=0,k=0;
  M.forEach(row=>{
    const vals=row.filter(v=>v!=null); if(vals.length<2) return;
    const mu=amean(vals); const varc=vals.reduce((a,v)=>a+(v-mu)*(v-mu),0)/vals.length;
    tot += (Math.sqrt(varc)/maxSD)*100; k++;
  });
  return k? tot/k : 0;
}
// Jacobi eigen-decomposition of a small symmetric matrix -> {values, vectors(cols)}.
function jacobiEigen(A){
  const n=A.length; let a=A.map(r=>r.slice());
  let v=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let sweep=0;sweep<100;sweep++){
    let off=0; for(let p=0;p<n;p++)for(let q=p+1;q<n;q++)off+=a[p][q]*a[p][q];
    if(off<1e-12) break;
    for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){
      if(Math.abs(a[p][q])<1e-14) continue;
      const th=(a[q][q]-a[p][p])/(2*a[p][q]);
      const t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1));
      const c=1/Math.sqrt(t*t+1), s=t*c;
      for(let i=0;i<n;i++){ const aip=a[i][p],aiq=a[i][q]; a[i][p]=c*aip-s*aiq; a[i][q]=s*aip+c*aiq; }
      for(let i=0;i<n;i++){ const api=a[p][i],aqi=a[q][i]; a[p][i]=c*api-s*aqi; a[q][i]=s*api+c*aqi; }
      for(let i=0;i<n;i++){ const vip=v[i][p],viq=v[i][q]; v[i][p]=c*vip-s*viq; v[i][q]=s*vip+c*viq; }
    }
  }
  const vals=a.map((r,i)=>r[i]);
  const idx=vals.map((val,i)=>[val,i]).sort((x,y)=>y[0]-x[0]);
  return { values: idx.map(x=>x[0]), vectors: idx.map(x=> v.map(r=>r[x[1]])) }; // vectors[k] = kth eigenvector
}
// PrinGrid / Slater-style biplot from a constructs x elements matrix (row-centred).
function pcaBiplot(M, lo, hi){
  const R=M.length, E=M[0]?M[0].length:0; if(!R||!E) return null;
  // mean-impute + centre each construct on its own mean
  const G=M.map(row=>{ const mu=amean(row); return row.map(v=> (v==null?mu:v)-mu); });
  // element-element covariance (E x E)
  const C=Array.from({length:E},()=>new Array(E).fill(0));
  for(let i=0;i<E;i++)for(let j=0;j<E;j++){ let s=0; for(let r=0;r<R;r++) s+=G[r][i]*G[r][j]; C[i][j]=s/(R||1); }
  const {values,vectors}=jacobiEigen(C);
  const total=values.reduce((a,b)=>a+Math.max(b,0),0)||1;
  const pc=[0,1].map(k=>({ ev:vectors[k], lambda:Math.max(values[k],0), pct:Math.max(values[k],0)/total*100 }));
  const elem=[]; for(let i=0;i<E;i++) elem.push([ pc[0].ev[i]*Math.sqrt(pc[0].lambda), pc[1].ev[i]*Math.sqrt(pc[1].lambda) ]);
  const con=G.map(row=>[0,1].map(k=>{ let s=0; for(let i=0;i<E;i++) s+=row[i]*pc[k].ev[i]; return pc[k].lambda>1e-9? s/Math.sqrt(pc[k].lambda):0; }));
  return { elem, con, pct:[pc[0].pct,pc[1].pct] };
}
// FOCUS single-linkage ordering of rows of a similarity matrix.
function focusOrder(sim){
  const n=sim.length; if(!n) return [];
  let cl=Array.from({length:n},(_,i)=>[i]);
  const link=(x,y)=>{ let b=-Infinity; x.forEach(i=>y.forEach(j=>{ if(sim[i][j]>b)b=sim[i][j]; })); return b; };
  while(cl.length>1){ let bi=0,bj=1,best=-Infinity;
    for(let i=0;i<cl.length;i++)for(let j=i+1;j<cl.length;j++){ const l=link(cl[i],cl[j]); if(l>best){best=l;bi=i;bj=j;} }
    const merged=[...cl[bi],...cl[bj]]; cl=cl.filter((_,k)=>k!==bi&&k!==bj); cl.push(merged);
  }
  return cl[0];
}
function simMatrix(rows, range){
  const n=rows.length; const m=Array.from({length:n},()=>new Array(n).fill(1));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    let s=0,c=0; for(let k=0;k<rows[i].length;k++){ if(rows[i][k]!=null&&rows[j][k]!=null){ s+=Math.abs(rows[i][k]-rows[j][k]); c++; } }
    const v=c? 1-s/(c*range):0; m[i][j]=v; m[j][i]=v;
  }
  return m;
}

const uid=()=> (crypto.randomUUID? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now());
function downloadCsv(rows, filename){
  const esc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=rows.map(r=>r.map(esc).join(',')).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}
const slug=(s)=>String(s||'rep-grid').replace(/[^\w]+/g,'_').slice(0,50);
async function api(path, body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function saveWithRetry(body){
  const backoff=[0,508,2010]; let ok=false, err;
  for(let a=0;a<3&&!ok;a++){
    try{ await api('/api/rep-grid-save', body); ok=true; }
    catch(e){ err=e; await new Promise(r=>setTimeout(r,backoff[a])); }
  }
  if(!ok) throw err||new Error('save failed');
}

        <div className="sec-tag">A 2-minute primer — what is a repertory grid?</div>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.9rem'}}>
          A <b>repertory grid</b> is a structured interview that captures how a person makes sense of a topic <i>in their own words</i>, instead of forcing them into your categories. It comes from personal construct psychology (George Kelly, 1955) and is widely used in leadership, education and management research.
        </p>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.9rem',marginTop:'.55rem'}}>An interview has four moving parts:</p>
        <ul className="primer-list">
          <li><b>Elements</b> — the things being compared (for example, leaders, teams or situations the person knows well).</li>
          <li><b>Constructs</b> — the two-ended descriptions a person uses to tell elements apart (for example, “listens” vs “dictates”). You can prescribe some in advance; others come out during the interview (these are called <i>elicited</i> constructs).</li>
          <li><b>Ratings</b> — the person scores every element on every construct along a scale (for example, 1 to 10).</li>
          <li><b>Supplied construct</b> — one overall yardstick you give everyone (for example, “highly effective” vs “not effective at all”). Everything else is measured against it.</li>

        </p>
        <p className="land-desc" style={{maxWidth:'none',fontSize:'.86rem',marginTop:'.7rem',color:'#888'}}>The tool walks you through it in five stages:</p>

          <span className="stp">2 · Composite constructs</span><span className="arw">→</span>
          <span className="stp">3 · Composite table</span>
        </div>
      </div>
    </div>
  );
}

// constructs: array of {id,left,right,elicited?}. Elicited rows have editable poles.
function GridTable({elements, elementNames, constructs, scaleMin, scaleMax, suppliedLeft, suppliedRight,
                    ratings, supplied, selected, onSel, onRate, onRateSupplied, onPole, onRemoveElicited, readOnly}){
  const val=(m,cid,eid)=> (m[cid]&&m[cid][eid]!=null)?m[cid][eid]:'';
  const inp=(v,onCh)=> <input className="cellin" type="number" min={scaleMin} max={scaleMax} value={v} readOnly={readOnly}
    onChange={e=>{ if(readOnly) return; const x=e.target.value; if(x==='') return onCh(null); let n=Number(x); if(isNaN(n)) return; n=Math.max(scaleMin,Math.min(scaleMax,n)); onCh(n); }}/>;
  const hdr=(el,i)=> (elementNames&&elementNames[i])?elementNames[i]:el.name;
  return (
    <div className="scroll">
      <table className="grid">
        <thead><tr>
          <th className="pole">Left pole ({scaleMin})</th>
          {elements.map((el,i)=><th key={el.id}>{hdr(el,i)}{el.category?<div className="mini">{el.category}</div>:null}</th>)}
          <th className="pole">Right pole ({scaleMax})</th>
        </tr></thead>
        <tbody>
          {constructs.map(c=>(
            <tr key={c.id} className={selected===c.id?'rowsel':''}>
              <td className="pole" style={{cursor:'pointer'}} onClick={()=>onSel(c.id)}>
                {c.elicited
                  ? <input className="inp inp-sm" style={{minWidth:130}} value={c.left} readOnly={readOnly} onClick={e=>e.stopPropagation()} onChange={e=>onPole(c.id,'left',e.target.value)}/>
                  : c.left}
              </td>
              {elements.map(el=><td key={el.id} onClick={()=>onSel(c.id)}>{inp(val(ratings,c.id,el.id),v=>onRate(c.id,el.id,v))}</td>)}
              <td className="pole">
                {c.elicited
                  ? <span style={{display:'flex',gap:4,alignItems:'center'}}>
                      <input className="inp inp-sm" style={{minWidth:120}} value={c.right} readOnly={readOnly} onChange={e=>onPole(c.id,'right',e.target.value)}/>
                      {!readOnly&&<button className="x" title="Remove" onClick={()=>onRemoveElicited(c.id)}>✕</button>}
                    </span>
                  : c.right}
              </td>
            </tr>
          ))}
          <tr style={{background:'#f6efe8'}}>
            <td className="pole"><b>{suppliedLeft}</b><div className="mini">overall effectiveness</div></td>
            {elements.map(el=><td key={el.id}>{el.supplementary? <span className="mini" title="held-out element — not rated on the effectiveness yardstick">—</span> : inp((supplied&&supplied[el.id]!=null)?supplied[el.id]:'',v=>onRateSupplied(el.id,v))}</td>)}
            <td className="pole"><b>{suppliedRight}</b></td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

function Interview({config, code, resp, onBack, readOnly}){
  const [name,setName]=useState(resp.participant_name||'');
  const [ratings,setRatings]=useState((resp.data&&resp.data.ratings)||{});
  const [supplied,setSupplied]=useState((resp.data&&resp.data.supplied)||{});
  const [quotes,setQuotes]=useState((resp.data&&resp.data.quotes)||{});
  const [elicited,setElicited]=useState((resp.data&&resp.data.elicited)||[]);
  const [elicitedElements,setElicitedElements]=useState((resp.data&&resp.data.elicitedElements)||[]);
  const [noPolarity,setNoPolarity]=useState((resp.data&&resp.data.noPolarity)||{});
  const [status,setStatus]=useState((resp.data&&resp.data.status)||'in_progress');
  const cats=config.elementCategories||[];
  const preEls=config.elements||[];
  const gridEls=[...elicitedElements, ...preEls];       // elicited first, then prescribed
  const gridHoney=gridEls.filter(e=>!e.supplementary);
  const prescribed=(config.constructs||[]).map(c=>({...c,elicited:false}));
  const combined=[...prescribed, ...elicited.map(c=>({...c,elicited:true}))];
  const [selected,setSelected]=useState(combined[0]?combined[0].id:null);
  const [saveState,setSaveState]=useState('idle');
  const [triad,setTriad]=useState(null);
  const [triadN,setTriadN]=useState(0);
  const timer=useRef(null);
  const elementNames=(resp.data&&resp.data.elementNames)||null;

  function scheduleSave(nextStatus){
    if(readOnly) return;
    setSaveState('saving'); clearTimeout(timer.current);
    const snap={ratings,supplied,quotes,elicited,elicitedElements,noPolarity,elementNames,status:nextStatus||status};
    timer.current=setTimeout(async()=>{
      try{
        await saveWithRetry({kind:'response',session_code:code,participant_id:resp.participant_id,participant_name:name,
          data:{...snap, completedAt: snap.status==='complete'? new Date().toISOString(): null}});
        setSaveState('saved');
      }catch(e){ setSaveState('error'); alert("We couldn't save right now. Please check your connection and try again."); }
    },300);
  }
  useEffect(()=>{ scheduleSave(); /* eslint-disable-next-line */ },[ratings,supplied,quotes,elicited,elicitedElements,noPolarity,name]);

  const rate=(cid,eid,v)=> setRatings(p=>({...p,[cid]:{...(p[cid]||{}),[eid]:v}}));
  const rateSup=(eid,v)=> setSupplied(p=>({...p,[eid]:v}));
  const setQuote=(cid,patch)=> setQuotes(p=>({...p,[cid]:{...(p[cid]||{}),...patch}}));
  // Elicited ELEMENTS (this interview only)
  const addElement=(catShort)=>{ const id=uid(); setElicitedElements(p=>[...p,{id,name:'',category:catShort||'',desc:''}]); };
  const setElement=(id,patch)=> setElicitedElements(p=>p.map(e=>e.id===id?{...e,...patch}:e));
  const removeElement=(id)=>{ setElicitedElements(p=>p.filter(e=>e.id!==id));
    setRatings(p=>{const n={}; Object.keys(p).forEach(k=>{ const row={...p[k]}; delete row[id]; n[k]=row; }); return n;});
    setSupplied(p=>{const n={...p}; delete n[id]; return n;});
    if(triad&&triad.some(t=>t.id===id)) setTriad(null);
  };
  // Elicited CONSTRUCTS
  const addElicited=()=>{ const id=uid(); setElicited(p=>[...p,{id,left:'',right:'',desc:'',origLeft:'',origRight:''}]); setSelected(id); };
  const setPole=(cid,side,v)=> setElicited(p=>p.map(c=>{ if(c.id!==cid) return c;
    const o={...c,[side]:v};
    if(side==='left'&&o.origLeft===undefined) o.origLeft=c.left;
    if(side==='right'&&o.origRight===undefined) o.origRight=c.right;
    return o; }));
  const setConDesc=(cid,v)=> setElicited(p=>p.map(c=>c.id===cid?{...c,desc:v}:c));
  const togglePolarity=(cid)=> setNoPolarity(p=>{ const n={...p}; if(n[cid]) delete n[cid]; else n[cid]=true; return n; });
  const removeElicited=(cid)=>{ setElicited(p=>p.filter(c=>c.id!==cid)); setRatings(p=>{const n={...p}; delete n[cid]; return n;}); if(selected===cid) setSelected(prescribed[0]?prescribed[0].id:null); };
  // Triad selector (Appendix 9 protocol): random group of three named elements
  function newTriad(){
    const named=elicitedElements.filter(e=>e.name&&e.name.trim());
    if(named.length<3){ setTriad(null); return; }
    const idx=named.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    setTriad(idx.slice(0,3).map(i=>named[i]));
    setTriadN(n=>n+1);
  }

  const total=combined.length*gridHoney.length+gridHoney.length;
  let filled=0;
  combined.forEach(c=>gridEls.forEach(el=>{ if(ratings[c.id]&&ratings[c.id][el.id]!=null) filled++; }));
  gridHoney.forEach(el=>{ if(supplied[el.id]!=null) filled++; });

  const selC=combined.find(c=>c.id===selected), q=(quotes[selected]||{});
  const saveTxt={saving:'saving…',saved:'saved',error:'save error',idle:''}[saveState];
  const namedEls=elicitedElements.filter(e=>e.name&&e.name.trim());

  return (
    <div className="content-wide fade">

          <span className={"tag "+(status==='complete'?'done':'prog')} style={{marginTop:4,display:'inline-block'}}>{status}</span>
        </div>
      </div>

      {!readOnly&&<div className="help-box"><span className="help-h">Running the interview</span>Three steps: (1) capture the interviewee’s <b>elements</b> — the situations they bring — below; (2) use the <b>triad selector</b> to elicit their <b>constructs</b> (“considering these three, how are two alike and different from the third?”); (3) rate every element on every construct, then rate the elements on the overall effectiveness yardstick. Following James Fleet’s interview protocol.</div>}

      <div className="card">
        <label className="field-lbl">Interviewee (display name)</label>
        <input className="inp inp-sm" value={name} readOnly={readOnly} onChange={e=>setName(e.target.value)} placeholder="e.g. P1 / initials"/>
      </div>

      {/* 1 — Elements */}

        <div className="sec-tag">1 · Elements ({elicitedElements.length} elicited{preEls.length?' · '+preEls.length+' prescribed':''})</div>
        <p className="field-sub">The situations this person brings. {cats.length?<span>Ask for {cats.map(c=>(c.target||'?')+' '+c.name).join(' and ')}.</span>:null} Give each a short label (and a description if useful). Prescribed elements are added to every grid automatically.</p>
        {elicitedElements.map(el=>(
          <div key={el.id} style={{borderBottom:'1px solid #ebe7e0',paddingBottom:'.5rem',marginBottom:'.5rem'}}>
            <div className="list-row" style={{border:'none',padding:0}}>
              <input className="inp inp-sm" style={{flex:3}} value={el.name} readOnly={readOnly} placeholder="Situation label" onChange={e=>setElement(el.id,{name:e.target.value})}/>
              {cats.length
                ? <select className="inp inp-sm" style={{width:160,flex:'0 0 auto'}} value={el.category||''} disabled={readOnly} onChange={e=>setElement(el.id,{category:e.target.value})}>
                    <option value="">— category —</option>
                    {cats.map(c=><option key={c.id} value={c.short||c.name}>{c.name}</option>)}

                : <input className="inp inp-sm" style={{width:90,flex:'0 0 auto'}} value={el.category||''} readOnly={readOnly} placeholder="cat" onChange={e=>setElement(el.id,{category:e.target.value})}/>}

              {triad
                ? <div className="inf-box" style={{marginBottom:'.6rem'}}>Considering these three situations, how are <b>two alike and different from the third</b>, in terms of the leadership? <span className="mini">(then give the opposite pole)</span>
                    <div style={{marginTop:'.45rem',display:'flex',gap:'.4rem',flexWrap:'wrap'}}>{triad.map((t,i)=><span key={t.id} className="chip"><b>{String.fromCharCode(65+i)}</b> · {t.name}</span>)}</div></div>
                : <p className="mini">Click “New triad” for a random group of three, ask the question, then capture the construct.</p>}
              <div className="btn-row">
                <button className="btn-s btn-sm" onClick={newTriad}>🎲 New triad</button>
                <button className="btn-s btn-sm" onClick={addElicited}>+ Construct from this triad</button>
              </div>
            </div>}
      </div>}

      {/* 3 — Grid */}
      <div className="card">
        <div className="sec-tag">3 · Grid — rate every element</div>
        <p className="field-sub" style={{marginTop:'.2rem'}}>{readOnly?'Viewing a completed grid from the example study — read-only.':<span>Rate each element {config.scaleMin} (left pole) to {config.scaleMax} (right pole). Click a construct to attach a quote or description. The highlighted row is the overall effectiveness yardstick (not rated on held-out elements).</span>}</p>
        {gridEls.length===0
          ? <p className="mini">Add elements above to build the grid.</p>
          : <GridTable elements={gridEls} elementNames={elementNames} constructs={combined}
              scaleMin={config.scaleMin} scaleMax={config.scaleMax} suppliedLeft={config.suppliedLeft} suppliedRight={config.suppliedRight}
              ratings={ratings} supplied={supplied} selected={selected}
              onSel={setSelected} onRate={rate} onRateSupplied={rateSup} onPole={setPole} onRemoveElicited={removeElicited} readOnly={readOnly}/>}
        <div className="sp"/>
        {!readOnly&&<button className="btn-s btn-sm" onClick={addElicited}>+ Add construct</button>}
        <span className="mini" style={{marginLeft:8}}>{elicited.length} elicited · {prescribed.length} prescribed constructs</span>
      </div>

      {selC&&(
        <div className="card">
          <div className="toolbar" style={{marginBottom:6}}>
            <div className="sec-tag" style={{margin:0}}>Construct — {selC.left||'(left pole)'} vs {selC.right||'(right pole)'}</div>
            <div className="grow"/>
            <label className="anon-toggle" title="Flag constructs Honey should skip — e.g. no clear high/low (effective) direction">
              <input type="checkbox" checked={!!noPolarity[selected]} disabled={readOnly} onChange={()=>{ if(!readOnly) togglePolarity(selected); }}/> no clear polarity
            </label>
          </div>
          {selC.elicited && (selC.origLeft&&selC.origLeft!==selC.left || selC.origRight&&selC.origRight!==selC.right) &&
            <p className="mini">Post-transcript edit — originally: “{selC.origLeft||selC.left}” vs “{selC.origRight||selC.right}”.</p>}
          {selC.elicited&&<React.Fragment><label className="field-lbl">Construct description (optional)</label>
            <input className="inp inp-sm" value={selC.desc||''} readOnly={readOnly} onChange={e=>setConDesc(selC.id,e.target.value)} placeholder="What does this construct mean?"/><div className="sp"/></React.Fragment>}
          <label className="field-lbl">Illustrative quote</label>
          <textarea className="inp inp-ta" value={q.text||''} readOnly={readOnly} onChange={e=>setQuote(selected,{text:e.target.value})} placeholder="Illustrative quote…"/>
          <div className="sp"/>
          <input className="inp inp-sm" value={q.ref||''} readOnly={readOnly} onChange={e=>setQuote(selected,{ref:e.target.value})} placeholder="Reference (time / page)"/>
        </div>
      )}

      {!readOnly&&<div className="btn-row"><div className="grow"/><button className="btn-p" onClick={()=>{setStatus('complete');scheduleSave('complete');}}>Mark interview complete</button></div>}
    </div>
  );
}

/* ============================ Setup ====================== */

  const c=config, set=(patch)=>setConfig({...c,...patch});

    <div className="fade">

          <div><label className="field-lbl">Scale max</label><input className="inp inp-sm" type="number" value={c.scaleMax} readOnly={readOnly} onChange={e=>set({scaleMax:Number(e.target.value)})}/></div>

      <div className="card">

/* ==================== All elements (master list) ==================== */
function AllElements({config,setConfig,onSaveConfig,responses,onSaveResponse,readOnly}){
  const pre=(config.elements||[]);
  const [elic,setElic]=useState({});
  const [dirty,setDirty]=useState(false);
  useEffect(()=>{ const m={}; responses.forEach(r=>{ m[r.participant_id]=((r.data&&r.data.elicitedElements)||[]).map(e=>({...e})); }); setElic(m); setDirty(false); },[responses]);
  const setPre=(id,patch)=>{ setConfig({...config, elements: pre.map(e=>e.id===id?{...e,...patch}:e)}); setDirty(true); };
  const setEl=(pid,id,patch)=>{ setElic(m=>({...m,[pid]:(m[pid]||[]).map(e=>e.id===id?{...e,...patch}:e)})); setDirty(true); };
  async function saveAll(){
    if(onSaveConfig) await onSaveConfig();
    for(const r of responses){ const nd={...r.data, elicitedElements: elic[r.participant_id]||((r.data&&r.data.elicitedElements)||[]) }; await onSaveResponse({...r, data:nd}); }
  }
  const totalElic=Object.values(elic).reduce((s,a)=>s+a.length,0);

    <div className="fade">
      <div className="help-box"><span className="help-h">All elements</span>Every element in the study in one place — the shared <b>prescribed</b> elements plus every <b>elicited</b> element each interviewee brought, tagged with the interview it came from and its category. Edit a name, category or description here and press <b>Save changes</b>. Elicited elements belong to a single interview; prescribed ones appear in all.</div>

        <thead><tr><th className="pole">Element</th><th style={{width:64}}>Cat</th><th style={{width:76}}>Type</th><th className="pole">Interview</th><th className="pole">Description</th></tr></thead>

          {pre.map(e=>(
            <tr key={e.id}>
              <td className="pole"><input className="inp inp-sm" value={e.name||''} readOnly={readOnly} onChange={ev=>setPre(e.id,{name:ev.target.value})}/></td>
              <td><input className="inp inp-sm" style={{width:52}} value={e.category||''} readOnly={readOnly} onChange={ev=>setPre(e.id,{category:ev.target.value})}/></td>
              <td><span className="tag">{e.supplementary?'held-out':'shared'}</span></td>
              <td className="pole muted">all</td>
              <td className="pole"><input className="inp inp-sm" value={e.desc||''} readOnly={readOnly} onChange={ev=>setPre(e.id,{desc:ev.target.value})}/></td>
            </tr>
          ))}
          {responses.map(r=> (elic[r.participant_id]||[]).map(e=>(
            <tr key={r.participant_id+e.id}>
              <td className="pole"><input className="inp inp-sm" value={e.name||''} readOnly={readOnly} onChange={ev=>setEl(r.participant_id,e.id,{name:ev.target.value})}/></td>
              <td><input className="inp inp-sm" style={{width:52}} value={e.category||''} readOnly={readOnly} onChange={ev=>setEl(r.participant_id,e.id,{category:ev.target.value})}/></td>
              <td><span className="tag prog">elicited</span></td>
              <td className="pole muted">{r.participant_name||r.participant_id}</td>
              <td className="pole"><input className="inp inp-sm" value={e.desc||''} readOnly={readOnly} onChange={ev=>setEl(r.participant_id,e.id,{desc:ev.target.value})}/></td>
            </tr>
          )))}
          {pre.length===0&&totalElic===0&&<tr><td colSpan={5} className="muted">No elements yet.</td></tr>}
        </tbody>
      </table></div>
      <p className="mini" style={{marginTop:'.5rem'}}>{pre.length+totalElic} elements · {pre.length} prescribed · {totalElic} elicited across {responses.length} interviews.</p>
      {!readOnly&&<div className="btn-row"><div className="grow"/><button className="btn-p btn-sm" disabled={!dirty} onClick={saveAll}>Save changes</button></div>}
      </div>
    </div>
  );
}

/* ============================ Interviews ====================== */
