      <div className="help-box"><span className="help-h">Narrative report — the write-up, drafted for you</span><b>Why you need it:</b> stakeholders read the story, not the matrix. <b>Download branded PDF</b> generates a polished ChangeBefore-styled deliverable (cover page, dominant themes, structure summary) you can hand to a client, supervisor or examiner. <b>Open printable report</b> builds a plain formatted page in a new tab for the browser’s print / save-as-PDF dialog or to paste into a document.</div>
      <div className="card"><div className="sec-tag">Summary</div>
        <p style={{fontSize:'.9rem'}}><b>{rep.title}</b> — {rep.n} interview{rep.n===1?'':'s'}, scale {rep.scale}.</p>
        <p className="mini">Complexity (PVAFF): {rep.meanPV!=null?rep.meanPV.toFixed(1)+'%':'—'} · Conflict: {rep.meanCf!=null?rep.meanCf.toFixed(1)+'%':'—'} · {rep.coded?('Top themes: '+top.map(t=>t.name+' '+t.pct.toFixed(0)+'%').join(', ')):'Not yet content-analysed'}{rep.sis.length?' · Self–ideal grids: '+rep.sis.length:''}{rep.dils.length?' · Dilemmas: '+rep.withDil+'/'+rep.dils.length:''}</p>
        <div className="toolbar" style={{marginTop:'.6rem',gap:'.5rem'}}>
          <button className="btn btn-sm" onClick={()=>generateStudyPDF(config,responses)}>⬇ Download branded PDF</button>
          <button className="btn-s btn-sm" onClick={openReport}>Open printable report</button>
        </div>
      </div>
    </div>
  );
}
function ShareModule({code}){
  const url=location.origin+location.pathname+'?code='+encodeURIComponent(code)+'&view=1';
  const [copied,setCopied]=useState(false);
  function copy(){ if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1800);}).catch(()=>{}); }
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Share links — let others see the results, read-only</span><b>Why you need it:</b> a supervisor, client or examiner can review the findings without the facilitator password and without changing anything. <b>How it works:</b> the link below opens this study in <b>read-only</b> mode — every analysis tab is visible, but nothing can be edited, saved or deleted. Recipients also need the study’s access code. <b>Note:</b> read-only hides the edit controls; it is not a hard security boundary, so only share with people you’d trust with the study data.</div>
      <div className="card"><div className="sec-tag">Read-only link for this study</div>
        <input className="inp inp-sm" readOnly value={url} onFocus={e=>e.target.select()} style={{fontSize:'.76rem'}}/>
        <div className="toolbar" style={{marginTop:'.5rem'}}><button className="btn btn-sm" onClick={copy}>{copied?'Copied ✓':'Copy link'}</button></div>
        <p className="mini" style={{marginTop:'.4rem'}}>Recipients open the link, enter the study access code, and land directly on the read-only dashboard — no facilitator password.</p>
      </div>
    </div>
  );
}
const DASH_NAV=[
  {area:'Design', tiles:[
    {id:'setup',t:'Study setup',d:'Title, rating scale, description and element categories.'},
    {id:'pconstructs',t:'Prescribed constructs',d:'Outcome constructs (the Honey yardsticks) + shared constructs.'},
    {id:'pelements',t:'Prescribed elements',d:'Shared elements added to every grid (e.g. an “ideal”).'},
  ]},
  {area:'Collect', tiles:[
    {id:'interviews',t:'Interviews',d:'Run repertory grids: elements, triads, ratings.'},
    {id:'allelements',t:'All elements',d:'Master list of every element and its interview.'},
    {id:'allconstructs',t:'All constructs',d:'Master list of every construct and its interview.'},
  ]},
  {area:'Content analysis', tiles:[
    {id:'individual',t:'1 · Individual Honey',d:'One person’s constructs ranked by similarity to an outcome.'},
    {id:'composite',t:'2 · Composite constructs',d:'Group constructs into categories; coders & reliability.'},
    {id:'table',t:'3 · Composite table',d:'The Honey Content Table — the headline result.'},
  ]},
  {area:'Structure', tiles:[
    {id:'complexity',t:'Cognitive complexity',d:'PVAFF, Intensity, Bieri per grid + sample means.'},
    {id:'matrices',t:'Distances & correlations',d:'Element & construct correlation and distance matrices.'},
    {id:'maps',t:'Grid maps',d:'PrinGrid biplot (% variance) + FOCUS ordering.'},
    {id:'dendro',t:'Cluster trees',d:'Construct & element dendrograms (FOCUS).'},
    {id:'selfideal',t:'Self–ideal',d:'Self vs ideal-self discrepancy (role-tagged elements).'},
    {id:'dilemmas',t:'Implicative dilemmas',d:'Cognitive conflicts that block change.'},
    {id:'conflict',t:'Conflict',d:'Triadic-imbalance inconsistency (Slade & Sheehan).'},
    {id:'cspc',t:'CSPC dictionary',d:'Ready-made Feixas content-category scheme for constructs.'},
  ]},
  {area:'Compare & change', tiles:[
    {id:'segments',t:'Segmentation',d:'Value-group clustering of participants by content profile.'},
    {id:'compare',t:'Consensus & difference',d:'Group mean grid + disagreement on shared frame.'},
    {id:'norms',t:'Norm bases',d:'Save a study’s distribution as a reusable benchmark.'},
    {id:'change',t:'Change over time',d:'Pre/post movement in complexity, conflict & self–ideal.'},
  ]},
  {area:'Report & share', tiles:[
    {id:'report',t:'Narrative report & PDF',d:'Auto-written summary + branded ChangeBefore PDF.'},
    {id:'share',t:'Share links',d:'Read-only view link for supervisors & stakeholders.'},
  ]},
];
function Dashboard({code, onSignOut, viewer}){
  const [tab,setTab]=useState(null);
  const [config,setConfig]=useState(null);
  const [responses,setResponses]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [savedMsg,setSavedMsg]=useState('');
  const [active,setActive]=useState(null);

  async function reload(){
    const j=await api('/api/rep-grid-load',{session_code:code});
    const cfg=(j.config&&j.config.data&&j.config.data.title!=null)? j.config.data
      : {title:'',description:'',scaleMin:1,scaleMax:10,suppliedLeft:'Highly effective',suppliedRight:'Not effective at all',suppliedDesc:'',elementCategories:[],elements:[],constructs:[]};
    cfg.categories=cfg.categories||[]; cfg.assignments=cfg.assignments||{};
    cfg.elementCategories=cfg.elementCategories||[]; cfg.description=cfg.description||''; cfg.suppliedDesc=cfg.suppliedDesc||'';
    cfg.suppliedConstructs=cfg.suppliedConstructs||[]; cfg.coderSchemes=cfg.coderSchemes||{}; cfg.norms=cfg.norms||[];
    setConfig(cfg); setResponses(j.responses||[]); setLoading(false);
  }
  useEffect(()=>{ reload().catch(e=>{ setLoading(false); alert('Load failed: '+e.message); }); /* eslint-disable-next-line */ },[]);

  // Browser Back navigates WITHIN the tool (interview/module → dashboard) instead of leaving the page.
  const navRef=useRef({tab,active}); navRef.current={tab,active};
  useEffect(()=>{
    window.history.pushState({rg:1},'');                 // guard entry so the first Back is caught
    const onPop=()=>{
      const {tab:t,active:a}=navRef.current;
      if(a){ setActive(null); window.history.pushState({rg:1},''); }
      else if(t!==null){ setTab(null); window.history.pushState({rg:1},''); }
      // at the dashboard home: let Back proceed (guard already consumed), so a second Back exits.
    };
    window.addEventListener('popstate', onPop);
    return ()=>window.removeEventListener('popstate', onPop);
  }, []);
  // Push a history entry each time the user goes deeper, so Back has something to pop.
  useEffect(()=>{ if(tab!==null||active) window.history.pushState({rg:1},''); }, [tab, active?active.participant_id:null]);

  async function saveConfig(override){
    const cfg=override||config;
    if(cfg&&cfg.readOnly) return;
    setSaving(true); setSavedMsg('');
    try{ await saveWithRetry({kind:'config',session_code:code,data:cfg}); setSavedMsg('Saved ✓'); setTimeout(()=>setSavedMsg(''),2500); }
    catch(e){ alert('Save failed: '+e.message); }
    setSaving(false);
  }
  async function saveResponse(resp){
    if(config&&config.readOnly) return;
    try{ await saveWithRetry({kind:'response',session_code:code,participant_id:resp.participant_id,participant_name:resp.participant_name||'',data:resp.data}); await reload(); }
    catch(e){ alert('Save failed: '+e.message); }
  }
  function newInterview(){ if(config&&config.readOnly) return; setActive({participant_id:uid(),participant_name:'',data:{ratings:{},supplied:{},quotes:{},status:'in_progress'}}); }
  async function deleteResponse(r){
    if(config&&config.readOnly) return;
    if(!window.confirm('Delete interview “'+(r.participant_name||'unnamed')+'”?\n\nThis permanently removes the grid and cannot be undone.')) return;
    try{ await api('/api/rep-grid-save',{kind:'delete-response',session_code:code,participant_id:r.participant_id}); reload(); }
    catch(e){ alert('Delete failed: '+e.message); }
  }

  if(loading) return <div className="content"><p className="muted">Loading session…</p></div>;
  const readOnly=!!(config&&config.readOnly)||!!viewer;
  if(active) return <Interview config={config} code={code} resp={active} readOnly={readOnly} onBack={()=>{ setActive(null); reload(); }}/>;

  return (
    <div className="content-wide fade">
      <div className="topbar">
        <div><div className="land-tag" style={{marginBottom:'.3rem'}}>Rep-Grid{viewer?' · View only':(readOnly?' · Example':'')}</div>
          <div className="pg-title" style={{margin:0}}>{config.title||'Untitled study'}</div></div>
        <div style={{display:'flex',gap:'.6rem',alignItems:'center'}}>
          <span className="code">{code}</span>
          <button className="btn-s btn-sm" onClick={onSignOut}>{viewer?'Exit':'Sign out'}</button>
        </div>
      </div>
      {viewer&&!(config&&config.readOnly)&&<div className="demo-banner"><b>Read-only view.</b> You’re viewing shared results for this study. Every analysis is visible, but editing, adding interviews and deleting are switched off.</div>}
      {(config&&config.readOnly)&&<div className="demo-banner"><b>Read-only example study.</b> This is a completed dataset, kept as a worked example so you can see what a finished study looks like at every stage. You can explore and export freely — editing, adding interviews and deleting are switched off so it can’t be changed. To run your own study, sign out and open the tool with your own access code.</div>}
      {tab===null ? (
        <div className="dash-home fade">
          <div className="help-box"><span className="help-h">Study dashboard</span>Pick a module to work in. They’re grouped by stage — <b>design</b> your study, <b>collect</b> grids, then <b>analyse</b> them — and each opens with plain-English guidance on why and how to use it, with references you can cite. {responses.length} interview{responses.length===1?'':'s'} · {(config.categories||[]).length} categories so far.<span className="help-tip"><b>New here? Recommended path:</b> 1 · Study setup → 2 · Prescribed constructs (your outcome yardstick) → 3 · Interviews → 4 · Individual Honey → 5 · Composite constructs → 6 · Composite table. Everything under <b>Structure</b> and <b>Compare &amp; change</b> is optional extra analysis.</span><span className="help-ref">Quick glossary — <b>Element</b>: a thing being compared (a person, situation, brand). <b>Construct</b>: a two-ended way of telling elements apart (“open ↔ guarded”). <b>Rating</b>: scoring each element on each construct. <b>Outcome/supplied construct</b>: the yardstick everything is measured against. <b>Band H/I/L</b>: whether a construct is in the top / middle / bottom third of how closely it tracks the yardstick.</span></div>
          {DASH_NAV.map(g=>(
            <div className="dash-area" key={g.area}>
              <div className="dash-area-h">{g.area}{g.soon&&<span className="soon"> · building</span>}</div>
              <div className="dash-grid">
                {g.tiles.map(t=>{ const soon=!!(g.soon||t.soon); return (
                  <button className="dash-tile" key={t.id} disabled={soon} onClick={()=>{ if(!soon) setTab(t.id); }}>
                    <div className="dash-tile-t">{t.t}</div>
                    <div className="dash-tile-d">{t.d}</div>
                    {soon&&<span className="dash-tile-badge">building</span>}
                  </button>
                );})}
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div className="fade">
          <button className="mod-back" onClick={()=>setTab(null)}>← Dashboard</button>
          {tab==='setup'&&<Setup config={config} setConfig={setConfig} onSave={saveConfig} saving={saving} savedMsg={savedMsg} readOnly={readOnly}/>}
          {tab==='pconstructs'&&<PrescribedConstructs config={config} setConfig={setConfig} onSave={saveConfig} saving={saving} savedMsg={savedMsg} readOnly={readOnly}/>}
          {tab==='pelements'&&<PrescribedElements config={config} setConfig={setConfig} onSave={saveConfig} saving={saving} savedMsg={savedMsg} readOnly={readOnly}/>}
          {tab==='interviews'&&<Interviews config={config} responses={responses} onOpen={setActive} onNew={newInterview} onDelete={deleteResponse} readOnly={readOnly}/>}
          {tab==='allelements'&&<AllElements config={config} setConfig={setConfig} onSaveConfig={saveConfig} responses={responses} onSaveResponse={saveResponse} readOnly={readOnly}/>}
          {tab==='allconstructs'&&<AllConstructs config={config} responses={responses} onSaveResponse={saveResponse} readOnly={readOnly}/>}
          {tab==='individual'&&<Analysis config={config} responses={responses} onOpen={setActive}/>}
          {tab==='composite'&&<CompositeConstructs config={config} setConfig={setConfig} responses={responses} onSave={saveConfig} saving={saving} savedMsg={savedMsg} readOnly={readOnly}/>}
          {tab==='table'&&<CompositeTable config={config} responses={responses}/>}
          {tab==='complexity'&&<ComplexityModule config={config} responses={responses}/>}
          {tab==='matrices'&&<MatricesModule config={config} responses={responses}/>}
          {tab==='maps'&&<MapsModule config={config} responses={responses}/>}
          {tab==='dendro'&&<DendroModule config={config} responses={responses}/>}
          {tab==='selfideal'&&<SelfIdealModule config={config} responses={responses}/>}
          {tab==='dilemmas'&&<DilemmasModule config={config} responses={responses}/>}
          {tab==='conflict'&&<ConflictModule config={config} responses={responses}/>}
          {tab==='cspc'&&<CSPCModule config={config} setConfig={setConfig} onSaveConfig={saveConfig} readOnly={readOnly}/>}
          {tab==='segments'&&<SegmentsModule config={config} responses={responses}/>}
          {tab==='compare'&&<CompareModule config={config} responses={responses}/>}
          {tab==='norms'&&<NormsModule config={config} setConfig={setConfig} onSaveConfig={saveConfig} responses={responses} readOnly={readOnly}/>}
          {tab==='change'&&<ChangeModule config={config} responses={responses}/>}
          {tab==='report'&&<ReportModule config={config} responses={responses} code={code}/>}
          {tab==='share'&&<ShareModule code={code}/>}
        </div>
      )}
    </div>
  );
}

/* ============================ Root ====================== */
function ParticipantApp({code, onExit}){
  const [config,setConfig]=useState(null);
  const [loading,setLoading]=useState(true);
  const [failed,setFailed]=useState(false);
  const [resp,setResp]=useState(null);
  const [name,setName]=useState('');
  const [done,setDone]=useState(false);
  useEffect(()=>{ (async()=>{
    try{
      const j=await api('/api/rep-grid-load',{session_code:code});
      const cfg=(j.config&&j.config.data&&j.config.data.title!=null)? j.config.data
        : {title:'',description:'',scaleMin:1,scaleMax:10,suppliedLeft:'Highly effective',suppliedRight:'Not effective at all',suppliedDesc:'',elementCategories:[],elements:[],constructs:[]};
      cfg.categories=cfg.categories||[]; cfg.assignments=cfg.assignments||{}; cfg.elementCategories=cfg.elementCategories||[];
      cfg.description=cfg.description||''; cfg.suppliedDesc=cfg.suppliedDesc||''; cfg.suppliedConstructs=cfg.suppliedConstructs||[];
      cfg.coderSchemes=cfg.coderSchemes||{}; cfg.norms=cfg.norms||[];
      setConfig(cfg);
    }catch(e){ setFailed(true); }
    setLoading(false);
  })(); /* eslint-disable-next-line */ },[]);

  if(loading) return <div className="content fade"><div className="card"><p className="mini">Loading your study…</p></div></div>;
  if(failed||!config) return <div className="content fade" style={{maxWidth:640}}><div className="card"><p>We couldn’t open this study. Please check the code you were given, or contact the person running the study.</p><button className="btn-s btn-sm" onClick={onExit}>← Back</button></div></div>;
  if(config.readOnly) return <div className="content fade" style={{maxWidth:640}}><div className="card"><p>This is a read-only example study, so new interviews can’t be added here. Please use the study code you were given.</p><button className="btn-s btn-sm" onClick={onExit}>← Back</button></div></div>;
  if(done) return <div className="content fade" style={{maxWidth:640}}>
    <div className="land-hero" style={{borderBottom:'none'}}><div className="land-tag">ChangeBefore · Rep-Grid</div><div className="land-title">Thank you</div></div>
    <div className="card"><p>Your grid has been saved. You can close this window now.</p></div></div>;

  if(!resp) return <div className="content fade" style={{maxWidth:640}}>
    <div className="land-hero" style={{borderBottom:'none',marginBottom:'1rem'}}>
      <div className="land-tag">ChangeBefore · Rep-Grid</div>
      <div className="land-title">{config.title||'Repertory grid interview'}</div>
      {config.description&&<div className="land-desc">{config.description}</div>}
    </div>
    <div className="card">
      <p className="field-sub">You’ll be guided through a short interview: add a few situations, describe what tells them apart, and rate them. It takes about 20–30 minutes.</p>
      <label className="field-lbl">Your name (or an identifier)</label>
      <input className="inp inp-sm" value={name} autoFocus placeholder="e.g. your initials" onChange={e=>setName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&name.trim())setResp({participant_id:uid(),participant_name:name.trim(),data:{ratings:{},supplied:{},quotes:{},status:'in_progress'}});}}/>
      <div className="btn-row"><button className="btn-p" disabled={!name.trim()} onClick={()=>setResp({participant_id:uid(),participant_name:name.trim(),data:{ratings:{},supplied:{},quotes:{},status:'in_progress'}})}>Start my interview →</button></div>
    </div></div>;

  return <div className="content"><Interview config={config} code={code} resp={resp} onBack={()=>setDone(true)} readOnly={false} participant={true}/></div>;
}
function App(){
  const [session,setSession]=useState(null);
  if(!session) return <Gate onUnlock={(code,role)=>setSession({code, role:role||'facilitator'})}/>;
  if(session.role==='participant') return <ParticipantApp code={session.code} onExit={()=>setSession(null)}/>;
  return <Dashboard code={session.code} onSignOut={()=>setSession(null)} viewer={session.role==='viewer'}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
