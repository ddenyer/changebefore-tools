<style>
/* Design system lifted from stat-group.html so Rep-Grid matches the suite. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'DM Sans',sans-serif;background:#f0ede8;color:#1a1a1a;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .3s ease both}
.content{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 3rem}
.content-wide{max-width:1040px;margin:0 auto;padding:1.75rem 1.5rem 3rem}
.land-hero{border-bottom:1px solid #d8d3cb;padding-bottom:1.5rem;margin-bottom:1.5rem}
.land-tag{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.6rem}
.land-title{font-size:2.1rem;font-weight:600;color:#1a1a1a;line-height:1.15;margin-bottom:.55rem;font-family:'Cormorant Garamond',serif}
.land-desc{font-size:.95rem;color:#555;line-height:1.7;max-width:560px}
.field-lbl{font-size:.72rem;font-weight:700;color:#555;display:block;margin-bottom:.35rem;letter-spacing:.03em}

.inf-box{background:#ebe7e0;border-left:3px solid #e07030;padding:.85rem 1.1rem;border-radius:0 3px 3px 0;margin-bottom:1.2rem;font-size:.875rem;line-height:1.6;color:#555}
.warn-box{background:#fff8f6;border:1px solid #f0b8a8;border-radius:3px;padding:.85rem 1.1rem;margin:.7rem 0;font-size:.82rem;color:#c0392b}
.card{border:1px solid #d8d3cb;border-radius:4px;padding:1.1rem 1.25rem;background:#fff;margin-bottom:1rem}
.fac-tab-bar{display:flex;gap:0;border-bottom:2px solid #d8d3cb;margin-bottom:1.5rem;overflow-x:auto}
.fac-tab{padding:.55rem .95rem;font-size:.75rem;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:#b0a898;transition:all .2s;white-space:nowrap;font-family:'DM Sans',sans-serif;background:none;border-top:none;border-left:none;border-right:none}
.fac-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}

.tag.done{background:#dcefe0;color:#16794a}.tag.prog{background:#fdecd8;color:#b5651a}
/* Grid + analysis tables — house palette */
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:.8rem;background:#fff}
table.grid th,table.grid td{border:1px solid #d8d3cb;padding:.4rem .5rem;text-align:center}

.cellin:focus{border-color:#e07030;outline:none}
.rowsel td.pole{color:#e07030}
.badge{display:inline-block;min-width:20px;padding:.05rem .5rem;border-radius:3px;font-size:.66rem;font-weight:700;color:#fff;text-align:center}
.badge.H{background:#16a34a}.badge.I{background:#c98a1e}.badge.L{background:#dc2626}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================ Honey engine (verified) ====================== */
function sumAbsDiff(a, b){
  let sum=0,n=0; const len=Math.min(a.length,b.length);
  for(let i=0;i<len;i++){ if(a[i]==null||b[i]==null) continue; sum+=Math.abs(a[i]-b[i]); n++; }
  return {sum,n};
}
function similarity(c,s,lo,hi){ const {sum,n}=sumAbsDiff(c,s); if(!n) return 0; return 1-(2*sum)/(n*(hi-lo)); }
function reverseRatings(r,lo,hi){ return r.map(x=> x==null?null:(hi+lo-x)); }
function analyseGrid(constructs, supplied, lo, hi){
  const rev=reverseRatings(supplied,lo,hi);
  const scored=constructs.map(c=>{
    const a=similarity(c.ratings,supplied,lo,hi), b=similarity(c.ratings,rev,lo,hi);
    return {c, simAligned:a, simReversed:b, orientation:a>=b?'aligned':'reversed', similarity:Math.max(a,b)};
  });
  const sims=scored.map(s=>s.similarity);
  const min=sims.length?Math.min.apply(null,sims):0, max=sims.length?Math.max.apply(null,sims):0;
  const width=(max-min)/3, high=max-width, low=high-width;
  const order=[...scored].sort((x,y)=>y.similarity-x.similarity);
  const rank={}; order.forEach((s,i)=>rank[s.c.id]=i+1);
  const results=scored.map(s=>({
    id:s.c.id,left:s.c.left,right:s.c.right,
    simAligned:s.simAligned,simReversed:s.simReversed,similarity:s.similarity,
    orientation:s.orientation,rank:rank[s.c.id],
    band:s.similarity>high?'H':(s.similarity<low?'L':'I')
  }));
  return {results, bands:{min,max,width,high,low}};
}
const STOP=new Set(['the','and','vs','not','with','for','was','very','from','into']);
function tokens(s){ return new Set((s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w))); }
function jaccard(a,b){ if(!a.size&&!b.size) return 0; let i=0; a.forEach(t=>{if(b.has(t))i++}); return i/(a.size+b.size-i); }
function suggestGroups(items, threshold){
  threshold=threshold||0.34;
  const toks=items.map(it=>tokens(it.text)), parent=items.map((_,i)=>i);
  const find=x=> parent[x]===x?x:(parent[x]=find(parent[x]));
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++) if(jaccard(toks[i],toks[j])>=threshold) parent[find(i)]=find(j);
  const groups={}; items.forEach((it,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(it); });
  return Object.values(groups).sort((a,b)=>b.length-a.length);
}

/* ====== Composite (content-analysis) helpers — James/Jankowicz step ====== */
function pnumOf(name){ const m=String(name||'').match(/\d+/); return m?m[0]:'?'; }
// James's preference labels from the preferred-pole mean similarity %.
function prefLabel(left){
  if(left>=70) return 'Strong preference';
  if(left>=58) return 'Moderate preference';
  if(left>=54) return 'Slight preference';
  if(left>=46) return 'Balanced preference';
  if(left>=42) return 'Slight (opposite)';
  return 'Preference (opposite)';
}
// One row per (participant, construct). Honey metrics over an element subset
// (all, or a category e.g. SL / TL). leftAlignPct = how strongly the construct's
// LEFT pole (as recorded) associates with the supplied effectiveness construct.
// band = individual Honey H/I/L, per-participant tercile over the same subset.
function pooledMembers(responses, config, filterCat){
  const elIds=config.elements.filter(e=> !filterCat || e.category===filterCat).map(e=>e.id);
  const lo=config.scaleMin, hi=config.scaleMax;
  const rows=[];
  responses.forEach(r=>{
    const d=r.data||{}; const ratings=d.ratings||{}; const supplied=d.supplied||{};
    const sSub=elIds.map(e=> supplied[e]!=null?supplied[e]:null);
    if(!elIds.length || sSub.every(v=>v==null)) return;
    const sRev=reverseRatings(sSub,lo,hi);
    const cons=[...config.constructs, ...(d.elicited||[])];
    const scored=cons.map(c=>{
      const cArr=elIds.map(e=> (ratings[c.id]&&ratings[c.id][e]!=null)?ratings[c.id][e]:null);
      if(cArr.every(v=>v==null)) return null;
      const aL=similarity(cArr,sSub,lo,hi), aR=similarity(cArr,sRev,lo,hi);
      return {c, aL, aR, sim:Math.max(aL,aR), orient:aL>=aR?'left':'right'};
    }).filter(Boolean);
    if(!scored.length) return;
    const sims=scored.map(s=>s.sim); const mn=Math.min.apply(null,sims), mx=Math.max.apply(null,sims);
    const w=(mx-mn)/3, hiT=mx-w, loT=hiT-w;
    scored.forEach(s=>{
      rows.push({
        key:r.participant_id+':'+s.c.id, participant:r.participant_name||r.participant_id,
        pnum:pnumOf(r.participant_name), left:s.c.left, right:s.c.right,
        leftAlignPct:(s.aL+1)/2*100, rightAlignPct:(s.aR+1)/2*100,
        effLabel: s.orient==='left'? s.c.left : s.c.right,
        band: s.sim>hiT?'H':(s.sim<loT?'L':'I')
      });
    });
  });
  return rows;
}
function totalParticipants(members){ return new Set(members.map(m=>m.participant)).size; }
// Fixed effective-pole orientation per construct, from the all-elements pass.
function fixedOrientOf(membersAll){ const o={}; membersAll.forEach(m=>{ o[m.key]=m.leftAlignPct>=m.rightAlignPct?'left':'right'; }); return o; }
// Aggregate members into composite constructs (Honey Content Table rows). The
// effective pole is fixed (fixedOrient) so its alignment can rise/fall by subset.
function compositeRows(members, categories, assignments, totalP, fixedOrient){
  return categories.map(cat=>{
    const mem=members.filter(m=>(assignments[m.key]||{}).cat===cat.id);
    const n=mem.length; let sum=0,H=0,I=0,L=0; const parts=new Set();
    mem.forEach(m=>{
      const flip=(assignments[m.key]||{}).flip;
      const side=(fixedOrient&&fixedOrient[m.key])||(m.leftAlignPct>=m.rightAlignPct?'left':'right');
      const posAlign= side==='left'? m.leftAlignPct : m.rightAlignPct;
      sum += flip? (100-posAlign) : posAlign;
      parts.add(m.participant);
      if(m.band==='H')H++; else if(m.band==='L')L++; else I++;
    });
    const left=n?sum/n:0;
    return {cat, n, uniq:parts.size, uniquePct: totalP? parts.size/totalP*100:0,
      left, right:100-left, pref: n?prefLabel(left):'—',
      H:n?H/n*100:0, I:n?I/n*100:0, L:n?L/n*100:0};
  });
}
function autoFlip(effLabel, cat){
  return jaccard(tokens(effLabel), tokens(cat.right)) > jaccard(tokens(effLabel), tokens(cat.left));
}
// Cohen's kappa for a pair of coders.
function cohen(A,B){
  const keys=Object.keys(A).filter(k=>B[k]); const n=keys.length;
  if(!n) return {n:0,po:0,kappa:0};
  let match=0; const cA={},cB={};
  keys.forEach(k=>{ const a=A[k].cat,b=B[k].cat; cA[a]=(cA[a]||0)+1; cB[b]=(cB[b]||0)+1; if(a===b)match++; });
  const po=match/n; let pe=0;
  Object.keys(cA).forEach(c=>{ if(cB[c]) pe+=(cA[c]/n)*(cB[c]/n); });
  return {n, po, kappa: pe===1?1:(po-pe)/(1-pe)};
}
// Fleiss' kappa for m>2 coders over items all of them coded.
function fleiss(sets){
  const m=sets.length; if(m<2) return {n:0,po:0,kappa:0};
  const keys=Object.keys(sets[0]).filter(k=>sets.every(s=>s[k]));
  const N=keys.length; if(!N) return {n:0,po:0,kappa:0};
  const catSet=new Set(); keys.forEach(k=>sets.forEach(s=>catSet.add(s[k].cat)));
  const cats=[...catSet];
  let Pbar=0; const colTot={};
  keys.forEach(k=>{
    const cnt={}; sets.forEach(s=>{ const c=s[k].cat; cnt[c]=(cnt[c]||0)+1; colTot[c]=(colTot[c]||0)+1; });
    let sq=0; cats.forEach(c=>{ const v=cnt[c]||0; sq+=v*v; });
    Pbar += (sq-m)/(m*(m-1));
  });
  Pbar/=N;
  let Pe=0; cats.forEach(c=>{ const p=(colTot[c]||0)/(N*m); Pe+=p*p; });
  return {n:N, po:Pbar, kappa: Pe===1?1:(Pbar-Pe)/(1-Pe)};
}
// Overall stats across any number of coder sets, plus the disagreeing items.
function multiStats(sets){
  const m=sets.length;
  if(m<2) return null;
  const keys=Object.keys(sets[0]).filter(k=>sets.every(s=>s[k]));
  const disagree=keys.filter(k=>!sets.every(s=>s[k].cat===sets[0][k].cat));
  const unanimous=keys.length-disagree.length;
  const stat = m===2? cohen(sets[0],sets[1]) : fleiss(sets);
  return {n:keys.length, unanimous, disagree, kappa:stat.kappa,
    po: keys.length? unanimous/keys.length : 0, kind: m===2?'Cohen’s κ':'Fleiss’ κ'};
}
// Majority pick for an item across coder sets (null if tied).
function majorityPick(sets,key){
  const cnt={}; sets.forEach(s=>{ if(s[key]){ const c=s[key].cat; cnt[c]=(cnt[c]||0)+1; } });
  const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  if(!e.length) return null;
  if(e.length>1 && e[0][1]===e[1][1]) return null;
  const winner=e[0][0];
  const src=sets.find(s=>s[key]&&s[key].cat===winner);
  return {cat:winner, flip:src[key].flip, votes:e[0][1]};
}

/* ============================ helpers ====================== */
const uid=()=> (crypto.randomUUID? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now());
async function api(path, body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function saveWithRetry(body){
  const backoff=[0,508,2010]; let ok=false, err;
  for(let a=0;a<3&&!ok;a++){
    try{ await api('/api/rep-grid-save', body); ok=true; }
    catch(e){ err=e; await new Promise(r=>setTimeout(r,backoff[a])); }
  }
  if(!ok) throw err||new Error('save failed');
}

const EXAMPLE={
  title:'Future NHS Leadership', scaleMin:1, scaleMax:10,
  suppliedLeft:'Highly effective', suppliedRight:'Not effective at all',
  elements:[
    {id:'',name:'ICS',category:'SL'},{id:'',name:'Challenged Trust',category:'SL'},{id:'',name:'Region',category:'SL'},
    {id:'',name:'National Policy',category:'TL'},{id:'',name:'National Review',category:'TL'},{id:'',name:'NHS from outside',category:'TL'},
  ],
  constructs:[
    {id:'',left:'Actively inclusive',right:'Restricted'},{id:'',left:'Adaptive',right:'Rigid'},
    {id:'',left:'Bottom up',right:'Top down'},{id:'',left:'Facilitative',right:'Pacesetting'},
    {id:'',left:'Coaching',right:'Command and control'},
  ],
};
function freshExample(){
  return {...EXAMPLE, elements:EXAMPLE.elements.map(e=>({...e,id:uid()})), constructs:EXAMPLE.constructs.map(e=>({...e,id:uid()}))};
}

/* ============================ Gate ====================== */
function Gate({onUnlock}){
  const params=new URLSearchParams(location.search);
  const [input,setInput]=useState(params.get('code')||localStorage.getItem('rg_code')||'');
  const [code,setCode]=useState('');
  const [pw,setPw]=useState('');
  const [step,setStep]=useState('code');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');

  const testMode=params.get('test')==='1';

  async function checkCode(){
    const c=input.trim();
    if(!c){ setErr('Please enter a code.'); return; }
    // Test bypass: ?test=1 skips coupon validation (still gated by Admin1* next).
    // Remove or ignore before go-live — do NOT share a ?test=1 link.
    if(testMode){ const up=c.toUpperCase(); localStorage.setItem('rg_code',up); setCode(up); setStep('pw'); setErr(''); return; }
    setBusy(true); setErr('');
    try{
      const resp=await fetch('/api/validate-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c,tool:'rep-grid'})});
      const data=await resp.json().catch(()=>({}));
      if(resp.ok&&data&&data.valid){
        const up=c.toUpperCase(); localStorage.setItem('rg_code',up); setCode(up); setStep('pw'); setErr('');
      }else{
        const reason=(data&&data.reason)||'';
        setErr({not_found:'That code wasn’t recognised. Check the code and try again.',
          expired:'That code has expired.', used_up:'That code has reached its usage limit.',
          no_membership:'That code isn’t valid for this tool.',
          upstream_error:'We couldn’t check the code right now. Please try again in a moment.'}[reason]
          ||'That code wasn’t recognised. Check the code and try again.');
      }
    }catch(e){ setErr('We couldn’t check the code right now. Please try again in a moment.'); }
    setBusy(false);
  }
  function checkPw(){ if(pw==='Admin1*') onUnlock(code); else setErr('Facilitator password incorrect.'); }

  return (
    <div className="content fade" style={{maxWidth:'440px'}}>
      <div className="land-hero" style={{borderBottom:'none',marginBottom:'1.25rem',paddingBottom:0}}>
        <div className="land-tag">ChangeBefore · Rep-Grid</div>
        <div className="land-title">Repertory grid interviews</div>
        <div className="land-desc">Facilitator-run repertory grid interviews with Honey’s content analysis.</div>
      </div>
      {step==='code' ? (
        <div>
          <label className="field-lbl">Enter your access code</label>
          {testMode&&<div className="warn-box" style={{marginBottom:'.5rem'}}>Test mode — code validation is bypassed. Any code opens the tool. Don’t share this link.</div>}
          <input className="inp" value={input} autoFocus autoComplete="off" spellCheck={false}
            style={{textTransform:'uppercase',letterSpacing:'.05em'}}
            onChange={e=>{setInput(e.target.value); if(err)setErr('');}}
            onKeyDown={e=>{if(e.key==='Enter'&&!busy)checkCode();}}/>
          {err&&<div style={{marginTop:'.65rem',fontSize:'.82rem',color:'#c0392b',lineHeight:1.5}}>{err}</div>}
          <div className="btn-row"><button className="btn-p" disabled={!input.trim()||busy} onClick={checkCode}>{busy?'Checking…':'Continue →'}</button></div>
        </div>
      ) : (
        <div>
          <label className="field-lbl">Facilitator password</label>
          <input className="inp" type="password" value={pw} autoFocus
            onChange={e=>{setPw(e.target.value); if(err)setErr('');}}
            onKeyDown={e=>{if(e.key==='Enter')checkPw();}}/>
          {err&&<div style={{marginTop:'.65rem',fontSize:'.82rem',color:'#c0392b',lineHeight:1.5}}>{err}</div>}
          <div className="btn-row">
            <button className="btn-p" onClick={checkPw}>Open dashboard</button>
            <button className="btn-s btn-sm" onClick={()=>{setStep('code');setErr('');}}>← Back</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================ Grid table ====================== */
// constructs: array of {id,left,right,elicited?}. Elicited rows have editable poles.
function GridTable({elements, elementNames, constructs, scaleMin, scaleMax, suppliedLeft, suppliedRight,
                    ratings, supplied, selected, onSel, onRate, onRateSupplied, onPole, onRemoveElicited}){
  const val=(m,cid,eid)=> (m[cid]&&m[cid][eid]!=null)?m[cid][eid]:'';
  const inp=(v,onCh)=> <input className="cellin" type="number" min={scaleMin} max={scaleMax} value={v}
    onChange={e=>{ const x=e.target.value; if(x==='') return onCh(null); let n=Number(x); if(isNaN(n)) return; n=Math.max(scaleMin,Math.min(scaleMax,n)); onCh(n); }}/>;
  const hdr=(el,i)=> (elementNames&&elementNames[i])?elementNames[i]:el.name;
  return (
    <div className="scroll">
      <table className="grid">
        <thead><tr>
          <th className="pole">Left pole ({scaleMin})</th>
          {elements.map((el,i)=><th key={el.id}>{hdr(el,i)}{el.category?<div className="mini">{el.category}</div>:null}</th>)}
          <th className="pole">Right pole ({scaleMax})</th>
        </tr></thead>
        <tbody>
          {constructs.map(c=>(
            <tr key={c.id} className={selected===c.id?'rowsel':''}>
              <td className="pole" style={{cursor:'pointer'}} onClick={()=>onSel(c.id)}>
                {c.elicited
                  ? <input className="inp inp-sm" style={{minWidth:130}} value={c.left} onClick={e=>e.stopPropagation()} onChange={e=>onPole(c.id,'left',e.target.value)}/>
                  : c.left}
              </td>
              {elements.map(el=><td key={el.id} onClick={()=>onSel(c.id)}>{inp(val(ratings,c.id,el.id),v=>onRate(c.id,el.id,v))}</td>)}
              <td className="pole">
                {c.elicited
                  ? <span style={{display:'flex',gap:4,alignItems:'center'}}>
                      <input className="inp inp-sm" style={{minWidth:120}} value={c.right} onChange={e=>onPole(c.id,'right',e.target.value)}/>
                      <button className="x" title="Remove" onClick={()=>onRemoveElicited(c.id)}>✕</button>
                    </span>
                  : c.right}
              </td>
            </tr>
          ))}
          <tr style={{background:'#f6efe8'}}>
            <td className="pole"><b>{suppliedLeft}</b><div className="mini">supplied / overall</div></td>
            {elements.map(el=><td key={el.id}>{inp((supplied&&supplied[el.id]!=null)?supplied[el.id]:'',v=>onRateSupplied(el.id,v))}</td>)}
            <td className="pole"><b>{suppliedRight}</b></td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

/* ============================ Interview ====================== */
function Interview({config, code, resp, onBack}){
  const [name,setName]=useState(resp.participant_name||'');
  const [ratings,setRatings]=useState((resp.data&&resp.data.ratings)||{});
  const [supplied,setSupplied]=useState((resp.data&&resp.data.supplied)||{});
  const [quotes,setQuotes]=useState((resp.data&&resp.data.quotes)||{});
  const [elicited,setElicited]=useState((resp.data&&resp.data.elicited)||[]);
  const [status,setStatus]=useState((resp.data&&resp.data.status)||'in_progress');
  const prescribed=config.constructs.map(c=>({...c,elicited:false}));
  const combined=[...prescribed, ...elicited.map(c=>({...c,elicited:true}))];
  const [selected,setSelected]=useState(combined[0]?combined[0].id:null);
  const [saveState,setSaveState]=useState('idle');
  const timer=useRef(null);
  const elementNames=(resp.data&&resp.data.elementNames)||null;

  function scheduleSave(nextStatus){
    setSaveState('saving'); clearTimeout(timer.current);
    const snap={ratings,supplied,quotes,elicited,elementNames,status:nextStatus||status};
    timer.current=setTimeout(async()=>{
      try{
        await saveWithRetry({kind:'response',session_code:code,participant_id:resp.participant_id,participant_name:name,
          data:{...snap, completedAt: snap.status==='complete'? new Date().toISOString(): null}});
        setSaveState('saved');
      }catch(e){ setSaveState('error'); alert("We couldn't save right now. Please check your connection and try again."); }
    },300);
  }
  useEffect(()=>{ scheduleSave(); /* eslint-disable-next-line */ },[ratings,supplied,quotes,elicited,name]);

  const rate=(cid,eid,v)=> setRatings(p=>({...p,[cid]:{...(p[cid]||{}),[eid]:v}}));
  const rateSup=(eid,v)=> setSupplied(p=>({...p,[eid]:v}));
  const setQuote=(cid,patch)=> setQuotes(p=>({...p,[cid]:{...(p[cid]||{}),...patch}}));
  const addElicited=()=>{ const id=uid(); setElicited(p=>[...p,{id,left:'New construct',right:'Opposite pole'}]); setSelected(id); };
  const setPole=(cid,side,v)=> setElicited(p=>p.map(c=>c.id===cid?{...c,[side]:v}:c));
  const removeElicited=(cid)=>{ setElicited(p=>p.filter(c=>c.id!==cid)); setRatings(p=>{const n={...p}; delete n[cid]; return n;}); if(selected===cid) setSelected(prescribed[0]?prescribed[0].id:null); };

  const total=combined.length*config.elements.length+config.elements.length;
  let filled=0;
  combined.forEach(c=>config.elements.forEach(el=>{ if(ratings[c.id]&&ratings[c.id][el.id]!=null) filled++; }));
  config.elements.forEach(el=>{ if(supplied[el.id]!=null) filled++; });

  const selC=combined.find(c=>c.id===selected), q=(quotes[selected]||{});
  const saveTxt={saving:'saving…',saved:'saved',error:'save error',idle:''}[saveState];

  return (
    <div className="content-wide fade">
      <button className="back-btn" onClick={onBack}>← Dashboard</button>
      <div className="topbar">
        <div><div className="sec-tag">Interview</div><div className="pg-title" style={{fontSize:'1.3rem'}}>{name||'New interview'}</div></div>
        <div style={{textAlign:'right'}}>
          <div className="mini">{filled}/{total} rated · {saveTxt}</div>
          <span className={"tag "+(status==='complete'?'done':'prog')} style={{marginTop:4,display:'inline-block'}}>{status}</span>
        </div>
      </div>

      <div className="card">
        <label className="field-lbl">Interviewee (display name)</label>
        <input className="inp inp-sm" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. P1 / initials"/>
        <p className="field-sub" style={{marginTop:'.6rem'}}>Rate each element {config.scaleMin} (left pole) to {config.scaleMax} (right pole). Prescribed constructs are shared; add this person's own elicited constructs below. Click a construct to attach a quote.</p>
        <GridTable elements={config.elements} elementNames={elementNames} constructs={combined}
          scaleMin={config.scaleMin} scaleMax={config.scaleMax} suppliedLeft={config.suppliedLeft} suppliedRight={config.suppliedRight}
          ratings={ratings} supplied={supplied} selected={selected}
          onSel={setSelected} onRate={rate} onRateSupplied={rateSup} onPole={setPole} onRemoveElicited={removeElicited}/>
        <div className="sp"/>
        <button className="btn-s btn-sm" onClick={addElicited}>+ Add elicited construct</button>
        <span className="mini" style={{marginLeft:8}}>{elicited.length} elicited · {prescribed.length} prescribed</span>
      </div>

      {selC&&(
        <div className="card">
          <div className="sec-tag">Quote</div>
          <div className="pg-title" style={{fontSize:'1.1rem',marginBottom:'.6rem'}}>{selC.left} vs {selC.right}</div>
          <textarea className="inp inp-ta" value={q.text||''} onChange={e=>setQuote(selected,{text:e.target.value})} placeholder="Illustrative quote…"/>
          <div className="sp"/>
          <input className="inp inp-sm" value={q.ref||''} onChange={e=>setQuote(selected,{ref:e.target.value})} placeholder="Reference (optional)"/>
        </div>
      )}

      <div className="btn-row"><div className="grow"/><button className="btn-p" onClick={()=>{setStatus('complete');scheduleSave('complete');}}>Mark interview complete</button></div>
    </div>
  );
}

/* ============================ 1 · Individual Honey ====================== */
// Per participant: their constructs ranked by similarity to the supplied
// "effectiveness" construct, with a bar toward the effective pole, band, quote.
function Analysis({config,responses,onOpen}){
  const withData=responses.filter(r=>{ const s=(r.data&&r.data.supplied)||{}; return config.elements.some(el=>s[el.id]!=null); });
  const [sel,setSel]=useState(withData[0]?withData[0].participant_id:'');
  const lo=config.scaleMin, hi=config.scaleMax;
  const r=responses.find(x=>x.participant_id===sel);
  const info=useMemo(()=>{
    if(!r) return null;
    const ratings=(r.data&&r.data.ratings)||{}, supplied=(r.data&&r.data.supplied)||{}, quotes=(r.data&&r.data.quotes)||{};
    const sArr=config.elements.map(el=> supplied[el.id]!=null?supplied[el.id]:null);
    if(sArr.every(v=>v==null)) return {rows:[],quotes};
    const cons=[...config.constructs,...((r.data&&r.data.elicited)||[])].map(c=>({id:c.id,left:c.left,right:c.right,
      ratings:config.elements.map(el=>(ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:null)}));
    return {rows:analyseGrid(cons,sArr,lo,hi).results.sort((a,b)=>a.rank-b.rank), quotes};
  },[r,config]);

  return (
    <div className="fade">
      <div className="inf-box">Step 1 — each interviewee's constructs, ranked by how closely they track the supplied “{config.suppliedLeft}” construct. The bar shows the effective pole; <b>H</b> = top third of this person's range, <b>I</b> = middle, <b>L</b> = bottom (individual Honey).</div>
      <div className="toolbar">
        <label className="field-lbl" style={{margin:0}}>Interviewee</label>
        <select className="inp inp-sm" style={{width:260,flex:'0 0 auto'}} value={sel} onChange={e=>setSel(e.target.value)}>
          {responses.map(r=><option key={r.participant_id} value={r.participant_id}>{r.participant_name||'(unnamed)'}</option>)}
        </select>
        <div className="grow"/>
        {r&&onOpen&&<button className="btn-s btn-sm" onClick={()=>onOpen(r)}>Edit this grid →</button>}
      </div>
      <div className="card">
        {!info||!info.rows.length ? <p className="muted small">No analysis yet — this grid and its supplied construct need ratings.</p> :
        <div className="scroll"><table className="grid">
          <thead><tr>
            <th style={{width:40}}>#</th><th className="pole">Effective pole</th><th style={{width:180}}>Association with effectiveness</th>
            <th className="pole">Contrast pole</th><th style={{width:70}}>Sim</th><th style={{width:54}}>Band</th>
          </tr></thead>
          <tbody>{info.rows.map(x=>{
            const pct=Math.round((x.similarity+1)/2*100);
            const eff = x.orientation==='aligned'? x.left : x.right;
            const opp = x.orientation==='aligned'? x.right : x.left;
            const q=(info.quotes[x.id]||{}).text;
            const col=x.band==='H'?'#16a34a':x.band==='L'?'#dc2626':'#c98a1e';
            return (
              <tr key={x.id}>
                <td>{x.rank}</td>
                <td className="pole"><b>{eff}</b>{q?<div className="mini" style={{maxWidth:260,whiteSpace:'normal'}}>“{q.slice(0,90)}{q.length>90?'…':''}”</div>:null}</td>
                <td><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{flex:1,height:10,background:'#efeae2',borderRadius:3,overflow:'hidden'}}><div style={{width:pct+'%',height:'100%',background:col}}/></div><span className="mini">{pct}%</span></div></td>
                <td className="pole muted">{opp}</td>
                <td>{x.similarity.toFixed(3)}</td>
                <td><span className={"badge "+x.band}>{x.band}</span></td>
              </tr>
            );
          })}</tbody>
        </table></div>}
      </div>
    </div>
  );
}

/* ============================ Composite constructs (categorisation) ====================== */
function CompositeConstructs({config,setConfig,responses,onSave,saving,savedMsg}){
  const categories=config.categories||[];
  const assignments=config.assignments||{};
  const members=useMemo(()=>pooledMembers(responses,config,null),[responses,config.elements,config.constructs]);
  const memberByKey=useMemo(()=>{const o={};members.forEach(m=>o[m.key]=m);return o;},[members]);
  const groups=useMemo(()=>suggestGroups(members.map(m=>({id:m.key,participantId:'',text:m.left+' vs '+m.right}))),[members]);
  const totalP=useMemo(()=>totalParticipants(members),[members]);

  const setCats=(cats)=>setConfig({...config,categories:cats});
  const setAssign=(a)=>setConfig({...config,assignments:a});
  const addCat=()=>setCats([...categories,{id:uid(),name:'New composite',left:'Preferred pole',leftDef:'',right:'Opposite pole',rightDef:'',quote:''}]);
  const editCat=(id,patch)=>setCats(categories.map(c=>c.id===id?{...c,...patch}:c));
  const delCat=(id)=>{ setCats(categories.filter(c=>c.id!==id));
    const a={...assignments}; Object.keys(a).forEach(k=>{if(a[k].cat===id)delete a[k];}); setAssign(a); };
  const unassign=(key)=>{ const a={...assignments}; delete a[key]; setAssign(a); };
  function assignGroup(grp, catId){
    const cat=categories.find(c=>c.id===catId); const a={...assignments};
    grp.forEach(it=>{ if(catId){ const m=memberByKey[it.id]; a[it.id]={cat:catId, flip:m&&cat?autoFlip(m.effLabel,cat):false}; } else delete a[it.id]; });
    setAssign(a);
  }
  function autoGenerate(){
    const cats=[]; const a={...assignments};
    groups.filter(g=>g.length>=3).slice(0,20).forEach(g=>{
      const m0=memberByKey[g[0].id];
      const cat={id:uid(), name:(m0?m0.effLabel:'Composite'), left:(m0?m0.left:'Left'), leftDef:'', right:(m0?m0.right:'Right'), rightDef:'', quote:''};
      cats.push(cat);
      g.forEach(it=>{ const m=memberByKey[it.id]; a[it.id]={cat:cat.id, flip:m?autoFlip(m.effLabel,cat):false}; });
    });
    setConfig({...config, categories:[...categories,...cats], assignments:a});
  }
  const Sup=({n})=> <sup style={{color:'#e07030',fontWeight:700}}>&nbsp;P{n}</sup>;
  const assignedCount=members.filter(m=>(assignments[m.key]||{}).cat).length;
  const unassignedGroups=groups.map(g=>g.filter(it=>!((assignments[it.id]||{}).cat))).filter(g=>g.length);
  const [busy,setBusy]=useState('');
  const [coding,setCoding]=useState(null);      // coderId currently coding by hand
  const [onlyUncoded,setOnlyUncoded]=useState(true);

  // Derive categories from the data using the encoded Jankowicz/Honey method.
  async function derive(){
    if(!window.confirm('Derive composite constructs from all '+members.length+' constructs?\n\nThis proposes fresh categories (bottom-up) and REPLACES the current list.')) return;
    setBusy('Deriving categories…');
    try{
      const j=await api('/api/rep-grid-derive',{constructs:members.map(m=>({left:m.left,right:m.right})),target:14,domain:config.title});
      const cats=(j.categories||[]).map(c=>({id:uid(),name:c.name,left:c.left,leftDef:c.leftDef||'',right:c.right,rightDef:c.rightDef||'',quote:''}));
      if(!cats.length) throw new Error('no categories returned');
      setConfig({...config, categories:cats, assignments:{}});
      setBusy('');
      alert('Derived '+cats.length+' composite constructs. Review/edit them, then use “AI assign constructs”.');
    }catch(e){ setBusy(''); alert('Derive failed: '+e.message); }
  }
  // ---- Coder panel: up to 4 coders, each AI (with a reasoning stance) or human.
  const STANCES={A:'Definition-led',B:'Participant-language-led',C:'Contrast-led',D:'Exemplar-led'};
  const meta=config.coderMeta||[];
  const coders=config.coders||{};
  const catName=(id)=>(categories.find(c=>c.id===id)||{}).name||'—';
  const setMeta=(m)=>setConfig({...config,coderMeta:m});
  const addCoder=(type)=>{
    if(meta.length>=4){ alert('Maximum of 4 coders.'); return; }
    const used=meta.filter(m=>m.type==='ai').map(m=>m.stance);
    const stance=['A','B','C','D'].find(s=>!used.includes(s))||'A';
    const id='cd'+Date.now().toString(36);
    setMeta([...meta,{id,type,stance:type==='ai'?stance:null,
      name:type==='ai'?('AI · '+STANCES[stance]):('Human coder '+(meta.filter(m=>m.type==='human').length+1))}]);
  };
  const editCoder=(id,patch)=>setMeta(meta.map(m=>m.id===id?{...m,...patch}:m));
  const delCoder=(id)=>{ const c={...coders}; delete c[id]; setConfig({...config,coderMeta:meta.filter(m=>m.id!==id),coders:c}); };

  async function runAiCoder(cd){
    if(!categories.length){ alert('Create or derive composite constructs first.'); return; }
    const cats=categories.map(c=>({id:c.id,name:c.name,left:c.left,leftDef:c.leftDef,right:c.right,rightDef:c.rightDef}));
    const out={}; const B=60;
    for(let i=0;i<members.length;i+=B){
      setBusy(cd.name+' coding… '+Math.min(i+B,members.length)+'/'+members.length);
      const batch=members.slice(i,i+B);
      try{
        const j=await api('/api/rep-grid-classify',{constructs:batch.map(m=>({id:m.key,left:m.left,right:m.right})),categories:cats,pass:cd.stance});
        (j.assignments||[]).forEach(x=>{ if(x&&x.id&&x.cat&&cats.some(c=>c.id===x.cat)) out[x.id]={cat:x.cat, flip:!!x.flip}; });
      }catch(e){}
    }
    setConfig({...config, coders:{...coders,[cd.id]:out}});
    setBusy('');
    alert(cd.name+' coded '+Object.keys(out).length+' of '+members.length+' constructs.');
  }
  // Reliability across every coder that has coded anything.
  const activeIds=meta.filter(m=>coders[m.id]&&Object.keys(coders[m.id]).length).map(m=>m.id);
  const sets=activeIds.map(id=>coders[id]);
  const stats=useMemo(()=> sets.length>=2? multiStats(sets):null,[config.coders,config.coderMeta]);
  function acceptAllAgreed(){
    if(!stats) return;
    const a={...assignments}; let n=0;
    Object.keys(sets[0]).forEach(k=>{ if(sets.every(s=>s[k]&&s[k].cat===sets[0][k].cat)){ a[k]={cat:sets[0][k].cat,flip:sets[0][k].flip}; n++; } });
    setConfig({...config,assignments:a}); alert('Accepted '+n+' unanimous codes.');
  }
  function acceptMajority(){
    const a={...assignments}; let n=0;
    (stats?stats.disagree:[]).forEach(k=>{ const p=majorityPick(sets,k); if(p){ a[k]={cat:p.cat,flip:p.flip}; n++; } });
    setConfig({...config,assignments:a}); alert('Accepted '+n+' majority codes. Ties left for you.');
  }
  function adjudicate(key, coderId){
    const pick=(coders[coderId]||{})[key]; if(!pick) return;
    setConfig({...config, assignments:{...assignments, [key]:{cat:pick.cat, flip:pick.flip}}});
  }
  // Human coding: set this coder's code for one construct.
  function humanCode(coderId, key, catId){
    const cur={...(coders[coderId]||{})};
    if(!catId) delete cur[key];
    else { const cat=categories.find(c=>c.id===catId); const m=memberByKey[key];
      cur[key]={cat:catId, flip:m&&cat?autoFlip(m.effLabel,cat):false}; }
    setConfig({...config, coders:{...coders,[coderId]:cur}});
  }

  // ---- Human coding view (one coder, coding independently) ----
  if(coding){
    const cd=meta.find(m=>m.id===coding)||{name:'Coder'};
    const mine=coders[coding]||{};
    const doneN=Object.keys(mine).length;
    const list=(onlyUncoded? members.filter(m=>!mine[m.key]) : members);
    return (
      <div className="fade">
        <button className="back-btn" onClick={()=>setCoding(null)}>← Back to coders</button>
        <div className="inf-box">Coding as <b>{cd.name}</b>. Code independently — don't consult the other coders; the reliability statistic only means something if the passes are genuinely separate. <b>{doneN}/{members.length}</b> coded.</div>
        <div className="toolbar">
          <label className="anon-toggle"><input type="checkbox" checked={onlyUncoded} onChange={e=>setOnlyUncoded(e.target.checked)}/> Show only uncoded</label>
          <div className="grow"/>
          {savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}
          <button className="btn-p btn-sm" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save coding'}</button>
        </div>
        <div className="card">
          {list.length===0 && <p className="mini">Nothing left to code.</p>}
          {list.slice(0,250).map(m=>(
            <div className="list-row" key={m.key}>
              <span style={{flex:1,fontSize:'.82rem'}}>{m.left} <span className="mini">vs</span> {m.right}<Sup n={m.pnum}/></span>
              <select className="inp inp-sm" style={{width:230,flex:'0 0 auto'}} value={(mine[m.key]||{}).cat||''} onChange={e=>humanCode(coding,m.key,e.target.value)}>
                <option value="">— uncoded —</option>
                {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          ))}
          {list.length>250 && <p className="mini">Showing 250 of {list.length}. Code these, then the next batch appears.</p>}
        </div>
      </div>
    );
  }

  return (
    <div className="fade">
      <div className="inf-box">Step 2 — group everyone's constructs (in the interviewee's own words) into <b>composite constructs</b> (your researcher categories), à la Jankowicz. Superscripts show which participant each construct came from. {members.length} constructs · {assignedCount} assigned · {totalP} participants.</div>

      <div className="toolbar">
        <div className="sec-tag" style={{margin:0}}>Composite constructs ({categories.length})</div>
        <div className="grow"/>
        {busy && <span className="small" style={{color:'#e07030'}}>{busy}</span>}
        <button className="btn-s btn-sm" disabled={!!busy} onClick={derive}>✦ Derive from data</button>
        <button className="btn-s btn-sm" onClick={addCat}>+ Add composite</button>
      </div>

      {/* ---- Coding panel: AI only / AI + human / human only ---- */}
      <div className="card">
        <div className="toolbar">
          <div className="sec-tag" style={{margin:0}}>Coders ({meta.length}/4)</div>
          <div className="grow"/>
          <button className="btn-s btn-sm" disabled={meta.length>=4} onClick={()=>addCoder('ai')}>+ AI coder</button>
          <button className="btn-s btn-sm" disabled={meta.length>=4} onClick={()=>addCoder('human')}>+ Human coder</button>
        </div>
        <p className="field-sub">Add up to four independent coders — any mix of AI and human. Each codes the full set alone; the tool then reports inter-rater reliability and asks you to settle only the disagreements (Jankowicz's reconciliation step).</p>
        {meta.length===0 && <p className="mini">No coders yet. Add two or more to get a reliability statistic.</p>}
        {meta.map(cd=>{
          const n=Object.keys(coders[cd.id]||{}).length;
          return (
            <div className="list-row" key={cd.id}>
              <span className="tag" style={cd.type==='ai'?{background:'#f0e2d5',color:'#b5651a'}:{background:'#dcefe0',color:'#16794a'}}>{cd.type==='ai'?'AI':'HUMAN'}</span>
              <input className="inp inp-sm" style={{flex:2}} value={cd.name} onChange={e=>editCoder(cd.id,{name:e.target.value})}/>
              {cd.type==='ai'
                ? <select className="inp inp-sm" style={{width:190,flex:'0 0 auto'}} value={cd.stance||'A'} onChange={e=>editCoder(cd.id,{stance:e.target.value,name:'AI · '+STANCES[e.target.value]})}>
                    {Object.keys(STANCES).map(s=><option key={s} value={s}>{STANCES[s]}</option>)}
                  </select>
                : <span className="mini" style={{width:190}}>codes manually</span>}
              <span className="mini" style={{minWidth:74}}>{n}/{members.length}</span>
              {cd.type==='ai'
                ? <button className="btn-p btn-sm" disabled={!!busy} onClick={()=>runAiCoder(cd)}>Run</button>
                : <button className="btn-p btn-sm" onClick={()=>setCoding(cd.id)}>Code</button>}
              <button className="x" onClick={()=>delCoder(cd.id)}>✕</button>
            </div>
          );
        })}
      </div>

      {stats && (
        <div className="card">
          <div className="sec-tag">Inter-rater reliability — {activeIds.length} coders</div>
          <div className="row" style={{alignItems:'center'}}>
            <div><div className="mini">Unanimous agreement</div><div style={{fontSize:'1.4rem',fontWeight:700,color:'#16a34a'}}>{(stats.po*100).toFixed(1)}%</div></div>
            <div><div className="mini">{stats.kind}</div><div style={{fontSize:'1.4rem',fontWeight:700}}>{stats.kappa.toFixed(2)}</div></div>
            <div><div className="mini">Agreed</div><div style={{fontSize:'1.4rem',fontWeight:700}}>{stats.unanimous}</div></div>
            <div><div className="mini">To settle</div><div style={{fontSize:'1.4rem',fontWeight:700,color:'#dc2626'}}>{stats.disagree.length}</div></div>
          </div>
          <div className="btn-row" style={{marginTop:'.6rem'}}>
            <button className="btn-s btn-sm" onClick={acceptAllAgreed}>Accept unanimous</button>
            {activeIds.length>=3 && <button className="btn-s btn-sm" onClick={acceptMajority}>Accept majority</button>}
          </div>
          <p className="field-sub" style={{marginTop:'.4rem'}}>{activeIds.length===2?'Cohen’s κ':'Fleiss’ κ'} over the {stats.n} constructs all coders coded. κ &gt; 0.80 is conventionally “almost perfect”, 0.61–0.80 “substantial”.</p>
        </div>
      )}

      {stats && stats.disagree.length>0 && (
        <div className="card">
          <div className="sec-tag">Disagreements to settle ({stats.disagree.length})</div>
          {stats.disagree.slice(0,120).map(k=>{
            const m=memberByKey[k]; if(!m) return null;
            const cur=(assignments[k]||{}).cat;
            return (
              <div className="list-row" key={k} style={{alignItems:'flex-start'}}>
                <span style={{flex:1,fontSize:'.82rem'}}>{m.left} <span className="mini">vs</span> {m.right}<Sup n={m.pnum}/></span>
                {activeIds.map(id=>{
                  const pick=coders[id][k]; if(!pick) return null;
                  const cd=meta.find(x=>x.id===id);
                  return <button key={id} className="btn-s btn-sm" title={cd.name}
                    style={cur===pick.cat?{borderColor:'#16a34a',fontWeight:700}:{}}
                    onClick={()=>adjudicate(k,id)}>{(cd.type==='ai'?'🤖':'🧑')} {catName(pick.cat)}</button>;
                })}
              </div>
            );
          })}
          {stats.disagree.length>120 && <p className="mini">Showing first 120 of {stats.disagree.length}.</p>}
        </div>
      )}
      {categories.length===0 && <p className="muted small">None yet. Auto-generate to seed categories from similar constructs, then rename and edit definitions.</p>}
      {categories.map(cat=>{
        const mem=members.filter(m=>(assignments[m.key]||{}).cat===cat.id);
        const uniq=new Set(mem.map(m=>m.participant)).size;
        return (
          <div className="card" key={cat.id}>
            <div className="toolbar" style={{marginBottom:6}}>
              <input className="inp inp-sm" style={{maxWidth:240,fontWeight:700}} value={cat.name} onChange={e=>editCat(cat.id,{name:e.target.value})}/>
              <span className="tag">{mem.length} constructs · {uniq} ppts · {totalP?Math.round(uniq/totalP*100):0}%</span>
              <div className="grow"/>
              <button className="x" onClick={()=>delCat(cat.id)}>✕</button>
            </div>
            <div className="row">
              <div><label className="field-lbl">Preferred pole (+ definition)</label>
                <input className="inp inp-sm" value={cat.left} onChange={e=>editCat(cat.id,{left:e.target.value})}/>
                <textarea className="inp inp-sm" rows={2} placeholder="definition…" value={cat.leftDef||''} onChange={e=>editCat(cat.id,{leftDef:e.target.value})} style={{marginTop:4}}/></div>
              <div><label className="field-lbl">Opposite pole (+ definition)</label>
                <input className="inp inp-sm" value={cat.right} onChange={e=>editCat(cat.id,{right:e.target.value})}/>
                <textarea className="inp inp-sm" rows={2} placeholder="definition…" value={cat.rightDef||''} onChange={e=>editCat(cat.id,{rightDef:e.target.value})} style={{marginTop:4}}/></div>
            </div>
            <div className="field" style={{marginTop:8}}><label className="field-lbl">Illustrative quote</label>
              <input className="inp inp-sm" value={cat.quote||''} onChange={e=>editCat(cat.id,{quote:e.target.value})} placeholder="“…”"/></div>
            <div>{mem.length?mem.map(m=><span className="chip" key={m.key} style={{cursor:'pointer'}} title="click to remove" onClick={()=>unassign(m.key)}>{m.left} vs {m.right}<Sup n={m.pnum}/></span>):<span className="mini">No constructs assigned yet — use the pool below.</span>}</div>
          </div>
        );
      })}

      <div className="card">
        <div className="sec-tag">Assign remaining constructs ({members.length-assignedCount})</div>
        <p className="field-sub">Every unassigned construct, verbatim, grouped by similarity. Assign a whole group to a composite; click any assigned chip above to remove it.</p>
        {unassignedGroups.length===0 && <p className="mini">All constructs assigned.</p>}
        {unassignedGroups.map((g,i)=>(
          <div className="list-row" key={i} style={{alignItems:'flex-start'}}>
            <div style={{flex:1}}>{g.map(it=>{const m=memberByKey[it.id]; return <span className="chip" key={it.id}>{m.left} vs {m.right}<Sup n={m.pnum}/></span>;})}</div>
            <select className="inp inp-sm" style={{width:210,flex:'0 0 auto'}} value="" onChange={e=>assignGroup(g,e.target.value)}>
              <option value="">assign to…</option>
              {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
        ))}
      </div>

      <div className="btn-row">
        <div className="grow"/>
        {savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}
        <button className="btn-p" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save categorisation'}</button>
      </div>
    </div>
  );
}

/* ============================ Composite Honey table ====================== */
const CAT_FULL={SL:'System Leadership',TL:'Traditional Leadership',FL:'Future Leadership'};
function catFull(c){ return CAT_FULL[c]||c; }
function CompositeTable({config,responses}){
  const elemCats=[...new Set(config.elements.map(e=>e.category).filter(Boolean))];
  const [seg,setSeg]=useState('all');
  const categories=config.categories||[], assignments=config.assignments||{};
  const memAll=useMemo(()=>pooledMembers(responses,config,null),[responses,config.elements,config.constructs]);
  const totalP=totalParticipants(memAll);
  const fixedOrient=useMemo(()=>fixedOrientOf(memAll),[memAll]);
  const rowsFor=(filter)=> compositeRows(pooledMembers(responses,config,filter),categories,assignments,totalP,fixedOrient);
  const all=useMemo(()=>rowsFor(null),[responses,config,seg]);
  const segRows=useMemo(()=> (seg==='all'||seg==='compare')?null:rowsFor(seg),[responses,config,seg]);
  const cmp=useMemo(()=> (seg==='compare'&&elemCats.length>=2)? elemCats.map(c=>({c, rows:rowsFor(c)})):null,[responses,config,seg]);

  if(categories.length===0) return <div className="inf-box">Build your composite constructs first (tab 2). This tab then aggregates them into James's Honey Content Table.</div>;

  const bar=(l)=> <div style={{display:'inline-flex',width:70,height:10,borderRadius:3,overflow:'hidden',border:'1px solid #d8d3cb',verticalAlign:'middle'}}>
    <div style={{width:l+'%',background:'#3f7d4e'}}/><div style={{flex:1,background:'#efeae2'}}/></div>;

  function HoneyTable({rows,title}){
    return (
      <div style={{marginBottom:18}}>
        {title&&<div className="sec-tag">{title}</div>}
        <div className="scroll"><table className="grid">
          <thead><tr>
            <th className="pole">Construct category</th><th style={{width:60}}>Unique freq %</th>
            <th className="pole">Preferred pole</th><th style={{width:120}}>Mean similarity %</th>
            <th className="pole">Opposite pole</th><th style={{width:70}}>Mean sim %</th>
            <th style={{width:110}}>Preference</th><th style={{width:48}}>H%</th><th style={{width:48}}>I%</th><th style={{width:48}}>L%</th>
          </tr></thead>
          <tbody>
            {rows.filter(r=>r.n>0).map(r=>(
              <tr key={r.cat.id}>
                <td className="pole"><b>{r.cat.name}</b>{r.cat.quote?<div className="mini" style={{maxWidth:180,whiteSpace:'normal'}}>“{r.cat.quote.slice(0,70)}”</div>:null}</td>
                <td>{Math.round(r.uniquePct)}%</td>
                <td className="pole" style={{maxWidth:200,whiteSpace:'normal'}}>{r.cat.left}{r.cat.leftDef?<div className="mini">{r.cat.leftDef.slice(0,60)}</div>:null}</td>
                <td>{bar(r.left)} <b>{r.left.toFixed(0)}%</b></td>
                <td className="pole muted" style={{maxWidth:200,whiteSpace:'normal'}}>{r.cat.right}</td>
                <td>{r.right.toFixed(0)}%</td>
                <td>{r.pref}</td>
                <td>{r.H.toFixed(0)}</td><td>{r.I.toFixed(0)}</td><td>{r.L.toFixed(0)}</td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>
    );
  }
  function Comparative(){
    const byCat=elemCats.map(c=>({c, rows:rowsFor(c)}));
    const catRows=categories.map((cat,i)=>({cat, cells:byCat.map(b=>b.rows.find(r=>r.cat.id===cat.id))}));
    return (
      <div className="scroll"><table className="grid">
        <thead><tr><th className="pole">Construct area</th>{elemCats.map(c=><th key={c} className="pole">{catFull(c)}</th>)}</tr></thead>
        <tbody>{catRows.filter(x=>x.cells.some(c=>c&&c.n>0)).map(x=>(
          <tr key={x.cat.id}>
            <td className="pole"><b>{x.cat.left}</b> <span className="mini">vs</span> {x.cat.right}</td>
            {x.cells.map((c,j)=><td key={j} className="pole" style={{whiteSpace:'normal'}}>{c&&c.n? c.pref+' — '+c.left.toFixed(0)+'% '+x.cat.left : '—'}</td>)}
          </tr>
        ))}</tbody>
      </table></div>
    );
  }

  return (
    <div className="fade">
      <div className="inf-box">Step 3 — James's <b>Honey Content Table</b>: each composite construct's preferred-pole mean similarity to the supplied “{config.suppliedLeft}” construct, and its H/I/L spread. Run over all elements, or split by element category. {elemCats.map(c=>c+' = '+catFull(c)).join(' · ')}.</div>
      <div className="toolbar">
        <button className="btn-s btn-sm" style={seg==='all'?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg('all')}>All elements</button>
        {elemCats.map(c=><button key={c} className="btn-s btn-sm" style={seg===c?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg(c)}>{catFull(c)}</button>)}
        {elemCats.length>=2 && <button className="btn-s btn-sm" style={seg==='compare'?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg('compare')}>Comparative</button>}
      </div>
      <div className="card">
        {seg==='all' && <HoneyTable rows={all}/>}
        {segRows && <HoneyTable rows={segRows} title={catFull(seg)+' situations only (Honey Content Table)'}/>}
        {cmp && <Comparative/>}
        <p className="mini" style={{marginTop:'.6rem'}}>Mean similarity % = average Honey similarity of the composite's preferred pole to the supplied “{config.suppliedLeft}” construct across its member constructs. Unique freq % = share of participants with a construct in the category. H/I/L% = band spread. Following Honey (1979) / Jankowicz (2004).</p>
      </div>
    </div>
  );
}

/* ============================ Dashboard ====================== */
function Dashboard({code, onSignOut}){
  const [tab,setTab]=useState('setup');
  const [config,setConfig]=useState(null);
  const [responses,setResponses]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [savedMsg,setSavedMsg]=useState('');
  const [active,setActive]=useState(null);

  async function reload(){
    const j=await api('/api/rep-grid-load',{session_code:code});
    const cfg=(j.config&&j.config.data&&j.config.data.title!=null)? j.config.data
      : {title:'',scaleMin:1,scaleMax:10,suppliedLeft:'Highly effective',suppliedRight:'Not effective at all',elements:[],constructs:[]};
    cfg.categories=cfg.categories||[]; cfg.assignments=cfg.assignments||{};
    setConfig(cfg); setResponses(j.responses||[]); setLoading(false);
  }
  useEffect(()=>{ reload().catch(e=>{ setLoading(false); alert('Load failed: '+e.message); }); /* eslint-disable-next-line */ },[]);

  async function saveConfig(){
    setSaving(true); setSavedMsg('');
    try{ await saveWithRetry({kind:'config',session_code:code,data:config}); setSavedMsg('Saved ✓'); setTimeout(()=>setSavedMsg(''),2500); }
    catch(e){ alert('Save failed: '+e.message); }
    setSaving(false);
  }
  function newInterview(){ setActive({participant_id:uid(),participant_name:'',data:{ratings:{},supplied:{},quotes:{},status:'in_progress'}}); }
  async function deleteResponse(r){
    if(!window.confirm('Delete interview “'+(r.participant_name||'unnamed')+'”?\n\nThis permanently removes the grid and cannot be undone.')) return;
    try{ await api('/api/rep-grid-save',{kind:'delete-response',session_code:code,participant_id:r.participant_id}); reload(); }
    catch(e){ alert('Delete failed: '+e.message); }
  }

  if(loading) return <div className="content"><p className="muted">Loading session…</p></div>;
  if(active) return <Interview config={config} code={code} resp={active} onBack={()=>{ setActive(null); reload(); }}/>;

  return (
    <div className="content-wide fade">
      <div className="topbar">
        <div><div className="land-tag" style={{marginBottom:'.3rem'}}>Rep-Grid</div>
          <div className="pg-title" style={{margin:0}}>{config.title||'Untitled study'}</div></div>
        <div style={{display:'flex',gap:'.6rem',alignItems:'center'}}>
          <span className="code">{code}</span>
          <button className="btn-s btn-sm" onClick={onSignOut}>Sign out</button>
        </div>
      </div>
      <div className="fac-tab-bar">
        <button className={"fac-tab"+(tab==='setup'?' active':'')} onClick={()=>setTab('setup')}>Setup</button>
        <button className={"fac-tab"+(tab==='interviews'?' active':'')} onClick={()=>setTab('interviews')}>Interviews</button>
        <button className={"fac-tab"+(tab==='individual'?' active':'')} onClick={()=>setTab('individual')}>1 · Individual Honey</button>
        <button className={"fac-tab"+(tab==='composite'?' active':'')} onClick={()=>setTab('composite')}>2 · Composite constructs</button>
        <button className={"fac-tab"+(tab==='table'?' active':'')} onClick={()=>setTab('table')}>3 · Composite table</button>
      </div>
      {tab==='setup'&&<Setup config={config} setConfig={setConfig} onSave={saveConfig} saving={saving} savedMsg={savedMsg}/>}
      {tab==='interviews'&&<Interviews config={config} responses={responses} onOpen={setActive} onNew={newInterview} onDelete={deleteResponse}/>}
      {tab==='individual'&&<Analysis config={config} responses={responses} onOpen={setActive}/>}
      {tab==='composite'&&<CompositeConstructs config={config} setConfig={setConfig} responses={responses} onSave={saveConfig} saving={saving} savedMsg={savedMsg}/>}
      {tab==='table'&&<CompositeTable config={config} responses={responses}/>}
    </div>
  );
}

/* ============================ Root ====================== */
function App(){
  const [code,setCode]=useState(null);
  if(!code) return <Gate onUnlock={setCode}/>;
  return <Dashboard code={code} onSignOut={()=>setCode(null)}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
