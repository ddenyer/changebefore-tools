/* ============================ 1 · Individual Honey ====================== */
// Per participant: their constructs ranked by similarity to the supplied
// "effectiveness" construct, with a bar toward the effective pole, band, quote.
function Analysis({config,responses,onOpen}){
  const withData=responses.filter(r=>{ const s=(r.data&&r.data.supplied)||{}; return config.elements.some(el=>s[el.id]!=null); });
  const [sel,setSel]=useState(withData[0]?withData[0].participant_id:'');
  const [showMaps,setShowMaps]=useState(false);
  const lo=config.scaleMin, hi=config.scaleMax;
  const r=responses.find(x=>x.participant_id===sel);
  const info=useMemo(()=>{
    if(!r) return null;
    const ratings=(r.data&&r.data.ratings)||{}, supplied=(r.data&&r.data.supplied)||{}, quotes=(r.data&&r.data.quotes)||{}, noPol=(r.data&&r.data.noPolarity)||{};
    const els=elementsFor(config,r,null);   // this interview's elements, supplementary held out
    const sArr=els.map(el=> supplied[el.id]!=null?supplied[el.id]:null);
    if(sArr.every(v=>v==null)) return {rows:[],quotes,excluded:0,maps:null};
    const allCons=[...config.constructs,...((r.data&&r.data.elicited)||[])];
    const cons=allCons.filter(c=>!noPol[c.id]).map(c=>({id:c.id,left:c.left,right:c.right,
      ratings:els.map(el=>(ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:null)}));
    // Grid maps use all rated constructs (with data), incl. any flagged.
    const mapCons=allCons.filter(c=> els.some(el=> ratings[c.id]&&ratings[c.id][el.id]!=null));
    const M=mapCons.map(c=> els.map(el=> (ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:null));
    let maps=null;
    if(mapCons.length>=2 && els.length>=2){
      const anv=averageVariability(M,lo,hi);
      const bip=pcaBiplot(M,lo,hi);
      const cOrder=focusOrder(simMatrix(M,hi-lo));
      const eOrder=focusOrder(simMatrix(els.map((_,j)=>M.map(row=>row[j])),hi-lo));
      maps={els,cons:mapCons,M,anv,bip,cOrder,eOrder};
    }
    return {rows:analyseGrid(cons,sArr,lo,hi).results.sort((a,b)=>a.rank-b.rank), quotes, excluded:allCons.length-cons.length, maps};
  },[r,config]);

  // Every grid: raw ratings (all elements incl. supplementary) + Honey + quotes.
  function exportGrids(){
    const rows=[];
    responses.forEach(resp=>{
      const els=gridElementsFor(config,resp);          // this interview's elements (incl. supplementary)
      const hEls=elementsFor(config,resp,null);         // Honey subset (supplementary out)
      const d=resp.data||{}; const ratings=d.ratings||{}, supplied=d.supplied||{}, quotes=d.quotes||{};
      const names=d.elementNames||els.map(e=>e.name);
      const sArr=hEls.map(el=> supplied[el.id]!=null?supplied[el.id]:null);
      const cons=[...config.constructs,...(d.elicited||[])];
      let res=[];
      if(!sArr.every(v=>v==null)){
        res=analyseGrid(cons.map(c=>({id:c.id,left:c.left,right:c.right,
          ratings:hEls.map(el=>(ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:null)})),sArr,lo,hi).results;
      }
      const byId={}; res.forEach(x=>byId[x.id]=x);
      rows.push(['Participant', resp.participant_name||resp.participant_id]);
      rows.push(['Left pole', ...els.map((e,i)=>(names[i]||e.name)+(e.category?' ['+e.category+']':'')+(e.supplementary?' (suppl.)':'')), 'Right pole','Similarity','Band','Rank','Quote','Ref']);
      cons.forEach(c=>{
        const x=byId[c.id]||{}; const q=quotes[c.id]||{};
        rows.push([c.left, ...els.map(el=> (ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:''), c.right,
          x.similarity!=null?x.similarity.toFixed(4):'', x.band||'', x.rank||'', q.text||'', q.ref||'']);
      });
      rows.push([config.suppliedLeft+' (supplied)', ...els.map(el=> supplied[el.id]!=null?supplied[el.id]:''), config.suppliedRight,'','','','','']);
      rows.push([]);
    });
    downloadCsv(rows, slug(config.title)+'_grids_and_Honey.csv');
  }

  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Step 1 · Individual Honey (one person at a time)</span>Pick an interviewee to see their constructs ranked by how closely each one tracks the supplied “{config.suppliedLeft}” construct — this is <b>Honey’s (1979) individual analysis</b>. The bar shows how strongly each construct points toward the effective pole, and each is banded <b>H</b> (top third of that person’s range), <b>I</b> (middle) or <b>L</b> (bottom) so you can see which of their ideas matter most. This is a per-person view; the shared picture across everyone comes in steps 2 and 3.</div>
      {responses.length===0 && <div className="inf-box">No interviews yet — run one in the <b>Interviews</b> tab and this analysis fills in automatically.</div>}
      <div className="toolbar">
        <label className="field-lbl" style={{margin:0}}>Interviewee</label>
        <select className="inp inp-sm" style={{width:260,flex:'0 0 auto'}} value={sel} onChange={e=>setSel(e.target.value)}>
          {responses.map(r=><option key={r.participant_id} value={r.participant_id}>{r.participant_name||'(unnamed)'}</option>)}
        </select>
        <div className="grow"/>
        <button className="btn-s btn-sm" onClick={exportGrids}>Export grids + Honey</button>
        {r&&onOpen&&<button className="btn-s btn-sm" onClick={()=>onOpen(r)}>Edit this grid →</button>}
      </div>
      <div className="card">
        {!info||!info.rows.length ? <p className="muted small">No analysis yet — this grid and its supplied construct need ratings.</p> :
        <div className="scroll"><table className="grid">
          <thead><tr>
            <th style={{width:40}}>#</th><th className="pole">Effective pole</th><th style={{width:180}}>Association with effectiveness</th>
            <th className="pole">Contrast pole</th><th style={{width:70}}>Sim</th><th style={{width:54}}>Band</th>
          </tr></thead>
          <tbody>{info.rows.map(x=>{
            const pct=Math.round((x.similarity+1)/2*100);
            const eff = x.orientation==='aligned'? x.left : x.right;
            const opp = x.orientation==='aligned'? x.right : x.left;
            const q=(info.quotes[x.id]||{}).text;
            const col=x.band==='H'?'#16a34a':x.band==='L'?'#dc2626':'#c98a1e';
            return (
              <tr key={x.id}>
                <td>{x.rank}</td>
                <td className="pole"><b>{eff}</b>{q?<div className="mini" style={{maxWidth:260,whiteSpace:'normal'}}>“{q.slice(0,90)}{q.length>90?'…':''}”</div>:null}</td>
                <td><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{flex:1,height:10,background:'#efeae2',borderRadius:3,overflow:'hidden'}}><div style={{width:pct+'%',height:'100%',background:col}}/></div><span className="mini">{pct}%</span></div></td>
                <td className="pole muted">{opp}</td>
                <td>{x.similarity.toFixed(3)}</td>
                <td><span className={"badge "+x.band}>{x.band}</span></td>
              </tr>
            );
          })}</tbody>
        </table></div>}
        {info&&info.excluded>0 && <p className="mini" style={{marginTop:'.5rem'}}>{info.excluded} construct(s) flagged “no clear polarity” and excluded from this Honey ranking (set in the interview grid).</p>}
      </div>

      {info&&info.maps && (
        <div className="card">
          <div className="toolbar" style={{marginBottom:6}}>
            <div className="sec-tag" style={{margin:0}}>Grid maps (Idiogrid-style)</div>
            <span className="tag">Avg variability {info.maps.anv.toFixed(0)}%</span>
            <div className="grow"/>
            <button className="btn-s btn-sm" onClick={()=>setShowMaps(!showMaps)}>{showMaps?'Hide':'Show FOCUS + PrinGrid'}</button>
          </div>
          <p className="field-sub">Average Normal Variability = mean spread of each construct's ratings across the elements (0 = flat, 100 = maximally discriminating). Show the maps for the FOCUS two-way cluster grid and the PrinGrid/PCA biplot.</p>
          {showMaps && <GridMaps maps={info.maps} scaleMin={lo} scaleMax={hi}/>}
        </div>
      )}
    </div>
  );
}

/* PrinGrid biplot + FOCUS-clustered grid for one participant. */
function GridMaps({maps,scaleMin,scaleMax}){
  const {els,cons,M,bip,cOrder,eOrder}=maps;
  const W=560,H=380,cx=W/2,cy=H/2;
  const pts=[...bip.elem, ...bip.con];
  const maxR=Math.max(0.001,...pts.map(p=>Math.hypot(p[0],p[1])));
  const sc=(Math.min(W,H)/2-46)/maxR;
  const X=x=>cx+x*sc, Y=y=>cy-y*sc;
  const shade=v=>{ if(v==null) return '#f4f3f0'; const t=(v-scaleMin)/(scaleMax-scaleMin); const g=Math.round(230-150*t); return 'rgb('+Math.round(224-(224-31)*t)+','+Math.round(224-(224-125)*t)+','+Math.round(216-(216-70)*t)+')'; };
  return (
    <div>
      <div className="sec-tag" style={{marginTop:'.4rem'}}>PrinGrid biplot — PC1 {bip.pct[0].toFixed(0)}% · PC2 {bip.pct[1].toFixed(0)}%</div>
      <div className="scroll"><svg width={W} height={H} style={{border:'1px solid #d8d3cb',borderRadius:4,background:'#fff'}}>
        <line x1={0} y1={cy} x2={W} y2={cy} stroke="#e0ddd8"/><line x1={cx} y1={0} x2={cx} y2={H} stroke="#e0ddd8"/>
        {bip.con.map((p,i)=>(<g key={'c'+i}>
          <line x1={cx} y1={cy} x2={X(p[0])} y2={Y(p[1])} stroke="#e0ddd8"/>
          <circle cx={X(p[0])} cy={Y(p[1])} r={2.5} fill="#c98a1e"/>
          <text x={X(p[0])+3} y={Y(p[1])-2} fontSize="8" fill="#8a6a1e">{(cons[i].left||'').slice(0,16)}</text>
        </g>))}
        {bip.elem.map((p,i)=>(<g key={'e'+i}>
          <circle cx={X(p[0])} cy={Y(p[1])} r={5} fill="#2f5bd7"/>
          <text x={X(p[0])+7} y={Y(p[1])+3} fontSize="10" fontWeight="700" fill="#1a1a1a">{(els[i].name||'').slice(0,20)}</text>
        </g>))}
      </svg></div>
      <div className="sec-tag" style={{marginTop:'.8rem'}}>FOCUS grid — rows &amp; columns reordered so similar items sit together</div>
      <div className="scroll"><table className="grid" style={{fontSize:'.72rem'}}>
        <thead><tr><th className="pole">Construct (left pole)</th>{eOrder.map(j=><th key={j} style={{writingMode:'vertical-rl',height:70}}>{(els[j].name||'').slice(0,16)}</th>)}<th className="pole">Right pole</th></tr></thead>
        <tbody>{cOrder.map(ri=>(
          <tr key={ri}><td className="pole">{cons[ri].left}</td>
            {eOrder.map(j=><td key={j} style={{background:shade(M[ri][j]),color:'#1a1a1a',textAlign:'center'}}>{M[ri][j]!=null?M[ri][j]:''}</td>)}
            <td className="pole muted">{cons[ri].right}</td></tr>
        ))}</tbody>
      </table></div>
    </div>
  );
}

/* ============================ Composite constructs (categorisation) ====================== */
function CompositeConstructs({config,setConfig,responses,onSave,saving,savedMsg,readOnly}){
  const categories=config.categories||[];
  const assignments=config.assignments||{};
  const members=useMemo(()=>pooledMembers(responses,config,null),[responses,config.elements,config.constructs]);
  const memberByKey=useMemo(()=>{const o={};members.forEach(m=>o[m.key]=m);return o;},[members]);
  const groups=useMemo(()=>suggestGroups(members.map(m=>({id:m.key,participantId:'',text:m.left+' vs '+m.right}))),[members]);
  const totalP=useMemo(()=>totalParticipants(members),[members]);

  const setCats=(cats)=>setConfig({...config,categories:cats});
  const setAssign=(a)=>setConfig({...config,assignments:a});
  const addCat=()=>setCats([...categories,{id:uid(),name:'New composite',left:'Preferred pole',leftDef:'',right:'Opposite pole',rightDef:'',quote:''}]);
  const editCat=(id,patch)=>setCats(categories.map(c=>c.id===id?{...c,...patch}:c));
  const delCat=(id)=>{ setCats(categories.filter(c=>c.id!==id));
    const a={...assignments}; Object.keys(a).forEach(k=>{if(a[k].cat===id)delete a[k];}); setAssign(a); };
  const unassign=(key, role)=>{
    const a={...assignments};
    if(role==='secondary'&&a[key]){ const x={...a[key]}; delete x.cat2; delete x.flip2; a[key]=x; }
    else delete a[key];
    setAssign(a);
  };
  // Secondary composite = James's "Complex Construct" (a construct may sit in two).
  const setSecondary=(key, catId)=>{
    const a={...assignments}; const cur=a[key]; if(!cur) return;
    if(!catId){ const x={...cur}; delete x.cat2; delete x.flip2; a[key]=x; }
    else { const cat=categories.find(c=>c.id===catId); const m=memberByKey[key];
      a[key]={...cur, cat2:catId, flip2: m&&cat? autoFlip(m.effLabel,cat):false}; }
    setAssign(a);
  };
  function assignGroup(grp, catId){
    const cat=categories.find(c=>c.id===catId); const a={...assignments};
    grp.forEach(it=>{ if(catId){ const m=memberByKey[it.id]; a[it.id]={cat:catId, flip:m&&cat?autoFlip(m.effLabel,cat):false}; } else delete a[it.id]; });
    setAssign(a);
  }
  function autoGenerate(){
    if(readOnly) return;
    const cats=[]; const a={...assignments};
    groups.filter(g=>g.length>=3).slice(0,20).forEach(g=>{
      const m0=memberByKey[g[0].id];
      const cat={id:uid(), name:(m0?m0.effLabel:'Composite'), left:(m0?m0.left:'Left'), leftDef:'', right:(m0?m0.right:'Right'), rightDef:'', quote:''};
      cats.push(cat);
      g.forEach(it=>{ const m=memberByKey[it.id]; a[it.id]={cat:cat.id, flip:m?autoFlip(m.effLabel,cat):false}; });
    });
    setConfig({...config, categories:[...categories,...cats], assignments:a});
  }
  const Sup=({n})=> <sup style={{color:'#e07030',fontWeight:700}}>&nbsp;P{n}</sup>;
  // Table 5-2 (RGT Analysis): category, quote, pole definitions, frequencies.
  function exportTable52(){
    const rows=[['Construct Category','Illustrative quote','Construct pole definition','Opposite construct pole','Freq. Total','Unique Freq.','%','Constructs (verbatim, with participant)']];
    categories.forEach(cat=>{
      const mem=membersOf(members, assignments, cat.id);
      const uniq=new Set(mem.map(x=>x.m.participant)).size;
      rows.push([cat.name, cat.quote||'', cat.leftDef||cat.left, cat.rightDef||cat.right,
        mem.length, uniq, totalP?Math.round(uniq/totalP*100)+'%':'',
        mem.map(({m,role})=>m.left+' vs '+m.right+' [P'+m.pnum+(role==='secondary'?'/2°':'')+']').join(' | ')]);
    });
    downloadCsv(rows, slug(config.title)+'_Table5-2_RGT_Analysis.csv');
  }
  const assignedCount=members.filter(m=>(assignments[m.key]||{}).cat).length;
  const unassignedGroups=groups.map(g=>g.filter(it=>!((assignments[it.id]||{}).cat))).filter(g=>g.length);
  const [busy,setBusy]=useState('');
  const [coding,setCoding]=useState(null);      // coderId currently coding by hand
  const [onlyUncoded,setOnlyUncoded]=useState(true);

  // Derive categories from the data using the encoded Jankowicz/Honey method.
  async function derive(){
    if(readOnly) return;
    if(!window.confirm('Derive composite constructs from all '+members.length+' constructs?\n\nThis proposes fresh categories (bottom-up) and REPLACES the current list.')) return;
    setBusy('Deriving categories…');
    try{
      const j=await api('/api/rep-grid-derive',{constructs:members.map(m=>({left:m.left,right:m.right})),target:14,domain:config.title});
      const cats=(j.categories||[]).map(c=>({id:uid(),name:c.name,left:c.left,leftDef:c.leftDef||'',right:c.right,rightDef:c.rightDef||'',quote:''}));
      if(!cats.length) throw new Error('no categories returned');
      setConfig({...config, categories:cats, assignments:{}});
      setBusy('');
      alert('Derived '+cats.length+' composite constructs. Review/edit them, then use “AI assign constructs”.');
    }catch(e){ setBusy(''); alert('Derive failed: '+e.message); }
  }
  // ---- Coder panel: up to 4 coders, each AI (with a reasoning stance) or human.
  const STANCES={A:'Definition-led',B:'Participant-language-led',C:'Contrast-led',D:'Exemplar-led'};
  const meta=config.coderMeta||[];
  const coders=config.coders||{};
  const catName=(id)=>(categories.find(c=>c.id===id)||{}).name||'—';
  const setMeta=(m)=>setConfig({...config,coderMeta:m});
  const addCoder=(type)=>{
    if(meta.length>=4){ alert('Maximum of 4 coders.'); return; }
    const used=meta.filter(m=>m.type==='ai').map(m=>m.stance);
    const stance=['A','B','C','D'].find(s=>!used.includes(s))||'A';
    const id='cd'+Date.now().toString(36);
    setMeta([...meta,{id,type,stance:type==='ai'?stance:null,
      name:type==='ai'?('AI · '+STANCES[stance]):('Human coder '+(meta.filter(m=>m.type==='human').length+1))}]);
  };
  const editCoder=(id,patch)=>setMeta(meta.map(m=>m.id===id?{...m,...patch}:m));
  const delCoder=(id)=>{ const c={...coders}; delete c[id]; setConfig({...config,coderMeta:meta.filter(m=>m.id!==id),coders:c}); };

  async function runAiCoder(cd){
    if(readOnly) return;
    if(!categories.length){ alert('Create or derive composite constructs first.'); return; }
    const cats=categories.map(c=>({id:c.id,name:c.name,left:c.left,leftDef:c.leftDef,right:c.right,rightDef:c.rightDef}));
    const out={}; const B=60;
    for(let i=0;i<members.length;i+=B){
      setBusy(cd.name+' coding… '+Math.min(i+B,members.length)+'/'+members.length);
      const batch=members.slice(i,i+B);
      try{
        const j=await api('/api/rep-grid-classify',{constructs:batch.map(m=>({id:m.key,left:m.left,right:m.right})),categories:cats,pass:cd.stance});
        (j.assignments||[]).forEach(x=>{
          if(x&&x.id&&x.cat&&cats.some(c=>c.id===x.cat)){
            const rec={cat:x.cat, flip:!!x.flip};
            if(x.cat2 && x.cat2!==x.cat && cats.some(c=>c.id===x.cat2)){ rec.cat2=x.cat2; rec.flip2=!!x.flip2; }
            out[x.id]=rec;
          }
        });
      }catch(e){}
    }
    setConfig({...config, coders:{...coders,[cd.id]:out}});
    setBusy('');
    alert(cd.name+' coded '+Object.keys(out).length+' of '+members.length+' constructs.');
  }
  // Reliability across every coder that has coded anything.
  const activeIds=meta.filter(m=>coders[m.id]&&Object.keys(coders[m.id]).length).map(m=>m.id);
  const sets=activeIds.map(id=>coders[id]);
  const stats=useMemo(()=> sets.length>=2? multiStats(sets):null,[config.coders,config.coderMeta]);
  function acceptAllAgreed(){
    if(!stats) return;
    const a={...assignments}; let n=0;
    Object.keys(sets[0]).forEach(k=>{ if(sets.every(s=>s[k]&&s[k].cat===sets[0][k].cat)){ a[k]={...sets[0][k]}; n++; } });
    setConfig({...config,assignments:a}); alert('Accepted '+n+' unanimous codes.');
  }
  function acceptMajority(){
    const a={...assignments}; let n=0;
    (stats?stats.disagree:[]).forEach(k=>{ const p=majorityPick(sets,k); if(p){ a[k]={cat:p.cat,flip:p.flip}; n++; } });
    setConfig({...config,assignments:a}); alert('Accepted '+n+' majority codes. Ties left for you.');
  }
  function adjudicate(key, coderId){
    const pick=(coders[coderId]||{})[key]; if(!pick) return;
    setConfig({...config, assignments:{...assignments, [key]:{...pick}}});
  }
  // Human coding: set this coder's code for one construct.
  function humanCode(coderId, key, catId, cat2Id){
    const cur={...(coders[coderId]||{})};
    if(!catId) delete cur[key];
    else {
      const m=memberByKey[key];
      const cat=categories.find(c=>c.id===catId);
      const rec={cat:catId, flip:m&&cat?autoFlip(m.effLabel,cat):false};
      if(cat2Id){ const c2=categories.find(c=>c.id===cat2Id);
        rec.cat2=cat2Id; rec.flip2=m&&c2?autoFlip(m.effLabel,c2):false; }
      cur[key]=rec;
    }
    setConfig({...config, coders:{...coders,[coderId]:cur}});
  }

  // ---- Human coding view (one coder, coding independently) ----
  if(coding){
    const cd=meta.find(m=>m.id===coding)||{name:'Coder'};
    const mine=coders[coding]||{};
    const doneN=Object.keys(mine).length;
    const list=(onlyUncoded? members.filter(m=>!mine[m.key]) : members);
    return (
      <div className="fade">
        <button className="back-btn" onClick={()=>setCoding(null)}>← Back to coders</button>
        <div className="inf-box">Coding as <b>{cd.name}</b>. Code independently — don't consult the other coders; the reliability statistic only means something if the passes are genuinely separate. <b>{doneN}/{members.length}</b> coded.</div>
        <div className="toolbar">
          <label className="anon-toggle"><input type="checkbox" checked={onlyUncoded} onChange={e=>setOnlyUncoded(e.target.checked)}/> Show only uncoded</label>
          <div className="grow"/>
          {savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}
          <button className="btn-p btn-sm" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save coding'}</button>
        </div>
        <div className="card">
          {list.length===0 && <p className="mini">Nothing left to code.</p>}
          {list.slice(0,250).map(m=>(
            <div className="list-row" key={m.key}>
              <span style={{flex:1,fontSize:'.82rem'}}>{m.left} <span className="mini">vs</span> {m.right}<Sup n={m.pnum}/>
                {(mine[m.key]||{}).text?<div className="mini" style={{whiteSpace:'normal',maxWidth:420}}>“{mine[m.key].text}”</div>:null}</span>
              <select className="inp inp-sm" style={{width:200,flex:'0 0 auto'}} value={(mine[m.key]||{}).cat||''} onChange={e=>humanCode(coding,m.key,e.target.value)}>
                <option value="">— uncoded —</option>
                {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <select className="inp inp-sm" style={{width:180,flex:'0 0 auto'}} title="Optional second composite (complex construct)"
                value={(mine[m.key]||{}).cat2||''} disabled={!(mine[m.key]||{}).cat}
                onChange={e=>humanCode(coding,m.key,(mine[m.key]||{}).cat,e.target.value)}>
                <option value="">+ secondary…</option>
                {categories.filter(c=>c.id!==(mine[m.key]||{}).cat).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          ))}
          {list.length>250 && <p className="mini">Showing 250 of {list.length}. Code these, then the next batch appears.</p>}
        </div>
      </div>
    );
  }

  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Step 2 · Composite constructs (grouping)</span>Every construct from every interview is pooled here. Group the ones that mean the same thing into <b>composite constructs</b> — your shared research categories, each with a preferred and an opposite pole (Jankowicz’s method). Build them by hand with <b>+ Add composite</b>, add AI or human <b>coders</b> to propose them independently, or use <b>Derive from data</b> to bootstrap a first set automatically. Superscripts (P3, etc.) show which participant each construct came from. {members.length} constructs · {assignedCount} assigned · {totalP} participants.</div>

      <div className="toolbar">
        <div className="sec-tag" style={{margin:0}}>Composite constructs ({categories.length})</div>
        <div className="grow"/>
        {busy && <span className="small" style={{color:'#e07030'}}>{busy}</span>}
        {!readOnly&&<button className="btn-s btn-sm" disabled={!!busy} onClick={derive}>✦ Derive from data</button>}
        <button className="btn-s btn-sm" onClick={exportTable52}>Export Table 5-2</button>
        {!readOnly&&<button className="btn-s btn-sm" onClick={addCat}>+ Add composite</button>}
      </div>

      {/* ---- Coding panel: AI only / AI + human / human only ---- */}
      <div className="card">
        <div className="toolbar">
          <div className="sec-tag" style={{margin:0}}>Coders ({meta.length}/4)</div>
          <div className="grow"/>
          {!readOnly&&<button className="btn-s btn-sm" disabled={meta.length>=4} onClick={()=>addCoder('ai')}>+ AI coder</button>}
          {!readOnly&&<button className="btn-s btn-sm" disabled={meta.length>=4} onClick={()=>addCoder('human')}>+ Human coder</button>}
        </div>
        <p className="field-sub">Add up to four independent coders — any mix of AI and human. Each codes the full set alone; the tool then reports inter-rater reliability and asks you to settle only the disagreements (Jankowicz's reconciliation step).</p>
        {meta.length===0 && <p className="mini">No coders yet. Add two or more to get a reliability statistic.</p>}
        {meta.map(cd=>{
          const n=Object.keys(coders[cd.id]||{}).length;
          return (
            <div className="list-row" key={cd.id}>
              <span className="tag" style={cd.type==='ai'?{background:'#f0e2d5',color:'#b5651a'}:{background:'#dcefe0',color:'#16794a'}}>{cd.type==='ai'?'AI':'HUMAN'}</span>
              <input className="inp inp-sm" style={{flex:2}} value={cd.name} readOnly={readOnly} onChange={e=>editCoder(cd.id,{name:e.target.value})}/>
              {cd.type==='ai'
                ? <select className="inp inp-sm" style={{width:190,flex:'0 0 auto'}} value={cd.stance||'A'} disabled={readOnly} onChange={e=>editCoder(cd.id,{stance:e.target.value,name:'AI · '+STANCES[e.target.value]})}>
                    {Object.keys(STANCES).map(s=><option key={s} value={s}>{STANCES[s]}</option>)}
                  </select>
                : <span className="mini" style={{width:190}}>codes manually</span>}
              <span className="mini" style={{minWidth:74}}>{n}/{members.length}</span>
              {!readOnly&&(cd.type==='ai'
                ? <button className="btn-p btn-sm" disabled={!!busy} onClick={()=>runAiCoder(cd)}>Run</button>
                : <button className="btn-p btn-sm" onClick={()=>setCoding(cd.id)}>Code</button>)}
              {!readOnly&&<button className="x" onClick={()=>delCoder(cd.id)}>✕</button>}
            </div>
          );
        })}
      </div>

      {stats && (
        <div className="card">
          <div className="sec-tag">Inter-rater reliability — {activeIds.length} coders</div>
          <div className="row" style={{alignItems:'center'}}>
            <div><div className="mini">Unanimous agreement</div><div style={{fontSize:'1.4rem',fontWeight:700,color:'#16a34a'}}>{(stats.po*100).toFixed(1)}%</div></div>
            <div><div className="mini">{stats.kind}</div><div style={{fontSize:'1.4rem',fontWeight:700}}>{stats.kappa.toFixed(2)}</div></div>
            <div><div className="mini">Agreed</div><div style={{fontSize:'1.4rem',fontWeight:700}}>{stats.unanimous}</div></div>
            <div><div className="mini">To settle</div><div style={{fontSize:'1.4rem',fontWeight:700,color:'#dc2626'}}>{stats.disagree.length}</div></div>
          </div>
          <div className="btn-row" style={{marginTop:'.6rem'}}>
            <button className="btn-s btn-sm" onClick={acceptAllAgreed}>Accept unanimous</button>
            {activeIds.length>=3 && <button className="btn-s btn-sm" onClick={acceptMajority}>Accept majority</button>}
          </div>
          <p className="field-sub" style={{marginTop:'.4rem'}}>{activeIds.length===2?'Cohen’s κ':'Fleiss’ κ'} over the {stats.n} constructs all coders coded. κ &gt; 0.80 is conventionally “almost perfect”, 0.61–0.80 “substantial”.</p>
        </div>
      )}

      {stats && stats.disagree.length>0 && (
        <div className="card">
          <div className="sec-tag">Disagreements to settle ({stats.disagree.length})</div>
          {stats.disagree.slice(0,120).map(k=>{
            const m=memberByKey[k]; if(!m) return null;
            const cur=(assignments[k]||{}).cat;
            return (
              <div className="list-row" key={k} style={{alignItems:'flex-start'}}>
                <span style={{flex:1,fontSize:'.82rem'}}>{m.left} <span className="mini">vs</span> {m.right}<Sup n={m.pnum}/></span>
                {activeIds.map(id=>{
                  const pick=coders[id][k]; if(!pick) return null;
                  const cd=meta.find(x=>x.id===id);
                  return <button key={id} className="btn-s btn-sm" title={cd.name}
                    style={cur===pick.cat?{borderColor:'#16a34a',fontWeight:700}:{}}
                    onClick={()=>adjudicate(k,id)}>{(cd.type==='ai'?'🤖':'🧑')} {catName(pick.cat)}</button>;
                })}
              </div>
            );
          })}
          {stats.disagree.length>120 && <p className="mini">Showing first 120 of {stats.disagree.length}.</p>}
        </div>
      )}
      {categories.length===0 && <p className="muted small">None yet. Auto-generate to seed categories from similar constructs, then rename and edit definitions.</p>}
      {categories.map(cat=>{
        const mem=membersOf(members, assignments, cat.id);
        const uniq=new Set(mem.map(x=>x.m.participant)).size;
        return (
          <div className="card" key={cat.id}>
            <div className="toolbar" style={{marginBottom:6}}>
              <input className="inp inp-sm" style={{maxWidth:240,fontWeight:700}} value={cat.name} readOnly={readOnly} onChange={e=>editCat(cat.id,{name:e.target.value})}/>
              <span className="tag">{mem.length} constructs · {uniq} ppts · {totalP?Math.round(uniq/totalP*100):0}%</span>
              <div className="grow"/>
              {!readOnly&&<button className="x" onClick={()=>delCat(cat.id)}>✕</button>}
            </div>
            <div className="row">
              <div><label className="field-lbl">Preferred pole (+ definition)</label>
                <input className="inp inp-sm" value={cat.left} readOnly={readOnly} onChange={e=>editCat(cat.id,{left:e.target.value})}/>
                <textarea className="inp inp-sm" rows={2} placeholder="definition…" value={cat.leftDef||''} readOnly={readOnly} onChange={e=>editCat(cat.id,{leftDef:e.target.value})} style={{marginTop:4}}/></div>
              <div><label className="field-lbl">Opposite pole (+ definition)</label>
                <input className="inp inp-sm" value={cat.right} readOnly={readOnly} onChange={e=>editCat(cat.id,{right:e.target.value})}/>
                <textarea className="inp inp-sm" rows={2} placeholder="definition…" value={cat.rightDef||''} readOnly={readOnly} onChange={e=>editCat(cat.id,{rightDef:e.target.value})} style={{marginTop:4}}/></div>
            </div>
            <div className="field" style={{marginTop:8}}><label className="field-lbl">Illustrative quote</label>
              <input className="inp inp-sm" value={cat.quote||''} readOnly={readOnly} onChange={e=>editCat(cat.id,{quote:e.target.value})} placeholder="“…”"/></div>
            <div>{mem.length?mem.map(({m,role})=>(
              <span className="chip" key={m.key+role} style={{cursor:readOnly?'default':'pointer',borderStyle:role==='secondary'?'dashed':'solid'}}
                title={readOnly?(role==='secondary'?'secondary composite (complex construct)':''):(role==='secondary'?'secondary composite (complex construct) — click to remove':'click to remove')}
                onClick={()=>{ if(!readOnly) unassign(m.key, role); }}>{m.left} vs {m.right}<Sup n={m.pnum}/>{role==='secondary'?<sup style={{color:'#888'}}>&nbsp;2°</sup>:null}</span>
            )):<span className="mini">No constructs assigned yet — use the pool below.</span>}</div>
          </div>
        );
      })}

      {!readOnly&&<div className="card">
        <div className="sec-tag">Assign remaining constructs ({members.length-assignedCount})</div>
        <p className="field-sub">Every unassigned construct, verbatim, grouped by similarity. Assign a whole group to a composite; click any assigned chip above to remove it.</p>
        {unassignedGroups.length===0 && <p className="mini">All constructs assigned.</p>}
        {unassignedGroups.map((g,i)=>(
          <div className="list-row" key={i} style={{alignItems:'flex-start'}}>
            <div style={{flex:1}}>{g.map(it=>{const m=memberByKey[it.id]; return <span className="chip" key={it.id}>{m.left} vs {m.right}<Sup n={m.pnum}/></span>;})}</div>
            <select className="inp inp-sm" style={{width:210,flex:'0 0 auto'}} value="" onChange={e=>assignGroup(g,e.target.value)}>
              <option value="">assign to…</option>
              {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
        ))}
      </div>}

      {!readOnly&&<div className="btn-row">
        <div className="grow"/>
        {savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}
        <button className="btn-p" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save categorisation'}</button>
      </div>}
    </div>
  );
}

/* ============================ Composite Honey table ====================== */
const CAT_FULL={SL:'System Leadership',TL:'Traditional Leadership',FL:'Future Leadership'};
function catFull(c){ return CAT_FULL[c]||c; }
function CompositeTable({config,responses}){
  const elemCats=[...new Set([].concat(...responses.map(r=>elementsFor(config,r,null).map(e=>e.category))).filter(Boolean))];
  const [seg,setSeg]=useState('all');
  const [refId,setRefId]=useState('supplied');
  const [threshold,setThreshold]=useState(0);
  const categories=config.categories||[], assignments=config.assignments||{};
  const refCons=(config.constructs||[]).filter(x=>x.left||x.right);
  const memAll=useMemo(()=>pooledMembers(responses,config,null,refId),[responses,config,refId]);
  const totalP=totalParticipants(memAll);
  const fixedOrient=useMemo(()=>fixedOrientOf(memAll),[memAll]);
  const rowsFor=(filter)=> compositeRows(pooledMembers(responses,config,filter,refId),categories,assignments,totalP,fixedOrient);
  const all=useMemo(()=>rowsFor(null),[responses,config,seg,refId]);
  const segRows=useMemo(()=> (seg==='all'||seg==='compare')?null:rowsFor(seg),[responses,config,seg,refId]);
  const cmp=useMemo(()=> (seg==='compare'&&elemCats.length>=2)? elemCats.map(c=>({c, rows:rowsFor(c)})):null,[responses,config,seg,refId]);
  const refLabel = refId==='supplied' ? (config.suppliedLeft+' → '+config.suppliedRight) : ((refCons.find(c=>c.id===refId)||{}).left||'reference');

  if(categories.length===0) return <div className="help-box"><span className="help-h">Step 3 · Composite table (the final result)</span>Nothing to show yet. First build your <b>composite constructs</b> on the <b>2 · Composite constructs</b> tab. Once you have categories, this tab automatically turns them into the <b>Honey Content Table</b> — the headline finding of the whole study.</div>;

  const bar=(l)=> <div style={{display:'inline-flex',width:70,height:10,borderRadius:3,overflow:'hidden',border:'1px solid #d8d3cb',verticalAlign:'middle'}}>
    <div style={{width:l+'%',background:'#3f7d4e'}}/><div style={{flex:1,background:'#efeae2'}}/></div>;

  function HoneyTable({rows,title}){
    return (
      <div style={{marginBottom:18}}>
        {title&&<div className="sec-tag">{title}</div>}
        <div className="scroll"><table className="grid">
          <thead><tr>
            <th className="pole">Construct category</th><th style={{width:60}}>Unique freq %</th>
            <th className="pole">Preferred pole</th><th style={{width:120}}>Mean similarity %</th>
            <th className="pole">Opposite pole</th><th style={{width:70}}>Mean sim %</th>
            <th style={{width:110}}>Preference</th><th style={{width:48}}>H%</th><th style={{width:48}}>I%</th><th style={{width:48}}>L%</th>
          </tr></thead>
          <tbody>
            {rows.filter(r=>r.n>0 && r.uniquePct>=threshold).map(r=>(
              <tr key={r.cat.id}>
                <td className="pole"><b>{r.cat.name}</b>{r.cat.quote?<div className="mini" style={{maxWidth:180,whiteSpace:'normal'}}>“{r.cat.quote.slice(0,70)}”</div>:null}</td>
                <td>{Math.round(r.uniquePct)}%</td>
                <td className="pole" style={{maxWidth:200,whiteSpace:'normal'}}>{r.cat.left}{r.cat.leftDef?<div className="mini">{r.cat.leftDef.slice(0,60)}</div>:null}</td>
                <td>{bar(r.left)} <b>{r.left.toFixed(0)}%</b></td>
                <td className="pole muted" style={{maxWidth:200,whiteSpace:'normal'}}>{r.cat.right}</td>
                <td>{r.right.toFixed(0)}%</td>
                <td>{r.pref}</td>
                <td>{r.H.toFixed(0)}</td><td>{r.I.toFixed(0)}</td><td>{r.L.toFixed(0)}</td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>
    );
  }
  function Comparative(){
    const byCat=elemCats.map(c=>({c, rows:rowsFor(c)}));
    const catRows=categories.map((cat,i)=>({cat, cells:byCat.map(b=>b.rows.find(r=>r.cat.id===cat.id))}));
    return (
      <div className="scroll"><table className="grid">
        <thead><tr><th className="pole">Construct area</th>{elemCats.map(c=><th key={c} className="pole">{catFull(c)}</th>)}</tr></thead>
        <tbody>{catRows.filter(x=>x.cells.some(c=>c&&c.n>0)).map(x=>(
          <tr key={x.cat.id}>
            <td className="pole"><b>{x.cat.left}</b> <span className="mini">vs</span> {x.cat.right}</td>
            {x.cells.map((c,j)=><td key={j} className="pole" style={{whiteSpace:'normal'}}>{c&&c.n? c.pref+' — '+c.left.toFixed(0)+'% '+x.cat.left : '—'}</td>)}
          </tr>
        ))}</tbody>
      </table></div>
    );
  }

  function exportHoney(){
    const hdr=['Construct category','Unique freq %','Preferred pole','Preferred pole definition','Mean similarity %','Opposite pole','Opposite pole definition','Mean sim %','Preference','H%','I%','L%','n constructs'];
    const rows=[];
    const push=(label,rs)=>{ rows.push([label]); rows.push(hdr);
      rs.filter(r=>r.n>0).forEach(r=>rows.push([r.cat.name, Math.round(r.uniquePct)+'%', r.cat.left, r.cat.leftDef||'',
        r.left.toFixed(1)+'%', r.cat.right, r.cat.rightDef||'', r.right.toFixed(1)+'%', r.pref,
        r.H.toFixed(0), r.I.toFixed(0), r.L.toFixed(0), r.n])); rows.push([]); };
    push('Honey Content Table — ALL elements', all);
    elemCats.forEach(c=> push('Honey Content Table — '+catFull(c)+' elements only', rowsFor(c)));
    downloadCsv(rows, slug(config.title)+'_Honey_Content_Table.csv');
  }
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Step 3 · Composite table — the Honey Content Table</span>This is the payoff. For each <b>composite construct</b>, it shows the average similarity of its preferred pole to the effectiveness reference (<b>{refLabel}</b>), how many people mentioned it, and its <b>H/I/L</b> spread — so you can read off which shared themes matter most. Split it by <b>element category</b> ({elemCats.length?elemCats.map(c=>c+' = '+catFull(c)).join(' · '):'none yet'}) to get James’s System / Traditional / Comparative tables, change the <b>reference construct</b> to analyse against a different criterion, or apply a <b>frequency threshold</b> (James kept categories cited by ≥50% of participants). Held-out elements are excluded, as in the thesis.</div>

      <div className="toolbar" style={{gap:'.6rem',flexWrap:'wrap'}}>
        <span className="mini">Split:</span>
        <button className="btn-s btn-sm" style={seg==='all'?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg('all')}>All elements</button>
        {elemCats.map(c=><button key={c} className="btn-s btn-sm" style={seg===c?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg(c)}>{catFull(c)}</button>)}
        {elemCats.length>=2 && <button className="btn-s btn-sm" style={seg==='compare'?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg('compare')}>Comparative</button>}
        <div className="grow"/>
        <button className="btn-s btn-sm" onClick={exportHoney}>Export Honey tables</button>
      </div>
      <div className="toolbar" style={{gap:'.6rem',flexWrap:'wrap',marginTop:'-.6rem'}}>
        {refCons.length>0 && <span className="mini">Reference:
          <select className="inp inp-sm" style={{width:220,marginLeft:6}} value={refId} onChange={e=>setRefId(e.target.value)}>
            <option value="supplied">{config.suppliedLeft} → {config.suppliedRight} (yardstick)</option>
            {refCons.map(x=><option key={x.id} value={x.id}>{x.left} → {x.right}</option>)}
          </select></span>}
        <span className="mini">Freq. threshold:</span>
        {[0,25,50].map(t=><button key={t} className="btn-s btn-sm" style={threshold===t?{borderColor:'#1a1a1a'}:{}} onClick={()=>setThreshold(t)}>{t===0?'off':'≥'+t+'%'}</button>)}
      </div>

      <div className="card">
        <div className="sec-tag">Results summary — categories by unique frequency (Figure 5-3)</div>
        {[...all].filter(r=>r.n>0).sort((a,b)=>b.uniquePct-a.uniquePct).map(r=>(
          <div key={r.cat.id} style={{display:'flex',alignItems:'center',gap:8,margin:'2px 0'}}>
            <div style={{width:160,fontSize:'.74rem',textAlign:'right',color:r.uniquePct>=threshold?'#1a1a1a':'#b0a898',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.cat.name}</div>
            <div style={{flex:1,height:13,background:'#efeae2',borderRadius:3,overflow:'hidden'}}><div style={{width:r.uniquePct+'%',height:'100%',background:r.uniquePct>=(threshold||1)?'#e07030':'#d8b9a3'}}/></div>
            <div style={{width:38,fontSize:'.72rem'}}>{Math.round(r.uniquePct)}%</div>
          </div>
        ))}
        {all.filter(r=>r.n>0).length===0&&<p className="mini">No categories with assigned constructs yet.</p>}
      </div>

      <div className="card">
        {seg==='all' && <HoneyTable rows={all}/>}
        {segRows && <HoneyTable rows={segRows} title={catFull(seg)+' situations only (Honey Content Table)'}/>}
        {cmp && <Comparative/>}
        <p className="mini" style={{marginTop:'.6rem'}}>Mean similarity % = average Honey similarity of the composite's preferred pole to <b>{refLabel}</b> across its member constructs. Unique freq % = share of participants with a construct in the category{threshold>0?' (showing ≥'+threshold+'% only)':''}. H/I/L% = band spread. Following Honey (1979) / Jankowicz (2004).</p>
      </div>
    </div>
  );
}

/* ============================ Dashboard ====================== */
function Dashboard({code, onSignOut}){
  const [tab,setTab]=useState('setup');
  const [config,setConfig]=useState(null);
  const [responses,setResponses]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [savedMsg,setSavedMsg]=useState('');
  const [active,setActive]=useState(null);

  async function reload(){
    const j=await api('/api/rep-grid-load',{session_code:code});
    const cfg=(j.config&&j.config.data&&j.config.data.title!=null)? j.config.data
      : {title:'',description:'',scaleMin:1,scaleMax:10,suppliedLeft:'Highly effective',suppliedRight:'Not effective at all',suppliedDesc:'',elementCategories:[],elements:[],constructs:[]};
    cfg.categories=cfg.categories||[]; cfg.assignments=cfg.assignments||{};
    cfg.elementCategories=cfg.elementCategories||[]; cfg.description=cfg.description||''; cfg.suppliedDesc=cfg.suppliedDesc||'';
    setConfig(cfg); setResponses(j.responses||[]); setLoading(false);
  }
  useEffect(()=>{ reload().catch(e=>{ setLoading(false); alert('Load failed: '+e.message); }); /* eslint-disable-next-line */ },[]);

  async function saveConfig(){
    if(config&&config.readOnly) return;
    setSaving(true); setSavedMsg('');
    try{ await saveWithRetry({kind:'config',session_code:code,data:config}); setSavedMsg('Saved ✓'); setTimeout(()=>setSavedMsg(''),2500); }
    catch(e){ alert('Save failed: '+e.message); }
    setSaving(false);
  }
  async function saveResponse(resp){
    if(config&&config.readOnly) return;
    try{ await saveWithRetry({kind:'response',session_code:code,participant_id:resp.participant_id,participant_name:resp.participant_name||'',data:resp.data}); await reload(); }
    catch(e){ alert('Save failed: '+e.message); }
  }
  function newInterview(){ if(config&&config.readOnly) return; setActive({participant_id:uid(),participant_name:'',data:{ratings:{},supplied:{},quotes:{},status:'in_progress'}}); }
  async function deleteResponse(r){
    if(config&&config.readOnly) return;
    if(!window.confirm('Delete interview “'+(r.participant_name||'unnamed')+'”?\n\nThis permanently removes the grid and cannot be undone.')) return;
    try{ await api('/api/rep-grid-save',{kind:'delete-response',session_code:code,participant_id:r.participant_id}); reload(); }
    catch(e){ alert('Delete failed: '+e.message); }
  }

  if(loading) return <div className="content"><p className="muted">Loading session…</p></div>;
  const readOnly=!!(config&&config.readOnly);
  if(active) return <Interview config={config} code={code} resp={active} readOnly={readOnly} onBack={()=>{ setActive(null); reload(); }}/>;

  return (
    <div className="content-wide fade">
      <div className="topbar">
        <div><div className="land-tag" style={{marginBottom:'.3rem'}}>Rep-Grid{readOnly?' · Example':''}</div>
          <div className="pg-title" style={{margin:0}}>{config.title||'Untitled study'}</div></div>
        <div style={{display:'flex',gap:'.6rem',alignItems:'center'}}>
          <span className="code">{code}</span>
          <button className="btn-s btn-sm" onClick={onSignOut}>Sign out</button>
        </div>
      </div>
      {readOnly&&<div className="demo-banner"><b>Read-only example study.</b> This is James’s completed NHS-leadership dataset, kept as a worked example so you can see what a finished study looks like at every stage. You can explore and export freely — editing, adding interviews and deleting are switched off so it can’t be changed. To run your own study, sign out and open the tool with your own access code.</div>}
      <div className="fac-tab-bar">
        <button className={"fac-tab"+(tab==='setup'?' active':'')} onClick={()=>setTab('setup')}>Setup</button>
        <button className={"fac-tab"+(tab==='pconstructs'?' active':'')} onClick={()=>setTab('pconstructs')}>Prescribed constructs</button>
        <button className={"fac-tab"+(tab==='pelements'?' active':'')} onClick={()=>setTab('pelements')}>Prescribed elements</button>
        <button className={"fac-tab"+(tab==='interviews'?' active':'')} onClick={()=>setTab('interviews')}>Interviews</button>
        <button className={"fac-tab"+(tab==='allelements'?' active':'')} onClick={()=>setTab('allelements')}>All elements</button>
        <button className={"fac-tab"+(tab==='allconstructs'?' active':'')} onClick={()=>setTab('allconstructs')}>All constructs</button>
        <button className={"fac-tab"+(tab==='individual'?' active':'')} onClick={()=>setTab('individual')}>1 · Individual Honey</button>
        <button className={"fac-tab"+(tab==='composite'?' active':'')} onClick={()=>setTab('composite')}>2 · Composite constructs</button>
        <button className={"fac-tab"+(tab==='table'?' active':'')} onClick={()=>setTab('table')}>3 · Composite table</button>
      </div>
      {tab==='setup'&&<Setup config={config} setConfig={setConfig} onSave={saveConfig} saving={saving} savedMsg={savedMsg} readOnly={readOnly}/>}
      {tab==='pconstructs'&&<PrescribedConstructs config={config} setConfig={setConfig} onSave={saveConfig} saving={saving} savedMsg={savedMsg} readOnly={readOnly}/>}
      {tab==='pelements'&&<PrescribedElements config={config} setConfig={setConfig} onSave={saveConfig} saving={saving} savedMsg={savedMsg} readOnly={readOnly}/>}
      {tab==='interviews'&&<Interviews config={config} responses={responses} onOpen={setActive} onNew={newInterview} onDelete={deleteResponse} readOnly={readOnly}/>}
      {tab==='allelements'&&<AllElements config={config} setConfig={setConfig} onSaveConfig={saveConfig} responses={responses} onSaveResponse={saveResponse} readOnly={readOnly}/>}
      {tab==='allconstructs'&&<AllConstructs config={config} responses={responses} onSaveResponse={saveResponse} readOnly={readOnly}/>}
      {tab==='individual'&&<Analysis config={config} responses={responses} onOpen={setActive}/>}
      {tab==='composite'&&<CompositeConstructs config={config} setConfig={setConfig} responses={responses} onSave={saveConfig} saving={saving} savedMsg={savedMsg} readOnly={readOnly}/>}
      {tab==='table'&&<CompositeTable config={config} responses={responses}/>}
    </div>
  );
}

/* ============================ Root ====================== */
function App(){
  const [code,setCode]=useState(null);
  if(!code) return <Gate onUnlock={setCode}/>;
  return <Dashboard code={code} onSignOut={()=>setCode(null)}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
