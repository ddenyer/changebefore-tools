/* ============================ 1 · Individual Honey ====================== */
// Per participant: their constructs ranked by similarity to the supplied
// "effectiveness" construct, with a bar toward the effective pole, band, quote.
function Analysis({config,responses,onOpen}){
  const outcomes=(config.suppliedConstructs&&config.suppliedConstructs.length)?config.suppliedConstructs:[{id:'supplied',left:config.suppliedLeft,right:config.suppliedRight}];
  const [outId,setOutId]=useState(outcomes[0].id);
  const withData=responses.filter(r=>{ const s=refRatingsFor(r.data,outId); return Object.keys(s).length>0; });
  const [sel,setSel]=useState(withData[0]?withData[0].participant_id:'');
  const [showMaps,setShowMaps]=useState(false);
  const lo=config.scaleMin, hi=config.scaleMax;
  const r=responses.find(x=>x.participant_id===sel);
  const info=useMemo(()=>{
    if(!r) return null;
    const ratings=(r.data&&r.data.ratings)||{}, supplied=refRatingsFor(r.data,outId), quotes=(r.data&&r.data.quotes)||{}, noPol=(r.data&&r.data.noPolarity)||{};
    const els=elementsFor(config,r,null);   // this interview's elements, supplementary held out
    const sArr=els.map(el=> supplied[el.id]!=null?supplied[el.id]:null);
    if(sArr.every(v=>v==null)) return {rows:[],quotes,excluded:0,maps:null};
    const allCons=[...config.constructs,...((r.data&&r.data.elicited)||[])];
    const cons=allCons.filter(c=>!noPol[c.id]).map(c=>({id:c.id,left:c.left,right:c.right,
      ratings:els.map(el=>(ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:null)}));
    // Grid maps use all rated constructs (with data), incl. any flagged.
    const mapCons=allCons.filter(c=> els.some(el=> ratings[c.id]&&ratings[c.id][el.id]!=null));
    const M=mapCons.map(c=> els.map(el=> (ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:null));
    let maps=null;
    if(mapCons.length>=2 && els.length>=2){
      const anv=averageVariability(M,lo,hi);
      const bip=pcaBiplot(M,lo,hi);
      const cOrder=focusOrder(simMatrix(M,hi-lo));
      const eOrder=focusOrder(simMatrix(els.map((_,j)=>M.map(row=>row[j])),hi-lo));
      maps={els,cons:mapCons,M,anv,bip,cOrder,eOrder};
    }
    return {rows:analyseGrid(cons,sArr,lo,hi).results.sort((a,b)=>a.rank-b.rank), quotes, excluded:allCons.length-cons.length, maps};
  },[r,config,outId]);

  // Every grid: raw ratings (all elements incl. supplementary) + Honey + quotes.
  function exportGrids(){
    const rows=[];
    responses.forEach(resp=>{
      const els=gridElementsFor(config,resp);          // this interview's elements (incl. supplementary)
      const hEls=elementsFor(config,resp,null);         // Honey subset (supplementary out)
      const d=resp.data||{}; const ratings=d.ratings||{}, supplied=refRatingsFor(d,outId), quotes=d.quotes||{};
      const names=d.elementNames||els.map(e=>e.name);
      const sArr=hEls.map(el=> supplied[el.id]!=null?supplied[el.id]:null);
      const cons=[...config.constructs,...(d.elicited||[])];
      let res=[];
      if(!sArr.every(v=>v==null)){
        res=analyseGrid(cons.map(c=>({id:c.id,left:c.left,right:c.right,
          ratings:hEls.map(el=>(ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:null)})),sArr,lo,hi).results;
      }
      const byId={}; res.forEach(x=>byId[x.id]=x);
      rows.push(['Participant', resp.participant_name||resp.participant_id]);
      rows.push(['Left pole', ...els.map((e,i)=>(names[i]||e.name)+(e.category?' ['+e.category+']':'')+(e.supplementary?' (suppl.)':'')), 'Right pole','Similarity','Band','Rank','Quote','Ref']);
      cons.forEach(c=>{
        const x=byId[c.id]||{}; const q=quotes[c.id]||{};
        rows.push([c.left, ...els.map(el=> (ratings[c.id]&&ratings[c.id][el.id]!=null)?ratings[c.id][el.id]:''), c.right,
          x.similarity!=null?x.similarity.toFixed(4):'', x.band||'', x.rank||'', q.text||'', q.ref||'']);
      });
      outcomes.forEach(oc=>{ const sr=refRatingsFor(d,oc.id);
        rows.push([oc.left+(oc.id===outId?' (Honey reference)':' (outcome)'), ...els.map(el=> sr[el.id]!=null?sr[el.id]:''), oc.right,'','','','','']); });
      rows.push([]);
    });
    downloadCsv(rows, slug(config.title)+'_grids_and_Honey.csv');
  }

  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Step 1 · Individual Honey (one person at a time)</span>
        <p className="hp">Which of one person’s own ways of describing things line up most closely with “what good looks like” (the outcome construct)? That’s Honey’s (1979) individual analysis.</p>
        <span className="help-see"><b>What you’re seeing:</b> pick an interviewee. Their constructs are ranked, longest bar first — the bar is how strongly that construct points toward the preferred end of the outcome. Each is banded <b>H</b>, <b>I</b> or <b>L</b> (top / middle / bottom third of this person’s own range) so you can see which of their ideas matter most. This is one person; steps 2–3 combine everyone.</span><span className="help-ref">Ref: Honey, P. (1979) ‘The repertory grid in action’, <i>Industrial &amp; Commercial Training</i>, 11(11); Jankowicz, D. (2004) <i>The Easy Guide to Repertory Grids</i>.</span></div>
      {responses.length===0 && <div className="inf-box">No interviews yet — run one in the <b>Interviews</b> tab and this analysis fills in automatically.</div>}
      <div className="toolbar">
        <label className="field-lbl" style={{margin:0}}>Interviewee</label>
        <select className="inp inp-sm" style={{width:230,flex:'0 0 auto'}} value={sel} onChange={e=>setSel(e.target.value)}>
          {responses.map(r=><option key={r.participant_id} value={r.participant_id}>{r.participant_name||'(unnamed)'}</option>)}
        </select>
        {outcomes.length>1 && <><label className="field-lbl" style={{margin:'0 0 0 8px'}}>Outcome</label>
          <select className="inp inp-sm" style={{width:210,flex:'0 0 auto'}} value={outId} onChange={e=>setOutId(e.target.value)}>
            {outcomes.map(o=><option key={o.id} value={o.id}>{o.left} → {o.right}</option>)}
          </select></>}
        <div className="grow"/>
        <button className="btn-s btn-sm" onClick={exportGrids}>Export grids + Honey</button>
        {r&&onOpen&&<button className="btn-s btn-sm" onClick={()=>onOpen(r)}>Edit this grid →</button>}
      </div>
      <div className="card">
        {!info||!info.rows.length ? <p className="muted small">No analysis yet — this grid and its supplied construct need ratings.</p> :
        <div className="scroll"><table className="grid">
          <thead><tr>
            <th style={{width:40}}>#</th><th className="pole">Effective pole</th><th style={{width:180}}>Association with effectiveness</th>
            <th className="pole">Contrast pole</th><th style={{width:70}}>Sim</th><th style={{width:54}}>Band</th>
          </tr></thead>
          <tbody>{info.rows.map(x=>{
            const pct=Math.round((x.similarity+1)/2*100);
            const eff = x.orientation==='aligned'? x.left : x.right;
            const opp = x.orientation==='aligned'? x.right : x.left;
            const q=(info.quotes[x.id]||{}).text;
            const col=x.band==='H'?'#16a34a':x.band==='L'?'#dc2626':'#c98a1e';
            return (
              <tr key={x.id}>
                <td>{x.rank}</td>
                <td className="pole"><b>{eff}</b>{q?<div className="mini" style={{maxWidth:260,whiteSpace:'normal'}}>“{q.slice(0,90)}{q.length>90?'…':''}”</div>:null}</td>
                <td><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{flex:1,height:10,background:'#efeae2',borderRadius:3,overflow:'hidden'}}><div style={{width:pct+'%',height:'100%',background:col}}/></div><span className="mini">{pct}%</span></div></td>
                <td className="pole muted">{opp}</td>
                <td>{x.similarity.toFixed(3)}</td>
                <td><span className={"badge "+x.band}>{x.band}</span></td>
              </tr>
            );
          })}</tbody>
        </table></div>}
        {info&&info.excluded>0 && <p className="mini" style={{marginTop:'.5rem'}}>{info.excluded} construct(s) flagged “no clear polarity” and excluded from this Honey ranking (set in the interview grid).</p>}
      </div>

      {info&&info.maps && (
        <div className="card">
          <div className="toolbar" style={{marginBottom:6}}>
            <div className="sec-tag" style={{margin:0}}>Grid maps (Idiogrid-style)</div>
            <span className="tag">Avg variability {info.maps.anv.toFixed(0)}%</span>
            <div className="grow"/>
            <button className="btn-s btn-sm" onClick={()=>setShowMaps(!showMaps)}>{showMaps?'Hide':'Show FOCUS + PrinGrid'}</button>
          </div>
          <p className="field-sub">Average Normal Variability = mean spread of each construct's ratings across the elements (0 = flat, 100 = maximally discriminating). Show the maps for the FOCUS two-way cluster grid and the PrinGrid/PCA biplot.</p>
          {showMaps && <GridMaps maps={info.maps} scaleMin={lo} scaleMax={hi}/>}
        </div>
      )}
    </div>
  );
}

/* PrinGrid biplot + FOCUS-clustered grid for one participant. */
function GridMaps({maps,scaleMin,scaleMax}){
  const {els,cons,M,bip,cOrder,eOrder}=maps;
  const W=560,H=380,cx=W/2,cy=H/2;
  const pts=[...bip.elem, ...bip.con];
  const maxR=Math.max(0.001,...pts.map(p=>Math.hypot(p[0],p[1])));
  const sc=(Math.min(W,H)/2-46)/maxR;
  const X=x=>cx+x*sc, Y=y=>cy-y*sc;
  const shade=v=>{ if(v==null) return '#f4f3f0'; const t=(v-scaleMin)/(scaleMax-scaleMin); const g=Math.round(230-150*t); return 'rgb('+Math.round(224-(224-31)*t)+','+Math.round(224-(224-125)*t)+','+Math.round(216-(216-70)*t)+')'; };
  return (
    <div>
      <div className="sec-tag" style={{marginTop:'.4rem'}}>PrinGrid biplot — PC1 {bip.pct[0].toFixed(0)}% · PC2 {bip.pct[1].toFixed(0)}%</div>
      <div className="scroll"><svg width={W} height={H} style={{border:'1px solid #d8d3cb',borderRadius:4,background:'#fff'}}>
        <line x1={0} y1={cy} x2={W} y2={cy} stroke="#e0ddd8"/><line x1={cx} y1={0} x2={cx} y2={H} stroke="#e0ddd8"/>
        {bip.con.map((p,i)=>(<g key={'c'+i}>
          <line x1={cx} y1={cy} x2={X(p[0])} y2={Y(p[1])} stroke="#e0ddd8"/>
          <circle cx={X(p[0])} cy={Y(p[1])} r={2.5} fill="#c98a1e"/>
          <text x={X(p[0])+3} y={Y(p[1])-2} fontSize="8" fill="#8a6a1e">{(cons[i].left||'').slice(0,16)}</text>
        </g>))}
        {bip.elem.map((p,i)=>(<g key={'e'+i}>
          <circle cx={X(p[0])} cy={Y(p[1])} r={5} fill="#2f5bd7"/>
          <text x={X(p[0])+7} y={Y(p[1])+3} fontSize="10" fontWeight="700" fill="#1a1a1a">{(els[i].name||'').slice(0,20)}</text>
        </g>))}
      </svg></div>
      <div className="sec-tag" style={{marginTop:'.8rem'}}>FOCUS grid — rows &amp; columns reordered so similar items sit together</div>
      <div className="scroll"><table className="grid" style={{fontSize:'.72rem'}}>
        <thead><tr><th className="pole">Construct (left pole)</th>{eOrder.map(j=><th key={j} style={{writingMode:'vertical-rl',height:70}}>{(els[j].name||'').slice(0,16)}</th>)}<th className="pole">Right pole</th></tr></thead>
        <tbody>{cOrder.map(ri=>(
          <tr key={ri}><td className="pole">{cons[ri].left}</td>
            {eOrder.map(j=><td key={j} style={{background:shade(M[ri][j]),color:'#1a1a1a',textAlign:'center'}}>{M[ri][j]!=null?M[ri][j]:''}</td>)}
            <td className="pole muted">{cons[ri].right}</td></tr>
        ))}</tbody>
      </table></div>
    </div>
  );
}

/* ============================ Composite constructs (categorisation) ====================== */
function CompositeConstructs({config,setConfig,responses,onSave,saving,savedMsg,readOnly}){
  const categories=config.categories||[];
  const assignments=config.assignments||{};
  const outcomes=(config.suppliedConstructs&&config.suppliedConstructs.length)?config.suppliedConstructs:[{id:'supplied'}];
  const refId=outcomes[0].id;   // pool constructs against the first outcome (grouping is outcome-independent; ref sets orientation/band)
  const members=useMemo(()=>pooledMembers(responses,config,null,refId),[responses,config,refId]);
  const memberByKey=useMemo(()=>{const o={};members.forEach(m=>o[m.key]=m);return o;},[members]);
  const groups=useMemo(()=>suggestGroups(members.map(m=>({id:m.key,participantId:'',text:m.left+' vs '+m.right}))),[members]);
  const totalP=useMemo(()=>totalParticipants(members),[members]);

  const setCats=(cats)=>setConfig({...config,categories:cats});
  const setAssign=(a)=>setConfig({...config,assignments:a});
  const addCat=()=>setCats([...categories,{id:uid(),name:'New composite',left:'Preferred pole',leftDef:'',right:'Opposite pole',rightDef:'',quote:''}]);
  const editCat=(id,patch)=>setCats(categories.map(c=>c.id===id?{...c,...patch}:c));
  const delCat=(id)=>{ setCats(categories.filter(c=>c.id!==id));
    const a={...assignments}; Object.keys(a).forEach(k=>{if(a[k].cat===id)delete a[k];}); setAssign(a); };
  const unassign=(key, role)=>{
    const a={...assignments};
    if(role==='secondary'&&a[key]){ const x={...a[key]}; delete x.cat2; delete x.flip2; a[key]=x; }
    else delete a[key];
    setAssign(a);
  };
  // Secondary composite = a "Complex Construct" (a construct may sit in two).
  const setSecondary=(key, catId)=>{
    const a={...assignments}; const cur=a[key]; if(!cur) return;
    if(!catId){ const x={...cur}; delete x.cat2; delete x.flip2; a[key]=x; }
    else { const cat=categories.find(c=>c.id===catId); const m=memberByKey[key];
      a[key]={...cur, cat2:catId, flip2: m&&cat? autoFlip(m.effLabel,cat):false}; }
    setAssign(a);
  };
  function assignGroup(grp, catId){
    const cat=categories.find(c=>c.id===catId); const a={...assignments};
    grp.forEach(it=>{ if(catId){ const m=memberByKey[it.id]; a[it.id]={cat:catId, flip:m&&cat?autoFlip(m.effLabel,cat):false}; } else delete a[it.id]; });
    setAssign(a);
  }
  function autoGenerate(){
    if(readOnly) return;
    const cats=[]; const a={...assignments};
    groups.filter(g=>g.length>=3).slice(0,20).forEach(g=>{
      const m0=memberByKey[g[0].id];
      const cat={id:uid(), name:(m0?m0.effLabel:'Composite'), left:(m0?m0.left:'Left'), leftDef:'', right:(m0?m0.right:'Right'), rightDef:'', quote:''};
      cats.push(cat);
      g.forEach(it=>{ const m=memberByKey[it.id]; a[it.id]={cat:cat.id, flip:m?autoFlip(m.effLabel,cat):false}; });
    });
    setConfig({...config, categories:[...categories,...cats], assignments:a});
  }
  const Sup=({n})=> <sup style={{color:'#e07030',fontWeight:700}}>&nbsp;P{n}</sup>;
  // Table 5-2 (RGT Analysis): category, quote, pole definitions, frequencies.
  function exportTable52(){
    const rows=[['Construct Category','Illustrative quote','Construct pole definition','Opposite construct pole','Freq. Total','Unique Freq.','%','Constructs (verbatim, with participant)']];
    categories.forEach(cat=>{
      const mem=membersOf(members, assignments, cat.id);
      const uniq=new Set(mem.map(x=>x.m.participant)).size;
      rows.push([cat.name, cat.quote||'', cat.leftDef||cat.left, cat.rightDef||cat.right,
        mem.length, uniq, totalP?Math.round(uniq/totalP*100)+'%':'',
        mem.map(({m,role})=>m.left+' vs '+m.right+' [P'+m.pnum+(role==='secondary'?'/2°':'')+']').join(' | ')]);
    });
    downloadCsv(rows, slug(config.title)+'_Table5-2_RGT_Analysis.csv');
  }
  const assignedCount=members.filter(m=>(assignments[m.key]||{}).cat).length;
  const unassignedGroups=groups.map(g=>g.filter(it=>!((assignments[it.id]||{}).cat))).filter(g=>g.length);
  const [busy,setBusy]=useState('');
  const [coding,setCoding]=useState(null);      // coderId currently coding by hand
  const [onlyUncoded,setOnlyUncoded]=useState(true);

  // Derive categories from the data using the encoded Jankowicz/Honey method.
  async function derive(){
    if(readOnly) return;
    if(!window.confirm('Derive composite constructs from all '+members.length+' constructs?\n\nThis proposes fresh categories (bottom-up) and REPLACES the current list.')) return;
    setBusy('Deriving categories…');
    try{
      const j=await api('/api/rep-grid-derive',{constructs:members.map(m=>({left:m.left,right:m.right})),target:14,domain:config.title});
      const cats=(j.categories||[]).map(c=>({id:uid(),name:c.name,left:c.left,leftDef:c.leftDef||'',right:c.right,rightDef:c.rightDef||'',quote:''}));
      if(!cats.length) throw new Error('no categories returned');
      setConfig({...config, categories:cats, assignments:{}});
      setBusy('');
      alert('Derived '+cats.length+' composite constructs. Review/edit them, then use “AI assign constructs”.');
    }catch(e){ setBusy(''); alert('Derive failed: '+e.message); }
  }
  // ---- Independent coder schemes (each coder derives & codes their OWN categories) ----
  const coderSchemes=config.coderSchemes||{};
  async function deriveForCoder(cd){
    if(readOnly) return;
    if(!members.length){ alert('No constructs to code yet.'); return; }
    setBusy(cd.name+' deriving own scheme…');
    try{
      const j=await api('/api/rep-grid-derive',{constructs:members.map(m=>({left:m.left,right:m.right})),target:14,domain:config.title});
      const scheme=(j.categories||[]).map(c=>({id:uid(),name:c.name,left:c.left,leftDef:c.leftDef||'',right:c.right,rightDef:c.rightDef||''}));
      if(!scheme.length) throw new Error('no categories returned');
      const assign={}; const Bt=60;
      for(let i=0;i<members.length;i+=Bt){
        setBusy(cd.name+' coding own scheme… '+Math.min(i+Bt,members.length)+'/'+members.length);
        const batch=members.slice(i,i+Bt);
        const cj=await api('/api/rep-grid-classify',{constructs:batch.map(m=>({id:m.key,left:m.left,right:m.right})),categories:scheme,pass:cd.stance||'A'});
        (cj.assignments||[]).forEach(a=>{ if(a.cat){ assign[a.id]={cat:a.cat,flip:!!a.flip}; if(a.cat2){assign[a.id].cat2=a.cat2;assign[a.id].flip2=!!a.flip2;} } });
      }
      setConfig({...config, coderSchemes:{...coderSchemes,[cd.id]:scheme}, coders:{...(config.coders||{}),[cd.id]:assign}});
      setBusy(''); alert(cd.name+' derived '+scheme.length+' categories and coded all constructs. Compare schemes below, then adopt one as the agreed scheme.');
    }catch(e){ setBusy(''); alert('Failed: '+e.message); }
  }
  // Adopt one coder's independent scheme as the shared/agreed categorisation.
  function adoptScheme(cdId){
    const scheme=coderSchemes[cdId]; const assign=(config.coders||{})[cdId];
    if(!scheme||!assign){ return; }
    setConfig({...config, categories:scheme.map(c=>({...c,quote:c.quote||''})), assignments:{...assign}});
    alert('Adopted as the agreed scheme. It now drives the composite constructs and Honey tables; refine on this tab as needed.');
  }
  // ---- Coder panel: up to 4 coders, each AI (with a reasoning stance) or human.
  const STANCES={A:'Definition-led',B:'Participant-language-led',C:'Contrast-led',D:'Exemplar-led'};
  const meta=config.coderMeta||[];
  const coders=config.coders||{};
  const catName=(id)=>(categories.find(c=>c.id===id)||{}).name||'—';
  // Independent-scheme comparison: how similarly two coders GROUPED the constructs.
  const schemeCoders=meta.filter(cd=>coderSchemes[cd.id]&&coderSchemes[cd.id].length);
  const coderClusters=(cdId)=>{ const a=coders[cdId]||{}; const cl={}; Object.keys(a).forEach(k=>{ const c=a[k].cat; if(!c) return; (cl[c]=cl[c]||new Set()).add(k); }); return cl; };
  const schemeOverlap=(idA,idB)=>{ const A=coderClusters(idA),B=coderClusters(idB); const bc=Object.keys(B); let ws=0,tot=0; const rows=[];
    Object.keys(A).forEach(ca=>{ const sa=A[ca]; let best=0,bestB=null; bc.forEach(cb=>{ const sb=B[cb]; let inter=0; sa.forEach(x=>{if(sb.has(x))inter++;}); const uni=sa.size+sb.size-inter; const j=uni?inter/uni:0; if(j>best){best=j;bestB=cb;} }); rows.push({ca,size:sa.size,bestB,jac:best}); ws+=best*sa.size; tot+=sa.size; });
    return {rows, overall: tot?ws/tot:0}; };
  const schemeName=(cdId,catId)=>((coderSchemes[cdId]||[]).find(c=>c.id===catId)||{}).name||'—';
  const setMeta=(m)=>setConfig({...config,coderMeta:m});
  const addCoder=(type)=>{
    if(meta.length>=4){ alert('Maximum of 4 coders.'); return; }
    const used=meta.filter(m=>m.type==='ai').map(m=>m.stance);
    const stance=['A','B','C','D'].find(s=>!used.includes(s))||'A';
    const id='cd'+Date.now().toString(36);
    setMeta([...meta,{id,type,stance:type==='ai'?stance:null,
      name:type==='ai'?('AI · '+STANCES[stance]):('Human coder '+(meta.filter(m=>m.type==='human').length+1))}]);
  };
  const editCoder=(id,patch)=>setMeta(meta.map(m=>m.id===id?{...m,...patch}:m));
  const delCoder=(id)=>{ const c={...coders}; delete c[id]; setConfig({...config,coderMeta:meta.filter(m=>m.id!==id),coders:c}); };

  async function runAiCoder(cd){
    if(readOnly) return;
    if(!categories.length){ alert('Create or derive composite constructs first.'); return; }
    const cats=categories.map(c=>({id:c.id,name:c.name,left:c.left,leftDef:c.leftDef,right:c.right,rightDef:c.rightDef}));
    const out={}; const B=60;
    for(let i=0;i<members.length;i+=B){
      setBusy(cd.name+' coding… '+Math.min(i+B,members.length)+'/'+members.length);
      const batch=members.slice(i,i+B);
      try{
        const j=await api('/api/rep-grid-classify',{constructs:batch.map(m=>({id:m.key,left:m.left,right:m.right})),categories:cats,pass:cd.stance});
        (j.assignments||[]).forEach(x=>{
          if(x&&x.id&&x.cat&&cats.some(c=>c.id===x.cat)){
            const rec={cat:x.cat, flip:!!x.flip};
            if(x.cat2 && x.cat2!==x.cat && cats.some(c=>c.id===x.cat2)){ rec.cat2=x.cat2; rec.flip2=!!x.flip2; }
            out[x.id]=rec;
          }
        });
      }catch(e){}
    }
    setConfig({...config, coders:{...coders,[cd.id]:out}});
    setBusy('');
    alert(cd.name+' coded '+Object.keys(out).length+' of '+members.length+' constructs.');
  }
  // Reliability across every coder that has coded anything.
  const activeIds=meta.filter(m=>coders[m.id]&&Object.keys(coders[m.id]).length).map(m=>m.id);
  const sets=activeIds.map(id=>coders[id]);
  const stats=useMemo(()=> sets.length>=2? multiStats(sets):null,[config.coders,config.coderMeta]);
  function acceptAllAgreed(){
    if(!stats) return;
    const a={...assignments}; let n=0;
    Object.keys(sets[0]).forEach(k=>{ if(sets.every(s=>s[k]&&s[k].cat===sets[0][k].cat)){ a[k]={...sets[0][k]}; n++; } });
    setConfig({...config,assignments:a}); alert('Accepted '+n+' unanimous codes.');
  }
  function acceptMajority(){
    const a={...assignments}; let n=0;
    (stats?stats.disagree:[]).forEach(k=>{ const p=majorityPick(sets,k); if(p){ a[k]={cat:p.cat,flip:p.flip}; n++; } });
    setConfig({...config,assignments:a}); alert('Accepted '+n+' majority codes. Ties left for you.');
  }
  function adjudicate(key, coderId){
    const pick=(coders[coderId]||{})[key]; if(!pick) return;
    setConfig({...config, assignments:{...assignments, [key]:{...pick}}});
  }
  // Human coding: set this coder's code for one construct.
  function humanCode(coderId, key, catId, cat2Id){
    const cur={...(coders[coderId]||{})};
    if(!catId) delete cur[key];
    else {
      const m=memberByKey[key];
      const cat=categories.find(c=>c.id===catId);
      const rec={cat:catId, flip:m&&cat?autoFlip(m.effLabel,cat):false};
      if(cat2Id){ const c2=categories.find(c=>c.id===cat2Id);
        rec.cat2=cat2Id; rec.flip2=m&&c2?autoFlip(m.effLabel,c2):false; }
      cur[key]=rec;
    }
    setConfig({...config, coders:{...coders,[coderId]:cur}});
  }

  // ---- Human coding view (one coder, coding independently) ----
  if(coding){
    const cd=meta.find(m=>m.id===coding)||{name:'Coder'};
    const mine=coders[coding]||{};
    const doneN=Object.keys(mine).length;
    const list=(onlyUncoded? members.filter(m=>!mine[m.key]) : members);
    return (
      <div className="fade">
        <button className="back-btn" onClick={()=>setCoding(null)}>← Back to coders</button>
        <div className="inf-box">Coding as <b>{cd.name}</b>. Code independently — don't consult the other coders; the reliability statistic only means something if the passes are genuinely separate. <b>{doneN}/{members.length}</b> coded.</div>
        <div className="toolbar">
          <label className="anon-toggle"><input type="checkbox" checked={onlyUncoded} onChange={e=>setOnlyUncoded(e.target.checked)}/> Show only uncoded</label>
          <div className="grow"/>
          {savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}
          <button className="btn-p btn-sm" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save coding'}</button>
        </div>
        <div className="card">
          {list.length===0 && <p className="mini">Nothing left to code.</p>}
          {list.slice(0,250).map(m=>(
            <div className="list-row" key={m.key}>
              <span style={{flex:1,fontSize:'.82rem'}}>{m.left} <span className="mini">vs</span> {m.right}<Sup n={m.pnum}/>
                {(mine[m.key]||{}).text?<div className="mini" style={{whiteSpace:'normal',maxWidth:420}}>“{mine[m.key].text}”</div>:null}</span>
              <select className="inp inp-sm" style={{width:200,flex:'0 0 auto'}} value={(mine[m.key]||{}).cat||''} onChange={e=>humanCode(coding,m.key,e.target.value)}>
                <option value="">— uncoded —</option>
                {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <select className="inp inp-sm" style={{width:180,flex:'0 0 auto'}} title="Optional second composite (complex construct)"
                value={(mine[m.key]||{}).cat2||''} disabled={!(mine[m.key]||{}).cat}
                onChange={e=>humanCode(coding,m.key,(mine[m.key]||{}).cat,e.target.value)}>
                <option value="">+ secondary…</option>
                {categories.filter(c=>c.id!==(mine[m.key]||{}).cat).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          ))}
          {list.length>250 && <p className="mini">Showing 250 of {list.length}. Code these, then the next batch appears.</p>}
        </div>
      </div>
    );
  }

  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Step 2 · Composite constructs (grouping)</span>
        <p className="hp">Gather everyone’s wording and sort it into a handful of shared themes — the same idea, worded differently, goes in one pile. Each theme (a <b>composite construct</b>) gets a preferred and an opposite pole. This is the heart of the content analysis.</p>
        <span className="help-see"><b>What you’re seeing:</b> every construct from every interview, pooled (the small P3 etc. shows who said it). Build themes by hand with <b>+ Add composite</b>, add AI or human <b>coders</b> to sort independently (then check they agree), or <b>Derive from data</b> for an automatic first draft. Counter below: {members.length} constructs · {assignedCount} assigned · {totalP} participants.</span><span className="help-ref">Ref: Jankowicz, D. (2004) <i>The Easy Guide to Repertory Grids</i> (core-categorisation); Honey, P. (1979). For coder agreement: Krippendorff, K. (2004) <i>Content Analysis</i>.</span></div>

      <div className="toolbar">
        <div className="sec-tag" style={{margin:0}}>Composite constructs ({categories.length})</div>
        <div className="grow"/>
        {busy && <span className="small" style={{color:'#e07030'}}>{busy}</span>}
        {!readOnly&&<button className="btn-s btn-sm" disabled={!!busy} onClick={derive}>✦ Derive from data</button>}
        <button className="btn-s btn-sm" onClick={exportTable52}>Export Table 5-2</button>
        {!readOnly&&<button className="btn-s btn-sm" onClick={addCat}>+ Add composite</button>}
      </div>

      {/* ---- Coding panel: AI only / AI + human / human only ---- */}
      <div className="card">
        <div className="toolbar">
          <div className="sec-tag" style={{margin:0}}>Coders ({meta.length}/4)</div>
          <div className="grow"/>
          {!readOnly&&<button className="btn-s btn-sm" disabled={meta.length>=4} onClick={()=>addCoder('ai')}>+ AI coder</button>}
          {!readOnly&&<button className="btn-s btn-sm" disabled={meta.length>=4} onClick={()=>addCoder('human')}>+ Human coder</button>}
        </div>
        <p className="field-sub">Add up to four independent coders — any mix of AI and human. Each codes the full set alone; the tool then reports inter-rater reliability and asks you to settle only the disagreements (Jankowicz's reconciliation step).</p>
        {meta.length===0 && <p className="mini">No coders yet. Add two or more to get a reliability statistic.</p>}
        {meta.map(cd=>{
          const n=Object.keys(coders[cd.id]||{}).length;
          return (
            <div className="list-row" key={cd.id}>
              <span className="tag" style={cd.type==='ai'?{background:'#f0e2d5',color:'#b5651a'}:{background:'#dcefe0',color:'#16794a'}}>{cd.type==='ai'?'AI':'HUMAN'}</span>
              <input className="inp inp-sm" style={{flex:2}} value={cd.name} readOnly={readOnly} onChange={e=>editCoder(cd.id,{name:e.target.value})}/>
              {cd.type==='ai'
                ? <select className="inp inp-sm" style={{width:190,flex:'0 0 auto'}} value={cd.stance||'A'} disabled={readOnly} onChange={e=>editCoder(cd.id,{stance:e.target.value,name:'AI · '+STANCES[e.target.value]})}>
                    {Object.keys(STANCES).map(s=><option key={s} value={s}>{STANCES[s]}</option>)}
                  </select>
                : <span className="mini" style={{width:190}}>codes manually</span>}
              <span className="mini" style={{minWidth:74}}>{n}/{members.length}</span>
              {!readOnly&&(cd.type==='ai'
                ? <button className="btn-p btn-sm" disabled={!!busy} onClick={()=>runAiCoder(cd)}>Run</button>
                : <button className="btn-p btn-sm" onClick={()=>setCoding(cd.id)}>Code</button>)}
              {!readOnly&&cd.type==='ai'&&<button className="btn-s btn-sm" disabled={!!busy} title="Derive & code this coder's OWN category scheme (independent of the shared one)" onClick={()=>deriveForCoder(cd)}>Own scheme</button>}
              {!readOnly&&<button className="x" onClick={()=>delCoder(cd.id)}>✕</button>}
            </div>
          );
        })}
      </div>

      {schemeCoders.length>0 && (
        <div className="card">
          <div className="sec-tag">Independent coder schemes ({schemeCoders.length})</div>
          <p className="field-sub">Each coder here derived and coded their <b>own</b> category scheme. Compare how similarly two coders grouped the constructs, then <b>adopt</b> one scheme (or your reconciled edit of it) as the agreed categorisation that drives the Honey tables.</p>
          {schemeCoders.map(cd=>(
            <div className="list-row" key={cd.id}>
              <span className="tag" style={{background:'#f0e2d5',color:'#b5651a'}}>{cd.name}</span>
              <span className="mini">{coderSchemes[cd.id].length} categories · {Object.keys(coders[cd.id]||{}).length} constructs coded</span>
              <div className="grow"/>
              {!readOnly&&<button className="btn-s btn-sm" onClick={()=>adoptScheme(cd.id)}>Adopt as agreed scheme →</button>}
            </div>
          ))}
          {schemeCoders.length>=2 && (()=>{ const a=schemeCoders[0], b=schemeCoders[1]; const ov=schemeOverlap(a.id,b.id); return (
            <div style={{marginTop:'.7rem'}}>
              <div className="mini" style={{marginBottom:4}}>Grouping overlap — <b>{a.name}</b> vs <b>{b.name}</b>: <b>{Math.round(ov.overall*100)}%</b> <span style={{color:'#888'}}>(mean best-match Jaccard, weighted by category size — how similarly the two schemes cluster the same constructs)</span></div>
              <div className="scroll"><table className="grid" style={{fontSize:'.74rem'}}>
                <thead><tr><th className="pole">{a.name} category</th><th style={{width:40}}>n</th><th className="pole">Best match — {b.name}</th><th style={{width:64}}>Overlap</th></tr></thead>
                <tbody>{ov.rows.sort((x,y)=>y.size-x.size).map((r,i)=>(
                  <tr key={i}><td className="pole">{schemeName(a.id,r.ca)}</td><td>{r.size}</td><td className="pole muted">{r.bestB?schemeName(b.id,r.bestB):'—'}</td><td>{Math.round(r.jac*100)}%</td></tr>
                ))}</tbody>
              </table></div>
            </div>
          );})()}
        </div>
      )}

      {stats && (
        <div className="card">
          <div className="sec-tag">Inter-rater reliability — {activeIds.length} coders</div>
          <div className="row" style={{alignItems:'center'}}>
            <div><div className="mini">Unanimous agreement</div><div style={{fontSize:'1.4rem',fontWeight:700,color:'#16a34a'}}>{(stats.po*100).toFixed(1)}%</div></div>
            <div><div className="mini">{stats.kind}</div><div style={{fontSize:'1.4rem',fontWeight:700}}>{stats.kappa.toFixed(2)}</div></div>
            {stats.krip&&stats.krip.alpha!=null&&<div><div className="mini">Krippendorff’s α</div><div style={{fontSize:'1.4rem',fontWeight:700}} title={'over '+stats.krip.n+' constructs coded by ≥2 coders'}>{stats.krip.alpha.toFixed(2)}</div></div>}
            <div><div className="mini">Agreed</div><div style={{fontSize:'1.4rem',fontWeight:700}}>{stats.unanimous}</div></div>
            <div><div className="mini">To settle</div><div style={{fontSize:'1.4rem',fontWeight:700,color:'#dc2626'}}>{stats.disagree.length}</div></div>
          </div>
          <div className="btn-row" style={{marginTop:'.6rem'}}>
            <button className="btn-s btn-sm" onClick={acceptAllAgreed}>Accept unanimous</button>
            {activeIds.length>=3 && <button className="btn-s btn-sm" onClick={acceptMajority}>Accept majority</button>}
          </div>
          <p className="field-sub" style={{marginTop:'.4rem'}}>{activeIds.length===2?'Cohen’s κ':'Fleiss’ κ'} is computed over the {stats.n} constructs all coders coded; <b>Krippendorff’s α</b> also includes constructs coded by only some coders ({stats.krip?stats.krip.n:0}), which is why researchers often prefer it. Both: &gt; 0.80 “almost perfect”, 0.67–0.80 “acceptable/substantial”.</p>
        </div>
      )}

      {stats && stats.disagree.length>0 && (
        <div className="card">
          <div className="sec-tag">Disagreements to settle ({stats.disagree.length})</div>
          {stats.disagree.slice(0,120).map(k=>{
            const m=memberByKey[k]; if(!m) return null;
            const cur=(assignments[k]||{}).cat;
            return (
              <div className="list-row" key={k} style={{alignItems:'flex-start'}}>
                <span style={{flex:1,fontSize:'.82rem'}}>{m.left} <span className="mini">vs</span> {m.right}<Sup n={m.pnum}/></span>
                {activeIds.map(id=>{
                  const pick=coders[id][k]; if(!pick) return null;
                  const cd=meta.find(x=>x.id===id);
                  return <button key={id} className="btn-s btn-sm" title={cd.name}
                    style={cur===pick.cat?{borderColor:'#16a34a',fontWeight:700}:{}}
                    onClick={()=>adjudicate(k,id)}>{(cd.type==='ai'?'🤖':'🧑')} {catName(pick.cat)}</button>;
                })}
              </div>
            );
          })}
          {stats.disagree.length>120 && <p className="mini">Showing first 120 of {stats.disagree.length}.</p>}
        </div>
      )}
      {categories.length===0 && <p className="muted small">None yet. Auto-generate to seed categories from similar constructs, then rename and edit definitions.</p>}
      {categories.map(cat=>{
        const mem=membersOf(members, assignments, cat.id);
        const uniq=new Set(mem.map(x=>x.m.participant)).size;
        return (
          <div className="card" key={cat.id}>
            <div className="toolbar" style={{marginBottom:6}}>
              <input className="inp inp-sm" style={{maxWidth:240,fontWeight:700}} value={cat.name} readOnly={readOnly} onChange={e=>editCat(cat.id,{name:e.target.value})}/>
              <span className="tag">{mem.length} constructs · {uniq} ppts · {totalP?Math.round(uniq/totalP*100):0}%</span>
              <div className="grow"/>
              {!readOnly&&<button className="x" onClick={()=>delCat(cat.id)}>✕</button>}
            </div>
            <div className="row">
              <div><label className="field-lbl">Preferred pole (+ definition)</label>
                <input className="inp inp-sm" value={cat.left} readOnly={readOnly} onChange={e=>editCat(cat.id,{left:e.target.value})}/>
                <textarea className="inp inp-sm" rows={2} placeholder="definition…" value={cat.leftDef||''} readOnly={readOnly} onChange={e=>editCat(cat.id,{leftDef:e.target.value})} style={{marginTop:4}}/></div>
              <div><label className="field-lbl">Opposite pole (+ definition)</label>
                <input className="inp inp-sm" value={cat.right} readOnly={readOnly} onChange={e=>editCat(cat.id,{right:e.target.value})}/>
                <textarea className="inp inp-sm" rows={2} placeholder="definition…" value={cat.rightDef||''} readOnly={readOnly} onChange={e=>editCat(cat.id,{rightDef:e.target.value})} style={{marginTop:4}}/></div>
            </div>
            <div className="field" style={{marginTop:8}}><label className="field-lbl">Illustrative quote</label>
              <input className="inp inp-sm" value={cat.quote||''} readOnly={readOnly} onChange={e=>editCat(cat.id,{quote:e.target.value})} placeholder="“…”"/></div>
            <div>{mem.length?mem.map(({m,role})=>(
              <span className="chip" key={m.key+role} style={{cursor:readOnly?'default':'pointer',borderStyle:role==='secondary'?'dashed':'solid'}}
                title={readOnly?(role==='secondary'?'secondary composite (complex construct)':''):(role==='secondary'?'secondary composite (complex construct) — click to remove':'click to remove')}
                onClick={()=>{ if(!readOnly) unassign(m.key, role); }}>{m.left} vs {m.right}<Sup n={m.pnum}/>{role==='secondary'?<sup style={{color:'#888'}}>&nbsp;2°</sup>:null}</span>
            )):<span className="mini">No constructs assigned yet — use the pool below.</span>}</div>
          </div>
        );
      })}

      {!readOnly&&<div className="card">
        <div className="sec-tag">Assign remaining constructs ({members.length-assignedCount})</div>
        <p className="field-sub">Every unassigned construct, verbatim, grouped by similarity. Assign a whole group to a composite; click any assigned chip above to remove it.</p>
        {unassignedGroups.length===0 && <p className="mini">All constructs assigned.</p>}
        {unassignedGroups.map((g,i)=>(
          <div className="list-row" key={i} style={{alignItems:'flex-start'}}>
            <div style={{flex:1}}>{g.map(it=>{const m=memberByKey[it.id]; return <span className="chip" key={it.id}>{m.left} vs {m.right}<Sup n={m.pnum}/></span>;})}</div>
            <select className="inp inp-sm" style={{width:210,flex:'0 0 auto'}} value="" onChange={e=>assignGroup(g,e.target.value)}>
              <option value="">assign to…</option>
              {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
        ))}
      </div>}

      {!readOnly&&<div className="btn-row">
        <div className="grow"/>
        {savedMsg&&<span className="small" style={{color:'#16794a'}}>{savedMsg}</span>}
        <button className="btn-p" onClick={onSave} disabled={saving}>{saving?'Saving…':'Save categorisation'}</button>
      </div>}
    </div>
  );
}

/* ============================ Composite Honey table ====================== */
const CAT_FULL={};
function catFull(c){ return CAT_FULL[c]||c; }
function CompositeTable({config,responses}){
  const elemCats=[...new Set([].concat(...responses.map(r=>elementsFor(config,r,null).map(e=>e.category))).filter(Boolean))];
  const catFull=(c)=>{ const m=(config.elementCategories||[]).find(x=>(x.short||x.name)===c); return m?m.name:c; };
  const [seg,setSeg]=useState('all');
  const outcomes=(config.suppliedConstructs&&config.suppliedConstructs.length)?config.suppliedConstructs:[{id:'supplied',left:config.suppliedLeft||'Preferred',right:config.suppliedRight||'Opposite'}];
  const prescribedRef=(config.constructs||[]).filter(x=>x.left||x.right);
  const refOptions=[...outcomes,...prescribedRef];
  const [refId,setRefId]=useState(outcomes[0].id);
  const [threshold,setThreshold]=useState(0);
  const categories=config.categories||[], assignments=config.assignments||{};
  const refCons=refOptions;
  const memAll=useMemo(()=>pooledMembers(responses,config,null,refId),[responses,config,refId]);
  const totalP=totalParticipants(memAll);
  const fixedOrient=useMemo(()=>fixedOrientOf(memAll),[memAll]);
  const rowsFor=(filter)=> compositeRows(pooledMembers(responses,config,filter,refId),categories,assignments,totalP,fixedOrient);
  const all=useMemo(()=>rowsFor(null),[responses,config,seg,refId]);
  const segRows=useMemo(()=> (seg==='all'||seg==='compare')?null:rowsFor(seg),[responses,config,seg,refId]);
  const cmp=useMemo(()=> (seg==='compare'&&elemCats.length>=2)? elemCats.map(c=>({c, rows:rowsFor(c)})):null,[responses,config,seg,refId]);
  const refObj = refOptions.find(x=>x.id===refId)||outcomes[0];
  const refLabel = (refObj.left||'Preferred')+' → '+(refObj.right||'Opposite');

  if(categories.length===0) return <div className="help-box"><span className="help-h">Step 3 · Composite table (the final result)</span>Nothing to show yet. First build your <b>composite constructs</b> on the <b>2 · Composite constructs</b> tab. Once you have categories, this tab automatically turns them into the <b>Honey Content Table</b> — the headline finding of the whole study.</div>;

  const bar=(l)=> <div style={{display:'inline-flex',width:70,height:10,borderRadius:3,overflow:'hidden',border:'1px solid #d8d3cb',verticalAlign:'middle'}}>
    <div style={{width:l+'%',background:'#3f7d4e'}}/><div style={{flex:1,background:'#efeae2'}}/></div>;

  function HoneyTable({rows,title}){
    return (
      <div style={{marginBottom:18}}>
        {title&&<div className="sec-tag">{title}</div>}
        <div className="scroll"><table className="grid">
          <thead><tr>
            <th className="pole">Construct category</th><th style={{width:60}}>Unique freq %</th>
            <th className="pole">Preferred pole</th><th style={{width:120}}>Mean similarity %</th>
            <th className="pole">Opposite pole</th><th style={{width:70}}>Mean sim %</th>
            <th style={{width:110}}>Preference</th><th style={{width:48}}>H%</th><th style={{width:48}}>I%</th><th style={{width:48}}>L%</th>
          </tr></thead>
          <tbody>
            {rows.filter(r=>r.n>0 && r.uniquePct>=threshold).map(r=>(
              <tr key={r.cat.id}>
                <td className="pole"><b>{r.cat.name}</b>{r.cat.quote?<div className="mini" style={{maxWidth:180,whiteSpace:'normal'}}>“{r.cat.quote.slice(0,70)}”</div>:null}</td>
                <td>{Math.round(r.uniquePct)}%</td>
                <td className="pole" style={{maxWidth:200,whiteSpace:'normal'}}>{r.cat.left}{r.cat.leftDef?<div className="mini">{r.cat.leftDef.slice(0,60)}</div>:null}</td>
                <td>{bar(r.left)} <b>{r.left.toFixed(0)}%</b></td>
                <td className="pole muted" style={{maxWidth:200,whiteSpace:'normal'}}>{r.cat.right}</td>
                <td>{r.right.toFixed(0)}%</td>
                <td>{r.pref}</td>
                <td>{r.H.toFixed(0)}</td><td>{r.I.toFixed(0)}</td><td>{r.L.toFixed(0)}</td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>
    );
  }
  function Comparative(){
    const byCat=elemCats.map(c=>({c, rows:rowsFor(c)}));
    const catRows=categories.map((cat,i)=>({cat, cells:byCat.map(b=>b.rows.find(r=>r.cat.id===cat.id))}));
    return (
      <div className="scroll"><table className="grid">
        <thead><tr><th className="pole">Construct area</th>{elemCats.map(c=><th key={c} className="pole">{catFull(c)}</th>)}</tr></thead>
        <tbody>{catRows.filter(x=>x.cells.some(c=>c&&c.n>0)).map(x=>(
          <tr key={x.cat.id}>
            <td className="pole"><b>{x.cat.left}</b> <span className="mini">vs</span> {x.cat.right}</td>
            {x.cells.map((c,j)=><td key={j} className="pole" style={{whiteSpace:'normal'}}>{c&&c.n? c.pref+' — '+c.left.toFixed(0)+'% '+x.cat.left : '—'}</td>)}
          </tr>
        ))}</tbody>
      </table></div>
    );
  }

  function exportHoney(){
    const hdr=['Construct category','Unique freq %','Preferred pole','Preferred pole definition','Mean similarity %','Opposite pole','Opposite pole definition','Mean sim %','Preference','H%','I%','L%','n constructs'];
    const rows=[];
    const push=(label,rs)=>{ rows.push([label]); rows.push(hdr);
      rs.filter(r=>r.n>0).forEach(r=>rows.push([r.cat.name, Math.round(r.uniquePct)+'%', r.cat.left, r.cat.leftDef||'',
        r.left.toFixed(1)+'%', r.cat.right, r.cat.rightDef||'', r.right.toFixed(1)+'%', r.pref,
        r.H.toFixed(0), r.I.toFixed(0), r.L.toFixed(0), r.n])); rows.push([]); };
    push('Honey Content Table — ALL elements', all);
    elemCats.forEach(c=> push('Honey Content Table — '+catFull(c)+' elements only', rowsFor(c)));
    downloadCsv(rows, slug(config.title)+'_Honey_Content_Table.csv');
  }
  // Per-construct × every outcome matrix (similarity % + H/I/L band) — one row per construct.
  function exportOutcomesMatrix(){
    const perO={}; outcomes.forEach(o=>{ perO[o.id]={}; pooledMembers(responses,config,null,o.id).forEach(m=>{ perO[o.id][m.key]=m; }); });
    const keys=new Set(); outcomes.forEach(o=>Object.keys(perO[o.id]).forEach(k=>keys.add(k)));
    const hdr=['Participant','Construct','Opposite pole','Category'];
    outcomes.forEach(o=>{ hdr.push(o.left+' — sim %'); hdr.push(o.left+' — band'); });
    const rows=[hdr];
    [...keys].forEach(k=>{
      let rep=null; for(const o of outcomes){ if(perO[o.id][k]){ rep=perO[o.id][k]; break; } }
      if(!rep) return;
      const catId=(assignments[k]||{}).cat; const cat=(categories.find(c=>c.id===catId)||{}).name||'';
      const row=[rep.participant, rep.left, rep.right, cat];
      outcomes.forEach(o=>{ const m=perO[o.id][k]; if(m){ row.push((Math.max(m.leftAlignPct,m.rightAlignPct)*2-100).toFixed(1)); row.push(m.band); } else { row.push(''); row.push(''); } });
      rows.push(row);
    });
    downloadCsv(rows, slug(config.title)+'_outcomes_matrix.csv');
  }
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Step 3 · Composite table — the Honey Content Table</span>This is the payoff. For each <b>composite construct</b>, it shows the average similarity of its preferred pole to the effectiveness reference (<b>{refLabel}</b>), how many people mentioned it, and its <b>H/I/L</b> spread — so you can read off which shared themes matter most. Split it by <b>element category</b> ({elemCats.length?elemCats.map(c=>c+' = '+catFull(c)).join(' · '):'none yet'}) to get a table per category plus a comparative view, change the <b>reference construct</b> to analyse against a different criterion, or apply a <b>frequency threshold</b> (a common cut-off keeps only categories cited by ≥50% of participants). Held-out elements are excluded.</div>

      <div className="toolbar" style={{gap:'.6rem',flexWrap:'wrap'}}>
        <span className="mini">Split:</span>
        <button className="btn-s btn-sm" style={seg==='all'?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg('all')}>All elements</button>
        {elemCats.map(c=><button key={c} className="btn-s btn-sm" style={seg===c?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg(c)}>{catFull(c)}</button>)}
        {elemCats.length>=2 && <button className="btn-s btn-sm" style={seg==='compare'?{borderColor:'#1a1a1a'}:{}} onClick={()=>setSeg('compare')}>Comparative</button>}
        <div className="grow"/>
        {outcomes.length>1 && <button className="btn-s btn-sm" onClick={exportOutcomesMatrix}>Export outcomes matrix</button>}
        <button className="btn-s btn-sm" onClick={exportHoney}>Export Honey tables</button>
      </div>
      <div className="toolbar" style={{gap:'.6rem',flexWrap:'wrap',marginTop:'-.6rem'}}>
        {refOptions.length>1 && <span className="mini">{outcomes.length>1?'Outcome:':'Reference:'}
          <select className="inp inp-sm" style={{width:240,marginLeft:6}} value={refId} onChange={e=>setRefId(e.target.value)}>
            {outcomes.map(x=><option key={x.id} value={x.id}>{x.left} → {x.right}</option>)}
            {prescribedRef.length>0 && <optgroup label="Other reference constructs">{prescribedRef.map(x=><option key={x.id} value={x.id}>{x.left} → {x.right}</option>)}</optgroup>}
          </select></span>}
        <span className="mini">Freq. threshold:</span>
        {[0,25,50].map(t=><button key={t} className="btn-s btn-sm" style={threshold===t?{borderColor:'#1a1a1a'}:{}} onClick={()=>setThreshold(t)}>{t===0?'off':'≥'+t+'%'}</button>)}
      </div>

      <div className="card">
        <div className="sec-tag">Results summary — categories by unique frequency (Figure 5-3)</div>
        {[...all].filter(r=>r.n>0).sort((a,b)=>b.uniquePct-a.uniquePct).map(r=>(
          <div key={r.cat.id} style={{display:'flex',alignItems:'center',gap:8,margin:'2px 0'}}>
            <div style={{width:160,fontSize:'.74rem',textAlign:'right',color:r.uniquePct>=threshold?'#1a1a1a':'#b0a898',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.cat.name}</div>
            <div style={{flex:1,height:13,background:'#efeae2',borderRadius:3,overflow:'hidden'}}><div style={{width:r.uniquePct+'%',height:'100%',background:r.uniquePct>=(threshold||1)?'#e07030':'#d8b9a3'}}/></div>
            <div style={{width:38,fontSize:'.72rem'}}>{Math.round(r.uniquePct)}%</div>
          </div>
        ))}
        {all.filter(r=>r.n>0).length===0&&<p className="mini">No categories with assigned constructs yet.</p>}
      </div>

      <div className="card">
        {seg==='all' && <HoneyTable rows={all}/>}
        {segRows && <HoneyTable rows={segRows} title={catFull(seg)+' situations only (Honey Content Table)'}/>}
        {cmp && <Comparative/>}
        <p className="mini" style={{marginTop:'.6rem'}}>Mean similarity % = average Honey similarity of the composite's preferred pole to <b>{refLabel}</b> across its member constructs. Unique freq % = share of participants with a construct in the category{threshold>0?' (showing ≥'+threshold+'% only)':''}. H/I/L% = band spread. Following Honey (1979) / Jankowicz (2004).</p>
      </div>
    </div>
  );
}

/* ============================ Dashboard ====================== */
/* ==================== Structure pack modules ==================== */
function ppSelect(withData,sel,setSel){
  return <select className="inp inp-sm" style={{width:240,flex:'0 0 auto'}} value={sel} onChange={e=>setSel(e.target.value)}>
    {withData.map(x=><option key={x.participant_id} value={x.participant_id}>{x.participant_name||'(unnamed)'}</option>)}</select>;
}
function ComplexityModule({config,responses}){
  const lo=config.scaleMin,hi=config.scaleMax;
  const withData=responses.filter(r=>gridFor(config,r).cons.length>=2);
  const [sel,setSel]=useState(withData[0]?withData[0].participant_id:'');
  const r=responses.find(x=>x.participant_id===sel);
  const g=r?gridFor(config,r):null;
  const pv=g&&g.M.length?pvaff(g.M):null, bi=g&&g.M.length?bieriIndex(g.M,lo,hi):null, it=g&&g.M.length?intensityGrid(g.M):null, av=g&&g.M.length?averageVariability(g.M,lo,hi):null;
  const per=withData.map(x=>{const gg=gridFor(config,x); return {pvaff:pvaff(gg.M).pvaff, bieri:bieriIndex(gg.M,lo,hi), intensity:intensityGrid(gg.M)};});
  const avg=(k)=>{const a=per.map(p=>p[k]).filter(v=>v!=null); return a.length? a.reduce((s,v)=>s+v,0)/a.length : null;};
  const pvals=per.map(p=>p.pvaff).filter(v=>v!=null);
  const pctileOf=(v)=> pvals.length>=4? Math.round(pvals.filter(x=>x<v).length/pvals.length*100) : null;
  const Stat=({label,val,sub,accent})=> <div><div className="mini">{label}</div><div style={{fontSize:'1.5rem',fontWeight:700,color:accent||'#1a1a1a'}}>{val}</div>{sub&&<div className="mini">{sub}</div>}</div>;
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Cognitive complexity — how many different ideas is this person using?</span>
        <p className="hp">If someone judges five colleagues only as “good vs bad”, they’re using <b>one</b> idea; if they also use warm/cold, bold/cautious and so on, they’re using <b>several</b>. This screen measures whether a person construes the topic <b>simply</b> (one dimension) or <b>complexly</b> (many).</p>
        <span className="help-see"><b>What you’re seeing:</b> pick an interviewee. <b>PVAFF</b> is the headline — the share of the grid explained by its single biggest theme (nearer 100% = one theme dominates, i.e. simpler). The line beneath shows where this grid sits <i>versus the rest of your study</i> — trust that, not a fixed cut-off, because PVAFF always runs high when a grid has few situations. <b>Intensity</b> and <b>Bieri</b> are other angles (higher = simpler); <b>Sample averages</b> is the study-wide view.</span>
        <span className="help-ref">Ref: Bieri (1955); Bannister (1960); Fransella, Bell &amp; Bannister (2004), ch. 5.</span></div>
      <div className="toolbar"><label className="field-lbl" style={{margin:0}}>Interviewee</label>{ppSelect(withData,sel,setSel)}</div>
      {!g||g.cons.length<2 ? <p className="muted small">This grid needs at least two rated constructs.</p> : <>
      <div className="card"><div className="row" style={{alignItems:'center'}}>
        <Stat label="PVAFF (1st factor)" val={pv.pvaff.toFixed(1)+'%'} accent="#e07030" sub={(()=>{const pc=pctileOf(pv.pvaff); return pc!=null? ('more one-dimensional than '+pc+'% of this study’s grids') : (pv.pvaff>=60?'fairly one-dimensional':'more differentiated');})()}/>
        <Stat label="Intensity" val={it!=null?it.toFixed(0):'—'}/>
        <Stat label="Bieri matching" val={bi!=null?bi.toFixed(0)+'%':'—'}/>
        <Stat label="Avg variability" val={av!=null?av.toFixed(0)+'%':'—'}/>
      </div>
      <p className="mini" style={{marginTop:'.6rem'}}>Variance spectrum: {pv.spectrum.slice(0,6).map((p,i)=>'PC'+(i+1)+' '+p.toFixed(0)+'%').join(' · ')}</p>
      <p className="mini" style={{marginTop:'.3rem',color:'#8a5a2b'}}>Note: this grid has {g.els.length} element{g.els.length===1?'':'s'} and {g.cons.length} constructs. PVAFF runs higher when a grid has few elements, so read it <b>relative to your own study</b> (the percentile above), not against a fixed cut-off — most small, evaluatively-focused grids score high.</p></div>
      <div className="card"><div className="sec-tag">Sample averages ({per.length} grids)</div><div className="row">
        <Stat label="Mean PVAFF" val={avg('pvaff')!=null?avg('pvaff').toFixed(1)+'%':'—'}/>
        <Stat label="Mean Intensity" val={avg('intensity')!=null?avg('intensity').toFixed(0):'—'}/>
        <Stat label="Mean Bieri" val={avg('bieri')!=null?avg('bieri').toFixed(0)+'%':'—'}/>
      </div></div></>}
    </div>
  );
}
function MatricesModule({config,responses}){
  const withData=responses.filter(r=>gridFor(config,r).cons.length>=2);
  const [sel,setSel]=useState(withData[0]?withData[0].participant_id:'');
  const [mode,setMode]=useState('constructCorr');
  const r=responses.find(x=>x.participant_id===sel);
  const g=r?gridFor(config,r):null;
  let mat=null, labels=[]; const isCorr=mode.endsWith('Corr');
  if(g&&g.M.length){
    if(mode==='constructCorr'){ mat=corrMatrix(g.M); labels=g.cons.map(c=>c.left+' – '+c.right); }
    else if(mode==='constructDist'){ mat=distMatrix(g.M); labels=g.cons.map(c=>c.left+' – '+c.right); }
    else if(mode==='elementCorr'){ mat=corrMatrix(transpose(g.M)); labels=g.els.map((e,i)=>e.name||('E'+(i+1))); }
    else { mat=distMatrix(transpose(g.M)); labels=g.els.map((e,i)=>e.name||('E'+(i+1))); }
  }
  const cell=(v)=>{ if(isCorr){ const a=Math.min(Math.abs(v),1); return {background:(v>=0?'rgba(22,120,74,':'rgba(192,57,43,')+(a*0.55)+')'}; } return {}; };
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Distances & correlations — which constructs (and elements) go together?</span>
        <p className="hp">Two constructs that always get rated the same way are really the same idea in different words; two situations rated alike are seen as similar. This screen shows those overlaps as numbers.</p>
        <span className="help-see"><b>What you’re seeing:</b> pick a grid, then a view. A <b>correlation</b> runs from −1 to +1 (green = the two go together, red = they pull opposite ways, near 0 = unrelated). A <b>distance</b> is how far apart two things are rated (smaller = more alike). Big green blocks mean the person is using several constructs as near-synonyms.</span><span className="help-ref">Ref: Slater, P. (1977) <i>The Measurement of Intrapersonal Space by Grid Technique</i>, Vol. 2; Fransella, Bell &amp; Bannister (2004), ch. 6.</span></div>
      <div className="toolbar" style={{flexWrap:'wrap',gap:'.5rem'}}>{ppSelect(withData,sel,setSel)}
        {[['constructCorr','Construct corr'],['constructDist','Construct dist'],['elementCorr','Element corr'],['elementDist','Element dist']].map(([k,l])=><button key={k} className="btn-s btn-sm" style={mode===k?{borderColor:'#1a1a1a'}:{}} onClick={()=>setMode(k)}>{l}</button>)}
      </div>
      {!mat? <p className="muted small">Needs a grid with ratings.</p> :
      <div className="card"><div className="scroll"><table className="grid" style={{fontSize:'.7rem'}}>
        <thead><tr><th></th>{labels.map((l,i)=><th key={i} title={l}>{i+1}</th>)}</tr></thead>
        <tbody>{mat.map((row,i)=><tr key={i}><td className="pole" style={{whiteSpace:'nowrap',maxWidth:210,overflow:'hidden',textOverflow:'ellipsis'}} title={labels[i]}>{i+1}. {labels[i].slice(0,28)}</td>{row.map((v,j)=><td key={j} style={cell(v)}>{isCorr?v.toFixed(2):v.toFixed(1)}</td>)}</tr>)}</tbody>
      </table></div></div>}
    </div>
  );
}
function MapsModule({config,responses}){
  const lo=config.scaleMin,hi=config.scaleMax;
  const withData=responses.filter(r=>{const g=gridFor(config,r); return g.cons.length>=2&&g.els.length>=2;});
  const [sel,setSel]=useState(withData[0]?withData[0].participant_id:'');
  const r=responses.find(x=>x.participant_id===sel);
  const g=r?gridFor(config,r):null;
  const maps=useMemo(()=>{ if(!g||g.cons.length<2||g.els.length<2) return null;
    return {els:g.els, cons:g.cons, M:g.M, bip:pcaBiplot(g.M,lo,hi), cOrder:focusOrder(simMatrix(g.M,hi-lo)), eOrder:focusOrder(simMatrix(transpose(g.M),hi-lo))};
  },[g]);
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Grid maps — the picture of one person’s construct system</span>
        <p className="hp">This is the classic repertory-grid “map” of one person’s thinking, laid out on the two biggest patterns in their grid.</p>
        <span className="help-see"><b>What you’re seeing:</b> pick an interviewee. On the <b>biplot</b>, situations are dots and constructs are arrows — dots close together are seen as alike, and arrows pointing the same way are ideas that go together. The <b>% on each axis</b> is how much of the person’s thinking that direction captures. <b>FOCUS</b> simply re-orders the grid so similar rows and columns sit next to each other.</span><span className="help-ref">Ref: Slater, P. (1977) <i>INGRID / Intrapersonal Space by Grid Technique</i>; Shaw, M. L. G. (1980) <i>On Becoming a Personal Scientist</i> (FOCUS); Gaines &amp; Shaw, WebGrid.</span></div>
      <div className="toolbar"><label className="field-lbl" style={{margin:0}}>Interviewee</label>{ppSelect(withData,sel,setSel)}</div>
      {!maps? <p className="muted small">Needs a grid with ≥2 constructs and ≥2 elements.</p> : <GridMaps maps={maps} scaleMin={lo} scaleMax={hi}/>}
    </div>
  );
}

function roleBadge(config,responses){
  // How many grids carry a self AND an ideal tag?
  return responses.filter(r=> roleElId(config,r,'self')&&roleElId(config,r,'ideal')).length;
}
function SelfIdealModule({config,responses}){
  const withRoles=responses.filter(r=> roleElId(config,r,'self')&&roleElId(config,r,'ideal'));
  const rows=withRoles.map(r=>({r, si:selfIdeal(config,r)})).filter(x=>x.si);
  const mean=(k)=>{const a=rows.map(x=>x.si[k]).filter(v=>v!=null); return a.length? a.reduce((s,v)=>s+v,0)/a.length : null;};
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Self–ideal discrepancy — the gap between who I am and who I want to be</span>
        <p className="hp">How far a person rates their <b>“self now”</b> from their <b>“ideal self”</b>. A big gap signals dissatisfaction and motivation to change; the two moving together is a classic measure of self-esteem. Used a lot in coaching and therapy.</p>
        <span className="help-see"><b>What you’re seeing:</b> a table of everyone who has a <b>Self</b> and an <b>Ideal</b> element tagged (set this with the role dropdown on an element inside the interview). <b>Distance %</b> is the size of the gap (higher = bigger gap); the <b>correlation</b> is self-esteem (near +1 = content, near 0 or negative = rates themselves unlike their ideal).</span><span className="help-ref">Ref: Norris, M. &amp; Makhlouf-Norris, F. (1976) on self–ideal discrepancy; Fransella, Bell &amp; Bannister (2004); Winter, D. A. (1992) <i>Personal Construct Psychology in Clinical Practice</i>.</span></div>
      {!rows.length
        ? <div className="card"><p className="muted small">No grids yet have both a <b>Self</b> and an <b>Ideal</b> element tagged. Open an interview, and on two of its elements set the <b>role</b> dropdown to <b>Self</b> and <b>Ideal</b>. Studies that don’t use a self/ideal design can ignore this module.</p></div>
        : <><div className="card"><div className="row">
            <div><div className="mini">Mean self–ideal distance</div><div style={{fontSize:'1.5rem',fontWeight:700,color:'#e07030'}}>{mean('pct')!=null?mean('pct').toFixed(1)+'%':'—'}</div><div className="mini">of max possible</div></div>
            <div><div className="mini">Mean self-esteem (r)</div><div style={{fontSize:'1.5rem',fontWeight:700}}>{mean('esteem')!=null?mean('esteem').toFixed(2):'—'}</div><div className="mini">self vs ideal correlation</div></div>
            <div><div className="mini">Grids analysed</div><div style={{fontSize:'1.5rem',fontWeight:700}}>{rows.length}</div></div>

function Dendrogram({root, labels}){

      {leaves.map((lf,i)=><text key={i} x={left-6} y={yOf[lf.leaf]+3} fontSize="10" textAnchor="end" fill="#333">{(labels[lf.leaf]||('#'+lf.leaf)).slice(0,30)}</text>)}

  const [name,setName]=useState('');
  const [cmp,setCmp]=useState('');
  const norms=config.norms||[];
  const cur=useMemo(()=>distributionOf(config,responses),[responses.length, JSON.stringify(config.assignments||{}).length]);
  function save(){
    if(readOnly||!cur) return;
    const nm=name.trim()||('Norm '+(norms.length+1));
    const rec={id:uid(), name:nm, date:new Date().toISOString().slice(0,10), n:responses.length, dist:cur.map(x=>({name:x.name,pct:x.pct}))};
    const next={...config, norms:[...norms, rec]}; setConfig(next); onSaveConfig&&onSaveConfig(next); setName('');
  }
  function del(id){ if(readOnly) return; const next={...config, norms:norms.filter(n=>n.id!==id)}; setConfig(next); onSaveConfig&&onSaveConfig(next); }
  const selNorm=norms.find(n=>n.id===cmp);
  const cmpRows=(cur&&selNorm)? cur.map(c=>{ const nb=selNorm.dist.find(d=>d.name===c.name); return {name:c.name, cur:c.pct, base:nb?nb.pct:null}; }) : null;
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Norm bases — save a study as a benchmark</span>
        <p className="hp">Once a study is coded, its mix of categories becomes a yardstick you can measure future studies against (“is this new cohort unusually relational compared with our benchmark?”).</p>
        <span className="help-see"><b>What you’re seeing:</b> the current study’s category distribution. Give it a name and <b>Save as norm</b> to keep it; later, pick <b>Compare</b> on a saved norm to see how another study differs, category by category.</span><span className="help-ref">Ref: normative content-analysis approach — Feixas, Geldschläger &amp; Neimeyer (2002); commercial norm bases (nextpractice).</span></div>
      {!cur
        ? <div className="card"><p className="muted small">Nothing to benchmark yet — code this study’s constructs into categories first (Composite constructs).</p></div>
        : <><div className="card"><div className="sec-tag">Current distribution ({responses.length} interviews)</div>
            {cur.slice().sort((a,b)=>b.pct-a.pct).slice(0,12).map(c=><div key={c.name} style={{display:'flex',alignItems:'center',gap:'.5rem',margin:'2px 0'}}>
              <div style={{width:150,fontSize:'.75rem',textAlign:'right'}}>{c.name}</div>
              <div style={{flex:1,background:'#f0eee9',borderRadius:3}}><div style={{width:c.pct+'%',background:'#e07030',height:12,borderRadius:3}}/></div>
              <div className="mini" style={{width:44}}>{c.pct.toFixed(1)}%</div></div>)}
            <div className="toolbar" style={{marginTop:'.6rem'}}>
              <input className="inp inp-sm" style={{flex:2}} placeholder="Name this norm (e.g. 2026 cohort)" value={name} disabled={readOnly} onChange={e=>setName(e.target.value)}/>
              <button className="btn btn-sm" disabled={readOnly} onClick={save}>Save as norm</button>
            </div>{readOnly&&<span className="mini">Read-only demo — cannot save norms.</span>}</div>
          {norms.length>0&&<div className="card"><div className="sec-tag">Saved norms</div>
            {norms.map(n=><div key={n.id} style={{display:'flex',alignItems:'center',gap:'.5rem',margin:'3px 0'}}>
              <button className="btn-s btn-sm" style={cmp===n.id?{borderColor:'#1a1a1a'}:{}} onClick={()=>setCmp(cmp===n.id?'':n.id)}>{cmp===n.id?'Comparing':'Compare'}</button>
              <span style={{fontSize:'.8rem'}}>{n.name}</span><span className="mini">{n.date} · n{n.n}</span>
              {!readOnly&&<button className="x" onClick={()=>del(n.id)} style={{marginLeft:'auto'}}>✕</button>}</div>)}</div>}
          {cmpRows&&<div className="card"><div className="sec-tag">Current vs “{selNorm.name}”</div><div className="scroll"><table className="grid" style={{fontSize:'.75rem'}}>
            <thead><tr><th className="pole" style={{textAlign:'left'}}>Category</th><th>This study</th><th>{selNorm.name}</th><th>Δ</th></tr></thead>
            <tbody>{cmpRows.filter(r=>r.cur>0||r.base>0).sort((a,b)=>Math.abs((b.cur-(b.base||0)))-Math.abs((a.cur-(a.base||0)))).map((r,i)=>{const d=r.base==null?null:r.cur-r.base; return <tr key={i}><td className="pole" style={{textAlign:'left'}}>{r.name}</td><td style={{textAlign:'center'}}>{r.cur.toFixed(1)}%</td><td style={{textAlign:'center'}}>{r.base==null?'—':r.base.toFixed(1)+'%'}</td><td style={{textAlign:'center',color:d==null?'#999':(d>=0?'#16784a':'#c0392b')}}>{d==null?'—':(d>=0?'+':'')+d.toFixed(1)}</td></tr>;})}</tbody>
          </table></div></div>}</>}
    </div>
  );
}
function ChangeModule({config,responses}){
  const tagged=responses.filter(r=>((r.data&&r.data.wave)||'').trim());
  const waves=[]; tagged.forEach(r=>{const w=r.data.wave.trim(); if(!waves.includes(w))waves.push(w);});
  const byP={}; tagged.forEach(r=>{ const nm=r.participant_name||r.participant_id; (byP[nm]=byP[nm]||{})[r.data.wave.trim()]=r; });
  const paired=Object.keys(byP).filter(nm=>Object.keys(byP[nm]).length>=2);
  const metric=(r)=>{ const g=gridFor(config,r); const pv=g.cons.length>=2?pvaff(g.M).pvaff:null; const cf=g.cons.length>=3?triadicConflict(g.M).pct:null; const si=selfIdeal(config,r); return {pv, cf, si:si?si.pct:null}; };
  const groupMean=(w,k)=>{ const a=paired.map(nm=>byP[nm][w]).filter(Boolean).map(metric).map(x=>x[k]).filter(v=>v!=null); return a.length? a.reduce((s,v)=>s+v,0)/a.length : null; };
  const fmt=(v,suf)=>v==null?'—':v.toFixed(1)+(suf||'');
  const delta=(a,b)=> (a==null||b==null)?null:(b-a);
  return (
    <div className="fade">
      <div className="help-box"><span className="help-h">Change over time — did anything shift?</span>
        <p className="hp">The core question in coaching, therapy and culture change: did the person’s thinking move? Interview the same people twice and compare.</p>
        <span className="help-see"><b>What you’re seeing:</b> for anyone interviewed more than once, their key measures (complexity, conflict, self–ideal gap) side by side per wave, with the change from first to last. To use it, give a person two interviews with the <b>same name</b> and different <b>waves</b> (e.g. “Pre” and “Post”) — the wave box is at the top of the interview screen.</span><span className="help-ref">Ref: Winter, D. A. (1992) <i>Personal Construct Psychology in Clinical Practice</i> (change over therapy); Fransella, Bell &amp; Bannister (2004).</span></div>
      {!waves.length
        ? <div className="card"><p className="muted small">No interviews are tagged with a <b>wave</b> yet. Open an interview and set its <b>Wave / timepoint</b> field (e.g. “Pre”, “Post”). To see change, the same interviewee needs two interviews with the same display name and different waves.</p></div>
        : !paired.length
        ? <div className="card"><p className="muted small">Waves found ({waves.join(', ')}), but no interviewee yet appears in two or more waves. Add a second interview for a person with the same display name and a different wave.</p></div>
        : <>
          <div className="card"><div className="sec-tag">Group means by wave ({paired.length} paired {paired.length===1?'person':'people'})</div>
            <div className="scroll"><table className="grid" style={{fontSize:'.8rem'}}>
              <thead><tr><th className="pole" style={{textAlign:'left'}}>Index</th>{waves.map(w=><th key={w}>{w}</th>)}</tr></thead>
              <tbody>{[['pv','Complexity PVAFF %'],['cf','Conflict %'],['si','Self–ideal %']].map(([k,lab])=>
                <tr key={k}><td className="pole" style={{textAlign:'left'}}>{lab}</td>{waves.map(w=><td key={w} style={{textAlign:'center'}}>{fmt(groupMean(w,k))}</td>)}</tr>)}</tbody>
            </table></div></div>
          <div className="card"><div className="sec-tag">Per person (first → last wave)</div>
            <div className="scroll"><table className="grid" style={{fontSize:'.76rem'}}>
              <thead><tr><th className="pole" style={{textAlign:'left'}}>Interviewee</th><th>Waves</th><th>PVAFF Δ</th><th>Conflict Δ</th><th>Self–ideal Δ</th></tr></thead>
              <tbody>{paired.map(nm=>{ const ws=waves.filter(w=>byP[nm][w]); const a=metric(byP[nm][ws[0]]), b=metric(byP[nm][ws[ws.length-1]]);
                const cell=(d,inv)=>{ if(d==null) return <td style={{textAlign:'center'}}>—</td>; const good=inv? d<0 : d<0; return <td style={{textAlign:'center',color:d===0?'#999':(good?'#16784a':'#c0392b')}}>{(d>=0?'+':'')+d.toFixed(1)}</td>; };
                return <tr key={nm}><td className="pole" style={{textAlign:'left'}}>{nm}</td><td style={{textAlign:'center'}}>{ws[0]}→{ws[ws.length-1]}</td>{cell(delta(a.pv,b.pv))}{cell(delta(a.cf,b.cf))}{cell(delta(a.si,b.si))}</tr>; })}</tbody>
            </table></div><p className="mini" style={{marginTop:'.4rem'}}>Δ = last wave minus first. Lower PVAFF/conflict/self–ideal generally indicate a more differentiated, less strained, more self-accepting construing (green).</p></div>
        </>}
    </div>
  );
}

function generateStudyPDF(config, responses){
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('The PDF library did not load. Please refresh the page and try again.'); return; }
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const pageW=210,pageH=297,margin=18,cw=pageW-margin*2;
  const TEXT=[26,26,26],MUTED=[107,107,107],ACCENT=[224,112,48],BG=[240,237,232],BORDER=[216,211,203];
  let y=margin, pageNum=0;
  const F=(s,w,c,f)=>{ doc.setFont(f||'helvetica',w||'normal'); doc.setFontSize(s); if(c)doc.setTextColor(...c); };
  function chrome(){ F(8,'bold',MUTED); doc.text('CHANGEBEFORE',margin,10); F(8,'normal',MUTED); doc.text('Repertory Grid Study',pageW-margin,10,{align:'right'});
    doc.setDrawColor(...BORDER); doc.setLineWidth(0.2); doc.line(margin,12,pageW-margin,12);
    pageNum++; F(8,'normal',MUTED); doc.text('ChangeBefore · Repertory Grid',margin,pageH-8); doc.text(String(pageNum),pageW-margin,pageH-8,{align:'right'}); }
  function page(){ doc.addPage(); chrome(); y=22; }

  function heading(t){ ensure(14); F(14,'bold',TEXT,'times'); doc.text(t,margin,y); y+=2; doc.setDrawColor(...ACCENT); doc.setLineWidth(0.5); doc.line(margin,y,margin+cw,y); y+=6; }
  function para(t,size){ F(size||10,'normal',TEXT); doc.splitTextToSize(t,cw).forEach(ln=>{ ensure(6); doc.text(ln,margin,y); y+=5; }); y+=2; }
  function kv(label,val){ ensure(6); F(10,'bold',TEXT); doc.text(label+': ',margin,y); const lw=doc.getTextWidth(label+': '); F(10,'normal',TEXT); doc.text(String(val),margin+lw,y); y+=6; }
  // cover
  doc.setFillColor(...BG); doc.rect(0,0,pageW,pageH,'F');
  F(11,'bold',TEXT); doc.text('CHANGEBEFORE',margin,32);
  F(9,'normal',MUTED); doc.text('Diagnostic consulting · Change before you have to.',margin,37);
  F(30,'bold',TEXT,'times'); doc.text(doc.splitTextToSize(config.title||'Repertory Grid Study',cw),margin,116);
  F(15,'normal',ACCENT); doc.text('Repertory Grid Study',margin,150);
  F(10,'normal',MUTED); doc.text('Prepared '+new Date().toLocaleDateString(),margin,164);

  const pvs=withGrid.map(r=>pvaff(gridFor(config,r).M).pvaff).filter(v=>v!=null);
  const cfs=responses.map(r=>{const g=gridFor(config,r);return g.cons.length>=3?triadicConflict(g.M).pct:null;}).filter(v=>v!=null);
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;

  const sis=responses.map(r=>selfIdeal(config,r)).filter(Boolean);

  const refId=outcomes[0].id, categories=config.categories||[], assignments=config.assignments||{};

  const totalP=totalParticipants(memAll);
  const honeyRows=categories.length? compositeRows(memAll,categories,assignments,totalP,fixedOrientOf(memAll)).filter(r=>r.n>0).sort((a,b)=>b.uniquePct-a.uniquePct) : [];
  // ---- table helpers ----

  function trows(cols,rows){ rows.forEach(rw=>{ if(y+5>pageH-16){ page(); thead(cols); } F(8,'normal',TEXT); cols.forEach((c,i)=>{ doc.text(doc.splitTextToSize(String(rw[i]==null?'':rw[i]),c.w-1.5)[0], c.a==='r'?c.x+c.w:c.x, y, {align:c.a==='r'?'right':'left'}); }); y+=4.6; doc.setDrawColor(...BORDER); doc.setLineWidth(0.1); doc.line(margin,y-1.6,margin+cw,y-1.6); }); y+=3; }

    thead(P);

  }
  // about
  page();
  heading('About ChangeBefore');

  para('This report was generated automatically from the study data. Figures follow Honey’s (1979) content-analysis method and standard repertory-grid structural measures (PVAFF, triadic-imbalance conflict, self–ideal discrepancy).');

}
function ReportModule({config,responses,code}){
  const rep=useMemo(()=>{
    const n=responses.length;
    const withGrid=responses.filter(r=>gridFor(config,r).cons.length>=2);
    const pvs=withGrid.map(r=>pvaff(gridFor(config,r).M).pvaff).filter(v=>v!=null);
    const cfs=responses.map(r=>{const g=gridFor(config,r); return g.cons.length>=3?triadicConflict(g.M).pct:null;}).filter(v=>v!=null);
    const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
    const dist=distributionOf(config,responses);
    const sis=responses.map(r=>selfIdeal(config,r)).filter(Boolean);

    const withDil=dils.filter(d=>d.found.length>0).length;

    return {n, meanPV:avg(pvs), meanCf:avg(cfs), dist, sis, dils, withDil, nCons, coded:!!(dist&&dist.some(d=>d.n>0)),

    if(d.coded&&top.length){
      p.push('<h2>Content analysis</h2><p>The most frequently construed themes were '+top.slice(0,3).map(t=>'<b>'+esc(t.name)+'</b> ('+t.pct.toFixed(0)+'%)').join(', ')+'. The full distribution:</p><table><thead><tr><th>Category</th><th>Share</th></tr></thead><tbody>'+top.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+t.pct.toFixed(1)+'%</td></tr>').join('')+'</tbody></table>');
    }

    if(d.sis.length){ const mp=d.sis.reduce((s,x)=>s+x.pct,0)/d.sis.length; const me=d.sis.reduce((s,x)=>s+x.esteem,0)/d.sis.length;
      p.push('<h2>Self–ideal</h2><p>Across '+d.sis.length+' grid'+(d.sis.length===1?'':'s')+' with a self and ideal tagged, the mean self–ideal distance was <b>'+mp.toFixed(1)+'%</b> of maximum and the mean self-esteem correlation was <b>'+me.toFixed(2)+'</b>.</p>'); }
    if(d.dils.length){ p.push('<h2>Implicative dilemmas</h2><p>'+d.withDil+' of '+d.dils.length+' analysable participants showed at least one implicative dilemma — a change they want that is entangled with a valued, congruent construct.</p>'); }
    p.push('<p class="foot">Generated by the ChangeBefore repertory-grid tool.</p>');

  }

  function openReport(){ const w=window.open('','_blank'); if(!w){alert('Please allow pop-ups to open the report.');return;} w.document.write(buildHtml()); w.document.close(); setTimeout(()=>w.print(),400); }

  const top=(rep.dist||[]).slice().sort((a,b)=>b.pct-a.pct).filter(x=>x.pct>0).slice(0,3);
  return (
