function normaliseWord(w) { return (w || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function padNumber(n) { if (!n) return ''; return String(n).padStart(2, '0'); }
function loadResumeData(code) { try { const raw = localStorage.getItem(STORAGE_PREFIX + code); if (!raw) return null; return JSON.parse(raw); } catch (e) { return null; } }
function saveResumeData(code, data) { try { localStorage.setItem(STORAGE_PREFIX + code, JSON.stringify(data)); } catch (e) {} }
function clearResumeData(code) { try { localStorage.removeItem(STORAGE_PREFIX + code); } catch (e) {} }

async function fetchWithRetry(url, opts, maxAttempts = 3) {
  const delays = [0, 508, 2010];
  let lastErr;
  for (let i = 0; i < maxAttempts; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, delays[i]));
    try {
      const r = await fetch(url, opts);
      if (r.ok) return r;
      lastErr = new Error('HTTP ' + r.status);
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function Progress({ step }) {
  // step: 0 Start, 1 Words, 2 More, 3 Pick, 4 Reveal, 5+ Done
  const nav = Math.min(step, STEPS.length);
  return (
    <div className="prog-wrap no-print">
      <div className="prog-bars">
        {STEPS.map((_, i) => (
          <div key={i} className={'prog-bar' + (i < nav ? ' done' : i === nav ? ' now' : '')} />
        ))}
      </div>
      <div className="prog-lbls">
        {STEPS.map((s, i) => (
          <div key={s} className={'prog-lbl' + (i < nav ? ' done' : i === nav ? ' now' : '')}>{s}</div>
        ))}
      </div>
    </div>
  );
}

function Landing({
  initialCode, initialSubject,
  onParticipantBegin, onFacilitatorUnlock,
}) {
  const [code, setCode] = useState(initialCode || '');
  const [name, setName] = useState('');
  const [role, setRole] = useState('');
  const [validating, setValidating] = useState(false);
  const [validated, setValidated] = useState(false);
  const [error, setError] = useState('');
  const [beginError, setBeginError] = useState('');
  const [beginning, setBeginning] = useState(false);
  const [resumeAvailable, setResumeAvailable] = useState(null);

  // Auto-validate on load if ?code= present
  useEffect(() => {
    if (initialCode) {
      validateCode(initialCode, { silent: true });
    }
    // eslint-disable-next-line
  }, []);

  // Track resume availability whenever code changes

    const c = (code || '').trim().toUpperCase();

    } else {
      setResumeAvailable(null);
    }
  }, [code]);

  async function validateCode(testCode, opts = {}) {
    const c = (testCode || '').trim().toUpperCase();
    if (!c) { if (!opts.silent) setError('Enter a code to continue.'); return null; }
    setValidating(true); setError('');
    try {
      const r = await fetch('/api/validate-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: c, tool: TOOL_SLUG }),
      });
      const data = await r.json();
      if (!r.ok || !data.valid) {
        if (!opts.silent) setError(data.error || data.reason || 'That code wasn\'t recognised. Check it and try again.');
        setValidating(false);
        return null;
      }
      setValidating(false);
      setValidated(true);
      return { ...data, code: c };
    } catch (e) {
      if (!opts.silent) setError('We couldn\'t reach the validation service. Check your connection and try again.');
      setValidating(false);
      return null;
    }
  }

  async function handleBegin() {
    setBeginError('');
    setBeginning(true);
    const validation = await validateCode(code);
    if (!validation) { setBeginning(false); return; }
    try {
      const r = await fetch('/api/resilience-assign-participant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_code: validation.code }),
      });
      const assigned = await r.json();
      if (!r.ok || !assigned.participant_uuid) {
        throw new Error(assigned.error || 'Could not assign a participant number.');
      }
      onParticipantBegin({
        code: validation.code,
        subject: initialSubject || DEFAULT_SUBJECT,
        respondent_name: name.trim(),
        role: role.trim(),
        participant_uuid: assigned.participant_uuid,
        participant_number: assigned.number,
        participant_id: padNumber(assigned.number),
        resumeData: null,
      });
    } catch (e) {
      setBeginError('Could not start your session. ' + (e.message || ''));
      setBeginning(false);
    }
  }

  function handleResume() {
    if (!resumeAvailable) return;
    onParticipantBegin({
      code: (code || '').trim().toUpperCase(),
      subject: resumeAvailable.subject || DEFAULT_SUBJECT,
      respondent_name: resumeAvailable.respondent_name || '',
      role: resumeAvailable.role || '',
      participant_uuid: resumeAvailable.participant_uuid,
      participant_number: resumeAvailable.participant_number,
      participant_id: padNumber(resumeAvailable.participant_number),
      resumeData: resumeAvailable,
    });
  }

  function unlockFacilitator() {
    const pw = window.prompt('Enter facilitator password:');
    if (pw === FACILITATOR_PASSWORD) {
      const c = (code || '').trim().toUpperCase();
      if (!c) {
        window.alert('Enter a session code first, then unlock.');
        return;
      }
      onFacilitatorUnlock(c);
    } else if (pw !== null) {
      window.alert('Incorrect password.');
    }
  }

  return (
    <div className="shell fade">
      <Progress step={0} />
      <div className="main">
        <div className="content">
          <div className="land-hero">
            <div className="land-tag">Workshop reflection</div>
            <h1 className="land-title">Resilience Is…</h1>
            <p className="land-desc">A short reflection on what resilience means to you. Add the words that come to mind, then see where your language lands.</p>
            <div className="land-time">About 3 minutes</div>
          </div>

          {resumeAvailable && (
            <div className="resume-prompt">
              <strong>Welcome back.</strong>
              You were partway through. Want to pick up where you left off?
              <div className="btn-row" style={{ marginTop: '.6rem' }}>
                <button className="btn-p" onClick={handleResume}>Continue →</button>
                <button className="btn-s" onClick={() => { clearResumeData((code || '').trim().toUpperCase()); setResumeAvailable(null); }}>Start fresh</button>
              </div>
            </div>
          )}

          {!resumeAvailable && (
            <div>
              <div style={{ marginBottom: '1.25rem' }}>
                <label className="field-lbl" htmlFor="code-input">Session code</label>
                <div className="field-sub">Provided by your facilitator.</div>
                <input
                  id="code-input"
                  className="inp"
                  type="text"
                  value={code}
                  onChange={e => { setCode(e.target.value.toUpperCase()); setValidated(false); setError(''); }}
                  placeholder="e.g. WORDS-OPEN"
                  autoComplete="off"
                  style={{ maxWidth: '340px' }}
                />
              </div>

              <div style={{ marginBottom: '1.25rem' }}>
                <label className="field-lbl" htmlFor="name-input">Your name <span style={{ fontWeight: 400, color: '#999' }}>(optional)</span></label>
                <div className="field-sub">Only stored on this device, so you can resume if you close the tab.</div>
                <input
                  id="name-input"
                  className="inp"
                  type="text"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  placeholder=""
                  style={{ maxWidth: '340px' }}
                />
              </div>

              <div style={{ marginBottom: '1.25rem' }}>
                <label className="field-lbl" htmlFor="role-input">Your role <span style={{ fontWeight: 400, color: '#999' }}>(optional)</span></label>
                <input
                  id="role-input"
                  className="inp"
                  type="text"
                  value={role}
                  onChange={e => setRole(e.target.value)}
                  placeholder="e.g. HR Director, Operations Manager"
                  style={{ maxWidth: '340px' }}
                />
              </div>

              <div className="disc">
                <strong>Privacy:</strong> Your responses are anonymous and used only to generate your reveal and contribute to the group view your facilitator sees. <a href="https://changebefore.com/privacy/" target="_blank" rel="noopener noreferrer" style={{ color: 'inherit', textDecoration: 'underline' }}>Full privacy notice →</a>
              </div>

              {error && <div className="error">{error}</div>}

              <div className="btn-row">
                <button
                  className="btn-p"
                  disabled={!code.trim() || beginning}
                  onClick={handleBegin}
                >
                  {beginning ? <><Spinner /> Starting…</> : 'Begin →'}
                </button>
                {validated && !beginning && (
                  <button
                    className="btn-s"
                    onClick={unlockFacilitator}
                    style={{ color: '#e07030', borderColor: '#e07030' }}
                  >
                    Facilitator ★

                )}
              </div>

              {beginError && <div className="error">{beginError}</div>}
            </div>
          )}
        </div>
      </div>
      <Footer />
    </div>
  );
}

function QuestionScreen({ subject, words, onAddWord, onRemoveWord, onDone, onBack }) {
  const [draft, setDraft] = useState('');
  const inputRef = useRef(null);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

  function commitWord() {
    const v = draft.trim();
    if (!v) return;
    if (v.length > 60) return;
    const existing = words.map(w => normaliseWord(w.word));
    if (existing.includes(normaliseWord(v))) { setDraft(''); return; }
    onAddWord(v);
    setDraft('');
    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
  }
  function onKey(e) { if (e.key === 'Enter') { e.preventDefault(); commitWord(); } }

  return (
    <div className="shell fade">
      <Progress step={1} />
      <div className="main">
        <div className="content">
          <BackBtn onClick={onBack} />
          <div className="sec-tag">Step 1 — your words</div>
          <h2 className="pg-title"><em style={{ fontStyle: 'normal', color: '#e07030' }}>{subject || DEFAULT_SUBJECT}</em> is the ability to…</h2>
          <p className="pg-sub">Complete the sentence. Add a word or short phrase, then add another. There's no wrong answer — just go with what comes to mind.</p>

          <div className="word-add-row">
            <input
              ref={inputRef}
              className="inp"
              type="text"
              value={draft}
              onChange={e => setDraft(e.target.value)}
              onKeyDown={onKey}
              placeholder="add a word…"
              autoComplete="off"
              maxLength={60}
            />
            <button className="btn-p" onClick={commitWord} disabled={!draft.trim()}>Add</button>
          </div>

          {words.length > 0 && (
            <div className="word-list">
              {words.map((w, i) => (
                <div key={i} className={'word-chip' + (i === 0 ? ' first' : '')}>
                  <span>{w.word}</span>
                  <button onClick={() => onRemoveWord(i)} aria-label="Remove">×</button>
                </div>
              ))}
            </div>
          )}

          <p className="helper">
            {words.length === 0 ? 'Type your first word and hit Enter.' : `${words.length} word${words.length === 1 ? '' : 's'} so far. Add more, or tap Done.`}
          </p>

          <div className="btn-row">
            <button className="btn-p" onClick={onDone} disabled={words.length === 0}>Done →</button>
          </div>
        </div>
      </div>
      <Footer />
    </div>
  );
}

function RevealScreen({ subject, allWords, firstWord, forcedPick, classifications, classifying, onContinue, onBack }) {
  const grouped = useMemo(() => {
    const g = { refine: [], reinvent: [], resist: [], respond: [], central: [], outside: [] };
    const seen = new Set();
    allWords.forEach(w => {
      const norm = normaliseWord(w);
      if (seen.has(norm)) return;
      seen.add(norm);
      const q = classifications[norm] || 'central';
      if (g[q]) g[q].push(w);
    });
    return g;
  }, [allWords, classifications]);

  function renderBucket(key) {
    const words = grouped[key] || [];
    const isEmpty = words.length === 0;
    return (
      <div className={'bucket' + (isEmpty ? ' empty' : '')}>
        <div className="bucket-label">{QUADRANTS[key].label}</div>
        {isEmpty ? (
          <span className="bucket-empty-note">Nothing here</span>
        ) : (
          <div className="bucket-words">
            {words.map((w, i) => {
              const isFirst = normaliseWord(w) === normaliseWord(firstWord);
              const isPick = normaliseWord(w) === normaliseWord(forcedPick);
              return (
                <div
                  key={w + '_' + i}
                  className={'bucket-word' + (isFirst ? ' first' : '') + (isPick ? ' pick' : '')}
                >{w}</div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="shell fade">
      <Progress step={4} />
      <div className="main">
        <div className="content">
          <BackBtn onClick={onBack} />
          <div className="sec-tag">Step 4 — your reveal</div>
          <h2 className="pg-title">Here's where your words landed.</h2>
          <p className="pg-sub">
            {classifying
              ? 'Just a moment while we map your words…'
              : 'Each word grouped. Your first word has an orange marker. Your essential pick is highlighted.'}
          </p>

          {classifying ? (
            <div style={{ textAlign: 'center', padding: '2.5rem 0' }}>
              <Spinner dark /> <span style={{ color: '#888', marginLeft: '.5rem' }}>Classifying…</span>
            </div>
          ) : (
            <>
              <div className="reveal-grid">
                {renderBucket('refine')}
                {renderBucket('reinvent')}
                {renderBucket('resist')}
                {renderBucket('respond')}
              </div>

              {(grouped.central.length > 0 || grouped.outside.length > 0) && (
                <div className="side-row">
                  <div className="side-bucket">
                    <div className="bucket-label">Central</div>
                    <div className="bucket-helper">Cross-cutting capabilities</div>
                    {grouped.central.length === 0
                      ? <span className="bucket-empty-note">—</span>
                      : <div className="bucket-words">
                          {grouped.central.map((w, i) => (
                            <div key={w + '_c_' + i} className="bucket-word">{w}</div>
                          ))}
                        </div>}
                  </div>
                  <div className="side-bucket">
                    <div className="bucket-label">Conditions</div>
                    <div className="bucket-helper">What enables resilience</div>
                    {grouped.outside.length === 0
                      ? <span className="bucket-empty-note">—</span>
                      : <div className="bucket-words">
                          {grouped.outside.map((w, i) => (
                            <div key={w + '_o_' + i} className="bucket-word">{w}</div>
                          ))}
                        </div>}
                  </div>
                </div>
              )}

              <div className="inf-box">
                Which container has most of your words? Which has none? What might that tell you about how you instinctively think about resilience?
              </div>

              <div className="btn-row">
                <button className="btn-p" onClick={onContinue}>Continue →</button>
              </div>
            </>
          )}
        </div>
      </div>
      <Footer />
    </div>
  );
}

function generatePDF({ subject, participantId, allWords, firstWord, forcedPick, classifications, opts = {} }) {
  if (typeof window.jspdf === 'undefined') { alert('PDF library not loaded yet — try again in a moment.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const TEXT = [26, 26, 26], MUTED = [107, 107, 107], ACCENT = [224, 112, 48];
  const BG = [240, 237, 232], BORDER = [216, 211, 203], WHITE = [255, 255, 255];

  const W = 210, H = 297, M = 18;

  function setFill(c) { doc.setFillColor(c[0], c[1], c[2]); }
  function setStroke(c) { doc.setDrawColor(c[0], c[1], c[2]); }
  function setText(c) { doc.setTextColor(c[0], c[1], c[2]); }

  // Page 1
  setFill(BG); doc.rect(0, 0, W, H, 'F');
  setText(MUTED); doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.text(('RESILIENCE IS' + (participantId ? '  ·  PARTICIPANT ' + participantId : '')).toUpperCase(), M, M);
  setText(TEXT); doc.setFontSize(18);
  doc.text((subject || DEFAULT_SUBJECT) + ' is the ability to…', M, M + 12);
  setStroke(BORDER); doc.setLineWidth(0.3);
  doc.line(M, M + 17, W - M, M + 17);

  const grouped = { refine: [], reinvent: [], resist: [], respond: [], central: [], outside: [] };
  const seen = new Set();
  allWords.forEach(w => {
    const norm = normaliseWord(w);
    if (seen.has(norm)) return;
    seen.add(norm);
    const q = classifications[norm] || 'central';
    if (grouped[q]) grouped[q].push(w);
  });

  function drawBucket(label, x, y, w, h, words) {
    setFill(WHITE); doc.rect(x, y, w, h, 'F');
    setStroke(BORDER); doc.rect(x, y, w, h, 'S');
    setText(TEXT); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text(label, x + 4, y + 7);
    setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    let cx = x + 4, cy = y + 14;
    const lineH = 5;
    words.forEach(w => {
      const isPick = normaliseWord(w) === normaliseWord(forcedPick);
      const isFirst = normaliseWord(w) === normaliseWord(firstWord);
      const tw = doc.getTextWidth(w);
      if (cx + tw > x + w - 4) { cx = x + 4; cy += lineH; }
      if (cy > y + h - 3) return;
      if (isPick) { setFill(ACCENT); doc.rect(cx - 1.2, cy - 3.6, tw + 2.4, 4.8, 'F'); setText(WHITE); doc.setFont('helvetica', 'bold'); }
      else if (isFirst) { setFill(BG); doc.rect(cx - 1.2, cy - 3.6, tw + 2.4, 4.8, 'F'); setText(TEXT); doc.setFont('helvetica', 'bold'); }
      else { setText(TEXT); doc.setFont('helvetica', 'normal'); }
      doc.text(w, cx, cy);
      cx += tw + 4;
    });
    if (words.length === 0) {
      setText(MUTED); doc.setFont('helvetica', 'italic'); doc.setFontSize(9);
      doc.text('Nothing here', x + 4, y + 14);
    }
  }

  const gridY = M + 25, gridW = (W - 2 * M - 4) / 2, gridH = 55;
  drawBucket('Refine',   M,             gridY,             gridW, gridH, grouped.refine);
  drawBucket('Reinvent', M + gridW + 4, gridY,             gridW, gridH, grouped.reinvent);
  drawBucket('Resist',   M,             gridY + gridH + 4, gridW, gridH, grouped.resist);
  drawBucket('Respond',  M + gridW + 4, gridY + gridH + 4, gridW, gridH, grouped.respond);

  let nextY = gridY + 2 * gridH + 12;
  if (grouped.central.length > 0) {
    setText(MUTED); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('CENTRAL — CROSS-CUTTING', M, nextY);
    setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(grouped.central.join(', '), M, nextY + 5);
    nextY += 14;
  }
  if (grouped.outside.length > 0) {
    setText(MUTED); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('CONDITIONS — WHAT ENABLES RESILIENCE', M, nextY);
    setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(grouped.outside.join(', '), M, nextY + 5);
    nextY += 14;
  }

  setFill(TEXT); doc.rect(M, H - 50, W - 2 * M, 28, 'F');
  setText(ACCENT); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
  doc.text('YOUR ESSENTIAL WORD', M + 6, H - 42);
  setText(WHITE); doc.setFont('helvetica', 'normal'); doc.setFontSize(20);
  doc.text(forcedPick || '—', M + 6, H - 30);

  setText(MUTED); doc.setFontSize(8);
  doc.text('ChangeBefore  ·  tools.changebefore.com', M, H - 8);

  // Page 2 — tensions
  doc.addPage();
  setFill(BG); doc.rect(0, 0, W, H, 'F');
  setText(MUTED); doc.setFontSize(8);
  doc.text('STRATEGIC TENSIONS', M, M);
  setText(TEXT); doc.setFontSize(18); doc.setFont('helvetica', 'normal');
  doc.text('What this means at the organisational level', M, M + 12);
  setStroke(BORDER); doc.setLineWidth(0.3);
  doc.line(M, M + 17, W - M, M + 17);

  function drawTension(label, body, x, y, w, h) {
    setFill(WHITE); doc.rect(x, y, w, h, 'F');
    setStroke(BORDER); doc.rect(x, y, w, h, 'S');
    setText(MUTED); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
    doc.text(label.toUpperCase(), x + 5, y + 7);
    setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    const lines = doc.splitTextToSize(body, w - 10);
    doc.text(lines, x + 5, y + 14);
  }
  const tY = M + 25, tW = (W - 2 * M - 4) / 2, tH = 50;
  drawTension('Refine',   TENSIONS.refine,   M,             tY,           tW, tH);
  drawTension('Reinvent', TENSIONS.reinvent, M + tW + 4,    tY,           tW, tH);
  drawTension('Resist',   TENSIONS.resist,   M,             tY + tH + 4,  tW, tH);
  drawTension('Respond',  TENSIONS.respond,  M + tW + 4,    tY + tH + 4,  tW, tH);

  setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
  const closingLines = doc.splitTextToSize(
    'Most organisations lean heavily on one or two of these. Resilience comes from being able to move across all four when the situation demands it.',
    W - 2 * M
  );
  doc.text(closingLines, M, tY + 2 * tH + 18);

  setText(MUTED); doc.setFontSize(8);
  doc.text('ChangeBefore  ·  tools.changebefore.com', M, H - 8);

  const filename = `resilience-is-${participantId || 'reveal'}.pdf`;

  if (opts.returnBase64) {
    const dataUri = doc.output('datauristring');
    const base64 = dataUri.split('base64,')[1] || '';
    return { base64, filename };
  }
  doc.save(filename);
  return { filename };
}

// ============================================================================
// PARTICIPANT APP — orchestrates the flow
// ============================================================================

// Step constants: 0 Gate, 1 Question, 2 Stall, 3 Pick, 4 Reveal, 5 Tensions, 6 Exit, 7 PrintDone, 8 JoinDone

function ParticipantApp({ session, onExitToGate }) {
  const [step, setStep] = useState(session.resumeData?.step || 1);
  const [words, setWords] = useState(session.resumeData?.words || []);
  const [selected, setSelected] = useState(session.resumeData?.selected || []);
  const [forcedPick, setForcedPick] = useState(session.resumeData?.forcedPick || '');
  const [classifications, setClassifications] = useState(session.resumeData?.classifications || {});
  const [classifying, setClassifying] = useState(false);
  const [joining, setJoining] = useState(false);
  const [joinError, setJoinError] = useState('');
  const [joinedEmail, setJoinedEmail] = useState('');

  // Persist resume data on change
  useEffect(() => {
    saveResumeData(session.code, {
      step, words, selected, forcedPick, classifications,
      participant_uuid: session.participant_uuid,
      participant_number: session.participant_number,
      respondent_name: session.respondent_name,
      role: session.role,
      subject: session.subject,
    });
  }, [step, words, selected, forcedPick, classifications, session]);

  useEffect(() => { if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' }); }, [step]);

  // Background autosave to Supabase
  const saveRef = useRef({ timer: null });
  useEffect(() => {
    if (step < 1) return;
    if (saveRef.current.timer) clearTimeout(saveRef.current.timer);
    saveRef.current.timer = setTimeout(() => {
      const all = [...words.map(w => w.word), ...selected];
      const primaryQ = forcedPick ? (classifications[normaliseWord(forcedPick)] || null) : null;
      const firstQ = words.length > 0 ? (classifications[normaliseWord(words[0].word)] || null) : null;
      let cogQ = null;
      if (Object.keys(classifications).length > 0) {
        const counts = {};
        all.forEach(w => { const q = classifications[normaliseWord(w)]; if (q) counts[q] = (counts[q] || 0) + 1; });
        let max = 0, tie = false;
        Object.entries(counts).forEach(([q, c]) => {
          if (c > max) { max = c; cogQ = q; tie = false; }
          else if (c === max) { tie = true; }
        });
        if (tie) cogQ = null;
      }
      fetchWithRetry('/api/resilience-save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_code: session.code,
          participant_id: session.participant_uuid,
          respondent_name: session.respondent_name || null,
          role: session.role || null,
          number: session.participant_number,
          subject: session.subject,
          words, selected, forced_pick: forcedPick,
          primary_quadrant: primaryQ,
          first_word_quadrant: firstQ,
          centre_of_gravity: cogQ,
          step,
          completed: step >= 7,
        }),
      }, 3).catch(() => {});
    }, 800);
    return () => { if (saveRef.current.timer) clearTimeout(saveRef.current.timer); };
  }, [step, words, selected, forcedPick, classifications, session]);

  async function classifyAll() {
    const all = [...words.map(w => w.word), ...selected];
    const unique = Array.from(new Set(all.map(normaliseWord))).filter(Boolean);
    const need = unique.filter(w => !classifications[w] && !DICTIONARY[w]);
    const seeded = { ...classifications };
    unique.forEach(w => { if (!seeded[w] && DICTIONARY[w]) seeded[w] = DICTIONARY[w]; });
    if (need.length === 0) { setClassifications(seeded); return seeded; }
    setClassifying(true);
    try {
      const r = await fetch('/api/resilience-classify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ words: need }),
      });
      if (r.ok) {
        const data = await r.json();
        const result = data.classifications || {};
        const next = { ...seeded };
        Object.entries(result).forEach(([w, q]) => { next[w] = q; });
        need.forEach(w => { if (!next[w]) next[w] = 'central'; });
        setClassifications(next);
        return next;
      }
    } catch (e) {}
    const fallback = { ...seeded };
    need.forEach(w => { if (!fallback[w]) fallback[w] = 'central'; });
    setClassifications(fallback);
    return fallback;
  }

  useEffect(() => {
    if (step === 4) {
      classifyAll().finally(() => setClassifying(false));
    }
    // eslint-disable-next-line
  }, [step]);

  function addWord(w) { setWords(prev => [...prev, { word: w, ts: new Date().toISOString() }]); }
  function removeWord(i) { setWords(prev => prev.filter((_, idx) => idx !== i)); }
  function toggleSelected(norm) { setSelected(prev => prev.includes(norm) ? prev.filter(x => x !== norm) : [...prev, norm]); }
  function allWordsCombined() {
    const out = [...words.map(w => w.word)];
    selected.forEach(s => { if (!out.map(normaliseWord).includes(s)) out.push(s); });
    return out;
  }
  function firstWord() { return words.length > 0 ? words[0].word : ''; }

  async function handlePrint() {
    generatePDF({
      subject: session.subject, participantId: session.participant_id,
      allWords: allWordsCombined(), firstWord: firstWord(),
      forcedPick, classifications,
    });
    setStep(7);
  }

  async function handleJoin({ firstName, lastName, email, role, marketingOk }) {
    setJoining(true); setJoinError('');
    try {
      const pdf = generatePDF({
        subject: session.subject, participantId: session.participant_id,
        allWords: allWordsCombined(), firstWord: firstWord(),
        forcedPick, classifications, opts: { returnBase64: true },
      });
      const r = await fetch('/api/resilience-join-and-send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tool: TOOL_LABEL, tool_slug: TOOL_SLUG,
          session_code: session.code,
          participant_id: session.participant_uuid,
          participant_number: session.participant_number,
          first_name: firstName, last_name: lastName, email, role,
          marketing_opt_in: !!marketingOk,
          pdf_base64: pdf.base64, pdf_filename: pdf.filename,
        }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || 'Could not send your report.');
      setJoinedEmail(email);
      setStep(8);
    } catch (e) {
      setJoinError(e.message || 'Something went wrong. Please try again.');
    } finally { setJoining(false); }
  }

  function handleAnonymise() {
    clearResumeData(session.code);
    setStep(8);
    setJoinedEmail('');
  }

  const combined = allWordsCombined();

  if (step === 1) return <QuestionScreen subject={session.subject} words={words} onAddWord={addWord} onRemoveWord={removeWord} onDone={() => setStep(2)} onBack={onExitToGate} />;
  if (step === 2) return <StallScreen subject={session.subject} alreadyHave={words.map(w => w.word)} selected={selected} onToggle={toggleSelected} onDone={() => setStep(3)} onSkip={() => setStep(3)} onBack={() => setStep(1)} />;
  if (step === 3) return <ForcedPickScreen subject={session.subject} allWords={combined} pick={forcedPick} onPick={setForcedPick} onContinue={() => setStep(4)} onBack={() => setStep(2)} />;
  if (step === 4) return <RevealScreen subject={session.subject} allWords={combined} firstWord={firstWord()} forcedPick={forcedPick} classifications={classifications} classifying={classifying} onContinue={() => setStep(5)} onBack={() => setStep(3)} />;
  if (step === 5) return <TensionsScreen subject={session.subject} onContinue={() => setStep(6)} onBack={() => setStep(4)} />;
  if (step === 6) return <ExitScreen subject={session.subject} participantId={session.participant_id} defaultRole={session.role} defaultName={session.respondent_name} onJoin={handleJoin} onPrint={handlePrint} joining={joining} joinError={joinError} onBack={() => setStep(5)} />;
  if (step === 7) return <PrintDoneScreen subject={session.subject} participantId={session.participant_id} onAnonymise={handleAnonymise} />;
  if (step === 8) return <JoinDoneScreen subject={session.subject} participantId={session.participant_id} email={joinedEmail} />;

  return null;
}

// ============================================================================
// FACILITATOR APP — live dashboard with filters
// ============================================================================

function FacilitatorApp({ sessionCode, onExit }) {
  const [participants, setParticipants] = useState([]);
  const [error, setError] = useState('');
  const [wallClassifications, setWallClassifications] = useState({});

  const [orientBy, setOrientBy] = useState({ forced: true, first: false, cog: false });
  const [showQuadrant, setShowQuadrant] = useState({
    refine: true, reinvent: true, resist: true, respond: true, central: true,
  });

  async function load() {
    if (!sessionCode) return;
    try {
      const r = await fetch('/api/resilience-load?session_code=' + encodeURIComponent(sessionCode));
      const data = await r.json();
      if (r.ok && Array.isArray(data.participants)) {
        setParticipants(data.participants);
        setError('');
      } else if (!r.ok) {
        setError(data.error || 'Could not load session data.');
      }
    } catch (e) { setError('Could not reach the server.'); }
  }

  useEffect(() => {
    load();
    const t = setInterval(load, 4000);
    return () => clearInterval(t);
    // eslint-disable-next-line
  }, [sessionCode]);

  // Classify any new words coming through the wall
  useEffect(() => {
    const allWords = new Set();
    participants.forEach(p => {
      (p.words || []).forEach(w => allWords.add(normaliseWord(w.word)));
      (p.selected || []).forEach(s => allWords.add(normaliseWord(s)));
    });
    const need = [];
    allWords.forEach(w => {
      if (!w) return;
      if (wallClassifications[w]) return;
      if (DICTIONARY[w]) return;
      need.push(w);
    });
    const seeded = { ...wallClassifications };
    allWords.forEach(w => { if (!w) return; if (!seeded[w] && DICTIONARY[w]) seeded[w] = DICTIONARY[w]; });
    if (need.length > 0) {
      fetch('/api/resilience-classify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ words: need }),
      }).then(r => r.ok ? r.json() : null).then(data => {
        if (!data) return;
        const next = { ...seeded };
        Object.entries(data.classifications || {}).forEach(([w, q]) => { next[w] = q; });
        need.forEach(w => { if (!next[w]) next[w] = 'central'; });
        setWallClassifications(next);
      }).catch(() => {});
    } else if (Object.keys(seeded).length > Object.keys(wallClassifications).length) {
      setWallClassifications(seeded);
    }
  }, [participants]);

  function participantPassesFilter(p) {
    const anyOrientChecked = orientBy.forced || orientBy.first || orientBy.cog;
    if (!anyOrientChecked) return false;
    const quads = [];
    if (orientBy.forced && p.primary_quadrant) quads.push(p.primary_quadrant);
    if (orientBy.first && p.first_word_quadrant) quads.push(p.first_word_quadrant);
    if (orientBy.cog && p.centre_of_gravity) quads.push(p.centre_of_gravity);
    if (quads.length === 0) return false;
    return quads.some(q => showQuadrant[q]);
  }

  const bucketData = useMemo(() => {
    const out = { refine: {}, reinvent: {}, resist: {}, respond: {}, central: {}, outside: {} };
    participants.filter(participantPassesFilter).forEach(p => {
      const all = [...(p.words || []).map(w => w.word), ...(p.selected || [])];
      const uniq = new Set();
      all.forEach(w => {
        const norm = normaliseWord(w);
        if (uniq.has(norm)) return;
        uniq.add(norm);
        const q = wallClassifications[norm] || DICTIONARY[norm] || 'central';
        if (!out[q]) return;
        out[q][w] = (out[q][w] || 0) + 1;
      });
    });
    return out;
    // eslint-disable-next-line
  }, [participants, wallClassifications, orientBy, showQuadrant]);

  function scaleForCount(c, max) {
    if (max <= 1) return 1;
    if (c === max) return 5;
    if (c >= max * 0.75) return 4;
    if (c >= max * 0.5) return 3;
    if (c >= max * 0.25) return 2;
    return 1;
  }

  function renderBucket(key, isSide) {
    const wordsObj = bucketData[key] || {};
    const entries = Object.entries(wordsObj).sort((a, b) => b[1] - a[1]);
    const max = entries.length > 0 ? entries[0][1] : 0;
    const total = entries.reduce((s, [, c]) => s + c, 0);
    return (
      <div className="fac-wall-bucket">
        <div className="fac-wall-bucket-head">
          <div className="fac-wall-bucket-label">{QUADRANTS[key].label}</div>
          <div className="fac-wall-bucket-count">{total} word{total === 1 ? '' : 's'}</div>
        </div>
        <div className="fac-wall-words">
          {entries.length === 0
            ? <span style={{ color: '#b0a898', fontStyle: 'italic', fontSize: '.85rem' }}>—</span>
            : entries.map(([word, count]) => (
                <span key={word} className={'fac-wall-word fac-wall-word--' + scaleForCount(count, max)}>
                  {word}{count > 1 ? <sub style={{ fontSize: '.55em', color: '#888', marginLeft: 2 }}>×{count}</sub> : null}
                </span>
              ))}
        </div>
      </div>
    );
  }

  const totalParticipants = participants.length;
  const completedCount = participants.filter(p => p.completed).length;

  return (
    <div className="shell fade">
      <div className="fac-bar no-print">
        <div>
          <span className="fac-bar-title">Resilience Is — Facilitator</span>
          <span className="fac-bar-meta" style={{ marginLeft: '.85rem' }}>
            Session <strong style={{ color: '#fff' }}>{sessionCode}</strong>  ·  <strong style={{ color: '#fff' }}>{completedCount}/{totalParticipants}</strong> finished
          </span>
        </div>
        <button onClick={onExit}>Exit ★</button>
      </div>

      <div className="main">
        <div className="content" style={{ maxWidth: '1180px' }}>
          <div className="fac-controls">
            <div className="fac-control-group">
              <span className="fac-control-label">Orient by:</span>
              {[
                { k: 'forced', label: 'Forced pick' },
                { k: 'first',  label: 'First word' },
                { k: 'cog',    label: 'Centre of gravity' },
              ].map(({ k, label }) => (
                <span key={k} className={'fac-chip' + (orientBy[k] ? ' on' : '')}
                      onClick={() => setOrientBy(prev => ({ ...prev, [k]: !prev[k] }))}>{label}</span>
              ))}
            </div>
            <div className="fac-control-group">
              <span className="fac-control-label">Quadrants:</span>
              {['refine','reinvent','resist','respond','central'].map(q => (
                <span key={q} className={'fac-chip' + (showQuadrant[q] ? ' on' : '')}
                      onClick={() => setShowQuadrant(prev => ({ ...prev, [q]: !prev[q] }))}>{QUADRANTS[q].label}</span>
              ))}
            </div>
          </div>

          {error && <div className="error" style={{ marginBottom: '1rem' }}>{error}</div>}

          <div className="fac-wall">
            {renderBucket('refine')}
            {renderBucket('reinvent')}
            {renderBucket('resist')}
            {renderBucket('respond')}
          </div>
          <div className="fac-wall-side">
            {renderBucket('central', true)}
            {renderBucket('outside', true)}
          </div>
        </div>
      </div>
      <Footer />
    </div>
  );
}

// ============================================================================
// ROOT
// ============================================================================

function Root() {
  const params = useMemo(() => {
    if (typeof window === 'undefined') return new URLSearchParams();
    return new URLSearchParams(window.location.search);
  }, []);
  const initialCode = (params.get('code') || '').toUpperCase();
  const initialSubject = params.get('subject') || '';

  const [mode, setMode] = useState('gate'); // 'gate' | 'participant' | 'facilitator'
  const [session, setSession] = useState(null);
  const [facilitatorCode, setFacilitatorCode] = useState('');

  function handleParticipantBegin(s) { setSession(s); setMode('participant'); }
  function handleFacilitatorUnlock(code) { setFacilitatorCode(code); setMode('facilitator'); }
  function handleExitToGate() { setMode('gate'); setSession(null); setFacilitatorCode(''); }

  if (mode === 'participant' && session) {
    return <ParticipantApp session={session} onExitToGate={handleExitToGate} />;
  }
  if (mode === 'facilitator' && facilitatorCode) {
    return <FacilitatorApp sessionCode={facilitatorCode} onExit={handleExitToGate} />;
  }
  return <Landing
    initialCode={initialCode}
    initialSubject={initialSubject}
    onParticipantBegin={handleParticipantBegin}
    onFacilitatorUnlock={handleFacilitatorUnlock}
  />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
