<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resilience Is — ChangeBefore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #f0ede8;
    --text: #1a1a1a;
    --accent: #e07030;
    --accent-soft: #e9a98a;
    --border: #d8d3cb;
    --input-border: #a09890;
    --muted: #6b6b6b;
    --warm-grey: #a09890;
    --white: #ffffff;
    --track: #e8e3da;
    --success: #2f7a4f;
    --error: #c0392b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 17px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400; line-height: 1.2;
    margin: 0 0 0.5em 0;
  }
  h1 { font-size: 2.4rem; }
  h2 { font-size: 1.8rem; }
  h3 { font-family: 'DM Sans', sans-serif; font-size: 1.05rem; font-weight: 500; }
  p { margin: 0 0 1em 0; }

  .ri-container { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .ri-container--wide { max-width: 1180px; }

  .ri-header { border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }

  .ri-eyebrow {
    text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 0.75rem; color: var(--muted);
    font-weight: 500; margin-bottom: 0.5rem;
  }

  .ri-lead { color: var(--muted); font-size: 1rem; margin-bottom: 1.5rem; }

  .ri-btn {
    background: var(--text); color: var(--white);
    border: none; padding: 0.85rem 1.75rem;
    font-family: inherit; font-size: 1rem; font-weight: 500;
    cursor: pointer; transition: opacity 0.2s; min-height: 44px;
    border-radius: 0;
  }
  .ri-btn:hover { opacity: 0.85; }
  .ri-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .ri-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ri-btn--secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--input-border);
  }
  .ri-btn--accent {
    background: var(--accent); color: var(--white);
  }
  .ri-btn--ghost {
    background: transparent; color: var(--muted);
    border: none; padding: 0.5rem 0.75rem;
    text-decoration: underline; font-size: 0.9rem;
  }

  .ri-btn-row {
    display: flex; gap: 1rem; align-items: center;
    margin-top: 2rem; flex-wrap: wrap;
  }
  .ri-btn-row--split { justify-content: space-between; }

  .ri-field { margin-bottom: 1.5rem; }
  .ri-field label {
    display: block; font-weight: 500;
    margin-bottom: 0.5rem; font-size: 0.95rem;
  }
  .ri-field input[type="text"],
  .ri-field input[type="email"],
  .ri-field select {
    width: 100%; padding: 0.65rem 0.85rem;
    border: 1px solid var(--input-border);
    background: var(--white); font-family: inherit;
    font-size: 1rem; color: var(--text); border-radius: 0;
  }
  .ri-field input:focus-visible,
  .ri-field select:focus-visible {
    outline: 2px solid var(--text); outline-offset: 1px;
  }

  .ri-error {
    color: var(--error); font-size: 0.9rem;
    margin-top: 0.4rem;
  }

  .ri-progress { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
  .ri-progress-bar { height: 4px; background: var(--border); margin-bottom: 1.5rem; }
  .ri-progress-bar-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }

  /* WORD ENTRY */
  .ri-word-stem {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.7rem; line-height: 1.3;
    color: var(--text); margin-bottom: 1rem;
  }
  .ri-word-input-row {
    display: flex; gap: 0.5rem; margin-bottom: 1rem;
  }
  .ri-word-input-row input {
    flex: 1; padding: 0.85rem 1rem;
    border: 1px solid var(--input-border);
    background: var(--white); font-family: inherit;
    font-size: 1.05rem; color: var(--text); border-radius: 0;
  }
  .ri-word-input-row input:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .ri-word-input-row button {
    background: var(--text); color: var(--white);
    border: none; padding: 0 1.25rem;
    font-family: inherit; font-size: 1rem; font-weight: 500;
    cursor: pointer; min-height: 44px;
  }
  .ri-word-input-row button:disabled { opacity: 0.3; cursor: not-allowed; }

  .ri-word-list {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin-bottom: 1.5rem; min-height: 2rem;
  }
  .ri-word-chip {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--white); border: 1px solid var(--border);
    padding: 0.35rem 0.75rem; font-size: 0.95rem;
  }
  .ri-word-chip--first {
    border-left: 3px solid var(--accent);
    padding-left: calc(0.75rem - 2px);
  }
  .ri-word-chip button {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1.1rem; padding: 0; line-height: 1;
  }
  .ri-word-chip button:hover { color: var(--text); }

  .ri-helper {
    color: var(--muted); font-size: 0.85rem; font-style: italic;
    margin-top: 0.5rem;
  }

  /* STALL LIST */
  .ri-stall-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.5rem; margin-bottom: 1.5rem;
  }
  .ri-stall-chip {
    background: var(--white); border: 1px solid var(--border);
    padding: 0.6rem 0.85rem; font-size: 0.95rem;
    cursor: pointer; text-align: center;
    transition: all 0.15s; user-select: none;
  }
  .ri-stall-chip:hover { border-color: var(--text); }
  .ri-stall-chip--selected {
    background: var(--text); color: var(--white);
    border-color: var(--text);
  }

  /* FORCED PICK */
  .ri-pick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 0.5rem; margin-bottom: 1.5rem;
  }
  .ri-pick-chip {
    background: var(--white); border: 1px solid var(--border);
    padding: 0.85rem 1rem; font-size: 1rem;
    cursor: pointer; text-align: center;
    transition: all 0.15s;
  }
  .ri-pick-chip:hover { border-color: var(--text); }
  .ri-pick-chip--selected {
    background: var(--accent); color: var(--white);
    border-color: var(--accent);
    font-weight: 500;
  }

  /* REVEAL — four-box grid */
  .ri-reveal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin: 1.5rem 0;
  }
  .ri-bucket {
    background: var(--white); border: 1px solid var(--border);
    padding: 1.25rem 1.1rem;
    min-height: 140px;
    display: flex; flex-direction: column;
  }
  .ri-bucket-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.5rem; line-height: 1;
    margin-bottom: 0.85rem; color: var(--text);
  }
  .ri-bucket-words {
    display: flex; flex-wrap: wrap; gap: 0.4rem;
    flex: 1;
  }
  .ri-bucket-word {
    background: var(--bg); border: 1px solid var(--border);
    padding: 0.25rem 0.55rem; font-size: 0.9rem;
  }
  .ri-bucket-word--first {
    border-left: 3px solid var(--accent);
    padding-left: calc(0.55rem - 2px);
  }
  .ri-bucket-word--pick {
    background: var(--accent); color: var(--white);
    border-color: var(--accent); font-weight: 500;
  }
  .ri-bucket--empty { background: rgba(255,255,255,0.4); }
  .ri-bucket-empty-note {
    color: var(--warm-grey); font-size: 0.85rem;
    font-style: italic;
  }

  .ri-side-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .ri-side-bucket {
    background: var(--white); border: 1px solid var(--border);
    padding: 0.85rem 1.1rem; min-height: 60px;
  }
  .ri-side-bucket .ri-bucket-label { font-size: 1.05rem; margin-bottom: 0.5rem; }

  /* STRATEGIC TENSIONS — closing screen */
  .ri-tensions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin: 1.5rem 0;
  }
  .ri-tension {
    background: var(--white); border: 1px solid var(--border);
    padding: 1.5rem 1.25rem;
    min-height: 140px;
  }
  .ri-tension-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
    margin-bottom: 0.6rem;
  }
  .ri-tension-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.25rem; line-height: 1.35; color: var(--text);
  }

  /* JOIN / PRINT EXIT */
  .ri-join-card {
    background: var(--white); border: 1px solid var(--border);
    padding: 2rem 1.75rem;
    margin-bottom: 1.5rem;
  }
  .ri-join-card h2 {
    margin-bottom: 0.6rem;
  }
  .ri-checkbox-row {
    display: flex; align-items: flex-start; gap: 0.6rem;
    margin: 0.85rem 0; cursor: pointer;
  }
  .ri-checkbox-row input { margin-top: 0.25rem; cursor: pointer; }
  .ri-checkbox-row label {
    flex: 1; font-size: 0.95rem; line-height: 1.45;
    color: var(--text); cursor: pointer; margin: 0;
  }
  .ri-privacy-note {
    color: var(--muted); font-size: 0.85rem;
    margin-top: 1rem;
  }
  .ri-print-link {
    text-align: center; padding-top: 1rem;
    font-size: 0.9rem; color: var(--muted);
  }
  .ri-print-link button {
    background: none; border: none; cursor: pointer;
    color: var(--muted); text-decoration: underline;
    font-family: inherit; font-size: inherit;
  }
  .ri-print-link button:hover { color: var(--text); }

  /* FOOTER */
  .ri-footer {
    border-top: 1px solid var(--border);
    margin-top: 3rem; padding-top: 1.5rem;
    color: var(--warm-grey); font-size: 0.8rem;
    text-align: center;
  }

  /* ========================================================================
     WALL VIEW — projected display for facilitators (?view=wall)
     ======================================================================== */
  .ri-wall {
    min-height: 100vh; padding: 1.5rem 2rem 2rem;
    background: var(--bg);
  }
  .ri-wall-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;
  }
  .ri-wall-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.8rem; line-height: 1;
  }
  .ri-wall-meta {
    color: var(--muted); font-size: 0.95rem;
  }
  .ri-wall-meta strong { color: var(--text); font-weight: 500; }

  .ri-wall-controls {
    background: var(--white); border: 1px solid var(--border);
    padding: 0.85rem 1.1rem;
    margin-bottom: 1.25rem;
    display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center;
  }
  .ri-wall-control-group {
    display: flex; gap: 0.6rem; align-items: center;
    flex-wrap: wrap;
  }
  .ri-wall-control-label {
    text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 0.7rem; color: var(--muted); font-weight: 500;
  }
  .ri-wall-chip {
    background: var(--bg); border: 1px solid var(--input-border);
    padding: 0.35rem 0.75rem; font-size: 0.85rem;
    cursor: pointer; user-select: none;
  }
  .ri-wall-chip--on {
    background: var(--text); color: var(--white);
    border-color: var(--text);
  }

  .ri-wall-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .ri-wall-bucket {
    background: var(--white); border: 1px solid var(--border);
    padding: 1.25rem 1.4rem;
    min-height: 220px;
    display: flex; flex-direction: column;
  }
  .ri-wall-bucket-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 0.85rem;
  }
  .ri-wall-bucket-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.8rem; line-height: 1;
  }
  .ri-wall-bucket-count {
    color: var(--muted); font-size: 0.85rem;
  }
  .ri-wall-words {
    display: flex; flex-wrap: wrap; gap: 0.45rem 0.85rem;
    align-items: baseline; line-height: 1.3;
  }
  /* Word size scales with frequency */
  .ri-wall-word { color: var(--text); }
  .ri-wall-word--1 { font-size: 1rem; }
  .ri-wall-word--2 { font-size: 1.2rem; }
  .ri-wall-word--3 { font-size: 1.45rem; }
  .ri-wall-word--4 { font-size: 1.7rem; }
  .ri-wall-word--5 { font-size: 2rem; font-weight: 500; }

  .ri-wall-side {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .ri-wall-side-bucket {
    background: var(--white); border: 1px solid var(--border);
    padding: 0.85rem 1.1rem; min-height: 80px;
  }
  .ri-wall-side-bucket .ri-wall-bucket-label { font-size: 1.2rem; }

  /* GATE — code entry */
  .ri-gate {
    max-width: 460px; margin: 4rem auto 2rem;
    padding: 2rem 1.75rem; background: var(--white);
    border: 1px solid var(--border);
  }
  .ri-gate h1 { font-size: 2rem; margin-bottom: 0.4rem; }
  .ri-gate p { color: var(--muted); margin-bottom: 1.5rem; }

  /* RESUME prompt */
  .ri-resume-prompt {
    background: var(--white); border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .ri-reveal-grid, .ri-tensions-grid, .ri-side-row, .ri-wall-grid, .ri-wall-side {
      grid-template-columns: 1fr;
    }
    .ri-wall { padding: 1rem; }
    .ri-container { padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.9rem; }
    .ri-word-stem { font-size: 1.35rem; }
  }

  @media print {
    .ri-no-print { display: none !important; }
    body { background: white; }
    .ri-bucket, .ri-tension, .ri-join-card { break-inside: avoid; }
  }

  .ri-hidden { display: none; }

  .ri-spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--track);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: ri-spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes ri-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ============================================================================
// CONSTANTS
// ============================================================================

const TOOL_LABEL = 'Resilience Is';

const DEFAULT_SUBJECT = 'organisational resilience';

const QUADRANTS = {

// Words shown in the stall list. Curated from David's slide (dedup'd, sample of ~40).
// Order is scrambled at render time.
const STALL_WORDS = [
  // refine
  'Optimise','Improve','Perform','Deliver','Develop','Streamline','Achieve',
  // reinvent
  'Reinvent','Innovate','Transform','Imagine','Create','Inspire','Reimagine',
  // resist
  'Prevent','Control','Avoid','Mitigate','Protect','Comply','Maintain',
  // respond
  'Respond','Adapt (in the moment)','Recover','Notice','Sense','Bounce back','Repair',

  'Learn','Anticipate','Prepare','Navigate','Endure',
  // a few outside decoys
  'Lead','Collaborate','Communicate',

const STORAGE_PREFIX = 'ri_v1::';

// ============================================================================
// HELPERS
// ============================================================================

function normaliseWord(w) {
  return (w || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function classifyWordLocal(w) {
  const k = normaliseWord(w);
  if (!k) return null;
  return DICTIONARY[k] || null;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function padNumber(n) {
  if (!n) return '';
  return String(n).padStart(3, '0');
}

function loadResumeData(code) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + code);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function saveResumeData(code, data) {
  try { localStorage.setItem(STORAGE_PREFIX + code, JSON.stringify(data)); }
  catch (e) { /* quota errors fine to ignore */ }
}

function clearResumeData(code) {
  try { localStorage.removeItem(STORAGE_PREFIX + code); } catch (e) {}
}

async function fetchWithRetry(url, opts, maxAttempts = 3) {
  const delays = [0, 508, 2010];
  let lastErr;
  for (let i = 0; i < maxAttempts; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, delays[i]));
    try {
      const r = await fetch(url, opts);
      if (r.ok) return r;
      lastErr = new Error('HTTP ' + r.status);
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function Gate({ initialCode, initialSubject, onEntry }) {
  const [code, setCode] = useState(initialCode || '');
  const [name, setName] = useState('');
  const [role, setRole] = useState('');
  const [validating, setValidating] = useState(false);
  const [error, setError] = useState('');
  const [resumeAvailable, setResumeAvailable] = useState(null);

  useEffect(() => {
    if (initialCode) {
      validateCode(initialCode, { silent: true });
    }
    // eslint-disable-next-line
  }, []);

  // Check for resume data when code changes
  useEffect(() => {
    const c = (code || '').trim().toUpperCase();
    if (c) {
      const r = loadResumeData(c);
      setResumeAvailable(r && r.step ? r : null);
    } else {
      setResumeAvailable(null);
    }
  }, [code]);

  async function validateCode(testCode, opts = {}) {
    const c = (testCode || '').trim().toUpperCase();
    if (!c) { if (!opts.silent) setError('Enter a code to continue.'); return null; }
    setValidating(true); setError('');
    try {
      const r = await fetch('/api/validate-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: c, tool: TOOL_SLUG }),
      });
      const data = await r.json();
      if (!r.ok || !data.valid) {
        if (!opts.silent) setError(data.error || 'That code wasn\'t recognised. Check it and try again.');
        setValidating(false);
        return null;
      }
      setValidating(false);
      return { ...data, code: c };
    } catch (e) {
      if (!opts.silent) setError('We couldn\'t reach the validation service. Check your connection and try again.');
      setValidating(false);
      return null;
    }
  }

  async function handleBegin() {
    const validation = await validateCode(code);
    if (!validation) return;
    // Assign participant — POST to resilience-assign-participant for sequential number
    let assigned;
    try {
      const r = await fetch('/api/resilience-assign-participant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_code: validation.code }),
      });
      assigned = await r.json();
      if (!r.ok || !assigned.participant_uuid) {
        throw new Error(assigned.error || 'Could not assign a participant number.');
      }
    } catch (e) {
      setError('Could not start your session. Please try again. (' + e.message + ')');
      setValidating(false);
      return;
    }
    setValidating(false);
    onEntry({
      code: validation.code,
      subject: initialSubject || validation.subject || DEFAULT_SUBJECT,
      respondent_name: name.trim(),
      role: role.trim(),
      participant_uuid: assigned.participant_uuid,
      participant_number: assigned.number,
      participant_id: padNumber(assigned.number),
      resumeData: null,
    });
  }

  function handleResume() {
    if (!resumeAvailable) return;
    onEntry({
      code: (code || '').trim().toUpperCase(),
      subject: resumeAvailable.subject || DEFAULT_SUBJECT,
      respondent_name: resumeAvailable.respondent_name || '',
      role: resumeAvailable.role || '',
      participant_uuid: resumeAvailable.participant_uuid,
      participant_number: resumeAvailable.participant_number,
      participant_id: padNumber(resumeAvailable.participant_number),
      resumeData: resumeAvailable,
    });
  }

  return (
    <div className="ri-container">
      <div className="ri-gate">
        <h1>Resilience Is</h1>
        <p>Workshop reflection on what resilience means to you.</p>

        {resumeAvailable && (
          <div className="ri-resume-prompt">
            <strong>Welcome back.</strong> You were partway through. Want to pick up where you left off?
            <div className="ri-btn-row" style={{ marginTop: '0.85rem' }}>
              <button className="ri-btn" onClick={handleResume}>Continue</button>
              <button className="ri-btn ri-btn--secondary" onClick={() => {
                clearResumeData((code || '').trim().toUpperCase());
                setResumeAvailable(null);
              }}>Start fresh</button>
            </div>
          </div>
        )}

        {!resumeAvailable && (
          <>
            <div className="ri-field">
              <label htmlFor="code-input">Session code</label>
              <input
                id="code-input"
                type="text"
                value={code}
                onChange={e => setCode(e.target.value.toUpperCase())}
                placeholder="e.g. IMI0426"
                autoComplete="off"
              />
            </div>
            <div className="ri-field">
              <label htmlFor="name-input">Your name (optional)</label>
              <input
                id="name-input"
                type="text"
                value={name}
                onChange={e => setName(e.target.value)}
                placeholder="Only used so you can resume on this device"
              />
            </div>
            <div className="ri-field">
              <label htmlFor="role-input">Your role (optional)</label>
              <input
                id="role-input"
                type="text"
                value={role}
                onChange={e => setRole(e.target.value)}
                placeholder="e.g. HR Director, Operations Manager"
              />
            </div>
            {error && <div className="ri-error">{error}</div>}
            <div className="ri-btn-row">
              <button className="ri-btn" onClick={handleBegin} disabled={validating}>
                {validating ? <><span className="ri-spinner" /> Starting…</> : 'Begin'}
              </button>
            </div>
          </>
        )}
      </div>
      <Footer />
    </div>
  );
}

function QuestionScreen({ subject, words, onAddWord, onRemoveWord, onDone }) {
  const [draft, setDraft] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    if (inputRef.current) inputRef.current.focus();
  }, []);

  function commitWord() {
    const v = draft.trim();
    if (!v) return;
    if (v.length > 60) return; // reject absurd entries
    // de-dup case-insensitive within this participant's list
    const existing = words.map(w => normaliseWord(w.word));
    if (existing.includes(normaliseWord(v))) {
      setDraft('');
      return;
    }
    onAddWord(v);
    setDraft('');
    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
  }

  function onKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      commitWord();
    }
  }

  return (
    <div className="ri-container">
      <Header subject={subject} />

      <p className="ri-word-stem">
        {subject || DEFAULT_SUBJECT} is the ability to…
      </p>
      <p className="ri-helper">
        Add as many words as feel right. Just one or two words each time. There's no wrong answer.
      </p>

      <div className="ri-word-input-row">
        <input
          ref={inputRef}
          type="text"
          value={draft}
          onChange={e => setDraft(e.target.value)}
          onKeyDown={onKey}
          placeholder="add a word…"
          autoComplete="off"
          maxLength={60}
        />
        <button onClick={commitWord} disabled={!draft.trim()}>Add</button>
      </div>

      {words.length > 0 && (
        <div className="ri-word-list">
          {words.map((w, i) => (
            <div key={i} className={'ri-word-chip ' + (i === 0 ? 'ri-word-chip--first' : '')}>
              <span>{w.word}</span>
              <button onClick={() => onRemoveWord(i)} aria-label="Remove">×</button>
            </div>
          ))}
        </div>
      )}

      <div className="ri-btn-row ri-btn-row--split">
        <span className="ri-helper" style={{ margin: 0 }}>
          {words.length === 0 ? 'Type your first word above.' : `${words.length} word${words.length === 1 ? '' : 's'} so far`}
        </span>
        <button
          className="ri-btn"
          onClick={onDone}
          disabled={words.length === 0}
        >Done</button>
      </div>

      <Footer />
    </div>
  );
}

function RevealScreen({ subject, allWords, firstWord, forcedPick, classifications, classifying, onContinue }) {
  // Group words by quadrant. classifications: { word -> quadrant }
  const grouped = useMemo(() => {
    const g = { refine: [], reinvent: [], resist: [], respond: [], central: [], outside: [] };
    const seen = new Set();
    allWords.forEach(w => {
      const norm = normaliseWord(w);
      if (seen.has(norm)) return;
      seen.add(norm);
      const q = classifications[norm] || 'central';
      if (g[q]) g[q].push(w);
    });
    return g;
  }, [allWords, classifications]);

  function renderBucket(key) {
    const words = grouped[key] || [];
    const isEmpty = words.length === 0;
    return (
      <div className={'ri-bucket ' + (isEmpty ? 'ri-bucket--empty' : '')}>
        <div className="ri-bucket-label">{QUADRANTS[key].label}</div>
        {isEmpty ? (
          <span className="ri-bucket-empty-note">Nothing here</span>
        ) : (
          <div className="ri-bucket-words">
            {words.map((w, i) => {
              const isFirst = normaliseWord(w) === normaliseWord(firstWord);
              const isPick = normaliseWord(w) === normaliseWord(forcedPick);
              return (
                <div
                  key={w + '_' + i}
                  className={
                    'ri-bucket-word' +
                    (isFirst ? ' ri-bucket-word--first' : '') +
                    (isPick ? ' ri-bucket-word--pick' : '')
                  }
                >{w}</div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="ri-container">
      <Header subject={subject} />

      <div className="ri-eyebrow">Your reveal</div>
      <h2 style={{ marginBottom: '0.4rem' }}>Here's where your words landed.</h2>
      <p className="ri-helper" style={{ marginBottom: '1.5rem' }}>
        {classifying
          ? 'Just a moment while we map your words…'
          : 'Each word you offered, grouped. Your first word has a small orange mark. Your essential pick is highlighted.'}
      </p>

      {classifying && (
        <div style={{ textAlign: 'center', padding: '2rem 0' }}>
          <span className="ri-spinner" /> Classifying…
        </div>
      )}

      {!classifying && (
        <>
          <div className="ri-reveal-grid">
            {renderBucket('refine')}
            {renderBucket('reinvent')}
            {renderBucket('resist')}
            {renderBucket('respond')}
          </div>

          {(grouped.central.length > 0 || grouped.outside.length > 0) && (
            <div className="ri-side-row">
              <div className="ri-side-bucket">
                <div className="ri-bucket-label">Central</div>
                <p className="ri-helper" style={{ fontSize: '0.8rem', marginBottom: '0.5rem' }}>
                  Cross-cutting capabilities
                </p>
                {grouped.central.length === 0
                  ? <span className="ri-bucket-empty-note">—</span>
                  : <div className="ri-bucket-words">
                      {grouped.central.map((w, i) => (
                        <div key={w + '_c_' + i} className="ri-bucket-word">{w}</div>
                      ))}
                    </div>}
              </div>
              <div className="ri-side-bucket">
                <div className="ri-bucket-label">Conditions</div>
                <p className="ri-helper" style={{ fontSize: '0.8rem', marginBottom: '0.5rem' }}>
                  What enables resilience
                </p>
                {grouped.outside.length === 0
                  ? <span className="ri-bucket-empty-note">—</span>
                  : <div className="ri-bucket-words">
                      {grouped.outside.map((w, i) => (
                        <div key={w + '_o_' + i} className="ri-bucket-word">{w}</div>
                      ))}
                    </div>}
              </div>
            </div>
          )}

          <div className="ri-btn-row ri-btn-row--split">
            <span className="ri-helper" style={{ margin: 0 }}>
              Which container has most of your words? Which has none?
            </span>
            <button className="ri-btn" onClick={onContinue}>Continue</button>
          </div>
        </>
      )}

      <Footer />
    </div>
  );
}

// ============================================================================

// ============================================================================

function generatePDF({ subject, participantId, allWords, firstWord, forcedPick, classifications, opts = {} }) {
  if (typeof window.jspdf === 'undefined') { alert('PDF library not loaded yet — try again in a moment.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  // Brand palette in 0-255
  const TEXT = [26, 26, 26];
  const MUTED = [107, 107, 107];
  const ACCENT = [224, 112, 48];
  const BG = [240, 237, 232];
  const BORDER = [216, 211, 203];
  const WHITE = [255, 255, 255];

  const W = 210, H = 297;
  const M = 18;

  // ---- helpers ----
  function setFill(c) { doc.setFillColor(c[0], c[1], c[2]); }
  function setStroke(c) { doc.setDrawColor(c[0], c[1], c[2]); }
  function setText(c) { doc.setTextColor(c[0], c[1], c[2]); }

  // ---- page 1: header + buckets ----
  setFill(BG); doc.rect(0, 0, W, H, 'F');

  setText(MUTED); doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.text(('RESILIENCE IS' + (participantId ? '  ·  YOU ARE ' + participantId : '')).toUpperCase(), M, M);

  setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(18);
  doc.text((subject || DEFAULT_SUBJECT) + ' is the ability to…', M, M + 12);

  setStroke(BORDER); doc.setLineWidth(0.3);
  doc.line(M, M + 17, W - M, M + 17);

  // Group words
  const grouped = { refine: [], reinvent: [], resist: [], respond: [], central: [], outside: [] };
  const seen = new Set();
  allWords.forEach(w => {
    const norm = normaliseWord(w);
    if (seen.has(norm)) return;
    seen.add(norm);
    const q = classifications[norm] || 'central';
    if (grouped[q]) grouped[q].push(w);
  });

  function drawBucket(label, x, y, w, h, words) {
    setFill(WHITE); doc.rect(x, y, w, h, 'F');
    setStroke(BORDER); doc.setLineWidth(0.3);
    doc.rect(x, y, w, h, 'S');

    setText(TEXT); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text(label, x + 4, y + 7);

    setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    let cx = x + 4, cy = y + 14;
    const lineH = 5;
    words.forEach(w => {
      const isPick = normaliseWord(w) === normaliseWord(forcedPick);
      const isFirst = normaliseWord(w) === normaliseWord(firstWord);
      const display = w;
      const tw = doc.getTextWidth(display);
      if (cx + tw > x + w - 4) {
        cx = x + 4; cy += lineH;
      }
      if (cy > y + h - 3) return;
      if (isPick) {
        setFill(ACCENT); doc.rect(cx - 1.2, cy - 3.6, tw + 2.4, 4.8, 'F');
        setText(WHITE); doc.setFont('helvetica', 'bold');
      } else if (isFirst) {
        setFill(BG); doc.rect(cx - 1.2, cy - 3.6, tw + 2.4, 4.8, 'F');
        setText(TEXT); doc.setFont('helvetica', 'bold');
      } else {
        setText(TEXT); doc.setFont('helvetica', 'normal');
      }
      doc.text(display, cx, cy);
      cx += tw + 4;
    });

    if (words.length === 0) {
      setText(MUTED); doc.setFont('helvetica', 'italic'); doc.setFontSize(9);
      doc.text('Nothing here', x + 4, y + 14);
    }
  }

  const gridY = M + 25;
  const gridW = (W - 2 * M - 4) / 2;
  const gridH = 55;

  drawBucket('Refine',   M,                gridY,            gridW, gridH, grouped.refine);
  drawBucket('Reinvent', M + gridW + 4,    gridY,            gridW, gridH, grouped.reinvent);
  drawBucket('Resist',   M,                gridY + gridH + 4, gridW, gridH, grouped.resist);
  drawBucket('Respond',  M + gridW + 4,    gridY + gridH + 4, gridW, gridH, grouped.respond);

  let nextY = gridY + 2 * gridH + 12;

  if (grouped.central.length > 0) {
    setText(MUTED); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('CENTRAL — CROSS-CUTTING', M, nextY);
    setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(grouped.central.join(', '), M, nextY + 5);
    nextY += 14;
  }
  if (grouped.outside.length > 0) {
    setText(MUTED); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('CONDITIONS — WHAT ENABLES RESILIENCE', M, nextY);
    setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(grouped.outside.join(', '), M, nextY + 5);
    nextY += 14;
  }

  // Pick callout
  setFill(TEXT); doc.rect(M, H - 50, W - 2 * M, 28, 'F');
  setText(ACCENT); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
  doc.text('YOUR ESSENTIAL WORD', M + 6, H - 42);
  setText(WHITE); doc.setFont('helvetica', 'normal'); doc.setFontSize(20);
  doc.text(forcedPick || '—', M + 6, H - 30);

  // Footer line
  setText(MUTED); doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.text('ChangeBefore  ·  tools.changebefore.com', M, H - 8);

  // ---- page 2: strategic tensions ----
  doc.addPage();
  setFill(BG); doc.rect(0, 0, W, H, 'F');

  setText(MUTED); doc.setFontSize(8);
  doc.text('STRATEGIC TENSIONS', M, M);
  setText(TEXT); doc.setFontSize(18); doc.setFont('helvetica', 'normal');
  doc.text('What this means at the organisational level', M, M + 12);
  setStroke(BORDER); doc.setLineWidth(0.3);
  doc.line(M, M + 17, W - M, M + 17);

  function drawTension(label, body, x, y, w, h) {
    setFill(WHITE); doc.rect(x, y, w, h, 'F');
    setStroke(BORDER); doc.rect(x, y, w, h, 'S');
    setText(MUTED); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
    doc.text(label.toUpperCase(), x + 5, y + 7);
    setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    const lines = doc.splitTextToSize(body, w - 10);
    doc.text(lines, x + 5, y + 14);
  }

  const tY = M + 25;
  const tW = (W - 2 * M - 4) / 2;
  const tH = 50;
  drawTension('Refine',   TENSIONS.refine,   M,             tY,           tW, tH);
  drawTension('Reinvent', TENSIONS.reinvent, M + tW + 4,    tY,           tW, tH);
  drawTension('Resist',   TENSIONS.resist,   M,             tY + tH + 4,  tW, tH);
  drawTension('Respond',  TENSIONS.respond,  M + tW + 4,    tY + tH + 4,  tW, tH);

  setText(TEXT); doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
  const closingLines = doc.splitTextToSize(
    'Most organisations lean heavily on one or two of these. Resilience comes from being able to move across all four when the situation demands it.',
    W - 2 * M
  );
  doc.text(closingLines, M, tY + 2 * tH + 18);

  setText(MUTED); doc.setFontSize(8);
  doc.text('ChangeBefore  ·  tools.changebefore.com', M, H - 8);

  const filename = `resilience-is-${participantId || 'reveal'}.pdf`;

  if (opts.returnBase64) {
    const dataUri = doc.output('datauristring');
    const base64 = dataUri.split('base64,')[1] || '';
    return { base64, filename };
  }
  doc.save(filename);
  return { filename };
}

// ============================================================================
// MAIN APP — orchestrates participant flow
// ============================================================================

// Step constants:
// 0 = Gate, 1 = Question, 2 = Stall, 3 = ForcedPick, 4 = Reveal,
// 5 = Tensions, 6 = Exit, 7 = PrintDone, 8 = JoinDone

function ParticipantApp({ initialCode, initialSubject }) {
  const [step, setStep] = useState(0);
  const [session, setSession] = useState(null);
  // words: [{ word: string, ts: ISO }]
  const [words, setWords] = useState([]);
  // selected: ["normalised", ...] from stall list
  const [selected, setSelected] = useState([]);
  const [forcedPick, setForcedPick] = useState('');
  const [classifications, setClassifications] = useState({});
  const [classifying, setClassifying] = useState(false);
  const [joining, setJoining] = useState(false);
  const [joinError, setJoinError] = useState('');
  const [joinedEmail, setJoinedEmail] = useState('');

  // ---- entry from gate ----
  function handleEntry(s) {
    setSession(s);
    if (s.resumeData) {
      setWords(s.resumeData.words || []);
      setSelected(s.resumeData.selected || []);
      setForcedPick(s.resumeData.forcedPick || '');
      setClassifications(s.resumeData.classifications || {});
      setStep(s.resumeData.step || 1);
    } else {
      setWords([]); setSelected([]); setForcedPick('');
      setClassifications({}); setStep(1);
    }
  }

  // ---- persist resume data on any meaningful change ----
  useEffect(() => {
    if (!session) return;
    saveResumeData(session.code, {
      step, words, selected, forcedPick, classifications,
      participant_uuid: session.participant_uuid,
      participant_number: session.participant_number,
      respondent_name: session.respondent_name,
      role: session.role,
      subject: session.subject,
    });
  }, [session, step, words, selected, forcedPick, classifications]);

  // ---- scroll to top on step change ----
  useEffect(() => {
    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [step]);

  // ---- save to Supabase (background, fire-and-forget with retry) ----
  const saveRef = useRef({ timer: null });
  useEffect(() => {
    if (!session || step < 1) return;
    if (saveRef.current.timer) clearTimeout(saveRef.current.timer);
    saveRef.current.timer = setTimeout(() => {
      const allWordsForCounting = [...words.map(w => w.word), ...selected];
      const primaryQ = forcedPick ? (classifications[normaliseWord(forcedPick)] || null) : null;
      const firstQ = words.length > 0 ? (classifications[normaliseWord(words[0].word)] || null) : null;
      // centre of gravity: most-frequent quadrant
      let cogQ = null;
      if (Object.keys(classifications).length > 0) {
        const counts = {};
        allWordsForCounting.forEach(w => {
          const q = classifications[normaliseWord(w)];
          if (q) counts[q] = (counts[q] || 0) + 1;
        });
        let max = 0;
        let tie = false;
        Object.entries(counts).forEach(([q, c]) => {
          if (c > max) { max = c; cogQ = q; tie = false; }
          else if (c === max) { tie = true; }
        });
        if (tie) cogQ = null;
      }
      fetchWithRetry('/api/resilience-save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_code: session.code,
          participant_id: session.participant_uuid,
          respondent_name: session.respondent_name || null,
          role: session.role || null,
          number: session.participant_number,
          subject: session.subject,
          words, selected, forced_pick: forcedPick,
          primary_quadrant: primaryQ,
          first_word_quadrant: firstQ,
          centre_of_gravity: cogQ,
          step,
          completed: step >= 7,
        }),
      }, 3).catch(() => { /* swallow — autosave is best-effort */ });
    }, 800);
    return () => { if (saveRef.current.timer) clearTimeout(saveRef.current.timer); };
  }, [session, step, words, selected, forcedPick, classifications]);

  // ---- classify words when needed (before reveal) ----
  async function classifyAll() {
    const allWords = [...words.map(w => w.word), ...selected];
    const unique = Array.from(new Set(allWords.map(normaliseWord))).filter(Boolean);
    const need = unique.filter(w => !classifications[w] && !DICTIONARY[w]);
    // seed local dictionary hits
    const seeded = { ...classifications };
    unique.forEach(w => {
      if (!seeded[w] && DICTIONARY[w]) seeded[w] = DICTIONARY[w];
    });
    if (need.length === 0) {
      setClassifications(seeded);
      return seeded;
    }
    setClassifying(true);
    try {
      const r = await fetch('/api/resilience-classify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ words: need }),
      });
      if (r.ok) {
        const data = await r.json();
        const result = data.classifications || {};
        const next = { ...seeded };
        Object.entries(result).forEach(([w, q]) => { next[w] = q; });
        // anything unresolved -> central
        need.forEach(w => { if (!next[w]) next[w] = 'central'; });
        setClassifications(next);
        return next;
      }
    } catch (e) { /* fall through */ }
    // failure path -> central for everything unclassified
    const fallback = { ...seeded };
    need.forEach(w => { if (!fallback[w]) fallback[w] = 'central'; });
    setClassifications(fallback);
    return fallback;
  }

  useEffect(() => {
    if (step === 4 && Object.keys(classifications).length === 0) {
      classifyAll().finally(() => setClassifying(false));
    } else if (step === 4 && classifying) {
      setClassifying(false);
    }
    // eslint-disable-next-line
  }, [step]);

  // ---- handlers ----
  function addWord(w) {
    setWords(prev => [...prev, { word: w, ts: new Date().toISOString() }]);
  }
  function removeWord(i) {
    setWords(prev => prev.filter((_, idx) => idx !== i));
  }
  function toggleSelected(norm) {
    setSelected(prev => prev.includes(norm) ? prev.filter(x => x !== norm) : [...prev, norm]);
  }
  function allWordsCombined() {
    const out = [...words.map(w => w.word)];
    selected.forEach(s => { if (!out.map(normaliseWord).includes(s)) out.push(s); });
    return out;
  }
  function firstWord() {
    return words.length > 0 ? words[0].word : '';
  }

  async function handlePrint() {
    generatePDF({
      subject: session.subject,
      participantId: session.participant_id,
      allWords: allWordsCombined(),
      firstWord: firstWord(),
      forcedPick,
      classifications,
    });
    // window.print() not used — PDF is the artefact
    setStep(7);
  }

  async function handleJoin({ firstName, lastName, email, role, marketingOk }) {
    setJoining(true); setJoinError('');
    try {
      const pdf = generatePDF({
        subject: session.subject,
        participantId: session.participant_id,
        allWords: allWordsCombined(),
        firstWord: firstWord(),
        forcedPick,
        classifications,
        opts: { returnBase64: true },
      });
      const r = await fetch('/api/resilience-join-and-send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tool: TOOL_LABEL,
          tool_slug: TOOL_SLUG,
          session_code: session.code,
          participant_id: session.participant_uuid,
          participant_number: session.participant_number,
          first_name: firstName, last_name: lastName, email, role,
          marketing_opt_in: !!marketingOk,
          pdf_base64: pdf.base64, pdf_filename: pdf.filename,
        }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) {
        throw new Error(data.error || 'Could not send your report.');
      }
      setJoinedEmail(email);
      setStep(8);
    } catch (e) {
      setJoinError(e.message || 'Something went wrong. Please try again.');
    } finally {
      setJoining(false);
    }
  }

  async function handleAnonymise() {
    // Print path: no PII has been collected for this participant beyond the
    // resume data on this device. Just clear local resume and move on.
    clearResumeData(session.code);
    setStep(8);
    setJoinedEmail(''); // distinguish from join path
  }

  // ---- render ----
  if (step === 0) return <Gate initialCode={initialCode} initialSubject={initialSubject} onEntry={handleEntry} />;

  const combined = allWordsCombined();

  if (step === 1) return (
    <QuestionScreen
      subject={session.subject}
      words={words}
      onAddWord={addWord}
      onRemoveWord={removeWord}
      onDone={() => setStep(2)}
    />
  );

  if (step === 2) return (
    <StallScreen
      subject={session.subject}
      alreadyHave={words.map(w => w.word)}
      selected={selected}
      onToggle={toggleSelected}
      onDone={() => setStep(3)}
      onSkip={() => setStep(3)}
    />
  );

  if (step === 3) return (
    <ForcedPickScreen
      subject={session.subject}
      allWords={combined}
      pick={forcedPick}
      onPick={setForcedPick}
      onContinue={() => setStep(4)}
    />
  );

  if (step === 4) return (
    <RevealScreen
      subject={session.subject}
      allWords={combined}
      firstWord={firstWord()}
      forcedPick={forcedPick}
      classifications={classifications}
      classifying={classifying}
      onContinue={() => setStep(5)}
    />
  );

  if (step === 5) return (
    <TensionsScreen
      subject={session.subject}
      onContinue={() => setStep(6)}
    />
  );

  if (step === 6) return (
    <ExitScreen
      subject={session.subject}
      participantId={session.participant_id}
      allWords={combined}
      firstWord={firstWord()}
      forcedPick={forcedPick}
      classifications={classifications}
      defaultRole={session.role}
      defaultName={session.respondent_name}
      onJoin={handleJoin}
      onPrint={handlePrint}
      joining={joining}
      joinError={joinError}
    />
  );

  if (step === 7) return (
    <PrintDoneScreen
      subject={session.subject}
      participantId={session.participant_id}
      onAnonymise={handleAnonymise}
    />
  );

  if (step === 8) return (
    <JoinDoneScreen
      subject={session.subject}
      participantId={session.participant_id}
      email={joinedEmail}
    />
  );

  return null;
}

// ============================================================================
// WALL VIEW — facilitator's projected display
// ============================================================================

function WallApp({ initialCode }) {
  const [code, setCode] = useState(initialCode || '');
  const [codeInput, setCodeInput] = useState(initialCode || '');
  const [participants, setParticipants] = useState([]); // [{ words, selected, forced_pick, primary_quadrant, first_word_quadrant, centre_of_gravity, completed, number }]
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  // Filter controls
  const [orientBy, setOrientBy] = useState({ forced: true, first: false, cog: false });
  const [showQuadrant, setShowQuadrant] = useState({
    refine: true, reinvent: true, resist: true, respond: true, central: true,
  });
  const [wallClassifications, setWallClassifications] = useState({});

  // ---- load loop ----
  async function load() {
    if (!code) return;
    try {
      const r = await fetch('/api/resilience-load?session_code=' + encodeURIComponent(code), {
        method: 'GET',
      });
      const data = await r.json();
      if (r.ok && Array.isArray(data.participants)) {
        setParticipants(data.participants);
        setError('');
      } else if (!r.ok) {
        setError(data.error || 'Could not load session data.');
      }
    } catch (e) {
      setError('Could not reach the server.');
    }
  }

  useEffect(() => {
    if (!code) return;
    load();
    const t = setInterval(load, 4000);
    return () => clearInterval(t);
    // eslint-disable-next-line
  }, [code]);

  // ---- classify any new words coming through the wall ----
  useEffect(() => {
    const allWords = new Set();
    participants.forEach(p => {
      (p.words || []).forEach(w => allWords.add(normaliseWord(w.word)));
      (p.selected || []).forEach(s => allWords.add(normaliseWord(s)));
    });
    const need = [];
    allWords.forEach(w => {
      if (!w) return;
      if (wallClassifications[w]) return;
      if (DICTIONARY[w]) return;
      need.push(w);
    });
    // seed dict
    const seeded = { ...wallClassifications };
    allWords.forEach(w => {
      if (!w) return;
      if (!seeded[w] && DICTIONARY[w]) seeded[w] = DICTIONARY[w];
    });
    if (need.length > 0) {
      fetch('/api/resilience-classify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ words: need }),
      }).then(r => r.ok ? r.json() : null).then(data => {
        if (!data) return;
        const next = { ...seeded };
        Object.entries(data.classifications || {}).forEach(([w, q]) => { next[w] = q; });
        need.forEach(w => { if (!next[w]) next[w] = 'central'; });
        setWallClassifications(next);
      }).catch(() => {});
    } else if (Object.keys(seeded).length > Object.keys(wallClassifications).length) {
      setWallClassifications(seeded);
    }
  }, [participants]);

  // ---- compute which participants pass the filter ----
  function participantPassesFilter(p) {
    const anyOrientChecked = orientBy.forced || orientBy.first || orientBy.cog;
    if (!anyOrientChecked) return false;
    const quads = [];
    if (orientBy.forced && p.primary_quadrant) quads.push(p.primary_quadrant);
    if (orientBy.first && p.first_word_quadrant) quads.push(p.first_word_quadrant);
    if (orientBy.cog && p.centre_of_gravity) quads.push(p.centre_of_gravity);
    if (quads.length === 0) return false;
    return quads.some(q => showQuadrant[q]);
  }

  // ---- compute word frequencies per bucket from filtered participants ----
  const bucketData = useMemo(() => {
    const out = { refine: {}, reinvent: {}, resist: {}, respond: {}, central: {}, outside: {} };
    participants.filter(participantPassesFilter).forEach(p => {
      const allWordsCombined = [...(p.words || []).map(w => w.word), ...(p.selected || [])];
      const uniqueForParticipant = new Set();
      allWordsCombined.forEach(w => {
        const norm = normaliseWord(w);
        if (uniqueForParticipant.has(norm)) return;
        uniqueForParticipant.add(norm);
        const q = wallClassifications[norm] || DICTIONARY[norm] || 'central';
        if (!out[q]) return;
        const display = w;
        out[q][display] = (out[q][display] || 0) + 1;
      });
    });
    return out;
    // eslint-disable-next-line
  }, [participants, wallClassifications, orientBy, showQuadrant]);

  function scaleForCount(c, max) {
    if (max <= 1) return 1;
    if (c === max) return 5;
    if (c >= max * 0.75) return 4;
    if (c >= max * 0.5) return 3;
    if (c >= max * 0.25) return 2;
    return 1;
  }

  function renderBucket(key) {
    const wordsObj = bucketData[key] || {};
    const entries = Object.entries(wordsObj).sort((a, b) => b[1] - a[1]);
    const max = entries.length > 0 ? entries[0][1] : 0;
    const total = entries.reduce((s, [, c]) => s + c, 0);
    return (
      <div className={key === 'central' || key === 'outside' ? 'ri-wall-side-bucket' : 'ri-wall-bucket'}>
        <div className="ri-wall-bucket-head">
          <div className="ri-wall-bucket-label">{QUADRANTS[key].label}</div>
          <div className="ri-wall-bucket-count">{total} word{total === 1 ? '' : 's'}</div>
        </div>
        <div className="ri-wall-words">
          {entries.length === 0
            ? <span style={{ color: 'var(--warm-grey)', fontStyle: 'italic', fontSize: '0.9rem' }}>—</span>
            : entries.map(([word, count]) => (
                <span
                  key={word}
                  className={'ri-wall-word ri-wall-word--' + scaleForCount(count, max)}
                >{word}{count > 1 ? <sub style={{ fontSize: '0.55em', color: 'var(--muted)', marginLeft: 2 }}>×{count}</sub> : null}</span>
              ))}
        </div>
      </div>
    );
  }

  // ---- gate: no code yet ----
  if (!code) {
    return (
      <div className="ri-container">
        <div className="ri-gate">
          <h1>Wall view</h1>
          <p>Enter the session code to see the live wall.</p>
          <div className="ri-field">
            <label>Session code</label>
            <input
              type="text"
              value={codeInput}
              onChange={e => setCodeInput(e.target.value.toUpperCase())}
              onKeyDown={e => { if (e.key === 'Enter') setCode(codeInput.trim().toUpperCase()); }}
              placeholder="e.g. IMI0426"
            />
          </div>
          <div className="ri-btn-row">
            <button className="ri-btn" onClick={() => setCode(codeInput.trim().toUpperCase())}>Open</button>
          </div>
        </div>
        <Footer />
      </div>
    );
  }

  const totalParticipants = participants.length;
  const completedCount = participants.filter(p => p.completed).length;

  return (
    <div className="ri-wall">
      <div className="ri-wall-header">
        <div>
          <div className="ri-wall-title">Resilience Is — live wall</div>
          <div className="ri-wall-meta">
            Session <strong>{code}</strong>  ·  <strong>{completedCount}/{totalParticipants}</strong> finished
          </div>
        </div>
        <button className="ri-btn ri-btn--ghost" onClick={() => setCode('')}>Change session</button>
      </div>

      <div className="ri-wall-controls">
        <div className="ri-wall-control-group">
          <span className="ri-wall-control-label">Orient by:</span>
          {[
            { k: 'forced', label: 'Forced pick' },
            { k: 'first',  label: 'First word' },
            { k: 'cog',    label: 'Centre of gravity' },
          ].map(({ k, label }) => (
            <span
              key={k}
              className={'ri-wall-chip ' + (orientBy[k] ? 'ri-wall-chip--on' : '')}
              onClick={() => setOrientBy(prev => ({ ...prev, [k]: !prev[k] }))}
            >{label}</span>
          ))}
        </div>

        <div className="ri-wall-control-group">
          <span className="ri-wall-control-label">Quadrants:</span>
          {['refine','reinvent','resist','respond','central'].map(q => (
            <span
              key={q}
              className={'ri-wall-chip ' + (showQuadrant[q] ? 'ri-wall-chip--on' : '')}
              onClick={() => setShowQuadrant(prev => ({ ...prev, [q]: !prev[q] }))}
            >{QUADRANTS[q].label}</span>
          ))}
        </div>
      </div>

      {error && <div className="ri-error" style={{ marginBottom: '1rem' }}>{error}</div>}

      <div className="ri-wall-grid">
        {renderBucket('refine')}
        {renderBucket('reinvent')}
        {renderBucket('resist')}
        {renderBucket('respond')}
      </div>

      <div className="ri-wall-side">
        {renderBucket('central')}
        {renderBucket('outside')}
      </div>

      <div className="ri-footer">ChangeBefore · tools.changebefore.com</div>
    </div>
  );
}

// ============================================================================
// ROOT
// ============================================================================

function Root() {
  const params = useMemo(() => {
    if (typeof window === 'undefined') return new URLSearchParams();
    return new URLSearchParams(window.location.search);
  }, []);
  const view = (params.get('view') || '').toLowerCase();
  const code = (params.get('code') || '').toUpperCase();
  const subject = params.get('subject') || '';

  if (view === 'wall') return <WallApp initialCode={code} />;
  return <ParticipantApp initialCode={code} initialSubject={subject} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);

</script>
</body>
</html>
