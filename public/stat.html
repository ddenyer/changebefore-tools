                          <div style={{fontSize:'.78rem',color:'#888',whiteSpace:'nowrap'}}>{item.meanL.toFixed(1)} | {item.meanR.toFixed(1)}</div>
                          <div className="var-bar-wrap"><div className="var-bar-bg"><div className="var-bar-fill" style={{width:`${(1-normVar(item.variance))*100}%`,background:varBarColor(item.variance)}}/></div></div>
                          <div><span className={`cons-badge ${varClass(item.variance)}`}>{varLabel(item.variance)}</span></div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="rpt-section">
                    <div className="rpt-heading">Where the Group Disagrees Most</div>
                    <p className="rpt-body" style={{marginBottom:'.75rem'}}>These questions showed the widest spread of responses — indicating that different people in {th} are experiencing or enacting the strategy differently. These are the most important questions to discuss as a group.</p>
                    {(()=>{
                      const hasRoles=(groupRespondents||[]).some(r=>r.role&&r.role!=='None of the above');
                      if(!hasRoles)return null;
                      const seniorRoles=['Executive / Board','Senior Leader'];
                      const juniorRoles=['Manager','Team Leader','Frontline / Operational'];
                      const seniors=(groupRespondents||[]).filter(r=>seniorRoles.includes(r.role));
                      const juniors=(groupRespondents||[]).filter(r=>juniorRoles.includes(r.role));
                      if(seniors.length<1||juniors.length<1)return null;
                      const highVar=topDisagreement.filter(item=>item.variance>=2.5);
                      if(highVar.length===0)return null;
                      const splits=highVar.map(item=>{
                        const sk=item.sectionKey;const qi=item.qi;
                        const seniorMean=seniors.reduce((s,r)=>(s+(parseInt(r[sk][qi]?.r)||0)),0)/seniors.length;
                        const juniorMean=juniors.reduce((s,r)=>(s+(parseInt(r[sk][qi]?.r)||0)),0)/juniors.length;
                        return{q:item.q.q,seniorMean,juniorMean,diff:Math.abs(seniorMean-juniorMean)};
                      }).filter(x=>x.diff>=2).sort((a,b)=>b.diff-a.diff);
                      if(splits.length===0)return null;
                      const top=splits[0];
                      const seniorDir=top.seniorMean>top.juniorMean?'more progressive':'more defensive';
                      return(
                        <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:'5px',padding:'.65rem .9rem',marginBottom:'.75rem',fontSize:'.78rem',color:'#92400e',fontFamily:"'DM Sans',sans-serif"}}>
                          <strong>Seniority split detected:</strong> On <em>"{top.q}"</em>, senior leaders (avg {top.seniorMean.toFixed(1)}) and operational staff (avg {top.juniorMean.toFixed(1)}) scored this question differently by {top.diff.toFixed(1)} points. Senior leaders lean {seniorDir}. This may indicate that the strategy being set at the top is not the one being experienced on the ground.
                        </div>
                      );
                    })()}
                    <div className="var-table">
                      <div className="var-row hdr"><div>Question</div><div>Mean score (A|B)</div><div>Disagreement</div><div>Status</div></div>
                      {topDisagreement.map((item,i)=>(
                        <div key={i} className="var-row">
                          <div style={{fontSize:'.77rem',lineHeight:1.45,color:'#1a1a1a'}}>{item.q.q}</div>
                          <div style={{fontSize:'.78rem',color:'#888',whiteSpace:'nowrap'}}>{item.meanL.toFixed(1)} | {item.meanR.toFixed(1)}</div>
                          <div className="var-bar-wrap"><div className="var-bar-bg"><div className="var-bar-fill" style={{width:`${normVar(item.variance)*100}%`,background:varBarColor(item.variance)}}/></div></div>
                          <div><span className={`cons-badge ${varClass(item.variance)}`}>{varLabel(item.variance)}</span></div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="rpt-section">
                    <div className="rpt-heading">Organisational Suggestions for {th}</div>
                    <p className="rpt-body" style={{marginBottom:'1rem'}}>These suggestions are based on the group profile, the areas of greatest disagreement, and the context you have provided. They are intended as starting points for organisational dialogue — not prescriptions.</p>
                    {groupSuggestions.map((s,i)=>(
                      <div key={i} className="grp-sug-item">
                        <div className="grp-sug-num">{i+1}</div>
                        <div className="grp-sug-txt" dangerouslySetInnerHTML={{__html:s}}/>
                      </div>
                    ))}
                  </div>

                  <div className="btn-row" style={{marginTop:'2rem'}}>
                    <button className="btn-p" onClick={printReport}>⬇ Save / Print Full Report</button>
                    <button className="btn-s" onClick={restart}>Start Again</button>
                    <button className="btn-s" onClick={()=>setRptTab(0)}>← Individual Report</button>
                  </div>
                </div>)}
                </div>
              )}

              {/* TAB 4 — SAVE & NEXT STEPS */}
              {rptTab===4&&(
                <div>
                  <div className="rpt-section">
                    <div className="rpt-heading">Save or Print Your Report</div>
                    <p className="rpt-body">To save your report as a PDF, use your browser's print function (<strong>Ctrl+P</strong> on Windows, <strong>Cmd+P</strong> on Mac) and select <strong>Save as PDF</strong>. Print all tabs before saving for the complete report.</p>
                    <div className="btn-row" style={{marginTop:'1rem'}}>
                      <button className="btn-p" onClick={printReport}>⬇ Save / Print Full Report</button>
                    </div>
                  </div>

                  <div className="rpt-section" style={{borderTop:'1px solid #d8d3cb',paddingTop:'1.75rem',marginTop:'1.75rem'}}>
                    <div className="rpt-heading">Take It Further: Run STAT with Your Team</div>
                    <p className="rpt-body">Your individual report is a starting point. It reflects a single perspective on how your organisation operates — and what it could become. The real diagnostic power emerges when you compare results across your team or organisation.</p>
                    <p className="rpt-body" style={{marginTop:'.75rem'}}>Even people working side by side often see the current position very differently. And leaders frequently see the organisation in ways that differ sharply from the experience of those they lead. Understanding those differences is not a problem to manage — it is the insight you need to act.</p>

                    <div style={{marginTop:'1.25rem'}}>
                      <div className="rpt-heading" style={{fontSize:'.85rem',marginBottom:'.6rem'}}>Run STAT with your leadership team to:</div>
                      <ul style={{paddingLeft:'1.25rem',lineHeight:1.8,fontSize:'.875rem',color:'#555',fontFamily:"'DM Sans',sans-serif"}}>
                        <li>Find out whether your ExCom or SLT shares a common strategic direction — or only assumes it does</li>
                        <li>Surface hidden tensions between what leaders say is the priority and what they actually drive</li>
                        <li>Identify where different parts of leadership are pulling in different directions without realising it</li>
                        <li>Test whether the strategy you intend is the strategy being experienced</li>
                        <li>Create the conditions for an honest, evidence-based conversation about where to go next</li>
                      </ul>
                    </div>

                    <div style={{marginTop:'1.25rem'}}>
                      <div className="rpt-heading" style={{fontSize:'.85rem',marginBottom:'.6rem'}}>Run STAT across your organisation to:</div>
                      <ul style={{paddingLeft:'1.25rem',lineHeight:1.8,fontSize:'.875rem',color:'#555',fontFamily:"'DM Sans',sans-serif"}}>
                        <li>Compare how leaders see the organisation with how it is experienced on the ground</li>
                        <li>Identify where strategic intent is not translating into operational reality</li>
                        <li>Reveal differences in how people across functions and business units see the organisation's current position and direction</li>
                        <li>Understand whether different parts of the organisation have fundamentally different starting points — as organisations do after a merger or acquisition</li>
                        <li>Generate a baseline you can use to track whether change is actually happening</li>
                      </ul>
                    </div>

                    <div style={{marginTop:'1.25rem'}}>
                      <div className="rpt-heading" style={{fontSize:'.85rem',marginBottom:'.5rem'}}>What the group report shows:</div>
                      <p className="rpt-body">The group profile aggregates all responses to reveal the collective strategic picture — where the group agrees most, where it disagrees most, and what organisational action would do most to close the gap between where you are and where you want to be.</p>
                    </div>

                    <div style={{marginTop:'1.25rem'}}>
                      <div className="rpt-heading" style={{fontSize:'.85rem',marginBottom:'.5rem'}}>How organisations have used it:</div>
                      <p className="rpt-body">Teams use STAT to resolve longstanding tensions that were visible but never named — surfacing differences in how people across functions and business units see the organisation's current position and direction. Leadership groups use it to move from assumption to evidence. One organisation used it immediately after an acquisition to map the strategic perspectives of both legacy teams — and understand what integration would actually require.</p>
                    </div>

                    <div style={{marginTop:'1.5rem',padding:'1.25rem',background:'#fff8f5',border:'1px solid #f5c8b0',borderRadius:'6px'}}>
                      <div style={{fontSize:'.85rem',fontWeight:700,color:'#1a1a1a',marginBottom:'.5rem',fontFamily:"'DM Sans',sans-serif"}}>Ready to run it with your team?</div>
                      <p style={{fontSize:'.85rem',color:'#555',lineHeight:1.7,fontFamily:"'DM Sans',sans-serif"}}>Contact us at <a href="mailto:contact@changebefore.com" style={{color:'#e07030'}}>contact@changebefore.com</a> or visit <a href="https://changebefore.com/contact/" target="_blank" rel="noopener noreferrer" style={{color:'#e07030'}}>changebefore.com/contact</a> to arrange a conversation.</p>
                    </div>
                  </div>

                  <div className="btn-row" style={{marginTop:'1.75rem'}}>
                    <button className="btn-s" onClick={()=>setRptTab(2)}>← Suggestions & Actions</button>
                    <button className="btn-s" onClick={restart}>Start Again</button>
                  </div>
                </div>
              )}

              {/* TAB 5 — FACILITATOR (admin only) */}
              {rptTab===5&&isAdmin&&facilInsights&&(
                <div>
                  <div className="mock-badge" style={{background:'#fff8ed',color:'#92400e'}}>🔒 Facilitator view — only visible when logged in as Admin</div>
                  <div className="rpt-section">
                    <div className="rpt-heading">Overview — What to Raise with the Group</div>
                    {facilInsights.surprises.length>0&&(
                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{fontSize:'.7rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#e07030',marginBottom:'.6rem',fontFamily:"'DM Sans',sans-serif"}}>Potentially Surprising Findings</div>
                      {facilInsights.surprises.map((s,i)=>(
                        <div key={i} style={{display:'flex',gap:'.75rem',marginBottom:'.75rem',padding:'.75rem',background:'#fff8f5',border:'1px solid #f5c8b0',borderRadius:'6px'}}>
                          <div style={{fontWeight:800,color:'#e07030',fontSize:'1rem',flexShrink:0}}>{i+1}</div>
                          <p className="rpt-body" style={{margin:0}}>{s}</p>
                        </div>
                      ))}
                    </div>
                    )}
                    {facilInsights.extremes.length>0&&(
                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{fontSize:'.7rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#e07030',marginBottom:'.6rem',fontFamily:"'DM Sans',sans-serif"}}>Respondents with Extreme Scores</div>
                      {facilInsights.extremes.map((e,i)=>(
                        <div key={i} style={{display:'flex',gap:'.75rem',alignItems:'center',marginBottom:'.5rem',padding:'.6rem .75rem',background:'#fff8f5',border:'1px solid #f5c8b0',borderRadius:'6px'}}>
                          <div style={{fontWeight:700,color:'#e07030',minWidth:'80px',fontSize:'.78rem',fontFamily:"'DM Sans',sans-serif"}}>{e.name}</div>
                          <div style={{fontSize:'.78rem',color:'#374151',fontFamily:"'DM Sans',sans-serif"}}>Scored <strong>{e.score}</strong> on <strong>{e.dim}</strong> — {e.direction} the group mean ({e.mean})</div>
                        </div>
                      ))}
                    </div>
                    )}
                    {facilInsights.topDivergers.length>0&&(
                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{fontSize:'.7rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#059669',marginBottom:'.6rem',fontFamily:"'DM Sans',sans-serif"}}>Respondents Who Diverge Most from the Group</div>
                      {facilInsights.topDivergers.map((d,i)=>(
                        <div key={i} style={{display:'flex',gap:'.75rem',alignItems:'center',marginBottom:'.5rem',padding:'.6rem .75rem',background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:'6px'}}>
                          <div style={{fontWeight:700,color:'#065f46',minWidth:'80px',fontSize:'.78rem',fontFamily:"'DM Sans',sans-serif"}}>{d.name}</div>
                          <div style={{fontSize:'.78rem',color:'#374151',fontFamily:"'DM Sans',sans-serif"}}>Profile distance from group mean: <strong>{d.dist} points</strong></div>
                        </div>
                      ))}
                    </div>
                    )}
                    {facilInsights.contentions.length>0&&(
                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{fontSize:'.7rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#7c3aed',marginBottom:'.6rem',fontFamily:"'DM Sans',sans-serif"}}>Points of Potential Contention</div>
                      {facilInsights.contentions.map((c,i)=>(
                        <div key={i} style={{display:'flex',gap:'.75rem',marginBottom:'.75rem',padding:'.75rem',background:'#f5f3ff',border:'1px solid #ddd6fe',borderRadius:'6px'}}>
                          <div style={{fontWeight:800,color:'#7c3aed',fontSize:'1rem',flexShrink:0}}>{i+1}</div>
                          <p className="rpt-body" style={{margin:0}}>{c}</p>
                        </div>
                      ))}
                    </div>
                    )}
                  </div>

                  <div className="rpt-section">
                    <div className="rpt-heading">Key Questions — Based on This Group's Data</div>
                    {facilInsights.keyQs.map((q,i)=>(
                      <div key={i} style={{display:'flex',gap:'.75rem',marginBottom:'.85rem',padding:'.75rem 1rem',background:'#ebe7e0',border:'1px solid #d8d3cb',borderLeft:'3px solid #1a1a1a',borderRadius:'0 6px 6px 0'}}>
                        <div style={{fontWeight:800,color:'#1a1a1a',flexShrink:0,fontFamily:"'DM Sans',sans-serif"}}>Q{i+1}</div>
                        <p className="rpt-body" style={{margin:0}}>{q}</p>
                      </div>
                    ))}
                  </div>

                  <div className="rpt-section">
                    <div className="rpt-heading">General Discussion Questions</div>
                    {[
                      'Why does our STAT profile look like this?',
                      'Has it always looked like this, or has it changed over time — and if so, was that change purposeful or drift?',
                      'What are the genuine strengths of this profile? What does it allow us to do well?',
                      'What are the risks and blind spots? What does this profile make harder for us?',
                      'Is our overall profile fit for purpose — do we have the right balance for what we are trying to achieve?',
                      'Where do we need to be? Taking into account our strategy, our priorities, and the outcomes we need to deliver — what should our profile look like in 12–24 months?',
                      'What would have to change — in our structures, leadership, incentives and culture — to actually get there?'
                    ].map((q,i)=>(
                      <div key={i} style={{display:'flex',gap:'.75rem',marginBottom:'.75rem',padding:'.7rem 1rem',background:'#ebe7e0',border:'1px solid #d8d3cb',borderLeft:'3px solid #e07030',borderRadius:'0 6px 6px 0'}}>
                        <div style={{fontWeight:800,color:'#e07030',flexShrink:0,fontFamily:"'DM Sans',sans-serif"}}>{i+1}</div>
                        <p className="rpt-body" style={{margin:0}}>{q}</p>
                      </div>
                    ))}
                  </div>

                  <div className="btn-row" style={{marginTop:'2rem'}}>
                    <button className="btn-p" onClick={printReport}>Print / Save as PDF</button>
                    <button className="btn-s" onClick={()=>setRptTab(3)}>← Group Report</button>
                  </div>
                </div>
              )}
            </div>
          )}
              <div className="print-copyright">© ChangeBefore Ltd. All rights reserved. This report is confidential and intended solely for the named recipient. STAT is a proprietary diagnostic tool. Unauthorised reproduction or distribution is prohibited.</div>

        </div>
      </div>

    </div>
  );
}


class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null,info:null};}
  componentDidCatch(error,info){this.setState({error:error.message,info:info.componentStack});}
  render(){
    if(this.state.error){
      return React.createElement('div',{style:{padding:'2rem',fontFamily:"'DM Sans',sans-serif",background:'#fff8f5',border:'2px solid #e07030',margin:'2rem',borderRadius:'8px'}},
        React.createElement('h3',{style:{color:'#e07030',marginBottom:'1rem'}},'Something went wrong'),
        React.createElement('pre',{style:{fontSize:'.75rem',color:'#555',whiteSpace:'pre-wrap',marginBottom:'1rem'}},this.state.error),
        React.createElement('pre',{style:{fontSize:'.65rem',color:'#888',whiteSpace:'pre-wrap'}},this.state.info),
        React.createElement('button',{onClick:()=>this.setState({error:null,info:null}),style:{marginTop:'1rem',padding:'.5rem 1rem',background:'#e07030',color:'#fff',border:'none',borderRadius:'4px',cursor:'pointer'}},'Try Again')
      );
    }
    return this.props.children;
  }
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ErrorBoundary,null,React.createElement(App,null)));
</script>
</body>
</html>
