        summary:`${capTh}'s profile shows a Neutral strategy — an almost uniform emphasis on all four core strategies.${ctxNote} This is often unintended and is rarely achieved by design. It typically reflects an organisation trying to be all things to all people, or one in which different groups are pursuing different strategies independently.`,
        purpose:`${capTh} simultaneously pursues process optimisation and continuous improvement while also finding new solutions and innovative technologies. The organisation is equally focused on prevention and production. This can be achieved through people or by means of process and structural separation.`,
        people:`Your scores suggest you find yourself navigating between conflicting demands, making your own judgements about where to focus. You perceive the tensions in ${th} as genuine 'either/or' choices — but your scores also suggest that exploring a 'both/and' mindset may unlock more strategic options.`,
        process:`A neutral strategy can be achieved structurally by separating the four core strategies across different groups — for example, preventative control managed by a risk department, adaptive innovation through an R&D or transformation function, performance optimisation through operational excellence programmes, and mindful action through specific problem-solving groups.`,
        product:`${capTh} delivers performance optimisation to exploit knowledge, advantage and insights — while simultaneously recognising how quickly things change and engaging in adaptive innovation and experimentation.`,
        atBest:`At its best, a neutral strategy allows ${th} to respond to a wide range of challenges by drawing on multiple strategic modes simultaneously.`,
        blind:`Is it possible to be equally great at all four Organisational Resilience strategies? The short answer is probably not. Individuals, groups and parts of ${th} will likely gravitate toward their preferred way of working. A neutral strategy is hard to do well since the purpose, people, process and product that lead to excellence in any one discipline are often contradictory and incompatible.`,
        areas:`Coordination is critical. This can only be made possible by effective, informal communication between people and groups who have different mindsets, approaches and are doing very different but interdependent work. Investment in training and education is critical. Consider whether an emphasis on any one of the four core strategies would be preferable to a neutral position.`,
      },
    };
    return texts[strat]||texts.neutral;
  }

  const SD=getStrategyText(asIsStrat);

  function printReport(){window.print();}

  const participantsCompleted = participants.filter(p=>p.completed).length;
  const allParticipantsDone = participants.length>0 && participantsCompleted===participants.length;
  const facilInsights = isAdmin ? generateFacilitatorInsights(groupRespondents, groupMean, groupTobe, allVariance, thing||'the organisation') : null;

  return(
    <div className="shell" ref={topRef}>
      <Header/>
      <Progress step={step}/>
      <div className="main">
        <div className="content fade" key={step}>

          {/* STEP 0: LANDING */}
          {step===0&&(
            <div>
              {PREVIEW_MODE&&<div className="mock-badge">⚡ Preview Mode</div>}
              <div className="land-hero">
                <div className="land-tag">daviddenyer.com</div>
                <h1 className="land-title">Strategic Tensions Assessment Tool</h1>
                <p className="land-desc">You'll complete a survey, see your profile plotted on a chart, set your desired future direction, and receive a personalised interpretation with specific suggestions for change.</p>
                <div className="land-time">About 20 minutes</div>
              </div>
              <div style={{marginBottom:'1.5rem'}}>
                <label className="field-lbl">Your name</label>
                <input className="inp" placeholder="e.g. Alex Johnson" value={respondentName} onChange={e=>setRespondentName(e.target.value)}/>
                {isAdmin&&sessionCode.trim()&&<div className="field-sub" style={{color:'#e05528',fontWeight:600,marginTop:'.35rem'}}>⚡ Facilitator mode — you will be taken straight to the group report</div>}
              </div>
              <div style={{marginBottom:'1.5rem'}}>
                <label className="field-lbl">Joining a group session? Enter your session code</label>
                <div className="field-sub">Leave blank if not applicable.</div>
                <input className="inp" placeholder="e.g. SELL-2025" value={sessionCode} onChange={e=>setSessionCode(e.target.value)} style={{maxWidth:'260px'}}/>
              </div>
              <div className="disc" style={{lineHeight:1.6}}>
                <strong>Privacy:</strong> Your responses are used only to generate your report. Names and session codes are stored securely to enable group reports and return-visit comparison. No data is shared with third parties. This tool supports structured thinking and does not constitute professional advice. For questions about your data, contact <a href="mailto:d.denyer@cranfield.ac.uk" style={{color:'inherit'}}>d.denyer@cranfield.ac.uk</a>.
              </div>
              <div className="btn-row">
                  <button className="btn-p" onClick={()=>{
                    if(isAdmin&&sessionCode.trim()){
                      // Admin: jump straight to group report tab
                      setShowReport(true);
                      setRptTab(3);
                      go(7);
                    } else {
                      // Normal user: register as participant if session code provided
                      if(sessionCode.trim()){
                        setParticipants(p=>[...p,{id:p.length+1,completed:false,name:respondentName||'You',isYou:true}]);
                      }
                      go(1);
                    }
                  }}>
                    {isAdmin&&sessionCode.trim()?'View Group Report →':'Begin →'}
                  </button>
                </div>
            </div>
          )}

          {/* STEP 1 */}
          {step===1&&(
            <div>
              <BackBtn onClick={()=>go(0)}/>
              <div className="sec-tag">Section 1 — What Are We Looking At?</div>
              <h2 className="pg-title">What is the thing you want to work on?</h2>
              <p className="pg-sub">This could be a team, a department, a division, a whole organisation, or any system you want to explore. Be as specific as possible — the more clearly you define it, the more useful your results will be.</p>
              <label className="field-lbl">Name the thing</label>
              <div className="field-sub">e.g. "The Nuclear Operations Division", "Our R&D team", "Sellafield Ltd", "The customer service function"</div>
              <input className="inp" placeholder="What are we looking at?" value={thing} onChange={e=>setThing(e.target.value)} style={{marginBottom:'1.25rem'}}/>
              <label className="field-lbl">Brief description <span style={{color:'#bbb',fontWeight:400}}>(optional)</span></label>
              <div className="field-sub">What does it do? What is its purpose? Who does it serve?</div>
              <textarea className="inp inp-ta" placeholder="A short description of what this thing is and does..." value={thingDesc} onChange={e=>setThingDesc(e.target.value)}/>
              <div className="btn-row">
                <button className="btn-p" disabled={!thing.trim()} onClick={()=>go(2)}>Continue →</button>
                <button className="btn-s" onClick={()=>go(0)}>← Back</button>
              </div>
            </div>
          )}

          {/* STEP 2: CONTEXT */}
          {step===2&&(
            <div>
              <BackBtn onClick={()=>go(1)}/>
              <div className="sec-tag">Section 1 — What Are We Looking At?</div>
              <h2 className="pg-title" style={{fontSize:'1.45rem',fontWeight:700,marginBottom:'.5rem'}}>Provide information</h2>
              <p className="pg-sub">Please share any information about the thing you want to work on. You can add notes, a website link, or upload a document. These are optional, but they will help improve the results.</p>

              <label className="field-lbl" style={{fontWeight:400,color:'#555',marginBottom:'.5rem'}}>What is it? Don't worry about precision — just tell me about it.</label>
              <textarea className="inp inp-ta" placeholder="Describe it in your own words." value={contextText} onChange={e=>setContextText(e.target.value)} style={{minHeight:'180px',marginBottom:'.25rem'}}/>
              <div style={{textAlign:'right',fontSize:'.75rem',color:'#aaa',marginBottom:'1.25rem'}}>{contextWordCount} / 150 words</div>

              <div className="inf-box" style={{marginBottom:'1.5rem'}}>
                If you completed the Define Your System tool for <strong>{th}</strong> — copy and paste the text it produced in the box above, or upload the PDF below.
              </div>

              <label className="field-lbl" style={{fontWeight:400,color:'#555',marginBottom:'.5rem'}}>Link to a relevant webpage (optional)</label>
              <div style={{display:'flex',gap:'.5rem',marginBottom:'1.25rem'}}>
                <input className="inp" placeholder="https://..." value={website} onChange={e=>setWebsite(e.target.value)} style={{flex:1,marginBottom:0}}/>
                <button className="btn-s" style={{flexShrink:0,background:'#888',color:'#fff',border:'none',fontWeight:600,padding:'.72rem 1.1rem',minWidth:'72px'}} onClick={()=>{}}>Fetch</button>
              </div>

              <label className="field-lbl" style={{fontWeight:400,color:'#555',marginBottom:'.5rem'}}>Upload a document (optional — .pdf, .docx or .txt)</label>
              <input type="file" accept=".pdf,.doc,.docx,.txt" ref={fileInputRef}
                onChange={e=>{const f=e.target.files[0];if(f)setDocFileName(f.name);}}/>
              {docFileName&&(
                <div style={{marginTop:'.5rem',fontSize:'.8rem',color:'#555'}}>
                  📄 {docFileName} <span style={{color:'#e05528',cursor:'pointer',marginLeft:'.5rem'}} onClick={()=>{setDocFileName('');if(fileInputRef.current)fileInputRef.current.value='';}}>Remove</span>
                </div>
              )}

              <div style={{marginTop:'1.5rem'}}>
                <label className="field-lbl">Your role <span style={{color:'#bbb',fontWeight:400}}>(optional)</span></label>
                <div className="field-sub">Helps the group report show whether different levels of the organisation see things differently.</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:'.5rem',marginBottom:'.75rem'}}>
                  {['Frontline / Operational','Team Leader','Manager','Senior Leader','Executive / Board','None of the above'].map(r=>(
                    <button key={r} onClick={()=>setRole(r)}
                      style={{padding:'.45rem .85rem',borderRadius:'20px',border:`1.5px solid ${role===r?'#e05528':'#ddd'}`,background:role===r?'#fff3f0':'#fff',color:role===r?'#e05528':'#555',fontSize:'.78rem',fontWeight:role===r?700:400,cursor:'pointer',transition:'all .15s'}}>
                      {r}
                    </button>
                  ))}
                </div>
                {role==='None of the above'&&(
                  <input className="inp" placeholder="Describe your role..." value={roleCustom} onChange={e=>setRoleCustom(e.target.value)} style={{maxWidth:'340px'}}/>
                )}
              </div>

              <div className="btn-row">
                <button className="btn-p" onClick={()=>go(3)}>Next →</button>
                <button className="btn-s" onClick={()=>go(1)}>← Back</button>
              </div>
            </div>
          )}

          {/* STEP 3: SURVEY 1 */}
          {step===3&&(
            <div>
              <BackBtn onClick={()=>go(2)}/>
              <div className="sec-tag">Survey — Part 1 of 2</div>
              <h2 className="pg-title">How does <em style={{fontStyle:'normal',color:'#e05528'}}>{th}</em> operate today?</h2>
              <p className="pg-sub">For each question, allocate up to 10 points between the two options to show how strongly each reflects the current reality in {th}. Answer based on how things <strong>actually are</strong> — not how you would like them to be.</p>
              <div style={{background:'#f5f5f5',border:'1px solid #e0e0e0',borderRadius:'6px',padding:'1rem 1.25rem',marginBottom:'1.25rem'}}>
                <div style={{fontSize:'.7rem',fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase',color:'#888',marginBottom:'.6rem'}}>Example — how the scoring works</div>
                <div style={{fontSize:'.8rem',fontWeight:700,color:'#1a1a1a',marginBottom:'.75rem'}}>How does the organisation primarily make decisions?</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'.65rem',alignItems:'center'}}>
                  <div style={{background:'#fff3f0',border:'1px solid #e05528',borderRadius:'3px',padding:'.5rem .65rem',fontSize:'.75rem',lineHeight:1.45}}>
                    <span style={{fontSize:'.58rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#e05528',display:'block',marginBottom:'.2rem'}}>Option A</span>
                    Following established procedures, rules and protocols.
                  </div>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'.3rem',minWidth:'110px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                      <div style={{width:28,height:28,borderRadius:'50%',border:'1.5px solid #ccc',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem',color:'#aaa'}}>−</div>
                      <div style={{width:32,textAlign:'center',fontWeight:700,color:'#e05528',fontSize:'1rem'}}>7</div>
                      <div style={{width:28,height:28,borderRadius:'50%',border:'1.5px solid #ccc',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem',color:'#aaa'}}>+</div>
                      <span style={{color:'#ccc',fontWeight:700}}>|</span>
                      <div style={{width:28,height:28,borderRadius:'50%',border:'1.5px solid #ccc',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem',color:'#aaa'}}>−</div>
                      <div style={{width:32,textAlign:'center',fontWeight:700,fontSize:'1rem'}}>3</div>
                      <div style={{width:28,height:28,borderRadius:'50%',border:'1.5px solid #ccc',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem',color:'#aaa'}}>+</div>
                    </div>
                    <div style={{fontSize:'.7rem',color:'#22c55e',fontWeight:600}}>✓ 10 pts</div>
                  </div>
                  <div style={{background:'#f9f9f9',border:'1px solid #eee',borderRadius:'3px',padding:'.5rem .65rem',fontSize:'.75rem',lineHeight:1.45,color:'#666'}}>
                    <span style={{fontSize:'.58rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#bbb',display:'block',marginBottom:'.2rem'}}>Option B</span>
                    Using individual judgement and expertise to adapt to the situation.
                  </div>
                </div>
                <div style={{fontSize:'.75rem',color:'#555',marginTop:'.75rem',lineHeight:1.5}}>
                  In this example the person scored <strong>7–3</strong>, meaning they strongly believe their organisation follows established procedures. A score of <strong>5–5</strong> would mean equal weight. All 10 points must be allocated — you can give all 10 to one side if that reflects reality.
                </div>
              </div>
              <QuestionSection secData={S1} answers={s1ans} onChange={setS1} activeIdx={s1active} setActiveIdx={setS1Active}/>
              {s1over&&<div className="warn-box">One or more questions exceed 10 points total. Please correct before continuing.</div>}
              {!s1done&&!s1over&&<div style={{fontSize:'.8rem',color:'#aaa',marginTop:'.75rem'}}>Complete all 12 questions to continue. Questions unlock in sequence as you answer each one.</div>}
              <div className="btn-row">
                <button className="btn-p" disabled={!s1done} onClick={()=>go(4)}>Continue to Part 2 →</button>
                <button className="btn-s" onClick={()=>go(2)}>← Back</button>
              </div>
            </div>
          )}

          {/* STEP 4: SURVEY 2 */}
          {step===4&&(
            <div>
              <BackBtn onClick={()=>go(3)}/>
              <div className="sec-tag">Survey — Part 2 of 2</div>
              <h2 className="pg-title">How does <em style={{fontStyle:'normal',color:'#e05528'}}>{th}</em> operate today?</h2>
              <p className="pg-sub">Continue allocating points. Same rules apply — up to 10 points per pair, no half-points, and you may allocate less than 10 if neither statement fully fits.</p>
              <QuestionSection secData={S2} answers={s2ans} onChange={setS2} activeIdx={s2active} setActiveIdx={setS2Active}/>
              {s2over&&<div className="warn-box">One or more questions exceed 10 points total. Please correct before continuing.</div>}
              {!s2done&&!s2over&&<div style={{fontSize:'.8rem',color:'#aaa',marginTop:'.75rem'}}>Complete all 12 questions to continue.</div>}
              <div className="btn-row">
                <button className="btn-p" disabled={!s2done} onClick={()=>go(5)}>See My Profile →</button>
                <button className="btn-s" onClick={()=>go(3)}>← Back</button>
              </div>
            </div>
          )}

          {/* STEP 5: PROFILE */}
          {step===5&&(
            <div>
              <BackBtn onClick={()=>go(4)}/>
              <div className="sec-tag">Your Current Profile</div>
              <h2 className="pg-title">How <em style={{fontStyle:'normal',color:'#e05528'}}>{th}</em> operates today</h2>
              <p className="pg-sub">Your scores across the four strategic dimensions, plotted on the resilience profile chart.</p>
              <div className="chart-box" style={{maxWidth:'320px',margin:'0 auto 1.5rem'}}>
                <ExpandableDiamond title={`As-Is Profile — ${th}`}>
                  <div className="chart-lbl">As-Is Profile — {th}</div>
                  <DiamondChart p={prog} d={def} c={con} f={flex} color="#e05528"/>
                </ExpandableDiamond>
              </div>
              <div className="score-grid">
                {[{lbl:'Progressive',val:prog,dim:'Mindset'},{lbl:'Defensive',val:def,dim:'Mindset'},{lbl:'Flexible',val:flex,dim:'Approach'},{lbl:'Consistent',val:con,dim:'Approach'}].map(sc=>(
                  <div key={sc.lbl} className="score-card">
                    <div className="score-dim">{sc.dim}</div>
                    <div className="score-val">{sc.val}</div>
                    <div className="score-lbl">{sc.lbl}</div>
                    <div className="score-bar"><div className="score-fill" style={{width:`${(sc.val/120)*100}%`}}/></div>
                  </div>
                ))}
              </div>
              <div className="strat-badge"><div className="strat-dot"/><div><strong>Dominant strategy: {SLABELS[asIsStrat]}</strong><br/><span style={{fontSize:'.8rem',fontWeight:400,color:'#666'}}>{SDESC[asIsStrat]}</span></div></div>
              <div className="btn-row">
                <button className="btn-p" onClick={()=>go(6)}>Set Future Vision →</button>
                <button className="btn-s" onClick={()=>go(4)}>← Back</button>
              </div>
            </div>
          )}

          {/* STEP 6: TO-BE */}
          {step===6&&(
            <div>
              <BackBtn onClick={()=>go(5)}/>
              <div className="sec-tag">Future Vision</div>
              <h2 className="pg-title">Where do you want <em style={{fontStyle:'normal',color:'#e05528'}}>{th}</em> to be?</h2>
              <p className="pg-sub">Drag the sliders to set your desired future profile. The sliders start from your current as-is scores. Moving one slider will automatically adjust its paired dimension so the combined total stays within 120.</p>
              <div className="slider-section">
                <div className="sec-tag" style={{marginBottom:'.85rem'}}>Mindset — Progressive & Defensive</div>
                <Slider label="Progressive" value={tobe.p} onChange={setTobeP} max={120} asIs={prog}/>
                <Slider label="Defensive" value={tobe.d} onChange={setTobeD} max={120} asIs={def}/>
                <div style={{fontSize:'.72rem',color:'#aaa',marginTop:'.25rem'}}>Combined: {tobe.p+tobe.d} / 120</div>
              </div>
              <div className="slider-section">
                <div className="sec-tag" style={{marginBottom:'.85rem'}}>Approach — Consistent & Flexible</div>
                <Slider label="Consistent" value={tobe.c} onChange={setTobeC} max={120} asIs={con}/>
                <Slider label="Flexible" value={tobe.f} onChange={setTobeF} max={120} asIs={flex}/>
                <div style={{fontSize:'.72rem',color:'#aaa',marginTop:'.25rem'}}>Combined: {tobe.c+tobe.f} / 120</div>
              </div>
              <div className="chart-box" style={{maxWidth:'320px',margin:'1.25rem auto'}}>
                <ExpandableDiamond title={`Desired Profile — ${th}`}><div className="chart-lbl">Desired Profile — {th}</div>
                <DiamondChart p={tobe.p} d={tobe.d} c={tobe.c} f={tobe.f} color="#1a1a1a"/></ExpandableDiamond>
              </div>
              <div className="strat-badge"><div className="strat-dot" style={{background:'#1a1a1a'}}/><div><strong>Desired strategy: {SLABELS[tobeStrat]}</strong><br/><span style={{fontSize:'.8rem',fontWeight:400,color:'#666'}}>{SDESC[tobeStrat]}</span></div></div>
              <div className="btn-row">
                {loading?(
                  <div className="think"><div className="dots"><div className="dot"/><div className="dot"/><div className="dot"/></div><span className="think-txt">Generating your personalised report…</span></div>
                ):apiError?(
                  <div>
                    <div style={{background:'#fff3f0',border:'1px solid #e05528',borderRadius:'5px',padding:'.65rem .9rem',marginBottom:'.75rem',fontSize:'.82rem',color:'#c0392b'}}>
                      ⚠ Report generation failed — please check your connection and try again.
                    </div>
                    <button className="btn-p" onClick={()=>{setApiError(false);generate();}}>Try Again →</button>
                  </div>
                ):(
                  <button className="btn-p" onClick={generate}>Generate My Report →</button>
                )}
                {showReport&&<button className="btn-s" onClick={()=>{go(7);setRptTab(2);}}>⚡ Live Suggestions</button>}
                <button className="btn-s" onClick={()=>go(5)}>← Back</button>
              </div>
            </div>
          )}

          {/* STEP 7: REPORT */}
          {step===7&&(
            <div>
              {PREVIEW_MODE&&<div className="mock-badge">⚡ Preview — mock report · live tool uses Anthropic API</div>}
              <div className="sec-tag">Organisational Resilience Report</div>
              <h2 className="pg-title">{th}</h2>
              <p className="pg-sub">Current: <strong>{SLABELS[asIsStrat]}</strong> · Desired: <strong>{SLABELS[tobeStrat]}</strong></p>
              <div className="rpt-tabs">
                {['Profile & Charts','Detailed Analysis','Suggestions & Actions','Group Report'].map((t,i)=>(
                  <div key={i} className={`rpt-tab${rptTab===i?' active':''}`} onClick={()=>setRptTab(i)}>
                    {t}{i===3&&groupRespondents&&<span style={{background:'#e05528',color:'#fff',borderRadius:'10px',padding:'1px 6px',fontSize:'.6rem',fontWeight:700,marginLeft:'.3rem'}}>{groupRespondents.length}</span>}
                  </div>
                ))}
                {isAdmin&&(
                  <div className={`rpt-tab${rptTab===4?' active':''}`} onClick={()=>setRptTab(4)} style={{color:rptTab===4?'#e05528':'#aaa',borderBottomColor:rptTab===4?'#e05528':'transparent'}}>
                    🔒 Facilitator
                  </div>
                )}
              </div>

              {/* TAB 0 */}
              {rptTab===0&&(
                <div>
                  <div className="chart-pair">
                    <div className="chart-box">
                      <ExpandableDiamond title="Current Profile (As-Is)">
                        <div className="chart-lbl">Current Profile (As-Is)</div>
                        <DiamondChart p={prog} d={def} c={con} f={flex} color="#e05528" prevProfile={prevSubmission}/>
                        <div style={{marginTop:'.75rem',fontSize:'.78rem',color:'#888',fontWeight:600}}>{SLABELS[asIsStrat]}</div>
                        {prevSubmission&&(
                          <div style={{marginTop:'.5rem',fontSize:'.72rem',color:'#94a3b8',lineHeight:1.5}}>
                            <span style={{display:'block',marginBottom:'.2rem'}}>— — dotted line = your profile from {prevSubmission.date}</span>
                            {[{lbl:'Progressive',now:prog,prev:prevSubmission.prog},{lbl:'Defensive',now:def,prev:prevSubmission.def},{lbl:'Consistent',now:con,prev:prevSubmission.con},{lbl:'Flexible',now:flex,prev:prevSubmission.flex}]
                              .filter(r=>Math.abs(r.now-r.prev)>=3)
                              .map(r=>{const d=r.now-r.prev;return(
                                <span key={r.lbl} style={{display:'block',color:d>0?'#16a34a':'#e05528',fontWeight:600}}>
                                  {r.lbl}: {d>0?`+${d}`:d} since last visit
                                </span>
                              );})
                            }
                          </div>
                        )}
                      </ExpandableDiamond>
                    </div>
                    <div className="chart-box">
                      <ExpandableDiamond title="Desired Profile (To-Be)">
                        <div className="chart-lbl">Desired Profile (To-Be)</div>
                        <DiamondChart p={tobe.p} d={tobe.d} c={tobe.c} f={tobe.f} color="#1a1a1a"/>
                        <div style={{marginTop:'.75rem',fontSize:'.78rem',color:'#888',fontWeight:600}}>{SLABELS[tobeStrat]}</div>
                      </ExpandableDiamond>
                    </div>
                  </div>
                  <div className="rpt-section">
                    <div className="rpt-heading">What This Profile Tells Us About {th}</div>
                    <p className="rpt-body">{SD.summary}</p>
                    {industryContext&&<p className="rpt-body">{industryContext}</p>}
                  </div>
                  {/* Gap summary table */}
                  <div className="rpt-section">
                    <div className="rpt-heading">Gap Between Current and Desired Profile</div>
                    <div className="gap-summary">
                      <div className="gap-row hdr"><div>Dimension</div><div className="gap-val">Now</div><div className="gap-val">Desired</div><div className="gap-val">Change</div></div>
                      {[{lbl:'Progressive',now:prog,des:tobe.p},{lbl:'Defensive',now:def,des:tobe.d},{lbl:'Consistent',now:con,des:tobe.c},{lbl:'Flexible',now:flex,des:tobe.f}].map(r=>{
                        const g=r.des-r.now;const gl=gapLabel(g);
                        return(<div key={r.lbl} className="gap-row">
                          <div style={{fontWeight:600}}>{r.lbl}</div>

                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{fontSize:'.7rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#059669',marginBottom:'.6rem'}}>Respondents Who Diverge Most from the Group</div>
                      {facilInsights.topDivergers.map((d,i)=>(
                        <div key={i} style={{display:'flex',gap:'.75rem',alignItems:'center',marginBottom:'.5rem',padding:'.6rem .75rem',background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:'6px'}}>
                          <div style={{fontWeight:700,color:'#065f46',minWidth:'80px',fontSize:'.78rem'}}>{d.name}</div>
                          <div style={{fontSize:'.78rem',color:'#374151'}}>Profile distance from group mean: <strong>{d.dist} points</strong></div>
                        </div>
                      ))}
                    </div>
                    )}

                    {facilInsights.contentions.length>0&&(
                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{fontSize:'.7rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#7c3aed',marginBottom:'.6rem'}}>Points of Potential Contention or Conflict</div>
                      {facilInsights.contentions.map((c,i)=>(
                        <div key={i} style={{display:'flex',gap:'.75rem',marginBottom:'.75rem',padding:'.75rem',background:'#f5f3ff',border:'1px solid #ddd6fe',borderRadius:'6px'}}>
                          <div style={{fontWeight:800,color:'#7c3aed',fontSize:'1rem',flexShrink:0}}>{i+1}</div>
                          <p className="rpt-body" style={{margin:0}}>{c}</p>
                        </div>
                      ))}
                    </div>
                    )}
                  </div>

                  {/* KEY QUESTIONS */}
                  <div className="rpt-section">
                    <div className="rpt-heading">Key Questions — Based on This Group's Data</div>
                    <p className="rpt-body" style={{marginBottom:'1rem'}}>These questions are tailored to what this group's responses reveal. Use them to open up areas of genuine uncertainty or divergence.</p>
                    {facilInsights.keyQs.map((q,i)=>(
                      <div key={i} style={{display:'flex',gap:'.75rem',marginBottom:'.85rem',padding:'.75rem 1rem',background:'#f8fafc',border:'1px solid #e2e8f0',borderLeft:'3px solid #1a1a1a',borderRadius:'0 6px 6px 0'}}>
                        <div style={{fontWeight:800,color:'#1a1a1a',flexShrink:0}}>Q{i+1}</div>
                        <p className="rpt-body" style={{margin:0}}>{q}</p>
                      </div>
                    ))}
                  </div>

                  {/* GENERAL FACILITATION QUESTIONS */}
                  <div className="rpt-section">
                    <div className="rpt-heading">General Discussion Questions</div>
                    <p className="rpt-body" style={{marginBottom:'1rem'}}>Use these as a framework to guide the wider group conversation, regardless of the specific profile that emerges.</p>
                    {[
                      'Why does our STAT profile look like this?',
                      'Has it always looked like this, or has it changed over time — and if so, was that change purposeful or drift?',
                      'What are the genuine strengths of this profile? What does it allow us to do well?',
                      'What are the risks and blind spots? What does this profile make harder for us?',
                      'Is our overall profile fit for purpose — do we have the right balance for what we are trying to achieve?',
                      'Where do we need to be? Taking into account our strategy, our priorities, and the outcomes we need to deliver — what should our profile look like in 12–24 months?',
                      'What would have to change — in our structures, leadership, incentives and culture — to actually get there?'
                    ].map((q,i)=>(
                      <div key={i} style={{display:'flex',gap:'.75rem',marginBottom:'.75rem',padding:'.7rem 1rem',background:'#f8fafc',border:'1px solid #e2e8f0',borderLeft:'3px solid #e05528',borderRadius:'0 6px 6px 0'}}>
                        <div style={{fontWeight:800,color:'#e05528',flexShrink:0}}>{i+1}</div>
                        <p className="rpt-body" style={{margin:0}}>{q}</p>
                      </div>
                    ))}
                  </div>

                  <div className="btn-row" style={{marginTop:'2rem'}}>
                    <button className="btn-p" onClick={printReport}>Print / Save as PDF</button>
                    <button className="btn-s" onClick={()=>setRptTab(3)}>← Group Report</button>
                  </div>
                </div>
              )}
            </div>
          )}

        </div>
      </div>
      <Footer/>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
