<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>STAT — Strategic Tensions Assessment Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Open Sans',sans-serif;background:#fff;color:#1a1a1a;-webkit-font-smoothing:antialiased}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.fade{animation:fadeIn .3s ease both}
.shell{min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#1a1a1a;padding:.8rem 1.75rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-logo img{height:22px;display:block}
.hdr-right{font-size:.65rem;font-weight:600;color:#444;letter-spacing:.08em;text-transform:uppercase}
.ftr{background:#1a1a1a;padding:.8rem 1.75rem;display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.ftr-l{font-size:.65rem;color:#555}
.ftr-r{font-size:.65rem;color:#444}
.prog-wrap{max-width:760px;margin:0 auto;padding:1rem 1.5rem .2rem}
.prog-bars{display:flex;gap:3px;margin-bottom:.3rem}
.prog-bar{flex:1;height:3px;border-radius:2px;background:#e5e5e5;transition:background .3s}
.prog-bar.done{background:#e05528}
.prog-bar.now{background:#1a1a1a}
.prog-lbls{display:flex;gap:3px}
.prog-lbl{flex:1;font-size:.52rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#ccc;text-align:center;overflow:hidden;white-space:nowrap}
.prog-lbl.done{color:#e05528}
.prog-lbl.now{color:#1a1a1a}
.main{flex:1}
.content{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 3rem}
.land-hero{border-bottom:1px solid #e5e5e5;padding-bottom:2rem;margin-bottom:2rem}
.land-tag{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e05528;margin-bottom:.75rem}
.land-title{font-size:1.85rem;font-weight:700;color:#1a1a1a;line-height:1.2;margin-bottom:.65rem}
.land-desc{font-size:.95rem;color:#555;line-height:1.7;max-width:560px}
.land-time{display:inline-flex;align-items:center;gap:.4rem;background:#f7f7f7;border-radius:20px;padding:.35rem .85rem;font-size:.75rem;font-weight:600;color:#888;margin-top:.85rem}
.land-time::before{content:"⏱";font-size:.8rem}
.field-lbl{font-size:.72rem;font-weight:700;color:#666;display:block;margin-bottom:.35rem;letter-spacing:.03em}
.field-sub{font-size:.72rem;color:#aaa;margin-bottom:.35rem;line-height:1.5}
.inp{width:100%;border:1px solid #e5e5e5;border-radius:3px;padding:.72rem 1rem;font-family:'Open Sans',sans-serif;font-size:.9rem;color:#1a1a1a;outline:none;min-height:44px;transition:border-color .15s;background:#fff;display:block}
.inp:focus{border-color:#e05528}
.inp::placeholder{color:#bbb}
.inp-ta{min-height:90px;resize:vertical;line-height:1.55}
.disc{font-size:.72rem;color:#aaa;line-height:1.6;padding:.75rem;background:#f9f9f9;border-radius:3px;border:1px solid #eee;margin-top:.5rem}
.btn-p{display:inline-flex;align-items:center;gap:.4rem;background:#e05528;color:#fff;border:none;border-radius:3px;font-weight:700;padding:.78rem 1.6rem;font-family:'Open Sans',sans-serif;font-size:.9rem;cursor:pointer;min-height:44px;transition:opacity .15s}
.btn-p:hover:not([disabled]){opacity:.88}
.btn-p[disabled]{opacity:.3;cursor:not-allowed}
.btn-s{display:inline-flex;align-items:center;gap:.4rem;background:#fff;color:#1a1a1a;border:1px solid #ddd;border-radius:3px;font-weight:500;padding:.78rem 1.2rem;font-family:'Open Sans',sans-serif;font-size:.9rem;cursor:pointer;min-height:44px;transition:border-color .15s}
.btn-s:hover{border-color:#1a1a1a}
.btn-row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1.75rem}
.sec-tag{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e05528;margin-bottom:.5rem}
.pg-title{font-size:1.2rem;font-weight:700;color:#1a1a1a;line-height:1.4;margin-bottom:.35rem}
.pg-sub{font-size:.875rem;color:#666;margin-bottom:1.4rem;line-height:1.65}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;background:none;border:none;font-family:'Open Sans',sans-serif;font-size:.82rem;font-weight:500;color:#888;cursor:pointer;padding:0;margin-bottom:1.5rem}
.back-btn:hover{color:#1a1a1a}
.inf-box{background:#f7f7f7;border-left:3px solid #e05528;padding:.85rem 1.1rem;border-radius:0 3px 3px 0;margin-bottom:1.2rem;font-size:.875rem;line-height:1.6;color:#555}
.warn-box{background:#fff8f6;border:1px solid #f0b8a8;border-radius:3px;padding:.85rem 1.1rem;margin:.7rem 0;font-size:.82rem;color:#c0392b}
.divider{border:none;border-top:1px solid #eee;margin:1.5rem 0}
.q-cat-hdr{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#aaa;padding:.5rem 0;margin-top:1.25rem;margin-bottom:.35rem;border-top:1px solid #e5e5e5}
.q-card{border:1px solid #e5e5e5;border-radius:4px;padding:1rem;margin-bottom:.5rem;background:#fff;transition:border-color .2s}
.q-card.active{border-color:#1a1a1a}
.q-card.done{border-color:#e5e5e5;opacity:.85}
.q-card.locked{opacity:.45;pointer-events:none}
.q-card-title{font-size:.8rem;font-weight:700;color:#1a1a1a;margin-bottom:.75rem;line-height:1.45}
.q-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:.65rem;align-items:center}
.q-opt{border-radius:3px;padding:.6rem .75rem;font-size:.77rem;line-height:1.45;transition:all .15s}
.q-opt-side{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.2rem}
.q-inputs{display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:110px}
.q-input-row{display:flex;align-items:center;gap:.35rem}
.q-num{width:46px;height:46px;text-align:center;border-radius:3px;font-size:1rem;font-weight:700;font-family:'Open Sans',sans-serif;outline:none;border:1px solid #e5e5e5;background:#fff;color:#1a1a1a}
.q-stepper{display:flex;align-items:center;gap:4px}
.q-step-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid #ddd;background:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;line-height:1;padding:0;flex-shrink:0;user-select:none}
.q-step-btn:hover:not([disabled]){background:#f0f0f0;border-color:#bbb}
.q-step-btn[disabled]{opacity:.3;cursor:not-allowed}
.q-val{width:32px;text-align:center;font-size:1rem;font-weight:700;font-family:'Open Sans',sans-serif;color:#1a1a1a}
.q-num:focus{border-color:#e05528}
.q-num.over{border-color:#e05528;background:#fff8f6}
.q-num:disabled{opacity:.5;cursor:not-allowed}
.q-sep{color:#ccc;font-weight:700;font-size:1.1rem}
.q-hint{font-size:.63rem;color:#aaa;text-align:center}
.q-hint.over{color:#e05528;font-weight:700}
.q-hint.ok{color:#27ae60;font-weight:600}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin:1.2rem 0}
.score-card{border:1px solid #e5e5e5;border-radius:3px;padding:.9rem}
.score-dim{font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#aaa;margin-bottom:.2rem}
.score-val{font-size:1.55rem;font-weight:700;color:#e05528;line-height:1}
.score-lbl{font-size:.75rem;color:#666;margin-top:.15rem}
.score-bar{height:3px;background:#eee;border-radius:2px;margin-top:.55rem;overflow:hidden}
.score-fill{height:100%;background:#e05528;border-radius:2px}
.slider-wrap{margin-bottom:1.25rem}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem}
.slider-lbl{font-size:.84rem;font-weight:700;color:#1a1a1a;flex:1;padding-right:1rem;line-height:1.3}
.slider-val{font-size:1.1rem;font-weight:700;color:#e05528;flex-shrink:0}
.slider-val span{font-size:.68rem;color:#aaa;font-weight:400}
.slider-track{position:relative;height:28px;display:flex;align-items:center}
.slider-bg{height:6px;background:#eee;border-radius:3px;width:100%;overflow:hidden;position:relative}
.slider-fill{height:100%;background:#e05528;border-radius:3px;transition:width .1s}
.slider-input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1;-webkit-appearance:none;appearance:none}
.slider-input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px}
.slider-input::-moz-range-thumb{width:22px;height:22px}
.slider-thumb{position:absolute;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #e05528;box-shadow:0 1px 4px rgba(0,0,0,.15);pointer-events:none;transition:left .1s}
.slider-section{border:1px solid #e5e5e5;border-radius:4px;padding:1.25rem;background:#fafafa;margin-bottom:1rem}
.rpt-tabs{display:flex;gap:0;border-bottom:2px solid #e5e5e5;margin-bottom:1.75rem}
.rpt-tab{padding:.6rem 1rem;font-size:.78rem;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:#aaa;transition:all .2s;white-space:nowrap}
.rpt-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.rpt-tab:hover:not(.active){color:#555}
.rpt-section{margin-bottom:1.5rem}
.rpt-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e05528;margin-bottom:.5rem}
.rpt-body{font-size:.875rem;line-height:1.75;color:#1a1a1a;margin-bottom:.65rem}
.rpt-subhead{font-size:.84rem;font-weight:700;color:#1a1a1a;margin:.9rem 0 .35rem}
.chart-pair{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin:1.25rem 0}
.chart-box{border:1px solid #e5e5e5;border-radius:4px;padding:1.25rem;background:#fafafa;text-align:center}
.chart-lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:.75rem}
.sug-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1rem}
.sug-col-hdr{font-size:.65rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#1a1a1a;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:2px solid #1a1a1a}
.sug-item{display:flex;gap:.65rem;align-items:flex-start;padding:.65rem 0;border-bottom:1px solid #f0f0f0}
.sug-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#e05528;color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sug-txt{font-size:.85rem;line-height:1.6;color:#1a1a1a}
.mock-badge{background:#1a1a1a;color:#e05528;font-size:.63rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.22rem .55rem;border-radius:2px;display:inline-block;margin-bottom:.9rem}
.strat-badge{display:inline-flex;align-items:flex-start;gap:.5rem;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:3px;padding:.5rem .9rem;margin:.7rem 0}
.strat-dot{width:10px;height:10px;border-radius:50%;background:#e05528;flex-shrink:0;margin-top:3px}
.strat-name{font-size:.84rem;font-weight:700;color:#1a1a1a}
.think{display:flex;align-items:center;gap:.75rem;padding:1.5rem 0}
.dots{display:flex;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#e05528;animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
.think-txt{font-size:.875rem;color:#888;font-style:italic}
.ctx-optional{display:flex;align-items:center;gap:.4rem;margin:.9rem 0 .25rem}
.ctx-opt-lbl{font-size:.7rem;font-weight:700;color:#aaa;letter-spacing:.06em;text-transform:uppercase}
.ctx-opt-bar{flex:1;height:1px;background:#eee}
.gap-summary{border:1px solid #e5e5e5;border-radius:4px;overflow:hidden;margin:1.25rem 0}
.gap-row{display:grid;grid-template-columns:1fr 60px 60px 80px;gap:.5rem;align-items:center;padding:.6rem .9rem;border-bottom:1px solid #f5f5f5;font-size:.82rem}
.gap-row:last-child{border-bottom:none}
.gap-row.hdr{background:#f7f7f7;font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#888}
.gap-val{text-align:center;font-weight:700}
.gap-pos{color:#27ae60}
.gap-neg{color:#e05528}
.gap-zero{color:#aaa}
.gap-badge{font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .45rem;border-radius:2px;text-align:center}
.gap-large{background:#fff3cd;color:#856404}
.gap-medium{background:#d4edda;color:#155724}
.gap-small{background:#e2e3e5;color:#383d41}
/* Group report */
.grp-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem;align-items:center}
.grp-leg-item{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:#666}
.grp-leg-line{width:22px;height:2px;flex-shrink:0}
.grp-leg-line.you{background:#e05528}
.grp-leg-line.others{background:#aaa;background:repeating-linear-gradient(90deg,#aaa 0,#aaa 4px,transparent 4px,transparent 7px)}
.grp-leg-line.mean{background:#1a1a1a}
.var-table{border:1px solid #e5e5e5;border-radius:4px;overflow:hidden;margin:1.25rem 0}
.var-row{display:grid;grid-template-columns:2fr 60px 1fr 80px;gap:.5rem;align-items:center;padding:.55rem .9rem;border-bottom:1px solid #f5f5f5;font-size:.78rem}
.var-row:last-child{border-bottom:none}
.var-row.hdr{background:#f7f7f7;font-size:.62rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#888}
.var-bar-wrap{display:flex;align-items:center;gap:.45rem}
.var-bar-bg{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden;min-width:40px}
.var-bar-fill{height:100%;border-radius:3px}
.cons-badge{font-size:.63rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.14rem .42rem;border-radius:2px;white-space:nowrap}
.cons-high{background:#fde8e8;color:#c0392b}
.cons-med{background:#fff3cd;color:#856404}
.cons-low{background:#d4edda;color:#155724}
.resp-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.25rem}
.code-fix-btn{background:none;border:none;padding:0;font-size:.75rem;color:#2563eb;cursor:pointer;text-decoration:underline;margin-top:.4rem;display:inline-block}
.code-fix-box{margin-top:.75rem;padding:.75rem 1rem;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.code-fix-box input{flex:1;min-width:120px;padding:.4rem .6rem;border:1px solid #93c5fd;border-radius:5px;font-size:.82rem;font-family:inherit}
.code-fix-box .apply-btn{background:#2563eb;color:#fff;border:none;padding:.4rem .85rem;border-radius:5px;font-size:.78rem;font-weight:700;cursor:pointer}
.code-fix-box .apply-btn:hover{background:#1d4ed8}
.resp-chip{font-size:.72rem;font-weight:600;padding:.25rem .7rem;border-radius:20px;border:1px solid #e5e5e5;color:#555;background:#f9f9f9}
.resp-chip.you{background:#e05528;color:#fff;border-color:#e05528}
.grp-chart-pair{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin:1.25rem 0}
.grp-stat-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #f5f5f5;font-size:.82rem}
.grp-stat-row:last-child{border-bottom:none}
.grp-stat-lbl{color:#666}
.grp-stat-val{font-weight:700;color:#e05528}
.grp-sug-item{display:flex;gap:.65rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid #f0f0f0}
.grp-sug-item:last-child{border-bottom:none}
.grp-sug-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#1a1a1a;color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.grp-sug-txt{font-size:.85rem;line-height:1.65;color:#1a1a1a}
.legend-row{display:flex;flex-wrap:wrap;gap:.65rem 1.25rem;margin-top:.85rem;justify-content:center}
.legend-item{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:#555;font-weight:600}
.legend-swatch{width:28px;height:3px;flex-shrink:0;border-radius:2px}
.submit-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;padding:.85rem 1.1rem;margin-bottom:1.5rem}
.submit-count{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.part-circles{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.part-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;font-family:'Open Sans',sans-serif;transition:all .5s;flex-shrink:0;position:relative}
.part-circle.started{background:#fff;border:2.5px solid #e05528;color:#e05528}
.part-circle.completed{background:#e05528;border:2.5px solid #e05528;color:#fff}
.part-circle.others-started{background:#fff;border:2.5px solid #e05528;color:#e05528}
.part-circle.others-completed{background:#e05528;border:2.5px solid #e05528;color:#fff}
.submit-txt{font-size:.78rem;font-weight:700;color:#1a1a1a}
.refresh-btn{display:flex;align-items:center;gap:.4rem;background:#e05528;color:#fff;border:none;border-radius:4px;padding:.5rem 1rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.refresh-btn:hover{background:#c44820}
.refresh-time{font-size:.65rem;color:#9ca3af;margin-top:.2rem;text-align:right}
.all-in-badge{background:#dcfce7;border:1px solid #86efac;border-radius:6px;padding:.35rem .75rem;font-size:.75rem;font-weight:700;color:#166534;display:inline-block}
@media(max-width:580px){
  .q-grid{display:flex;flex-direction:column;gap:.5rem}
  .q-inputs{order:2;width:100%;align-items:center}
  .q-opt:first-of-type{order:1}
  .q-opt:last-of-type{order:3}
  .q-opt-side{display:inline;margin-right:.3rem}
  .q-step-btn{width:44px;height:44px;font-size:1.3rem}
  .q-val{font-size:1.1rem;width:36px}
  .sug-grid{grid-template-columns:1fr}
  .chart-pair{grid-template-columns:1fr}
  .content{padding:1.5rem 1rem 2.5rem}
  .land-title{font-size:1.4rem}
  .rpt-tab{padding:.5rem .55rem;font-size:.68rem}
  .gap-row{grid-template-columns:1fr 50px 50px 70px}
  .submit-bar{flex-direction:column;align-items:flex-start}
  .slider-input{height:44px}
}
.diamond-fullscreen-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer}
.diamond-fullscreen-inner{background:#fff;border-radius:12px;padding:2rem;max-width:520px;width:90%;position:relative}
.diamond-fullscreen-close{position:absolute;top:.75rem;right:.75rem;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#666;line-height:1}
.diamond-expand-hint{font-size:.65rem;color:#bbb;text-align:center;margin-top:.3rem;cursor:pointer}
@media print{
  .hdr,.ftr,.prog-wrap,.back-btn,.btn-row,.rpt-tabs,.mock-badge{display:none!important}
  .shell{display:block}
  .content{max-width:100%;padding:1rem}
  .rpt-tab-panel{display:block!important}
  .chart-pair{grid-template-columns:1fr 1fr}
  .sug-grid{grid-template-columns:1fr 1fr}
  .page-break{page-break-before:always}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;

function getStrategy(d,p,c,f){
  const max=Math.max(d,p,c,f),min=Math.min(d,p,c,f);
  if(max-min<15)return'neutral';
  const mind=p>d?'prog':'def';
  const app=f>c?'flex':'con';
  if(mind==='prog'&&app==='con')return'performance_optimization';
  if(mind==='prog'&&app==='flex')return'adaptive_innovation';
  if(mind==='def'&&app==='con')return'preventative_control';
  return'mindful_action';
}
const SLABELS={preventative_control:'Preventative Control',mindful_action:'Mindful Action',performance_optimization:'Performance Optimisation',adaptive_innovation:'Adaptive Innovation',neutral:'Neutral'};
const SDESC={
  preventative_control:'Monitoring and complying — a defensive strategy based on consistency.',
  mindful_action:'Noticing and responding — a defensive strategy based on flexibility.',
  performance_optimization:'Improving and exploiting — a progressive strategy based on consistency.',
  adaptive_innovation:'Imagining and creating — a progressive strategy based on flexibility.',
  neutral:'A balanced combination of all four core strategies.',
};

// Diamond chart
const MX=120,SZ=260,CX=130,CY=130,RD=90;
function axisPt(ax,sc){const r=(sc/MX)*RD;if(ax==='prog')return[CX,CY-r];if(ax==='flex')return[CX+r,CY];if(ax==='def')return[CX,CY+r];return[CX-r,CY];}
function shapePath(s){const pts=[[CX,CY-(s.p/MX)*RD],[CX+(s.f/MX)*RD,CY],[CX,CY+(s.d/MX)*RD],[CX-(s.c/MX)*RD,CY]];return pts.map((pt,i)=>`${i===0?'M':'L'}${pt[0]},${pt[1]}`).join(' ')+' Z';}
function gridPath(pct){const r=RD*pct;return `M${CX},${CY-r} L${CX+r},${CY} L${CX},${CY+r} L${CX-r},${CY} Z`;}
function ExpandableDiamond({children,title=''}){
  const [open,setOpen]=React.useState(false);
  return(
    <div>
      <div style={{cursor:'pointer'}} onClick={()=>setOpen(true)} title="Tap to expand">
        {children}
        <div className="diamond-expand-hint">⤢ tap to expand</div>
      </div>
      {open&&(
        <div className="diamond-fullscreen-overlay" onClick={()=>setOpen(false)}>
          <div className="diamond-fullscreen-inner" onClick={e=>e.stopPropagation()}>
            <button className="diamond-fullscreen-close" onClick={()=>setOpen(false)}>✕</button>
            {title&&<div style={{textAlign:'center',fontWeight:700,marginBottom:'.75rem',fontSize:'.9rem'}}>{title}</div>}
            {children}
          </div>
        </div>
      )}
    </div>
  );
}

function DiamondChart({p=0,d=0,c=0,f=0,color='#e05528',prevProfile=null}){
  return(
    <svg width={SZ} height={SZ} style={{overflow:'visible',maxWidth:'100%'}}>
      {[.25,.5,.75,1].map(pct=><path key={pct} d={gridPath(pct)} fill="none" stroke="#e5e5e5" strokeWidth={pct===1?1.5:1}/>)}

}

// Question section
function QuestionSection({secData,answers,onChange,activeIdx,setActiveIdx}){
  const allQ=secData.categories.flatMap(c=>c.qs);
  const firstUnanswered=allQ.findIndex((_,i)=>{const a=answers[i];const lv=parseInt(a?.l)||0,rv=parseInt(a?.r)||0;return(lv+rv)===0;});
  const maxUnlocked=firstUnanswered===-1?allQ.length-1:firstUnanswered;
  // Derived values (computed before render)
  return(
    <div>
      <div className="inf-box">
        Allocate up to 10 points between each pair of statements. Split in any way you see as appropriate (e.g. 10-0, 8-2, 5-5, 0-10). You may allocate less than 10 if neither statement fully reflects your organisation. <strong>You cannot allocate more than 10 points and half-points are not allowed.</strong>
      </div>
      {secData.categories.map(cat=>(
        <div key={cat.name}>
          <div className="q-cat-hdr">{cat.name}</div>
          {cat.qs.map(q=>{
            const idx=allQ.findIndex(x=>x.id===q.id);
            const a=answers[idx]||{l:'',r:''};
            const lv=parseInt(a.l)||0,rv=parseInt(a.r)||0;
            const total=lv+rv,over=total>10,rem=10-total;
            const done=total>0&&!over;
            const locked=idx>maxUnlocked;
            const isActive=idx===activeIdx||(activeIdx<0&&idx===0);
            const lActive=lv>0,rActive=rv>0;
            function handleL(val){
              const n=Math.max(0,Math.min(parseInt(val)||0,10));
              const maxR=10-n;const newR=Math.min(rv,maxR);
              const u=[...answers];u[idx]={l:String(n),r:String(newR)};onChange(u);setActiveIdx(idx);
            }
            function handleR(val){
              const n=Math.max(0,Math.min(parseInt(val)||0,10));
              const maxL=10-n;const newL=Math.min(lv,maxL);
              const u=[...answers];u[idx]={l:String(newL),r:String(n)};onChange(u);setActiveIdx(idx);
            }
            return(
              <div key={q.id} className={`q-card${locked?' locked':isActive?' active':done?' done':''}`} onClick={()=>!locked&&setActiveIdx(idx)}>
                <div className="q-card-title">{idx+1}. {q.q}</div>
                <div className="q-grid">
                  <div className="q-opt" style={{background:lActive?'#fff3f0':'#f9f9f9',border:lActive?'1px solid #e05528':'1px solid #eee',color:lActive?'#1a1a1a':'#666'}}>
                    <div className="q-opt-side" style={{color:lActive?'#e05528':'#bbb'}}>Option A</div>
                    {q.l}
                  </div>
                  <div className="q-inputs">
                    <div className="q-input-row">
                      <div className="q-stepper">
                        <button className="q-step-btn" aria-label={`Decrease Option A score for question ${idx+1}`} disabled={locked||lv<=0} onClick={e=>{e.stopPropagation();handleL(String(lv-1));}}>−</button>
                        <div className={`q-val${over?' over':''}`}>{lv}</div>
                        <button className="q-step-btn" aria-label={`Increase Option A score for question ${idx+1}`} disabled={locked||total>=10} onClick={e=>{e.stopPropagation();handleL(String(lv+1));}}>+</button>
                      </div>
                      <span className="q-sep">|</span>
                      <div className="q-stepper">
                        <button className="q-step-btn" aria-label={`Decrease Option B score for question ${idx+1}`} disabled={locked||rv<=0} onClick={e=>{e.stopPropagation();handleR(String(rv-1));}}>−</button>
                        <div className={`q-val${over?' over':''}`}>{rv}</div>
                        <button className="q-step-btn" aria-label={`Increase Option B score for question ${idx+1}`} disabled={locked||total>=10} onClick={e=>{e.stopPropagation();handleR(String(rv+1));}}>+</button>
                      </div>
                    </div>
                    <div className={`q-hint${over?' over':done?' ok':''}`}>
                      {over?`${total-10} over limit`:done?`✓ ${total} pts`:rem===10?'up to 10 pts':`${rem} pts remaining`}
                    </div>
                  </div>
                  <div className="q-opt" style={{background:rActive?'#fff3f0':'#f9f9f9',border:rActive?'1px solid #e05528':'1px solid #eee',color:rActive?'#1a1a1a':'#666'}}>
                    <div className="q-opt-side" style={{color:rActive?'#e05528':'#bbb'}}>Option B</div>
                    {q.r}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// Slider — coupled: moving one adjusts its pair
function Slider({label,value,onChange,max=120,asIs=null}){
  return(
    <div className="slider-wrap">
      <div className="slider-top">
        <div className="slider-lbl">{label}</div>
        <div className="slider-val">
          {Math.round(value)}<span> / {max}</span>
          {asIs!==null&&<span style={{marginLeft:'.5rem',fontSize:'.65rem',color:'#bbb',fontWeight:400}}>current: {Math.round(asIs)}</span>}
        </div>
      </div>
      <div className="slider-track">
        <div className="slider-bg"><div className="slider-fill" style={{width:`${(value/max)*100}%`}}/></div>
        <input type="range" min="0" max={max} value={value} onChange={e=>onChange(Number(e.target.value))} className="slider-input" aria-label={label}/>
        <div className="slider-thumb" style={{left:`${(value/max)*100}%`}}/>
        {asIs!==null&&(
          <div style={{position:'absolute',left:`${(asIs/max)*100}%`,transform:'translateX(-50%)',top:'-4px',width:'2px',height:'30px',background:'#e05528',opacity:.35,pointerEvents:'none',borderRadius:'2px'}} title={`Current as-is: ${Math.round(asIs)}`}/>
        )}
      </div>
      {asIs!==null&&<div style={{fontSize:'.62rem',color:'#ccc',marginTop:'.15rem'}}>▲ orange line = your current as-is score</div>}
    </div>
  );
}

function Header(){return(<div className="hdr"><div className="hdr-logo"><img src={LOGO_SRC} alt="David Denyer"/></div><div className="hdr-right">STAT</div></div>);}
function Footer(){return(<div className="ftr"><span className="ftr-l">© Professor David Denyer · Cranfield School of Management · daviddenyer.com</span><span className="ftr-r">daviddenyer.com</span></div>);}
const STEPS=['Start','Focus','Context','Survey 1','Survey 2','Profile','Future','Report'];
function Progress({step}){return(<div className="prog-wrap"><div className="prog-bars">{STEPS.map((_,i)=><div key={i} className={`prog-bar${i<step?' done':i===step?' now':''}`}/>)}</div><div className="prog-lbls">{STEPS.map((s,i)=><div key={i} className={`prog-lbl${i<step?' done':i===step?' now':''}`}>{s}</div>)}</div></div>);}
function BackBtn({onClick}){return(<button className="back-btn" onClick={onClick} aria-label="Go back to previous step">← Back</button>);}

// Gap analysis logic
function computeGaps(prog,def,con,flex,tp,td,tc,tf){
  const pGap=tp-prog,dGap=td-def,cGap=tc-con,fGap=tf-flex;
  const mindsetGap=Math.abs(pGap)+Math.abs(dGap);
  const approachGap=Math.abs(cGap)+Math.abs(fGap);
  return{pGap,dGap,cGap,fGap,mindsetGap,approachGap};
}
function gapLabel(g){if(Math.abs(g)<8)return'small';if(Math.abs(g)<20)return'medium';return'large';}
function gapBadgeText(g){if(Math.abs(g)<8)return'Minor tweak';if(Math.abs(g)<20)return'Moderate shift';return'Significant change';}

// Generate gap-informed contextual suggestions
function generateSuggestions(prog,def,con,flex,tp,td,tc,tf,thing,s1ans,s2ans){

      aR:`Your scores show ${th} operates through decentralised, adaptive structures. Your desired direction calls for more coordination. Experiment: identify the one resource — expertise, budget, tooling — most often duplicated across teams — and propose one light-touch shared coordination point that doesn't impose bureaucracy.`,
      qL:`${th} maximises resources through centralisation and efficiency. What decision is currently taking too long because it has to pass through a central function — and what is that delay actually costing?`,

    },
    8:{

      aR:`Your scores show ${th} relies on people's discretion and collective expertise to respond to problems. Your desired direction calls for more planned responses. Experiment: identify the three most critical scenarios where a consistent, pre-planned response is genuinely important — and verify that everyone likely to face those scenarios knows what to do before it happens.`,

      qL:`${th} sees its future in standardised, high-volume delivery. What customer need is consistently going unmet because your standard offering doesn't address it — and is that a market you are consciously choosing to leave to someone else?`,

      aR:`Your scores show ${th} wants to be measured by innovation and responsiveness. Your desired direction calls for more efficiency discipline. Experiment: identify one consistency or efficiency metric you have deprioritised in pursuit of responsiveness — and ask whether the trade-off you're making is the one your stakeholders would consciously choose if they could see it.`,
      qL:`You measure success through efficiency, timeliness and consistency. What outcome matters most to your customers that your current measures don't capture — and what would you have to change if you made that visible?`,
      qR:`You measure success through innovation and responsiveness. What would a stakeholder who values reliability above all else think of your current performance — and is their view worth taking seriously?`
    },
  };

  function buildSection(catName, offset){
    // For each question, calculate how much it's contributing to the gap
    // = how much the answer is pulling AGAINST the desired direction
    const candidates=[];

    for(let i=0;i<3;i++){
      const s1={...sc(s1ans,offset+i),qi:offset+i,survey:'s1'};
      const s2={...sc(s2ans,offset+i),qi:offset+i,survey:'s2'};

      // S1 leverage: if want more prog (pGap>0), defensive answers (lv>rv) are the gap
      //              if want more def (dGap>0), progressive answers (rv>lv) are the gap
      const s1leverage=pGap>0?(s1.lv-s1.rv):dGap>0?(s1.rv-s1.lv):Math.abs(s1.diff);
      // direction to use: which way are they currently leaning (that's wrong)?
      const s1dir=s1.diff<0?'L':'R'; // diff = rv-lv, negative = leaning left/defensive

      // S2 leverage: if want more flex (fGap>0), consistent answers (lv>rv) are the gap
      //              if want more con (cGap>0), flexible answers (rv>lv) are the gap
      const s2leverage=fGap>0?(s2.lv-s2.rv):cGap>0?(s2.rv-s2.lv):Math.abs(s2.diff);
      const s2dir=s2.diff<0?'L':'R';

      if(s1.total>0) candidates.push({leverage:s1leverage,qi:offset+i,survey:'s1',dir:s1dir,score:s1});
      if(s2.total>0) candidates.push({leverage:s2leverage,qi:offset+i,survey:'s2',dir:s2dir,score:s2});
    }

    // Sort by leverage descending — biggest contributor to the gap first
    candidates.sort((a,b)=>b.leverage-a.leverage);

    const top=candidates[0];
    const second=candidates[1]||candidates[0];

    function getText(c,type){
      const lib=c.survey==='s1'?S1Q:S2Q;
      const entry=lib[c.qi];
      if(!entry)return null;
      return c.dir==='L'?entry[type+'L']:entry[type+'R'];
    }

    const action=top?getText(top,'a')||`Identify the one decision you are facing right now in ${catName.toLowerCase()} where your as-is and desired profiles point in different directions — and run a small experiment this week using the approach your desired profile calls for.`:null;
    const question=second?getText(second,'q')||`What would someone who understood ${catName.toLowerCase()} in ${th} deeply — but had no stake in how it currently works — tell you is the single most important thing to change?`:null;

    return{
      action:action||`Identify the one change in ${catName.toLowerCase()} that would most close the gap between where ${th} is and where you want it to be — and take one small step toward it this week.`,
      question:question||`If your desired profile for ${catName.toLowerCase()} was already in place today, what would be the first thing you would notice that was different?`
    };
  }

  return{
    purpose:buildSection('Purpose',0),
    people:buildSection('People',3),
    process:buildSection('Process',6),
    product:buildSection('Product',9),
  };
}

// ── FACILITATOR INSIGHTS ─────────────────────────────────────────────────────
function generateFacilitatorInsights(groupRespondents, groupMean, groupTobe, questionVariance, th){
  if(!groupRespondents||groupRespondents.length<2||!groupMean) return null;
  const label = t => t||'the organisation';
  const org = label(th);
  const others = groupRespondents.filter(r=>!r.isYou);
  const you = groupRespondents.find(r=>r.isYou);
  const n = groupRespondents.length;
  const dims = ['prog','def','con','flex'];
  const dimNames = {prog:'Progressive',def:'Defensive',con:'Consistent',flex:'Flexible'};

  // ── Score each respondent ──────────────────────────────────────────────────
  const scored = groupRespondents.map(r => ({
    ...r,
    scores: scoreRespondent(r.s1, r.s2)
  }));

  // ── Extreme scores: anyone 2+ standard deviations from group mean ──────────
  const extremes = [];
  dims.forEach(dim => {
    const vals = scored.map(r => r.scores[dim]);
    const mean = vals.reduce((a,b)=>a+b,0)/n;
    const sd = Math.sqrt(vals.map(v=>(v-mean)**2).reduce((a,b)=>a+b,0)/n);
    scored.forEach(r => {
      const z = sd>0 ? Math.abs(r.scores[dim]-mean)/sd : 0;
      if(z>1.5){
        extremes.push({
          name: r.name,
          dim: dimNames[dim],
          score: Math.round(r.scores[dim]),
          mean: Math.round(mean),
          direction: r.scores[dim]>mean?'higher than':'lower than'
        });
      }
    });
  });

  // ── Outliers: respondents whose overall profile diverges most from group mean ─
  const divergence = scored.map(r => {
    const dist = dims.reduce((sum,d)=>{
      return sum + (r.scores[d] - groupMean[d])**2;
    }, 0);
    return { name: r.isYou?'You':r.name, dist: Math.round(Math.sqrt(dist)), isYou: r.isYou };
  }).sort((a,b)=>b.dist-a.dist);

  const topDivergers = divergence.filter(d=>d.dist>15).slice(0,3);

  // ── Surprising findings ────────────────────────────────────────────────────
  const surprises = [];
  const progDefBalance = Math.abs(groupMean.prog - groupMean.def);
  const conFlexBalance = Math.abs(groupMean.con - groupMean.flex);
  if(progDefBalance<8) surprises.push(`The group is unusually balanced between Progressive (${Math.round(groupMean.prog)}) and Defensive (${Math.round(groupMean.def)}) — a neutral mindset position. This is rare and worth exploring: is this a genuine strategic choice, or does it reflect uncertainty or lack of shared direction?`);
  if(groupMean.prog>85) surprises.push(`The group's average Progressive score (${Math.round(groupMean.prog)}) is very high. This level of forward-orientation is striking — it may reflect genuine ambition, or it could suggest insufficient attention to risk and defensive resilience.`);
  if(groupMean.def>85) surprises.push(`The group's average Defensive score (${Math.round(groupMean.def)}) is very high. This degree of defensive focus warrants discussion — is ${org} in a genuinely high-risk environment, or has caution become the default mode even where growth is possible?`);
  if(groupMean.flex>85) surprises.push(`The group's average Flexible score (${Math.round(groupMean.flex)}) is very high. High flexibility at group level may reflect genuine adaptability, or it could indicate inconsistency and a lack of shared standards.`);
  if(groupMean.con>85) surprises.push(`The group's average Consistent score (${Math.round(groupMean.con)}) is very high. This level of standardisation may be appropriate for ${org}'s context — or it may indicate over-reliance on procedure at the expense of judgement.`);
  if(groupTobe){
    const progShift = groupTobe.p - groupMean.prog;
    const defShift = groupTobe.d - groupMean.def;
    if(progShift>20&&defShift>20) surprises.push(`The group collectively wants to increase both Progressive (${Math.round(progShift)>0?'+':''}${Math.round(progShift)}) and Defensive (${Math.round(defShift)>0?'+':''}${Math.round(defShift)}) scores simultaneously — a significant ask. Explore whether this reflects a genuine need for more of everything, or whether the group hasn't yet made hard choices about strategic priorities.`);
    if(Math.abs(progShift)>25||Math.abs(defShift)>25||Math.abs(groupTobe.c-groupMean.con)>25||Math.abs(groupTobe.f-groupMean.flex)>25) surprises.push(`The desired future profile differs substantially from the current profile in at least one dimension. This is a large gap — the group may be underestimating the effort required to shift ${org}'s culture and ways of working.`);
  }
  if(surprises.length===0) surprises.push(`The group's profile is relatively consistent with what might be expected for an organisation of this type. There are no immediately striking anomalies — but the facilitator may want to probe whether the scores reflect genuine self-awareness or social desirability (i.e., people answering as they think they should, rather than as they observe the organisation to actually operate).`);

  // ── Points of potential contention ────────────────────────────────────────
  const contentions = [];
  if(questionVariance&&questionVariance.length>0){
    const topVar = questionVariance.slice(0,4);
    topVar.forEach(qv => {
      contentions.push(`"${qv.q.q}" — respondents scored this very differently (variance: ${qv.variance.toFixed(1)}). This question may reflect genuine disagreement about how ${org} currently operates in this area.`);
    });
  }
  if(topDivergers.length>0){
    contentions.push(`${topDivergers[0].name}'s overall profile diverges most from the group (distance: ${topDivergers[0].dist} points). Their perspective may represent a minority view worth surfacing — or they may be seeing something others are missing.`);
  }

  // ── Key questions for the facilitator ─────────────────────────────────────
  const keyQs = [];
  const dominantDim = dims.reduce((best,d)=>groupMean[d]>groupMean[best]?d:best, dims[0]);
  keyQs.push(`The group's dominant dimension is ${dimNames[dominantDim]} (${Math.round(groupMean[dominantDim])}). Ask: "Is this dominance a deliberate choice — or has it emerged over time without being consciously decided? Who made that call, and when?"`);
  if(topDivergers.length>0&&!topDivergers[0].isYou){
    keyQs.push(`${topDivergers[0].name} sees ${org} quite differently to the rest of the group. Consider asking them to share their perspective — their view may surface a blind spot that others haven't noticed.`);
  }
  if(contentions.length>0){
    const firstQ = questionVariance&&questionVariance[0];
    if(firstQ) keyQs.push(`The question with the most disagreement is: "${firstQ.q.q}". Ask the group: "What does the variation in our answers to this question tell us about how consistently we experience this organisation?"`);
  }
  if(groupTobe){
    const biggestGap = dims.reduce((best,d)=>{
      const gap = Math.abs(groupTobe[d==='prog'?'p':d==='def'?'d':d==='con'?'c':'f'] - groupMean[d]);
      const bestGap = Math.abs(groupTobe[best==='prog'?'p':best==='def'?'d':best==='con'?'c':'f'] - groupMean[best]);
      return gap>bestGap?d:best;
    }, dims[0]);
    keyQs.push(`The group's biggest desired shift is in ${dimNames[biggestGap]}. Ask: "What specifically would need to change — in our structures, our leadership, our incentives — for us to actually move in this direction? And what would we have to give up?"`);
  }

  return { surprises, extremes: extremes.slice(0,4), topDivergers, contentions: contentions.slice(0,4), keyQs: keyQs.slice(0,4) };
}

// Seeded pseudo-random: deterministic from sessionCode
function seededRand(seed, n) {
  const x = Math.sin(seed * 9301 + n * 49297 + 233) * 1000000;
  return x - Math.floor(x);
}

function generateMockRespondents(sessionCode, baseS1, baseS2, respondentName, userRole='') {
  const seed = sessionCode.split('').reduce((s, c, i) => s + c.charCodeAt(0) * (i + 1), 0);
  const count = 4 + Math.floor(seededRand(seed, 0) * 3); // 4–6 others
  const NAMES = ['Sarah K.','Marcus T.','Priya L.','James H.','Fiona M.','Rachel B.','Tom C.','Anita W.','Ben S.','Claire H.'];
  const shuffled = [...NAMES].sort((a, b) => seededRand(seed + a.charCodeAt(0), 1) - 0.5);

  // Build respondent list — user first
  const respondents = [{ name: respondentName || 'You', s1: baseS1, s2: baseS2, isYou: true, role: userRole }];

  for (let i = 0; i < count; i++) {
    const s1mock = baseS1.map((ans, qi) => {
      const lv = parseInt(ans.l) || 0;
      const rv = parseInt(ans.r) || 0;
      const total = lv + rv || 10;
      const noise = Math.round((seededRand(seed, qi * 20 + i * 7 + 1) - 0.5) * 6);
      const newL = Math.max(0, Math.min(total, lv + noise));
      return { l: String(newL), r: String(total - newL) };
    });
    const s2mock = baseS2.map((ans, qi) => {
      const lv = parseInt(ans.l) || 0;
      const rv = parseInt(ans.r) || 0;
      const total = lv + rv || 10;
      const noise = Math.round((seededRand(seed, qi * 20 + i * 7 + 13) - 0.5) * 6);
      const newL = Math.max(0, Math.min(total, lv + noise));
      return { l: String(newL), r: String(total - newL) };
    });
    respondents.push({ name: shuffled[i] || `Respondent ${i + 2}`, s1: s1mock, s2: s2mock, isYou: false });
  }
  return respondents;
}

function scoreRespondent(s1, s2) {
  if(!s1||!s1.length||!s2||!s2.length) return {def:60,prog:60,con:60,flex:60};
  const def = s1.reduce((s, a) => s + (parseInt(a?.l) || 0), 0);
  const prog = s1.reduce((s, a) => s + (parseInt(a?.r) || 0), 0);
  const con = s2.reduce((s, a) => s + (parseInt(a?.l) || 0), 0);
  const flex = s2.reduce((s, a) => s + (parseInt(a?.r) || 0), 0);
  return { def, prog, con, flex };
}

function computeGroupMean(respondents) {
  const n = respondents.length;
  return respondents.reduce((acc, r) => {
    const sc = scoreRespondent(r.s1, r.s2);
    return { def: acc.def + sc.def / n, prog: acc.prog + sc.prog / n, con: acc.con + sc.con / n, flex: acc.flex + sc.flex / n };
  }, { def: 0, prog: 0, con: 0, flex: 0 });
}

// Returns [{q, category, meanL, meanR, variance, label}] sorted by variance desc
function computeQuestionVariance(respondents, allQ, sectionKey) {
  return allQ.map((q, qi) => {
    const rights = respondents.map(r => parseInt(r[sectionKey][qi]?.r) || 0);
    const mean = rights.reduce((s, v) => s + v, 0) / rights.length;
    const variance = Math.sqrt(rights.reduce((s, v) => s + (v - mean) ** 2, 0) / rights.length);
    const meanL = respondents.reduce((s, r) => s + (parseInt(r[sectionKey][qi]?.l) || 0), 0) / respondents.length;
    const meanR = mean;
    return { q, qi, sectionKey, meanL, meanR, variance, mean };
  });
}

// 0-10 variance → normalised 0-1 for bar
function normVar(v) { return Math.min(1, v / 4); }
function varLabel(v) { if (v < 1.2) return 'High consensus'; if (v < 2.5) return 'Some variance'; return 'High disagreement'; }
function varClass(v) { if (v < 1.2) return 'cons-low'; if (v < 2.5) return 'cons-med'; return 'cons-high'; }
function varBarColor(v) { if (v < 1.2) return '#27ae60'; if (v < 2.5) return '#f39c12'; return '#e05528'; }

function generateGroupSuggestions(groupMean, userTobeP, userTobeD, userTobeC, userTobeF, thing, context, highVarQs) {
  const th = thing || 'your organisation';
  const ctx = context || '';
  const isNuclear = ctx.toLowerCase().includes('nuclear') || ctx.toLowerCase().includes('sellafield');
  const ctxPhrase = ctx.length > 10 ? ` in the context of ${th}` : '';

  const { def: gDef, prog: gProg, con: gCon, flex: gFlex } = groupMean;
  const strat = getStrategy(gDef, gProg, gCon, gFlex);

  const suggestions = [];

  // 1. What the group data says collectively
  suggestions.push(`The group profile for ${th} shows a collective dominant strategy of <strong>${SLABELS[strat]}</strong> — with mean scores of Progressive ${Math.round(gProg)}, Defensive ${Math.round(gDef)}, Consistent ${Math.round(gCon)}, Flexible ${Math.round(gFlex)}. This aggregate pattern reflects how people across ${th} collectively experience the organisation — and is a more reliable signal than any single respondent's view.`);

  // 2. Disagreement insight
  if (highVarQs && highVarQs.length > 0) {
    const top = highVarQs[0];
    suggestions.push(`The area of greatest disagreement across respondents is the question: "<em>${top.q.q}</em>" — where individual scores range widely. This kind of variance is diagnostic: it typically indicates that different parts or levels of ${th} are experiencing or enacting the strategy differently. This question deserves explicit discussion in a leadership forum before any change programme begins.`);
  }
  if (highVarQs && highVarQs.length > 1) {
    const sec = highVarQs[1];
    suggestions.push(`A second area of significant divergence is: "<em>${sec.q.q}</em>". When senior and frontline perspectives differ sharply on this kind of question, the formal strategy and the lived experience of work are probably misaligned${ctxPhrase}. Closing this gap requires more than communication — it requires structural or behavioural change to bring people's actual experience in line with stated intent.`);
  }

  // 3. Progressive/defensive gap in group
  if (gProg > gDef + 15) {
    suggestions.push(`The group leans significantly Progressive (${Math.round(gProg)} vs ${Math.round(gDef)} Defensive). For ${th}, this pattern is an asset for growth and innovation — but it carries the risk that protective disciplines are underweighted. Introduce systematic mechanisms for capturing and acting on weak signals of risk: near-miss reporting, pre-mortems on major decisions, and structured horizon scanning.`);
  } else if (gDef > gProg + 15) {
    suggestions.push(`The group leans significantly Defensive (${Math.round(gDef)} vs ${Math.round(gProg)} Progressive). For ${th}, this reflects a strong protective culture — appropriate in ${isNuclear ? 'a safety-critical environment' : 'many operating contexts'}, but potentially limiting organisational learning and adaptation. Create designated spaces where progressive thinking is explicitly invited: innovation time, cross-functional problem-solving forums, or strategic pilots that are isolated from operational risk.`);
  }

  if (gFlex > gCon + 15) {
    suggestions.push(`The group describes ${th} as significantly more Flexible (${Math.round(gFlex)}) than Consistent (${Math.round(gCon)}). This means discretion and improvisation are dominant — valuable for adapting to novel problems, but risky where consistency and procedural discipline are essential. Identify the three to five processes in ${th} where standardisation most directly protects quality, safety or compliance — and invest in making those genuinely consistent before extending flexibility elsewhere.`);
  } else if (gCon > gFlex + 15) {
    suggestions.push(`The group describes ${th} as significantly more Consistent (${Math.round(gCon)}) than Flexible (${Math.round(gFlex)}). This reflects strong process discipline — but it may constrain ${th}'s ability to respond to novel situations that fall outside established procedures. Create explicit channels for exception handling: clear escalation routes, time-bounded waivers, and post-hoc learning reviews when the standard procedure is overridden.`);
  }

  // 5. The gap between group as-is and the individual's desired profile
  const pGap = userTobeP - gProg;
  const dGap = userTobeD - gDef;
  if (Math.abs(pGap) > 12 || Math.abs(dGap) > 12) {
    const dir = pGap > 0 ? 'more progressive' : 'more defensive';
    suggestions.push(`Your personal desired profile calls for ${th} to be significantly ${dir} than the group average currently suggests it is. This gap between individual aspiration and collective current state is normal — but closing it requires more than individual intent. The most effective levers are leadership behaviour (what gets modelled and rewarded), structural design (what the organisation makes easy or hard to do), and narrative (the stories told about what success looks like).`);
  }

  // 6. Always add a consensus-building suggestion
  suggestions.push(`Facilitate a structured group dialogue using this data as the starting point — not the end point. Share the aggregate profile, present the areas of highest disagreement, and use these as prompts for conversation rather than conclusions. The goal is not to reach consensus on the scores, but to surface the different mental models that people in ${th} hold about how the organisation works — and why.`);

  // 7. Context-specific
  if (isNuclear) {
    suggestions.push(`In the nuclear sector, the tension between Preventative Control and Adaptive Innovation is particularly acute. ${capTh} needs both: the procedural discipline that prevents catastrophic error, and the adaptive capacity to tackle the complex, long-horizon challenges of the industry. Use this profile data to have an explicit conversation about which strategic modes apply to which domains of work — rather than treating the whole organisation as if it should operate in a single mode.`);
  } else if (ctx.length > 20) {
    suggestions.push(`Given the specific context of ${th}, consider how external stakeholders — regulators, customers, partners, funders — are implicitly shaping the current profile. Organisations often drift toward the strategic mode that their most powerful stakeholders reward. If the desired profile differs significantly from the current one, it is worth asking whether the external environment will support or resist that shift.`);
  }

  // 8. Action on most-agreed question
  if (highVarQs) {
    const allSorted = [...highVarQs].sort((a, b) => a.variance - b.variance);
    if (allSorted.length > 0 && allSorted[0].variance < 1.5) {
      const topConsensus = allSorted[0];
      suggestions.push(`The area of strongest agreement across ${th} is: "<em>${topConsensus.q.q}</em>" — where respondents gave remarkably consistent answers (mean right-side score: ${topConsensus.meanR.toFixed(1)}). This represents a genuine organisational characteristic that can be relied upon as a foundation for change. Any development programme should acknowledge and build on this shared strength rather than treating it as a problem to be fixed.`);
    }
  }

  return suggestions.slice(0, 10);
}

// Overlaid diamond chart for group
function GroupDiamondChart({ respondents }) {
  const scored = respondents.map(r => ({ ...scoreRespondent(r.s1, r.s2), name: r.name, isYou: r.isYou }));
  const n = scored.length;
  const mean = scored.reduce((acc, r) => ({
    def: acc.def + r.def / n, prog: acc.prog + r.prog / n,
    con: acc.con + r.con / n, flex: acc.flex + r.flex / n,
  }), { def: 0, prog: 0, con: 0, flex: 0 });

  return (
    <svg width={SZ} height={SZ} style={{ overflow: 'visible', maxWidth: '100%' }}>
      {[.25, .5, .75, 1].map(pct => <path key={pct} d={gridPath(pct)} fill="none" stroke="#e5e5e5" strokeWidth={pct === 1 ? 1.5 : 1} />)}
      <line x1={CX} y1={CY - RD} x2={CX} y2={CY + RD} stroke="#e5e5e5" />
      <line x1={CX - RD} y1={CY} x2={CX + RD} y2={CY} stroke="#e5e5e5" />
      {/* Other respondents — dashed grey */}
      {scored.filter(r => !r.isYou).map((r, i) => (
        <path key={i} d={shapePath({ p: r.prog, d: r.def, c: r.con, f: r.flex })}
          fill="#1a1a1a" fillOpacity={.04}
          stroke="#bbb" strokeWidth={1} strokeDasharray="4,3" strokeLinejoin="round" />
      ))}
      {/* You — solid orange thin */}
      {scored.filter(r => r.isYou).map((r, i) => (
        <path key={i} d={shapePath({ p: r.prog, d: r.def, c: r.con, f: r.flex })}
          fill="#e05528" fillOpacity={.08}
          stroke="#e05528" strokeWidth={1.5} strokeLinejoin="round" />
      ))}
      {/* Group mean — bold */}
      <path d={shapePath({ p: mean.prog, d: mean.def, c: mean.con, f: mean.flex })}
        fill="#1a1a1a" fillOpacity={.12}
        stroke="#1a1a1a" strokeWidth={2.5} strokeLinejoin="round" />
      {[['prog', mean.prog], ['flex', mean.flex], ['def', mean.def], ['con', mean.con]].map(([ax, sc]) => {
        const [x, y] = axisPt(ax, sc);
        return (
          <g key={ax}>
            <circle cx={x} cy={y} r={12} fill="#1a1a1a" />
            <text x={x} y={y + 4} textAnchor="middle" fill="#fff" fontSize={10} fontWeight={700} fontFamily="Open Sans,sans-serif">{Math.round(sc)}</text>
          </g>
        );
      })}
      <text x={CX} y={CY - RD - 16} textAnchor="middle" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="Open Sans,sans-serif">Progressive</text>
      <text x={CX + RD + 10} y={CY + 4} textAnchor="start" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="Open Sans,sans-serif">Flexible</text>
      <text x={CX} y={CY + RD + 26} textAnchor="middle" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="Open Sans,sans-serif">Defensive</text>
      <text x={CX - RD - 10} y={CY + 4} textAnchor="end" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="Open Sans,sans-serif">Consistent</text>
    </svg>
  );
}
