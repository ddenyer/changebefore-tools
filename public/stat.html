<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>STAT — Strategic Tensions Assessment Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'DM Sans',sans-serif;background:#f0ede8;color:#1a1a1a;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.fade{animation:fadeIn .3s ease both}
.shell{min-height:auto;display:flex;flex-direction:column}

.prog-wrap{max-width:100%;margin:0 auto;padding:1rem 2rem .2rem}
.prog-bars{display:flex;gap:3px;margin-bottom:.3rem}
.prog-bar{flex:1;height:3px;border-radius:2px;background:#d8d3cb;transition:background .3s}
.prog-bar.done{background:#e07030}
.prog-bar.now{background:#1a1a1a}
.prog-lbls{display:flex;gap:3px}
.prog-lbl{flex:1;font-size:.52rem;font-weight:700;letter-spacing:0;text-transform:uppercase;color:#b0a898;text-align:center;font-family:'DM Sans',sans-serif}
.prog-lbl.done{color:#e07030}
.prog-lbl.now{color:#1a1a1a}
@media(max-width:480px){.prog-lbl{font-size:.42rem;letter-spacing:0}}
.main{flex:1}
.content{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 3rem}
.land-hero{border-bottom:1px solid #d8d3cb;padding-bottom:2rem;margin-bottom:2rem}
.land-tag{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.75rem;font-family:'DM Sans',sans-serif}
.land-title{font-size:2.1rem;font-weight:600;color:#1a1a1a;line-height:1.15;margin-bottom:.65rem;font-family:'Cormorant Garamond',serif}
.land-desc{font-size:.95rem;color:#555;line-height:1.7;max-width:560px;font-family:'DM Sans',sans-serif}
.land-time{display:inline-flex;align-items:center;gap:.4rem;background:#e8e3dc;border-radius:20px;padding:.35rem .85rem;font-size:.75rem;font-weight:600;color:#888;margin-top:.85rem;font-family:'DM Sans',sans-serif}
.land-time::before{content:"⏱";font-size:.8rem}
.field-lbl{font-size:.72rem;font-weight:700;color:#555;display:block;margin-bottom:.35rem;letter-spacing:.03em;font-family:'DM Sans',sans-serif}
.field-sub{font-size:.72rem;color:#999;margin-bottom:.35rem;line-height:1.5;font-family:'DM Sans',sans-serif}
.inp{width:100%;border:1px solid #d8d3cb;border-radius:3px;padding:.72rem 1rem;font-family:'DM Sans',sans-serif;font-size:.9rem;color:#1a1a1a;outline:none;min-height:44px;transition:border-color .15s;background:#fff;display:block}
.inp:focus{border-color:#e07030}
.inp::placeholder{color:#c0b8ae}
.inp-ta{min-height:90px;resize:vertical;line-height:1.55}
.disc{font-size:.72rem;color:#888;line-height:1.6;padding:.75rem;background:#ebe7e0;border-radius:3px;border:1px solid #d8d3cb;margin-top:.5rem;font-family:'DM Sans',sans-serif}
.btn-p{display:inline-flex;align-items:center;gap:.4rem;background:#e07030;color:#fff;border:none;border-radius:3px;font-weight:700;padding:.78rem 1.6rem;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;min-height:44px;transition:opacity .15s}
.btn-p:hover:not([disabled]){opacity:.88}
.btn-p[disabled]{opacity:.3;cursor:not-allowed}
.btn-s{display:inline-flex;align-items:center;gap:.4rem;background:#f0ede8;color:#1a1a1a;border:1px solid #d8d3cb;border-radius:3px;font-weight:500;padding:.78rem 1.2rem;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;min-height:44px;transition:border-color .15s}
.btn-s:hover{border-color:#1a1a1a}
.btn-row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1.75rem}
.sec-tag{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.5rem;font-family:'DM Sans',sans-serif}
.pg-title{font-size:1.55rem;font-weight:600;color:#1a1a1a;line-height:1.3;margin-bottom:.35rem;font-family:'Cormorant Garamond',serif}
.pg-sub{font-size:.875rem;color:#666;margin-bottom:1.4rem;line-height:1.65;font-family:'DM Sans',sans-serif}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;color:#888;cursor:pointer;padding:0;margin-bottom:1.5rem}
.back-btn:hover{color:#1a1a1a}
.inf-box{background:#ebe7e0;border-left:3px solid #e07030;padding:.85rem 1.1rem;border-radius:0 3px 3px 0;margin-bottom:1.2rem;font-size:.875rem;line-height:1.6;color:#555;font-family:'DM Sans',sans-serif}
.warn-box{background:#fff8f6;border:1px solid #f0b8a8;border-radius:3px;padding:.85rem 1.1rem;margin:.7rem 0;font-size:.82rem;color:#c0392b;font-family:'DM Sans',sans-serif}
.divider{border:none;border-top:1px solid #d8d3cb;margin:1.5rem 0}
.q-cat-hdr{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#b0a898;padding:.5rem 0;margin-top:1.25rem;margin-bottom:.35rem;border-top:1px solid #d8d3cb;font-family:'DM Sans',sans-serif}
.q-card{border:1px solid #d8d3cb;border-radius:4px;padding:1rem;margin-bottom:.5rem;background:#fff;transition:border-color .2s}
.q-card.active{border-color:#1a1a1a}
.q-card.done{border-color:#d8d3cb;opacity:.85}
.q-card.locked{opacity:.45;pointer-events:none}
.q-card-title{font-size:.8rem;font-weight:700;color:#1a1a1a;margin-bottom:.75rem;line-height:1.45;font-family:'DM Sans',sans-serif}
.q-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:.65rem;align-items:center}
.q-opt{border-radius:3px;padding:.6rem .75rem;font-size:.77rem;line-height:1.45;transition:all .15s;font-family:'DM Sans',sans-serif}
.q-opt-side{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.2rem;font-family:'DM Sans',sans-serif}
.q-inputs{display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:110px}
.q-input-row{display:flex;align-items:center;gap:.35rem}
.q-num{width:46px;height:46px;text-align:center;border-radius:3px;font-size:1rem;font-weight:700;font-family:'DM Sans',sans-serif;outline:none;border:1px solid #d8d3cb;background:#fff;color:#1a1a1a}
.q-stepper{display:flex;align-items:center;gap:4px}
.q-step-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid #d8d3cb;background:#f0ede8;font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;line-height:1;padding:0;flex-shrink:0;user-select:none;font-family:'DM Sans',sans-serif}
.q-step-btn:hover:not([disabled]){background:#e8e3dc;border-color:#b0a898}
.q-step-btn[disabled]{opacity:.3;cursor:not-allowed}
.q-val{width:32px;text-align:center;font-size:1rem;font-weight:700;font-family:'DM Sans',sans-serif;color:#1a1a1a}
.q-num:focus{border-color:#e07030}
.q-num.over{border-color:#e07030;background:#fff8f6}
.q-num:disabled{opacity:.5;cursor:not-allowed}
.q-sep{color:#d8d3cb;font-weight:700;font-size:1.1rem}
.q-hint{font-size:.63rem;color:#b0a898;text-align:center;font-family:'DM Sans',sans-serif}
.q-hint.over{color:#e07030;font-weight:700}
.q-hint.ok{color:#27ae60;font-weight:600}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin:1.2rem 0}
.score-card{border:1px solid #d8d3cb;border-radius:3px;padding:.9rem;background:#fff}
.score-dim{font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#b0a898;margin-bottom:.2rem;font-family:'DM Sans',sans-serif}
.score-val{font-size:1.55rem;font-weight:700;color:#e07030;line-height:1;font-family:'DM Sans',sans-serif}
.score-lbl{font-size:.75rem;color:#666;margin-top:.15rem;font-family:'DM Sans',sans-serif}
.score-bar{height:3px;background:#d8d3cb;border-radius:2px;margin-top:.55rem;overflow:hidden}
.score-fill{height:100%;background:#e07030;border-radius:2px}
.slider-wrap{margin-bottom:1.25rem}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem}
.slider-lbl{font-size:.84rem;font-weight:600;color:#1a1a1a;flex:1;padding-right:1rem;line-height:1.3;font-family:'DM Sans',sans-serif}
.slider-val{font-size:1.1rem;font-weight:700;color:#e07030;flex-shrink:0;font-family:'DM Sans',sans-serif}
.slider-val span{font-size:.68rem;color:#b0a898;font-weight:400}
.slider-track{position:relative;height:28px;display:flex;align-items:center}
.slider-bg{height:6px;background:#d8d3cb;border-radius:3px;width:100%;overflow:hidden;position:relative}
.slider-fill{height:100%;background:#e07030;border-radius:3px;transition:width .1s}
.slider-input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1;-webkit-appearance:none;appearance:none}
.slider-input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px}
.slider-input::-moz-range-thumb{width:22px;height:22px}
.slider-thumb{position:absolute;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #e07030;box-shadow:0 1px 4px rgba(0,0,0,.15);pointer-events:none;transition:left .1s}
.slider-section{border:1px solid #d8d3cb;border-radius:4px;padding:1.25rem;background:#ebe7e0;margin-bottom:1rem}
.rpt-tabs{display:flex;gap:0;border-bottom:2px solid #d8d3cb;margin-bottom:1.75rem}
.rpt-tab{padding:.6rem 1rem;font-size:.78rem;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:#b0a898;transition:all .2s;white-space:nowrap;font-family:'DM Sans',sans-serif}
.rpt-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.rpt-tab:hover:not(.active){color:#555}
.rpt-section{margin-bottom:1.5rem}
.da-summary{background:#fff;border:1px solid #d8d3cb;border-left:4px solid #1a1a1a;border-radius:4px;padding:1.25rem 1.5rem;margin-bottom:1.75rem}
.da-summary-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1a1a1a;margin-bottom:.5rem;font-family:'DM Sans',sans-serif}
.da-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.75rem}
.da-card{background:#fff;border:1px solid #d8d3cb;border-top:3px solid #e07030;border-radius:4px;padding:1.1rem 1.25rem}
.da-card-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.5rem;font-family:'DM Sans',sans-serif}
.da-lower{display:flex;flex-direction:column;gap:.85rem;margin-bottom:1.5rem}
.da-lower-card{background:#fff;border:1px solid #d8d3cb;border-radius:4px;padding:1.1rem 1.25rem}
.da-lower-card.best{border-left:4px solid #16a34a}
.da-lower-card.blind{border-left:4px solid #dc2626}
.da-lower-card.areas{border-left:4px solid #2563eb}
.da-lower-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;font-family:'DM Sans',sans-serif}
.da-lower-card.best .da-lower-heading{color:#16a34a}
.da-lower-card.blind .da-lower-heading{color:#dc2626}
.da-lower-card.areas .da-lower-heading{color:#2563eb}
@media(max-width:600px){.da-grid{grid-template-columns:1fr}}
.rpt-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.5rem;font-family:'DM Sans',sans-serif}
.rpt-body{font-size:.875rem;line-height:1.75;color:#1a1a1a;margin-bottom:.65rem;font-family:'DM Sans',sans-serif}
.rpt-subhead{font-size:.84rem;font-weight:700;color:#1a1a1a;margin:.9rem 0 .35rem;font-family:'Cormorant Garamond',serif}
.chart-pair{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin:1.25rem 0}
.chart-box{border:1px solid #d8d3cb;border-radius:4px;padding:1.25rem;background:#fff;text-align:center}
.chart-lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:.75rem;font-family:'DM Sans',sans-serif}
.sug-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1rem}
.sug-col-hdr{font-size:.65rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#1a1a1a;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:2px solid #1a1a1a;font-family:'DM Sans',sans-serif}
.sug-item{display:flex;gap:.65rem;align-items:flex-start;padding:.65rem 0;border-bottom:1px solid #ebe7e0}
.sug-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#e07030;color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;font-family:'DM Sans',sans-serif}
.sug-txt{font-size:.85rem;line-height:1.6;color:#1a1a1a;font-family:'DM Sans',sans-serif}
.mock-badge{background:#1a1a1a;color:#e07030;font-size:.63rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.22rem .55rem;border-radius:2px;display:inline-block;margin-bottom:.9rem;font-family:'DM Sans',sans-serif}
.strat-badge{display:inline-flex;align-items:flex-start;gap:.5rem;background:#ebe7e0;border:1px solid #d8d3cb;border-radius:3px;padding:.5rem .9rem;margin:.7rem 0}
.strat-dot{width:10px;height:10px;border-radius:50%;background:#e07030;flex-shrink:0;margin-top:3px}
.strat-name{font-size:.84rem;font-weight:700;color:#1a1a1a;font-family:'DM Sans',sans-serif}
.think{display:flex;align-items:center;gap:.75rem;padding:1.5rem 0}
.dots{display:flex;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#e07030;animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
.think-txt{font-size:.875rem;color:#888;font-style:italic;font-family:'DM Sans',sans-serif}
.ctx-optional{display:flex;align-items:center;gap:.4rem;margin:.9rem 0 .25rem}
.ctx-opt-lbl{font-size:.7rem;font-weight:700;color:#b0a898;letter-spacing:.06em;text-transform:uppercase;font-family:'DM Sans',sans-serif}
.ctx-opt-bar{flex:1;height:1px;background:#d8d3cb}
.gap-summary{border:1px solid #d8d3cb;border-radius:4px;overflow:hidden;margin:1.25rem 0;background:#fff}
.gap-row{display:grid;grid-template-columns:1fr 60px 60px 80px;gap:.5rem;align-items:center;padding:.6rem .9rem;border-bottom:1px solid #ebe7e0;font-size:.82rem;font-family:'DM Sans',sans-serif}
.gap-row:last-child{border-bottom:none}
.gap-row.hdr{background:#ebe7e0;font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#888}
.gap-val{text-align:center;font-weight:700}
.gap-pos{color:#27ae60}
.gap-neg{color:#e07030}
.gap-zero{color:#b0a898}
.gap-badge{font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .45rem;border-radius:2px;text-align:center;font-family:'DM Sans',sans-serif}
.gap-large{background:#fff3cd;color:#856404}
.gap-medium{background:#d4edda;color:#155724}
.gap-small{background:#e2e3e5;color:#383d41}
/* Group report */
.grp-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem;align-items:center}
.grp-leg-item{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:#666;font-family:'DM Sans',sans-serif}
.grp-leg-line{width:22px;height:2px;flex-shrink:0}
.grp-leg-line.you{background:#e07030}
.grp-leg-line.others{background:#aaa;background:repeating-linear-gradient(90deg,#aaa 0,#aaa 4px,transparent 4px,transparent 7px)}
.grp-leg-line.mean{background:#1a1a1a}
.var-table{border:1px solid #d8d3cb;border-radius:4px;overflow:hidden;margin:1.25rem 0;background:#fff}
.var-row{display:grid;grid-template-columns:2fr 60px 1fr 80px;gap:.5rem;align-items:center;padding:.55rem .9rem;border-bottom:1px solid #ebe7e0;font-size:.78rem;font-family:'DM Sans',sans-serif}
.var-row:last-child{border-bottom:none}
.var-row.hdr{background:#ebe7e0;font-size:.62rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#888}
.var-bar-wrap{display:flex;align-items:center;gap:.45rem}
.var-bar-bg{flex:1;height:6px;background:#d8d3cb;border-radius:3px;overflow:hidden;min-width:40px}
.var-bar-fill{height:100%;border-radius:3px}
.cons-badge{font-size:.63rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.14rem .42rem;border-radius:2px;white-space:nowrap;font-family:'DM Sans',sans-serif}
.cons-high{background:#fde8e8;color:#c0392b}
.cons-med{background:#fff3cd;color:#856404}
.cons-low{background:#d4edda;color:#155724}
.resp-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.25rem}
.code-fix-btn{background:none;border:none;padding:0;font-size:.75rem;color:#2563eb;cursor:pointer;text-decoration:underline;margin-top:.4rem;display:inline-block;font-family:'DM Sans',sans-serif}
.code-fix-box{margin-top:.75rem;padding:.75rem 1rem;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.code-fix-box input{flex:1;min-width:120px;padding:.4rem .6rem;border:1px solid #93c5fd;border-radius:5px;font-size:.82rem;font-family:'DM Sans',sans-serif}
.code-fix-box .apply-btn{background:#2563eb;color:#fff;border:none;padding:.4rem .85rem;border-radius:5px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.code-fix-box .apply-btn:hover{background:#1d4ed8}
.resp-chip{font-size:.72rem;font-weight:600;padding:.25rem .7rem;border-radius:20px;border:1px solid #d8d3cb;color:#555;background:#ebe7e0;font-family:'DM Sans',sans-serif}
.resp-chip.you{background:#e07030;color:#fff;border-color:#e07030}
.grp-chart-pair{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin:1.25rem 0}
.grp-stat-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #ebe7e0;font-size:.82rem;font-family:'DM Sans',sans-serif}
.grp-stat-row:last-child{border-bottom:none}
.grp-stat-lbl{color:#666}
.grp-stat-val{font-weight:700;color:#e07030}
.grp-sug-item{display:flex;gap:.65rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid #ebe7e0}
.grp-sug-item:last-child{border-bottom:none}
.grp-sug-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#1a1a1a;color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;font-family:'DM Sans',sans-serif}
.grp-sug-txt{font-size:.85rem;line-height:1.65;color:#1a1a1a;font-family:'DM Sans',sans-serif}
.legend-row{display:flex;flex-wrap:wrap;gap:.65rem 1.25rem;margin-top:.85rem;justify-content:center}
.legend-item{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:#555;font-weight:600;font-family:'DM Sans',sans-serif}
.legend-swatch{width:28px;height:3px;flex-shrink:0;border-radius:2px}
.submit-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;background:#ebe7e0;border:1px solid #d8d3cb;border-radius:6px;padding:.85rem 1.1rem;margin-bottom:1.5rem}
.submit-count{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.part-circles{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.part-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;font-family:'DM Sans',sans-serif;transition:all .5s;flex-shrink:0;position:relative}
.part-circle.started{background:#f0ede8;border:2.5px solid #e07030;color:#e07030}
.part-circle.completed{background:#e07030;border:2.5px solid #e07030;color:#fff}
.part-circle.others-started{background:#f0ede8;border:2.5px solid #e07030;color:#e07030}
.part-circle.others-completed{background:#e07030;border:2.5px solid #e07030;color:#fff}
.submit-txt{font-size:.78rem;font-weight:700;color:#1a1a1a;font-family:'DM Sans',sans-serif}
.refresh-btn{display:flex;align-items:center;gap:.4rem;background:#e07030;color:#fff;border:none;border-radius:4px;padding:.5rem 1rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.refresh-btn:hover{background:#c85e20}

function getStrategy(d,p,c,f){
  const max=Math.max(d,p,c,f),min=Math.min(d,p,c,f);
  if(max-min<15)return'neutral';
  const mind=p>d?'prog':'def';
  const app=f>c?'flex':'con';
  if(mind==='prog'&&app==='con')return'performance_optimization';
  if(mind==='prog'&&app==='flex')return'adaptive_innovation';
  if(mind==='def'&&app==='con')return'preventative_control';
  return'mindful_action';
}
const SLABELS={preventative_control:'Preventative Control',mindful_action:'Mindful Action',performance_optimization:'Performance Optimisation',adaptive_innovation:'Adaptive Innovation',neutral:'Neutral'};
const SDESC={
  preventative_control:'Monitoring and complying — a defensive strategy based on consistency.',
  mindful_action:'Noticing and responding — a defensive strategy based on flexibility.',
  performance_optimization:'Improving and exploiting — a progressive strategy based on consistency.',
  adaptive_innovation:'Imagining and creating — a progressive strategy based on flexibility.',
  neutral:'A balanced combination of all four core strategies.',
};

// Diamond chart
const MX=120,SZ=260,CX=130,CY=130,RD=90;
function axisPt(ax,sc){const r=(sc/MX)*RD;if(ax==='prog')return[CX,CY-r];if(ax==='flex')return[CX+r,CY];if(ax==='def')return[CX,CY+r];return[CX-r,CY];}
function shapePath(s){const pts=[[CX,CY-(s.p/MX)*RD],[CX+(s.f/MX)*RD,CY],[CX,CY+(s.d/MX)*RD],[CX-(s.c/MX)*RD,CY]];return pts.map((pt,i)=>`${i===0?'M':'L'}${pt[0]},${pt[1]}`).join(' ')+' Z';}
function gridPath(pct){const r=RD*pct;return `M${CX},${CY-r} L${CX+r},${CY} L${CX},${CY+r} L${CX-r},${CY} Z`;}
function ExpandableDiamond({children,title=''}){
  const [open,setOpen]=React.useState(false);
  return(
    <div>
      <div style={{cursor:'pointer'}} onClick={()=>setOpen(true)} title="Tap to expand">
        {children}
        <div className="diamond-expand-hint">⤢ tap to expand</div>
      </div>
      {open&&(
        <div className="diamond-fullscreen-overlay" onClick={()=>setOpen(false)}>
          <div className="diamond-fullscreen-inner" onClick={e=>e.stopPropagation()}>
            <button className="diamond-fullscreen-close" onClick={()=>setOpen(false)}>✕</button>
            {title&&<div style={{textAlign:'center',fontWeight:700,marginBottom:'.75rem',fontSize:'.9rem',fontFamily:"'DM Sans',sans-serif"}}>{title}</div>}
            {children}
          </div>
        </div>
      )}
    </div>
  );
}

function DiamondChart({p=0,d=0,c=0,f=0,color='#e07030',prevProfile=null}){
  return(
    <svg width={SZ} height={SZ} style={{overflow:'visible',maxWidth:'100%'}}>
      {[.25,.5,.75,1].map(pct=><path key={pct} d={gridPath(pct)} fill="none" stroke="#d8d3cb" strokeWidth={pct===1?1.5:1}/>)}
      <line x1={CX} y1={CY-RD} x2={CX} y2={CY+RD} stroke="#d8d3cb"/>
      <line x1={CX-RD} y1={CY} x2={CX+RD} y2={CY} stroke="#d8d3cb"/>
      {prevProfile&&<path d={shapePath({p:prevProfile.prog,d:prevProfile.def,c:prevProfile.con,f:prevProfile.flex})}
        fill="none" stroke="#94a3b8" strokeWidth={1.5} strokeDasharray="5,4" strokeLinejoin="round" opacity={0.6}/>}
      <path d={shapePath({p,d,c,f})} fill={color} fillOpacity={.13} stroke={color} strokeWidth={2} strokeLinejoin="round"/>
      {[['prog',p],['flex',f],['def',d],['con',c]].map(([ax,sc])=>{const[x,y]=axisPt(ax,sc);return(
        <g key={ax}><circle cx={x} cy={y} r={12} fill={color}/><text x={x} y={y+4} textAnchor="middle" fill="#fff" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">{Math.round(sc)}</text></g>
      );})}
      <text x={CX} y={CY-RD-16} textAnchor="middle" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Progressive</text>

      <text x={CX-RD-10} y={CY+4} textAnchor="end" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Consistent</text>
    </svg>
  );
}

// Question section
function QuestionSection({secData,answers,onChange,activeIdx,setActiveIdx}){
  const allQ=secData.categories.flatMap(c=>c.qs);
  const firstUnanswered=allQ.findIndex((_,i)=>{const a=answers[i];const lv=parseInt(a?.l)||0,rv=parseInt(a?.r)||0;return(lv+rv)===0;});
  const maxUnlocked=firstUnanswered===-1?allQ.length-1:firstUnanswered;
  return(
    <div>
      <div className="inf-box">
        Allocate up to 10 points between each pair of statements. Split in any way you see as appropriate (e.g. 10-0, 8-2, 5-5, 0-10). You may allocate less than 10 if neither statement fully reflects your organisation. <strong>You cannot allocate more than 10 points and half-points are not allowed.</strong>
      </div>
      {secData.categories.map(cat=>(
        <div key={cat.name}>
          <div className="q-cat-hdr">{cat.name}</div>
          {cat.qs.map(q=>{
            const idx=allQ.findIndex(x=>x.id===q.id);
            const a=answers[idx]||{l:'',r:''};
            const lv=parseInt(a.l)||0,rv=parseInt(a.r)||0;
            const total=lv+rv,over=total>10,rem=10-total;
            const done=total>0&&!over;
            const locked=idx>maxUnlocked;
            const isActive=idx===activeIdx||(activeIdx<0&&idx===0);
            const lActive=lv>0,rActive=rv>0;
            function handleL(val){
              const n=Math.max(0,Math.min(parseInt(val)||0,10));
              const maxR=10-n;const newR=Math.min(rv,maxR);
              const u=[...answers];u[idx]={l:String(n),r:String(newR)};onChange(u);setActiveIdx(idx);
            }
            function handleR(val){
              const n=Math.max(0,Math.min(parseInt(val)||0,10));
              const maxL=10-n;const newL=Math.min(lv,maxL);
              const u=[...answers];u[idx]={l:String(newL),r:String(n)};onChange(u);setActiveIdx(idx);
            }
            return(
              <div key={q.id} className={`q-card${locked?' locked':isActive?' active':done?' done':''}`} onClick={()=>!locked&&setActiveIdx(idx)}>
                <div className="q-card-title">{idx+1}. {q.q}</div>
                <div className="q-grid">
                  <div className="q-opt" style={{background:lActive?'#fff8f5':'#faf8f5',border:lActive?'1px solid #e07030':'1px solid #e0dbd4',color:lActive?'#1a1a1a':'#666'}}>
                    <div className="q-opt-side" style={{color:lActive?'#e07030':'#c0b8ae'}}>Option A</div>
                    {q.l}
                  </div>
                  <div className="q-inputs">
                    <div className="q-input-row">
                      <div className="q-stepper">
                        <button className="q-step-btn" aria-label={`Decrease Option A score for question ${idx+1}`} disabled={locked||lv<=0} onClick={e=>{e.stopPropagation();handleL(String(lv-1));}}>−</button>
                        <div className={`q-val${over?' over':''}`}>{lv}</div>
                        <button className="q-step-btn" aria-label={`Increase Option A score for question ${idx+1}`} disabled={locked||total>=10} onClick={e=>{e.stopPropagation();handleL(String(lv+1));}}>+</button>
                      </div>
                      <span className="q-sep">|</span>
                      <div className="q-stepper">
                        <button className="q-step-btn" aria-label={`Decrease Option B score for question ${idx+1}`} disabled={locked||rv<=0} onClick={e=>{e.stopPropagation();handleR(String(rv-1));}}>−</button>
                        <div className={`q-val${over?' over':''}`}>{rv}</div>
                        <button className="q-step-btn" aria-label={`Increase Option B score for question ${idx+1}`} disabled={locked||total>=10} onClick={e=>{e.stopPropagation();handleR(String(rv+1));}}>+</button>
                      </div>
                    </div>
                    <div className={`q-hint${over?' over':done?' ok':''}`}>
                      {over?`${total-10} over limit`:done?`✓ ${total} pts`:rem===10?'up to 10 pts':`${rem} pts remaining`}
                    </div>
                  </div>
                  <div className="q-opt" style={{background:rActive?'#fff8f5':'#faf8f5',border:rActive?'1px solid #e07030':'1px solid #e0dbd4',color:rActive?'#1a1a1a':'#666'}}>
                    <div className="q-opt-side" style={{color:rActive?'#e07030':'#c0b8ae'}}>Option B</div>
                    {q.r}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// Slider — coupled: moving one adjusts its pair
function Slider({label,value,onChange,max=120,asIs=null}){
  return(
    <div className="slider-wrap">
      <div className="slider-top">
        <div className="slider-lbl">{label}</div>
        <div className="slider-val">
          {Math.round(value)}<span> / {max}</span>
          {asIs!==null&&<span style={{marginLeft:'.5rem',fontSize:'.65rem',color:'#b0a898',fontWeight:400}}>current: {Math.round(asIs)}</span>}
        </div>
      </div>
      <div className="slider-track">
        <div className="slider-bg"><div className="slider-fill" style={{width:`${(value/max)*100}%`}}/></div>
        <input type="range" min="0" max={max} value={value} onChange={e=>onChange(Number(e.target.value))} className="slider-input" aria-label={label}/>
        <div className="slider-thumb" style={{left:`${(value/max)*100}%`}}/>
        {asIs!==null&&(
          <div style={{position:'absolute',left:`${(asIs/max)*100}%`,transform:'translateX(-50%)',top:'-4px',width:'2px',height:'30px',background:'#e07030',opacity:.35,pointerEvents:'none',borderRadius:'2px'}} title={`Current as-is: ${Math.round(asIs)}`}/>
        )}
      </div>
      {asIs!==null&&<div style={{fontSize:'.62rem',color:'#c0b8ae',marginTop:'.15rem',fontFamily:"'DM Sans',sans-serif"}}>▲ orange line = your current as-is score</div>}
    </div>
  );
}


const STEPS=['Start','Focus','Context','Survey','Profile','Future','Report'];
// Map 8 flow steps (0-7) to 7 nav positions — Survey 1 (step 3) and Survey 2 (step 4) both show as nav step 3
function stepToNav(s){return s<=3?s:s===4?3:s-1;}
function Progress({step}){const nav=stepToNav(step);return(<div className="prog-wrap"><div className="prog-bars">{STEPS.map((_,i)=><div key={i} className={`prog-bar${i<nav?' done':i===nav?' now':''}`}/>)}</div><div className="prog-lbls">{STEPS.map((s,i)=><div key={i} className={`prog-lbl${i<nav?' done':i===nav?' now':''}`}>{s}</div>)}</div></div>);}
function BackBtn({onClick}){return(<button className="back-btn" onClick={onClick} aria-label="Go back to previous step">← Back</button>);}

// Gap analysis logic
function computeGaps(prog,def,con,flex,tp,td,tc,tf){
  const pGap=tp-prog,dGap=td-def,cGap=tc-con,fGap=tf-flex;
  const mindsetGap=Math.abs(pGap)+Math.abs(dGap);
  const approachGap=Math.abs(cGap)+Math.abs(fGap);
  return{pGap,dGap,cGap,fGap,mindsetGap,approachGap};
}
function gapLabel(g){if(Math.abs(g)<8)return'small';if(Math.abs(g)<20)return'medium';return'large';}
function gapBadgeText(g){if(Math.abs(g)<8)return'Minor tweak';if(Math.abs(g)<20)return'Moderate shift';return'Significant change';}

function generateSuggestions(prog,def,con,flex,tp,td,tc,tf,thing,s1ans,s2ans){
  const th=thing||'your organisation';
  const pGap=tp-prog, dGap=td-def, cGap=tc-con, fGap=tf-flex;

  function sc(ans,i){const lv=parseInt(ans[i]?.l)||0,rv=parseInt(ans[i]?.r)||0;return{lv,rv,total:lv+rv,diff:rv-lv};}

  const S1Q={
    0:{
      aL:`On the question of <em>what ${th} pays attention to in strategy</em>, your scores show you currently lean toward protecting existing capabilities. As a small experiment this week: in your next planning conversation, add one explicit question — "What new capability do we need that we don't currently have?" — before any discussion of what to protect. Notice what comes up.`,
      aR:`On the question of <em>what ${th} pays attention to in strategy</em>, your scores show you lean toward transformation. Your desired direction calls for more grounding. Experiment: before your next strategic initiative, spend 15 minutes writing down what you are putting at risk and what the minimum safeguard looks like. Do this before the excitement takes over.`,
      qL:`Your scores show ${th}'s strategy focuses on protecting what exists. If you imagine the organisation three years from now having stayed primarily protective — what is the thing you most fear will have been missed or lost because you didn't reach for something new?`,
      qR:`Your strategy orientation leans toward change and transformation. What is the thing that currently works reliably and well in ${th} that could quietly erode if the focus on change is not balanced with a commitment to protect it?`
    },
    1:{
      aL:`Your scores on <em>what stops ${th} from failing</em> show you lean toward prevention and control. Experiment: in your next team meeting, add one question to the agenda — "What opportunity are we not pursuing because we are focused on not failing?" Give it ten minutes and listen carefully.`,
      aR:`Your scores show ${th} stays viable through prospecting and pushing for improvement. Your desired direction calls for more defensive grounding. Experiment: pick your most active current initiative and spend 20 minutes on a simple pre-mortem — "Assume this has failed. What is the most likely reason?" Use that to identify one thing to put in place now.`,
      qL:`You believe ${th} avoids failure through control and prevention. When a genuine opportunity appeared that didn't fit the protective framework — what happened to it? And does that response serve ${th} well?`,
      qR:`You see ${th} as staying viable by continuously challenging and improving. What risk are you currently most underestimating — and what would it take to take it seriously without losing your forward momentum?`
    },
    2:{
      aL:`Your scores on <em>the key dimensions of success</em> show you lean toward predictability and risk reduction. Experiment: add one growth or capability-building metric to your next performance review — even a small or informal one. Notice how it feels to track it alongside your existing stability measures.`,
      aR:`Your scores show you see growth and targets as the core of success. Your desired direction calls for more protective grounding. Experiment: identify the one area where the pursuit of growth has created the most fragility — and introduce one small safeguard this month, before it becomes a problem.`,
      qL:`You measure success through predictability and risk reduction. What would ${th} look like if it was equally serious about what it was building — not just what it was protecting? What would change first?`,
      qR:`You see growth and competitive achievement as core to success. What would it mean for ${th} to be genuinely successful in a way that didn't depend on growth metrics — and is there something in that picture worth holding onto?`
    },
    3:{
      aL:`Your scores on <em>what ${th} values in its people</em> show you lean toward caution and reliability. Experiment: identify one person this week who is pushing at the edges of how things are done — and instead of managing that behaviour, ask them a genuine question about what they are trying to achieve.`,

      aR:`Your scores show you see leadership as inspiring and building buy-in. Your desired direction calls for more clarity and structure. Experiment: identify one decision that is currently waiting on consensus and make it unilaterally this week — clearly, with a brief explanation of the reasoning. Notice the difference.`,

    5:{

    8:{

    10:{

  function buildSection(catName, offset){
    const candidates=[];
    for(let i=0;i<3;i++){
      const s1={...sc(s1ans,offset+i),qi:offset+i,survey:'s1'};
      const s2={...sc(s2ans,offset+i),qi:offset+i,survey:'s2'};
      const s1leverage=pGap>0?(s1.lv-s1.rv):dGap>0?(s1.rv-s1.lv):Math.abs(s1.diff);
      const s1dir=s1.diff<0?'L':'R';
      const s2leverage=fGap>0?(s2.lv-s2.rv):cGap>0?(s2.rv-s2.lv):Math.abs(s2.diff);
      const s2dir=s2.diff<0?'L':'R';
      if(s1.total>0) candidates.push({leverage:s1leverage,qi:offset+i,survey:'s1',dir:s1dir,score:s1});
      if(s2.total>0) candidates.push({leverage:s2leverage,qi:offset+i,survey:'s2',dir:s2dir,score:s2});
    }
    candidates.sort((a,b)=>b.leverage-a.leverage);
    const top=candidates[0];
    const second=candidates[1]||candidates[0];
    function getText(c,type){
      const lib=c.survey==='s1'?S1Q:S2Q;
      const entry=lib[c.qi];
      if(!entry)return null;
      return c.dir==='L'?entry[type+'L']:entry[type+'R'];
    }
    const action=top?getText(top,'a')||`Identify the one decision you are facing right now in ${catName.toLowerCase()} where your as-is and desired profiles point in different directions — and run a small experiment this week using the approach your desired profile calls for.`:null;
    const question=second?getText(second,'q')||`What would someone who understood ${catName.toLowerCase()} in ${th} deeply — but had no stake in how it currently works — tell you is the single most important thing to change?`:null;
    return{
      action:action||`Identify the one change in ${catName.toLowerCase()} that would most close the gap between where ${th} is and where you want it to be — and take one small step toward it this week.`,
      question:question||`If your desired profile for ${catName.toLowerCase()} was already in place today, what would be the first thing you would notice that was different?`
    };
  }
  return{
    purpose:buildSection('Purpose',0),
    people:buildSection('People',3),
    process:buildSection('Process',6),
    product:buildSection('Product',9),
  };
}

function generateContextualAnalysis(strat,thing,thingDesc,defineText,contextDoc,prog,def,con,flex){
  const th=thing||'the organisation';
  const ctx=[thingDesc,defineText,contextDoc].filter(Boolean).join(' ').toLowerCase();
  const isNuclear=ctx.includes('nuclear')||ctx.includes('sellafield')||ctx.includes('decommission')||ctx.includes('nda');
  const isPublic=ctx.includes('public sector')||ctx.includes('government')||ctx.includes('nhs')||ctx.includes('council');
  const isFinance=ctx.includes('bank')||ctx.includes('financial')||ctx.includes('fund')||ctx.includes('insurance');
  const isTech=ctx.includes('tech')||ctx.includes('software')||ctx.includes('digital')||ctx.includes('platform');
  let industryContext='';
  if(isNuclear)industryContext=`In the nuclear sector — where ${th} operates — the consequences of failure can be catastrophic and irreversible. This makes a strong defensive and consistent foundation not just strategically sensible but a regulatory and safety imperative. The challenge for organisations like ${th} is not whether to be defensive, but whether that defensive posture has become so dominant that it prevents the kind of progressive, adaptive thinking needed to tackle the complex, long-horizon challenges of decommissioning, workforce transformation and changing stakeholder expectations.`;
  else if(isPublic)industryContext=`Operating in the public sector, ${th} faces the particular challenge of balancing accountability and consistency — essential for public trust — with the flexibility and innovation increasingly demanded by a changing service landscape. The risk for public sector organisations is that compliance culture becomes a substitute for strategic thinking.`;
  else if(isFinance)industryContext=`In financial services, the regulatory environment creates strong structural pressures toward defensive and consistent strategies. The resilience challenge for ${th} is ensuring that these necessary constraints do not crowd out the forward-looking, adaptive capacity needed to remain relevant in a rapidly changing market.`;
  else if(isTech)industryContext=`In the technology sector, the competitive landscape rewards speed, experimentation and adaptive innovation. The risk for ${th} is that the pressure to innovate can erode the consistent operational foundations — the processes, standards and governance — that enable sustainable scaling.`;
  else if(ctx.length>20)industryContext=`Considered in the context of ${th}'s specific situation, the profile reflects the organisation's current strategic anchoring — where the dominant mode of working has become embedded in purpose, people, process and product.`;
  return industryContext;
}

function CombinedDiamondChart({yourProfile, groupProfile, otherProfiles=[], yourColor='#e07030', groupColor='#2563eb', title}){
  if(!groupProfile) return null;
  return(
    <div style={{textAlign:'center'}}>
      {title&&<div className="chart-lbl" style={{marginBottom:'.5rem'}}>{title}</div>}
      <svg width={SZ} height={SZ} style={{overflow:'visible',maxWidth:'100%',display:'block',margin:'0 auto'}}>
        {[.25,.5,.75,1].map(pct=><path key={pct} d={gridPath(pct)} fill="none" stroke="#d8d3cb" strokeWidth={pct===1?1.5:1}/>)}
        <line x1={CX} y1={CY-RD} x2={CX} y2={CY+RD} stroke="#d8d3cb"/>
        <line x1={CX-RD} y1={CY} x2={CX+RD} y2={CY} stroke="#d8d3cb"/>
        {otherProfiles.map((r,i)=>(
          <path key={i} d={shapePath({p:r.prog,d:r.def,c:r.con,f:r.flex})}

        ))}
        <path d={shapePath({p:groupProfile.prog,d:groupProfile.def,c:groupProfile.con,f:groupProfile.flex})}

        {yourProfile&&<path d={shapePath({p:yourProfile.prog,d:yourProfile.def,c:yourProfile.con,f:yourProfile.flex})}

        {[['prog',groupProfile.prog],['flex',groupProfile.flex],['def',groupProfile.def],['con',groupProfile.con]].map(([ax,sc])=>{
          const[x,y]=axisPt(ax,sc);
          return(<g key={'g'+ax}><circle cx={x} cy={y} r={11} fill={groupColor}/><text x={x} y={y+4} textAnchor="middle" fill="#fff" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">{Math.round(sc)}</text></g>);
        })}
        {yourProfile&&[['prog',yourProfile.prog],['flex',yourProfile.flex],['def',yourProfile.def],['con',yourProfile.con]].map(([ax,sc])=>{
          const[x,y]=axisPt(ax,sc);
          return(<g key={'y'+ax}><circle cx={x} cy={y} r={9} fill={yourColor} stroke="#fff" strokeWidth={1.5}/><text x={x} y={y+3} textAnchor="middle" fill="#fff" fontSize={9} fontWeight={700} fontFamily="DM Sans,sans-serif">{Math.round(sc)}</text></g>);
        })}
        <text x={CX} y={CY-RD-16} textAnchor="middle" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Progressive</text>
        <text x={CX+RD+10} y={CY+4} textAnchor="start" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Flexible</text>
        <text x={CX} y={CY+RD+26} textAnchor="middle" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Defensive</text>
        <text x={CX-RD-10} y={CY+4} textAnchor="end" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Consistent</text>
      </svg>
    </div>
  );
}

function generateFacilitatorInsights(groupRespondents, groupMean, groupTobe, questionVariance, th){
  if(!groupRespondents||groupRespondents.length<2||!groupMean) return null;
  const org = th||'the organisation';
  const n = groupRespondents.length;
  const dims = ['prog','def','con','flex'];
  const dimNames = {prog:'Progressive',def:'Defensive',con:'Consistent',flex:'Flexible'};
  const scored = (groupRespondents||[]).map(r => ({...r,scores: scoreRespondent(r.s1, r.s2)}));
  const extremes = [];
  dims.forEach(dim => {
    const vals = scored.map(r => r.scores[dim]);
    const mean = vals.reduce((a,b)=>a+b,0)/n;
    const sd = Math.sqrt(vals.map(v=>(v-mean)**2).reduce((a,b)=>a+b,0)/n);
    scored.forEach(r => {
      const z = sd>0 ? Math.abs(r.scores[dim]-mean)/sd : 0;
      if(z>1.5){extremes.push({name: r.name,dim: dimNames[dim],score: Math.round(r.scores[dim]),mean: Math.round(mean),direction: r.scores[dim]>mean?'higher than':'lower than'});}
    });
  });
  const divergence = scored.map(r => {
    const dist = dims.reduce((sum,d)=>{return sum + (r.scores[d] - groupMean[d])**2;}, 0);
    return { name: r.isYou?'You':r.name, dist: Math.round(Math.sqrt(dist)), isYou: r.isYou };
  }).sort((a,b)=>b.dist-a.dist);
  const topDivergers = divergence.filter(d=>d.dist>15).slice(0,3);
  const surprises = [];
  const progDefBalance = Math.abs(groupMean?.prog - groupMean?.def);
  if(progDefBalance<8) surprises.push(`The group is unusually balanced between Progressive (${Math.round(groupMean?.prog)}) and Defensive (${Math.round(groupMean?.def)}) — a neutral mindset position. This is rare and worth exploring: is this a genuine strategic choice, or does it reflect uncertainty or lack of shared direction?`);
  if(groupMean?.prog>85) surprises.push(`The group's average Progressive score (${Math.round(groupMean?.prog)}) is very high. This level of forward-orientation is striking — it may reflect genuine ambition, or it could suggest insufficient attention to risk and defensive resilience.`);
  if(groupMean?.def>85) surprises.push(`The group's average Defensive score (${Math.round(groupMean?.def)}) is very high. This degree of defensive focus warrants discussion — is ${org} in a genuinely high-risk environment, or has caution become the default mode even where growth is possible?`);
  if(groupMean?.flex>85) surprises.push(`The group's average Flexible score (${Math.round(groupMean?.flex)}) is very high. High flexibility at group level may reflect genuine adaptability, or it could indicate inconsistency and a lack of shared standards.`);
  if(groupMean?.con>85) surprises.push(`The group's average Consistent score (${Math.round(groupMean?.con)}) is very high. This level of standardisation may be appropriate for ${org}'s context — or it may indicate over-reliance on procedure at the expense of judgement.`);
  if(surprises.length===0) surprises.push(`The group's profile is relatively consistent with what might be expected for an organisation of this type. There are no immediately striking anomalies — but the facilitator may want to probe whether the scores reflect genuine self-awareness or social desirability.`);
  const contentions = [];
  if(questionVariance&&questionVariance.length>0){
    questionVariance.slice(0,4).forEach(qv => {
      contentions.push(`"${qv.q.q}" — respondents scored this very differently (variance: ${qv.variance.toFixed(1)}). This question may reflect genuine disagreement about how ${org} currently operates in this area.`);
    });
  }
  if(topDivergers.length>0){contentions.push(`${topDivergers[0].name}'s overall profile diverges most from the group (distance: ${topDivergers[0].dist} points). Their perspective may represent a minority view worth surfacing.`);}
  const keyQs = [];
  const dominantDim = dims.reduce((best,d)=>groupMean[d]>groupMean[best]?d:best, dims[0]);
  keyQs.push(`The group's dominant dimension is ${dimNames[dominantDim]} (${Math.round(groupMean[dominantDim])}). Ask: "Is this dominance a deliberate choice — or has it emerged over time without being consciously decided?"`);
  if(topDivergers.length>0&&!topDivergers[0].isYou){keyQs.push(`${topDivergers[0].name} sees ${org} quite differently to the rest of the group. Consider asking them to share their perspective.`);}
  if(questionVariance&&questionVariance[0]) keyQs.push(`The question with the most disagreement is: "${questionVariance[0].q.q}". Ask the group: "What does the variation in our answers tell us about how consistently we experience this organisation?"`);
  if(groupTobe){
    const biggestGap = dims.reduce((best,d)=>{
      const gap = Math.abs(groupTobe[d==='prog'?'p':d==='def'?'d':d==='con'?'c':'f'] - groupMean[d]);
      const bestGap = Math.abs(groupTobe[best==='prog'?'p':best==='def'?'d':best==='con'?'c':'f'] - groupMean[best]);
      return gap>bestGap?d:best;
    }, dims[0]);
    keyQs.push(`The group's biggest desired shift is in ${dimNames[biggestGap]}. Ask: "What specifically would need to change — in our structures, leadership, incentives — to actually move in this direction?"`);
  }
  return { surprises, extremes: extremes.slice(0,4), topDivergers, contentions: contentions.slice(0,4), keyQs: keyQs.slice(0,4) };
}



function scoreRespondent(s1, s2) {
  if(!s1||!s1.length||!s2||!s2.length) return {def:60,prog:60,con:60,flex:60};
  const def = s1.reduce((s, a) => s + (parseInt(a?.l) || 0), 0);
  const prog = s1.reduce((s, a) => s + (parseInt(a?.r) || 0), 0);
  const con = s2.reduce((s, a) => s + (parseInt(a?.l) || 0), 0);
  const flex = s2.reduce((s, a) => s + (parseInt(a?.r) || 0), 0);
  return { def, prog, con, flex };
}

function computeGroupMean(respondents) {
  if(!respondents||respondents.length===0)return null;
  const n = respondents.length;
  return respondents.reduce((acc, r) => {
    const sc = scoreRespondent(r.s1, r.s2);
    return { def: acc.def + sc.def / n, prog: acc.prog + sc.prog / n, con: acc.con + sc.con / n, flex: acc.flex + sc.flex / n };
  }, { def: 0, prog: 0, con: 0, flex: 0 });
}

function computeQuestionVariance(respondents, allQ, sectionKey) {
  return allQ.map((q, qi) => {
    const rights = respondents.map(r => parseInt(r[sectionKey][qi]?.r) || 0);
    const mean = rights.reduce((s, v) => s + v, 0) / rights.length;
    const variance = Math.sqrt(rights.reduce((s, v) => s + (v - mean) ** 2, 0) / rights.length);
    const meanL = respondents.reduce((s, r) => s + (parseInt(r[sectionKey][qi]?.l) || 0), 0) / respondents.length;
    const meanR = mean;
    return { q, qi, sectionKey, meanL, meanR, variance, mean };
  });
}

function normVar(v) { return Math.min(1, v / 4); }
function varLabel(v) { if (v < 1.2) return 'High consensus'; if (v < 2.5) return 'Some variance'; return 'High disagreement'; }
function varClass(v) { if (v < 1.2) return 'cons-low'; if (v < 2.5) return 'cons-med'; return 'cons-high'; }
function varBarColor(v) { if (v < 1.2) return '#27ae60'; if (v < 2.5) return '#f39c12'; return '#e07030'; }

function generateGroupSuggestions(groupMean, userTobeP, userTobeD, userTobeC, userTobeF, thing, context, highVarQs) {
  const th = thing || 'your organisation';
  const ctx = context || '';
  const isNuclear = ctx.toLowerCase().includes('nuclear') || ctx.toLowerCase().includes('sellafield');
  const ctxPhrase = ctx.length > 10 ? ` in the context of ${th}` : '';
  const { def: gDef, prog: gProg, con: gCon, flex: gFlex } = groupMean;
  const strat = getStrategy(gDef, gProg, gCon, gFlex);
  const suggestions = [];
  suggestions.push(`The group profile for ${th} shows a collective dominant strategy of <strong>${SLABELS[strat]}</strong> — with mean scores of Progressive ${Math.round(gProg)}, Defensive ${Math.round(gDef)}, Consistent ${Math.round(gCon)}, Flexible ${Math.round(gFlex)}. This aggregate pattern reflects how people across ${th} collectively experience the organisation — and is a more reliable signal than any single respondent's view.`);
  if (highVarQs && highVarQs.length > 0) {
    const top = highVarQs[0];
    suggestions.push(`The area of greatest disagreement across respondents is the question: "<em>${top.q.q}</em>" — where individual scores range widely. This kind of variance is diagnostic: it typically indicates that different parts or levels of ${th} are experiencing or enacting the strategy differently. This question deserves explicit discussion in a leadership forum before any change programme begins.`);
  }
  if (highVarQs && highVarQs.length > 1) {
    const sec = highVarQs[1];
    suggestions.push(`A second area of significant divergence is: "<em>${sec.q.q}</em>". When senior and frontline perspectives differ sharply on this kind of question, the formal strategy and the lived experience of work are probably misaligned${ctxPhrase}. Closing this gap requires more than communication — it requires structural or behavioural change to bring people's actual experience in line with stated intent.`);
  }
  if (gProg > gDef + 15) {
    suggestions.push(`The group leans significantly Progressive (${Math.round(gProg)} vs ${Math.round(gDef)} Defensive). For ${th}, this pattern is an asset for growth and innovation — but it carries the risk that protective disciplines are underweighted. Introduce systematic mechanisms for capturing and acting on weak signals of risk: near-miss reporting, pre-mortems on major decisions, and structured horizon scanning.`);
  } else if (gDef > gProg + 15) {
    suggestions.push(`The group leans significantly Defensive (${Math.round(gDef)} vs ${Math.round(gProg)} Progressive). For ${th}, this reflects a strong protective culture — appropriate in ${isNuclear ? 'a safety-critical environment' : 'many operating contexts'}, but potentially limiting organisational learning and adaptation. Create designated spaces where progressive thinking is explicitly invited: innovation time, cross-functional problem-solving forums, or strategic pilots that are isolated from operational risk.`);
  }
  if (gFlex > gCon + 15) {
    suggestions.push(`The group describes ${th} as significantly more Flexible (${Math.round(gFlex)}) than Consistent (${Math.round(gCon)}). This means discretion and improvisation are dominant — valuable for adapting to novel problems, but risky where consistency and procedural discipline are essential. Identify the three to five processes in ${th} where standardisation most directly protects quality, safety or compliance — and invest in making those genuinely consistent before extending flexibility elsewhere.`);
  } else if (gCon > gFlex + 15) {
    suggestions.push(`The group describes ${th} as significantly more Consistent (${Math.round(gCon)}) than Flexible (${Math.round(gFlex)}). This reflects strong process discipline — but it may constrain ${th}'s ability to respond to novel situations that fall outside established procedures. Create explicit channels for exception handling: clear escalation routes, time-bounded waivers, and post-hoc learning reviews when the standard procedure is overridden.`);
  }
  const pGap = userTobeP - gProg;
  const dGap = userTobeD - gDef;
  if (Math.abs(pGap) > 12 || Math.abs(dGap) > 12) {
    const dir = pGap > 0 ? 'more progressive' : 'more defensive';
    suggestions.push(`Your personal desired profile calls for ${th} to be significantly ${dir} than the group average currently suggests it is. This gap between individual aspiration and collective current state is normal — but closing it requires more than individual intent. The most effective levers are leadership behaviour, structural design, and the stories told about what success looks like.`);
  }
  suggestions.push(`Facilitate a structured group dialogue using this data as the starting point — not the end point. Share the aggregate profile, present the areas of highest disagreement, and use these as prompts for conversation rather than conclusions. The goal is not to reach consensus on the scores, but to surface the different mental models that people in ${th} hold about how the organisation works — and why.`);
  if (isNuclear) {
    suggestions.push(`In the nuclear sector, the tension between Preventative Control and Adaptive Innovation is particularly acute. ${th.charAt(0).toUpperCase()+th.slice(1)} needs both: the procedural discipline that prevents catastrophic error, and the adaptive capacity to tackle the complex, long-horizon challenges of the industry. Use this profile data to have an explicit conversation about which strategic modes apply to which domains of work.`);
  } else if (ctx.length > 20) {
    suggestions.push(`Given the specific context of ${th}, consider how external stakeholders — regulators, customers, partners, funders — are implicitly shaping the current profile. Organisations often drift toward the strategic mode that their most powerful stakeholders reward. If the desired profile differs significantly from the current one, it is worth asking whether the external environment will support or resist that shift.`);
  }
  if (highVarQs) {
    const allSorted = [...highVarQs].sort((a, b) => a.variance - b.variance);
    if (allSorted.length > 0 && allSorted[0].variance < 1.5) {
      const topConsensus = allSorted[0];
      suggestions.push(`The area of strongest agreement across ${th} is: "<em>${topConsensus.q.q}</em>" — where respondents gave remarkably consistent answers (mean right-side score: ${topConsensus.meanR.toFixed(1)}). This represents a genuine organisational characteristic that can be relied upon as a foundation for change.`);
    }
  }
  return suggestions.slice(0, 10);
}

function GroupDiamondChart({ respondents }) {
  const scored = respondents.map(r => ({ ...scoreRespondent(r.s1, r.s2), name: r.name, isYou: r.isYou }));
  const n = scored.length;
  const mean = scored.reduce((acc, r) => ({
    def: acc.def + r.def / n, prog: acc.prog + r.prog / n,
    con: acc.con + r.con / n, flex: acc.flex + r.flex / n,
  }), { def: 0, prog: 0, con: 0, flex: 0 });
  return (
    <svg width={SZ} height={SZ} style={{ overflow: 'visible', maxWidth: '100%' }}>
      {[.25, .5, .75, 1].map(pct => <path key={pct} d={gridPath(pct)} fill="none" stroke="#d8d3cb" strokeWidth={pct === 1 ? 1.5 : 1} />)}
      <line x1={CX} y1={CY - RD} x2={CX} y2={CY + RD} stroke="#d8d3cb" />
      <line x1={CX - RD} y1={CY} x2={CX + RD} y2={CY} stroke="#d8d3cb" />
      {scored.filter(r => !r.isYou).map((r, i) => (
        <path key={i} d={shapePath({ p: r.prog, d: r.def, c: r.con, f: r.flex })}
          fill="#1a1a1a" fillOpacity={.04}
          stroke="#bbb" strokeWidth={1} strokeDasharray="4,3" strokeLinejoin="round" />
      ))}
      {scored.filter(r => r.isYou).map((r, i) => (
        <path key={i} d={shapePath({ p: r.prog, d: r.def, c: r.con, f: r.flex })}
          fill="#e07030" fillOpacity={.08}
          stroke="#e07030" strokeWidth={1.5} strokeLinejoin="round" />
      ))}
      <path d={shapePath({ p: mean.prog, d: mean.def, c: mean.con, f: mean.flex })}
        fill="#1a1a1a" fillOpacity={.12}
        stroke="#1a1a1a" strokeWidth={2.5} strokeLinejoin="round" />
      {[['prog', mean.prog], ['flex', mean.flex], ['def', mean.def], ['con', mean.con]].map(([ax, sc]) => {
        const [x, y] = axisPt(ax, sc);
        return (
          <g key={ax}>
            <circle cx={x} cy={y} r={12} fill="#1a1a1a" />
            <text x={x} y={y + 4} textAnchor="middle" fill="#fff" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">{Math.round(sc)}</text>
          </g>
        );
      })}
      <text x={CX} y={CY - RD - 16} textAnchor="middle" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Progressive</text>
      <text x={CX + RD + 10} y={CY + 4} textAnchor="start" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Flexible</text>
      <text x={CX} y={CY + RD + 26} textAnchor="middle" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Defensive</text>
      <text x={CX - RD - 10} y={CY + 4} textAnchor="end" fill="#1a1a1a" fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">Consistent</text>
    </svg>
  );
}

        blind:`Preventative Control can create the illusion that 'failure can't happen here' in ${th}, yet over time there is a gradual erosion and weakening of defensive barriers. Without Mindful Action, people 'go by the book' and defer to the system — stopping noticing and responding to unusual problems. Without Performance Optimisation, ${th} can become impractical and unproductive; improvement stops and the organisation becomes static, stale and uncompetitive. Without Adaptive Innovation, competitors become more forward-thinking, agile and cutting edge.`,
        areas:`To increase Mindful Action in ${th}, ensure competent people closest to the problem are empowered and have the freedom and discretion to act. To increase Performance Optimisation, rethink and redesign how work is done to better support productivity, cycle times and quality. To increase Adaptive Innovation, explore new capabilities, technologies and business models — create safe spaces for multi-disciplinary groups to create novel solutions and resolve complex problems.`,
      },
      mindful_action:{
        summary:`${capTh}'s profile shows a dominant Mindful Action strategy — a defensive, flexibility-focused approach.${ctxNote} Organisational resilience is typically created by people who use their experience, expertise and teamwork to anticipate and adapt to threats and respond effectively to unfamiliar situations through creative problem solving and improvisation.`,
        purpose:`Your scores suggest you perceive the focus in ${th} as sensing environmental change and responding rapidly and creatively. You believe the emphasis should be on 'bouncing back' rather than fundamental reinvention — building the dynamic capabilities that adapt quickly whilst retaining what the organisation does well.`,
        people:`Your scores suggest you believe the future is unpredictable and volatile. You perceive that resilience must be accomplished every day, not just built in once. You value expertise and diversity of opinion, and you experience a "healthy uneasiness" about what might go wrong — and expect the authority to act on what you notice.`,
        process:`${capTh} is relatively unstructured, informal and decentralised. It has an adaptive, flexible or 'organic' nature that enables groups to be responsive as new issues arise. The organisation is information-rich and makes deliberate attempts to create a very complete picture of the work environment.`,
        product:`The core aim is to defend market share or position and/or maintain current service levels. ${capTh} delivers bespoke solutions, builds long-term relationships and tailors offerings to match the dynamic demands of customers and stakeholders.`,
        atBest:`At its best, ${th} notices, understands and addresses opportunities and problems quickly. People are empowered to act. The shifting demands of customers, regulators and other stakeholders are rapidly and appropriately addressed.`,
        blind:`Mindful Action is weakened in ${th} when the organisation stops investing in the competence of its people. If authority and boundaries are unclear, the creative responses of individuals or groups can become disruptive. Without Preventative Control, the lack of structure can lead to disarray and silos. Without Performance Optimisation, the decentralised system can be inefficient, with much duplication. Without Adaptive Innovation, people are constantly firefighting and do not have time to be more forward-thinking.`,
        areas:`Increase Preventative Control by clearly defining roles and responsibilities and introducing formal planning processes with budgets and audits. Increase Performance Optimisation by rethinking and redesigning how work is done to better support productivity, efficiency and quality. Increase Adaptive Innovation by exploring new markets, capabilities and technologies — creating safe spaces for multi-disciplinary groups to develop novel solutions.`,
      },
      performance_optimization:{
        summary:`${capTh}'s profile shows a dominant Performance Optimisation strategy — a progressive, consistency-focused approach.${ctxNote} Organisational resilience is formed by process optimisation, continually improving, refining and extending existing competencies, and exploiting current technologies to serve present customers and stakeholders more efficiently and effectively.`,
        purpose:`Your scores suggest you believe the end goal in ${th} is to continuously improve the processes by which it operates — striving toward an aspirational vision and exploiting existing capabilities incrementally over time. You perceive expectations are best met through systematic, ongoing improvement rather than radical change.`,
        people:`Your scores suggest you believe the environment is reasonably stable but that competition and increasing stakeholder requirements demand continuous improvement. You perceive that building consensus and shared direction matters — and that recognition and reward systems are shaping how people behave.`,
        process:`${capTh} is defined by efficient, streamlined operations and centralised services to reduce cost and eradicate errors. There is consistent application of operations management methodologies. Measuring the performance of key processes and benchmarking is integral to the operation.`,
        product:`The strategy is ideal for settings where customers and stakeholders value cost and consistency over variation. ${capTh}'s outputs tend to be high-volume, standardised and focused on incremental rather than transformational change.`,
        atBest:`At its best, ${th} maximises efficiency and delivers on quality. It maintains and continuously improves the level of capability needed to deliver products or services — getting reliably better at what it already does well.`,
        blind:`A singular focus on short-term productivity gain can prove detrimental to medium-term mission and sustainable performance. Without Preventative Control, people can become preoccupied with production over prevention. Without Mindful Action, ${th} can lose its adaptive capacity. Without Adaptive Innovation, the organisation can become very good at exploiting current approaches while quickly losing sight of changing needs and emerging challenges.`,
        areas:`Increase Preventative Control by clearly defining roles and responsibilities and introducing formal planning processes with budgets and audits. Increase Mindful Action by delegating to people closest to the problem and empowering experts with freedom and discretion to act. Increase Adaptive Innovation by exploring new capabilities, technologies and business models — creating safe spaces for multi-disciplinary groups to create novel solutions.`,
      },
      adaptive_innovation:{
        summary:`${capTh}'s profile shows a dominant Adaptive Innovation strategy — a progressive, flexibility-focused approach.${ctxNote} Organisational resilience is typically created through innovation and creating new products, services or capabilities. It is also the strategy required to resolve complex, intractable issues that require fundamental rethinking of how the organisation works.`,
        purpose:`Your scores suggest you believe the focus in ${th} should be on creative problem-solving, innovation and learning. You perceive that the organisation adapts best by continuously experimenting and identifying new options ahead of others. You experience shared purpose as the engine of transformation.`,
        people:`Your scores suggest you believe the environment is unpredictable and uncertain, and that results are short-lived. You perceive that novel solutions come from collaboration and experimentation across the organisation. You experience a pull toward disrupting conventional thinking and encouraging divergent perspectives on problems.`,
        process:`${capTh} has a flexible structure that stimulates performance and creativity. Decentralised organisational forms with low levels of hierarchy are constantly adapting to changing situations. The excitement and anxiety of working in this context are understood and people are supported to tolerate the uncertainty of their work.`,
        product:`${capTh} explores new capabilities, technologies and business models. Being a first mover or finding fundamentally new approaches is crucial. Products and services continually redefine the state of the art, creating a continuous stream of innovation.`,
        atBest:`At its best, ${th} achieves creative thinking and problem solving drawing on multiple perspectives, taking risks in a safe environment. System-wide changes are possible across borders and boundaries.`,
        blind:`${capTh} can begin to cut innovation and exploration when faced with uncertainty — a 'threat-rigidity' effect. Without Preventative Control, people can take excessive risks and the lack of structure can lead to unnecessary work and functional silos. Without Performance Optimisation, the decentralised system can be inefficient. Without Mindful Action, the organisation can lose sight of immediate operational challenges.`,
        areas:`Increase Preventative Control by clearly defining roles and responsibilities, introducing formal planning processes with budgets and audits. Increase Performance Optimisation by rethinking and redesigning how work is done to better support productivity, efficiency and quality. Increase Mindful Action by encouraging a 'healthy uneasiness' about what might go wrong — enable people to deal with problems and empower them to act.`,
      },
      neutral:{
        summary:`${capTh}'s profile shows a Neutral strategy — an almost uniform emphasis on all four core strategies.${ctxNote} This is often unintended and is rarely achieved by design. It typically reflects an organisation trying to be all things to all people, or one in which different groups are pursuing different strategies independently.`,
        purpose:`${capTh} simultaneously pursues process optimisation and continuous improvement while also finding new solutions and innovative technologies. The organisation is equally focused on prevention and production. This can be achieved through people or by means of process and structural separation.`,

        process:`A neutral strategy can be achieved structurally by separating the four core strategies across different groups — for example, preventative control managed by a risk department, adaptive innovation through an R&D or transformation function, performance optimisation through operational excellence programmes, and mindful action through specific problem-solving groups.`,

        blind:`Is it possible to be equally great at all four Organisational Resilience strategies? The short answer is probably not. Individuals, groups and parts of ${th} will likely gravitate toward their preferred way of working. A neutral strategy is hard to do well since the purpose, people, process and product that lead to excellence in any one discipline are often contradictory and incompatible.`,
        areas:`Coordination is critical. This can only be made possible by effective, informal communication between people and groups who have different mindsets, approaches and are doing very different but interdependent work. Investment in training and education is critical. Consider whether an emphasis on any one of the four core strategies would be preferable to a neutral position.`,

    return texts[strat]||texts.neutral;

  const SD=getStrategyText(asIsStrat);
  function printReport(){window.print();}

  const participantsCompleted = participants.filter(p=>p.completed).length;
  const allParticipantsDone = participants.length>0 && participantsCompleted===participants.length;
  const facilInsights = isAdmin ? generateFacilitatorInsights(groupRespondents, groupMean, groupTobe, allVariance, thing||'the organisation') : null;

  return(
    <div className="shell" ref={topRef}>

      <div className="main">

                <div className="land-tag">changebefore.com</div>

                <button className="btn-p" onClick={()=>{

              </div>
            </div>

          {/* STEP 1 */}
          {step===1&&(
            <div>
              <BackBtn onClick={()=>go(0)}/>
              <div className="sec-tag">Section 1a — What Are We Looking At?</div>
              <h2 className="pg-title">What is the thing you want to work on?</h2>
              <p className="pg-sub">This could be a team, a department, a division, a whole organisation, or any system you want to explore. Be as specific as possible — the more clearly you define it, the more useful your results will be.</p>

              <label className="field-lbl">Name the thing</label>
              <div className="field-sub">e.g. "The Nuclear Operations Division", "Our R&D team", "Sellafield Ltd", "The customer service function"</div>
              <input className="inp" placeholder="What are we looking at?" value={thing} onChange={e=>setThing(e.target.value)} style={{marginBottom:'1.25rem'}}/>
              <label className="field-lbl">Brief description <span style={{color:'#c0b8ae',fontWeight:400}}>(optional)</span></label>
              <div className="field-sub">What does it do? What is its purpose? Who does it serve?</div>
              <textarea className="inp inp-ta" placeholder="A short description of what this thing is and does..." value={thingDesc} onChange={e=>setThingDesc(e.target.value)}/>
              <div className="btn-row">
                <button className="btn-p" disabled={!thing.trim()} onClick={()=>go(2)}>Continue →</button>
                <button className="btn-s" onClick={()=>go(0)}>← Back</button>
              </div>
            </div>
          )}

          {/* STEP 2: CONTEXT */}
          {step===2&&(

              <BackBtn onClick={()=>go(1)}/>

              <div style={{textAlign:'right',fontSize:'.75rem',color:'#b0a898',marginBottom:'1.25rem',fontFamily:"'DM Sans',sans-serif"}}>{contextWordCount} / 150 words</div>

              <div className="inf-box" style={{marginBottom:'1.5rem'}}>
                If you completed the Define Your System tool for <strong>{th}</strong> — copy and paste the text it produced in the box above, or upload the PDF below.

              <label className="field-lbl" style={{fontWeight:400,color:'#555',marginBottom:'.5rem'}}>Link to a relevant webpage (optional)</label>
              <div style={{display:'flex',gap:'.5rem',marginBottom:'1.25rem'}}>
                <input className="inp" placeholder="https://..." value={website} onChange={e=>setWebsite(e.target.value)} style={{flex:1,marginBottom:0}}/>
                <button className="btn-s" style={{flexShrink:0,background:'#888',color:'#fff',border:'none',fontWeight:600,padding:'.72rem 1.1rem',minWidth:'72px'}} onClick={()=>{}}>Fetch</button>

              <label className="field-lbl" style={{fontWeight:400,color:'#555',marginBottom:'.5rem'}}>Upload a document (optional — .pdf, .docx or .txt)</label>

            <div>

              <h2 className="pg-title">How does <em style={{fontStyle:'normal',color:'#e07030'}}>{th}</em> operate today?</h2>

                <div style={{fontSize:'.8rem',fontWeight:700,color:'#1a1a1a',marginBottom:'.75rem',fontFamily:"'DM Sans',sans-serif"}}>How does the organisation primarily make decisions?</div>

                    <span style={{fontSize:'.58rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#e07030',display:'block',marginBottom:'.2rem'}}>Option A</span>

                      <div style={{width:32,textAlign:'center',fontWeight:700,color:'#e07030',fontSize:'1rem',fontFamily:"'DM Sans',sans-serif"}}>7</div>

                      <div style={{width:32,textAlign:'center',fontWeight:700,fontSize:'1rem',fontFamily:"'DM Sans',sans-serif"}}>3</div>

                {[{lbl:'Progressive',val:prog,dim:'Mindset'},{lbl:'Defensive',val:def,dim:'Mindset'},{lbl:'Flexible',val:flex,dim:'Approach'},{lbl:'Consistent',val:con,dim:'Approach'}].map(sc=>(

                    <div className="score-bar"><div className="score-fill" style={{width:`${(sc.val/120)*100}%`}}/></div>

              </div>
              <div className="strat-badge"><div className="strat-dot"/><div><strong style={{fontFamily:"'DM Sans',sans-serif"}}>Dominant strategy: {SLABELS[asIsStrat]}</strong><br/><span style={{fontSize:'.8rem',fontWeight:400,color:'#666',fontFamily:"'DM Sans',sans-serif"}}>{SDESC[asIsStrat]}</span></div></div>
              <div className="btn-row">
                <button className="btn-p" onClick={()=>go(6)}>Set Future Profile →</button>

              <div className="sec-tag">Future Profile</div>

              <div className="slider-section">
