// ── PDF REPORT ────────────────────────────────────────────────────────────────
// Reproduces Ahamo's report outputs. jsPDF has no Poppins built in, so the body
// is set in Helvetica (a close geometric sans); the palette and layout match.
function generateReport(a,meta){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,M=16;
  const NAVY=[32,57,109],RED=[239,65,54],TEAL=[34,149,160],GREEN=[141,198,64],INK=[26,26,26],MUT=[107,114,128],LINE=[226,228,232];
  const SC=[[226,59,51],[239,123,91],[246,192,176],[205,227,166],[151,201,61],[95,160,42]];
  let y=0;
  const pageBottom=H-16;
  function need(h){if(y+h>pageBottom){doc.addPage();y=M;drawRunningHead();}}
  function imgFmt(u){return /^data:image\/png/i.test(u||'')?'PNG':'JPEG';}
  function drawRunningHead(){
    // AhaMo master logo (full colour on white), left
    try{doc.addImage(AHAMO_LOGO,'JPEG',M,6,17.9,7,'ahamo','FAST');}catch(e){}
    // Client logo, right — matched height
    if(meta.clientLogo){
      const h=7,w=Math.min(40,h*(meta.clientRatio||2));
      try{doc.addImage(meta.clientLogo,imgFmt(meta.clientLogo),W-M-w,6,w,h,'client','FAST');}catch(e){}
    }
    doc.setDrawColor(...LINE);doc.setLineWidth(.2);doc.line(M,15.5,W-M,15.5);
    y=Math.max(y,M+4);
  }
  function h2(txt){
    need(16);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...NAVY);
    doc.text(txt,M,y);y+=2.5;
    doc.setDrawColor(...TEAL);doc.setLineWidth(1.1);doc.line(M,y,M+34,y);y+=7;
  }
  function para(txt,size){
    doc.setFont('helvetica','normal');doc.setFontSize(size||9.5);doc.setTextColor(...MUT);
    const lines=doc.splitTextToSize(txt,W-M*2);need(lines.length*4.6);
    doc.text(lines,M,y);y+=lines.length*4.6+2;
  }
  function subhead(txt){
    need(9);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...NAVY);
    doc.text(txt,M,y);y+=5;
  }
  function divider(part,title,sub){
    doc.addPage();doc.setFillColor(...NAVY);doc.rect(0,0,W,H,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...GREEN);
    doc.text(part.toUpperCase(),M,H/2-18);
    doc.setFont('helvetica','bold');doc.setFontSize(28);doc.setTextColor(255,255,255);
    doc.text(title,M,H/2-4);
    doc.setDrawColor(...TEAL);doc.setLineWidth(1.4);doc.line(M,H/2+2,M+50,H/2+2);
    if(sub){doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(200,208,224);
      const sl=doc.splitTextToSize(sub,W-M*2-40);doc.text(sl,M,H/2+14);}
    y=H; // force next section to addPage
  }

  // ── COVER ──
  doc.setFillColor(...NAVY);doc.rect(0,0,W,H,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(30);doc.setTextColor(255,255,255);
  doc.text('Aha',M,45);
  const ahaW=doc.getTextWidth('Aha');
  doc.setFillColor(...RED);doc.circle(M+ahaW+3,43.4,1.7,'F');
  doc.text('Mo',M+ahaW+7,45);
  // Client logo — white chip top-right so any logo reads on the navy cover
  if(meta.clientLogo){
    const h=13,w=Math.min(52,h*(meta.clientRatio||2)),pad=3.5;
    doc.setFillColor(255,255,255);
    doc.roundedRect(W-M-w-pad*2,20,w+pad*2,h+pad*2,2.5,2.5,'F');
    try{doc.addImage(meta.clientLogo,imgFmt(meta.clientLogo),W-M-w-pad,20+pad,w,h,'client','FAST');}catch(e){}
  }
  doc.setFontSize(9);doc.setTextColor(...GREEN);doc.setFont('helvetica','bold');
  doc.text('HIGH PERFORMING LEADERSHIP TEAMS',M,72);
  doc.setFont('helvetica','bold');doc.setFontSize(30);doc.setTextColor(255,255,255);
  const tl=doc.splitTextToSize('Diagnostic Report',W-M*2);doc.text(tl,M,88);
  doc.setDrawColor(...TEAL);doc.setLineWidth(1.4);doc.line(M,104,M+50,104);
  doc.setFont('helvetica','normal');doc.setFontSize(15);doc.setTextColor(255,255,255);
  doc.text(meta.team,M,118);
  doc.setFontSize(10);doc.setTextColor(200,208,224);
  doc.text([meta.sector||'',meta.date].filter(Boolean),M,128);
  doc.setFontSize(9);doc.setTextColor(160,172,196);
  doc.text(a.teamN+' team members · '+a.stakeN+' stakeholders',M,H-24);
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...RED);
  doc.text('CONFIDENTIAL',M,H-16);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(160,172,196);
  doc.text('Please do not forward this report unless agreed with the team.',M,H-11);

  // ── BEFORE YOU GET INTO THE REPORT ──
  doc.addPage();y=M;drawRunningHead();
  h2('Before you get into the report');
  subhead('What is this tool?');
  para('This is the High Performing Leadership Teams (HPLT) Diagnostic Report. It measures the extent to which people feel your team shows the five traits that define a high-performing leadership team. The five traits make up the HPLT model, described in full on the next page.');
  subhead('What data have we gathered?');
  para('Team members rated their agreement with 46 statements across the five traits, from 1 (strongly disagree) to 6 (strongly agree). They also answered three open-ended questions and a final question rating the team’s overall performance from 1 to 10. External stakeholders — nominated by the team leader — answered the overall performance question and the three open-ended questions.');
  subhead('Who completed?');
  para(a.teamN+' team member'+(a.teamN===1?'':'s')+' and '+a.stakeN+' external stakeholder'+(a.stakeN===1?'':'s')+' completed the diagnostic.');
  subhead('How will we use this report?');
  para('Team members get a chance to read and reflect on the results. A facilitated conversation then helps the team make sense of them together and identify next steps.');

  // ── WHAT WE MEASURE ──
  doc.addPage();y=M;drawRunningHead();
  h2('What we measure here');
  MODEL.forEach((d,i)=>{
    const rgb=hexToRgb(d.colour);
    need(24);
    doc.setFillColor(...rgb);doc.roundedRect(M,y-4,7,7,1,1,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(255,255,255);
    doc.text('0'+(i+1),M+3.5,y+0.6,{align:'center'});
    doc.setFont('helvetica','bold');doc.setFontSize(11.5);doc.setTextColor(...rgb);
    doc.text(d.name,M+11,y);y+=5;
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MUT);
    const dl=doc.splitTextToSize(d.desc,W-M*2-11);doc.text(dl,M+11,y);y+=dl.length*4.2+1.5;
    doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(...INK);
    const subs=d.subs.map(s=>s.name).join('  ·  ');
    const sl=doc.splitTextToSize(subs,W-M*2-11);doc.text(sl,M+11,y);y+=sl.length*4+6;
  });

  divider('Part 1','Overview','The scores for the five areas, the fourteen sub-areas, and your highest and lowest scoring items.');

  // ── PARTICIPATION + OVERALL ──
  doc.addPage();y=M;drawRunningHead();
  h2('Overall performance');
  para('“How is this team performing?” — scored 1 (underperforming) to 10 (excelling). Team members and stakeholders both answer this question.');
  const boxes=[['All respondents',a.oAll,NAVY,a.real.length+' in total'],['Team members',a.oTeam,GREEN,a.teamN+' responses'],['Stakeholders',a.oStake,TEAL,a.stakeN+' responses']];
  const bw=(W-M*2-8)/3;need(30);
  boxes.forEach((b,i)=>{
    const x=M+i*(bw+4);
    doc.setDrawColor(...LINE);doc.setLineWidth(.3);
    if(i===0){doc.setFillColor(...NAVY);doc.roundedRect(x,y,bw,26,2,2,'F');}
    else doc.roundedRect(x,y,bw,26,2,2,'S');
    doc.setFont('helvetica','bold');doc.setFontSize(20);
    doc.setTextColor(...(i===0?[255,255,255]:b[2]));
    doc.text((b[1]?b[1].toFixed(1):'—')+'/10',x+bw/2,y+13,{align:'center'});
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...(i===0?[210,216,230]:MUT));
    doc.text(String(b[0]).toUpperCase(),x+bw/2,y+19,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(7);
    doc.text(b[3],x+bw/2,y+23.5,{align:'center'});
  });
  y+=32;
  // 1–10 distribution
  need(40);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...INK);
  doc.text('Distribution of scores',M,y);y+=5;
  const dmax=Math.max(1,...a.oDist),chH=26,cw=(W-M*2)/10;
  a.oDist.forEach((c,i)=>{
    const x=M+i*cw,bh=c/dmax*chH;
    const col=i<3?[239,123,91]:i<6?[246,192,128]:[141,198,64];
    doc.setFillColor(...col);doc.rect(x+1.5,y+chH-bh,cw-3,bh,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(...NAVY);
    if(c>0)doc.text(String(c),x+cw/2,y+chH-bh-1.5,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...MUT);
    doc.text(String(i+1),x+cw/2,y+chH+4,{align:'center'});
  });
  y+=chH+10;

  // ── FIVE AREAS RANKED ──
  h2('The five areas, ranked');
  para('Average agreement across each area’s items (team members only), scored 1–6. Ordered strongest to weakest.');
  a.ranked.forEach((d,i)=>{
    need(16);
    const rgb=hexToRgb(d.colour);
    doc.setFillColor(...rgb);doc.rect(M,y,3,12,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...NAVY);
    doc.text((i+1)+'.  '+d.name,M+6,y+5);
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(...rgb);
    doc.text(d.mean.toFixed(1),W-M,y+6,{align:'right'});
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...MUT);
    doc.text('/6',W-M+0.5,y+6,{align:'left'});
    // track bar
    doc.setFillColor(240,241,244);doc.roundedRect(M+6,y+8,W-M*2-24,2.6,1,1,'F');
    doc.setFillColor(...rgb);doc.roundedRect(M+6,y+8,(W-M*2-24)*(d.mean/6),2.6,1,1,'F');
    y+=16;
  });
  y+=2;

  // ── 14 SUB-AREAS ──
  doc.addPage();y=M;drawRunningHead();
  h2('The fourteen sub-areas');
  para('Each area breaks into sub-areas. Average agreement per sub-area (team members only), scored 1–6.');
  const axL=M+64, axR=W-M-8, axW=axR-axL;
  a.dims.forEach(d=>{
    const rgb=hexToRgb(d.colour);
    need(d.subs.length*7+11);
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...rgb);
    doc.text(d.name,M,y);y+=5.5;
    d.subs.forEach(s=>{
      const bh=4.2;
      doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...INK);
      const lab=doc.splitTextToSize(s.name,axL-M-6);
      doc.text(lab[0]+(lab.length>1?'…':''),axL-3,y+3,{align:'right'});
      doc.setFillColor(240,241,244);doc.rect(axL,y,axW,bh,'F');
      if(s.hasData){doc.setFillColor(...rgb);doc.rect(axL,y,axW*(s.mean/6),bh,'F');
        doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...NAVY);
        doc.text(s.mean.toFixed(1),axR+1.5,y+3.4,{align:'left'});}
      else{doc.setFont('helvetica','italic');doc.setFontSize(6.5);doc.setTextColor(...MUT);doc.text('—',axR+1.5,y+3.4,{align:'left'});}
      y+=7;
    });
    y+=3.5;
  });
  // axis ticks 1..6
  for(let t=1;t<=6;t++){const x=axL+axW*((t-1)/5);doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...MUT);doc.text(String(t),x,y+1,{align:'center'});}

  // ── HIGHEST / LOWEST ITEMS ──
  doc.addPage();y=M;drawRunningHead();
  h2('Highest and lowest scoring items');
  const itemBlock=(title,rows,col)=>{
    need(10);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...col);
    doc.text(title,M,y);y+=5.5;
    rows.forEach(it=>{
      need(9);
      const rgb=hexToRgb(it.colour);
      doc.setFillColor(...rgb);doc.roundedRect(M,y-3.4,6,5,1,1,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(255,255,255);
      doc.text(String(it.n),M+3,y,{align:'center'});
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...INK);
      const t=doc.splitTextToSize('Team members '+it.t.charAt(0).toLowerCase()+it.t.slice(1),W-M*2-30);
      doc.text(t[0]+(t.length>1?'…':''),M+9,y);
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...mc(it.mean));
      doc.text(it.mean.toFixed(1),W-M,y,{align:'right'});
      y+=6.4;
    });
    y+=3;
  };
  itemBlock('Highest scoring — top 5',a.top,[95,160,42]);
  itemBlock('Lowest scoring — bottom 5',a.bottom,[226,59,51]);

  divider('Part 2','Distribution','A breakdown so you can see how the team scored each question.');

  // ── PER-DIMENSION ITEM DETAIL ──
  a.dims.forEach(d=>{
    if(!d.hasData)return;
    doc.addPage();y=M;drawRunningHead();
    const rgb=hexToRgb(d.colour);
    doc.setFillColor(...rgb);doc.roundedRect(M,y,W-M*2,16,2,2,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(255,255,255);
    doc.text(d.name,M+4,y+7);
    doc.setFont('helvetica','bold');doc.setFontSize(13);
    doc.text(d.mean.toFixed(1)+'/6',W-M-4,y+7,{align:'right'});
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(240,244,248);
    const dl=doc.splitTextToSize(d.desc,W-M*2-8);doc.text(dl,M+4,y+12);
    y+=20;
    d.subs.forEach(sub=>{
      need(8);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...TEAL);
      doc.text(sub.name.toUpperCase()+'   ·   '+(sub.mean?sub.mean.toFixed(1):'—')+'/6',M,y);y+=5;
      sub.items.forEach(it=>{
        const st=a.items[it.n];need(11);
        doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...INK);
        const t=doc.splitTextToSize(it.n+'. '+it.t,W-M*2-64);
        doc.text(t[0]+(t.length>1?'…':''),M,y);
        // stacked bar
        const barX=W-M-58,barW=48,barH=4.2;
        if(st.n>0){
          const total=st.dist.reduce((x,z)=>x+z,0)||1;let cx=barX;
          st.dist.forEach((c,i)=>{if(c>0){const w=c/total*barW;doc.setFillColor(...SC[i]);doc.rect(cx,y-3.2,w,barH,'F');cx+=w;}});
          doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...mc(st.mean));
          doc.text(st.mean.toFixed(1),W-M,y,{align:'right'});
        }else{
          doc.setFont('helvetica','italic');doc.setFontSize(7);doc.setTextColor(...MUT);
          doc.text('no responses',W-M,y,{align:'right'});
        }
        y+=6.6;
      });
      y+=2;
    });
  });

  divider('Part 3','Verbatim feedback','What team members and external stakeholders wrote about your team.');

  // ── VERBATIM ──
  doc.addPage();y=M;drawRunningHead();
  h2('In their own words');
  para('Open responses, verbatim, split by team members and stakeholders.');
  a.open.forEach((q,i)=>{
    need(12);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...NAVY);
    const ql=doc.splitTextToSize((i+1)+'. '+q.q,W-M*2);doc.text(ql,M,y);y+=ql.length*5+2;
    const grp=(label,arr,col)=>{
      need(7);doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...col);
      doc.text(label.toUpperCase()+' ('+arr.length+')',M,y);y+=4.5;
      if(!arr.length){doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(...MUT);doc.text('No responses',M+2,y);y+=5;return;}
      arr.forEach(t=>{
        const lines=doc.splitTextToSize(t,W-M*2-6);need(lines.length*4.4+2);
        doc.setFillColor(...col);doc.rect(M,y-3.2,1.2,lines.length*4.4,'F');
        doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...INK);
        doc.text(lines,M+4,y);y+=lines.length*4.4+2.5;
      });
      y+=1.5;
    };
    grp('Team members',q.team,[95,160,42]);
    grp('Stakeholders',q.stake,[34,152,160]);
    y+=3;
  });

  divider('Part 4','Reflection','Four questions to sit with ahead of the conversation with your team.');

  // ── REFLECTION ──
  doc.addPage();y=M;drawRunningHead();
  h2('Reflecting on this team’s results');
  para('Ahead of the facilitated conversation, take a few minutes with these four questions.');
  y+=2;
  REFLECTION_QS.forEach((q,i)=>{
    need(20);
    doc.setFillColor(...NAVY);doc.roundedRect(M,y,W-M*2,17,2,2,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...GREEN);
    doc.text('QUESTION '+(i+1),M+5,y+6);
    doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(255,255,255);
    const ql=doc.splitTextToSize(q,W-M*2-10);doc.text(ql,M+5,y+12);
    y+=22;
  });

  // Footer page numbers
  const pages=doc.internal.getNumberOfPages();
  for(let p=2;p<=pages;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...MUT);doc.text('Aha.Mo · HPLT Diagnostic',M,H-8);doc.text(String(p)+' / '+pages,W-M,H-8,{align:'right'});}

  const safe=(meta.team||'team').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  doc.save('HPLT-Report-'+safe+'.pdf');

  function hexToRgb(h){const m=h.replace('#','').match(/\w\w/g);return m.map(x=>parseInt(x,16));}
  function mc(m){if(!m)return MUT;const t=Math.max(0,Math.min(1,(m-1)/5));const S=[[226,59,51],[246,192,80],[95,160,42]];const l=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);const c=t<0.5?l(S[0],S[1],t/0.5):l(S[1],S[2],(t-0.5)/0.5);return [c[0]|0,c[1]|0,c[2]|0];}
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  // step: -1 gate · 0 landing · 1-5 dimension screens · 6 overall · 7 open · 8 thanks · 20 facilitator
  const [step,setStep]=useState(-1);

  // Gate / session
  const [accessCode,setAccessCode]=useState('');
  const [codeInput,setCodeInput]=useState('');
  const [codeError,setCodeError]=useState('');
  const [codeChecking,setCodeChecking]=useState(false);
  const [sessionConfig,setSessionConfig]=useState(null);
  const [clientLogo,setClientLogo]=useState('');   // data URL, shown top-right on every page + PDF
  const [clientLogoRatio,setClientLogoRatio]=useState(2); // width/height, for PDF sizing
  const [logoErr,setLogoErr]=useState('');
  const [logoBusy,setLogoBusy]=useState(false);

  // Participant
  const [participantUuid,setParticipantUuid]=useState('');
  const [participantId,setParticipantId]=useState('');
  const [respondentName,setRespondentName]=useState('');
  const [track,setTrack]=useState('');   // 'team' | 'stakeholder'
  const [role,setRole]=useState('');
  const [roleCustom,setRoleCustom]=useState('');
  const [beginning,setBeginning]=useState(false);
  const [beginError,setBeginError]=useState('');

  // Answers
  const [scores,setScores]=useState({});   // {itemNumber: 1..6}
  const [overall,setOverall]=useState(0);  // 1..10
  const [open1,setOpen1]=useState('');
  const [open2,setOpen2]=useState('');
  const [open3,setOpen3]=useState('');
  const [submitting,setSubmitting]=useState(false);
  const [submitError,setSubmitError]=useState('');

  const [resumeData,setResumeData]=useState(null);

  // Facilitator
  const [facUnlocked,setFacUnlocked]=useState(false);
  const [cfgTeam,setCfgTeam]=useState('');
  const [cfgSector,setCfgSector]=useState('');
  const [cfgSaving,setCfgSaving]=useState(false);
  const [cfgError,setCfgError]=useState('');
  const [respondents,setRespondents]=useState([]);
  const [facTile,setFacTile]=useState('');   // which dashboard overlay is open
  const [facEditing,setFacEditing]=useState(false); // setup edit mode
  const [pdfBusy,setPdfBusy]=useState(false);
  const [removeConfirmId,setRemoveConfirmId]=useState(''); // row awaiting delete confirm
  const [removingId,setRemovingId]=useState('');          // row currently deleting
  const [removeErr,setRemoveErr]=useState('');
  const [linkCopied,setLinkCopied]=useState(false);

  const topRef=useRef(null);
  const codeNorm=(accessCode||'').trim().toUpperCase();
  const openMap={open_1:open1,open_2:open2,open_3:open3};

  useEffect(()=>{topRef.current&&topRef.current.scrollIntoView({behavior:'smooth'});},[step]);

  // URL ?code= shortcut
  useEffect(()=>{
    try{
      const c=(new URLSearchParams(window.location.search).get('code')||'').trim();
      if(!c)return;
      setCodeInput(c);setCodeChecking(true);
      (async()=>{
        const ok=await validateCode(c);
        setCodeChecking(false);
        if(!ok)setCodeError('That code wasn’t recognised. Check it and try again.');
      })();
    }catch(e){}
  },[]);

  // Autosave to localStorage
  useEffect(()=>{
    if(!accessCode||step<=0)return;
    saveProgress(accessCode,{step,track,role,roleCustom,scores,overall,open1,open2,open3,
      participantUuid,participantId,accessCode});
  },[step,track,role,roleCustom,scores,overall,open1,open2,open3,accessCode,participantUuid,participantId]);

  // Resume detection
  useEffect(()=>{
    if(!accessCode||step!==0)return;
    const saved=loadProgress(accessCode);
    if(!saved||saved.step<=0)return;
    const answered=(saved.scores&&Object.keys(saved.scores).length>0)||saved.overall>0;
    if(answered)setResumeData(saved);
  },[accessCode,step]);

  // Debounced Supabase autosave once assigned + past landing
  useEffect(()=>{
    if(!codeNorm||!participantUuid)return;
    if(step<1||step>7)return;
    const t=setTimeout(()=>saveToServer(false),700);
    return()=>clearTimeout(t);
  },[scores,overall,open1,open2,open3,step,codeNorm,participantUuid]);

  // Poll respondents in facilitator mode
  useEffect(()=>{
    if(!facUnlocked||step!==20||!codeNorm)return;
    loadRespondents();
    const id=setInterval(loadRespondents,15000);
    return()=>clearInterval(id);
  },[facUnlocked,step,codeNorm]);

  // ── Server calls ────────────────────────────────────────────────────────────
  async function validateCode(c){
    try{
      const r=await fetch('/api/validate-code',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code:c,tool:'ahamo-hplt'})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d&&d.valid){
        setAccessCode(c.toUpperCase());
        setSessionConfig(d.session_config||null);
        loadClientLogo(c.toUpperCase());
        setStep(0);
        return true;
      }
      return false;
    }catch(e){return false;}
  }

  // Track the client logo's aspect ratio (for correct PDF sizing), on upload or server-load.
  useEffect(()=>{
    if(!clientLogo){setClientLogoRatio(2);return;}
    const im=new Image();
    im.onload=()=>{if(im.height)setClientLogoRatio(im.width/im.height);};
    im.src=clientLogo;
  },[clientLogo]);

  // ── Client logo (v2 branding) ───────────────────────────────────────────────
  async function loadClientLogo(code){
    const c=code||codeNorm;if(!c)return;
    try{
      const r=await fetch('/api/hplt2-config',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sessionCode:c,action:'get'})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d&&typeof d.clientLogo==='string')setClientLogo(d.clientLogo);
    }catch(e){}
  }
  async function saveClientLogo(dataUrl){
    if(!codeNorm)return false;
    try{
      const r=await fetch('/api/hplt2-config',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sessionCode:codeNorm,action:'set',clientLogo:dataUrl})});
      const d=await r.json().catch(()=>({}));
      return !!(r.ok&&d&&d.ok);
    }catch(e){return false;}
  }
  function onLogoFile(file){
    setLogoErr('');
    if(!file)return;
    if(!/^image\/(png|jpeg|jpg)$/.test(file.type)){setLogoErr('Please choose a PNG or JPEG image.');return;}
    if(file.size>10*1024*1024){setLogoErr('That file is over 10MB — please choose a smaller one.');return;}
    setLogoBusy(true);
    const reader=new FileReader();
    reader.onerror=()=>{setLogoErr('Could not read that file.');setLogoBusy(false);};
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>{setLogoErr('That image could not be loaded.');setLogoBusy(false);};
      img.onload=async()=>{
        const render=(maxH,type,q)=>{
          const s=Math.min(1,maxH/img.height);
          const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
          const cv=document.createElement('canvas');cv.width=w;cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          return cv.toDataURL(type,q);
        };
        let url=render(200,'image/png');            // preserve transparency at a sensible height
        if(url.length>200000)url=render(150,'image/png');
        if(url.length>200000)url=render(150,'image/jpeg',0.85);
        if(url.length>260000){setLogoErr('That image is too detailed to store — please use a simpler or smaller logo.');setLogoBusy(false);return;}
        setClientLogo(url);
        const ok=await saveClientLogo(url);
        setLogoBusy(false);
        if(!ok)setLogoErr('Shown here, but it couldn’t be stored for participants. Please try again.');
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }
  async function removeClientLogo(){
    setLogoBusy(true);setLogoErr('');setClientLogo('');
    await saveClientLogo('');
    setLogoBusy(false);
  }

  async function checkCode(){
    const c=codeInput.trim();
    if(!c){setCodeError('Please enter a code.');return;}
    setCodeChecking(true);setCodeError('');
    const ok=await validateCode(c);
    setCodeChecking(false);
    if(!ok)setCodeError('That code wasn’t recognised. Check it and try again.');
  }

  async function beginParticipant(){
    if(!entryReady())return;
    // Already assigned earlier this session (e.g. went Back to the landing and
    // returned)? Reuse the same id so we never create a second row.
    if(participantUuid){setStep(track==='stakeholder'?6:1);return;}
    setBeginning(true);setBeginError('');
    try{
      const r=await fetch('/api/assign-participant',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sessionCode:accessCode})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d&&d.id){
        setParticipantUuid(d.id);
        setParticipantId(d.participantId||'');
        setBeginning(false);
        setStep(track==='stakeholder'?6:1);
      }else{setBeginError('We couldn’t start your session. Please try again.');setBeginning(false);}
    }catch(e){setBeginError('We couldn’t start your session. Please try again.');setBeginning(false);}
  }

  async function saveToServer(isGenerate){
    if(!codeNorm||!participantUuid)return false;
    try{
      const r=await fetch('/api/hplt-save',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          session_code:codeNorm,
          participant_id:participantUuid,
          respondent_name:respondentName.trim()||undefined,
          track,
          role:role==='Other'?roleCustom:role,
          item_scores:track==='team'?scores:{},
          overall_score:overall||null,
          open_1:open1,open_2:open2,open_3:open3,
          generate_report:!!isGenerate,
          date:new Date().toISOString(),
        })});
      return r&&r.ok;
    }catch(e){console.warn('hplt-save error',e);return false;}
  }

  async function loadRespondents(){
    if(!codeNorm)return;
    try{
      const r=await fetch('/api/hplt-load?code='+encodeURIComponent(codeNorm)+'&_='+Date.now(),{cache:'no-store'});
      if(!r.ok)return;
      const d=await r.json();
      if(Array.isArray(d))setRespondents(d);
    }catch(e){}
  }

  async function removeParticipant(id){
    if(!codeNorm||!id)return;
    setRemovingId(id);setRemoveErr('');
    try{
      const r=await fetch('/api/hplt-delete',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({session_code:codeNorm,id})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d&&d.ok){
        setRespondents(prev=>prev.filter(x=>x.id!==id));
        setRemoveConfirmId('');
        loadRespondents();
      }else{setRemoveErr((d&&d.error)||'Could not remove. Please try again.');}
    }catch(e){setRemoveErr('Could not remove. Please try again.');}
    setRemovingId('');
  }

  async function submitFinal(){
    setSubmitting(true);setSubmitError('');
    let ok=false,attempt=0;
    while(!ok&&attempt<3){ok=await saveToServer(true);if(!ok){attempt++;if(attempt<3)await new Promise(r=>setTimeout(r,600));}}
    setSubmitting(false);
    if(!ok){setSubmitError('We couldn’t save your responses. Please check your connection and try again.');return;}
    try{clearProgress(accessCode);}catch(e){}
    setStep(8);
  }

  async function saveConfig(){
    if(!cfgTeam.trim()||!cfgSector)return false;
    setCfgSaving(true);setCfgError('');
    try{
      const r=await fetch('/api/save-session-config',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sessionCode:accessCode,tool:'ahamo-hplt',thingForEveryone:cfgTeam.trim(),thingType:'Team',sector:cfgSector})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d&&d.ok){setSessionConfig(d.sessionConfig||null);setCfgSaving(false);return true;}
      setCfgError((d&&d.error)||'Could not save. Please try again.');setCfgSaving(false);return false;
    }catch(e){setCfgError('Could not save. Please try again.');setCfgSaving(false);return false;}
  }

  async function copyParticipantLink(){
    const url=window.location.origin+'/ahamo-hplt2?code='+encodeURIComponent(codeNorm);
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(url);}
      else{window.prompt('Copy this participant link:',url);}
      setLinkCopied(true);setTimeout(()=>setLinkCopied(false),2200);
    }catch(e){window.prompt('Copy this participant link:',url);}
  }

  function unlockFacilitator(){
    const pw=window.prompt('Enter facilitator password:');
    if(pw==='Admin1*'){
      setFacUnlocked(true);
      if(sessionConfig){setCfgTeam(sessionConfig.thing_for_everyone||'');setCfgSector(sessionConfig.sector||'');}
      setStep(20);
    }else if(pw!==null){window.alert('Incorrect password.');}
  }

  // ── Validation helpers ────────────────────────────────────────────────────────
  function entryReady(){
    if(!track)return false;
    if(!role||(role==='Other'&&!roleCustom.trim()))return false;
    return true;
  }
  function dimComplete(dim){return MODEL[dim].subs.every(s=>s.items.every(it=>scores[it.n]>0));}

  function setScore(n,v){setScores(p=>({...p,[n]:v}));}

  function applyResume(d){
    if(d.track)setTrack(d.track);
    if(d.role)setRole(d.role);if(d.roleCustom)setRoleCustom(d.roleCustom);
    if(d.scores)setScores(d.scores);
    if(typeof d.overall==='number')setOverall(d.overall);
    if(d.open1)setOpen1(d.open1);if(d.open2)setOpen2(d.open2);if(d.open3)setOpen3(d.open3);
    if(d.participantUuid)setParticipantUuid(d.participantUuid);
    if(d.participantId)setParticipantId(d.participantId);
    setResumeData(null);
    setStep(d.step||(d.track==='stakeholder'?6:1));
  }

  function restart(){
    clearProgress(accessCode);
    setStep(-1);setAccessCode('');setCodeInput('');setCodeError('');setCodeChecking(false);setSessionConfig(null);
    setClientLogo('');setLogoErr('');setLogoBusy(false);
    setParticipantUuid('');setParticipantId('');setRespondentName('');setTrack('');setRole('');setRoleCustom('');
    setScores({});setOverall(0);setOpen1('');setOpen2('');setOpen3('');
    setBeginning(false);setBeginError('');setSubmitting(false);setSubmitError('');
    setResumeData(null);setFacUnlocked(false);setRespondents([]);
    setCfgTeam('');setCfgSector('');setCfgSaving(false);setCfgError('');
    setFacTile('');setFacEditing(false);setPdfBusy(false);
    setRemoveConfirmId('');setRemovingId('');setRemoveErr('');
  }

  // ── RENDERERS ─────────────────────────────────────────────────────────────────
  const teamName=(sessionConfig&&sessionConfig.thing_for_everyone)||'this team';

  function renderGate(){
    return(
      <div style={{maxWidth:'440px',margin:'2rem auto 0'}}>
        <label className="field-lbl">Enter your access code</label>
        <input className="inp" value={codeInput}
          onChange={e=>{setCodeInput(e.target.value);if(codeError)setCodeError('');}}
          onKeyDown={e=>{if(e.key==='Enter'&&!codeChecking)checkCode();}}
          autoFocus autoCapitalize="characters" autoComplete="off" spellCheck={false}
          style={{textTransform:'uppercase',letterSpacing:'.05em'}}/>
        {codeError&&<div style={{marginTop:'.65rem',fontSize:'.84rem',color:'#b23028',lineHeight:1.5}}>{codeError}</div>}
        <div className="btn-row" style={{marginTop:'1.25rem'}}>
          <button className="btn-p" disabled={!codeInput.trim()||codeChecking} onClick={checkCode}>
            {codeChecking?'Checking…':'Continue →'}
          </button>
        </div>
      </div>
    );
  }

  function renderResume(){
    if(!resumeData)return null;
    const when=resumeData.savedAt?new Date(resumeData.savedAt).toLocaleString('en-GB',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'recently';
    return(
      <div className="resume-box">
        <h3>Welcome back — continue where you left off?</h3>
        <p>We found a saved session from {when}.</p>
        <div className="btn-row" style={{marginTop:'.5rem'}}>
          <button className="btn-p" onClick={()=>applyResume(resumeData)}>Resume →</button>
          <button className="btn-s" onClick={()=>setResumeData(null)}>Start fresh</button>
        </div>
      </div>
    );
  }

  function renderLanding(){
    const ready=!!(sessionConfig&&sessionConfig.thing_for_everyone);
    return(
      <div>
        <div className="land-hero">
          <h1 className="land-title">High Performing Leadership Teams Diagnostic</h1>
          <p className="land-desc">This short diagnostic captures how your team is working today across five areas that define high-performing leadership teams. Your responses are combined with the rest of the team to produce a single team report.</p>
          <div className="land-time">⏱ Team members: about 10 minutes · Stakeholders: about 3 minutes</div>
        </div>

        {!ready&&(
          <div style={{background:'#fff',border:'1px solid var(--line)',borderRadius:'10px',padding:'1.25rem',marginBottom:'1.25rem'}}>
            <div style={{fontSize:'1rem',fontWeight:700,color:'var(--navy)',marginBottom:'.5rem'}}>The diagnostic isn’t open yet</div>
            <p style={{fontSize:'.86rem',color:'#4b5563',lineHeight:1.6,margin:0}}>Your facilitator hasn’t finished setting up this session. Please contact them, or wait a moment and refresh.</p>
            <div className="btn-row" style={{marginTop:'1rem'}}>
              <button className="btn-s" onClick={unlockFacilitator}>Facilitator ★</button>
            </div>
          </div>
        )}

        {ready&&(
          <div>
            <div style={{background:'#f4f7fb',border:'1px solid var(--line)',borderRadius:'10px',padding:'1rem 1.25rem',marginBottom:'1.5rem'}}>
              <div style={{fontSize:'.7rem',fontWeight:700,color:'var(--muted)',letterSpacing:'.05em',textTransform:'uppercase',marginBottom:'.3rem'}}>You are assessing</div>
              <div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--navy)'}}>{sessionConfig.thing_for_everyone}</div>
            </div>

            <label className="field-lbl">Are you a member of this team, or a stakeholder assessing it? <span style={{color:'var(--red)'}}>*</span></label>
            <div className="track-grid">
              <div className={'track-card'+(track==='team'?' on':'')} onClick={()=>setTrack('team')}>
                <h3>Team member</h3>
                <p>You’re part of this leadership team. You’ll answer 46 short statements plus a few open questions.</p>
              </div>
              <div className={'track-card'+(track==='stakeholder'?' on':'')} onClick={()=>setTrack('stakeholder')}>
                <h3>Stakeholder</h3>
                <p>You work with this team from outside it. You’ll give an overall score and answer three open questions.</p>
              </div>
            </div>

            <div style={{marginTop:'1.5rem'}}>
              <label className="field-lbl">Your role <span style={{color:'var(--red)'}}>*</span></label>
              <div style={{display:'flex',flexWrap:'wrap',gap:'.5rem',marginBottom:'.5rem'}}>
                {ROLES.map(r=>(
                  <button key={r} className={'chip'+(role===r?' on':'')} onClick={()=>{setRole(r);if(r!=='Other')setRoleCustom('');}}>{r}</button>
                ))}
              </div>
              {role==='Other'&&<input className="inp" placeholder="Describe your role…" value={roleCustom} onChange={e=>setRoleCustom(e.target.value)} style={{maxWidth:'360px'}}/>}
            </div>

            {renderResume()}

            <div className="disc"><strong>Privacy:</strong> Your responses are combined with the rest of the group to produce the team report. Individual answers are not attributed to you by name in the report.</div>

            <div className="btn-row">
              <button className="btn-p" disabled={!entryReady()||beginning} onClick={beginParticipant}>{beginning?'Starting…':'Begin →'}</button>
              <button className="btn-s" onClick={unlockFacilitator}>Facilitator ★</button>
            </div>
            {beginError&&<div style={{marginTop:'.65rem',fontSize:'.84rem',color:'#b23028'}}>{beginError}</div>}
          </div>
        )}
      </div>
    );
  }

  function renderDimension(dimIdx){
    const dim=MODEL[dimIdx];
    const done=dimComplete(dimIdx);
    const missing=dim.subs.flatMap(s=>s.items).filter(it=>!(scores[it.n]>0)).map(it=>it.n);
    const next=()=>setStep(dimIdx+1<5?dimIdx+2:6);
    const back=()=>setStep(dimIdx===0?0:dimIdx);
    return(
      <div className="fade">
        <button className="back-btn" onClick={back}>← Back</button>
        <div className="pg-tag">Area {dimIdx+1} of 5 · {teamName}</div>
        <div className="dim-band" style={{background:dim.colour}}>
          <div className="dim-name">{dim.name}</div>
          <div className="dim-desc">{dim.desc}</div>
        </div>
        <div className="stem">{STEM}</div>
        {dim.subs.map(sub=>(
          <div key={sub.name}>
            <div className="sub-hdr">{sub.name}</div>
            {sub.items.map(it=>(
              <div key={it.n} id={'itemcard-'+it.n} className={'item-card'+(scores[it.n]>0?' answered':'')}>
                <div className="item-text"><span className="lead">Team members </span>{it.t.charAt(0).toLowerCase()+it.t.slice(1)}</div>
                <ScaleSelect value={scores[it.n]||0} onChange={v=>setScore(it.n,v)}/>
              </div>
            ))}
          </div>
        ))}
        {!done&&(
          <div style={{fontSize:'.82rem',color:'var(--muted)',marginTop:'.9rem',lineHeight:1.9}}>
            {missing.length<=10?(
              <span>Still to do — tap to jump: {missing.map(n=>(
                <button key={n} type="button"
                  onClick={()=>{const el=document.getElementById('itemcard-'+n);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}}
                  style={{background:'#f0f3f9',border:'1px solid #cdd9ea',color:'var(--navy)',borderRadius:'7px',padding:'.2rem .55rem',margin:'0 .2rem',fontSize:'.82rem',fontWeight:700,cursor:'pointer',fontFamily:'Poppins,sans-serif',minHeight:'34px'}}>{n}</button>
              ))}</span>
            ):(
              <span>Answer every statement to continue — {missing.length} still to do.</span>
            )}
          </div>
        )}
        <div className="btn-row">
          <button className="btn-p" disabled={!done} onClick={next}>{dimIdx<4?'Next area →':'Continue →'}</button>
          <button className="btn-s" onClick={back}>← Back</button>
        </div>
      </div>
    );
  }

  function renderOverall(){
    const back=()=>setStep(track==='stakeholder'?0:5);
    return(
      <div className="fade">
        <button className="back-btn" onClick={back}>← Back</button>
        <div className="pg-tag">Overall performance · {teamName}</div>
        <h2 className="pg-title"><span className="hl">How is this team performing?</span></h2>
        <div className="title-rule"/>
        <p className="pg-sub">How would you score this team’s current performance, from 1 (underperforming) to 10 (excelling)?</p>
        <div className="ten">
          {Array.from({length:10},(_,i)=>i+1).map(v=>(
            <button key={v} type="button" className={'ten-btn'+(overall===v?' on':'')} onClick={()=>setOverall(v)}>{v}</button>
          ))}
        </div>
        <div className="ten-anchor"><span>1 · Underperforming</span><span>Excelling · 10</span></div>
        <div className="btn-row">
          <button className="btn-p" disabled={!overall} onClick={()=>setStep(7)}>Continue →</button>
          <button className="btn-s" onClick={back}>← Back</button>
        </div>
      </div>
    );
  }

  function renderOpen(){
    const setters={open_1:setOpen1,open_2:setOpen2,open_3:setOpen3};
    return(
      <div className="fade">
        <button className="back-btn" onClick={()=>setStep(6)}>← Back</button>
        <div className="pg-tag">A few open questions · {teamName}</div>
        <h2 className="pg-title"><span className="hl">In your own words</span></h2>
        <div className="title-rule"/>
        <p className="pg-sub">These three short answers are read alongside the scores. Say as much or as little as you like.</p>
        {OPEN_QS.map((q,i)=>(
          <div key={q.key} style={{marginBottom:'1.4rem'}}>
            <label className="field-lbl">{i+1}. {q.q}</label>
            <textarea className="inp inp-ta" value={openMap[q.key]} onChange={e=>setters[q.key](e.target.value)} placeholder="Your answer (optional)…"/>
          </div>
        ))}
        {submitError&&<div className="warn-box">{submitError}</div>}
        <div className="btn-row">
          {submitting?(
            <div className="think"><div className="dots"><div className="dot"/><div className="dot"/><div className="dot"/></div><span className="think-txt">Saving your responses…</span></div>
          ):(
            <button className="btn-p" onClick={submitFinal}>Submit →</button>
          )}
          <button className="btn-s" onClick={()=>setStep(6)}>← Back</button>
        </div>
      </div>
    );
  }

  function renderThanks(){
    return(
      <div className="fade">
        <div className="ty-card">
          <div className="ty-mark">✓</div>
          <h2>Thank you</h2>
          <p>Your responses for <strong>{teamName}</strong> have been recorded.</p>
          <p>They’ll be combined with the rest of the team to produce a single team report, which your facilitator will share and talk through with the group.</p>
        </div>
      </div>
    );
  }

  function renderFacilitator(){
    const ready=!!(sessionConfig&&sessionConfig.thing_for_everyone);
    const a=analyse(respondents);
    const total=a.real.length;

    // Setup not done yet, or explicitly editing → show the setup form
    if(!ready||facEditing){
      return(
        <div className="fade">
          <img src={AHAMO_LOGO} alt="AhaMo" style={{height:'32px',width:'auto',display:'block',marginBottom:'.5rem'}}/>
          <div className="pg-tag">Facilitator · {codeNorm}</div>
          <h2 className="pg-title" style={{fontSize:'1.5rem'}}>Session setup</h2>
          <div className="title-rule"/>
          {!ready&&<div className="inf-box">Fill these in to open the session. Until you save, participants who enter this code see “The diagnostic isn’t open yet.”</div>}
          <div style={{maxWidth:'560px'}}>
            <div style={{marginBottom:'1.1rem'}}>
              <label className="field-lbl">Name the team being assessed <span style={{color:'var(--red)'}}>*</span></label>
              <div className="field-sub">e.g. “The Executive Leadership Team”, “Product Leadership Team”.</div>
              <input className="inp" placeholder="Which team is this?" value={cfgTeam} onChange={e=>setCfgTeam(e.target.value)} disabled={cfgSaving}/>
            </div>
            <div style={{marginBottom:'1.1rem'}}>
              <label className="field-lbl">Sector <span style={{color:'var(--red)'}}>*</span></label>
              <select className="inp" value={cfgSector} onChange={e=>setCfgSector(e.target.value)} disabled={cfgSaving}>
                <option value="">Select…</option>
                {SECTORS.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
            <div style={{marginBottom:'1.1rem'}}>
              <label className="field-lbl">Client logo <span style={{color:'var(--muted)',fontWeight:400}}>(optional)</span></label>
              <div className="field-sub">Appears top-right — opposite the AhaMo logo — on every participant page and on the PDF report.</div>
              {clientLogo?(
                <div style={{display:'flex',alignItems:'center',gap:'1rem',flexWrap:'wrap',marginTop:'.5rem'}}>
                  <div style={{border:'1px solid var(--line)',borderRadius:'8px',padding:'.6rem .9rem',background:'#fff',display:'flex',alignItems:'center',minHeight:'56px'}}>
                    <img src={clientLogo} alt="Client logo preview" style={{height:'34px',width:'auto',maxWidth:'200px',objectFit:'contain',display:'block'}}/>
                  </div>
                  <label className="btn-s" style={{cursor:'pointer',margin:0}}>
                    {logoBusy?'Working…':'Replace'}
                    <input type="file" accept="image/png,image/jpeg" style={{display:'none'}} disabled={logoBusy} onChange={e=>{onLogoFile(e.target.files&&e.target.files[0]);e.target.value='';}}/>
                  </label>
                  <button className="btn-s" style={{color:'#b23028',borderColor:'#f0c8c2'}} disabled={logoBusy} onClick={removeClientLogo}>Remove</button>
                </div>
              ):(
                <label style={{display:'block',cursor:'pointer',marginTop:'.5rem'}}>
                  <div onDragOver={e=>{e.preventDefault();}} onDrop={e=>{e.preventDefault();onLogoFile(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]);}}
                    style={{border:'1.5px dashed var(--line)',borderRadius:'10px',padding:'1.25rem',textAlign:'center',background:'#fafbfc'}}>
                    <div style={{fontWeight:600,color:'var(--navy)',fontSize:'.92rem'}}>{logoBusy?'Working…':'Tap to choose a logo, or drop a file here'}</div>
                    <div style={{fontSize:'.78rem',color:'var(--muted)',marginTop:'.35rem',lineHeight:1.5}}>PNG or JPEG. A <strong>transparent PNG</strong> works best — it sits cleanly with no background box. Landscape or square logos suit the space; it’s resized automatically, so any size is fine (up to 10MB).</div>
                  </div>
                  <input type="file" accept="image/png,image/jpeg" style={{display:'none'}} disabled={logoBusy}
                    onChange={e=>{onLogoFile(e.target.files&&e.target.files[0]);e.target.value='';}}/>
                </label>
              )}
              {logoErr&&<div className="warn-box" style={{marginTop:'.6rem'}}>{logoErr}</div>}
            </div>
            {cfgError&&<div className="warn-box">{cfgError}</div>}
            <div className="btn-row" style={{marginTop:'.5rem'}}>
              <button className="btn-p" disabled={!cfgTeam.trim()||!cfgSector||cfgSaving} onClick={async()=>{const ok=await saveConfig();if(ok&&ready)setFacEditing(false);}}>{cfgSaving?'Saving…':ready?'Save changes':'Save and open session'}</button>
              {ready&&<button className="btn-s" onClick={()=>setFacEditing(false)}>Cancel</button>}
            </div>
          </div>
        </div>
      );
    }

    const meta={team:sessionConfig.thing_for_everyone,sector:sessionConfig.sector||'',date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),clientLogo:clientLogo||'',clientRatio:clientLogoRatio||2};
    const doPdf=()=>{
      if(!window.jspdf){window.alert('The report library is still loading — try again in a moment.');return;}
      setPdfBusy(true);
      setTimeout(()=>{try{generateReport(a,meta);}catch(e){console.error(e);window.alert('Report error: '+e.message);}setPdfBusy(false);},60);
    };

    const tiles=[
      {key:'overall',eyebrow:'Performance',title:'Overall performance',desc:'The 1–10 score, split three ways, with the full distribution.',metric:total?scoreText(a.oAll):null,unit:'/10',need:total>0},
      {key:'areas',eyebrow:'The five areas',title:'Areas, ranked',desc:'Every area scored 1–6 and ordered strongest to weakest.',metric:a.ranked.length?scoreText(a.ranked[0].mean):null,unit:'top',need:a.teamN>0},
      {key:'subareas',eyebrow:'The five areas',title:'Sub-areas',desc:'All fourteen sub-areas scored 1–6, grouped by area.',need:a.teamN>0},
      {key:'topbottom',eyebrow:'Detail',title:'Highest & lowest',desc:'The five strongest and five weakest items.',need:a.teamN>0},
      {key:'items',eyebrow:'Detail',title:'Item breakdown',desc:'Per-area stacked response bars, grouped by sub-theme.',need:a.teamN>0},
      {key:'verbatim',eyebrow:'Voice',title:'Verbatim feedback',desc:'The three open questions, collated by track.',need:total>0},
      {key:'reflection',eyebrow:'Conversation',title:'Reflection',desc:'Four closing questions to project for the team.',need:true},
      {key:'participants',eyebrow:'Admin',title:'Participants',desc:'Everyone who has submitted — remove duplicates or mistakes.',metric:a.allReal.length?String(a.allReal.length):null,unit:'entries',need:a.allReal.length>0},
      {key:'setup',eyebrow:'Admin',title:'Session setup',desc:'Team name, sector, and access details.',need:true},
    ];

    return(
      <div className="fade" style={{maxWidth:'1080px',margin:'0 auto'}}>
        <div className="dash-top">
          <div>
            <div style={{display:'flex',alignItems:'center',gap:'.9rem',marginBottom:'.4rem',flexWrap:'wrap'}}>
              <img src={AHAMO_LOGO} alt="AhaMo" style={{height:'30px',width:'auto',display:'block'}}/>
              {clientLogo&&<img src={clientLogo} alt="Client logo" style={{height:'30px',width:'auto',maxWidth:'160px',objectFit:'contain',display:'block'}}/>}
            </div>
            <div className="pg-tag" style={{marginBottom:'.2rem'}}>Facilitator dashboard · {codeNorm}</div>
            <h2 style={{fontSize:'1.5rem',fontWeight:800,color:'var(--navy)',lineHeight:1.15}}>{sessionConfig.thing_for_everyone}</h2>
          </div>
          <div className="dash-actions">
            <button className="btn-s" onClick={copyParticipantLink}>{linkCopied?'✓ Link copied':'⧉ Copy participant link'}</button>
            <button className="btn-p" onClick={doPdf} disabled={pdfBusy||!total}>{pdfBusy?'Building…':'⤓ Generate report'}</button>
          </div>
        </div>
        <div className="dash-counts" style={{marginTop:'.9rem'}}>
          <span className="count-pill"><span className="pulse"/>Live</span>
          <span className="count-pill"><span className="cn">{a.teamN}</span>team members</span>
          <span className="count-pill"><span className="cn">{a.stakeN}</span>stakeholders</span>
          <span className="count-pill"><span className="cn">{total}</span>completed</span>
          {a.inProgress>0&&<span className="count-pill" style={{color:'var(--muted)'}}><span className="cn">{a.inProgress}</span>in progress</span>}
          <button className="btn-s" style={{padding:'.35rem .85rem',minHeight:0,fontSize:'.8rem'}} onClick={loadRespondents}>Refresh</button>
        </div>

        {a.allReal.length===0&&(
          <div className="empty-dash">
            <div className="big">No responses yet</div>
            <p style={{fontSize:'.9rem',lineHeight:1.6,maxWidth:'440px',margin:'0 auto'}}>Share the access code with the team. As people complete the diagnostic, their responses appear here — the tiles fill in live.</p>
          </div>
        )}

        {a.allReal.length>0&&total===0&&(
          <div className="inf-box" style={{marginTop:'1rem'}}>{a.inProgress} {a.inProgress===1?'person has':'people have'} started but nobody has finished yet. The results tiles unlock once at least one person completes.</div>
        )}

        {a.allReal.length>0&&(
          <div className="tile-grid">
            {tiles.map(t=>(
              <button key={t.key} className="tile" disabled={!t.need} onClick={()=>{if(t.key==='setup'){setFacEditing(true);}else setFacTile(t.key);}}>
                <div className="tile-accent"/>
                <div className="tile-eyebrow">{t.eyebrow}</div>
                <div className="tile-title">{t.title}</div>
                <div className="tile-desc">{t.desc}</div>
                {t.metric&&<div className="tile-metric">{t.metric}<small> {t.unit}</small></div>}
              </button>
            ))}
          </div>
        )}

        <div className="btn-row" style={{marginTop:'2rem'}}>
          <button className="btn-s" onClick={restart}>Exit facilitator</button>
        </div>
      </div>
    );
  }

  function renderOverlay(){
    if(!facTile)return null;
    const a=analyse(respondents);
    const map={
      overall:{title:'Overall performance',sub:'“How is this team performing?” · 1–10',body:<OverallPanel a={a}/>},
      areas:{title:'The five areas, ranked',sub:'Average agreement per area · 1–6 · team members',body:<AreasRanked a={a}/>},
      subareas:{title:'The fourteen sub-areas',sub:'Average agreement per sub-area · 1–6 · team members',body:<SubAreasChart a={a}/>},
      items:{title:'Item breakdown',sub:'Response distribution per item · team members',body:<ItemDetail a={a}/>},
      topbottom:{title:'Highest & lowest scoring items',sub:'By team-member average · 1–6',body:<TopBottom a={a}/>},
      verbatim:{title:'Verbatim feedback',sub:'Open responses, collated by track',body:<Verbatim a={a}/>},
      reflection:{title:'Reflecting on this team’s results',sub:'Four closing questions for the conversation',body:<ReflectionPanel/>},
      participants:{title:'Participants',sub:'Remove a duplicate or a mistaken entry — this can’t be undone',body:renderParticipants(a)},
    };
    const v=map[facTile];
    if(!v)return null;
    return(
      <div className="ov" onClick={e=>{if(e.target===e.currentTarget){setFacTile('');setRemoveConfirmId('');}}}>
        <div className="ov-card">
          <div className="ov-head">
            <div><h2>{v.title}</h2><div className="sub">{v.sub}</div></div>
            <button className="ov-close" onClick={()=>{setFacTile('');setRemoveConfirmId('');}}>✕</button>
          </div>
          <div className="ov-body">{v.body}</div>
        </div>
      </div>
    );
  }

  function renderParticipants(a){
    // Real rows only (track set), in submission order, numbered to aid the facilitator.
    const rows=respondents.filter(isRealRow);
    if(!rows.length)return <div className="verb-empty">No participants yet.</div>;
    const fmt=(ts)=>{try{return new Date(ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};
    const itemsAnswered=(r)=>r.item_scores?Object.keys(r.item_scores).filter(k=>r.item_scores[k]>=1&&r.item_scores[k]<=6).length:0;
    return(
      <div>
        <p style={{fontSize:'.86rem',color:'#4b5563',lineHeight:1.6,marginBottom:'1rem'}}>{rows.length} {rows.length===1?'entry':'entries'}. If someone completed twice or entered by mistake, remove the extra row — the scores and report update straight away. Only completed entries count toward the results.</p>
        {removeErr&&<div className="warn-box">{removeErr}</div>}
        <div style={{border:'1px solid var(--line)',borderRadius:'10px',overflow:'hidden'}}>
          {rows.map((r,i)=>{
            const isTeam=r.track==='team';
            const complete=rowComplete(r);
            const confirming=removeConfirmId===r.id;
            const deleting=removingId===r.id;
            return(
              <div key={r.id||i} style={{display:'flex',alignItems:'center',gap:'.85rem',padding:'.75rem 1rem',borderBottom:i<rows.length-1?'1px solid var(--line)':'none',background:confirming?'#fff5f4':'#fff',flexWrap:'wrap'}}>
                <span style={{fontSize:'.72rem',fontWeight:700,color:'#fff',background:isTeam?'var(--green)':'var(--teal)',borderRadius:'6px',padding:'.2rem .5rem',flexShrink:0}}>{isTeam?'Team':'Stakeholder'}</span>
                <div style={{flex:1,minWidth:'160px'}}>
                  <div style={{fontSize:'.9rem',fontWeight:600,color:'var(--navy)'}}>Entry {i+1}{r.role?' · '+r.role:''} {complete?<span style={{fontSize:'.66rem',fontWeight:700,color:'var(--green)'}}>✓ COMPLETE</span>:<span style={{fontSize:'.66rem',fontWeight:700,color:'#c98a00'}}>◷ IN PROGRESS</span>}</div>
                  <div style={{fontSize:'.74rem',color:'var(--muted)'}}>
                    {r.overall_score?('Overall '+r.overall_score+'/10'):'no overall score'}
                    {isTeam?' · '+itemsAnswered(r)+'/46 items':''}
                    {r.created_at?' · '+fmt(r.created_at):''}
                    {r.pending_review?' · ⚠ after close':''}
                  </div>
                </div>
                {!confirming?(
                  <button className="btn-s" style={{padding:'.4rem .8rem',minHeight:0,fontSize:'.8rem',color:'#b23028',borderColor:'#f0c8c2'}} onClick={()=>{setRemoveErr('');setRemoveConfirmId(r.id);}}>Remove</button>
                ):(
                  <div style={{display:'flex',gap:'.4rem',alignItems:'center'}}>
                    <span style={{fontSize:'.78rem',color:'#b23028',fontWeight:600}}>Remove?</span>
                    <button className="btn-s" style={{padding:'.4rem .8rem',minHeight:0,fontSize:'.8rem'}} onClick={()=>setRemoveConfirmId('')} disabled={deleting}>Cancel</button>
                    <button className="btn-p" style={{padding:'.4rem .8rem',minHeight:0,fontSize:'.8rem',background:'#c0392b'}} onClick={()=>removeParticipant(r.id)} disabled={deleting}>{deleting?'Removing…':'Yes, remove'}</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── ROUTER ────────────────────────────────────────────────────────────────────
  return(
    <div className="shell" ref={topRef}>
      {step!==20&&<BrandHeader clientLogo={clientLogo}/>}
      {step>=1&&step<=7&&<Progress track={track} step={step}/>}
      {participantId&&step>=1&&step<=7&&(
        <div style={{maxWidth:'780px',margin:'.75rem auto 0',padding:'0 1.5rem'}}>
          <div style={{background:'var(--navy)',color:'#fff',padding:'.5rem .85rem',borderRadius:'8px',fontSize:'.78rem',display:'flex',justifyContent:'space-between',gap:'.65rem',flexWrap:'wrap'}}>
            <span style={{opacity:.85}}>You are <strong>Participant {participantId}</strong> ({track==='team'?'team member':'stakeholder'})</span>
            <span style={{opacity:.6}}>Session {codeNorm}</span>
          </div>
        </div>
      )}
      <div className="main">
        {step===20?(
          <div className="dash-wrap fade">{renderFacilitator()}</div>
        ):(
          <div className="content fade" key={step}>
            {step===-1&&renderGate()}
            {step===0&&renderLanding()}
            {step>=1&&step<=5&&renderDimension(step-1)}
            {step===6&&renderOverall()}
            {step===7&&renderOpen()}
            {step===8&&renderThanks()}
          </div>
        )}
      </div>
      {step===20&&renderOverlay()}
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  componentDidCatch(e){this.setState({error:e.message});}
  render(){
    if(this.state.error){
      return React.createElement('div',{style:{padding:'2rem',fontFamily:"'Poppins',sans-serif",background:'#fff5f4',border:'2px solid #EF4136',margin:'2rem',borderRadius:'10px'}},
        React.createElement('h3',{style:{color:'#EF4136',marginBottom:'1rem'}},'Something went wrong'),
        React.createElement('pre',{style:{fontSize:'.75rem',color:'#555',whiteSpace:'pre-wrap'}},this.state.error),
        React.createElement('button',{onClick:()=>this.setState({error:null}),style:{marginTop:'1rem',padding:'.5rem 1rem',background:'#20386D',color:'#fff',border:'none',borderRadius:'6px',cursor:'pointer'}},'Try again'));
    }
    return this.props.children;
  }
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ErrorBoundary,null,React.createElement(App,null)));
</script>
</body>
</html>
