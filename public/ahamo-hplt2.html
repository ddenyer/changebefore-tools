<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HPLT Diagnostic — AhaMo (v2)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#20396D; --red:#EF4136; --green:#8DC640; --blue:#32449C;
  --ltblue:#2484C6; --teal:#2295A0; --grey:#E8E8E8; --yellow:#FDE00A;
  --ink:#1a1a1a; --muted:#6b7280; --line:#e2e4e8; --bg:#ffffff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:rgba(0,0,0,0)}
button{-webkit-tap-highlight-color:rgba(0,0,0,0)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.fade{animation:fadeIn .3s ease both}
.shell{min-height:auto;display:flex;flex-direction:column}
.main{flex:1}
.content{max-width:780px;margin:0 auto;padding:2rem 1.5rem 3rem}

/* Wordmark */
.brand{display:inline-flex;align-items:baseline;font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1;color:var(--navy)}
/* Co-brand header — AhaMo left, client logo right, matched height, every page */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:820px;margin:0 auto;padding:1.1rem 1.5rem .4rem;min-height:54px}
.brandbar img{height:34px;width:auto;max-width:210px;display:block;object-fit:contain}
.brandbar .bb-r{margin-left:auto}
@media(max-width:560px){.brandbar img{height:26px;max-width:150px}}
.brand .dot{color:var(--red)}

/* Progress */
.prog-wrap{max-width:900px;margin:0 auto;padding:1rem 1.5rem .2rem}
.prog-bars{display:flex;gap:3px;margin-bottom:.35rem}
.prog-bar{flex:1;height:4px;border-radius:2px;background:var(--grey);transition:background .3s}
.prog-bar.done{background:var(--green)}.prog-bar.now{background:var(--navy)}
.prog-lbls{display:flex;gap:3px}
.prog-lbl{flex:1;font-size:.54rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:#b6bcc6;text-align:center}
.prog-lbl.done{color:var(--green)}.prog-lbl.now{color:var(--navy)}
@media(max-width:560px){.prog-lbl{font-size:.44rem}}

/* Headings */
.pg-tag{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:.5rem}
.pg-title{font-size:1.9rem;font-weight:800;color:var(--navy);line-height:1.15;margin-bottom:.4rem;position:relative;display:inline}
.hl{background:var(--yellow);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:.05em .12em}
.title-rule{height:5px;width:170px;border-radius:3px;background:linear-gradient(90deg,var(--ltblue),var(--green));margin:.7rem 0 1.3rem}
.pg-sub{font-size:.95rem;color:#4b5563;line-height:1.65;margin-bottom:1.5rem;max-width:620px}
h2.pg-title{display:block}

/* Landing hero */
.land-hero{border-bottom:1px solid var(--line);padding-bottom:1.75rem;margin-bottom:1.75rem}
.land-title{font-size:2.2rem;font-weight:800;color:var(--navy);line-height:1.12;margin:.9rem 0 .7rem}
.land-desc{font-size:.98rem;color:#4b5563;line-height:1.7;max-width:600px}
.land-time{display:inline-flex;align-items:center;gap:.4rem;background:var(--grey);border-radius:20px;padding:.35rem .9rem;font-size:.78rem;font-weight:600;color:#555;margin-top:.9rem}

/* Fields + buttons */
.field-lbl{font-size:.74rem;font-weight:700;color:var(--navy);display:block;margin-bottom:.35rem;letter-spacing:.02em}
.field-sub{font-size:.74rem;color:var(--muted);margin-bottom:.4rem;line-height:1.5}
.inp{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:.72rem 1rem;font-family:'Poppins',sans-serif;font-size:16px;color:var(--ink);outline:none;min-height:48px;transition:border-color .15s;background:#fff;display:block;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--navy)}.inp::placeholder{color:#b6bcc6}
.inp-ta{min-height:120px;resize:vertical;line-height:1.6}
select.inp{cursor:pointer;background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2712%27%20height%3D%278%27%20viewBox%3D%270%200%2012%208%27%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%3E%3Cpath%20d%3D%27M1%201l5%205%205-5%27%20stroke%3D%27%236b7280%27%20stroke-width%3D%271.5%27%20fill%3D%27none%27%20fill-rule%3D%27evenodd%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 1rem center;padding-right:2.5rem}
.btn-p{display:inline-flex;align-items:center;gap:.4rem;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:600;padding:.8rem 1.7rem;font-family:'Poppins',sans-serif;font-size:.9rem;cursor:pointer;min-height:46px;transition:background .15s,opacity .15s}
.btn-p:hover:not([disabled]){background:#182b54}.btn-p[disabled]{opacity:.35;cursor:not-allowed}
.btn-s{display:inline-flex;align-items:center;gap:.4rem;background:#fff;color:var(--navy);border:1.5px solid var(--line);border-radius:8px;font-weight:600;padding:.8rem 1.3rem;font-family:'Poppins',sans-serif;font-size:.9rem;cursor:pointer;min-height:46px;transition:border-color .15s}
.btn-s:hover{border-color:var(--navy)}
.btn-row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1.75rem}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;background:none;border:none;font-family:'Poppins',sans-serif;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer;padding:0;margin-bottom:1.4rem}
.back-btn:hover{color:var(--navy)}

/* Info / warn boxes */
.inf-box{background:#f4f7fb;border-left:4px solid var(--ltblue);padding:.85rem 1.1rem;border-radius:0 8px 8px 0;margin-bottom:1.2rem;font-size:.88rem;line-height:1.6;color:#374151}
.warn-box{background:#fff5f4;border:1px solid #f6c6c0;border-radius:8px;padding:.85rem 1.1rem;margin:.7rem 0;font-size:.85rem;color:#b23028}
.disc{font-size:.74rem;color:var(--muted);line-height:1.6;padding:.85rem 1rem;background:#f7f8fa;border-radius:8px;border:1px solid var(--line);margin-top:.75rem}

/* Chips (track / role) */
.chip{padding:.5rem .95rem;border-radius:22px;border:1.5px solid var(--line);background:#fff;color:#4b5563;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Poppins',sans-serif;min-height:42px;display:inline-flex;align-items:center}
.chip.on{border-color:var(--navy);background:#f0f3f9;color:var(--navy)}

/* Track cards */
.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.25rem 0 .5rem}
@media(max-width:560px){.track-grid{grid-template-columns:1fr}}
.track-card{border:2px solid var(--line);border-radius:12px;padding:1.25rem;background:#fff;cursor:pointer;transition:all .15s}
.track-card:hover{border-color:var(--ltblue)}
.track-card.on{border-color:var(--navy);background:#f0f3f9}
.track-card h3{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.35rem}
.track-card p{font-size:.82rem;color:#4b5563;line-height:1.55}

/* Item / scale */
.dim-band{border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1.4rem;color:#fff}
.dim-band .dim-name{font-size:1.15rem;font-weight:700;line-height:1.2}
.dim-band .dim-desc{font-size:.84rem;opacity:.92;margin-top:.3rem;line-height:1.5}
.sub-hdr{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:1.4rem 0 .5rem;padding-top:.6rem;border-top:1px solid var(--line)}
.stem{font-size:.82rem;color:var(--muted);font-style:italic;margin-bottom:.9rem}
.item-card{border:1.5px solid var(--line);border-radius:10px;padding:.95rem 1.05rem;margin-bottom:.65rem;background:#fff;transition:border-color .15s}
.item-card.answered{border-color:#d3e7bd;background:#fbfdf7}
.item-text{font-size:.92rem;font-weight:500;color:var(--ink);line-height:1.4;margin-bottom:.75rem}
.item-text .lead{color:var(--muted);font-weight:400}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.scale-btn{border:1.5px solid var(--line);border-radius:8px;padding:.5rem .2rem;cursor:pointer;text-align:center;background:#fff;transition:all .12s;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
.scale-btn:hover{border-color:#b6bcc6}
.scale-btn .sn{font-size:1rem;font-weight:700;line-height:1}
.scale-btn .sl{font-size:.56rem;font-weight:600;line-height:1.15;color:var(--muted)}
.scale-btn.on{border-color:transparent;color:#fff}
.scale-btn.on .sl{color:rgba(255,255,255,.9)}
.scale-btn.on.light{color:var(--ink)}
.scale-btn.on.light .sl{color:#4b5563}
@media(max-width:560px){
  .scale-btn .sl{display:none}
  .scale-btn{min-height:48px}
  .scale{gap:.3rem}
}
.scale-legend{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-top:.4rem;padding:0 .2rem}

/* Overall 1-10 */
.ten{display:grid;grid-template-columns:repeat(10,1fr);gap:.35rem;margin:.5rem 0}
@media(max-width:560px){.ten{grid-template-columns:repeat(5,1fr)}}
.ten-btn{border:1.5px solid var(--line);border-radius:8px;min-height:52px;font-size:1.05rem;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);transition:all .12s;display:flex;align-items:center;justify-content:center}
.ten-btn:hover{border-color:var(--ltblue)}
.ten-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ten-anchor{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:.3rem}

/* Thank you */
.ty-card{background:#f4f7fb;border:1px solid var(--line);border-radius:14px;padding:2rem 1.75rem;text-align:center;max-width:560px;margin:1.5rem auto}
.ty-mark{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;margin:0 auto 1rem}
.ty-card h2{font-size:1.4rem;font-weight:700;color:var(--navy);margin-bottom:.6rem}
.ty-card p{font-size:.92rem;color:#4b5563;line-height:1.65;margin-bottom:.6rem}

/* Facilitator */
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite;margin-right:.4rem}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

.resume-box{background:#f4f7fb;border:1px solid #cdd9ea;border-radius:10px;padding:1.25rem;margin-bottom:1.25rem}
.resume-box h3{font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:.5rem}
.resume-box p{font-size:.84rem;color:#4b5563;line-height:1.55;margin-bottom:.75rem}

.think{display:flex;align-items:center;gap:.75rem;padding:1.25rem 0}
.dots{display:flex;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ltblue);animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
.think-txt{font-size:.9rem;color:var(--muted);font-style:italic}

/* ── Dashboard ── */
.dash-head{max-width:1080px;margin:0 auto;padding:1.25rem 1.5rem .5rem}
.dash-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.dash-counts{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}
.count-pill{background:#f4f7fb;border:1px solid var(--line);border-radius:20px;padding:.35rem .85rem;font-size:.8rem;font-weight:600;color:var(--navy)}
.count-pill .cn{font-weight:800;margin-right:.25rem}
.dash-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.dash-wrap{max-width:1080px;margin:0 auto;padding:.5rem 1.5rem 3rem}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;margin-top:1rem}
.tile{border:1.5px solid var(--line);border-radius:14px;padding:1.15rem 1.25rem;background:#fff;cursor:pointer;transition:all .15s;text-align:left;font-family:'Poppins',sans-serif;position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column}
.tile:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(32,56,109,.4)}
.tile-accent{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--ltblue),var(--green))}
.tile-eyebrow{font-size:.64rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);margin-bottom:.4rem}
.tile-title{font-size:1.05rem;font-weight:700;color:var(--navy);line-height:1.2;margin-bottom:.3rem}
.tile-desc{font-size:.78rem;color:#6b7280;line-height:1.5;flex:1}
.tile-metric{font-size:1.9rem;font-weight:800;color:var(--navy);line-height:1;margin-top:.5rem}
.tile-metric small{font-size:.9rem;font-weight:600;color:var(--muted)}
.tile[disabled]{opacity:.5;cursor:not-allowed}
.tile[disabled]:hover{transform:none;box-shadow:none;border-color:var(--line)}

/* ── Overlay ── */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:2.5vh 1rem;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fadeIn .2s ease both}
.ov-card{background:#fff;border-radius:16px;width:100%;max-width:960px;margin:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.ov-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0;padding:1.1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;z-index:2}
.ov-head h2{font-size:1.3rem;font-weight:800;color:var(--navy);line-height:1.15}
.ov-head .sub{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.ov-close{background:#f4f7fb;border:none;width:38px;height:38px;border-radius:10px;font-size:1.2rem;color:var(--navy);cursor:pointer;flex-shrink:0;line-height:1}
.ov-close:hover{background:var(--grey)}
.ov-body{padding:1.5rem}
@media(max-width:560px){.ov-body{padding:1.1rem}.ov-head{padding:1rem 1.1rem}.ov-head h2{font-size:1.1rem}}

/* ── Charts ── */
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
@media(max-width:560px){.big3{grid-template-columns:1fr}}
.big-stat{border:1.5px solid var(--line);border-radius:12px;padding:1.25rem;text-align:center}
.big-stat.hero{background:var(--navy);border-color:var(--navy)}
.big-stat.hero .bs-num,.big-stat.hero .bs-lbl{color:#fff}
.bs-num{font-size:2.6rem;font-weight:800;color:var(--navy);line-height:1}
.bs-num small{font-size:1.1rem;font-weight:600;color:var(--muted)}
.big-stat.hero .bs-num small{color:rgba(255,255,255,.7)}
.bs-lbl{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:.4rem}
.bs-sub{font-size:.72rem;color:var(--muted);margin-top:.2rem}

.dist10{display:flex;align-items:flex-end;gap:.4rem;height:130px;margin:.5rem 0}
.dist10 .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dist10 .bar{width:100%;background:var(--ltblue);border-radius:4px 4px 0 0;min-height:3px;transition:height .3s;position:relative}
.dist10 .cnt{font-size:.7rem;font-weight:700;color:var(--navy);margin-bottom:.15rem}
.dist10 .xlab{font-size:.72rem;color:var(--muted);margin-top:.3rem}

.area-row{display:flex;align-items:center;gap:.85rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.area-row:last-child{border-bottom:none}
.area-rank{font-size:.85rem;font-weight:700;color:#b6bcc6;width:24px;flex-shrink:0}
.area-swatch{width:12px;height:38px;border-radius:4px;flex-shrink:0}
.area-info{flex:1;min-width:0}
.area-name{font-size:.95rem;font-weight:700;color:var(--navy)}
.area-desc{font-size:.72rem;color:var(--muted);line-height:1.4;margin-top:.1rem}
.area-track{flex:1;height:9px;background:var(--grey);border-radius:5px;overflow:hidden;max-width:180px}
.area-fill{height:100%;border-radius:5px}
.area-score{font-size:1.25rem;font-weight:800;color:var(--navy);width:52px;text-align:right;flex-shrink:0}
.area-score small{font-size:.7rem;color:var(--muted);font-weight:600}

.item-row{display:flex;align-items:center;gap:.75rem;padding:.55rem 0;border-bottom:1px solid #f0f1f4}
.item-row:last-child{border-bottom:none}
.item-num{font-size:.68rem;font-weight:700;color:#fff;background:var(--navy);border-radius:5px;padding:.15rem .4rem;flex-shrink:0}
.item-lab{flex:1;font-size:.84rem;color:var(--ink);line-height:1.35}
.item-lab .dim{font-size:.68rem;color:var(--muted);display:block}
.item-mean{font-size:1.05rem;font-weight:800;width:44px;text-align:right;flex-shrink:0}

.sbar{display:flex;height:24px;border-radius:5px;overflow:hidden;background:#f0f1f4}
.sbar-seg{display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:700;color:#fff;min-width:0}
.sbar-seg.light{color:#1a1a1a}
.sb-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.55rem}
.sb-txt{flex:1;font-size:.82rem;color:var(--ink);line-height:1.3;min-width:0}
.sb-bar{flex:1.4;max-width:340px}
.sb-mean{font-size:.95rem;font-weight:800;color:var(--navy);width:38px;text-align:right;flex-shrink:0}
.sub-block{margin-bottom:1.4rem}
.sub-block h4{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:.6rem}

.dim-tab{display:inline-flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.25rem}
.dim-pill{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:.4rem .85rem;font-size:.78rem;font-weight:600;color:#4b5563;cursor:pointer;font-family:'Poppins',sans-serif}
.dim-pill.on{color:#fff;border-color:transparent}

.verb-q{margin-bottom:1.75rem}
.verb-q h4{font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:.15rem}
.verb-split{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.7rem}
@media(max-width:640px){.verb-split{grid-template-columns:1fr}}
.verb-col h5{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.verb-item{background:#f7f8fa;border-left:3px solid var(--ltblue);border-radius:0 8px 8px 0;padding:.6rem .8rem;margin-bottom:.5rem;font-size:.84rem;line-height:1.5;color:#374151}
.verb-col.stake .verb-item{border-left-color:var(--teal)}
.verb-empty{font-size:.8rem;color:#b6bcc6;font-style:italic;padding:.4rem 0}

.empty-dash{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-dash .big{font-size:1.2rem;font-weight:700;color:var(--navy);margin-bottom:.5rem}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;

// ── HPLT MODEL ───────────────────────────────────────────────────────────────
// 5 dimensions · 46 agreement items (1–6) · sub-themes. Item stem:
// "To what extent do you agree team members…" then each item completes it.
const STEM='To what extent do you agree team members…';
const MODEL=[
  {key:'mindset',name:'Team mindset',colour:'#8DC640',
   desc:'How much team members have a shared direction and consistently pull in that same direction.',
   subs:[
     {name:'Know where the team is headed',items:[
       {n:1,t:'Share clear and compelling team goals'},
       {n:2,t:'Use clear metrics to track performance against team goals'},
       {n:3,t:'Share a clear view of what the team stands for'},
     ]},
     {name:'Pull in the same direction',items:[
       {n:4,t:'Prioritise collective goals over personal goals'},
       {n:5,t:"Share accountability for the team's performance"},
       {n:6,t:'Focus on outcomes instead of politics or power dynamics'},
     ]},
   ]},
  {key:'relationships',name:'Valued relationships',colour:'#2295A0',
   desc:'How much team members share mutual respect, show genuine care, and feel safe to be themselves.',

// ── LOCAL STORAGE ─────────────────────────────────────────────────────────────
function lsKey(code){return 'ahamo_hplt_'+(code||'anon').toLowerCase().trim().replace(/\s+/g,'_');}
function saveProgress(code,data){try{localStorage.setItem(lsKey(code),JSON.stringify({...data,savedAt:Date.now()}));}catch(e){}}
function loadProgress(code){try{const r=localStorage.getItem(lsKey(code));return r?JSON.parse(r):null;}catch(e){return null;}}
function clearProgress(code){try{localStorage.removeItem(lsKey(code));}catch(e){}}

// ── SCALE SELECTOR ────────────────────────────────────────────────────────────
function ScaleSelect({value,onChange}){
  return(
    <div>
      <div className="scale">
        {SCALE.map(s=>{
          const on=value===s.v;
          return(
            <button key={s.v} type="button"
              className={'scale-btn'+(on?' on'+(s.light?' light':''):'')}
              style={on?{background:s.c,borderColor:s.c}:{}}
              onClick={()=>onChange(s.v)}
              title={s.label}>
              <span className="sn">{s.v}</span>
              <span className="sl">{s.label}</span>
            </button>
          );
        })}
      </div>
      <div className="scale-legend"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  );
}

// Team members: 5 dimensions + Overall + Comments. Stakeholders: Overall + Comments.
function BrandHeader({clientLogo}){
  return(
    <div className="brandbar">
      <img src={AHAMO_LOGO} alt="AhaMo"/>
      {clientLogo?<img className="bb-r" src={clientLogo} alt="Client logo"/>:<span className="bb-r"/>}
    </div>
  );
}

function Progress({track,step}){
  const teamLabels=['Mindset','Relationships','Learning','Processes','Leadership','Overall','Comments'];
  const stakeLabels=['Overall','Comments'];
  // Map internal step to a nav index per track.
  let labels,nav;
  if(track==='stakeholder'){
    labels=stakeLabels;
    nav=step===6?0:step===7?1:step>=8?2:0;
  }else{
    labels=teamLabels;
    nav=(step>=1&&step<=5)?(step-1):step===6?5:step===7?6:step>=8?7:0;
  }
  return(
    <div className="prog-wrap">
      <div className="prog-bars">{labels.map((_,i)=><div key={i} className={'prog-bar'+(i<nav?' done':i===nav?' now':'')}/>)}</div>
      <div className="prog-lbls">{labels.map((l,i)=><div key={i} className={'prog-lbl'+(i<nav?' done':i===nav?' now':'')}>{l}</div>)}</div>
    </div>
  );
}

function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function isRealRow(r){return (r.track==='team'||r.track==='stakeholder')&&r.respondent_name!=='__facilitator__'&&r.respondent_name!=='__session_closed__';}
// A row "counts" only once the respondent has actually finished the scored part:
// team → all 46 items + an overall score; stakeholder → an overall score.
// This keeps people who began and abandoned out of the counts, stats and report.
function rowComplete(r){
  const o=r.overall_score;
  if(!(o>=1&&o<=10))return false;
  if(r.track==='stakeholder')return true;
  if(r.track==='team'){const s=r.item_scores||{};return ALL_ITEMS.every(n=>{const v=s[n];return typeof v==='number'&&v>=1&&v<=6;});}
  return false;
}

function analyse(rows){
  const allReal=(Array.isArray(rows)?rows:[]).filter(isRealRow);
  const real=allReal.filter(rowComplete);            // completed only — used for every stat
  const team=real.filter(r=>r.track==='team');
  const stake=real.filter(r=>r.track==='stakeholder');
  // In-progress (began, not yet complete) — counted for awareness, never in the stats.
  const inProgress=allReal.filter(r=>!rowComplete(r));
  const inProgressTeam=inProgress.filter(r=>r.track==='team').length;
  const inProgressStake=inProgress.filter(r=>r.track==='stakeholder').length;

  // Per-item stats (team only): mean, six-bucket distribution, n
  const items={};
  ALL_ITEMS.forEach(n=>{
    const vals=team.map(r=>(r.item_scores||{})[n]).filter(v=>typeof v==='number'&&v>=1&&v<=6);
    const dist=[0,0,0,0,0,0];
    vals.forEach(v=>dist[v-1]++);
    items[n]={mean:avg(vals),dist,n:vals.length};
  });

  // Sub-theme + dimension means (mean of item means, over items that have data)
  const dims=MODEL.map(d=>{
    const subs=d.subs.map(s=>{
      const withData=s.items.filter(it=>items[it.n].n>0);
      return {name:s.name,items:s.items,mean:withData.length?avg(withData.map(it=>items[it.n].mean)):0,hasData:withData.length>0};
    });
    const dItems=d.subs.flatMap(s=>s.items).filter(it=>items[it.n].n>0);
    return {key:d.key,name:d.name,colour:d.colour,desc:d.desc,subs,mean:dItems.length?avg(dItems.map(it=>items[it.n].mean)):0,hasData:dItems.length>0};
  });
  const ranked=[...dims].filter(d=>d.hasData).sort((a,b)=>b.mean-a.mean);

  // Flat item list (with dimension label) → top 5 / bottom 5 by mean
  const flat=[];
  MODEL.forEach(d=>d.subs.forEach(s=>s.items.forEach(it=>{
    if(items[it.n].n>0)flat.push({n:it.n,t:it.t,dim:d.name,colour:d.colour,mean:items[it.n].mean});
  })));
  const byMean=[...flat].sort((a,b)=>b.mean-a.mean);
  const top=byMean.slice(0,5);
  const bottom=[...byMean].reverse().slice(0,5);

  // Overall performance (Q47, 1–10)
  const oAll=avg(real.map(r=>r.overall_score).filter(v=>v>=1&&v<=10));
  const oTeam=avg(team.map(r=>r.overall_score).filter(v=>v>=1&&v<=10));
  const oStake=avg(stake.map(r=>r.overall_score).filter(v=>v>=1&&v<=10));
  const oDist=Array(10).fill(0);
  real.forEach(r=>{if(r.overall_score>=1&&r.overall_score<=10)oDist[r.overall_score-1]++;});

  // Open-ended, collated by question, split by track
  const open=OPEN_QS.map(q=>({
    q:q.q,
    team:team.map(r=>r[q.key]).filter(t=>t&&String(t).trim()),
    stake:stake.map(r=>r[q.key]).filter(t=>t&&String(t).trim()),
  }));

  return {allReal,real,team,stake,teamN:team.length,stakeN:stake.length,
    inProgress:inProgress.length,inProgressTeam,inProgressStake,
    items,dims,ranked,top,bottom,oAll,oTeam,oStake,oDist,open};
}

// 1–6 mean → red→amber→green colour
function meanColour(m){
  if(!m)return '#e8e8e8';
  const t=Math.max(0,Math.min(1,(m-1)/5));
  const S=[[226,59,51],[246,192,80],[95,160,42]];
  const lerp=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
  const c=t<0.5?lerp(S[0],S[1],t/0.5):lerp(S[1],S[2],(t-0.5)/0.5);
  return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
}
function scoreText(m){return m?m.toFixed(1):'—';}

// ── CHART COMPONENTS ──────────────────────────────────────────────────────────
// Stacked 6-segment distribution bar (red→green) for one item.
function StackBar({dist}){
  const total=dist.reduce((a,b)=>a+b,0)||1;
  return(
    <div className="sbar">
      {dist.map((c,i)=>{
        if(c===0)return null;
        const pct=c/total*100;
        return <div key={i} className={'sbar-seg'+(SCALE[i].light?' light':'')} style={{width:pct+'%',background:SCALE[i].c}} title={SCALE[i].label+': '+c}>{pct>=9?c:''}</div>;
      })}
    </div>
  );
}

function OverallPanel({a}){
  const max=Math.max(1,...a.oDist);
  return(
    <div>
      <div className="big3">
        <div className="big-stat hero"><div className="bs-num">{scoreText(a.oAll)}<small>/10</small></div><div className="bs-lbl">All respondents</div><div className="bs-sub" style={{color:'rgba(255,255,255,.7)'}}>{a.real.length} in total</div></div>
        <div className="big-stat"><div className="bs-num" style={{color:'var(--green)'}}>{scoreText(a.oTeam)}<small>/10</small></div><div className="bs-lbl">Team members</div><div className="bs-sub">{a.teamN} responses</div></div>
        <div className="big-stat"><div className="bs-num" style={{color:'var(--teal)'}}>{scoreText(a.oStake)}<small>/10</small></div><div className="bs-lbl">Stakeholders</div><div className="bs-sub">{a.stakeN} responses</div></div>
      </div>
      <div className="sub-block"><h4>Distribution — “How is this team performing?” (1–10)</h4>
        <div className="dist10">

            <div key={i} className="col">

    <div>
      <div className="dim-tab">
        {a.dims.map((dm,i)=>(
          <button key={dm.key} className={'dim-pill'+(i===active?' on':'')} style={i===active?{background:dm.colour}:{}} disabled={!dm.hasData} onClick={()=>setActive(i)}>{dm.name}</button>

        <div key={sub.name} className="sub-block">

        {SCALE.map(s=><span key={s.v} style={{display:'inline-flex',alignItems:'center',gap:'.25rem'}}><span style={{width:10,height:10,borderRadius:2,background:s.c,display:'inline-block'}}/>{s.label}</span>)}
      </div>

}
