<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collaboration &amp; Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root{
    --cb-bg:#f0ede8; --cb-text:#1a1a1a; --cb-accent:#e07030; --cb-dark:#1a1a1a;
    --cb-line:#d9d4cc; --cb-soft:#e7e2da; --cb-muted:#6a655d; --cb-tint:#fbeee5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cb-bg);color:var(--cb-text);
    font-family:'DM Sans',sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .cb-wrap{max-width:760px;margin:0 auto;padding:0 18px 90px}
  h1,h2{font-family:'Cormorant Garamond',serif;font-weight:400;line-height:1.1;margin:0}
  h1{font-size:34px;margin:6px 0 4px}
  h2{font-size:26px;margin:4px 0}
  p{margin:8px 0}
  .cb-muted{color:var(--cb-muted)}
  .cb-small{font-size:14px}
  .cb-tiny{font-size:12.5px}
  .cb-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
    padding:0 22px;background:var(--cb-accent);color:#fff;border:none;border-radius:4px;
    font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer}
  .cb-btn:disabled{opacity:.4;cursor:not-allowed}
  .cb-btn.ghost{background:transparent;color:var(--cb-text);border:1px solid var(--cb-line)}
  .cb-btn.small{min-height:38px;padding:0 16px;font-size:14px}
  .cb-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .cb-bar{position:sticky;top:0;z-index:30;background:var(--cb-bg);border-bottom:1px solid var(--cb-line);
    padding:10px 0;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cb-you{font-size:13px;font-weight:600}
  .cb-you span{color:var(--cb-muted);font-weight:500}
  .cb-help{width:30px;height:30px;border-radius:50%;border:1px solid var(--cb-line);background:transparent;
    font-weight:600;cursor:pointer;flex:0 0 auto}
  .cb-prog{height:4px;background:var(--cb-soft);border-radius:3px;overflow:hidden;margin:0 0 16px}
  .cb-prog>div{height:4px;background:var(--cb-accent);transition:width .25s}
  .cb-card{background:#fff;border:1px solid var(--cb-line);border-radius:8px;padding:14px;margin:10px 0}
  .cb-headcard{background:#fff;border:1px solid var(--cb-line);border-radius:8px;padding:13px 14px;margin:6px 0 14px}
  .cb-fnname{font-weight:600}
  .cb-sn{color:var(--cb-muted);font-size:13px;font-weight:500;margin-left:6px}
  .cb-desc{color:var(--cb-muted);font-size:13.5px;margin-top:2px;line-height:1.45}
  .cb-roles{font-size:13px;color:var(--cb-muted);margin-top:6px}
  .cb-roles b{color:var(--cb-text);font-weight:600}
  .cb-link{background:none;border:none;color:var(--cb-accent);font-size:13px;cursor:pointer;padding:4px 0;font-weight:600}
  .cb-chip{display:block;width:100%;text-align:left;padding:12px 13px;margin:8px 0;border:1px solid var(--cb-line);
    border-radius:7px;background:#fff;cursor:pointer;font-size:15.5px;font-family:inherit;color:var(--cb-text)}
  .cb-chip.on{border-color:var(--cb-accent);background:var(--cb-tint);box-shadow:inset 0 0 0 1px var(--cb-accent)}
  .cb-chip:disabled{opacity:.45;cursor:not-allowed}
  .cb-chk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;
    border:1.5px solid var(--cb-line);background:#fff;color:#fff;font-size:12px;margin-right:9px;vertical-align:-4px}
  .cb-chip.on .cb-chk{background:var(--cb-accent);border-color:var(--cb-accent)}
  /* tabs (needs) */
  .cb-tabs{display:flex;gap:6px;background:var(--cb-soft);padding:5px;border-radius:10px;margin:10px 0 12px}
  .cb-tab{flex:1;border:none;background:transparent;border-radius:7px;padding:9px 2px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:600;color:var(--cb-muted);position:relative}
  .cb-tab.active{background:#fff;color:var(--cb-text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .cb-tab .cb-badge{position:absolute;top:-5px;right:3px;background:var(--cb-accent);color:#fff;font-size:10px;
    font-weight:700;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
  .cb-tab .cb-badge.full{background:var(--cb-dark)}
  /* level cards (collaboration) */
  .cb-level{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--cb-line);
    border-radius:8px;background:#fff;cursor:pointer;font-family:inherit;color:var(--cb-text)}
  .cb-level.on{border-color:var(--cb-accent);background:var(--cb-tint);box-shadow:inset 0 0 0 1px var(--cb-accent)}
  .cb-level .lvtitle{font-weight:600;font-size:15px;margin-bottom:3px}
  .cb-level .lvtitle .num{color:var(--cb-muted);margin-right:7px}
  .cb-level .lvdesc{font-size:13.5px;line-height:1.42;color:var(--cb-muted)}
  .cb-level.on .lvdesc{color:var(--cb-text)}
  /* 1-5 scale (trust) */
  .cb-scale{display:flex;gap:6px;margin-top:9px}
  .cb-scale button{flex:1;min-height:46px;border:1px solid var(--cb-line);background:#fff;border-radius:6px;
    cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;color:var(--cb-text)}
  .cb-scale button.on{background:var(--cb-accent);border-color:var(--cb-accent);color:#fff}
  .cb-input{width:100%;padding:11px 13px;border:1px solid var(--cb-line);border-radius:6px;font-size:16px;font-family:inherit;background:#fff}
  .cb-count{font-size:13px;color:var(--cb-muted)}
  .cb-foot{position:fixed;left:0;right:0;bottom:0;background:var(--cb-bg);border-top:1px solid var(--cb-line);
    padding:12px 18px;z-index:25}
  .cb-foot .cb-wrap2{max-width:760px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cb-modal{position:fixed;inset:0;background:rgba(26,26,26,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .cb-sheet{background:var(--cb-bg);width:100%;max-width:760px;max-height:82vh;overflow:auto;border-radius:12px 12px 0 0;padding:18px}
  .cb-tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--cb-muted)}
  .cb-err{background:#fbe6e0;border:1px solid #e7a78f;color:#8a2a10;padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
  .cb-ok{background:#e7f0e7;border:1px solid #9ec19e;padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
  .cb-center{text-align:center}
  .cb-spacer{height:70px}
  .cb-divide{border-top:1px solid var(--cb-line);margin:14px 0}

  /* ===== reveal (ordered walkthrough) ===== */
  .cbr{max-width:860px;margin:0 auto;padding:0 20px 90px}
  .cbr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;position:sticky;top:0;background:var(--cb-bg);border-bottom:1px solid var(--cb-line);z-index:20;margin-bottom:14px}
  .cbr-top .l b{font-size:15px}
  .cbr-top .l span{color:var(--cb-muted);font-size:12.5px;margin-left:8px}
  .cbr-step{margin:40px 0 0}
  .cbr-stepn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--cb-dark);color:#fff;font-size:13px;font-weight:600;margin-right:10px;vertical-align:2px;font-family:'DM Sans',sans-serif}
  .cbr-h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:27px;margin:0;display:inline}
  .cbr-cap2{color:var(--cb-muted);font-size:14px;margin:6px 0 14px}
  .cbr-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .cbr-card{background:#fff;border:1px solid var(--cb-line);border-radius:9px;padding:14px 15px}
  .cbr-card h3{font-size:15.5px;font-weight:600;margin:0 0 9px}
  .cbr-li{font-size:14px;line-height:1.5;margin:6px 0;display:flex;gap:7px}
  .cbr-li .b{color:var(--cb-accent);flex:0 0 auto}
  .cbr-nd{font-size:14px;line-height:1.45;margin:7px 0}
  .cbr-nd .req{color:var(--cb-muted);font-size:12px;display:block;margin-bottom:1px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
  .cbr-empty{color:var(--cb-muted);font-size:13px}
  .cbr-comp{margin:20px 0 0}
  .cbr-comph{font-size:16px;font-weight:600;margin:0 0 1px}
  .cbr-compg{color:var(--cb-muted);font-size:13px;margin:0 0 10px}
  .cbr-mx2{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
  .cbr-mx2 th{font-size:12.5px;font-weight:600;color:var(--cb-muted);padding:4px 2px;text-align:center;vertical-align:bottom}
  .cbr-corner{text-align:left !important;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;line-height:1.2}
  .cbr-rh{font-size:13px;font-weight:600;text-align:right;padding-right:8px;width:84px}
  .cbr-cell{text-align:center;border-radius:6px;font-size:18px;font-weight:600;padding:12px 2px;font-variant-numeric:tabular-nums}
  .cbr-diag{background:repeating-linear-gradient(45deg,var(--cb-soft),var(--cb-soft) 4px,transparent 4px,transparent 8px);border-radius:6px}
  .cbr-leg2{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12px;color:var(--cb-muted)}
  .cbr-scale{height:11px;width:150px;border-radius:6px;background:linear-gradient(90deg,rgb(201,143,136),rgb(231,226,218),rgb(143,174,147))}
  .cbr-eqbox{background:var(--cb-dark);color:var(--cb-bg);border-radius:12px;padding:26px 22px;margin:24px 0 0;text-align:center}
  .cbr-eqlabel{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#c9b9a8;margin-bottom:14px}
  .cbr-eq{display:inline-flex;align-items:center;gap:18px}
  .cbr-eq .lhs{font-family:'Cormorant Garamond',serif;font-size:34px}
  .cbr-eq .frac{display:inline-flex;flex-direction:column;text-align:center}
  .cbr-eq .num{font-size:17px;font-weight:500;padding:0 14px 8px}
  .cbr-eq .den{font-size:17px;font-weight:500;padding:8px 14px 0;border-top:2px solid var(--cb-bg)}
  .cbr-eqnote{font-size:14px;color:#d9cfc3;max-width:620px;margin:18px auto 0;line-height:1.55}
  .cbr-eqnote b{color:#fff;font-weight:600}
  .cbr-panel2{background:#fff;border:1px solid var(--cb-line);border-radius:10px;padding:16px;font-size:14px;color:var(--cb-muted)}
  @media(max-width:520px){.cbr-eq .lhs{font-size:26px}.cbr-eq .num,.cbr-eq .den{font-size:14px}}


  /* needs tabs prominent */
  .cb-tabs.big{padding:6px;gap:7px}
  .cb-tabs.big .cb-tab{padding:12px 2px;font-size:14px}
  .cb-tabs.big .cb-tab.active{font-weight:600}
  /* collaboration horizontal picker */
  .cb-hpick{display:flex;gap:5px;margin:12px 0 10px}
  .cb-hpick button{flex:1;border:1px solid var(--cb-line);background:#fff;border-radius:8px;padding:9px 2px 7px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--cb-text)}
  .cb-hpick button .n{font-size:18px;font-weight:600;line-height:1}
  .cb-hpick button .w{font-size:9px;color:var(--cb-muted);line-height:1.12;text-align:center}
  .cb-hpick button.on{background:var(--cb-accent);border-color:var(--cb-accent);color:#fff}
  .cb-hpick button.on .w{color:#fff}
  .cb-hdesc{background:#fff;border:1px solid var(--cb-line);border-radius:8px;padding:13px 14px;min-height:80px}
  .cb-hdesc.empty{color:var(--cb-muted);display:flex;align-items:center;font-size:14px}
  .cb-hdesc .hw{font-weight:600;margin-bottom:5px}
  .cb-hdesc .hd{font-size:14px;line-height:1.5;color:var(--cb-text)}
  /* collaboration summary matrix */
  .cb-cmx{margin:12px 0 0}
  .cb-cmx .row{display:flex;align-items:center;gap:11px;padding:8px 0;cursor:pointer;border-top:1px solid var(--cb-line)}
  .cb-cmx .row:first-child{border-top:none}
  .cb-cmx .nm{flex:1;font-size:15px;font-weight:500}
  .cb-cmx .cell{width:44px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:0 0 auto}
  .cb-cmx .lw{width:104px;font-size:12.5px;color:var(--cb-muted);flex:0 0 auto;text-align:right}
  /* system-not-department reminder */
  .cb-sysnote{font-size:11.5px;color:var(--cb-muted);margin-top:2px;line-height:1.3}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ---------------- Content ---------------- */
const FUNCTIONS = [
  { id:'S5', name:'Strategy & Governance', tag:'sets direction, priorities and governance',
    roles:`executives, directors, board members, strategy and governance leads`,
    remit:`Organisational purpose, direction and legitimacy. Setting priorities, resolving strategic trade-offs, establishing governance and executive coordination, and stewarding the organisation's public positioning, regulatory posture and reputation. Holding accountability for coherence across the whole system in relation to its environment.` },
  { id:'S4', name:'Data, Analytics & Insight', tag:'turns data into insight and foresight',
    roles:`analysts, performance and insight teams, forecasters, researchers`,
    remit:`Environmental scanning, performance intelligence, forecasting and organisational learning. Generating insight into demand, trends, external change, context and user experience to inform strategic and operational decisions.` },
  { id:'S3', name:'Performance, Risk & Assurance', tag:'sets standards, manages risk, gives assurance',
    roles:`risk, audit, compliance, safety and quality assurance roles`,
    remit:`Organisational regulation and stewardship. Setting standards, monitoring performance, managing risk, providing assurance, and ensuring resources, controls and accountabilities protect outcomes and the organisation's licence to operate.` },
  { id:'S2', name:'Operations Planning & Coordination', tag:'plans, coordinates and sequences the work',
    roles:`planners, schedulers, programme and PMO roles, coordinators`,
    remit:`Translating strategic intent into integrated plans. Coordinating interdependencies, sequencing work, managing handovers and stabilising operational flow across services, including cross-organisational partnerships and coordinated communication across the system.` },
  { id:'S1', name:'Frontline Service Delivery', tag:'delivers services where users experience them',
    roles:`frontline and service-delivery teams, operators, customer-facing roles`,
    remit:`Delivery of core services where users and partners directly experience the organisation. Managing demand, operational realities, service quality, relationships and real-time problem solving. Creating value, trust and insight through everyday interaction.` },
];
const FN = {}; FUNCTIONS.forEach(f=>FN[f.id]=f);
const ORDER = ['S5','S4','S3','S2','S1'];
const SHORT = { S5:'Strategy', S4:'Insight', S3:'Risk', S2:'Operations', S1:'Frontline' };

const PRIORITIES = {
  S5:[`Setting clear direction and purpose`,`Resolving strategic trade-offs and priorities`,`Protecting legitimacy and licence to operate`,`Stewarding reputation and external positioning`,`Holding the whole system coherent`,`Governance and executive coordination`],
  S4:[`Scanning the environment for change and risk`,`Forecasting demand and future conditions`,`Generating actionable insight for decisions`,`Understanding user experience and context`,`Driving organisational learning`,`Providing honest performance intelligence`],
  S3:[`Setting and upholding standards`,`Managing and mitigating risk`,`Providing assurance and control`,`Protecting outcomes and licence to operate`,`Holding clear accountability`,`Stewarding resources responsibly`],
  S2:[`Translating strategy into integrated plans`,`Coordinating interdependencies across services`,`Managing handovers and sequencing work`,`Stabilising operational flow`,`Sustaining partnerships across the system`,`Keeping communication coordinated`],
  S1:[`Delivering core services to standard`,`Managing demand and operational reality`,`Protecting service quality`,`Solving problems in real time`,`Building trust through everyday interaction`,`Surfacing what's really happening on the ground`],
};

/* 8 seeded needs per target (2 per requester, mixed/unlabelled) */
const NEEDS = {
  S5:[`Clear, stable direction we can plan and deliver against`,`A clear, owned statement of risk appetite`,`Timely decisions when priorities conflict`,`Clarity on the questions that matter most to leadership`,`Backing when we make difficult calls at the front line`,`Stable priorities we can plan and sequence around`,`Strategic decisions that actually use our evidence`,`Visible backing when we enforce standards`],
  S4:[`Insight that informs our strategic choices`,`Accurate demand forecasts we can plan around`,`The user picture that helps us serve better`,`Reliable data to monitor performance and risk`,`Early warning of external change and emerging trends`,`Insight we can act on, not just dashboards`,`Quick updates when the demand picture changes`,`Evidence that backs our assurance judgements`],
  S3:[`Confidence the organisation is in control`,`Controls that protect us without blocking delivery`,`Support when we're under pressure, not just scrutiny`,`Clarity on the standards and thresholds to measure against`,`Risks surfaced early enough to act on`,`Assurance that protects us, not catches us out`,`Clear accountability so we know who owns what`,`Action taken when our analysis flags a problem`],
  S2:[`Strategy turned into plans that actually deliver`,`Clean handovers between us and other teams`,`Plans that build in risk and controls from the start`,`Our forecasts built into how work is sequenced`,`Coordinated execution across the whole system`,`Stable, predictable flow, not constant rescheduling`,`Visibility of the dependencies that could fail`,`A clear plan we can align our analysis to`],
  S1:[`The unfiltered reality of what's happening on the ground`,`Early flags when something operational is going wrong`,`Problems surfaced early, not absorbed until they escalate`,`Honest feedback and data we can learn from`,`Strategy delivered where it meets users`,`What users are really experiencing`,`Standards followed where it counts`,`Honest feedback on whether plans actually work in practice`],
};
const NEED_CAP = 2; // max picks per target

const LEVELS = ['Disconnected','Contained','Informed','Consulted','Partnered','System-owned'];
const CELL = {
  S5:[`Leadership operates in isolation, protecting strategic space. Information is filtered, challenge is discouraged, and engagement is used to manage perception rather than shape decisions.`,`Strategy is developed within a small senior circle. Interaction with others is limited to cascades, governance forums and escalation.`,`Strategy teams share plans and performance information, and seek views, but problem-framing and trade-offs remain internally owned.`,`Strategic issues are explored jointly with other functions, with shared discussion of risks, options and implications.`,`Strategy and governance are co-shaped with operational, insight and assurance leaders around shared system outcomes.`,`Strategy emerges through persistent system-level forums where authority, evidence and accountability are organised around end-to-end performance.`],
  S4:[`Insight is controlled and politicised. Data that challenges dominant narratives is downplayed, delayed or withheld.`,`Insight teams work in technical silos, producing outputs that primarily serve their own reporting agendas.`,`Insight teams respond to requests, sharing data and analysis, but rarely shaping questions or collective interpretation.`,`Insight teams work with others to frame questions, interpret findings and explore implications.`,`Insight is co-produced across functions and actively shapes decisions, design and adaptation.`,`Sensing and learning are embedded capabilities, with shared ownership of foresight, feedback and experimentation.`],
  S3:[`Assurance is defensive and isolating. Information is used to protect positions, shift blame or avoid scrutiny.`,`Assurance operates as a policing function, engaging late and reinforcing separation from delivery.`,`Assurance provides structured challenge and advice, influencing plans and reviews but remaining largely episodic.`,`Risk and assurance work with other functions to anticipate issues and strengthen performance.`,`Assurance is part of cross-system problem-solving, shaping controls, priorities and trade-offs.`,`Risk ownership, control and learning are system properties embedded across everyday work.`],
  S2:[`Functions plan independently, building local workarounds. Coordination only occurs through crisis management.`,`Planning is function-by-function, with handovers, escalation routes and informal negotiation compensating for weak integration.`,`Plans and dependencies are shared, and coordination forums exist, but integration remains partial.`,`Functions work together to align plans, manage interdependencies and adjust delivery.`,`End-to-end services and flows are co-designed and actively orchestrated.`,`Coordination is an embedded system capability enabling continuous reconfiguration.`],
  S1:[`Frontline teams work defensively, creating local fixes, withholding issues and absorbing system failures. Others work around them.`,`Frontline teams optimise within their remit, escalating what they cannot solve and relying on workarounds.`,`Frontline teams provide data, feedback and ideas, and receive guidance and support.`,`Frontline leaders work with planners, insight and assurance to jointly improve services.`,`Frontline experience continuously shapes system decisions and redesign.`,`Frontline teams operate with system-level awareness and shared data, using delegated authority to improve services and resolve cross-boundary issues in ways that strengthen whole-system outcomes.`],
};
const TRUST = [
  { id:'credibility', label:'Credibility', q:`Can you trust what they say? Their knowledge, and their honesty.` },
  { id:'reliability', label:'Reliability', q:`Can you trust what they do? Their consistency, and delivery.` },
  { id:'intimacy',    label:'Intimacy',    q:`Is it safe to be candid with them? To raise problems, disagree, admit fault.` },
  { id:'stewardship', label:'Stewardship', q:`Under pressure, do they act for the whole system, or just themselves? (Higher = for the whole.)` },
];
const LS_KEY = 'cb_collab_v1';

/* ---------------- Helpers ---------------- */
async function api(path, body){
  try{
    const r = await fetch('/api/'+path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    let j = {};
    try{ j = await r.json(); }catch(e){ j = {}; }
    if(!r.ok) return Object.assign({ ok:false, httpError:r.status }, j);
    return j;
  }catch(e){
    return { ok:false, netError:true };
  }
}
async function saveWithRetry(payload){
  const delays=[0,500,2000];
  for(let a=0;a<3;a++){
    try{
      const r=await fetch('/api/collab-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(r.ok) return true;
    }catch(e){}
    await new Promise(res=>setTimeout(res,delays[a]));
  }
  alert("We couldn't save right now. Please check your connection and try again.");
  return false;
}
function otherFns(myId){ return ORDER.filter(id=>id!==myId); }

/* ---------------- Small components ---------------- */
function TopBar({ myId, onHelp }){
  const f = FN[myId];
  return (
    <div className="cb-bar">
      <div>
        <div className="cb-you">You are: {f? f.name : '—'} {f && <span>· {myId}</span>}</div>
        <div className="cb-sysnote">A function of the system, not a department — those who do it may be spread across teams and roles.</div>
      </div>
      <button className="cb-help" onClick={onHelp} aria-label="Function glossary">?</button>
    </div>
  );
}
function Progress({ pct }){ return <div className="cb-prog"><div style={{width:pct+'%'}}/></div>; }
function Expand({ title, children }){
  const [open,setOpen]=useState(false);
  return (
    <div className="cb-expand">
      <button className="cb-link" onClick={()=>setOpen(o=>!o)}>{open?'Hide':title}</button>

function PickFunction({ code, systemName, claimed, current, onClaimed, onBack }){
  const [sel,setSel]=useState(current||''); const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const [taken,setTaken]=useState(claimed||[]);
  async function go(){
    setErr('');
    if(sel===current){ onClaimed(sel); return; }
    setBusy(true);
    if(current){ await api('collab-release',{code,fn:current}); }
    const r=await api('collab-claim',{code,fn:sel});
    setBusy(false);
    if(r && r.taken){ setErr('That function was just taken. Pick another.'); setTaken(t=>t.includes(sel)?t:[...t,sel]); setSel(''); return; }
    if(!r || !r.ok){ setErr('Could not claim that function. Try again.'); return; }
    onClaimed(sel);
  }
  return (
    <div className="cb-wrap">
      <div className="cb-spacer" style={{height:32}}/>
      <span className="cb-tag">{systemName}</span>
      <h1>Which function are you?</h1>
      <p className="cb-muted">Pick the function your group has been given. You'll answer as this function —
        thinking like the people who do this work. Greyed-out functions are already taken.</p>
      {ORDER.map(id=>{
        const isMine = id===current;
        const isTaken = taken.includes(id) && !isMine;
        return (
          <button key={id} className={'cb-chip'+(sel===id?' on':'')} disabled={isTaken} onClick={()=>setSel(id)}>
            <span className="cb-fnname">{FN[id].name}</span><span className="cb-sn">{id}</span>
            {isMine && <span className="cb-sn"> — yours</span>}
            {isTaken && <span className="cb-sn"> — taken</span>}
          </button>
        );
      })}
      {err && <div className="cb-err">{err}</div>}
      <div className="cb-spacer"/>
      <Foot left={<button className="cb-btn ghost" onClick={onBack}>Back</button>}
        right={<button className="cb-btn" disabled={!sel||busy} onClick={go}>{busy?'…':'Confirm'}</button>} />
    </div>
  );
}

function Priorities({ myId, value, onBack, onNext }){
  const menu=PRIORITIES[myId];
  const [picked,setPicked]=useState(value&&value.length?value:[]);
  const [custom,setCustom]=useState('');
  function toggle(t){ setPicked(p=> p.includes(t)? p.filter(x=>x!==t) : (p.length>=3? p : [...p,t])); }
  function addCustom(){ const t=custom.trim(); if(t && picked.length<3 && !picked.includes(t)){ setPicked(p=>[...p,t]); setCustom(''); } }
  const all=[...menu, ...picked.filter(p=>!menu.includes(p))];
  return (
    <div className="cb-wrap">
      <span className="cb-tag">Part 1 · Your function</span>
      <h2>Your top three priorities</h2>
      <p className="cb-muted">As {FN[myId].name}, what matters most? Pick three.</p>
      <FnHeader id={myId} />
      {all.map(t=>(
        <button key={t} className={'cb-chip'+(picked.includes(t)?' on':'')}
          disabled={!picked.includes(t)&&picked.length>=3} onClick={()=>toggle(t)}>
          <span className="cb-chk">{picked.includes(t)?'✓':''}</span>{t}</button>
      ))}
      <div className="cb-row" style={{marginTop:8}}>
        <input className="cb-input" style={{flex:1}} placeholder="Add your own…" value={custom}
          onChange={e=>setCustom(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCustom()} />
        <button className="cb-btn ghost small" disabled={!custom.trim()||picked.length>=3} onClick={addCustom}>Add</button>
      </div>
      <div className="cb-spacer"/>
      <Foot left={<button className="cb-btn ghost" onClick={onBack}>Back</button>}
        right={<span className="cb-row"><span className="cb-count">{picked.length}/3</span>
          <button className="cb-btn" disabled={picked.length!==3} onClick={()=>onNext(picked)}>Next</button></span>} />
    </div>
  );
}

function Needs({ myId, value, onBack, onNext }){
  const targets=otherFns(myId);
  const [picked,setPicked]=useState(value&&value.length?value:[]);
  const [customs,setCustoms]=useState({});
  const [idx,setIdx]=useState(0);
  const active=targets[idx];
  const last=idx===targets.length-1;
  const countFor=t=>picked.filter(p=>p.target===t).length;
  const has=(t,n)=>picked.some(p=>p.target===t&&p.need===n);
  function toggle(t,n){
    setPicked(p=>{
      if(p.some(x=>x.target===t&&x.need===n)) return p.filter(x=>!(x.target===t&&x.need===n));
      if(p.filter(x=>x.target===t).length>=NEED_CAP) return p;
      return [...p,{target:t,need:n}];
    });
  }
  function addCustom(t){
    const v=(customs[t]||'').trim();
    if(v && countFor(t)<NEED_CAP && !has(t,v)){ setPicked(p=>[...p,{target:t,need:v}]); setCustoms(c=>({...c,[t]:''})); }
  }
  function next(){ if(!last) setIdx(i=>i+1); else onNext(picked); }
  function back(){ if(idx>0) setIdx(i=>i-1); else onBack(); }
  const f=FN[active]; const full=countFor(active)>=NEED_CAP;
  const menu=NEEDS[active];
  const extras=picked.filter(p=>p.target===active&&!menu.includes(p.need)).map(p=>p.need);
  return (
    <div className="cb-wrap">
      <span className="cb-tag">Part 1 · Your needs · {idx+1} of {targets.length}</span>
      <h2>What you most need from the others</h2>
      <p className="cb-muted">Go through all four. For each, choose up to two things you most depend on them for — or none, if you genuinely don't. Use Next, or tap a function above.</p>
      <div className="cb-tabs big">
        {targets.map((t,i)=>{
          const c=countFor(t);
          return (
            <button key={t} className={'cb-tab'+(i===idx?' active':'')} onClick={()=>setIdx(i)}>
              {SHORT[t]}{c>0 && <span className={'cb-badge'+(c>=NEED_CAP?' full':'')}>{c}</span>}
            </button>
          );
        })}
      </div>
      <FnHeader id={active} />
      <div className="cb-count" style={{marginTop:3}}>Choose up to {NEED_CAP} · <b>{countFor(active)} of {NEED_CAP}</b> chosen</div>
      {[...menu,...extras].map(need=>(
        <button key={need} className={'cb-chip'+(has(active,need)?' on':'')}
          disabled={!has(active,need)&&full} onClick={()=>toggle(active,need)}>
          <span className="cb-chk">{has(active,need)?'✓':''}</span>{need}</button>
      ))}
      <div className="cb-row" style={{marginTop:6}}>
        <input className="cb-input" style={{flex:1}} placeholder="Add your own…" value={customs[active]||''}
          onChange={e=>setCustoms(c=>({...c,[active]:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&addCustom(active)} />
        <button className="cb-btn ghost small" disabled={!(customs[active]||'').trim()||full} onClick={()=>addCustom(active)}>Add</button>
      </div>
      <div className="cb-spacer"/>
      <Foot left={<button className="cb-btn ghost" onClick={back}>Back</button>}
        right={<button className="cb-btn" onClick={next}>{last?'Next: Collaboration':'Next'}</button>} />
    </div>
  );
}

            <span className="n">{i}</span><span className="w">{lv}</span>
          </button>
        ))}
      </div>
      <div className={'cb-hdesc'+(chosen===undefined?' empty':'')}>
        {chosen===undefined? 'Pick a level above to see what it means.'

      <div className="cb-spacer"/>
      <Foot left={<button className="cb-btn ghost" onClick={back}>Back</button>}

function Facilitator({ onBack }){
  const [pw,setPw]=useState(''); const [sys,setSys]=useState(''); const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(''); const [code,setCode]=useState(''); const [prog,setProg]=useState(null);
  const [resetting,setResetting]=useState(''); const [showReveal,setShowReveal]=useState(false);
  async function create(){
    setErr(''); setBusy(true);
    const r=await api('collab-session-create',{systemName:sys,adminPassword:pw});
    setBusy(false);
    if(!r || !r.ok){ setErr(r && r.error==='Not authorised' ? 'Wrong facilitator password.' : 'Could not create session.'); return; }
    setCode(r.code);
  }
  useEffect(()=>{
    if(!code) return;
    let live=true;
    async function poll(){ const r=await api('collab-progress',{code,adminPassword:pw}); if(live&&r&&r.ok) setProg(r); }
    poll(); const id=setInterval(poll,5000); return ()=>{ live=false; clearInterval(id); };
  },[code,pw]);

  async function resetFn(id){
    const s=(prog&&prog.submissions||[]).find(x=>x.function===id);
    const warn = s && s.submitted
      ? `${FN[id].name} has already SUBMITTED. Resetting will delete their answers and free the slot. Continue?`
      : `Reset ${FN[id].name}? This frees the slot so a group can claim it again.`;
    if(!window.confirm(warn)) return;
    setResetting(id);
    await api('collab-release',{code,fn:id,adminPassword:pw});
    const r=await api('collab-progress',{code,adminPassword:pw}); if(r&&r.ok) setProg(r);
    setResetting('');
  }

  if(code){
    const subs=(prog&&prog.submissions)||[];
    const byFn={}; subs.forEach(s=>byFn[s.function]=s);
    const submittedCount=subs.filter(s=>s.submitted).length;
    if(showReveal) return <Reveal sys={sys} subs={subs} submittedTotal={submittedCount} onClose={()=>setShowReveal(false)} />;
    return (
      <div className="cb-wrap">
        <div className="cb-spacer" style={{height:36}}/>
        <span className="cb-tag">{sys}</span>
        <h1>Session code</h1>
        <div className="cb-card cb-center"><div style={{fontSize:42,letterSpacing:6,fontWeight:600}}>{code.slice(0,4)+'-'+code.slice(4)}</div>
          <div className="cb-muted cb-small">Share with each group. They enter it, then pick their function.</div></div>
        <h2 style={{marginTop:16}}>Progress</h2>
        <div className="cb-card">
          <div className="cb-row" style={{justifyContent:'space-between'}}><b>{submittedCount} of 5 groups submitted</b>
            <span className="cb-count">{subs.length} joined</span></div>
          {ORDER.map(id=>{
            const s=byFn[id];
            const state= !s? 'not joined' : (s.submitted? 'submitted' : 'in progress');
            return (<div key={id} className="cb-row" style={{justifyContent:'space-between',padding:'8px 0',borderTop:'1px solid var(--cb-line)'}}>
              <span><span className="cb-fnname">{FN[id].name}</span><span className="cb-sn">{id}</span>
                <span className="cb-tiny cb-muted"> · {state}</span></span>
              <button className="cb-link" disabled={!s||resetting===id} onClick={()=>resetFn(id)}>
                {resetting===id?'…':'Reset'}</button></div>);
          })}
          <div className="cb-tiny cb-muted" style={{marginTop:8}}>Reset frees a stuck or wrongly-claimed function so a group can pick it again.</div>
        </div>
        <div style={{marginTop:16}}>
          <button className="cb-btn" disabled={submittedCount<1} onClick={()=>setShowReveal(true)}>Share the results</button>
          <div className="cb-tiny cb-muted" style={{marginTop:6}}>Walks the room back through priorities, needs, collaboration and trust. Best with all five in.</div>
        </div>
        <button className="cb-btn ghost" onClick={onBack}>Back</button>
        <div className="cb-spacer" style={{height:30}}/>
      </div>
    );
  }
  return (
    <div className="cb-wrap">
      <div className="cb-spacer" style={{height:40}}/>
      <span className="cb-tag">Facilitator</span>
      <h1>Create a session</h1>
      <input className="cb-input" placeholder="Facilitator password" type="password" value={pw} onChange={e=>setPw(e.target.value)} />
      <div style={{height:10}}/>
      <input className="cb-input" placeholder="System name (e.g. Network Rail)" value={sys} onChange={e=>setSys(e.target.value)} />
      {err && <div className="cb-err">{err}</div>}
      <div className="cb-row" style={{marginTop:14}}>
        <button className="cb-btn" disabled={!pw||!sys.trim()||busy} onClick={create}>{busy?'…':'Create session'}</button>
        <button className="cb-btn ghost" onClick={onBack}>Back</button>
      </div>
    </div>
  );
}


/* ---------------- Reveal (ordered walkthrough) ---------------- */
function heatRGB(r){
  const L=(a,b,t)=>Math.round(a+(b-a)*t); let c;
  if(r<0.5){ const t=r/0.5; c=[L(201,231,t),L(143,226,t),L(136,218,t)]; }
  else { const t=(r-0.5)/0.5; c=[L(231,143,t),L(226,174,t),L(218,147,t)]; }
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
function RLeg(){ return <div className="cbr-leg2"><span>weak</span><span className="cbr-scale"/><span>strong</span></div>; }
function RMatrix({ present, get, norm, fmt }){
  return (
    <table className="cbr-mx2">
      <thead><tr><th className="cbr-corner">rates &rarr;<br/>&darr; of</th>
        {present.map(b=><th key={b}>{SHORT[b]}</th>)}</tr></thead>
      <tbody>
        {present.map(a=>(
          <tr key={a}><td className="cbr-rh">{SHORT[a]}</td>
            {present.map(b=>{
              if(a===b) return <td key={b} className="cbr-diag"></td>;
              const v=get(a,b);
              if(v==null) return <td key={b} className="cbr-cell" style={{background:'transparent',color:'var(--cb-muted)'}}>&ndash;</td>;
              return <td key={b} className="cbr-cell" style={{background:heatRGB(norm(v))}}>{fmt(v)}</td>;
            })}
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function Reveal({ sys, subs, submittedTotal, onClose }){
  const done=(subs||[]).filter(s=>s.submitted);
  const present=ORDER.filter(id=>done.some(s=>s.function===id));
  const row=id=>done.find(s=>s.function===id);
  const cAB=(a,b)=>{ const s=row(a); const v=s&&s.collaboration?s.collaboration[b]:undefined; return typeof v==='number'?v:null; };
  const compAB=(a,b,cid)=>{ const s=row(a); const o=s&&s.trust?s.trust[b]:null; return o&&typeof o[cid]==='number'?o[cid]:null; };
  const needsTo=t=>{ const out=[]; present.forEach(a=>{ if(a===t) return; const s=row(a); (s&&Array.isArray(s.needs)?s.needs:[]).filter(n=>n.target===t).forEach(n=>out.push({from:a,need:n.need})); }); return out; };

  if(present.length<2){
    return (<div className="cbr">
      <div className="cbr-top"><div className="l"><b>{sys||'Reveal'}</b><span>{submittedTotal||0} of 5 submitted</span></div>
        <button className="cb-btn ghost small" onClick={onClose}>Close</button></div>
      <div className="cbr-panel2">Waiting for groups &mdash; this needs at least two functions in before there&rsquo;s anything to show.</div>
    </div>);
  }

  return (
    <div className="cbr">
      <div className="cbr-top">
        <div className="l"><b>{sys||'System'}</b><span>{submittedTotal||0} of 5 submitted</span></div>
        <button className="cb-btn ghost small" onClick={onClose}>Close</button>
      </div>
      <h1 style={{marginBottom:2}}>Sharing the results</h1>
      <p className="cb-muted" style={{margin:'0 0 6px'}}>Walking back through it in the order you did it.</p>

      <div className="cbr-step"><div><span className="cbr-stepn">1</span><h2 className="cbr-h2">Priorities</h2></div>
        <div className="cbr-cap2">What each function said matters most to them.</div>
        <div className="cbr-cards">
          {present.map(id=>(
            <div key={id} className="cbr-card"><h3>{SHORT[id]}<span className="cb-sn">{id}</span></h3>
              {((row(id).priorities)||[]).map((p,i)=><div key={i} className="cbr-li"><span className="b">&bull;</span><span>{p}</span></div>)}
              {(!row(id).priorities||row(id).priorities.length===0) && <div className="cbr-empty">None declared</div>}
            </div>
          ))}
        </div>
      </div>

      <div className="cbr-step"><div><span className="cbr-stepn">2</span><h2 className="cbr-h2">Needs</h2></div>
        <div className="cbr-cap2">What the rest of the system most needs from each function.</div>
        <div className="cbr-cards">
          {present.map(t=>{ const items=needsTo(t); return (
            <div key={t} className="cbr-card"><h3>From {SHORT[t]}<span className="cb-sn">{t}</span></h3>
              {items.length? items.map((it,i)=><div key={i} className="cbr-nd"><span className="req">{SHORT[it.from]}</span>{it.need}</div>)
                : <div className="cbr-empty">No needs pointed here.</div>}
            </div>); })}
        </div>
      </div>

      <div className="cbr-step"><div><span className="cbr-stepn">3</span><h2 className="cbr-h2">Collaboration</h2></div>
        <div className="cbr-cap2">How each function rates the others&rsquo; collaboration with them. 0 Disconnected &rarr; 5 System-owned. Compare a cell with its mirror to see disagreement.</div>
        <RMatrix present={present} get={cAB} norm={v=>v/5} fmt={v=>v} /><RLeg/>
      </div>

      <div className="cbr-step"><div><span className="cbr-stepn">4</span><h2 className="cbr-h2">Trust</h2></div>
        <div className="cbr-cap2">Four components, each 1&ndash;5, higher is better. One at a time &mdash; then how they combine.</div>
        {TRUST.map(c=>(
          <div key={c.id} className="cbr-comp">
            <div className="cbr-comph">{c.label}</div>
            <div className="cbr-compg">{c.q}</div>
            <RMatrix present={present} get={(a,b)=>compAB(a,b,c.id)} norm={v=>(v-1)/4} fmt={v=>v} /><RLeg/>
          </div>
        ))}
        <div className="cbr-eqbox">
          <div className="cbr-eqlabel">The Maister trust equation</div>
          <div className="cbr-eq">
            <span className="lhs">Trust&nbsp;=</span>
            <span className="frac"><span className="num">Credibility + Reliability + Intimacy</span><span className="den">Self-orientation</span></span>
          </div>
          <div className="cbr-eqnote">The first three build trust. <b>Self-orientation</b> divides it &mdash; the more someone acts for themselves, the less you trust them, however credible or reliable they are. You rated its flip side, <b>Stewardship</b>: acting for the whole system. High stewardship, low self-orientation.</div>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Root ---------------- */
function App(){
  const [mode,setMode]=useState('participant');
  const [screen,setScreen]=useState('join');
  const [code,setCode]=useState('');
  const [systemName,setSystemName]=useState('');
  const [claimed,setClaimed]=useState([]);
  const [myId,setMyId]=useState('');
  const [priorities,setPriorities]=useState([]);
  const [needs,setNeeds]=useState([]);
  const [collab,setCollab]=useState({});
  const [trust,setTrust]=useState({});
  const [editing,setEditing]=useState(false);
  const [showGloss,setShowGloss]=useState(false);
  const [resume,setResume]=useState(null);
  const [booted,setBooted]=useState(false);

  useEffect(()=>{
    let saved=null; try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
    if(saved && saved.code && saved.fn){ setResume(saved); }
    setBooted(true);
  },[]);

  function persist(step){ try{ localStorage.setItem(LS_KEY, JSON.stringify({ code, fn:myId, step })); }catch(e){} }
  async function save(patch){ await saveWithRetry({ code, fn:myId, patch }); }

  async function doResume(){
    const r=await api('collab-session-validate',{code:resume.code});
    if(!r||!r.ok){ localStorage.removeItem(LS_KEY); setResume(null); return; }
    const sub=await api('collab-load',{code:resume.code,fn:resume.fn});
    if(!sub||!sub.ok){ localStorage.removeItem(LS_KEY); setResume(null); return; }
    const s=sub.submission;
    setCode(resume.code); setSystemName(r.systemName); setMyId(resume.fn);
    setPriorities(s.priorities||[]); setNeeds(s.needs||[]); setCollab(s.collaboration||{}); setTrust(s.trust||{});
    setResume(null);
    setScreen(s.submitted? 'submitted' : (resume.step||'p1priorities'));
  }
  function freshStart(){ localStorage.removeItem(LS_KEY); setResume(null); }

  function onValidated(r){ setCode(r.code); setSystemName(r.systemName); setClaimed(r.claimed||[]); setScreen('intro'); }
  function onClaimed(fn){ setMyId(fn); try{ localStorage.setItem(LS_KEY, JSON.stringify({code,fn,step:'p1priorities'})); }catch(e){} setScreen('p1priorities'); }

  // route to review when editing, else to the given next screen
  function go(next){ if(editing){ setEditing(false); persist('review'); setScreen('review'); } else { persist(next); setScreen(next); } }
  function startEdit(target){ setEditing(true); setScreen(target); }

  if(!booted) return null;

  if(resume){
    return (
      <div className="cb-wrap"><div className="cb-spacer" style={{height:60}}/>
        <h1>Welcome back</h1>
        <p className="cb-muted">You have a session in progress for code {resume.code} ({FN[resume.fn]?FN[resume.fn].name:resume.fn}).</p>
        <div className="cb-row" style={{marginTop:12}}>
          <button className="cb-btn" onClick={doResume}>Continue</button>
          <button className="cb-btn ghost" onClick={freshStart}>Start fresh</button>
        </div>
      </div>
    );
  }

  if(mode==='facilitator') return <Facilitator onBack={()=>{ setMode('participant'); setScreen('join'); }} />;

  const showBar = ['p1priorities','p1needs','p2collab','p3trust','review'].includes(screen);
  const pcts={ p1priorities:15, p1needs:35, p2collab:60, p3trust:82, review:96 };

  return (
    <div>
      {showBar && <div className="cb-wrap" style={{paddingBottom:0}}><TopBar myId={myId} onHelp={()=>setShowGloss(true)} /><Progress pct={pcts[screen]||0} /></div>}
      {showGloss && <Glossary onClose={()=>setShowGloss(false)} />}

      {screen==='join' && <Join onValidated={onValidated} onFacilitator={()=>setMode('facilitator')} />}
      {screen==='intro' && <Intro systemName={systemName} onBegin={()=>setScreen('pickfn')} onBack={()=>setScreen('join')} />}
      {screen==='pickfn' && <PickFunction code={code} systemName={systemName} claimed={claimed} current={myId} onClaimed={onClaimed} onBack={()=>setScreen('intro')} />}

      {screen==='p1priorities' && <Priorities myId={myId} value={priorities}
        onBack={()=> editing? go() : setScreen('pickfn')}
        onNext={async v=>{ setPriorities(v); await save({priorities:v}); go('p1needs'); }} />}

      {screen==='p1needs' && <Needs myId={myId} value={needs}
        onBack={()=> editing? go() : setScreen('p1priorities')}
        onNext={async v=>{ setNeeds(v); await save({needs:v}); go('p2collab'); }} />}

      {screen==='p2collab' && <Collaboration myId={myId} value={collab}
        onBack={()=> editing? go() : setScreen('p1needs')}
        onNext={async v=>{ setCollab(v); await save({collaboration:v}); go('p3trust'); }} />}

      {screen==='p3trust' && <Trust myId={myId} value={trust}
        onBack={()=> editing? go() : setScreen('p2collab')}
        onDone={async v=>{ setTrust(v); await save({trust:v}); setEditing(false); persist('review'); setScreen('review'); }} />}

      {screen==='review' && <Review myId={myId} priorities={priorities} needs={needs} collab={collab} trust={trust}
        onEdit={startEdit} onBack={()=>setScreen('p3trust')}
        onSubmit={async ()=>{ await save({submitted:true}); persist('submitted'); setScreen('submitted'); }} />}

      {screen==='submitted' && <Submitted systemName={systemName} onEdit={()=>setScreen('review')} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
