<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>STAT — Strategic Tensions Assessment Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'DM Sans',sans-serif;background:#f0ede8;color:#1a1a1a;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.fade{animation:fadeIn .3s ease both}
.shell{min-height:auto;display:flex;flex-direction:column}
.prog-wrap{max-width:100%;margin:0 auto;padding:1rem 2rem .2rem}
.prog-bars{display:flex;gap:3px;margin-bottom:.3rem}
.prog-bar{flex:1;height:3px;border-radius:2px;background:#d8d3cb;transition:background .3s}
.prog-bar.done{background:#e07030}.prog-bar.now{background:#1a1a1a}
.prog-lbls{display:flex;gap:3px}
.prog-lbl{flex:1;font-size:.52rem;font-weight:700;text-transform:uppercase;color:#b0a898;text-align:center;font-family:'DM Sans',sans-serif}
.prog-lbl.done{color:#e07030}.prog-lbl.now{color:#1a1a1a}
@media(max-width:480px){.prog-lbl{font-size:.42rem}}
.main{flex:1}
.content{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 3rem}
.land-hero{border-bottom:1px solid #d8d3cb;padding-bottom:2rem;margin-bottom:2rem}
.land-tag{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.75rem}
.land-title{font-size:2.1rem;font-weight:600;color:#1a1a1a;line-height:1.15;margin-bottom:.65rem;font-family:'Cormorant Garamond',serif}
.land-desc{font-size:.95rem;color:#555;line-height:1.7;max-width:560px}
.land-time{display:inline-flex;align-items:center;gap:.4rem;background:#e8e3dc;border-radius:20px;padding:.35rem .85rem;font-size:.75rem;font-weight:600;color:#888;margin-top:.85rem}
.land-time::before{content:"⏱";font-size:.8rem}
.field-lbl{font-size:.72rem;font-weight:700;color:#555;display:block;margin-bottom:.35rem;letter-spacing:.03em}
.field-sub{font-size:.72rem;color:#999;margin-bottom:.35rem;line-height:1.5}
.inp{width:100%;border:1px solid #d8d3cb;border-radius:3px;padding:.72rem 1rem;font-family:'DM Sans',sans-serif;font-size:.9rem;color:#1a1a1a;outline:none;min-height:44px;transition:border-color .15s;background:#fff;display:block}
.inp:focus{border-color:#e07030}.inp::placeholder{color:#c0b8ae}
.inp-ta{min-height:90px;resize:vertical;line-height:1.55}
.disc{font-size:.72rem;color:#888;line-height:1.6;padding:.75rem;background:#ebe7e0;border-radius:3px;border:1px solid #d8d3cb;margin-top:.5rem}
.btn-p{display:inline-flex;align-items:center;gap:.4rem;background:#e07030;color:#fff;border:none;border-radius:3px;font-weight:700;padding:.78rem 1.6rem;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;min-height:44px;transition:opacity .15s}
.btn-p:hover:not([disabled]){opacity:.88}.btn-p[disabled]{opacity:.3;cursor:not-allowed}
.btn-s{display:inline-flex;align-items:center;gap:.4rem;background:#f0ede8;color:#1a1a1a;border:1px solid #d8d3cb;border-radius:3px;font-weight:500;padding:.78rem 1.2rem;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;min-height:44px;transition:border-color .15s}
.btn-s:hover{border-color:#1a1a1a}
.btn-row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1.75rem}
.sec-tag{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.5rem}
.pg-title{font-size:1.55rem;font-weight:600;color:#1a1a1a;line-height:1.3;margin-bottom:.35rem;font-family:'Cormorant Garamond',serif}
.pg-sub{font-size:.875rem;color:#666;margin-bottom:1.4rem;line-height:1.65}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;color:#888;cursor:pointer;padding:0;margin-bottom:1.5rem}
.back-btn:hover{color:#1a1a1a}
.inf-box{background:#ebe7e0;border-left:3px solid #e07030;padding:.85rem 1.1rem;border-radius:0 3px 3px 0;margin-bottom:1.2rem;font-size:.875rem;line-height:1.6;color:#555}
.warn-box{background:#fff8f6;border:1px solid #f0b8a8;border-radius:3px;padding:.85rem 1.1rem;margin:.7rem 0;font-size:.82rem;color:#c0392b}
.q-cat-hdr{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#b0a898;padding:.5rem 0;margin-top:1.25rem;margin-bottom:.35rem;border-top:1px solid #d8d3cb}
.q-card{border:1px solid #d8d3cb;border-radius:4px;padding:1rem;margin-bottom:.5rem;background:#fff;transition:border-color .2s}
.q-card.active{border-color:#1a1a1a}.q-card.done{border-color:#d8d3cb;opacity:.85}.q-card.locked{opacity:.45;pointer-events:none}
.q-card-title{font-size:.8rem;font-weight:700;color:#1a1a1a;margin-bottom:.75rem;line-height:1.45}
.q-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:.65rem;align-items:center}
.q-opt{border-radius:3px;padding:.6rem .75rem;font-size:.77rem;line-height:1.45;transition:all .15s}
.q-opt-side{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.2rem}
.q-inputs{display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:110px}
.q-input-row{display:flex;align-items:center;gap:.35rem}
.q-stepper{display:flex;align-items:center;gap:4px}
.q-step-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid #d8d3cb;background:#f0ede8;font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;line-height:1;padding:0;flex-shrink:0;user-select:none}
.q-step-btn:hover:not([disabled]){background:#e8e3dc;border-color:#b0a898}.q-step-btn[disabled]{opacity:.3;cursor:not-allowed}
.q-val{width:32px;text-align:center;font-size:1rem;font-weight:700;color:#1a1a1a}
.q-sep{color:#d8d3cb;font-weight:700;font-size:1.1rem}
.q-hint{font-size:.63rem;color:#b0a898;text-align:center}
.q-hint.over{color:#e07030;font-weight:700}.q-hint.ok{color:#27ae60;font-weight:600}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin:1.2rem 0}
.score-card{border:1px solid #d8d3cb;border-radius:3px;padding:.9rem;background:#fff}
.score-dim{font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#b0a898;margin-bottom:.2rem}
.score-val{font-size:1.55rem;font-weight:700;color:#e07030;line-height:1}
.score-lbl{font-size:.75rem;color:#666;margin-top:.15rem}
.score-bar{height:3px;background:#d8d3cb;border-radius:2px;margin-top:.55rem;overflow:hidden}
.score-fill{height:100%;background:#e07030;border-radius:2px}
.slider-wrap{margin-bottom:1.25rem}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem}
.slider-lbl{font-size:.84rem;font-weight:600;color:#1a1a1a;flex:1;padding-right:1rem;line-height:1.3}
.slider-val{font-size:1.1rem;font-weight:700;color:#e07030;flex-shrink:0}
.slider-val span{font-size:.68rem;color:#b0a898;font-weight:400}
.slider-track{position:relative;height:28px;display:flex;align-items:center}
.slider-bg{height:6px;background:#d8d3cb;border-radius:3px;width:100%;overflow:hidden;position:relative}
.slider-fill{height:100%;background:#e07030;border-radius:3px;transition:width .1s}
.slider-input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1;-webkit-appearance:none;appearance:none}
.slider-input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px}
.slider-input::-moz-range-thumb{width:22px;height:22px}
.slider-thumb{position:absolute;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #e07030;box-shadow:0 1px 4px rgba(0,0,0,.15);pointer-events:none;transition:left .1s}
.slider-section{border:1px solid #d8d3cb;border-radius:4px;padding:1.25rem;background:#ebe7e0;margin-bottom:1rem}
.rpt-tabs{display:flex;gap:0;border-bottom:2px solid #d8d3cb;margin-bottom:1.75rem}
.rpt-tab{padding:.6rem 1rem;font-size:.78rem;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:#b0a898;transition:all .2s;white-space:nowrap}
.rpt-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}.rpt-tab:hover:not(.active){color:#555}
.rpt-section{margin-bottom:1.5rem}
.da-summary{background:#fff;border:1px solid #d8d3cb;border-left:4px solid #1a1a1a;border-radius:4px;padding:1.25rem 1.5rem;margin-bottom:1.75rem}
.da-summary-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1a1a1a;margin-bottom:.5rem}
.da-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:1.75rem}
.da-card{background:#fff;border:1px solid #d8d3cb;border-top:3px solid #e07030;border-radius:4px;padding:1.1rem 1.25rem}
.da-card-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.5rem}
.da-lower{display:flex;flex-direction:column;gap:.85rem;margin-bottom:1.5rem}
.da-lower-card{background:#fff;border:1px solid #d8d3cb;border-radius:4px;padding:1.1rem 1.25rem}
.da-lower-card.best{border-left:4px solid #16a34a}.da-lower-card.blind{border-left:4px solid #dc2626}.da-lower-card.areas{border-left:4px solid #2563eb}
.da-lower-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem}
.da-lower-card.best .da-lower-heading{color:#16a34a}.da-lower-card.blind .da-lower-heading{color:#dc2626}.da-lower-card.areas .da-lower-heading{color:#2563eb}
@media(max-width:600px){.da-grid{grid-template-columns:1fr}}
.rpt-heading{font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e07030;margin-bottom:.5rem}
.rpt-body{font-size:.875rem;line-height:1.75;color:#1a1a1a;margin-bottom:.65rem}
.chart-pair{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin:1.25rem 0}
.chart-box{border:1px solid #d8d3cb;border-radius:4px;padding:1.25rem;background:#fff;text-align:center}
.chart-lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:.75rem}
.sug-item{display:flex;gap:.65rem;align-items:flex-start;padding:.65rem 0;border-bottom:1px solid #ebe7e0}
.sug-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#e07030;color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sug-txt{font-size:.85rem;line-height:1.6;color:#1a1a1a}
.strat-badge{display:inline-flex;align-items:flex-start;gap:.5rem;background:#ebe7e0;border:1px solid #d8d3cb;border-radius:3px;padding:.5rem .9rem;margin:.7rem 0}
.strat-dot{width:10px;height:10px;border-radius:50%;background:#e07030;flex-shrink:0;margin-top:3px}
.strat-name{font-size:.84rem;font-weight:700;color:#1a1a1a}
.think{display:flex;align-items:center;gap:.75rem;padding:1.5rem 0}
.dots{display:flex;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#e07030;animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
.think-txt{font-size:.875rem;color:#888;font-style:italic}
.gap-summary{border:1px solid #d8d3cb;border-radius:4px;overflow:hidden;margin:1.25rem 0;background:#fff}
.gap-row{display:grid;grid-template-columns:1fr 60px 60px 80px;gap:.5rem;align-items:center;padding:.6rem .9rem;border-bottom:1px solid #ebe7e0;font-size:.82rem}
.gap-row:last-child{border-bottom:none}
.gap-row.hdr{background:#ebe7e0;font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#888}
.gap-val{text-align:center;font-weight:700}
.gap-badge{font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .45rem;border-radius:2px;text-align:center}
.gap-large{background:#fff3cd;color:#856404}.gap-medium{background:#d4edda;color:#155724}.gap-small{background:#e2e3e5;color:#383d41}
.diamond-fullscreen-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer}
.diamond-fullscreen-inner{background:#fff;border-radius:12px;padding:2rem;max-width:520px;width:90%;position:relative}
.diamond-fullscreen-close{position:absolute;top:.75rem;right:.75rem;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#666;line-height:1}
.diamond-expand-hint{font-size:.65rem;color:#b0a898;text-align:center;margin-top:.3rem;cursor:pointer}
.resume-box{background:#fff8f5;border:1px solid #f5c8b0;border-radius:6px;padding:1.25rem;margin-bottom:1.25rem}
.resume-box h3{font-size:.9rem;font-weight:700;color:#1a1a1a;margin-bottom:.5rem}
.resume-box p{font-size:.82rem;color:#555;line-height:1.55;margin-bottom:.75rem}

/* ── GROUP STYLES ────────────────────────────────────────────── */
.chip-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.p-chip{width:28px;height:28px;border-radius:50%;border:2px solid #d8d3cb;background:#f0ede8;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:#555;flex-shrink:0;position:relative}
.p-chip.done{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.p-chip.you{border-color:#e07030}
.p-chip .you-dot{position:absolute;bottom:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#e07030;border:1.5px solid #f0ede8}
.refresh-btn{display:inline-flex;align-items:center;gap:.35rem;background:#f0ede8;border:1px solid #d8d3cb;border-radius:3px;padding:.4rem .8rem;font-size:.75rem;font-weight:600;cursor:pointer;color:#555;font-family:'DM Sans',sans-serif;transition:border-color .15s}
.refresh-btn:hover{border-color:#1a1a1a;color:#1a1a1a}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.code-fix-box{display:flex;gap:.5rem;align-items:center;margin-top:.5rem;background:#fff8f5;border:1px solid #f5c8b0;border-radius:4px;padding:.5rem .75rem;flex-wrap:wrap}
.code-fix-box input{border:1px solid #d8d3cb;border-radius:3px;padding:.35rem .6rem;font-size:.82rem;font-family:'DM Sans',sans-serif;outline:none;width:140px;text-transform:uppercase}
.code-fix-box input:focus{border-color:#e07030}
.apply-btn{background:#e07030;color:#fff;border:none;border-radius:3px;padding:.35rem .75rem;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.anon-toggle{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.78rem;color:#555;font-family:'DM Sans',sans-serif;user-select:none}
.anon-toggle input{accent-color:#e07030;width:14px;height:14px;cursor:pointer}
.group-mean-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:.5rem;margin:1rem 0}
.gm-cell{background:#fff;border:1px solid #d8d3cb;border-radius:4px;padding:.75rem .6rem;text-align:center}
.gm-lbl{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:.25rem}
.gm-you{font-size:1.1rem;font-weight:700;color:#e07030;line-height:1}
.gm-mean{font-size:.72rem;color:#666;margin-top:.15rem}
.gm-diff{font-size:.65rem;font-weight:600;margin-top:.1rem}
.gm-diff.up{color:#16a34a}.gm-diff.down{color:#dc2626}.gm-diff.flat{color:#888}
.fac-tab-bar{display:flex;gap:0;border-bottom:2px solid #d8d3cb;margin-bottom:1.5rem;overflow-x:auto}
.fac-tab{padding:.5rem .85rem;font-size:.72rem;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:#b0a898;transition:all .2s;white-space:nowrap;font-family:'DM Sans',sans-serif}
.fac-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.fac-tab:hover:not(.active){color:#555}

/* Facilitator dashboard tiles */
.fac-dash{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.5rem}
@media(max-width:900px){.fac-dash{grid-template-columns:repeat(2,1fr)}}
.dash-tile{background:#fff;border:1px solid #e2ddd3;border-radius:4px;overflow:hidden;min-height:180px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,box-shadow .15s;font-family:'DM Sans',sans-serif}
.dash-tile:hover{border-color:#c8c2b4;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.dash-tile-inner{padding:1rem 1.1rem;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;flex:1}
.dash-tile-l{flex:1;min-width:0}
.dash-tile-name{font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#888;margin-bottom:.55rem;display:flex;align-items:center;gap:.4rem}
.dash-tile-headline{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:500;color:#1a1a1a;line-height:1.25;margin-bottom:.35rem}
.dash-tile-sub{font-size:.72rem;color:#555;line-height:1.5}
.dash-tile-chev{flex-shrink:0;color:#aaa;font-size:.95rem;line-height:1}
.dash-pips{display:flex;gap:4px;margin-top:.5rem;flex-wrap:wrap;align-items:center}
.dash-pip{width:11px;height:11px;background:#dcd6c8;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:8px;line-height:1}
.dash-pip.done{background:#16a34a;color:#fff}
.dash-pip.done::after{content:'✓';font-weight:700}
.dash-pip.partial{background:#f59e0b}
.dash-pip.partial::after{content:'·';color:#fff;font-weight:900;font-size:14px;line-height:0;margin-top:-2px}
.dash-chip{display:inline-flex;align-items:center;gap:.25rem;padding:.1rem .45rem;font-size:.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:10px;background:#f5f1e9;color:#444;border:1px solid #e2ddd3}
.dash-chip.alert{background:#fef3e2;color:#b45309;border-color:#f59e0b}
.dash-chip.live{background:#e8f5ec;color:#166534;border-color:#86efac}
.dash-chip.live::before{content:'';width:5px;height:5px;background:#16a34a;border-radius:50%;display:inline-block;animation:dash-pulse 1.5s infinite}
.dash-chip.closed{background:#fef2f2;color:#c0392b;border-color:#fca5a5}
.dash-chip.review{background:#fff8f5;color:#b45309;border-color:#f5c8b0}
.dash-chip.review::before{content:'';width:5px;height:5px;background:#e07030;border-radius:50%;display:inline-block;animation:dash-pulse 1.5s infinite}
@keyframes dash-pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Fullscreen overlay for an opened tile */
body.dash-open{overflow:hidden}
.dash-overlay{position:fixed;inset:0;background:#f0ede8;z-index:1000;display:flex;flex-direction:column;overflow:hidden;animation:dash-fade .15s ease-out}
@keyframes dash-fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.dash-ovr-head{flex-shrink:0;padding:1.25rem 1.75rem 1rem;border-bottom:1px solid #d8d3cb;background:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem;position:sticky;top:0;z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.dash-ovr-head-l{flex:1;min-width:0}
.dash-ovr-name{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#e07030;margin-bottom:.4rem;font-family:'DM Sans',sans-serif}
.dash-ovr-headline{font-family:'Cormorant Garamond',serif;font-size:1.85rem;font-weight:500;color:#1a1a1a;line-height:1.1;margin-bottom:.3rem}
.dash-ovr-sub{font-size:.82rem;color:#555;font-family:'DM Sans',sans-serif}

const {useState,useRef,useEffect,useMemo}=React;

// ── QUESTION DATA ──────────────────────────────────────────────────────────
const S1={categories:[
  {name:'Purpose',qs:[
    {id:'s1p1',q:'What do we pay attention to when developing our strategy?',l:'Maintaining the status quo, making the most of existing capabilities and/or resources.',r:'Transforming and changing the organisation, creating new capabilities and/or resources.'},

const S2={categories:[

    {id:'s2pd1',q:'How do we set about gaining competitive advantage?',l:'Exploiting existing markets, capabilities and technologies — optimising existing business models.',r:'Exploring new markets, capabilities, technologies and business models — being a first mover.'},
    {id:'s2pd2',q:'How do we think we should develop our products or services in the future?',l:'Narrowing product/service lines, high-volume, transaction-oriented and standardised.',r:'Focusing on low-volume, highly responsive to customer needs, creating bespoke/customised solutions.'},
    {id:'s2pd3',q:'How would we like our outputs to be measured?',l:'Being efficient, timely and consistent.',r:'Being innovative, responsive and customised.'},
  ]},
]};

function getStrategy(d,p,c,f){
  const max=Math.max(d,p,c,f),min=Math.min(d,p,c,f);
  if(max-min<15)return 'neutral';
  const mind=p>d?'prog':'def';
  const app=f>c?'flex':'con';
  if(mind==='prog'&&app==='con')return 'performance_optimisation';
  if(mind==='prog'&&app==='flex')return 'adaptive_innovation';
  if(mind==='def'&&app==='con')return 'preventative_control';
  return 'mindful_action';
}
const SLABELS={preventative_control:'Preventative Control',mindful_action:'Mindful Action',performance_optimisation:'Performance Optimisation',adaptive_innovation:'Adaptive Innovation',neutral:'Neutral'};
const SDESC={
  preventative_control:'Monitoring and complying — a defensive strategy based on consistency.',
  mindful_action:'Noticing and responding — a defensive strategy based on flexibility.',
  performance_optimisation:'Improving and exploiting — a progressive strategy based on consistency.',
  adaptive_innovation:'Imagining and creating — a progressive strategy based on flexibility.',
  neutral:'A balanced combination of all four core strategies.',
};

function gapLabel(g){if(Math.abs(g)<8)return 'small';if(Math.abs(g)<20)return 'medium';return 'large';}
function gapBadgeText(g){if(Math.abs(g)<8)return 'Minor tweak';if(Math.abs(g)<20)return 'Moderate shift';return 'Significant change';}

function getStrategyText(strat,th){
  const capTh=th?th.charAt(0).toUpperCase()+th.slice(1):'The organisation';
  const texts={
    preventative_control:{
      summary:`${capTh}'s profile shows a dominant Preventative Control strategy — a defensive, consistency-focused approach. Organisational resilience is achieved through robust risk management, physical barriers, systems back-ups, safeguards and standards. ${capTh} is strongly oriented toward protecting what exists and preventing disruption rather than proactively pursuing change.`,
      purpose:`Your scores suggest the focus in ${th} is on maintaining the status quo and preserving existing capabilities. You perceive that ensuring basic requirements are met and consistent, repeatable day-to-day operations are the priority. Strategic energy is directed toward defence of current position rather than growth or transformation.`,
      people:`Your scores suggest you believe the future is relatively predictable and the environment reasonably stable. Resilience is seen as a static feature of the organisation based on its size, capability or robustness. People are analytical, construct plans and execute them rigorously. Roles and accountabilities are clearly defined, and training is focused on compliance and correct procedure.`,
      process:`${capTh} is defined by systems — engineered, people-dependent and procedure-based — alongside administrative and cost controls. Work is highly standardised with many routines. Decision-making is centralised and tasks are grouped by functional departments. There is a strong emphasis on ongoing monitoring and measurement of the system.`,
      product:`The core aim is to maintain capacity, defend market share and/or profitability, or maintain current service levels. Clients and stakeholders value familiarity, dependability, reliability and sustainability — and ${th}'s outputs are shaped accordingly.`,
      atBest:`At its best, ${th} solves known problems using proven techniques, perfects standard ways of doing things through fine-tuning, and quickly counteracts disruptions through planned responses. Predictability and reliability are genuine organisational strengths.`,
      blind:`Preventative Control can create the illusion that 'failure can't happen here' in ${th}, yet over time there is a gradual erosion and weakening of defensive barriers. Without Mindful Action, people 'go by the book' and defer to the system — stopping noticing and responding to unusual problems. Without Performance Optimisation, ${th} can become impractical and unproductive; improvement stops and the organisation becomes static, stale and uncompetitive. Without Adaptive Innovation, competitors become more forward-thinking, agile and cutting edge.`,
      areas:`To increase Mindful Action in ${th}, ensure competent people closest to the problem are empowered and have the freedom and discretion to act. To increase Performance Optimisation, rethink and redesign how work is done to better support productivity, cycle times and quality. To increase Adaptive Innovation, explore new capabilities, technologies and business models — create safe spaces for multi-disciplinary groups to create novel solutions.`,
    },
    mindful_action:{
      summary:`${capTh}'s profile shows a dominant Mindful Action strategy — a defensive, flexibility-focused approach. Organisational resilience is typically created by people who use their experience, expertise and teamwork to anticipate and adapt to threats and respond effectively to unfamiliar situations through creative problem solving and improvisation.`,
      purpose:`Your scores suggest you perceive the focus in ${th} as sensing environmental change and responding rapidly and creatively. The emphasis is on 'bouncing back' rather than fundamental reinvention — building the dynamic capabilities that adapt quickly whilst retaining what the organisation does well.`,
      people:`Your scores suggest you believe the future is unpredictable and volatile. Resilience must be accomplished every day, not just built in once. You value expertise and diversity of opinion, and experience a "healthy uneasiness" about what might go wrong — and expect the authority to act on what you notice.`,
      process:`${capTh} is relatively unstructured, informal and decentralised. It has an adaptive, flexible or 'organic' nature that enables groups to be responsive as new issues arise. The organisation is information-rich and makes deliberate attempts to create a very complete picture of the work environment.`,
      product:`The core aim is to defend market share or position and/or maintain current service levels. ${capTh} delivers bespoke solutions, builds long-term relationships and tailors offerings to match the dynamic demands of customers and stakeholders.`,
      atBest:`At its best, ${th} notices, understands and addresses opportunities and problems quickly. People are empowered to act. The shifting demands of customers, regulators and other stakeholders are rapidly and appropriately addressed.`,
      blind:`Mindful Action is weakened in ${th} when the organisation stops investing in the competence of its people. Without Preventative Control, the lack of structure can lead to disarray and silos. Without Performance Optimisation, the decentralised system can be inefficient, with much duplication. Without Adaptive Innovation, people are constantly firefighting and do not have time to be more forward-thinking.`,
      areas:`Increase Preventative Control by clearly defining roles and responsibilities and introducing formal planning processes with budgets and audits. Increase Performance Optimisation by rethinking and redesigning how work is done to better support productivity, efficiency and quality. Increase Adaptive Innovation by exploring new markets, capabilities and technologies — creating safe spaces for multi-disciplinary groups to develop novel solutions.`,
    },
    performance_optimisation:{
      summary:`${capTh}'s profile shows a dominant Performance Optimisation strategy — a progressive, consistency-focused approach. Organisational resilience is formed by process optimisation, continually improving, refining and extending existing competencies, and exploiting current technologies to serve present customers and stakeholders more efficiently and effectively.`,
      purpose:`Your scores suggest you believe the end goal in ${th} is to continuously improve the processes by which it operates — striving toward an aspirational vision and exploiting existing capabilities incrementally over time. Expectations are best met through systematic, ongoing improvement rather than radical change.`,
      people:`Your scores suggest you believe the environment is reasonably stable but that competition and increasing stakeholder requirements demand continuous improvement. Building consensus and shared direction matters — and recognition and reward systems shape how people behave.`,
      process:`${capTh} is defined by efficient, streamlined operations and centralised services to reduce cost and eradicate errors. There is consistent application of operations management methodologies. Measuring the performance of key processes and benchmarking is integral to the operation.`,
      product:`The strategy is ideal for settings where customers and stakeholders value cost and consistency over variation. ${capTh}'s outputs tend to be high-volume, standardised and focused on incremental rather than transformational change.`,
      atBest:`At its best, ${th} maximises efficiency and delivers on quality. It maintains and continuously improves the level of capability needed to deliver products or services — getting reliably better at what it already does well.`,
      blind:`A singular focus on short-term productivity gain can prove detrimental to medium-term mission and sustainable performance. Without Preventative Control, people can become preoccupied with production over prevention. Without Mindful Action, ${th} can lose its adaptive capacity. Without Adaptive Innovation, the organisation can become very good at exploiting current approaches while quickly losing sight of changing needs and emerging challenges.`,
      areas:`Increase Preventative Control by clearly defining roles and responsibilities and introducing formal planning processes with budgets and audits. Increase Mindful Action by delegating to people closest to the problem and empowering experts with freedom and discretion to act. Increase Adaptive Innovation by exploring new capabilities, technologies and business models — creating safe spaces for multi-disciplinary groups to create novel solutions.`,
    },
    adaptive_innovation:{
      summary:`${capTh}'s profile shows a dominant Adaptive Innovation strategy — a progressive, flexibility-focused approach. Organisational resilience is typically created through innovation and creating new products, services or capabilities. It is also the strategy required to resolve complex, intractable issues that require fundamental rethinking of how the organisation works.`,
      purpose:`Your scores suggest you believe the focus in ${th} should be on creative problem-solving, innovation and learning. The organisation adapts best by continuously experimenting and identifying new options ahead of others. Shared purpose is the engine of transformation.`,
      people:`Your scores suggest you believe the environment is unpredictable and uncertain, and that results are short-lived. Novel solutions come from collaboration and experimentation across the organisation. There is a pull toward disrupting conventional thinking and encouraging divergent perspectives on problems.`,
      process:`${capTh} has a flexible structure that stimulates performance and creativity. Decentralised organisational forms with low levels of hierarchy are constantly adapting to changing situations. The excitement and anxiety of working in this context are understood and people are supported to tolerate the uncertainty of their work.`,
      product:`${capTh} explores new capabilities, technologies and business models. Being a first mover or finding fundamentally new approaches is crucial. Products and services continually redefine the state of the art, creating a continuous stream of innovation.`,
      atBest:`At its best, ${th} achieves creative thinking and problem solving drawing on multiple perspectives, taking risks in a safe environment. System-wide changes are possible across borders and boundaries.`,
      blind:`${capTh} can begin to cut innovation and exploration when faced with uncertainty — a 'threat-rigidity' effect. Without Preventative Control, people can take excessive risks and the lack of structure can lead to unnecessary work and functional silos. Without Performance Optimisation, the decentralised system can be inefficient. Without Mindful Action, the organisation can lose sight of immediate operational challenges.`,
      areas:`Increase Preventative Control by clearly defining roles and responsibilities, introducing formal planning processes with budgets and audits. Increase Performance Optimisation by rethinking and redesigning how work is done to better support productivity, efficiency and quality. Increase Mindful Action by encouraging a 'healthy uneasiness' about what might go wrong — enable people to deal with problems and empower them to act.`,
    },
    neutral:{
      summary:`${capTh}'s profile shows a Neutral strategy — an almost uniform emphasis on all four core strategies. This is often unintended and is rarely achieved by design. It typically reflects an organisation trying to be all things to all people, or one in which different groups are pursuing different strategies independently.`,
      purpose:`${capTh} simultaneously pursues process optimisation and continuous improvement while also finding new solutions and innovative technologies. The organisation is equally focused on prevention and production.`,
      people:`Your scores suggest you find yourself navigating between conflicting demands, making your own judgements about where to focus. The tensions in ${th} feel like genuine 'either/or' choices — but exploring a 'both/and' mindset may unlock more strategic options.`,
      process:`A neutral strategy can be achieved structurally by separating the four core strategies across different groups — for example, preventative control managed by a risk department, adaptive innovation through an R&D function, performance optimisation through operational excellence programmes.`,
      product:`${capTh} delivers performance optimisation to exploit knowledge and advantage — while simultaneously recognising how quickly things change and engaging in adaptive innovation and experimentation.`,
      atBest:`At its best, a neutral strategy allows ${th} to respond to a wide range of challenges by drawing on multiple strategic modes simultaneously.`,
      blind:`Is it possible to be equally great at all four strategies? The short answer is probably not. Individuals, groups and parts of ${th} will likely gravitate toward their preferred way of working. A neutral strategy is hard to do well since the purpose, people, process and product that lead to excellence in any one discipline are often contradictory and incompatible.`,
      areas:`Coordination is critical. Investment in training and education is essential. Consider whether an emphasis on any one of the four core strategies would be preferable to a neutral position.`,
    },
  };
  return texts[strat]||texts.neutral;
}

function generateContextualAnalysis(strat,th,contextText,prog,def,con,flex){
  const ctx=(contextText||'').toLowerCase();
  const isNuclear=ctx.includes('nuclear')||ctx.includes('sellafield')||ctx.includes('decommission')||ctx.includes('nda');
  const isPublic=ctx.includes('public sector')||ctx.includes('government')||ctx.includes('nhs')||ctx.includes('council');
  const isFinance=ctx.includes('bank')||ctx.includes('financial')||ctx.includes('fund')||ctx.includes('insurance');
  const isTech=ctx.includes('tech')||ctx.includes('software')||ctx.includes('digital')||ctx.includes('platform');
  if(isNuclear)return `In the nuclear sector — where ${th} operates — the consequences of failure can be catastrophic and irreversible. This makes a strong defensive and consistent foundation not just strategically sensible but a regulatory and safety imperative. The challenge for organisations like ${th} is not whether to be defensive, but whether that defensive posture has become so dominant that it prevents the kind of progressive, adaptive thinking needed to tackle the complex, long-horizon challenges of decommissioning, workforce transformation and changing stakeholder expectations.`;
  if(isPublic)return `Operating in the public sector, ${th} faces the particular challenge of balancing accountability and consistency — essential for public trust — with the flexibility and innovation increasingly demanded by a changing service landscape. The risk for public sector organisations is that compliance culture becomes a substitute for strategic thinking.`;
  if(isFinance)return `In financial services, the regulatory environment creates strong structural pressures toward defensive and consistent strategies. The resilience challenge for ${th} is ensuring that these necessary constraints do not crowd out the forward-looking, adaptive capacity needed to remain relevant in a rapidly changing market.`;
  if(isTech)return `In the technology sector, the competitive landscape rewards speed, experimentation and adaptive innovation. The risk for ${th} is that the pressure to innovate can erode the consistent operational foundations — the processes, standards and governance — that enable sustainable scaling.`;
  return '';
}

// ── SUGGESTIONS ENGINE ───────────────────────────────────────────────────────
function generateSuggestions(prog,def,con,flex,tp,td,tc,tf,thing,s1ans,s2ans){
  const th=thing||'your organisation';
  const pGap=tp-prog,dGap=td-def,cGap=tc-con,fGap=tf-flex;
  function sc(ans,i){const lv=parseInt(ans[i]?.l)||0,rv=parseInt(ans[i]?.r)||0;return{lv,rv,diff:rv-lv};}
  const S1Q={
    0:{aR:`In ${th}, the drive toward transformation and new capability is clear in your scores. The strategic challenge is sequencing: organisations that pursue transformation without a clear view of what must be protected first tend to lose ground in the areas they depend on most. The priority is to define explicitly what is non-negotiable before committing resources to what is new.`,aL:`Your scores show ${th} is oriented primarily toward protecting and maintaining what currently exists. The strategic risk is not failure — it is slow irrelevance. Organisations that optimise for stability without building new capability typically find themselves defending a shrinking position. The priority is to identify one area where forward investment is overdue and make it a deliberate strategic commitment.`,qR:`What capability does ${th} need in three to five years that does not yet exist — and what would have to be true for the organisation to start building it now?`,qL:`If ${th}'s current capabilities remain unchanged for the next three years, what will be the most significant consequence — and is the organisation taking that seriously?`},
    1:{aR:`Your scores show ${th} is oriented toward prospecting for opportunity and pushing for improvement. The strategic question is whether the organisation has the resilience infrastructure to absorb the failures and setbacks that ambitious improvement programmes inevitably produce. Organisations that invest heavily in progress without investing equally in recovery tend to find that each setback is more damaging than the last.`,aL:`Your scores show ${th} is oriented primarily toward preventing failure and protecting current capacity. Prevention is necessary but not sufficient for long-term viability. The strategic priority is to identify where the organisation's current protective posture is consuming resources that could be generating growth — and to make a deliberate choice about that trade-off.`,qR:`Where has ${th}'s drive for improvement most recently created fragility — and what would a more resilient version of that initiative have looked like?`,qL:`What opportunity has ${th} most consistently failed to pursue because its primary orientation is toward not failing — and what is the accumulated cost of that pattern?`},
    2:{aR:`Your scores reflect an organisation where growth, competition and new business are the primary markers of success. The strategic risk in this orientation is that it can create pressure to chase short-term targets at the expense of the foundations — the processes, capabilities and relationships — that make sustained growth possible.`,aL:`Your scores reflect an organisation where predictability, continuity and risk reduction are the primary markers of success. These are genuine strengths in volatile environments. The strategic question is whether this orientation remains the right one for the conditions ${th} is likely to face over the next three to five years — and whether it is a deliberate choice or a default.`,qR:`What would ${th} need to change about how it measures and rewards success in order to build more resilience into its growth agenda?`,qL:`If ${th}'s operating environment becomes significantly more volatile or competitive over the next three years, is the current emphasis on predictability and risk reduction still the right primary orientation?`},
    3:{aR:`Your scores show ${th} values ambition, achievement and competitive drive in its people. These are powerful assets when channelled well. The strategic challenge is that organisations dominated by high-achievers can become brittle — over-dependent on a small number of exceptional performers, and under-invested in the systems and cultures that produce consistent, reliable performance across the whole.`,aL:`Your scores show ${th} values caution, reliability and adherence to established ways of working. This creates a stable, predictable workforce — and can suppress the challenge, questioning and creative tension that organisations need to identify problems early and adapt to changing conditions.`,qR:`Where has ${th}'s achievement orientation most clearly produced results that a more cautious, reliable approach would not have — and where has it created risk that wasn't adequately managed?`,qL:`What talent is ${th} losing or failing to attract because its culture prizes caution and reliability over ambition and drive — and what is the long-term strategic cost of that?`},
    4:{aR:`Your scores show ${th} expects its leaders to set ambitious goals, inspire, and build buy-in. The strategic risk in this orientation is diffusion — organisations where leadership is primarily inspirational can lack the structural accountability and clear escalation paths that are essential when things go wrong.`,aL:`Your scores show ${th} expects its leaders to cascade clear rules, manage performance through defined mechanisms, and ensure compliance. The strategic risk is the erosion of initiative — organisations led primarily through instruction tend to develop a workforce that waits to be told rather than acts on judgment.`,qR:`Where has ${th}'s inspirational leadership model most clearly enabled performance that directive leadership would not have produced — and where has the absence of clear structure created problems?`,qL:`Where has ${th}'s directive, rule-based leadership approach most clearly prevented a problem — and where has it prevented people from solving one?`},
    5:{aR:`Your scores show ${th} invests in creating new knowledge and capability ahead of need. This is a significant strategic asset when the investment is well-targeted. The risk is that forward-looking capability investment can become disconnected from operational reality — building skills that are impressive in theory but not deployed effectively in practice.`,aL:`Your scores show ${th} develops people primarily in response to incidents, gaps and crises. This is reactive development — it builds competence for the problems the organisation has already faced, not the ones it is about to face.`,qR:`What capability gap will ${th} most regret not having closed in three years — and what is preventing the organisation from investing in it now?`,qL:`What recurring problem in ${th} has been addressed through training or development at least twice in the last three years — and what does it tell you that it keeps recurring?`},
    6:{aR:`Your scores show ${th} aligns people through shared goals and the space to find their own ways of delivering. This creates flexibility and initiative. The strategic risk is coordination failure — when people are pursuing the same goal via different methods, the organisation can lose coherence at the interfaces, which is exactly where the most consequential problems tend to occur.`,aL:`Your scores show ${th} aligns people through planning, supervision and individual-level management. This creates consistency and accountability. The strategic risk is that it concentrates decision-making at the top, which slows response times and can deprive the organisation of the judgment of the people closest to the work.`,qR:`Where is ${th}'s reliance on individual autonomy and goal-alignment most clearly creating coordination failures — and what structural change would address them without undermining the flexibility?`,qL:`Where is ${th}'s reliance on planning and supervision most clearly slowing the organisation's ability to respond to change — and what would it cost to push more decision-making authority downward?`},
    7:{aR:`Your scores show ${th} organises primarily around outcomes and market groups, with targets aligned to the corporate plan. This creates strategic clarity and performance focus. The risk is that without strong functional ownership, critical capabilities — risk management, quality assurance, institutional knowledge — can fragment across business units and become nobody's clear responsibility.`,aL:`Your scores show ${th} organises around hierarchy, functional control systems, governance and regulation. This creates clear accountability and strong procedural discipline. The strategic risk is that it can concentrate decision-making at the top, create slow response times, and make cross-functional collaboration structurally difficult.`,qR:`What critical organisational capability is most at risk of fragmenting or becoming inconsistent because ${th}'s structure distributes it across multiple business units?`,qL:`What strategic decision is ${th} making too slowly because of its hierarchical structure — and what would it cost to accelerate it?`},
    8:{aR:`Your scores show ${th} defaults to optimism and opportunity when facing uncertainty. This is a genuine strategic asset in fast-moving environments. The risk is that it can create systematic under-preparation for downside scenarios — organisations that consistently bet on the upside can find themselves without the absorptive capacity to manage a significant setback.`,aL:`Your scores show ${th} defaults to conservatism and loss mitigation when facing uncertainty. This protects the organisation from catastrophic downside scenarios but can create systematic underinvestment in growth and opportunity. Over time, consistently conservative decision-making under uncertainty tends to compound into a significant strategic disadvantage.`,qR:`Where has ${th}'s optimistic orientation under uncertainty most recently led to a downside outcome that better preparation would have mitigated?`,qL:`Where has ${th}'s conservative orientation under uncertainty most recently led to a missed opportunity that a more confident organisation would have taken?`},
    9:{aR:`Your scores show ${th} sees competitive advantage as coming from proactively initiating change and being a market leader. This requires sustained investment in forward intelligence, innovation capacity, and the organisational ability to move faster than competitors. The strategic risk is that organisations focused on being first movers can move before the market is ready — or before their own capability to deliver is sufficient.`,aL:`Your scores show ${th} sees competitive advantage as coming from making its current position harder to challenge. This is a legitimate and often highly effective strategy — but it requires constant reinvestment in the sources of that position. The strategic risk is that defensive positioning can disguise the erosion of those sources over time.`,qR:`What would a new entrant to ${th}'s market do differently — and what does the answer tell you about where ${th}'s current market strategy is most vulnerable?`,qL:`What is the single most important source of ${th}'s current competitive position — and how confident are you that it will remain a source of advantage in five years?`},
    10:{aR:`Your scores show ${th} believes customers want continuous improvement in cost or features. This orientation keeps the organisation competitive but can create a relentless improvement cycle that never delivers the stability and reliability that many customers also value. The strategic question is whether ${th} has a clear view of which customers it is optimising for — and whether those are the right ones.`,aL:`Your scores show ${th} believes customers primarily value maintaining current service levels and receiving existing, trustworthy products. This is a legitimate orientation for markets where reliability and consistency are genuinely the primary purchase drivers. The strategic risk is that it can be used to justify underinvestment in improvement and innovation — and can leave the organisation exposed when customer expectations shift.`,qR:`What shift in customer expectations is most likely to undermine ${th}'s current value proposition over the next three to five years — and how is the organisation preparing for it?`,qL:`Where is ${th}'s commitment to maintaining current service levels most clearly coming at the cost of responding to evolving customer needs?`},
    11:{aR:`Your scores show ${th} and its stakeholders value market share, goal achievement and short-term growth. These are clear, measurable success criteria. The strategic risk is that they can systematically under-weight the foundations — relationships, capabilities, resilience — that determine whether growth is sustainable.`,aL:`Your scores show ${th} and its stakeholders value dependability, reliability and sustainability. These are genuine strategic assets in markets where trust is the primary purchase driver. The strategic question is whether this value set is creating a ceiling on ambition — and whether that ceiling is a deliberate choice.`,qR:`Where is ${th}'s focus on short-term growth most clearly creating pressure that undermines the long-term foundations — and how is that tension being managed at the strategic level?`,qL:`What would ${th} need to believe about its market and competitive environment to make a significant increase in its growth ambition feel not just possible but necessary?`},
  };
  const S2Q={
    0:{aR:`Your scores show ${th} enables its strategy by creating space for novel solutions and collaborative responses to new situations. The strategic risk is that this orientation can produce incoherence — different parts of the organisation finding their own novel solutions to the same problem, with no mechanism to consolidate learning or create shared practice.`,aL:`Your scores show ${th} enables its strategy by building agreement and support for a declared direction. This creates consistency and predictability but can be slow to adapt when circumstances change. The strategic risk is that the emphasis on consensus can become a mechanism for avoiding difficult strategic choices rather than making them.`,qR:`Where is ${th}'s reliance on collaboration and novel approaches most clearly producing inconsistent outcomes across different parts of the organisation?`,qL:`Where has ${th}'s emphasis on building consensus most recently slowed a decision that needed to be made clearly and quickly?`},
    1:{aR:`Your scores show ${th} focuses its attention on imagining new ways of working and building flexibility and adaptability. The strategic risk is that organisations focused on creating the future can underinvest in executing the present — and the reliability of current operations is what funds future innovation.`,aL:`Your scores show ${th} focuses its attention on executing existing work practices, processes and procedures well. The strategic risk is that organisations focused primarily on executing the current model can fail to notice when that model needs to change.`,qR:`What existing work practice in ${th} is most constraining the organisation's ability to respond to new conditions — and what would it take to change it?`,qL:`Where is ${th}'s focus on executing existing practices most clearly preventing the organisation from investing in the practices it will need in the future?`},
    2:{aR:`Your scores show ${th} builds its core capabilities around innovation, agility and being cutting edge. The strategic risk is that it can create capability fragility — the organisation is excellent at building new things but struggles to maintain and operate them at scale and with consistency.`,aL:`Your scores show ${th} builds its core capabilities around meeting requirements, efficiency gains and improving quality standards. The strategic risk is that it anchors capability development to current requirements — which may not reflect what the organisation will need in the future.`,qR:`What capability is ${th} most at risk of losing competitive advantage in because its capability-building framework is anchored to today's requirements rather than tomorrow's conditions?`,qL:`Where is ${th}'s emphasis on meeting current requirements most clearly preventing investment in the capabilities it will need when requirements change?`},
    3:{aR:`Your scores show ${th} expects people to be creative and responsive when facing threats and opportunities. The strategic risk is that organisations where creative response is the default can struggle to deliver the consistent, systematic execution that critical processes require.`,aL:`Your scores show ${th} expects people to be systematic and consistent when responding to threats and opportunities. The strategic risk is that when genuinely novel situations arise — ones the system wasn't designed for — the organisation may lack the adaptive capacity to respond effectively.`,qR:`Where is ${th}'s reliance on creative, responsive people most clearly creating inconsistency in outcomes that systematic process would prevent?`,qL:`Where is ${th}'s expectation of systematic response most clearly failing when the situation is genuinely novel?`},
    4:{aR:`Your scores show ${th} engages people by delegating to those closest to the problem and empowering them with freedom and discretion. The strategic risk is that empowerment without shared understanding of strategic intent can produce excellent local decisions that are collectively incoherent.`,aL:`Your scores show ${th} engages people by establishing common values and shared expectations. The strategic risk is that it can create conformity — a workforce that is excellent at executing within the current frame but struggles when the frame needs to change.`,qR:`Where is ${th}'s delegation model most clearly producing decisions that are locally excellent but strategically incoherent?`,qL:`Where is ${th}'s emphasis on common values most clearly creating conformity that suppresses the challenge and divergence the organisation needs?`},
    5:{aR:`Your scores show people succeed in ${th} by identifying new possibilities, demonstrating situational awareness and thinking non-conventionally. The strategic risk is that organisations that consistently reward novelty can inadvertently signal that reliability and consistency are less valued — which is dangerous when critical processes depend on both.`,aL:`Your scores show people succeed in ${th} by complying with processes and living the organisational values and norms. The strategic risk is that it can create an organisation that executes current strategy reliably but struggles to challenge it when challenge is needed.`,qR:`What does success look like in ${th} for someone who is excellent at operational reliability but has no appetite for innovation — and what does that answer reveal about the culture?`,qL:`What challenge about ${th}'s current direction is most consistently being suppressed because the culture rewards compliance over critical thinking?`},
    6:{aR:`Your scores show ${th} coordinates through informal cooperation and communication. The strategic risk is that informal coordination fails at scale, under pressure, and across boundaries — precisely the conditions under which coordination matters most.`,aL:`Your scores show ${th} coordinates through standardised processes and clear roles and responsibilities. The strategic risk is that standardisation can create rigidity — making it difficult to coordinate effectively when the situation doesn't fit the standard process.`,qR:`Where is ${th}'s reliance on informal coordination most clearly creating coordination failures — and what is the minimum structural intervention that would address them?`,qL:`Where is ${th}'s standardised coordination most clearly failing to handle situations that don't fit the standard process?`},
    7:{aR:`Your scores show ${th} maximises its resources by decentralising and operating in networked, adaptive structures. The strategic risk is that decentralised organisations can duplicate effort, lose institutional knowledge, and find it difficult to deploy resources to where they are most needed at the strategic level.`,aL:`Your scores show ${th} maximises its resources by centralising services and managing streamlined, efficient operations. The strategic risk is that centralisation creates bottlenecks and can make the organisation slow to respond to local conditions that require rapid resource deployment.`,qR:`Where is ${th}'s decentralised structure most clearly creating duplication or strategic incoherence that a more coordinated approach would prevent?`,qL:`Where is ${th}'s centralised structure most clearly creating bottlenecks that are slowing the organisation's ability to respond?`},
    8:{aR:`Your scores show ${th} responds to problems using people's discretion, judgement and collective expertise. The strategic risk is that discretion-based response can produce highly variable outcomes — excellent when the right people are available, poor when they are not.`,aL:`Your scores show ${th} responds to problems using established responses, planned procedures and formal rules. The strategic risk is that procedural response can fail when the situation is genuinely novel — and organisations that rely heavily on procedure can develop a cultural aversion to acknowledging when the procedure doesn't apply.`,qR:`Where is ${th}'s reliance on discretion most clearly producing variable outcomes that better procedural definition would prevent?`,qL:`Where has ${th}'s procedural response most recently failed to handle a situation effectively — and what does the gap between the procedure and the reality reveal?`},
    9:{aR:`Your scores show ${th} gains competitive advantage by exploring new markets, capabilities, technologies and business models. The strategic risk is that exploration without sufficient exploitation of current strengths can create an organisation that is always building the next thing and never fully delivering on what it has already built.`,aL:`Your scores show ${th} gains competitive advantage by optimising its existing business model and exploiting current capabilities. The strategic risk is that organisations focused primarily on exploiting current models can miss the moment when those models need to be fundamentally changed.`,qR:`What is the most significant strategic opportunity that ${th} is currently not positioned to pursue because its model is too narrowly focused on optimising what it already does?`,qL:`What signal is ${th} most consistently ignoring that suggests its current business model needs to evolve?`},
    10:{aR:`Your scores show ${th} sees its future in bespoke, low-volume, highly responsive solutions. The strategic risk is that the commitment to customisation can create cost structures and operational complexity that make it difficult to sustain at scale.`,aL:`Your scores show ${th} sees its future in standardised, high-volume, transaction-oriented delivery. The strategic risk is that it makes the organisation vulnerable to competitors who can deliver the same standardisation at lower cost.`,qR:`What level of customisation is ${th} currently committing to that its operational model cannot sustainably support — and what strategic choice needs to be made about where to draw that line?`,qL:`Where is ${th}'s commitment to standardisation most clearly creating competitive vulnerability?`},
    11:{aR:`Your scores show ${th} wants to be measured by innovation and responsiveness. The strategic risk is that these metrics can crowd out the efficiency and consistency metrics that determine whether the organisation is actually sustainable.`,aL:`Your scores show ${th} wants to be measured by efficiency, timeliness and consistency. The strategic risk is that they can create a measurement system that optimises for the current operating model even when that model needs to change.`,qR:`What outcome that matters most to ${th}'s most important stakeholders is not currently captured by its measurement system — and what would change if it were?`,qL:`Where is ${th}'s current measurement system most clearly optimising for the present at the expense of the future?`},
  };

  function buildSection(catName,offset){
    const candidates=[];
    for(let i=0;i<3;i++){
      const s1={...sc(s1ans,offset+i),qi:offset+i,survey:'s1'};
      const s2={...sc(s2ans,offset+i),qi:offset+i,survey:'s2'};
      const s1lev=pGap>0?(s1.lv-s1.rv):dGap>0?(s1.rv-s1.lv):Math.abs(s1.diff);
      const s2lev=fGap>0?(s2.lv-s2.rv):cGap>0?(s2.rv-s2.lv):Math.abs(s2.diff);
      if((parseInt(s1ans[offset+i]?.l)||0)+(parseInt(s1ans[offset+i]?.r)||0)>0)candidates.push({lev:s1lev,qi:offset+i,survey:'s1',dir:s1.diff<=0?'L':'R'});
      if((parseInt(s2ans[offset+i]?.l)||0)+(parseInt(s2ans[offset+i]?.r)||0)>0)candidates.push({lev:s2lev,qi:offset+i,survey:'s2',dir:s2.diff<=0?'L':'R'});
    }
    candidates.sort((a,b)=>b.lev-a.lev);
    const top=candidates[0];const second=candidates[1]||candidates[0];
    function txt(c,type){const lib=c&&(c.survey==='s1'?S1Q:S2Q);const entry=lib&&lib[c.qi];if(!entry)return null;return c.dir==='L'?entry[type+'L']:entry[type+'R'];}
    return{
      action:txt(top,'a')||`Identify the one change in ${catName.toLowerCase()} that would most close the gap between where ${th} is and where you want it to be — and take one small step toward it this week.`,
      question:txt(second,'q')||`If your desired profile for ${catName.toLowerCase()} was already in place today, what would be the first thing you would notice that was different?`
    };
  }
  return{purpose:buildSection('Purpose',0),people:buildSection('People',3),process:buildSection('Process',6),product:buildSection('Product',9)};
}


// ── AI FACILITATION PROMPTS (structured renderer) ───────────────────────────
// Renders the structured response from /api/stat-ai-questions into Current/Future
// sections. Falls back gracefully to a flat list if the server returns an old shape.
function renderInlineMarkdown(text){
  if(!text)return null;
  // Render **bold** segments
  const parts=String(text).split(/(\*\*[^*]+\*\*)/g);
  return parts.map((p,i)=>{
    if(/^\*\*[^*]+\*\*$/.test(p))return <strong key={i}>{p.slice(2,-2)}</strong>;
    return <span key={i}>{p}</span>;
  });
}

function renderAiFacilitationPrompts(payload){
  // Backward-compat: if payload is a flat array of strings, render simple list
  if(Array.isArray(payload)){
    return(
      <div>
        {payload.map((q,i)=>(
          <div key={i} style={{padding:'.85rem 0',borderBottom:'1px solid #ebe7e0'}}>
            <div style={{display:'flex',gap:'.65rem',alignItems:'flex-start'}}>
              <div className="sug-num">{i+1}</div>
              <div className="sug-txt">{q}</div>
            </div>
          </div>
        ))}
      </div>
    );
  }

  // Structured shape
  const {current,future,dominantStrategy,agreementPattern,futurePattern,n,questions}=payload||{};
  // Fallback 1: if structured fields missing but we have a flat questions array, render that
  if((!current||!future)&&Array.isArray(questions)&&questions.length){
    return(
      <div>
        <div style={{fontSize:'.7rem',color:'#888',marginBottom:'.5rem',fontFamily:"'DM Sans',sans-serif"}}>
          {n?`Based on ${n} respondent${n!==1?'s':''}`:'Facilitation prompts'}
        </div>
        {questions.map((q,i)=>(
          <div key={i} style={{padding:'.85rem 0',borderBottom:'1px solid #ebe7e0'}}>
            <div style={{display:'flex',gap:'.65rem',alignItems:'flex-start'}}>
              <div className="sug-num">{i+1}</div>
              <div className="sug-txt">{q}</div>
            </div>
          </div>
        ))}
      </div>
    );
  }
  // Fallback 2: nothing renderable
  if(!current||!future)return <div style={{color:'#888',fontStyle:'italic',padding:'1rem 0'}}>The facilitation API returned an unexpected response. Try regenerating, or contact support if this persists.</div>;

  function renderItem(item,i){
    return(
      <div key={i} style={{padding:'.9rem 0',borderBottom:'1px solid #ebe7e0'}}>
        {item.prompt&&(
          <div style={{fontSize:'.875rem',lineHeight:1.7,color:'#1a1a1a',marginBottom:item.bullets||item.question?'.5rem':0,fontFamily:"'DM Sans',sans-serif"}}>
            {renderInlineMarkdown(item.prompt)}
          </div>
        )}
        {item.bullets&&item.bullets.length>0&&(
          <ul style={{margin:'.4rem 0 .6rem 1.25rem',padding:0,fontSize:'.84rem',lineHeight:1.65,color:'#333'}}>
            {item.bullets.map((b,bi)=><li key={bi} style={{marginBottom:'.25rem'}}>{b}</li>)}
          </ul>
        )}
        {item.question&&(
          <div style={{display:'flex',gap:'.65rem',alignItems:'flex-start',marginTop:item.prompt||item.bullets?'.4rem':0}}>
            <div className="sug-num">?</div>
            <div className="sug-txt" style={{fontWeight:600}}>{item.question}</div>
          </div>
        )}
      </div>
    );
  }

  return(
    <div>
      <div style={{fontSize:'.7rem',color:'#888',marginBottom:'.5rem',fontFamily:"'DM Sans',sans-serif"}}>
        Based on {n} respondent{n!==1?'s':''} · Dominant pattern: <strong>{dominantStrategy?dominantStrategy.name:'—'}</strong>
      </div>
      <div style={{marginTop:'1rem'}}>
        <div className="rpt-heading" style={{fontSize:'.75rem',color:'#1a1a1a',borderBottom:'2px solid #1a1a1a',paddingBottom:'.35rem',marginBottom:'.6rem'}}>{current.heading}</div>
        {current.items.map(renderItem)}
      </div>
      <div style={{marginTop:'1.5rem'}}>
        <div className="rpt-heading" style={{fontSize:'.75rem',color:'#1a1a1a',borderBottom:'2px solid #1a1a1a',paddingBottom:'.35rem',marginBottom:'.6rem'}}>{future.heading}</div>
        {future.items.map(renderItem)}
      </div>
    </div>
  );
}

function aiPromptsToPlainText(payload){
  if(Array.isArray(payload))return payload.map((q,i)=>`${i+1}. ${q}`).join('\n');
  const {current,future}=payload||{};
  const lines=[];
  function emitItem(item){
    if(item.prompt)lines.push(item.prompt.replace(/\*\*/g,''));
    if(item.bullets&&item.bullets.length){item.bullets.forEach(b=>lines.push(`  • ${b}`));}
    if(item.question)lines.push(`  ? ${item.question}`);
    lines.push('');
  }
  if(current){lines.push(current.heading.toUpperCase());lines.push('');current.items.forEach(emitItem);}
  if(future){lines.push(future.heading.toUpperCase());lines.push('');future.items.forEach(emitItem);}
  return lines.join('\n').trim();
}

const MX=120,SZ=260,CX=130,CY=130,RD=90;
function axisPt(ax,sc){const r=(sc/MX)*RD;if(ax==='prog')return[CX,CY-r];if(ax==='flex')return[CX+r,CY];if(ax==='def')return[CX,CY+r];return[CX-r,CY];}
function shapePath(s){const pts=[[CX,CY-(s.p/MX)*RD],[CX+(s.f/MX)*RD,CY],[CX,CY+(s.d/MX)*RD],[CX-(s.c/MX)*RD,CY]];return pts.map((pt,i)=>`${i===0?'M':'L'}${pt[0]},${pt[1]}`).join(' ')+' Z';}
function gridPath(pct){const r=RD*pct;return `M${CX},${CY-r} L${CX+r},${CY} L${CX},${CY+r} L${CX-r},${CY} Z`;}

// ── QUESTION SECTION ─────────────────────────────────────────────────────────
function QuestionSection({secData,answers,onChange,activeIdx,setActiveIdx}){
  const allQ=secData.categories.flatMap(c=>c.qs);
  const firstUnanswered=allQ.findIndex((_,i)=>{const a=answers[i];const lv=parseInt(a?.l)||0,rv=parseInt(a?.r)||0;return(lv+rv)===0;});
  const maxUnlocked=firstUnanswered===-1?allQ.length-1:firstUnanswered;
  return(
    <div>
      {secData.categories.map(cat=>(
        <div key={cat.name}>
          <div className="q-cat-hdr">{cat.name}</div>
          {cat.qs.map(q=>{
            const idx=allQ.findIndex(x=>x.id===q.id);
            const a=answers[idx]||{l:'',r:''};
            const lv=parseInt(a.l)||0,rv=parseInt(a.r)||0;
            const total=lv+rv,over=total>10,done=total>0&&!over;
            const locked=idx>maxUnlocked;
            const isActive=idx===activeIdx||(activeIdx<0&&idx===0);
            const lActive=lv>0,rActive=rv>0;
            const rem=10-total;
            function handleL(val){
              const n=Math.max(0,Math.min(Number(val)||0,10));
              const u=[...answers];u[idx]={l:String(n),r:String(10-n)};onChange(u);setActiveIdx(idx);
            }
            function handleR(val){
              const n=Math.max(0,Math.min(Number(val)||0,10));
              const u=[...answers];u[idx]={l:String(10-n),r:String(n)};onChange(u);setActiveIdx(idx);
            }
            return(
              <div key={q.id} className={`q-card${locked?' locked':isActive?' active':done?' done':''}`} onClick={()=>!locked&&setActiveIdx(idx)}>
                <div className="q-card-title">{idx+1}. {q.q}</div>
                <div className="q-grid">
                  <div className="q-opt" style={{background:lActive?'#fff8f5':'#faf8f5',border:lActive?'1px solid #e07030':'1px solid #e0dbd4',color:lActive?'#1a1a1a':'#666'}}>
                    <div className="q-opt-side" style={{color:lActive?'#e07030':'#c0b8ae'}}>Option A</div>
                    {q.l}
                  </div>
                  <div className="q-inputs">
                    <div className="q-input-row">
                      <div className="q-stepper">
                        <button className="q-step-btn" disabled={locked||lv<=0} onClick={e=>{e.stopPropagation();handleL(lv-1);}}>−</button>
                        <div className="q-val">{lv}</div>
                        <button className="q-step-btn" disabled={locked||lv>=10} onClick={e=>{e.stopPropagation();handleL(lv+1);}}>+</button>
                      </div>
                      <span className="q-sep">|</span>
                      <div className="q-stepper">
                        <button className="q-step-btn" disabled={locked||rv<=0} onClick={e=>{e.stopPropagation();handleR(rv-1);}}>−</button>
                        <div className="q-val">{rv}</div>
                        <button className="q-step-btn" disabled={locked||rv>=10} onClick={e=>{e.stopPropagation();handleR(rv+1);}}>+</button>
                      </div>
                    </div>
                    <div className={`q-hint${done?' ok':''}`}>
                      {done?`✓ 10 pts`:`${total}/10 pts`}
                    </div>

                  </div>
                  <div className="q-opt" style={{background:rActive?'#fff8f5':'#faf8f5',border:rActive?'1px solid #e07030':'1px solid #e0dbd4',color:rActive?'#1a1a1a':'#666'}}>
                    <div className="q-opt-side" style={{color:rActive?'#e07030':'#c0b8ae'}}>Option B</div>
                    {q.r}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

  // Truncate a single line of text to fit within maxWidth (mm), adding "..." if cut.
  // Caller must have already set the font/size that will be used to render.
  function truncToFit(text, maxWidth){
    const s = String(text||'');
    if(!s) return '';
    if(doc.getTextWidth(s) <= maxWidth) return s;
    const ellipsis = '...';
    const eW = doc.getTextWidth(ellipsis);
    if(eW > maxWidth) return '';
    let lo = 0, hi = s.length;
    while(lo < hi){
      const mid = Math.ceil((lo+hi)/2);
      if(doc.getTextWidth(s.slice(0, mid)) + eW <= maxWidth) lo = mid;
      else hi = mid - 1;
    }
    return s.slice(0, lo).replace(/\s+$/,'') + ellipsis;
  }

  // Diamond renderer — draws a diamond chart at PDF coords using doc.lines
  function drawDiamond(cx, cy, radius, scores, fillColor, strokeColor, label){
    const MX = 120;
    function pt(axis, val){
      const r = (Math.max(0, Math.min(MX, val))/MX) * radius;
      if (axis === 'prog') return [cx, cy - r];
      if (axis === 'flex') return [cx + r, cy];
      if (axis === 'def')  return [cx, cy + r];
      return [cx - r, cy]; // con
    }
    // Grid rings (faint) — closed diamond path: top→right→bottom→left→top
    doc.setDrawColor(...BORDER);
    doc.setLineWidth(0.15);
    [0.25, 0.5, 0.75, 1.0].forEach(pct=>{
      const r = radius*pct;
      // Start at top vertex (cx, cy-r), deltas trace clockwise back to top
      doc.lines([[r,r],[-r,r],[-r,-r],[r,-r]], cx, cy - r, [1,1], 'D', true);
    });
    // Cross axes (subtle gray)
    doc.setDrawColor(...BORDER);
    doc.setLineWidth(0.1);
    doc.line(cx-radius, cy, cx+radius, cy);
    doc.line(cx, cy-radius, cx, cy+radius);

    // Shape
    const sP = (scores.p !== undefined ? scores.p : scores.prog) || 0;
    const sD = (scores.d !== undefined ? scores.d : scores.def)  || 0;
    const sC = (scores.c !== undefined ? scores.c : scores.con)  || 0;
    const sF = (scores.f !== undefined ? scores.f : scores.flex) || 0;
    const [px, py]   = pt('prog', sP);
    const [fx, fy]   = pt('flex', sF);
    const [dx, dy]   = pt('def',  sD);
    const [cnx, cny] = pt('con',  sC);
    if(fillColor) doc.setFillColor(...fillColor);
    doc.setDrawColor(...strokeColor);
    doc.setLineWidth(0.6);
    // Path: prog (top) → flex (right) → def (bottom) → con (left) → prog (close)
    doc.lines(
      [[fx-px, fy-py],[dx-fx, dy-fy],[cnx-dx, cny-dy],[px-cnx, py-cny]],
      px, py, [1,1], fillColor?'FD':'D', true
    );

    // Axis labels
    setFont(7.5, 'bold', TEXT);
    doc.text('Progressive', cx, cy-radius-3, {align:'center'});
    doc.text('Flexible',    cx+radius+2, cy+1, {align:'left'});
    doc.text('Defensive',   cx, cy+radius+5, {align:'center'});
    doc.text('Consistent',  cx-radius-2, cy+1, {align:'right'});

    // Score dots
    [['prog',sP],['flex',sF],['def',sD],['con',sC]].forEach(([ax,sc])=>{
      const [x,yy] = pt(ax, sc);
      doc.setFillColor(...strokeColor);
      doc.circle(x, yy, 2.6, 'F');
      setFont(6.5, 'bold', WHITE);
      doc.text(String(Math.round(sc)), x, yy+1.1, {align:'center'});
    });

    // Optional label below
    if(label){
      setFont(8, 'bold', MUTED);
      doc.text(label, cx, cy+radius+11, {align:'center'});
    }
  }
