// Builds the polished workshop group deliverable using jsPDF.
// Default anonymous (R1, R2, R3...). Optional `useNames=true` for named version.
function generateStatGroupPDF(opts){
  const {
    realRespondents, withTobe,
    gMean, gTobeMean, groupStrat, groupTobeStrat, groupIsSplit,
    bigGap, qVariances,
    principlesCluster, aiQuestions,
    sessionCode, orgName, useNames,
    SLABELS, getStrategy,
  } = opts;

  if(!window.jspdf||!window.jspdf.jsPDF){
    alert('PDF library failed to load. Please refresh the page and try again.');
    return;
  }
  if(realRespondents.length<2){
    alert('Need at least 2 respondents to generate a report. Currently '+realRespondents.length+'.');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = 210, pageH = 297, margin = 18;
  let y = margin;
  let pageNum = 0;

  const TEXT = [26, 26, 26];
  const MUTED = [107, 107, 107];
  const ACCENT = [224, 112, 48];
  const BG = [240, 237, 232];
  const BORDER = [216, 211, 203];
  const WHITE = [255, 255, 255];
  const RED = [192, 57, 43];

  // Anonymisation map by created_at order
  const sorted = [...realRespondents].sort((a,b)=>{
    const da=new Date(a.created_at||a.date||0).getTime();
    const db=new Date(b.created_at||b.date||0).getTime();
    return da-db;
  });
  const aliasMap = {};
  sorted.forEach((r,i)=>{aliasMap[r.respondent_name]='R'+(i+1);});
  const labelOf = (name)=>useNames ? (name||'') : (aliasMap[name]||name||'');

  // Helpers
  function setFont(size, weight, color){
    doc.setFont('helvetica', weight||'normal');
    doc.setFontSize(size);
    if(color)doc.setTextColor(...color);
  }
  function rule(yPos){
    doc.setDrawColor(...BORDER);
    doc.setLineWidth(0.2);
    doc.line(margin, yPos||y, pageW-margin, yPos||y);
  }
  function checkPage(needed){
    if(y+needed > pageH-margin-15){
      addFooter();
      doc.addPage();
      pageNum++;
      y = margin;
      addHeader();
    }
  }
  function addHeader(){
    if(pageNum===0)return;
    setFont(8, 'normal', MUTED);
    doc.text('CHANGEBEFORE', margin, 10);
    doc.text('STAT — Group Report'+(orgName?(' · '+orgName):''), pageW-margin, 10, {align:'right'});
    doc.setDrawColor(...BORDER);
    doc.setLineWidth(0.15);
    doc.line(margin, 12, pageW-margin, 12);
    y = margin+2;
  }
  function addFooter(){
    if(pageNum===0)return;
    const fy = pageH-12;
    doc.setDrawColor(...BORDER);
    doc.setLineWidth(0.15);
    doc.line(margin, fy-4, pageW-margin, fy-4);
    setFont(8, 'normal', MUTED);
    doc.text('ChangeBefore · Strategic Tensions Assessment', margin, fy);
    doc.text(String(pageNum), pageW-margin, fy, {align:'right'});
  }
  function sectionTitle(title){
    checkPage(20);
    doc.setFont('times','bold');
    doc.setFontSize(16);
    doc.setTextColor(...TEXT);
    doc.text(title, margin, y);
    doc.setFont('helvetica','normal');
    y += 3;
    rule();
    y += 8;
  }
  function paragraph(text, opt){
    opt = opt||{};
    const sz = opt.size||10;
    const wrapped = doc.splitTextToSize(text, pageW-2*margin);
    setFont(sz, opt.weight||'normal', opt.color||TEXT);
    const lh = sz*0.42;
    checkPage(wrapped.length*lh+2);
    doc.text(wrapped, margin, y);
    y += wrapped.length*lh + 2;
  }
  function localVariance(arr){
    if(arr.length<2)return 0;
    const m=arr.reduce((s,v)=>s+v,0)/arr.length;
    return arr.reduce((s,v)=>s+(v-m)**2,0)/arr.length;
  }

  // ───── COVER PAGE ─────
  doc.setFillColor(...BG);
  doc.rect(0, 0, pageW, pageH, 'F');

  setFont(9, 'bold', TEXT);
  doc.text('CHANGEBEFORE', margin, 30);
  setFont(8, 'normal', MUTED);
  doc.text('Diagnostic consulting · Change before you have to.', margin, 35);
  doc.setDrawColor(...ACCENT);
  doc.setLineWidth(0.8);
  doc.line(margin, 42, margin+30, 42);

  doc.setFont('times','bold');
  doc.setFontSize(34);
  doc.setTextColor(...TEXT);
  doc.text('Strategic', margin, 110);
  doc.text('Tensions', margin, 124);
  doc.text('Assessment', margin, 138);

  doc.setFont('times','italic');
  doc.setFontSize(20);
  doc.setTextColor(...ACCENT);
  doc.text('Group Profile', margin, 155);

  if(orgName){
    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    doc.setTextColor(...MUTED);
    doc.text('Prepared for', margin, 180);
    doc.setFont('times','bold');
    doc.setFontSize(18);
    doc.setTextColor(...TEXT);
    doc.text(orgName, margin, 190);
  }

  // Contact line above the metadata block
  const contactY = pageH-50;
  setFont(8, 'normal', MUTED);
  doc.text('CONTACT', margin, contactY);
  setFont(10, 'bold', TEXT);
  doc.text('contact@changebefore.com', margin, contactY+6);
  setFont(9, 'normal', MUTED);
  doc.text('changebefore.com', margin, contactY+11);

  const coverFY = pageH-30;
  doc.setDrawColor(...BORDER);
  doc.setLineWidth(0.2);
  doc.line(margin, coverFY-8, pageW-margin, coverFY-8);

  setFont(8, 'normal', MUTED);
  doc.text('SESSION', margin, coverFY-2);
  doc.text('RESPONDENTS', margin+50, coverFY-2);
  doc.text('DATE', margin+100, coverFY-2);

  setFont(11, 'bold', TEXT);
  doc.text(sessionCode||'—', margin, coverFY+4);
  doc.text(String(realRespondents.length), margin+50, coverFY+4);
  doc.text(new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}), margin+100, coverFY+4);

  setFont(7, 'normal', MUTED);
  doc.text((useNames?'Named report':'Anonymised report')+' · ChangeBefore · tools.changebefore.com',
    pageW/2, pageH-10, {align:'center'});

  // ───── PAGE 2: EXECUTIVE SUMMARY ─────
  doc.addPage(); pageNum=1; y=margin+5; addHeader();
  sectionTitle('Executive summary');

  const N = realRespondents.length;
  const tobeN = withTobe.length;
  const dominantStrategy = SLABELS[groupStrat]+(groupIsSplit?' (group is split)':'');
  const biggestShift = bigGap && Math.abs(bigGap.gap)>=8 ? bigGap : null;

  let bits = [];
  bits.push(`Across ${N} respondents${tobeN<N&&tobeN>0?' ('+tobeN+' completed the desired-state exercise)':''}, the group's dominant current strategy is ${dominantStrategy}.`);
  if(groupIsSplit){
    bits.push(`Significant variance on at least one axis suggests the group does not see the organisation through a single lens — there are real differences of view about how the organisation operates today.`);
  } else {
    bits.push(`The group is broadly aligned in how it sees the organisation today.`);
  }
  if(biggestShift){
    const dir = biggestShift.gap>0?'up':'down';
    bits.push(`The most significant collective shift sought is ${biggestShift.lbl} ${dir} ${Math.abs(biggestShift.gap)} points.`);
  }
  if(qVariances && qVariances.length>0){
    const sharpestQ = qVariances[0];
    const sharpestSD = (Number.isFinite(sharpestQ.variance) ? Math.sqrt(sharpestQ.variance) : 0).toFixed(1);
    bits.push(`The sharpest individual disagreement is on Question ${sharpestQ.qi+1} (SD ${sharpestSD}) — surface this first in the debrief.`);
  }
  paragraph(bits.join(' '));
  y += 3;

  // Three boxes
  checkPage(28);
  const boxW = (pageW-2*margin-8)/3;
  const boxes = [
    {label:'RESPONDENTS', value:String(N), sub:tobeN<N&&tobeN>0?(tobeN+' incl. desired'):''},
    {label:'DOMINANT STRATEGY', value:SLABELS[groupStrat], sub:groupIsSplit?'Group is split':'Aligned'},
    {label:'BIGGEST SHIFT', value:biggestShift?(biggestShift.lbl):'—', sub:biggestShift?(((biggestShift.gap>0?'+':'')+biggestShift.gap)+' pts'):'No major shift'}
  ];
  boxes.forEach((b,i)=>{
    const x = margin+i*(boxW+4);
    doc.setFillColor(...WHITE);
    doc.setDrawColor(...BORDER);
    doc.setLineWidth(0.2);
    doc.rect(x, y, boxW, 24, 'FD');
    setFont(7, 'bold', MUTED);
    doc.text(b.label, x+3, y+6);
    let valSize = 13;
    if(doc.getTextWidth(b.value)>boxW-6) valSize = 10;
    setFont(valSize, 'bold', TEXT);
    doc.text(b.value, x+3, y+14);
    setFont(8, 'normal', MUTED);
    doc.text(b.sub||'', x+3, y+20);
  });
  y += 30;

  // ───── GROUP PROFILE ─────
  checkPage(80);
  sectionTitle('Group profile');
  paragraph('Group mean scores across the four mindset and approach dimensions.', {color:MUTED, size:9});
  y += 2;

  const dims = [
    {key:'prog', label:'PROGRESSIVE', value:gMean.prog},
    {key:'def',  label:'DEFENSIVE',   value:gMean.def},
    {key:'con',  label:'CONSISTENT',  value:gMean.con},
    {key:'flex', label:'FLEXIBLE',    value:gMean.flex},
  ];
  const dimW = (pageW-2*margin-9)/4;
  dims.forEach((d,i)=>{
    const x = margin+i*(dimW+3);
    doc.setFillColor(...WHITE);
    doc.setDrawColor(...BORDER);
    doc.setLineWidth(0.2);
    doc.rect(x, y, dimW, 24, 'FD');
    setFont(7, 'bold', MUTED);
    doc.text(d.label, x+2.5, y+6);
    setFont(18, 'bold', ACCENT);
    doc.text(String(d.value), x+2.5, y+18);
    setFont(7, 'normal', MUTED);
    doc.text('/ 120', x+dimW-2, y+18, {align:'right'});
  });
  y += 30;

  checkPage(20);
  doc.setFillColor(...TEXT);
  doc.rect(margin, y, pageW-2*margin, 16, 'F');
  setFont(7, 'bold', ACCENT);
  doc.text('CURRENT STRATEGY', margin+5, y+6);
  setFont(13, 'bold', WHITE);
  doc.text(SLABELS[groupStrat]+(groupIsSplit?' [group is split]':''), margin+5, y+12);
  y += 22;

  if(groupTobeStrat && groupTobeStrat!==groupStrat){
    checkPage(20);
    doc.setDrawColor(...ACCENT);
    doc.setLineWidth(0.4);
    doc.rect(margin, y, pageW-2*margin, 16);
    setFont(7, 'bold', ACCENT);
    doc.text('DESIRED STRATEGY', margin+5, y+6);
    setFont(13, 'bold', TEXT);
    doc.text(SLABELS[groupTobeStrat], margin+5, y+12);
    y += 22;
  }

  if(biggestShift && Math.abs(biggestShift.gap)>=4){
    checkPage(15);
    setFont(9, 'italic', MUTED);
    const dir = biggestShift.gap>0?'increase':'decrease';
    doc.text(`Strongest desired shift: ${biggestShift.lbl} — collective ${dir} of ${Math.abs(biggestShift.gap)} points.`, margin, y);
    y += 6;
  }

  // ───── DISAGREEMENTS ─────
  if(qVariances && qVariances.length>0){
    doc.addPage(); pageNum++; y=margin+5; addHeader();
    sectionTitle('Where the group disagrees');
    paragraph('The questions where opinions diverged most. SD = standard deviation of right-pole scores. Higher = more disagreement.', {color:MUTED, size:9});
    y += 3;

    const top = qVariances.slice(0, Math.min(8, qVariances.length));
    const sdMaxRef = Number.isFinite(qVariances[0].variance) ? Math.sqrt(qVariances[0].variance) : 0;

    top.forEach((qv,i)=>{
      const sd = Number.isFinite(qv.variance) ? Math.sqrt(qv.variance) : 0;
      checkPage(34);
      // Header row: index/section, then question
      setFont(9, 'bold', ACCENT);
      doc.text('#'+(i+1), margin, y+5);
      setFont(7, 'normal', MUTED);
      doc.text((qv.isS1?'§1':'§2')+' Q'+(qv.qi+1), margin, y+10);

      setFont(10, 'bold', TEXT);
      const qWrap = doc.splitTextToSize(qv.q.q||'', pageW-2*margin-26);
      doc.text(qWrap, margin+18, y+5);
      let qy = y + 5 + qWrap.length*4;

      // Options A/B
      setFont(8, 'normal', MUTED);
      const halfW = (pageW-2*margin-26)/2-2;
      const aWrap = doc.splitTextToSize('A: '+(qv.q.l||''), halfW);
      const bWrap = doc.splitTextToSize('B: '+(qv.q.r||''), halfW);
      doc.text(aWrap, margin+18, qy+3);
      doc.text(bWrap, margin+18+halfW+4, qy+3);
      qy += Math.max(aWrap.length, bWrap.length)*3 + 3;

      // SD bar
      const barX = margin+18, barW = pageW-2*margin-26-30;
      const fillW = sdMaxRef>0 ? barW*(sd/sdMaxRef) : 0;
      doc.setFillColor(...BORDER);
      doc.rect(barX, qy, barW, 2.5, 'F');
      const sdColor = sd>=2.5?RED:sd>=1.5?[245,158,11]:sd>=0.8?[132,204,22]:[34,197,94];
      doc.setFillColor(...sdColor);
      doc.rect(barX, qy, fillW, 2.5, 'F');
      setFont(8, 'bold', TEXT);
      doc.text('SD '+sd.toFixed(1), pageW-margin, qy+2.5, {align:'right'});

      y = qy + 7;
      if(i<top.length-1){
        doc.setDrawColor(...BORDER);
        doc.setLineWidth(0.1);
        doc.line(margin, y-2, pageW-margin, y-2);
        y += 1;
      }
    });
  }

  // ───── OUTLIERS ─────
  const outliers = [];
  if(N>=3){
    ['prog','def','con','flex'].forEach(dim=>{
      const vals = realRespondents.map(r=>r[dim]||0);
      const m = vals.reduce((s,v)=>s+v,0)/vals.length;
      const sd = Math.sqrt(localVariance(vals));
      if(sd<5) return;
      realRespondents.forEach(r=>{
        const v = r[dim]||0;
        if(Math.abs(v-m)>=1.5*sd && Math.abs(v-m)>=10){
          outliers.push({name:r.respondent_name, dim, value:v, mean:Math.round(m), gap:Math.round(v-m)});
        }
      });
    });
  }
  if(outliers.length>0){
    doc.addPage(); pageNum++; y=margin+5; addHeader();
    sectionTitle('Outliers and split views');
    paragraph('Individual scores that diverge most from the group mean — at least 1.5 SD and 10 points away. These are the people whose lens is different. Worth surfacing in the debrief.', {color:MUTED, size:9});
    y += 3;

    outliers.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
    const dimLabels = {prog:'Progressive',def:'Defensive',con:'Consistent',flex:'Flexible'};
    outliers.slice(0, 12).forEach((o,i)=>{
      checkPage(10);
      setFont(10, 'bold', TEXT);
      doc.text(labelOf(o.name), margin, y+4);
      setFont(8, 'normal', MUTED);
      doc.text(dimLabels[o.dim], margin+45, y+4);
      setFont(10, 'normal', TEXT);
      doc.text(String(o.value), margin+85, y+4);
      setFont(8, 'normal', MUTED);
      doc.text('vs group mean '+o.mean, margin+98, y+4);
      const gapColor = Math.abs(o.gap)>=20?RED:ACCENT;
      setFont(10, 'bold', gapColor);
      doc.text((o.gap>0?'+':'')+o.gap+' pts', pageW-margin, y+4, {align:'right'});
      y += 7;
      if(i<Math.min(11,outliers.length-1)){
        doc.setDrawColor(...BORDER);
        doc.setLineWidth(0.1);
        doc.line(margin, y, pageW-margin, y);
        y += 1;
      }
    });
  }

  // ───── PRINCIPLES ─────
  // principlesCluster shape: { clusters: [{theme, summary, items: [{text, author}]}] }
  const hasPrinciples = principlesCluster && principlesCluster.clusters && principlesCluster.clusters.length>0;
  // Check raw selected principles too — show those if no cluster
  const respondentsWithPrinciples = realRespondents.filter(r=>Array.isArray(r.selected_principles)&&r.selected_principles.length>0);

  if(hasPrinciples || respondentsWithPrinciples.length>0){
    doc.addPage(); pageNum++; y=margin+5; addHeader();
    sectionTitle('Selected principles');

    if(hasPrinciples){
      paragraph('AI-clustered themes from individual selections. Names in brackets show which respondents chose principles in each theme.', {color:MUTED, size:9});
      y += 3;
      principlesCluster.clusters.forEach(cl=>{
        checkPage(20);
        setFont(11, 'bold', TEXT);
        doc.text(cl.theme||'Untitled theme', margin, y+4);
        y += 7;
        if(cl.summary){
          setFont(9, 'italic', MUTED);
          const sw = doc.splitTextToSize(cl.summary, pageW-2*margin);
          checkPage(sw.length*4+2);
          doc.text(sw, margin, y+3);
          y += sw.length*4 + 2;
        }
        if(cl.items && cl.items.length){
          setFont(9, 'normal', TEXT);
          cl.items.forEach(it=>{
            const author = labelOf(it.author||'');
            const line = '• '+(it.text||'')+(author?' ('+author+')':'');
            const wrapped = doc.splitTextToSize(line, pageW-2*margin-4);
            checkPage(wrapped.length*4+1);
            doc.text(wrapped, margin+2, y+3);
            y += wrapped.length*4 + 1;
          });
        }
        y += 4;
      });
    } else {
      paragraph('Individual respondents selected these as the principles most worth committing to. Cluster the themes manually.', {color:MUTED, size:9});
      y += 3;
      respondentsWithPrinciples.forEach(r=>{
        checkPage(15);
        setFont(10, 'bold', TEXT);
        doc.text(labelOf(r.respondent_name), margin, y+4);
        y += 6;
        setFont(9, 'normal', TEXT);
        (r.selected_principles||[]).forEach(p=>{
          const wrapped = doc.splitTextToSize('• '+p, pageW-2*margin-6);
          checkPage(wrapped.length*4+1);
          doc.text(wrapped, margin+4, y+3);
          y += wrapped.length*4 + 1;
        });
        y += 3;
      });
    }
  }

  // ───── DISCUSSION QUESTIONS ─────
  let questionsList = [];
  if(aiQuestions && Array.isArray(aiQuestions) && aiQuestions.length>0){
    questionsList = aiQuestions;
  } else if(aiQuestions && aiQuestions.questions && Array.isArray(aiQuestions.questions)){
    questionsList = aiQuestions.questions;
  } else {
    const fallback = {
      'Adaptive Innovation':[
        'Where is the gap between our ambition and our ability to deliver?',
        'What are we most likely to miss while pursuing growth?',
        'What would slow us down right now — and is that a feature or a bug?'
      ],
      'Mindful Action':[
        'What signal would tell us we have to shift gear, and would we see it?',
        'Where is our flexibility costing us reliability?',
        'Which capabilities have we kept developing, and which have decayed?'
      ],
      'Performance Optimisation':[
        'What are we protecting that no longer needs protection?',
        'Where would a small experiment be lower-risk than continued caution?',
        'What does the next generation of capability look like for us?'
      ],
      'Preventative Control':[
        'What threats are we organised around that have changed shape?',
        'Where is our defensiveness limiting our ability to learn?',
        'What would change if we treated this as a strategy problem, not a risk problem?'
      ],
    };

        try{

          if(j&&j.session_closed){setSessionClosed(true);}

      }
      if(_r&&_r.ok){

      if(!resp.ok)return;
      const data=await resp.json();
      if(Array.isArray(data)){
        setGroupRespondents(data);
        setLastRefreshed(new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
        // Detect session-closed marker
        const closedEntry=data.find(d=>d.respondent_name==='__session_closed__');
        if(closedEntry){
          setSessionClosed(true);
          setSessionClosedAt(closedEntry.notes||closedEntry.created_at||null);
        }else{
          setSessionClosed(false);
          setSessionClosedAt(null);
        }
        // Load facilitator notes if admin
        if(isAdmin){
          const notesEntry=data.find(d=>d.respondent_name==='__facilitator__');
          if(notesEntry&&notesEntry.notes)setFacilitatorNotes(notesEntry.notes);
        }
      }
    }catch(e){console.warn('stat-load error:',e);}
  }

        headers:{'Content-Type':'application/json'},

  async function loadPrinciples(){
    setPrinciplesLoading(true);
    setPrinciples(null);

    // (from a prior visit, restored from Supabase, or kept across navigation).
    try{
      const resp=await fetch('/api/stat-principles-generate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          s1_answers:s1ans,
          s2_answers:s2ans,

          tobe_prog:tobe.p,tobe_def:tobe.d,tobe_con:tobe.c,tobe_flex:tobe.f,

  function togglePrinciple(p){
    setSelectedPrinciples(prev=>{
      if(prev.includes(p))return prev.filter(x=>x!==p);
      return [p,...prev];
    });
  }

  function addCustomPrinciple(){
    const p=customPrinciple.trim();
    if(!p)return;
    if(selectedPrinciples.includes(p))return;
    setSelectedPrinciples([p,...selectedPrinciples]);
    setCustomPrinciple('');
  }

  function movePrinciple(p,direction){
    setSelectedPrinciples(prev=>{
      const idx=prev.indexOf(p);
      if(idx<0)return prev;
      const newIdx=idx+direction;
      if(newIdx<0||newIdx>=prev.length)return prev;
      const next=[...prev];
      [next[idx],next[newIdx]]=[next[newIdx],next[idx]];
      return next;
    });
  }

  function goToPrinciples(){
    setPrinciplesStep(true);
    loadPrinciples();
    setStep(5); // stay on step 5, sub-screen flag handles the rest

  // Persist selectedPrinciples and qualitative inputs to Supabase whenever they change.
  // Only fires once user has reached the report step and a session exists.
  // Debounced 600ms so rapid toggling/typing doesn't spam the API.
  useEffect(()=>{
    if(!codeNorm)return;
    if(!respondentName.trim())return;
    if(step<5)return;
    const t=setTimeout(()=>{saveToGroup();},600);
    return()=>clearTimeout(t);
  },[selectedPrinciples,thirtyDay,feedbackComment,thingDesc,contextText,step,codeNorm,respondentName]);

  // Restore selectedPrinciples from Supabase when a returning participant resumes.
  // If a row already exists for this respondent with selected_principles, and
  // local state is still empty, hydrate it. One-shot — won't override later edits.
  const principlesHydrated=useRef(false);
  useEffect(()=>{
    if(principlesHydrated.current)return;
    if(!respondentName.trim()||!groupRespondents||groupRespondents.length===0)return;
    if(selectedPrinciples.length>0)return;
    const myRow=groupRespondents.find(r=>r.respondent_name===respondentName.trim());
    if(myRow&&Array.isArray(myRow.selected_principles)&&myRow.selected_principles.length>0){
      setSelectedPrinciples(myRow.selected_principles);

    }

  // Close facilitator dashboard overlay on Esc; lock body scroll while open;
  // intercept browser back button on mobile so it closes the overlay instead of leaving the page
  useEffect(()=>{
    if(!facOverlayOpen)return;
    document.body.classList.add('dash-open');
    // Push a history entry so the next back press lands here (and we close the overlay)
    let ownsHistoryEntry=false;
    try{
      window.history.pushState({statOverlay:true},'');
      ownsHistoryEntry=true;
    }catch(e){}
    const onKey=(e)=>{if(e.key==='Escape'){setFacInfoOpen(false);setFacOverlayOpen(false);}};
    const onPop=()=>{setFacInfoOpen(false);setFacOverlayOpen(false);};
    document.addEventListener('keydown',onKey);
    window.addEventListener('popstate',onPop);
    return()=>{
      document.body.classList.remove('dash-open');
      document.removeEventListener('keydown',onKey);
      window.removeEventListener('popstate',onPop);
      // If the overlay was closed by something other than a back press
      // (Esc, button click), step back through the entry we added so the
      // history stack stays consistent.
      if(ownsHistoryEntry&&window.history.state&&window.history.state.statOverlay){
        try{window.history.back();}catch(e){}
      }
    };
  },[facOverlayOpen]);

      setOrgNameOverride(saved);
    }catch(e){}
  },[codeNorm]);

  function exportCSV(){
    const rows=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__'&&((r.s1_answers&&r.s1_answers.length>0)||(r.s2_answers&&r.s2_answers.length>0)||r.prog||r.tobe_prog));
    const headers=['Name','Role','Sector','Progressive','Defensive','Consistent','Flexible','Strategy','Tobe_P','Tobe_D','Tobe_C','Tobe_F','Date'];
    const lines=[headers.join(','),...rows.map(r=>[
      `"${r.respondent_name||''}"`,`"${r.role||''}"`,`"${r.sector||''}"`,
      r.prog||0,r.def||0,r.con||0,r.flex||0,`"${r.strategy_type||''}"`,
      r.tobe_p||0,r.tobe_d||0,r.tobe_c||0,r.tobe_f||0,`"${(r.date||'').slice(0,10)}"`
    ].join(','))];
    const blob=new Blob([lines.join('\n')],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`STAT_${codeNorm}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

      await fetch('/api/stat-save',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          session_code:codeNorm,
          respondent_name:name,
          pending_review:false,
        }),
      });
      await loadGroup();
    }catch(e){console.warn('accept pending error:',e);}

  function generate(){
    // Save to group if session code present.
    // Pass true to mark this as the explicit "Generate My Report" submission —
    // stat-save.js uses this to decide whether to fire the rich notification email.
    if(codeNorm){
      saveToGroup(true);
    }
    // Save previous scores for comparison
    try{
      const prev=loadProgress(respondentName);
      if(prev&&prev.step>=5){
        const pd=prev.s1ans?prev.s1ans.reduce((s,a)=>s+(parseInt(a.l)||0),0):0;
        const pp=prev.s1ans?prev.s1ans.reduce((s,a)=>s+(parseInt(a.r)||0),0):0;
        const pc=prev.s2ans?prev.s2ans.reduce((s,a)=>s+(parseInt(a.l)||0),0):0;
        const pf=prev.s2ans?prev.s2ans.reduce((s,a)=>s+(parseInt(a.r)||0),0):0;
        if(pp||pd)setPrevSubmission({prog:pp,def:pd,con:pc,flex:pf,date:prev.savedAt?new Date(prev.savedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'previously'});
      }
    }catch(e){}
    setLoading(true);
    setTimeout(()=>{setLoading(false);go(6);},1600);

    setConfigSector('');setConfigSectorCustom('');setConfigSaving(false);setConfigError('');
    setRespondentName('');setResumeData(null);setThing('');setThingDesc('');setContextText('');
    setRole('');setRoleCustom('');setSector('');

    setS2(Array(12).fill(null).map(()=>({l:'',r:''})));

    setTobe({p:60,d:60,c:60,f:60});setTobeInit(false);
    setRptTab(0);setPrevSubmission(null);

  function applyResume(data){
    if(data.thing)setThing(data.thing);
    if(data.thingDesc)setThingDesc(data.thingDesc);
    if(data.contextText)setContextText(data.contextText);
    if(data.s1ans)setS1(data.s1ans);
    if(data.s2ans)setS2(data.s2ans);
    if(data.tobe)setTobe(data.tobe);
    if(data.tobeInit)setTobeInit(data.tobeInit);
    if(typeof data.participantUuid==='string'&&data.participantUuid)setParticipantUuid(data.participantUuid);
    if(typeof data.participantNumber==='number'&&data.participantNumber>0)setParticipantNumber(data.participantNumber);
    if(typeof data.participantId==='string'&&data.participantId)setParticipantId(data.participantId);
    if(typeof data.accessCode==='string'&&data.accessCode)setAccessCode(data.accessCode);
    if(typeof data.role==='string'&&data.role)setRole(data.role);
    if(typeof data.roleCustom==='string'&&data.roleCustom)setRoleCustom(data.roleCustom);
    setResumeData(null);
    go(data.step||1);
  }

  // ── ACCESS CODE GATE (Phase 1) ──────────────────────────────────────────
  // The gate sits in front of everything. validate-code returns:
  //   { valid: true, code, ..., session_config: <row|null> }
  // session_config is what tells Group whether to admit participants
  // (config exists ⇒ facilitator has set up; null ⇒ "not open yet").
  async function checkAccessCode(){
    const code=accessCodeInput.trim();
    if(!code){setAccessCodeError('Please enter a code.');return;}
    setAccessCodeChecking(true);
    setAccessCodeError('');
    try{
      const resp=await fetch('/api/validate-code',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code,tool:'stat-group'}),
      });
      const data=await resp.json().catch(()=>({}));
      if(resp.ok&&data&&data.valid){
        setAccessCode(code.toUpperCase());
        setSessionConfig(data.session_config||null);
        setAccessCodeError('');
        setStep(0);
      }else{
        const reason=(data&&data.reason)||'';
        const msg={
          not_found:'That code wasn’t recognised. Check the code and try again.',
          expired:'That code has expired.',
          used_up:'That code has reached its usage limit.',
          no_membership:'That code isn’t valid for this tool.',
          upstream_error:'We couldn’t check the code right now. Please try again in a moment.',
        }[reason]||'That code wasn’t recognised. Check the code and try again.';
        setAccessCodeError(msg);
      }
    }catch(e){
      setAccessCodeError('We couldn’t check the code right now. Please try again in a moment.');
    }
    setAccessCodeChecking(false);
  }

  function renderGate(){
    return(
      <div style={{maxWidth:'420px',margin:'4rem auto 0',padding:'0 1rem'}}>
        <label className="field-lbl">Enter your access code</label>
        <input
          className="inp"
          value={accessCodeInput}
          onChange={e=>{setAccessCodeInput(e.target.value);if(accessCodeError)setAccessCodeError('');}}
          onKeyDown={e=>{if(e.key==='Enter'&&!accessCodeChecking)checkAccessCode();}}
          autoFocus
          autoCapitalize="characters"
          autoComplete="off"
          spellCheck={false}
          style={{textTransform:'uppercase',letterSpacing:'.05em'}}
        />
        {accessCodeError&&(
          <div style={{marginTop:'.65rem',fontSize:'.82rem',color:'#c0392b',fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}>
            {accessCodeError}
          </div>
        )}
        <div className="btn-row" style={{marginTop:'1.25rem'}}>
          <button
            className="btn-p"
            disabled={!accessCodeInput.trim()||accessCodeChecking}
            onClick={checkAccessCode}>
            {accessCodeChecking?'Checking…':'Continue →'}
          </button>
        </div>
      </div>
    );
  }

  // ── BEGIN: ASSIGN PARTICIPANT (Phase 3) ────────────────────────────────
  // Called when participant clicks Begin on entry screen.
  async function beginNewParticipant(){
    if(!entryFieldsComplete())return;
    setBeginning(true);
    setBeginError('');
    try{
      const resp=await fetch('/api/assign-participant',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sessionCode:accessCode}),
      });
      const data=await resp.json().catch(()=>({}));
      if(resp.ok&&data&&data.id){
        setParticipantUuid(data.id);
        setParticipantNumber(data.participantNumber||0);
        setParticipantId(data.participantId||'');
        // Pull thing/sector from session_config so the survey renders correctly.
        if(sessionConfig){
          if(sessionConfig.thing)setThing(sessionConfig.thing);
          if(sessionConfig.sector)setSector(sessionConfig.sector);
        }
        setBeginning(false);
        // Step 1 (Context) is dead in the new flow — go straight to survey.
        go(2);
      }else{
        setBeginError('We couldn’t start your session. Please try again in a moment.');
        setBeginning(false);
      }
    }catch(e){
      setBeginError('We couldn’t start your session. Please try again in a moment.');
      setBeginning(false);
    }
  }

  //   (b) Config missing → "Survey not open yet" + Facilitator ★ only

  // ── STEP 2: SURVEY 1 ─────────────────────────────────────────────────────

  function renderProfile(){

      <div>
        <BackBtn onClick={()=>go(3)}/>

        <h2 className="pg-title">How <em style={{fontStyle:'normal',color:'#e07030'}}>{th}</em> operates today</h2>

          {[{lbl:'Progressive',val:prog,dim:'Mindset'},{lbl:'Defensive',val:def,dim:'Mindset'},{lbl:'Flexible',val:flex,dim:'Approach'},{lbl:'Consistent',val:con,dim:'Approach'}].map(sc=>(

  // Note: renderProfile and renderTobe both live at step 4; renderProfile shows first,

  // Simpler: use step 4 for to-be sliders. Profile is step 3 (was step 4 above — fixed below).

  function renderPrinciples(){
    const count=selectedPrinciples.length;
    return(
      <div className="fade">
        <div className="sec-tag">Step 6 of 7 · Principles</div>
        <h2 className="pg-title">Choose your principles</h2>
        <p className="pg-sub">Below are 8 principles drawn from your responses. <strong>Click the ones that resonate, in order of importance to you</strong> — your most important first. Each click adds the principle to the top of your list. Use the arrows to reorder, or × to remove. There is no minimum or maximum.</p>

        {selectedPrinciples.length>0&&(
          <div style={{margin:'0 0 1.5rem',padding:'1rem 1.25rem',background:'#1a1a1a',borderRadius:'4px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'.6rem'}}>
              <div style={{fontSize:'.6rem',fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',color:'#e07030',fontFamily:"'DM Sans',sans-serif"}}>Your selected principles — ranked by importance</div>
              <div style={{fontSize:'.65rem',color:'#888',fontFamily:"'DM Sans',sans-serif"}}>{selectedPrinciples.length} selected</div>
            </div>
            {selectedPrinciples.map((p,i)=>{
              const isFirst=i===0;
              const isLast=i===selectedPrinciples.length-1;
              return(
                <div key={i} style={{display:'flex',alignItems:'flex-start',gap:'.5rem',padding:'.55rem 0',borderBottom:i<selectedPrinciples.length-1?'1px solid #333':'none'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:'2px',flexShrink:0,marginTop:'1px'}}>
                    <button onClick={()=>movePrinciple(p,-1)} disabled={isFirst}
                      style={{background:'none',border:'1px solid '+(isFirst?'#444':'#666'),color:isFirst?'#444':'#aaa',cursor:isFirst?'not-allowed':'pointer',width:'22px',height:'18px',padding:0,borderRadius:'3px',fontSize:'.7rem',lineHeight:1,fontFamily:'sans-serif'}}>↑</button>
                    <button onClick={()=>movePrinciple(p,1)} disabled={isLast}
                      style={{background:'none',border:'1px solid '+(isLast?'#444':'#666'),color:isLast?'#444':'#aaa',cursor:isLast?'not-allowed':'pointer',width:'22px',height:'18px',padding:0,borderRadius:'3px',fontSize:'.7rem',lineHeight:1,fontFamily:'sans-serif'}}>↓</button>
                  </div>
                  <div style={{fontSize:'.78rem',color:'#e07030',fontWeight:700,flexShrink:0,minWidth:'18px',marginTop:'2px',fontFamily:"'DM Sans',sans-serif"}}>{i+1}.</div>
                  <div style={{fontSize:'.88rem',color:'#f0ede8',flex:1,lineHeight:1.6}}>{p}</div>
                  <button onClick={()=>setSelectedPrinciples(selectedPrinciples.filter(x=>x!==p))}
                    style={{background:'none',border:'none',color:'#888',cursor:'pointer',fontSize:'1rem',padding:'0 .25rem',fontFamily:'sans-serif',marginTop:'1px'}} title="Remove">×</button>
                </div>
              );
            })}
          </div>
        )}

        {selectedPrinciples.length===0&&!principlesLoading&&principles&&principles.length>0&&(
          <div style={{margin:'0 0 1.5rem',padding:'.85rem 1.1rem',background:'#ebe7e0',border:'1px dashed #b0a898',borderRadius:'4px',fontSize:'.82rem',color:'#666',fontStyle:'italic',textAlign:'center',fontFamily:"'DM Sans',sans-serif"}}>
            Click a principle below to add it. Your most important first.
          </div>
        )}

        {principlesLoading&&(
          <div className="think"><div className="dots"><div className="dot"/><div className="dot"/><div className="dot"/></div><span className="think-txt">Generating principles from your answers…</span></div>
        )}

        {!principlesLoading&&principles&&principles.length===0&&(
          <div className="warn-box">We weren't able to generate principles right now. You can write your own below, or skip this step and continue to your report.</div>
        )}

        {!principlesLoading&&principles&&principles.length>0&&(
          <div>
            {principles.map((p,i)=>{
              const isSelected=selectedPrinciples.includes(p);
              const rank=isSelected?selectedPrinciples.indexOf(p)+1:null;
              return(
                <div key={i}
                  onClick={()=>togglePrinciple(p)}
                  style={{
                    border:isSelected?'2px solid #e07030':'1px solid #d8d3cb',
                    background:isSelected?'#fff8f5':'#fff',
                    borderRadius:'4px',padding:'.85rem 1rem',marginBottom:'.5rem',
                    cursor:'pointer',
                    display:'flex',gap:'.65rem',alignItems:'flex-start',transition:'all .15s'
                  }}>
                  <div style={{
                    width:'22px',height:'22px',borderRadius:isSelected?'50%':'3px',
                    border:'2px solid '+(isSelected?'#e07030':'#b0a898'),
                    background:isSelected?'#e07030':'#fff',flexShrink:0,marginTop:'1px',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:'.78rem',fontWeight:700,color:isSelected?'#fff':'#b0a898',lineHeight:1
                  }}>{isSelected?rank:''}</div>
                  <div style={{fontSize:'.88rem',lineHeight:1.6,color:'#1a1a1a',flex:1}}>{p}</div>
                </div>
              );
            })}
          </div>
        )}

        {!principlesLoading&&(
          <div style={{marginTop:'1.5rem',paddingTop:'1.25rem',borderTop:'1px solid #d8d3cb'}}>
            <div className="field-lbl">Write your own principle</div>
            <div className="field-sub">Use a verb stem like "Make space for…", "Be willing to…", "Stop treating…", "Recognise that…"</div>
            <div style={{display:'flex',gap:'.5rem',alignItems:'flex-start'}}>
              <textarea className="inp inp-ta" style={{flex:1,minHeight:'70px'}}
                placeholder="e.g. Be willing to slow down decisions when consequences are big."
                value={customPrinciple}
                onChange={e=>setCustomPrinciple(e.target.value)}/>
              <button className="btn-s" onClick={addCustomPrinciple}
                disabled={!customPrinciple.trim()}
                style={{whiteSpace:'nowrap'}}>+ Add</button>
            </div>
          </div>
        )}

        <div className="btn-row">
          {principlesLoading?(
            <div style={{display:'inline-flex',alignItems:'center',gap:'.5rem',padding:'.65rem 1rem',background:'#ebe7e0',border:'1px solid #d8d3cb',borderRadius:'3px',color:'#888',fontSize:'.82rem',fontFamily:"'DM Sans',sans-serif",fontStyle:'italic'}}>
              <div className="dots" style={{display:'inline-flex',gap:'4px'}}><div className="dot"/><div className="dot"/><div className="dot"/></div>
              Waiting for principles to load…
            </div>
          ):loading?(
            <div className="think"><div className="dots"><div className="dot"/><div className="dot"/><div className="dot"/></div><span className="think-txt">Generating your personalised report…</span></div>
          ):(
            <>
              <button className="btn-p" onClick={generate}>Generate My Report →</button>
              <button className="btn-s" onClick={loadPrinciples}>↻ Regenerate</button>
            </>
          )}
          <button className="btn-s" onClick={()=>setPrinciplesStep(false)}>← Back to Future</button>
        </div>
      </div>
    );
  }

    const quadrants = [
      {x:PAD, y:PAD, w:QW/2, h:QH/2, label:'Performance\nOptimisation', sub:'Improving and exploiting', key:'performance_optimisation'},
      {x:PAD+QW/2, y:PAD, w:QW/2, h:QH/2, label:'Adaptive\nInnovation', sub:'Imagining and creating', key:'adaptive_innovation'},
      {x:PAD, y:PAD+QH/2, w:QW/2, h:QH/2, label:'Preventative\nControl', sub:'Monitoring and complying', key:'preventative_control'},

    // Diamond paths
    const aiPts = [[CX,CY-prog*scaleY],[CX+flex*scaleX,CY],[CX,CY+def*scaleY],[CX-con*scaleX,CY]];

    const tbPts = [[CX,CY-tobe.p*scaleY],[CX+tobe.f*scaleX,CY],[CX,CY+tobe.d*scaleY],[CX-tobe.c*scaleX,CY]];
    const tbPath = tbPts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+'Z';

    // Shared SVG base: axes, labels, quadrant boxes
    function renderBase(showDominant){

        <g>

                {active&&<rect x={qd.x+2} y={qd.y+2} width={qd.w-4} height={qd.h-4}

          <line x1={PAD-32} y1={CY} x2={PAD+QW+32} y2={CY} stroke="#1a1a1a" strokeWidth={1.5} strokeDasharray="4,3"/>
          {/* Arrowheads */}
          <polygon points={`${CX-5},${PAD-22} ${CX+5},${PAD-22} ${CX},${PAD-32}`} fill="#1a1a1a"/>
          <polygon points={`${CX-5},${PAD+QH+22} ${CX+5},${PAD+QH+22} ${CX},${PAD+QH+32}`} fill="#1a1a1a"/>
          <polygon points={`${PAD-22},${CY-5} ${PAD-22},${CY+5} ${PAD-32},${CY}`} fill="#1a1a1a"/>
          <polygon points={`${PAD+QW+22},${CY-5} ${PAD+QW+22},${CY+5} ${PAD+QW+32},${CY}`} fill="#1a1a1a"/>
          {/* PROGRESSIVE top — fixed positions well above arrow (arrow at PAD-32) */}

          <text x={CX} y={24} textAnchor="middle" fill="#555" fontSize={10} fontFamily="DM Sans,sans-serif">(Achieving results)</text>
          {['Leveraging opportunities','Building capability','Achieving results','Growing position'].map((l,i)=>(
            <text key={i} x={CX} y={38+(i*12)} textAnchor="middle" fill="#999" fontSize={9} fontFamily="DM Sans,sans-serif">{l}</text>

    return(
      <div>
        <div className="rpt-section">
          <div className="rpt-heading">Managing Strategic Tensions</div>
          <p className="rpt-body">Organisational resilience strategies differ on two core dimensions. The first is <strong>mindset</strong> — whether the organisation is primarily oriented toward defending what it has (Defensive) or toward achieving new results (Progressive). The second is <strong>approach</strong> — whether the organisation operates through common goals, standard processes, unified behaviours and shared values (Consistent) or through distributed goals, adaptive processes, independent judgement and diverse values (Flexible).</p>
          <p className="rpt-body">These two dimensions combine to produce four core resilience strategies. The right-hand diagram shows your profile plotted on the model.</p>
        </div>

        {/* Model diagram — full width, no profiles */}
        <div style={{background:'#fff',border:'1px solid #d8d3cb',borderRadius:'6px',padding:'1rem',textAlign:'center',margin:'1.5rem 0'}}>
          <div style={{fontSize:'.65rem',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#888',marginBottom:'.5rem',fontFamily:"'DM Sans',sans-serif"}}>The Model</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible',maxWidth:'100%'}}>
            {renderBase(false)}
          </svg>
        </div>

        <div className="rpt-section">
          <div className="rpt-heading">The Five Strategies</div>
          <p className="rpt-body">Every organisation has a unique STAT profile that is usually made up of some combination of all four core strategies. A fifth strategy — Neutral — describes organisations with a very balanced combination of all four. One size does not fit all: the overall approach will vary according to the nature of the organisation, its mission, and the environment it faces. It is also likely to change over time as the organisation itself evolves.</p>

          {[
            {name:'Performance Optimisation',tag:'Progressive · Consistent',body:'Resilience formed by process optimisation, continually improving and extending existing competencies, and exploiting current technologies to serve present customers more efficiently and effectively.'},
            {name:'Adaptive Innovation',tag:'Progressive · Flexible',body:'Resilience created through innovation and new products, services or capabilities. Also the strategy required to resolve complex, intractable problems that require fundamental rethinking of how the organisation works.'},
            {name:'Preventative Control',tag:'Defensive · Consistent',body:'Resilience achieved through robust risk management, physical barriers, safeguards and standards. The organisation protects itself from threats, predicts and prevents disruptions, and designs prearranged continuity plans to restore stability if disruption occurs.'},
            {name:'Mindful Action',tag:'Defensive · Flexible',body:'Resilience created by people who use their experience, expertise and teamwork to anticipate and adapt to threats and respond effectively to unfamiliar situations through creative problem solving and improvisation.'},
          ].map(s=>(
            <div key={s.name} style={{background:'#fff',border:'1px solid #d8d3cb',borderTop:'3px solid #1a1a1a',borderRadius:'4px',padding:'1rem 1.1rem'}}>
              <div style={{fontSize:'.63rem',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#e07030',marginBottom:'.35rem',fontFamily:"'DM Sans',sans-serif"}}>{s.tag}</div>
              <div style={{fontSize:'.88rem',fontWeight:700,color:'#1a1a1a',marginBottom:'.4rem',fontFamily:"'DM Sans',sans-serif"}}>{s.name}</div>
              <p className="rpt-body" style={{marginBottom:0}}>{s.body}</p>
            </div>
          ))}
        </div>

        <div style={{background:'#fff',border:'1px solid #d8d3cb',borderTop:'3px solid #888',borderRadius:'4px',padding:'1rem 1.1rem',marginBottom:'1.5rem'}}>
          <div style={{fontSize:'.63rem',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#888',marginBottom:'.35rem',fontFamily:"'DM Sans',sans-serif"}}>All four strategies equally</div>
          <div style={{fontSize:'.88rem',fontWeight:700,color:'#1a1a1a',marginBottom:'.4rem',fontFamily:"'DM Sans',sans-serif"}}>Neutral</div>
          <p className="rpt-body" style={{marginBottom:0}}>A neutral profile has almost uniform emphasis on all four core strategies. It is often unintended and rarely achieved by design. Organisations with a neutral profile may lack a clearly defined resilience strategy — trying to be all things to all people. The risk is ending up stuck in the middle, delivering average performance across all four rather than genuine strength in any.</p>
        </div>

        {/* Your profile diagram — full width, with diamonds */}
        <div style={{background:'#fff',border:'1px solid #d8d3cb',borderRadius:'6px',padding:'1rem',textAlign:'center',margin:'1.5rem 0'}}>
          <div style={{fontSize:'.65rem',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#888',marginBottom:'.5rem',fontFamily:"'DM Sans',sans-serif"}}>Your Profile</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible',maxWidth:'100%'}}>
            {renderBase(true)}
            <path d={tbPath} fill="none" stroke="#fff" strokeWidth={2.5} strokeDasharray="5,3" strokeLinejoin="round" opacity={0.9}/>

            <text x={CX} y={CY-prog*scaleY-8} textAnchor="middle" fill="#e07030" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">{prog}</text>
            <text x={CX+flex*scaleX+9} y={CY+4} textAnchor="start" fill="#e07030" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">{flex}</text>

          </svg>
          <div style={{display:'flex',gap:'1rem',justifyContent:'center',marginTop:'.5rem',flexWrap:'wrap'}}>
            <div style={{display:'flex',alignItems:'center',gap:'.35rem',fontSize:'.72rem',color:'#555'}}>
              <svg width={22} height={14} viewBox="0 0 22 14"><polygon points="11,1 21,7 11,13 1,7" fill="#e07030" fillOpacity={0.25} stroke="#e07030" strokeWidth={2}/></svg>

            </div>
            <div style={{display:'flex',alignItems:'center',gap:'.35rem',fontSize:'.72rem',color:'#555'}}>
              <svg width={22} height={14} viewBox="0 0 22 14"><polygon points="11,1 21,7 11,13 1,7" fill="none" stroke="#888" strokeWidth={2} strokeDasharray="3,2"/></svg>

            </div>
          </div>
        </div>

        <div className="rpt-section" style={{background:'#ebe7e0',border:'1px solid #d8d3cb',borderRadius:'4px',padding:'1rem 1.1rem'}}>
          <div className="rpt-heading">The Core Tension</div>
          <p className="rpt-body" style={{marginBottom:0}}>To achieve organisational resilience, leaders have to manage the tensions between the need to be both <strong>defensive and progressive</strong>, and also <strong>consistent and flexible</strong>. These are not either/or choices — the goal is to understand which combination best fits {th}'s context, and to make that a deliberate strategic decision rather than an accidental default.</p>
        </div>

        <div className="rpt-section" style={{borderTop:'1px solid #d8d3cb',paddingTop:'1.5rem',marginTop:'1.5rem'}}>
          <div className="rpt-heading" style={{fontSize:'1rem',marginBottom:'.5rem'}}>About the Model</div>
          <div style={{fontSize:'.85rem',fontWeight:700,color:'#1a1a1a',marginBottom:'.5rem',fontFamily:"'DM Sans',sans-serif"}}>The Strategic Tensions Assessment Tool</div>
          <p className="rpt-body">STAT is built on the Four Strategies framework, which emerged from a multi-year research programme on organisational resilience led by Professor David Denyer at Cranfield School of Management. The framework was first published in 2017 in collaboration with BSI, drawing on a systematic review of academic evidence and extensive practitioner research with high-reliability organisations.</p>
          <p className="rpt-body" style={{marginTop:'.6rem'}}>The model holds that organisational resilience is not a single capability but a strategic balance across four distinct orientations: Preventative Control (defensive consistency), Mindful Action (defensive flexibility), Performance Optimisation (progressive consistency), and Adaptive Innovation (progressive flexibility). Most organisations gravitate toward one or two of these and develop blind spots in the others. The strategic challenge is not to choose between them but to know which combination is right for the conditions you face — and to deliberately build the capability you are short of.</p>
          <p className="rpt-body" style={{marginTop:'.6rem'}}>STAT measures where your organisation currently sits across these four orientations and where you want it to be. The gap between current and desired is the strategic conversation worth having.</p>

          <div style={{marginTop:'1.25rem',paddingTop:'1rem'}}>
            <div style={{width:'30px',height:'2px',background:'#e07030',marginBottom:'.6rem'}}/>
            <div style={{fontSize:'.7rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#888',marginBottom:'.4rem',fontFamily:"'DM Sans',sans-serif"}}>To cite this model</div>
            <p className="rpt-body" style={{margin:0}}>Denyer, D. (2017). Organizational Resilience: A summary of academic evidence, business insights and new thinking. BSI and Cranfield School of Management.</p>
          </div>

          <div style={{marginTop:'1.5rem'}}>
            <div className="rpt-heading" style={{fontSize:'.95rem',marginBottom:'.75rem'}}>Further reading</div>
            {[
              {label:'Executive summary',url:'https://changebefore.com/wp-content/uploads/2026/05/Organizational-Resilience-Executive-Summary-David-Denyer.pdf'},
              {label:'Full report',url:'https://changebefore.com/wp-content/uploads/2026/05/Organizational-Resilience-Full-Report-David-Denyer.pdf'},
              {label:'Resilience Reimagined: A practical guide for organisations',url:'https://changebefore.com/wp-content/uploads/2026/05/Resilience-Reimagined-A-practical-guide-for-organisations.pdf'},
            ].map((L,i)=>(
              <div key={i} style={{marginBottom:'.85rem'}}>
                <a href={L.url} target="_blank" rel="noopener noreferrer"
                  style={{fontSize:'.88rem',fontWeight:700,color:'#e07030',textDecoration:'none',fontFamily:"'DM Sans',sans-serif",display:'block',marginBottom:'.15rem'}}>
                  {L.label} →
                </a>
                <div style={{fontSize:'.7rem',color:'#999',wordBreak:'break-all',fontFamily:"'DM Sans',sans-serif",lineHeight:1.4}}>{L.url}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="btn-row">
          <button className="btn-p" onClick={()=>setRptTab(2)}>Read Detailed Analysis →</button>
          <button className="btn-s" onClick={()=>setRptTab(0)}>← Profile</button>
        </div>
      </div>
    );
  }

  function renderTab0(pGap,dGap,cGap,fGap){

  function renderFacilitatorTab(){
    const PAX_COLORS=['#e07030', '#1a4fa0', '#2d7d46', '#b87a20', '#b83232', '#6a3d9a', '#0891b2', '#78350f', '#374151'];
    const realRespondents=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__'&&r.respondent_name!=='__session_closed__'&&!r.pending_review&&((r.s1_answers&&r.s1_answers.length>0)||(r.s2_answers&&r.s2_answers.length>0)||r.prog||r.tobe_prog));
    const pendingReviewers=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__'&&r.respondent_name!=='__session_closed__'&&r.pending_review===true);
    const completedRespondents=realRespondents.filter(r=>!!(r.prog));

    // Compute analytics
    // Per-dimension variance
    function variance(arr){if(arr.length<2)return 0;const m=arr.reduce((s,v)=>s+v,0)/arr.length;return arr.reduce((s,v)=>s+(v-m)**2,0)/arr.length;}
    const dimVariance={
      prog:variance(realRespondents.map(r=>r.prog||0)),
      def:variance(realRespondents.map(r=>r.def||0)),
      con:variance(realRespondents.map(r=>r.con||0)),
      flex:variance(realRespondents.map(r=>r.flex||0)),
    };
    const maxVar=Math.max(...Object.values(dimVariance));
    // SD threshold for "split": ≥ 10 on either axis means significant spread.
    // Each pair (prog/def, con/flex) must have at least one component over threshold.
    const groupIsSplit=realRespondents.length>=3&&(
      Math.sqrt(dimVariance.prog)>=10 || Math.sqrt(dimVariance.def)>=10 ||
      Math.sqrt(dimVariance.con)>=10 || Math.sqrt(dimVariance.flex)>=10
    );
    const splitTag=groupIsSplit?' [group is split]':'';

    // Group mean
    const gMean={prog:0,def:0,con:0,flex:0};
    realRespondents.forEach(r=>{gMean.prog+=(r.prog||0);gMean.def+=(r.def||0);gMean.con+=(r.con||0);gMean.flex+=(r.flex||0);});
    if(realRespondents.length>0){
      ['prog','def','con','flex'].forEach(k=>{gMean[k]=Math.round(gMean[k]/realRespondents.length);});
    }
    const groupStrat=getStrategy(gMean.def,gMean.prog,gMean.con,gMean.flex);

    // Group to-be mean
    const gTobeMean={p:0,d:0,c:0,f:0};
    const withTobe=realRespondents.filter(r=>r.tobe_p);
    if(withTobe.length>0){
      withTobe.forEach(r=>{gTobeMean.p+=(r.tobe_p||60);gTobeMean.d+=(r.tobe_d||60);gTobeMean.c+=(r.tobe_c||60);gTobeMean.f+=(r.tobe_f||60);});
      ['p','d','c','f'].forEach(k=>{gTobeMean[k]=Math.round(gTobeMean[k]/withTobe.length);});
    }
    const groupTobeStrat=withTobe.length>0?getStrategy(gTobeMean.d,gTobeMean.p,gTobeMean.c,gTobeMean.f):null;

    // Most significant gap
    const dimShifts=[
      {lbl:'Progressive',gap:gTobeMean.p-gMean.prog,dim:'prog'},
      {lbl:'Defensive',gap:gTobeMean.d-gMean.def,dim:'def'},
      {lbl:'Consistent',gap:gTobeMean.c-gMean.con,dim:'con'},
      {lbl:'Flexible',gap:gTobeMean.f-gMean.flex,dim:'flex'},
    ].sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
    const bigGap=dimShifts[0];

    // Question variance (s1 and s2)
    const allQ12=[...S1.categories.flatMap(c=>c.qs),...S2.categories.flatMap(c=>c.qs)];
    const qVariances=allQ12.map((q,qi)=>{
      const isS1=qi<12;
      // Only include respondents who actually answered this question (L+R sums to roughly 10).
      // Mid-survey participants leave later questions blank — including their 0s here would
      // wrongly skew min/max/variance.
      const answered=realRespondents.map(r=>{
        const ans=isS1?(r.s1_answers||[])[qi]:((r.s2_answers||[])[qi-12]);
        const l=parseInt(ans?.l)||0;
        const r2=parseInt(ans?.r)||0;
        return{l,r:r2,total:l+r2,name:r.respondent_name};
      }).filter(a=>a.total>=10);
      const lScores=answered.map(a=>a.l);
      const rScores=answered.map(a=>a.r);
      const lMean=lScores.reduce((s,v)=>s+v,0)/Math.max(lScores.length,1);
      const rMean=rScores.reduce((s,v)=>s+v,0)/Math.max(rScores.length,1);
      const rMin=rScores.length?Math.min(...rScores):0;
      const rMax=rScores.length?Math.max(...rScores):0;
      return{q,qi,isS1,variance:variance(rScores),mean:rMean,lMean,rMean,rMin,rMax,n:answered.length};
    }).filter(v=>v.n>=2).sort((a,b)=>b.variance-a.variance);

    const topVarianceQ=qVariances.slice(0,5);

    // Progress tracking
    const stepNames=['Landing','Context','Survey 1','Survey 2','Profile','To-Be','Report'];

    return(
      <div>
        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem',flexWrap:'wrap',gap:'.75rem'}}>
          <div>
            <div style={{fontSize:'.65rem',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#e07030',marginBottom:'.35rem',fontFamily:"'DM Sans',sans-serif"}}>Facilitator View — {codeNorm}</div>
            <div style={{display:'flex',alignItems:'center',gap:'.5rem'}}>
              <span className="pulse"/>
              <span style={{fontSize:'.82rem',color:'#555',fontFamily:"'DM Sans',sans-serif"}}>{realRespondents.length} respondent{realRespondents.length!==1?'s':''} · {SLABELS[groupStrat]}{splitTag}</span>
            </div>
          </div>
          <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
            <button className="refresh-btn" onClick={loadGroup} title="Auto-refreshes every 15s. Click to fetch the latest data immediately.">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              Refresh now
            </button>
            <button className="csv-btn" onClick={exportCSV}>⬇ CSV</button>
            <button className="csv-btn" style={{background:'#1a1a1a',display:'inline-flex',alignItems:'center',gap:'.4rem'}} onClick={()=>{
              try{
                generateStatGroupPDF({
                  realRespondents, withTobe,
                  gMean, gTobeMean, groupStrat, groupTobeStrat, groupIsSplit,
                  bigGap, qVariances,
                  principlesCluster, aiQuestions,
                  sessionCode:codeNorm,
                  orgName:(orgNameOverride||thing||'').trim(),
                  useNames:useNamesInPDF,
                  SLABELS, getStrategy,
                });
              }catch(e){
                console.error('PDF generate error:',e);
                alert('Could not generate PDF: '+(e&&e.message||'unknown error'));
              }
            }}>📄 Generate report (PDF)</button>
            <label style={{display:'inline-flex',alignItems:'center',gap:'.35rem',padding:'.4rem .65rem',background:'#fff',border:'1px solid #d8d3cb',borderRadius:'4px',fontSize:'.7rem',color:'#1a1a1a',fontFamily:"'DM Sans',sans-serif",cursor:'pointer',userSelect:'none'}} title="If on, the PDF will use real participant names. Off (default) uses anonymous labels R1, R2, R3...">
              <input type="checkbox" checked={useNamesInPDF} onChange={e=>setUseNamesInPDF(e.target.checked)} style={{margin:0}}/>
              Use names in PDF
            </label>
            <button onClick={()=>{setPrintAll(true);setTimeout(()=>{window.print();setTimeout(()=>setPrintAll(false),800);},800);}} title="Backup: print or Save as PDF via browser, in case the main PDF fails" style={{background:'transparent',color:'#888',border:'1px solid #d8d3cb',borderRadius:'3px',padding:'.4rem .75rem',fontSize:'.7rem',fontWeight:500,fontFamily:"'DM Sans',sans-serif",cursor:'pointer'}}>Browser print (backup)</button>
          </div>
        </div>

        {/* Most significant gap callout */}
        {withTobe.length>=2&&bigGap&&Math.abs(bigGap.gap)>=8&&(
          <div className="significant-gap">
            <div className="sg-label">Most Significant Group Shift</div>
            <div className="sg-text">The biggest shift your group wants to make is from <strong>{groupStrat?SLABELS[groupStrat]:'current'}</strong> toward <strong>{groupTobeStrat?SLABELS[groupTobeStrat]:'desired'}</strong> — particularly on <strong>{bigGap.lbl}</strong> (Δ{bigGap.gap>0?'+':''}{Math.round(bigGap.gap)}).</div>
          </div>
        )}

        {/* ── Facilitator dashboard tiles ─────────────────────────── */}
        {(()=>{
          const realCount=realRespondents.length;
          const submittedCount=realRespondents.filter(r=>r.s1_answers&&r.s2_answers&&r.tobe_prog).length;
          const inProgressCount=realCount-submittedCount;
          const contestedCount=qVariances.filter(v=>Math.sqrt(v.variance)>=1.5).length;
          const outliers=[];
          if(realCount>=2){
            const meanProg=realRespondents.reduce((s,r)=>s+(r.prog||0),0)/realCount;
            const meanDef=realRespondents.reduce((s,r)=>s+(r.def||0),0)/realCount;
            const meanCon=realRespondents.reduce((s,r)=>s+(r.con||0),0)/realCount;
            const meanFlex=realRespondents.reduce((s,r)=>s+(r.flex||0),0)/realCount;
            realRespondents.forEach(r=>{
              const gaps=[
                {dim:'progressive',gap:(r.prog||0)-meanProg},
                {dim:'defensive',gap:(r.def||0)-meanDef},
                {dim:'consistent',gap:(r.con||0)-meanCon},
                {dim:'flexible',gap:(r.flex||0)-meanFlex},
              ];
              const biggest=gaps.reduce((m,g)=>Math.abs(g.gap)>Math.abs(m.gap)?g:m,gaps[0]);
              if(Math.abs(biggest.gap)>=20)outliers.push({name:r.respondent_name,dim:biggest.dim,gap:biggest.gap});
            });
          }
          // Top-spread dimension for Overview headline

          const totalPrinciples=realRespondents.reduce((n,r)=>n+(Array.isArray(r.selected_principles)?r.selected_principles.length:0),0);

            {key:'overview',name:'Overview',headline:realCount<2?'Awaiting data':topSpreadDim&&topSpreadSD>=10?`Biggest spread on ${topSpreadDim}`:outliers.length>0?`${outliers.length} outlier${outliers.length!==1?'s':''}`:'Group well-aligned',sub:realCount<2?'Group profile and headlines':topSpreadDim&&topSpreadSD>=10?`SD ${topSpreadSD.toFixed(1)} · ${outliers.length} outlier${outliers.length!==1?'s':''}`:outliers.length>0?outliers.slice(0,2).map(o=>`${o.name} on ${o.dim}`).join(' · '):'Group profile and headlines'},
            {key:'variance',name:'Variance',headline:realCount>=2?(contestedCount>0?`${contestedCount} sharply split`:'Group aligned'):'Awaiting data',sub:realCount>=2?`All ${qVariances.length} questions ranked by spread`:'Where the group disagrees'},
            {key:'ai-questions',name:'AI Questions',headline:aiQReady?`${(aiQuestions.current||[]).length+(aiQuestions.future||[]).length} questions ready`:'Generate facilitation questions',sub:aiQReady?'Tailored to this group':'Click to generate from data'},
            {key:'principles',name:'Principles',headline:totalPrinciples>0?`${totalPrinciples} chosen`:'No principles yet',sub:respondentsWithPrinciples>0?`From ${respondentsWithPrinciples} respondent${respondentsWithPrinciples!==1?'s':''} · cluster by theme`:'Appear once respondents reach Step 5'},
            {key:'individuals',name:'Individuals',headline:`${realCount} profile${realCount!==1?'s':''}`,sub:'Drill into one respondent at a time'},
          ];

                  {orgNameEditing?(

                      }} style={{background:'#e07030',color:'#fff',border:'none',padding:'.45rem .8rem',fontSize:'.78rem',fontWeight:700,borderRadius:'3px',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>Save</button>

                  <div className="dash-ovr-sub">Session {codeNorm} · {realRespondents.length} respondent{realRespondents.length!==1?'s':''}{groupStrat?` · ${SLABELS[groupStrat]}${splitTag}`:''}</div>

              const dims=[
                {key:'prog',lbl:'Progressive',vals:completedRespondents.map(r=>r.prog||0)},
                {key:'def',lbl:'Defensive',vals:completedRespondents.map(r=>r.def||0)},

                {key:'flex',lbl:'Flexible',vals:completedRespondents.map(r=>r.flex||0)},
              ];
              dims.forEach(d=>{d.mean=d.vals.reduce((s,v)=>s+v,0)/Math.max(d.vals.length,1);d.sd=Math.sqrt(variance(d.vals));d.v=variance(d.vals);});
              const topTension=dims.slice().sort((a,b)=>b.v-a.v)[0];
              const withTobe2=completedRespondents.filter(r=>r.tobe_prog);
              const gTobe2={p:0,d:0,c:0,f:0};

              }
              const gTobeStrat2=withTobe2.length>0?getStrategy(gTobe2.d,gTobe2.p,gTobe2.c,gTobe2.f):null;

                dims.some(d=>{const v=d.key==='prog'?r.prog:d.key==='def'?r.def:d.key==='con'?r.con:r.flex;return d.sd>5&&Math.abs((v||0)-d.mean)>d.sd;})
              );

              const tobeAligned=withTobe2.length>1&&Math.max(...tobeVars)<400;
              /* Narrative */
              const progLabel=gMean.prog>gMean.def?'Progressive':'Defensive';
              const appLabel=gMean.flex>gMean.con?'Flexible':'Consistent';
              const shiftText=gTobeStrat2&&gTobeStrat2!==groupStrat?`The group wants to shift toward ${SLABELS[gTobeStrat2]}.`:'The group is broadly satisfied with its current direction.';
              const tensionText=topTension.sd>8?`The biggest disagreement is on ${topTension.lbl} (SD ${topTension.sd.toFixed(1)}), which is worth exploring in the debrief.`:'There is relatively good agreement across all four dimensions.';
              const narrative=`Your group of ${completedRespondents.length} shows a dominant ${SLABELS[groupStrat]||'Neutral'} strategy — leaning ${progLabel} and ${appLabel}. ${shiftText} ${tensionText}`;
              /* Debrief questions */
              const questions=[];
              questions.push(`The group sits in ${SLABELS[groupStrat]||'a neutral position'}. Is that an accurate picture of how you currently operate — or does it miss something important?`);
              if(topTension.sd>8)questions.push(`On ${topTension.lbl}, scores ranged widely across the group. What explains that gap — different roles, different experiences, or different readings of the organisation?`);
              if(gTobeStrat2&&gTobeStrat2!==groupStrat)questions.push(`As a group you want to move toward ${SLABELS[gTobeStrat2]}. What would need to change — in systems, behaviours, or leadership — to make that shift real?`);
              if(outliers.length>0)questions.push(`${outliers.map(r=>r.respondent_name.split(' ')[0]).join(' and ')} ${outliers.length===1?'sees':'see'} the organisation quite differently from the rest of the group. What might explain that?`);
              if(questions.length<4)questions.push('If you had to identify the single biggest thing holding this organisation back from where it wants to be, what would it be?');
              /* Quadrant map SVG */
              const QW=320,QH=300,QPX=50,QPY=44;
              const qw=QW-QPX*2,qh=QH-QPY*2;
              function qx(flex,con){return QPX+(((flex||0)-(con||0)+120)/240)*qw;}
              function qy(prog,def){return QPY+qh-(((prog||0)-(def||0)+120)/240)*qh;}
              const qMeanX=qx(gMean.flex,gMean.con);
              const qMeanY=qy(gMean.prog,gMean.def);
              return(
                <>
                  {/* Narrative */}
                  <div className="narrative-card">
                    <div className="narrative-label">Group Summary</div>
                    <div className="narrative-text">{narrative}</div>
                  </div>

                  {/* Insight cards */}
                  <div className="insight-grid">
                    <div className="insight-card tension">
                      <div className="insight-label">Key Tension</div>
                      <div className="insight-value">{topTension.lbl}</div>

                    </div>
                    <div className="insight-card outlier">
                      <div className="insight-label">Outliers</div>
                      <div className="insight-value">{outliers.length>0?outliers.length:'None'}</div>
                      {outliers.length===0?(
                        <div className="insight-desc">All respondents are within one standard deviation of the group mean.</div>
                      ):(
                        <div className="insight-desc">
                          {outliers.map((r,oi)=>{
                            const flagged=dims.filter(d=>{const v=d.key==='prog'?r.prog:d.key==='def'?r.def:d.key==='con'?r.con:r.flex;return d.sd>5&&Math.abs((v||0)-d.mean)>d.sd;}).map(d=>{const v=d.key==='prog'?r.prog:d.key==='def'?r.def:d.key==='con'?r.con:r.flex;const gap=Math.round((v||0)-d.mean);return d.lbl+' '+(gap>0?'+':'')+gap;});
                            return(
                              <div key={oi} style={{marginBottom:oi<outliers.length-1?'.35rem':0}}>
                                <strong style={{color:'#1a1a1a'}}>{r.respondent_name.split(' ')[0]}:</strong> {flagged.join(', ')}
                              </div>

                          })}
                        </div>
                      )}

                    <div className="insight-card shift">

                    </div>
                    <div className="insight-card alignment">
                      <div className="insight-label">To-Be Alignment</div>
                      <div className="insight-value">{withTobe2.length<2?'—':tobeAligned?'Aligned':'Divided'}</div>
                      <div className="insight-desc">{withTobe2.length<2?'Need 2+ to-be responses.':tobeAligned?'People broadly agree on where they want to go, even if they disagree on where they are.':'People disagree about the desired direction. This is an important conversation to have.'}</div>
                    </div>
                  </div>

                  {/* Quadrant map */}
                  <div className="quadrant-wrap">
                    <div className="quadrant-label">Quadrant Map — where each person sits</div>
                    <svg width="100%" viewBox={`0 0 ${QW} ${QH}`} style={{overflow:'visible',maxWidth:'100%'}}>

                      <text x={QPX+qw/4} y={QPY+qh-6} textAnchor="middle" fontSize={8} fontWeight={700} fill="#b0a898" fontFamily="DM Sans,sans-serif">PREVENTATIVE CTRL</text>
                      <text x={QPX+qw*3/4} y={QPY+qh-6} textAnchor="middle" fontSize={8} fontWeight={700} fill="#b0a898" fontFamily="DM Sans,sans-serif">MINDFUL ACTION</text>
                      {/* Axis labels — OUTSIDE the chart */}
                      <text x={QPX+qw/2} y={QPY-12} textAnchor="middle" fontSize={9} fontWeight={700} fill="#1a1a1a" fontFamily="DM Sans,sans-serif">Progressive</text>
                      <text x={QPX+qw/2} y={QPY+qh+18} textAnchor="middle" fontSize={9} fontWeight={700} fill="#1a1a1a" fontFamily="DM Sans,sans-serif">Defensive</text>
                      <text x={QPX-6} y={QPY+qh/2+3} textAnchor="end" fontSize={9} fontWeight={700} fill="#1a1a1a" fontFamily="DM Sans,sans-serif">Consistent</text>
                      <text x={QPX+qw+6} y={QPY+qh/2+3} textAnchor="start" fontSize={9} fontWeight={700} fill="#1a1a1a" fontFamily="DM Sans,sans-serif">Flexible</text>
                      {/* Participant dots — small, uniform, no labels */}
                      {completedRespondents.map((r,i)=>{
                        const x=qx(r.flex||0,r.con||0);
                        const y=qy(r.prog||0,r.def||0);
                        const col=PAX_COLORS[i%PAX_COLORS.length];
                        const sel=quadrantHoverIdx===i;
                        return(
                          <g key={i} style={{cursor:'pointer'}} onClick={()=>setQuadrantHoverIdx(sel?null:i)}>
                            <circle cx={x} cy={y} r={sel?7:4} fill={col} fillOpacity={sel?1:.9} stroke="#fff" strokeWidth={sel?2:1}/>
                            {sel&&<g>
                              <rect x={x+8} y={y-12} width={r.respondent_name.length*5.6+10} height={18} fill="#1a1a1a" rx={3}/>
                              <text x={x+13} y={y+1} fontSize={9} fontWeight={700} fill="#fff" fontFamily="DM Sans,sans-serif">{r.respondent_name}</text>
                            </g>}
                          </g>
                        );
                      })}
                      {/* Group mean cross — label below */}
                      <line x1={qMeanX-7} y1={qMeanY} x2={qMeanX+7} y2={qMeanY} stroke="#1a1a1a" strokeWidth={2.5}/>

                      <text x={qMeanX} y={qMeanY+18} textAnchor="middle" fontSize={8} fill="#1a1a1a" fontWeight={700} fontFamily="DM Sans,sans-serif">Mean</text>
                    </svg>

                      <div style={{display:'flex',flexWrap:'wrap',gap:'.35rem'}}>

                              <span style={{display:'inline-block',width:'8px',height:'8px',borderRadius:'50%',background:col,border:sel?'1.5px solid #fff':'none'}}/>
                              {r.respondent_name}
                            </button>
                          );
                        })}
                        {quadrantHoverIdx!==null&&(
                          <button onClick={()=>setQuadrantHoverIdx(null)}
                            style={{padding:'.25rem .55rem',background:'none',border:'1px dashed #d8d3cb',borderRadius:'12px',fontSize:'.7rem',color:'#888',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>

                      </div>
                    </div>
                  )}

                  {/* Debrief questions moved to AI Questions tab */}
                </>
              );
            })()}
          </div>
        )}

        {/* Variance tab */}
        {(facTab==='variance'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Variance</div>}
            <div className="rpt-section">
              <div className="rpt-heading">Per-Dimension Spread</div>
              <p className="rpt-body" style={{marginBottom:'1rem'}}>How tightly the group agrees on each dimension. SD &lt; 6 = strong consensus; 6–10 = moderate spread; 10–15 = significant disagreement; &gt; 15 = highly polarised.</p>
              {(()=>{
                const pairs=[
                  {l:'Progressive',r:'Defensive',ls:Math.sqrt(dimVariance.prog),rs:Math.sqrt(dimVariance.def)},
                  {l:'Consistent',r:'Flexible',ls:Math.sqrt(dimVariance.con),rs:Math.sqrt(dimVariance.flex)},
                ];
                function band(sd){
                  if(sd<6)return 'strong consensus';
                  if(sd<10)return 'moderate spread';
                  if(sd<15)return 'significant disagreement';
                  return 'highly polarised';
                }
                function bandColor(sd){
                  if(sd<6)return '#16a34a';
                  if(sd<10)return '#65a30d';
                  if(sd<15)return '#f59e0b';
                  return '#dc2626';
                }
                return pairs.map(p=>{
                  const sd=Math.max(p.ls,p.rs);
                  return(
                    <div key={p.l} style={{padding:'.65rem .85rem',marginBottom:'.6rem',background:'#fff',border:'1px solid #d8d3cb',borderLeft:`3px solid ${bandColor(sd)}`,borderRadius:'4px'}}>

                      </div>
                      <div style={{fontSize:'.78rem',color:bandColor(sd),fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>
                        {band(sd)} on this axis

                    </div>
                  );
                });
              })()}

                      <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',gap:'.4rem'}}>
                        <span style={{fontSize:'.78rem',fontWeight:700,color:sdColor,fontFamily:"'DM Sans',sans-serif",fontVariantNumeric:'tabular-nums'}}>{sd.toFixed(1)}</span>
