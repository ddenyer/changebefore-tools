  function renderFacilitatorTab(){
    const PAX_COLORS=['#e07030', '#1a4fa0', '#2d7d46', '#b87a20', '#b83232', '#6a3d9a', '#0891b2', '#78350f', '#374151'];
    const realRespondents=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__');
    const completedRespondents=realRespondents.filter(r=>!!(r.prog));

    // Compute analytics
    // Per-dimension variance
    function variance(arr){if(arr.length<2)return 0;const m=arr.reduce((s,v)=>s+v,0)/arr.length;return arr.reduce((s,v)=>s+(v-m)**2,0)/arr.length;}
    const dimVariance={
      prog:variance(realRespondents.map(r=>r.prog||0)),
      def:variance(realRespondents.map(r=>r.def||0)),
      con:variance(realRespondents.map(r=>r.con||0)),
      flex:variance(realRespondents.map(r=>r.flex||0)),
    };
    const maxVar=Math.max(...Object.values(dimVariance));

    // Group mean
    const gMean={prog:0,def:0,con:0,flex:0};
    realRespondents.forEach(r=>{gMean.prog+=(r.prog||0);gMean.def+=(r.def||0);gMean.con+=(r.con||0);gMean.flex+=(r.flex||0);});
    ['prog','def','con','flex'].forEach(k=>{gMean[k]=Math.round(gMean[k]/realRespondents.length);});
    const groupStrat=getStrategy(gMean.def,gMean.prog,gMean.con,gMean.flex);

    // Group to-be mean
    const gTobeMean={p:0,d:0,c:0,f:0};
    const withTobe=realRespondents.filter(r=>r.tobe_p);
    if(withTobe.length>0){
      withTobe.forEach(r=>{gTobeMean.p+=(r.tobe_p||60);gTobeMean.d+=(r.tobe_d||60);gTobeMean.c+=(r.tobe_c||60);gTobeMean.f+=(r.tobe_f||60);});
      ['p','d','c','f'].forEach(k=>{gTobeMean[k]=Math.round(gTobeMean[k]/withTobe.length);});
    }
    const groupTobeStrat=withTobe.length>0?getStrategy(gTobeMean.d,gTobeMean.p,gTobeMean.c,gTobeMean.f):null;

    // Most significant gap
    const dimShifts=[
      {lbl:'Progressive',gap:gTobeMean.p-gMean.prog,dim:'prog'},
      {lbl:'Defensive',gap:gTobeMean.d-gMean.def,dim:'def'},
      {lbl:'Consistent',gap:gTobeMean.c-gMean.con,dim:'con'},
      {lbl:'Flexible',gap:gTobeMean.f-gMean.flex,dim:'flex'},
    ].sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
    const bigGap=dimShifts[0];

    // Question variance (s1 and s2)
    const allQ12=[...S1.categories.flatMap(c=>c.qs),...S2.categories.flatMap(c=>c.qs)];
    const qVariances=allQ12.map((q,qi)=>{
      const isS1=qi<12;
      const lScores=realRespondents.map(r=>{const ans=isS1?(r.s1_answers||[])[qi]:((r.s2_answers||[])[qi-12]);return parseInt(ans?.l)||0;});
      const rScores=realRespondents.map(r=>{const ans=isS1?(r.s1_answers||[])[qi]:((r.s2_answers||[])[qi-12]);return parseInt(ans?.r)||0;});
      const lMean=lScores.reduce((s,v)=>s+v,0)/Math.max(lScores.length,1);
      const rMean=rScores.reduce((s,v)=>s+v,0)/Math.max(rScores.length,1);
      const rMin=rScores.length?Math.min(...rScores):0;
      const rMax=rScores.length?Math.max(...rScores):0;
      return{q,qi,isS1,variance:variance(rScores),mean:rMean,lMean,rMean,rMin,rMax};
    }).sort((a,b)=>b.variance-a.variance);

    const topVarianceQ=qVariances.slice(0,5);

    // Progress tracking
    const stepNames=['Landing','Context','Survey 1','Survey 2','Profile','To-Be','Report'];

    return(
      <div>
        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem',flexWrap:'wrap',gap:'.75rem'}}>
          <div>
            <div style={{fontSize:'.65rem',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#e07030',marginBottom:'.35rem',fontFamily:"'DM Sans',sans-serif"}}>Facilitator View — {codeNorm}</div>
            <div style={{display:'flex',alignItems:'center',gap:'.5rem'}}>
              <span className="pulse"/>
              <span style={{fontSize:'.82rem',color:'#555',fontFamily:"'DM Sans',sans-serif"}}>{realRespondents.length} respondent{realRespondents.length!==1?'s':''} · {SLABELS[groupStrat]}</span>
            </div>
          </div>
          <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
            <button className="refresh-btn" onClick={loadGroup}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              Refresh
            </button>
            <button className="csv-btn" onClick={exportCSV}>⬇ CSV</button>
            <button className="csv-btn" style={{background:'#444'}} onClick={()=>{setPrintAll(true);setTimeout(()=>{window.print();setTimeout(()=>setPrintAll(false),800);},800);}}>🖨 Print all</button>
          </div>
        </div>

        {/* Most significant gap callout */}
        {withTobe.length>=2&&bigGap&&Math.abs(bigGap.gap)>=8&&(
          <div className="significant-gap">
            <div className="sg-label">Most Significant Group Shift</div>
            <div className="sg-text">The biggest shift your group wants to make is from <strong>{groupStrat?SLABELS[groupStrat]:'current'}</strong> toward <strong>{groupTobeStrat?SLABELS[groupTobeStrat]:'desired'}</strong> — particularly on <strong>{bigGap.lbl}</strong> (Δ{bigGap.gap>0?'+':''}{Math.round(bigGap.gap)}).</div>
          </div>
        )}



        {/* Facilitator sub-tabs */}
        <div className="fac-tab-bar">
          {['progress','group-report','present','overview','variance','ai-questions','principles','individuals','notes'].map(t=>(
            <div key={t} className={`fac-tab${facTab===t?' active':''}`} onClick={()=>setFacTab(t)}>
              {t==='progress'?'Progress':t==='group-report'?'Group Report':t==='present'?'Share / Present':t==='overview'?'Overview':t==='variance'?'Variance':t==='ai-questions'?'AI Questions':t==='principles'?'Principles':t==='individuals'?'Individuals':'Notes'}
            </div>
          ))}
        </div>

        {/* Overview tab */}
        {(facTab==='group-report'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Group Report</div>}
            {renderGroupReportTab()}
          </div>
        )}

        {(facTab==='present'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Share / Present</div>}
            {renderPresentTab()}
          </div>
        )}

        {(facTab==='overview'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Overview</div>}
            {/* Live Ticker */}
            {(()=>{
              const started=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__'&&!(r.prog));
              const done=completedRespondents;
              return(
                <div className="ticker">
                  <div className="ticker-item"><div className="ticker-dot done"/><span className="ticker-count">{done.length}</span> completed</div>
                  <div className="ticker-divider">·</div>
                  <div className="ticker-item"><div className="ticker-dot started"/><span className="ticker-count">{started.length}</span> in progress</div>
                  <div className="ticker-divider">·</div>
                  <div className="ticker-item"><div className="ticker-dot waiting"/><span className="ticker-count">{done.length+started.length}</span> total</div>
                  {done.length>0&&(<><div className="ticker-divider">·</div><div className="ticker-item" style={{marginLeft:'auto'}}><button className="pres-btn primary" style={{padding:'.35rem .9rem',fontSize:'.72rem'}} onClick={()=>{setSelectedForPresent(null);setFacTab('present');}}>Share / Present →</button></div></>)}
                </div>
              );
            })()}

            {completedRespondents.length===0&&(
              <div style={{textAlign:'center',padding:'2rem',color:'#888',fontSize:'.875rem',fontFamily:"'DM Sans',sans-serif"}}>Waiting for participants to complete the survey.</div>
            )}

            {completedRespondents.length>0&&(()=>{
              /* Analytics */
              function variance(arr){if(arr.length<2)return 0;const m=arr.reduce((s,v)=>s+v,0)/arr.length;return arr.reduce((s,v)=>s+(v-m)**2,0)/arr.length;}
              const dims=[
                {key:'prog',lbl:'Progressive',vals:completedRespondents.map(r=>r.prog||0)},
                {key:'def',lbl:'Defensive',vals:completedRespondents.map(r=>r.def||0)},
                {key:'con',lbl:'Consistent',vals:completedRespondents.map(r=>r.con||0)},
                {key:'flex',lbl:'Flexible',vals:completedRespondents.map(r=>r.flex||0)},
              ];
              dims.forEach(d=>{d.mean=d.vals.reduce((s,v)=>s+v,0)/Math.max(d.vals.length,1);d.sd=Math.sqrt(variance(d.vals));d.v=variance(d.vals);});
              const topTension=dims.slice().sort((a,b)=>b.v-a.v)[0];
              const withTobe2=completedRespondents.filter(r=>r.tobe_prog);
              const gTobe2={p:0,d:0,c:0,f:0};
              if(withTobe2.length>0){
                withTobe2.forEach(r=>{gTobe2.p+=(r.tobe_prog||60);gTobe2.d+=(r.tobe_def||60);gTobe2.c+=(r.tobe_con||60);gTobe2.f+=(r.tobe_flex||60);});
                ['p','d','c','f'].forEach(k=>{gTobe2[k]=Math.round(gTobe2[k]/withTobe2.length);});
              }
              const gTobeStrat2=withTobe2.length>0?getStrategy(gTobe2.d,gTobe2.p,gTobe2.c,gTobe2.f):null;
              const outliers=completedRespondents.filter(r=>
                dims.some(d=>{const v=d.key==='prog'?r.prog:d.key==='def'?r.def:d.key==='con'?r.con:r.flex;return d.sd>5&&Math.abs((v||0)-d.mean)>d.sd;})
              );
              const tobeVars=['p','d','c','f'].map(k=>{const vals=withTobe2.map(r=>k==='p'?r.tobe_prog:k==='d'?r.tobe_def:k==='c'?r.tobe_con:r.tobe_flex);const m=vals.reduce((s,v)=>s+v,0)/Math.max(vals.length,1);return vals.reduce((s,v)=>s+(v-m)**2,0)/Math.max(vals.length,1);});
              const tobeAligned=withTobe2.length>1&&Math.max(...tobeVars)<400;
              /* Narrative */
              const progLabel=gMean.prog>gMean.def?'Progressive':'Defensive';
              const appLabel=gMean.flex>gMean.con?'Flexible':'Consistent';
              const shiftText=gTobeStrat2&&gTobeStrat2!==groupStrat?`The group wants to shift toward ${SLABELS[gTobeStrat2]}.`:'The group is broadly satisfied with its current direction.';
              const tensionText=topTension.sd>8?`The biggest disagreement is on ${topTension.lbl} (SD ${topTension.sd.toFixed(1)}), which is worth exploring in the debrief.`:'There is relatively good agreement across all four dimensions.';
              const narrative=`Your group of ${completedRespondents.length} shows a dominant ${SLABELS[groupStrat]||'Neutral'} strategy — leaning ${progLabel} and ${appLabel}. ${shiftText} ${tensionText}`;
              /* Debrief questions */
              const questions=[];
              questions.push(`The group sits in ${SLABELS[groupStrat]||'a neutral position'}. Is that an accurate picture of how you currently operate — or does it miss something important?`);
              if(topTension.sd>8)questions.push(`On ${topTension.lbl}, scores ranged widely across the group. What explains that gap — different roles, different experiences, or different readings of the organisation?`);
              if(gTobeStrat2&&gTobeStrat2!==groupStrat)questions.push(`As a group you want to move toward ${SLABELS[gTobeStrat2]}. What would need to change — in systems, behaviours, or leadership — to make that shift real?`);
              if(outliers.length>0)questions.push(`${outliers.map(r=>r.respondent_name.split(' ')[0]).join(' and ')} ${outliers.length===1?'sees':'see'} the organisation quite differently from the rest of the group. What might explain that?`);
              if(questions.length<4)questions.push('If you had to identify the single biggest thing holding this organisation back from where it wants to be, what would it be?');
              /* Quadrant map SVG */
              const QW=320,QH=300,QPX=50,QPY=44;
              const qw=QW-QPX*2,qh=QH-QPY*2;
              function qx(flex,con){return QPX+(((flex||0)-(con||0)+120)/240)*qw;}
              function qy(prog,def){return QPY+qh-(((prog||0)-(def||0)+120)/240)*qh;}
              const qMeanX=qx(gMean.flex,gMean.con);
              const qMeanY=qy(gMean.prog,gMean.def);
              return(
                <>
                  {/* Narrative */}
                  <div className="narrative-card">
                    <div className="narrative-label">Group Summary</div>
                    <div className="narrative-text">{narrative}</div>
                  </div>

                  {/* Insight cards */}
                  <div className="insight-grid">
                    <div className="insight-card tension">
                      <div className="insight-label">Key Tension</div>
                      <div className="insight-value">{topTension.lbl}</div>
                      <div className="insight-desc">Highest disagreement — SD {topTension.sd.toFixed(1)}. {topTension.sd>8?'Surface this first in the debrief.':'Relatively good consensus.'}</div>
                    </div>
                    <div className="insight-card outlier">
                      <div className="insight-label">Outliers</div>
                      <div className="insight-value">{outliers.length>0?outliers.length:'None'}</div>
                      {outliers.length===0?(
                        <div className="insight-desc">All respondents are within one standard deviation of the group mean.</div>
                      ):(
                        <div className="insight-desc">
                          {outliers.map((r,oi)=>{
                            const flagged=dims.filter(d=>{const v=d.key==='prog'?r.prog:d.key==='def'?r.def:d.key==='con'?r.con:r.flex;return d.sd>5&&Math.abs((v||0)-d.mean)>d.sd;}).map(d=>{const v=d.key==='prog'?r.prog:d.key==='def'?r.def:d.key==='con'?r.con:r.flex;const gap=Math.round((v||0)-d.mean);return d.lbl+' '+(gap>0?'+':'')+gap;});
                            return(
                              <div key={oi} style={{marginBottom:oi<outliers.length-1?'.35rem':0}}>
                                <strong style={{color:'#1a1a1a'}}>{r.respondent_name.split(' ')[0]}:</strong> {flagged.join(', ')}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                    <div className="insight-card shift">
                      <div className="insight-label">Desired Shift</div>
                      <div className="insight-value">{gTobeStrat2?SLABELS[gTobeStrat2]:'—'}</div>
                      <div className="insight-desc">{withTobe2.length>0?`Group mean to-be (${withTobe2.length} responded). Current: ${SLABELS[groupStrat]||'Neutral'}.`:'No to-be data yet.'}</div>
                    </div>
                    <div className="insight-card alignment">
                      <div className="insight-label">To-Be Alignment</div>
                      <div className="insight-value">{withTobe2.length<2?'—':tobeAligned?'Aligned':'Divided'}</div>
                      <div className="insight-desc">{withTobe2.length<2?'Need 2+ to-be responses.':tobeAligned?'People broadly agree on where they want to go, even if they disagree on where they are.':'People disagree about the desired direction. This is an important conversation to have.'}</div>
                    </div>
                  </div>

                  {/* Quadrant map */}
                  <div className="quadrant-wrap">
                    <div className="quadrant-label">Quadrant Map — where each person sits</div>
                    <svg width="100%" viewBox={`0 0 ${QW} ${QH}`} style={{overflow:'visible',maxWidth:'100%'}}>
                      {/* Background quadrants */}
                      <rect x={QPX} y={QPY} width={qw/2} height={qh/2} fill="#f8f5f0" stroke="none"/>
                      <rect x={QPX+qw/2} y={QPY} width={qw/2} height={qh/2} fill="#f0f7f0" stroke="none"/>
                      <rect x={QPX} y={QPY+qh/2} width={qw/2} height={qh/2} fill="#f5f0f8" stroke="none"/>
                      <rect x={QPX+qw/2} y={QPY+qh/2} width={qw/2} height={qh/2} fill="#f0f4f8" stroke="none"/>
                      {/* Outer frame */}
                      <rect x={QPX} y={QPY} width={qw} height={qh} fill="none" stroke="#d8d3cb" strokeWidth={1}/>
                      {/* Axes */}
                      <line x1={QPX} y1={QPY+qh/2} x2={QPX+qw} y2={QPY+qh/2} stroke="#b0a898" strokeWidth={1.5}/>
                      <line x1={QPX+qw/2} y1={QPY} x2={QPX+qw/2} y2={QPY+qh} stroke="#b0a898" strokeWidth={1.5}/>
                      {/* Quadrant labels (subtle, in corners) */}
                      <text x={QPX+qw/4} y={QPY+14} textAnchor="middle" fontSize={8} fontWeight={700} fill="#b0a898" fontFamily="DM Sans,sans-serif">PERFORMANCE OPT.</text>
                      <text x={QPX+qw*3/4} y={QPY+14} textAnchor="middle" fontSize={8} fontWeight={700} fill="#b0a898" fontFamily="DM Sans,sans-serif">ADAPTIVE INNOV.</text>
                      <text x={QPX+qw/4} y={QPY+qh-6} textAnchor="middle" fontSize={8} fontWeight={700} fill="#b0a898" fontFamily="DM Sans,sans-serif">PREVENTATIVE CTRL</text>
                      <text x={QPX+qw*3/4} y={QPY+qh-6} textAnchor="middle" fontSize={8} fontWeight={700} fill="#b0a898" fontFamily="DM Sans,sans-serif">MINDFUL ACTION</text>
                      {/* Axis labels — OUTSIDE the chart */}
                      <text x={QPX+qw/2} y={QPY-12} textAnchor="middle" fontSize={9} fontWeight={700} fill="#1a1a1a" fontFamily="DM Sans,sans-serif">Progressive</text>
                      <text x={QPX+qw/2} y={QPY+qh+18} textAnchor="middle" fontSize={9} fontWeight={700} fill="#1a1a1a" fontFamily="DM Sans,sans-serif">Defensive</text>
                      <text x={QPX-6} y={QPY+qh/2+3} textAnchor="end" fontSize={9} fontWeight={700} fill="#1a1a1a" fontFamily="DM Sans,sans-serif">Consistent</text>
                      <text x={QPX+qw+6} y={QPY+qh/2+3} textAnchor="start" fontSize={9} fontWeight={700} fill="#1a1a1a" fontFamily="DM Sans,sans-serif">Flexible</text>
                      {/* Participant dots — small, uniform, no labels */}
                      {completedRespondents.map((r,i)=>{
                        const x=qx(r.flex||0,r.con||0);
                        const y=qy(r.prog||0,r.def||0);
                        const col=PAX_COLORS[i%PAX_COLORS.length];
                        return(
                          <circle key={i} cx={x} cy={y} r={4} fill={col} fillOpacity={.9} stroke="#fff" strokeWidth={1}/>
                        );
                      })}
                      {/* Group mean cross — label below */}
                      <line x1={qMeanX-7} y1={qMeanY} x2={qMeanX+7} y2={qMeanY} stroke="#1a1a1a" strokeWidth={2.5}/>
                      <line x1={qMeanX} y1={qMeanY-7} x2={qMeanX} y2={qMeanY+7} stroke="#1a1a1a" strokeWidth={2.5}/>
                      <text x={qMeanX} y={qMeanY+18} textAnchor="middle" fontSize={8} fill="#1a1a1a" fontWeight={700} fontFamily="DM Sans,sans-serif">Mean</text>
                    </svg>
                  </div>

                  {/* Debrief questions moved to AI Questions tab */}
                </>
              );
            })()}
          </div>
        )}

        {/* Variance tab */}
        {(facTab==='variance'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Variance</div>}
            <div className="rpt-section">
              <div className="rpt-heading">Per-Dimension Spread</div>
              <p className="rpt-body" style={{marginBottom:'1rem'}}>How tightly the group agrees on each dimension. SD &lt; 6 = strong consensus; 6–10 = moderate spread; 10–15 = significant disagreement; &gt; 15 = highly polarised.</p>
              {(()=>{
                const pairs=[
                  {l:'Progressive',r:'Defensive',ls:Math.sqrt(dimVariance.prog),rs:Math.sqrt(dimVariance.def)},
                  {l:'Consistent',r:'Flexible',ls:Math.sqrt(dimVariance.con),rs:Math.sqrt(dimVariance.flex)},
                ];
                function band(sd){
                  if(sd<6)return 'strong consensus';
                  if(sd<10)return 'moderate spread';
                  if(sd<15)return 'significant disagreement';
                  return 'highly polarised';
                }
                function bandColor(sd){
                  if(sd<6)return '#16a34a';
                  if(sd<10)return '#65a30d';
                  if(sd<15)return '#f59e0b';
                  return '#dc2626';
                }
                return pairs.map(p=>{
                  const sd=Math.max(p.ls,p.rs);
                  return(
                    <div key={p.l} style={{padding:'.65rem .85rem',marginBottom:'.6rem',background:'#fff',border:'1px solid #d8d3cb',borderLeft:`3px solid ${bandColor(sd)}`,borderRadius:'4px'}}>
                      <div style={{fontSize:'.88rem',fontWeight:600,color:'#1a1a1a',fontFamily:"'DM Sans',sans-serif",marginBottom:'.15rem'}}>
                        {p.l}–{p.r}: SD = {sd.toFixed(1)}
                      </div>
                      <div style={{fontSize:'.78rem',color:bandColor(sd),fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>
                        {band(sd)} on this axis
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
            <div className="rpt-section">
              <div className="rpt-heading">Most Contested Questions</div>
              <p className="rpt-body" style={{marginBottom:'1rem'}}>The five questions on which respondents disagreed most. Each shows the two poles, the group mean for the right-hand option, and the spread.</p>
              {topVarianceQ.map((item,i)=>{
                const sd=Math.sqrt(item.variance);
                return(
                  <div key={i} style={{background:'#fff',border:'1px solid #d8d3cb',borderRadius:'4px',padding:'.85rem 1rem',marginBottom:'.75rem'}}>
                    <div style={{display:'flex',gap:'.5rem',alignItems:'baseline',marginBottom:'.5rem',flexWrap:'wrap'}}>
                      <div style={{fontSize:'.8rem',fontWeight:700,color:'#1a1a1a',fontFamily:"'DM Sans',sans-serif",flex:1,minWidth:'200px'}}>{i+1}. {item.q.q}</div>
                      <div style={{fontSize:'.65rem',fontWeight:600,color:item.isS1?'#2563eb':'#7c3aed',fontFamily:"'DM Sans',sans-serif",whiteSpace:'nowrap'}}>{item.isS1?'§1 Mindset':'§2 Approach'}</div>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'.5rem',marginBottom:'.5rem'}}>
                      <div style={{padding:'.55rem .7rem',background:'#faf8f5',border:'1px solid #e0dbd4',borderRadius:'3px'}}>
                        <div style={{fontSize:'.58rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#888',marginBottom:'.2rem',fontFamily:"'DM Sans',sans-serif"}}>Option A · mean {item.lMean.toFixed(1)}/10</div>
                        <div style={{fontSize:'.75rem',lineHeight:1.45,color:'#555'}}>{item.q.l}</div>
                      </div>
                      <div style={{padding:'.55rem .7rem',background:'#fff8f5',border:'1px solid #f5c8b0',borderRadius:'3px'}}>
                        <div style={{fontSize:'.58rem',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#e07030',marginBottom:'.2rem',fontFamily:"'DM Sans',sans-serif"}}>Option B · mean {item.rMean.toFixed(1)}/10</div>
                        <div style={{fontSize:'.75rem',lineHeight:1.45,color:'#1a1a1a'}}>{item.q.r}</div>
                      </div>
                    </div>
                    <div style={{display:'flex',gap:'.4rem',alignItems:'center',flexWrap:'wrap'}}>
                      <div style={{display:'inline-flex',alignItems:'center',gap:'.3rem',background:'#ebe7e0',border:'1px solid #d8d3cb',borderRadius:'3px',padding:'.2rem .55rem',fontSize:'.7rem',color:'#1a1a1a',fontFamily:"'DM Sans',sans-serif"}}>
                        <strong style={{color:'#888'}}>LOW</strong> {item.rMin}
                      </div>
                      <div style={{display:'inline-flex',alignItems:'center',gap:'.3rem',background:'#fff8f5',border:'1px solid #f5c8b0',borderRadius:'3px',padding:'.2rem .55rem',fontSize:'.7rem',color:'#1a1a1a',fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>
                        <strong style={{color:'#e07030'}}>MEAN</strong> {item.rMean.toFixed(1)}
                      </div>
                      <div style={{display:'inline-flex',alignItems:'center',gap:'.3rem',background:'#ebe7e0',border:'1px solid #d8d3cb',borderRadius:'3px',padding:'.2rem .55rem',fontSize:'.7rem',color:'#1a1a1a',fontFamily:"'DM Sans',sans-serif"}}>
                        <strong style={{color:'#888'}}>HIGH</strong> {item.rMax}
                      </div>
                      <div style={{display:'inline-flex',alignItems:'center',gap:'.3rem',background:'#1a1a1a',color:'#f0ede8',borderRadius:'3px',padding:'.2rem .55rem',fontSize:'.7rem',fontFamily:"'DM Sans',sans-serif"}}>
                        <strong>SD</strong> {sd.toFixed(1)}
                      </div>
                      <span style={{fontSize:'.68rem',color:'#888',fontFamily:"'DM Sans',sans-serif",marginLeft:'.25rem'}}>(scores on Option B across {realRespondents.length} respondents)</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Individuals tab */}
        {(facTab==='individuals'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Individuals</div>}
            <div className="rpt-section">
              <div className="rpt-heading">Individual Profiles</div>
              {realRespondents.map((r,i)=>{
                const rStrat=getStrategy(r.def||0,r.prog||0,r.con||0,r.flex||0);
                const isSelected=selectedRespondent===i;
                const isRemoving=removeTarget===r.respondent_name;
                return(
                  <div key={i} className={`respondent-card${isSelected?' selected':''}`}>
                    <div className="rc-header" onClick={()=>{if(!isRemoving)setSelectedRespondent(isSelected?null:i);}}>
                      <div style={{display:'flex',alignItems:'center',gap:'.65rem'}}>
                        <div className="rc-dot" style={{background:PAX_COLORS[i%PAX_COLORS.length]}}/>
                        <div>
                          <div className="rc-name">{r.respondent_name}</div>
                          <div className="rc-role">{r.role||'No role specified'} {r.sector&&r.role?'• '+r.sector:r.sector||''}</div>
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                        <div style={{textAlign:'right'}}>
                          <div className="rc-strategy">{SLABELS[rStrat]}</div>
                          <div style={{fontSize:'.65rem',color:'#888',fontFamily:"'DM Sans',sans-serif"}}>P{r.prog} D{r.def} C{r.con} F{r.flex}</div>
                        </div>
                        <button onClick={e=>{e.stopPropagation();setRemoveTarget(isRemoving?null:r.respondent_name);setSelectedRespondent(null);}}
                          style={{background:'none',border:'1px solid #d8d3cb',borderRadius:3,padding:'.25rem .5rem',fontSize:'.65rem',fontWeight:600,color:'#888',cursor:'pointer',fontFamily:"'DM Sans',sans-serif",flexShrink:0}}
                          title="Remove from session">✕</button>
                      </div>
                    </div>
                    {isRemoving&&(
                      <div style={{marginTop:'.75rem',paddingTop:'.75rem',borderTop:'1px solid #ebe7e0',display:'flex',alignItems:'center',gap:'.75rem',flexWrap:'wrap'}}>
                        <span style={{fontSize:'.82rem',color:'#c0392b',fontFamily:"'DM Sans',sans-serif"}}>Remove <strong>{r.respondent_name}</strong> from this session?</span>
                        <button className="btn-p" style={{background:'#c0392b',borderColor:'#c0392b',padding:'.4rem .9rem',fontSize:'.78rem'}}
                          disabled={removeLoading}
                          onClick={e=>{e.stopPropagation();doRemove(r.respondent_name);}}>
                          {removeLoading?'Removing…':'Confirm Remove'}
                        </button>
                        <button className="btn-s" style={{padding:'.4rem .9rem',fontSize:'.78rem'}}
                          onClick={e=>{e.stopPropagation();setRemoveTarget(null);}}>Cancel</button>
                      </div>
                    )}
                    {isSelected&&!isRemoving&&(
                      <div style={{marginTop:'.85rem',paddingTop:'.85rem',borderTop:'1px solid #ebe7e0'}}>
                        <div className="score-grid" style={{marginBottom:'.75rem'}}>
                          {[{lbl:'Progressive',val:r.prog||0},{lbl:'Defensive',val:r.def||0},{lbl:'Consistent',val:r.con||0},{lbl:'Flexible',val:r.flex||0}].map(sc=>(
                            <div key={sc.lbl} className="score-card">
                              <div className="score-dim">Score</div>
                              <div className="score-val">{sc.val}</div>
                              <div className="score-lbl">{sc.lbl}</div>
                              <div className="score-bar"><div className="score-fill" style={{width:(sc.val/120)*100+'%'}}/></div>
                            </div>
                          ))}
                        </div>
                        {r.tobe_prog&&(
                          <div style={{fontSize:'.78rem',color:'#555',fontFamily:"'DM Sans',sans-serif"}}>
                            Desired: {SLABELS[getStrategy(r.tobe_def||60,r.tobe_prog||60,r.tobe_con||60,r.tobe_flex||60)]} (P{r.tobe_prog} D{r.tobe_def} C{r.tobe_con} F{r.tobe_flex})
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Progress tab */}
        {(facTab==='progress'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Progress</div>}
            <div className="rpt-section">
              <div className="rpt-heading">Session Progress</div>
              <p className="rpt-body" style={{marginBottom:'.75rem'}}>Steps completed per respondent based on data available in Supabase.</p>
              <div className="progress-grid">
                {realRespondents.map((r,i)=>{
                  const steps=[
                    true, // always in
                    !!(r.thing),
                    !!(r.s1_answers&&r.s1_answers.length>0),
                    !!(r.s2_answers&&r.s2_answers.length>0),
                    !!(r.prog),
                    !!(r.tobe_p),
                    true,
                  ];
                  const done=steps.filter(Boolean).length;
                  return(
                    <div key={i} className="prog-person">
                      <div className="pp-name" title={r.respondent_name}>{r.respondent_name}</div>
                      <div style={{fontSize:'.65rem',color:'#888',marginBottom:'.4rem',fontFamily:"'DM Sans',sans-serif"}}>{done}/{steps.length} steps</div>
                      <div className="pp-steps">
                        {steps.map((done,si)=>(
                          <div key={si} className={`step-dot ${done?'done':''}`} title={stepNames[si]}/>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* AI Questions tab */}
        {(facTab==='ai-questions'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">AI Facilitation Questions</div>}
            <div className="rpt-section">
              <div className="rpt-heading">AI Facilitation Questions</div>
              <p className="rpt-body" style={{marginBottom:'.75rem'}}>A structured prompt sequence for opening the group debrief — drawn from the group's responses and the source material.</p>
              {!aiQuestions&&!aiQLoading&&!aiQError&&(
                <button className="btn-p" onClick={loadAiQuestions} disabled={realRespondents.length<2}>
                  Generate Prompts →
                </button>
              )}
              {aiQLoading&&(
                <div className="think"><div className="dots"><div className="dot"/><div className="dot"/><div className="dot"/></div><span className="think-txt">Analysing group data…</span></div>
              )}
              {aiQError&&!aiQLoading&&(
                <div className="warn-box" style={{marginBottom:'.75rem'}}>
                  <strong>Could not generate prompts.</strong> {aiQError}
                  <div style={{marginTop:'.65rem'}}>
                    <button className="btn-s" onClick={()=>{setAiQError(null);loadAiQuestions();}}>Try again</button>
                  </div>
                </div>
              )}
              {aiQuestions&&renderAiFacilitationPrompts(aiQuestions)}
              {aiQuestions&&(
                <div className="btn-row" style={{marginTop:'1rem'}}>
                  <button className="btn-s" onClick={()=>{setAiQuestions(null);setAiQError(null);}}>Regenerate</button>
                  <button className="btn-s" onClick={()=>{
                    const text=aiPromptsToPlainText(aiQuestions);
                    navigator.clipboard.writeText(text).catch(()=>{});
                  }}>Copy to clipboard</button>
                </div>
              )}
            </div>
          </div>
        )}

        {/* Principles tab */}
        {(facTab==='principles'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Group Principles</div>}
            {renderPrinciplesTab()}
          </div>
        )}

        {/* Notes tab */}
        {(facTab==='notes'||printAll)&&(
          <div>
            {printAll&&<div className="print-section-title">Facilitator Notes</div>}
            <div className="rpt-section">
              <div className="rpt-heading">Facilitator Notes</div>
              <p className="rpt-body" style={{marginBottom:'.75rem'}}>Notes are saved automatically and are only visible to you as facilitator.</p>
              <textarea className="notes-area" value={facilitatorNotes}
                placeholder="Session notes, key observations, discussion points…"
                onChange={e=>{setFacilitatorNotes(e.target.value);saveFacilitatorNotes(e.target.value);}}/>
              <div style={{fontSize:'.72rem',color:'#b0a898',marginTop:'.35rem',fontFamily:"'DM Sans',sans-serif"}}>Auto-saved to session</div>
            </div>

            {/* Pre-session briefing export */}
            <div className="rpt-section" style={{borderTop:'1px solid #d8d3cb',paddingTop:'1.25rem'}}>
              <div className="rpt-heading">Pre-Session Briefing</div>
              <p className="rpt-body" style={{marginBottom:'.75rem'}}>One-page PDF with group mean profile, top contested questions, seniority split if detected, and facilitation questions.</p>
              <button className="btn-s" onClick={()=>window.print()}>Print / Save as PDF</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  function renderPresentTab(){
    const PAX_C=['#e07030','#1a4fa0','#2d7d46','#b87a20','#b83232','#6a3d9a','#0891b2','#78350f','#374151'];
    const comp=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__'&&r.prog);
    const visibleSet=selectedForPresent===null?new Set(comp.map(r=>r.respondent_name)):selectedForPresent;
    const visible=comp.filter(r=>visibleSet.has(r.respondent_name));
    // As-is mean
    const gM={prog:0,def:0,con:0,flex:0};
    if(comp.length>0){comp.forEach(r=>{gM.prog+=(r.prog||0);gM.def+=(r.def||0);gM.con+=(r.con||0);gM.flex+=(r.flex||0);});['prog','def','con','flex'].forEach(k=>{gM[k]=Math.round(gM[k]/comp.length);});}
    // To-be mean
    const compTobe=comp.filter(r=>r.tobe_prog);
    const gT={p:0,d:0,c:0,f:0};
    if(compTobe.length>0){compTobe.forEach(r=>{gT.p+=(r.tobe_prog||60);gT.d+=(r.tobe_def||60);gT.c+=(r.tobe_con||60);gT.f+=(r.tobe_flex||60);});['p','d','c','f'].forEach(k=>{gT[k]=Math.round(gT[k]/compTobe.length);});}
    const gStrat=comp.length>0?getStrategy(gM.def,gM.prog,gM.con,gM.flex):null;
    const W=320,H=320,DCX=160,DCY=160,RD=110;
    const vBox='0 0 '+W+' '+H;
    function sp(p,d,co,f){
      const pts=[[DCX,DCY-(p/120)*RD],[DCX+(f/120)*RD,DCY],[DCX,DCY+(d/120)*RD],[DCX-(co/120)*RD,DCY]];
      return pts.map((pt,i)=>(i===0?'M':'L')+pt[0]+','+pt[1]).join(' ')+' Z';
    }
    function gp(pct){const r=RD*pct;return 'M'+DCX+','+(DCY-r)+' L'+(DCX+r)+','+DCY+' L'+DCX+','+(DCY+r)+' L'+(DCX-r)+','+DCY+' Z';}
    function toggleOne(name){
      const cur=new Set(visibleSet);
      if(cur.has(name))cur.delete(name);else cur.add(name);
      setSelectedForPresent(cur);
    }
    function selectAll(){setSelectedForPresent(new Set(comp.map(r=>r.respondent_name)));}
    function selectNone(){setSelectedForPresent(new Set());}
    function renderDiamond(asIs){
      const path=asIs?sp(gM.prog,gM.def,gM.con,gM.flex):sp(gT.p,gT.d,gT.c,gT.f);
      const meanColor=asIs?'#1a1a1a':'#e07030';
      const hasMean=asIs?comp.length>0:compTobe.length>0;
      return(
        <svg width="100%" viewBox={vBox} style={{overflow:'visible',maxWidth:'100%'}}>
          {[.25,.5,.75,1].map(pct=><path key={pct} d={gp(pct)} fill="none" stroke="#d8d3cb" strokeWidth={pct===1?1.5:1}/>)}
          <line x1={DCX} y1={DCY-RD} x2={DCX} y2={DCY+RD} stroke="#d8d3cb"/>
          <line x1={DCX-RD} y1={DCY} x2={DCX+RD} y2={DCY} stroke="#d8d3cb"/>
          {visible.map((r,i)=>{
            const ci=comp.findIndex(x=>x.respondent_name===r.respondent_name);
            const col=PAX_C[ci%PAX_C.length];
            const indPath=asIs?sp(r.prog||0,r.def||0,r.con||0,r.flex||0):(r.tobe_prog?sp(r.tobe_prog,r.tobe_def,r.tobe_con,r.tobe_flex):null);
            if(!indPath)return null;
            return(<path key={i} d={indPath} fill="none" stroke={col} strokeWidth={1.25} strokeDasharray="3,3" opacity={0.7} strokeLinejoin="round"/>);
          })}
          {hasMean&&<path d={path} fill={meanColor} fillOpacity={.06} stroke={meanColor} strokeWidth={3} strokeLinejoin="round"/>}
          <text x={DCX} y={DCY-RD-10} textAnchor="middle" fill="#555" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">Progressive</text>
          <text x={DCX+RD+8} y={DCY+4} textAnchor="start" fill="#555" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">Flexible</text>
          <text x={DCX} y={DCY+RD+18} textAnchor="middle" fill="#555" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">Defensive</text>
          <text x={DCX-RD-8} y={DCY+4} textAnchor="end" fill="#555" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">Consistent</text>
        </svg>
      );
    }
    if(comp.length===0){
      return(
        <div className="rpt-section">
          <div className="rpt-heading">Share / Present</div>
          <div className="waiting-state"><div className="wait-icon">📊</div><h3>No completed responses yet</h3><p style={{fontSize:'.82rem',color:'#888',marginTop:'.5rem'}}>Once participants finish the survey, you can use this tab to display their profiles to the group.</p></div>
        </div>
      );
    }
    return(
      <div className="rpt-section">
        <div className="rpt-heading">Share / Present</div>
        <div className="inf-box" style={{marginBottom:'1.25rem'}}>
          <strong>Facilitator instructions:</strong> Use this tab to display the group's profiles to the room. Tick the boxes below to show or hide each participant's profile on the diamonds. The bold lines are the group means (black = current, orange = desired). Reveal profiles one at a time to spark discussion, or show them all together to compare.
        </div>

        <div className="dual-diamond-wrap">
          <div className="chart-box">
            <div className="chart-lbl">Current (As-Is) — {visible.length} of {comp.length} shown</div>
            {renderDiamond(true)}
            <div style={{fontSize:'.72rem',fontWeight:700,color:'#888',fontFamily:"'DM Sans',sans-serif",marginTop:'.4rem'}}>{SLABELS[gStrat]||''}</div>
          </div>
          <div className="chart-box">
            <div className="chart-lbl">Desired (To-Be) — {compTobe.length} response{compTobe.length!==1?'s':''}</div>
            {compTobe.length>0?renderDiamond(false):<div style={{padding:'2rem 0',color:'#b0a898',fontSize:'.82rem',fontFamily:"'DM Sans',sans-serif"}}>No to-be data yet</div>}
            {compTobe.length>0&&(()=>{const ts=getStrategy(gT.d,gT.p,gT.c,gT.f);return <div style={{fontSize:'.72rem',fontWeight:700,color:'#888',fontFamily:"'DM Sans',sans-serif",marginTop:'.4rem'}}>{SLABELS[ts]||''}</div>;})()}
          </div>
        </div>

        <div style={{display:'flex',gap:'.75rem',flexWrap:'wrap',justifyContent:'center',marginBottom:'1rem',padding:'.6rem .9rem',background:'#fff',border:'1px solid #d8d3cb',borderRadius:'4px',fontSize:'.72rem',color:'#555',fontFamily:"'DM Sans',sans-serif"}}>
          <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
            <svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#1a1a1a" strokeWidth="3"/></svg>
            <span><strong>Group mean (current)</strong></span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
            <svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#e07030" strokeWidth="3"/></svg>
            <span><strong>Group mean (desired)</strong></span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
            <svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#888" strokeWidth="1.25" strokeDasharray="3,3"/></svg>
            <span>Selected individuals</span>
          </div>
        </div>

        <div style={{display:'flex',gap:'.5rem',marginBottom:'.75rem',flexWrap:'wrap'}}>
          <button className="btn-s" onClick={selectAll}>Show all</button>
          <button className="btn-s" onClick={selectNone}>Hide all</button>
          <span style={{fontSize:'.72rem',color:'#888',alignSelf:'center',marginLeft:'.5rem',fontFamily:"'DM Sans',sans-serif"}}>Tap a name to show or hide that profile.</span>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:'.4rem'}}>
          {comp.map((r,i)=>{
            const col=PAX_C[i%PAX_C.length];
            const on=visibleSet.has(r.respondent_name);
            return(
              <button key={i} type="button" onClick={()=>toggleOne(r.respondent_name)} style={{display:'flex',alignItems:'center',gap:'.5rem',padding:'.5rem .7rem',borderRadius:'3px',cursor:'pointer',background:on?'#fff':'#f5f1ea',border:`1.5px solid ${on?col:'#d8d3cb'}`,fontSize:'.78rem',color:on?'#1a1a1a':'#888',fontFamily:"'DM Sans',sans-serif",textAlign:'left',outline:'none',transition:'all .15s'}}>
                <span style={{display:'inline-block',width:14,height:14,border:`1.5px solid ${on?col:'#b0a898'}`,borderRadius:'2px',background:on?col:'#fff',position:'relative',flexShrink:0}}>
                  {on&&<span style={{position:'absolute',top:'-2px',left:'2px',color:'#fff',fontSize:'.85rem',fontWeight:700,lineHeight:1}}>✓</span>}
                </span>
                <span style={{display:'inline-block',width:10,height:10,borderRadius:'50%',background:col,flexShrink:0}}/>
                <span style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',fontWeight:on?700:400,flex:1}}>{r.respondent_name}</span>
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  function renderPrinciplesTab(){
    const PAX_C=['#e07030','#1a4fa0','#2d7d46','#b87a20','#b83232','#6a3d9a','#0891b2','#78350f','#374151'];
    const real=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__');
    const withPrinciples=real.filter(r=>Array.isArray(r.selected_principles)&&r.selected_principles.length>0);
    const totalPrinciples=withPrinciples.reduce((n,r)=>n+r.selected_principles.length,0);
    // Map respondent name to colour (consistent with present tab)
    const colourFor=(name)=>{const i=real.findIndex(r=>r.respondent_name===name);return PAX_C[(i>=0?i:0)%PAX_C.length];};

    function copyAsText(){
      if(!principlesCluster||!principlesCluster.clusters)return;
      const lines=[];
      principlesCluster.clusters.forEach(c=>{
        lines.push(c.theme.toUpperCase());
        if(c.summary)lines.push(c.summary);
        lines.push('');
        c.items.forEach(it=>lines.push(`  • ${it.text} (${it.author})`));
        lines.push('');
      });
      navigator.clipboard.writeText(lines.join('\n').trim()).catch(()=>{});
    }

    return(
      <div>
        <div className="rpt-section">
          <div className="rpt-heading">Group Principles</div>
          <div style={{background:'#fff8e1',border:'1px solid #f59e0b',borderRadius:'4px',padding:'.55rem .75rem',marginBottom:'.85rem',fontSize:'.7rem',fontFamily:"'DM Sans',monospace",color:'#78350f',whiteSpace:'pre-wrap'}}>
            <strong>DEBUG · raw load:</strong>
            {'\n'}respondents loaded: {real.length}
            {real.map(r=>{
              const sp=r.selected_principles;
              const kind=sp===undefined?'undefined':sp===null?'null':Array.isArray(sp)?`array(${sp.length})`:typeof sp;
              return `\n  • ${r.respondent_name}: selected_principles = ${kind}`;
            }).join('')}
          </div>
          <div className="inf-box">
            Each participant chose principles — commitments to a way of seeing — they want to take into how the organisation operates. This view groups those principles by underlying commitment so you can see the patterns at a glance.
          </div>

          {withPrinciples.length===0&&(
            <div className="waiting-state">
              <div className="wait-icon">📝</div>
              <h3>No principles selected yet</h3>
              <div style={{fontSize:'.82rem',color:'#888',marginTop:'.5rem',fontFamily:"'DM Sans',sans-serif"}}>
                Principles appear here once participants reach Step 5 and confirm their selections.
              </div>
            </div>
          )}

          {withPrinciples.length>0&&(
            <div style={{fontSize:'.78rem',color:'#555',marginBottom:'.85rem',fontFamily:"'DM Sans',sans-serif"}}>
              <strong>{totalPrinciples}</strong> principle{totalPrinciples!==1?'s':''} chosen by <strong>{withPrinciples.length}</strong> participant{withPrinciples.length!==1?'s':''}
            </div>
          )}

          {withPrinciples.length>0&&!principlesCluster&&!principlesClusterLoading&&!principlesClusterError&&(
            <button className="btn-p" onClick={loadPrinciplesCluster}>
              Cluster by theme →
            </button>
          )}

          {principlesClusterLoading&&(
            <div className="think"><div className="dots"><div className="dot"/><div className="dot"/><div className="dot"/></div><span className="think-txt">Clustering principles by theme…</span></div>
          )}

          {principlesClusterError&&!principlesClusterLoading&&(
            <div className="warn-box" style={{marginBottom:'.75rem'}}>
              <strong>Could not cluster principles.</strong> {principlesClusterError}
              <div style={{marginTop:'.65rem'}}>
                <button className="btn-s" onClick={()=>{setPrinciplesClusterError(null);loadPrinciplesCluster();}}>Try again</button>
              </div>
            </div>
          )}

          {principlesCluster&&Array.isArray(principlesCluster.clusters)&&principlesCluster.clusters.length>0&&(
            <div>
              <div style={{fontSize:'.7rem',color:'#888',marginBottom:'.75rem',fontFamily:"'DM Sans',sans-serif"}}>
                {principlesCluster.clusters.length} cluster{principlesCluster.clusters.length!==1?'s':''} · {principlesCluster.meta&&principlesCluster.meta.n_principles||totalPrinciples} principle{(principlesCluster.meta&&principlesCluster.meta.n_principles||totalPrinciples)!==1?'s':''}
              </div>

              {principlesCluster.clusters.map((c,ci)=>(
                <div key={ci} className="da-card" style={{marginBottom:'.85rem'}}>
                  <div className="da-card-heading">Theme {ci+1}</div>
                  <div style={{fontSize:'1.05rem',fontWeight:600,color:'#1a1a1a',fontFamily:"'Cormorant Garamond',serif",lineHeight:1.3,marginBottom:'.4rem'}}>{c.theme}</div>
                  {c.summary&&<div style={{fontSize:'.82rem',color:'#555',lineHeight:1.55,marginBottom:'.75rem',fontFamily:"'DM Sans',sans-serif"}}>{c.summary}</div>}
                  <div style={{display:'flex',flexDirection:'column',gap:'.5rem',marginTop:'.5rem'}}>
                    {c.items.map((it,ii)=>{
                      const col=colourFor(it.author);
                      return(
                        <div key={ii} style={{display:'flex',gap:'.65rem',alignItems:'flex-start',padding:'.55rem .7rem',background:'#faf8f5',borderLeft:`3px solid ${col}`,borderRadius:'0 3px 3px 0'}}>
                          <div style={{flex:1,fontSize:'.86rem',lineHeight:1.55,color:'#1a1a1a',fontFamily:"'DM Sans',sans-serif"}}>{it.text}</div>
                          <span style={{display:'inline-block',padding:'.15rem .55rem',background:col,color:'#fff',borderRadius:'10px',fontSize:'.65rem',fontWeight:700,whiteSpace:'nowrap',fontFamily:"'DM Sans',sans-serif",flexShrink:0,marginTop:'.1rem'}}>{it.author}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}

              <div className="btn-row" style={{marginTop:'1rem'}}>
                <button className="btn-s" onClick={()=>{setPrinciplesCluster(null);setPrinciplesClusterError(null);}}>Re-cluster</button>
                <button className="btn-s" onClick={copyAsText}>Copy to clipboard</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  function renderGroupReportTab(){
    const realRespondents=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__');
    const myEntry=realRespondents.find(r=>r.respondent_name===respondentName.trim());
    const PAX_COLORS=['#e07030', '#1a4fa0', '#2d7d46', '#b87a20', '#b83232', '#6a3d9a', '#0891b2', '#78350f', '#374151'];

    // Group mean scores
    const gMean={prog:0,def:0,con:0,flex:0};
    if(realRespondents.length>0){
      realRespondents.forEach(r=>{gMean.prog+=(r.prog||0);gMean.def+=(r.def||0);gMean.con+=(r.con||0);gMean.flex+=(r.flex||0);});
      ['prog','def','con','flex'].forEach(k=>{gMean[k]=Math.round(gMean[k]/realRespondents.length);});
    }
    const groupStrat=realRespondents.length>0?getStrategy(gMean.def,gMean.prog,gMean.con,gMean.flex):null;

    // Diamond paths
    function groupDiamond(){
      const W=300,H=300,CX=150,CY=150,RD=100;
      function ap(ax,sc){const r=(sc/120)*RD;if(ax==='prog')return[CX,CY-r];if(ax==='flex')return[CX+r,CY];if(ax==='def')return[CX,CY+r];return[CX-r,CY];}
      function sp(p,d,co,f){const pts=[[CX,CY-(p/120)*RD],[CX+(f/120)*RD,CY],[CX,CY+(d/120)*RD],[CX-(co/120)*RD,CY]];return pts.map((pt,i)=>`${i===0?'M':'L'}${pt[0]},${pt[1]}`).join(' ')+' Z';}
      function gridPath(pct){const r=RD*pct;return `M${CX},${CY-r} L${CX+r},${CY} L${CX},${CY+r} L${CX-r},${CY} Z`;}
      return(
        <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible',maxWidth:'300px'}}>
          {[.25,.5,.75,1].map(pct=><path key={pct} d={gridPath(pct)} fill="none" stroke="#d8d3cb" strokeWidth={pct===1?1.5:0.8}/>)}
          <line x1={CX} y1={CY-RD} x2={CX} y2={CY+RD} stroke="#d8d3cb"/>
          <line x1={CX-RD} y1={CY} x2={CX+RD} y2={CY} stroke="#d8d3cb"/>
          {realRespondents.map((r,i)=>{
            const isMe=r.respondent_name===respondentName.trim();
            const hidden=!isMe&&anonymousMode;
            if(hidden)return null;
            const col=PAX_COLORS[i%PAX_COLORS.length];
            return(<path key={i} d={sp(r.prog||0,r.def||0,r.con||0,r.flex||0)} fill={col} fillOpacity={.06} stroke={col} strokeWidth={isMe?2.5:1.5} strokeLinejoin="round" strokeDasharray={isMe?undefined:'4,3'}/>);
          })}
          {realRespondents.length>0&&<path d={sp(gMean.prog,gMean.def,gMean.con,gMean.flex)} fill="none" stroke="#1a1a1a" strokeWidth={2} strokeLinejoin="round"/>}
          <text x={CX} y={CY-RD-10} textAnchor="middle" fill="#555" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">Progressive</text>
          <text x={CX+RD+8} y={CY+4} textAnchor="start" fill="#555" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">Flexible</text>
          <text x={CX} y={CY+RD+18} textAnchor="middle" fill="#555" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">Defensive</text>
          <text x={CX-RD-8} y={CY+4} textAnchor="end" fill="#555" fontSize={10} fontWeight={700} fontFamily="DM Sans,sans-serif">Consistent</text>
        </svg>
      );
    }

    return(
      <div>
        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem',flexWrap:'wrap',gap:'.75rem'}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'.5rem'}}>
              {realRespondents.length>0&&<span className="pulse"/>}
              <span style={{fontSize:'.65rem',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#555',fontFamily:"'DM Sans',sans-serif"}}>Session: {codeNorm}</span>
            </div>
            <div className="chip-row">
              {realRespondents.map((r,i)=>{
                const isMe=r.respondent_name===respondentName.trim();
                return(
                  <div key={i} className={`p-chip done${isMe?' you':''}`} title={r.respondent_name+(isMe?' (you)':'')} style={{background:PAX_COLORS[i%PAX_COLORS.length],borderColor:PAX_COLORS[i%PAX_COLORS.length]}}>
                    {i+1}
                    {isMe&&<span className="you-dot"/>}
                  </div>
                );
              })}
              {realRespondents.length===0&&<span style={{fontSize:'.78rem',color:'#b0a898',fontFamily:"'DM Sans',sans-serif"}}>Waiting for respondents…</span>}
            </div>
            {realRespondents.length>0&&<div style={{fontSize:'.72rem',color:'#555',marginTop:'.35rem',fontFamily:"'DM Sans',sans-serif"}}>{realRespondents.length} respondent{realRespondents.length!==1?'s':''} — {SLABELS[groupStrat]||'…'}</div>}
          </div>
          <div style={{textAlign:'right'}}>
            <button className="refresh-btn" onClick={loadGroup}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              Refresh
            </button>
            {lastRefreshed&&<div style={{fontSize:'.65rem',color:'#b0a898',marginTop:'.2rem',fontFamily:"'DM Sans',sans-serif"}}>Last updated {lastRefreshed}</div>}
          </div>
        </div>

        {/* Can't see others */}
        <div style={{marginBottom:'.75rem'}}>
          <button style={{background:'none',border:'none',padding:0,color:'#e07030',cursor:'pointer',textDecoration:'underline',fontSize:'.78rem',fontFamily:"'DM Sans',sans-serif"}}
            onClick={()=>{setCodeFixOpen(o=>!o);setCodeFixVal(codeNorm);}}>
            ⚠ Can't see other group members? Check your session code →
          </button>
          {codeFixOpen&&(
            <div className="code-fix-box">
              <span style={{fontSize:'.78rem',color:'#1e40af',fontWeight:600,fontFamily:"'DM Sans',sans-serif",whiteSpace:'nowrap'}}>Session code:</span>
              <input value={codeFixVal} onChange={e=>setCodeFixVal(e.target.value.toUpperCase())} placeholder="e.g. SELL-2025" autoFocus/>
              <button className="apply-btn" onClick={()=>{const v=codeFixVal.trim();if(!v)return;setSessionCode(v);setCodeFixOpen(false);setTimeout(loadGroup,500);}}>Apply</button>
              <button style={{background:'none',border:'none',color:'#6b7280',cursor:'pointer',fontSize:'.78rem',fontFamily:"'DM Sans',sans-serif"}} onClick={()=>setCodeFixOpen(false)}>Cancel</button>
            </div>
          )}
        </div>

        <>
            {/* Anonymity toggle */}
            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'.75rem'}}>
              <label className="anon-toggle">
                <input type="checkbox" checked={anonymousMode} onChange={e=>setAnonymousMode(e.target.checked)}/>
                Show my profile only
              </label>
            </div>

            {/* Group diamonds: as-is + to-be */}
            {(()=>{
              const withTobe3=realRespondents.filter(r=>r.tobe_prog);
              const gTobe3={p:0,d:0,c:0,f:0};
              if(withTobe3.length>0){
                withTobe3.forEach(r=>{gTobe3.p+=(r.tobe_prog||60);gTobe3.d+=(r.tobe_def||60);gTobe3.c+=(r.tobe_con||60);gTobe3.f+=(r.tobe_flex||60);});
                ['p','d','c','f'].forEach(k=>{gTobe3[k]=Math.round(gTobe3[k]/withTobe3.length);});
              }
              const gTobeStrat3=withTobe3.length>0?getStrategy(gTobe3.d,gTobe3.p,gTobe3.c,gTobe3.f):null;
              function miniDiamond(respondents,mean,tobe,tobeStrat,title){
                const W=260,H=260,CX=130,CY=130,RD=90;
                function sp(p,d,co,f){const pts=[[CX,CY-(p/120)*RD],[CX+(f/120)*RD,CY],[CX,CY+(d/120)*RD],[CX-(co/120)*RD,CY]];return pts.map((pt,i)=>`${i===0?'M':'L'}${pt[0]},${pt[1]}`).join(' ')+' Z';}
                function gridPath(pct){const r=RD*pct;return `M${CX},${CY-r} L${CX+r},${CY} L${CX},${CY+r} L${CX-r},${CY} Z`;}
                return(
                  <div className="chart-box" style={{textAlign:'center'}}>
                    <div className="chart-lbl">{title}</div>
                    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
                      {[.25,.5,.75,1].map(pct=><path key={pct} d={gridPath(pct)} fill="none" stroke="#d8d3cb" strokeWidth={pct===1?1.5:0.8}/>)}
                      <line x1={CX} y1={CY-RD} x2={CX} y2={CY+RD} stroke="#d8d3cb"/>
                      <line x1={CX-RD} y1={CY} x2={CX+RD} y2={CY} stroke="#d8d3cb"/>
                      {respondents.map((r,i)=>{
                        const col=PAX_COLORS[i%PAX_COLORS.length];
                        const scores=tobe?[r.tobe_prog||60,r.tobe_def||60,r.tobe_con||60,r.tobe_flex||60]:[r.prog||0,r.def||0,r.con||0,r.flex||0];
                        if(tobe&&!r.tobe_prog)return null;
                        return(<path key={i} d={sp(scores[0],scores[1],scores[2],scores[3])} fill={col} fillOpacity={.05} stroke={col} strokeWidth={1.25} strokeLinejoin="round" strokeDasharray="3,3" opacity={.55}/>);
                      })}
                      {mean&&<path d={sp(mean.prog||0,mean.def||0,mean.con||0,mean.flex||0)} fill="#1a1a1a" fillOpacity={.05} stroke="#1a1a1a" strokeWidth={3} strokeLinejoin="round"/>}
                      {tobe&&gTobeStrat3&&<path d={sp(gTobe3.p,gTobe3.d,gTobe3.c,gTobe3.f)} fill="#e07030" fillOpacity={.05} stroke="#e07030" strokeWidth={3} strokeLinejoin="round"/>}
                      <text x={CX} y={CY-RD-8} textAnchor="middle" fill="#555" fontSize={9} fontWeight={700} fontFamily="DM Sans,sans-serif">Progressive</text>
                      <text x={CX+RD+6} y={CY+4} textAnchor="start" fill="#555" fontSize={9} fontWeight={700} fontFamily="DM Sans,sans-serif">Flexible</text>
                      <text x={CX} y={CY+RD+16} textAnchor="middle" fill="#555" fontSize={9} fontWeight={700} fontFamily="DM Sans,sans-serif">Defensive</text>
                      <text x={CX-RD-6} y={CY+4} textAnchor="end" fill="#555" fontSize={9} fontWeight={700} fontFamily="DM Sans,sans-serif">Consistent</text>
                    </svg>
                    {SLABELS[tobe?gTobeStrat3:groupStrat]&&<div style={{fontSize:'.72rem',fontWeight:700,color:'#888',fontFamily:"'DM Sans',sans-serif",marginTop:'.4rem'}}>{SLABELS[tobe?gTobeStrat3:groupStrat]}</div>}
                  </div>
                );
              }
              return(
                <div className="dual-diamond-wrap">
                  {miniDiamond(realRespondents,gMean,false,groupStrat,'As-Is Profile')}
                  {withTobe3.length>0
                    ? miniDiamond(realRespondents,null,true,gTobeStrat3,'Desired Profile')
                    : <div className="chart-box" style={{textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:'#b0a898',fontSize:'.82rem',fontFamily:"'DM Sans',sans-serif"}}>To-be data not yet available</span></div>
                  }
                </div>
              );
            })()}
            {/* Legend */}
            <div style={{display:'flex',gap:'1.25rem',justifyContent:'center',flexWrap:'wrap',marginTop:'.4rem',marginBottom:'1.25rem',padding:'.6rem .9rem',background:'#fff',border:'1px solid #d8d3cb',borderRadius:'4px',fontSize:'.72rem',color:'#555',fontFamily:"'DM Sans',sans-serif"}}>
              <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
                <svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#1a1a1a" strokeWidth="3"/></svg>
                <span><strong>Group mean (as-is)</strong></span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
                <svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#e07030" strokeWidth="3"/></svg>
                <span><strong>Group mean (desired)</strong></span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
                <svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#888" strokeWidth="1.25" strokeDasharray="3,3"/></svg>
                <span>Individual respondents</span>
              </div>
            </div>

            {/* Group score table */}
            {realRespondents.length>0&&(
              <div className="rpt-section">
                <div className="rpt-heading" style={{fontSize:'.63rem',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#e07030',marginBottom:'.75rem'}}>Group Mean Scores</div>
                <div className="group-mean-row">
                  {[{lbl:'Progressive',mean:gMean.prog},{lbl:'Defensive',mean:gMean.def},{lbl:'Consistent',mean:gMean.con},{lbl:'Flexible',mean:gMean.flex}].map(({lbl,mean})=>(
                    <div key={lbl} className="gm-cell">
                      <div className="gm-lbl">{lbl}</div>
                      <div className="gm-you" style={{color:'#1a1a1a'}}>{mean}</div>
                      <div className="gm-mean">Group mean</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Dominant strategy */}
            {groupStrat&&(
              <div className="strat-badge" style={{marginTop:'.5rem'}}>
                <div className="strat-dot"/>
                <div>
                  <strong style={{fontFamily:"'DM Sans',sans-serif"}}>Group dominant strategy: {SLABELS[groupStrat]}</strong>
                  <br/><span style={{fontSize:'.8rem',fontWeight:400,color:'#666',fontFamily:"'DM Sans',sans-serif"}}>{SDESC[groupStrat]}</span>
                </div>
              </div>
            )}
          </>
      </div>
    );
  }

  // ── MAIN RENDER ──────────────────────────────────────────────────────────
  // Presentation mode overlay
  function renderPresentationMode(){
    const PAX_C=['#e07030','#1a4fa0','#2d7d46','#b87a20','#b83232','#6a3d9a','#0891b2','#78350f','#374151'];
    const comp=groupRespondents.filter(r=>r.respondent_name&&r.respondent_name!=='__facilitator__'&&r.prog);
    // Default: all selected
    const visibleSet=selectedForPresent===null?new Set(comp.map(r=>r.respondent_name)):selectedForPresent;
    const visible=comp.filter(r=>visibleSet.has(r.respondent_name));
    const gM={prog:0,def:0,con:0,flex:0};
    if(comp.length>0){comp.forEach(r=>{gM.prog+=(r.prog||0);gM.def+=(r.def||0);gM.con+=(r.con||0);gM.flex+=(r.flex||0);});['prog','def','con','flex'].forEach(k=>{gM[k]=Math.round(gM[k]/comp.length);});}
    // Group to-be mean
    const compTobe=comp.filter(r=>r.tobe_prog);
    const gT={p:0,d:0,c:0,f:0};
    if(compTobe.length>0){compTobe.forEach(r=>{gT.p+=(r.tobe_prog||60);gT.d+=(r.tobe_def||60);gT.c+=(r.tobe_con||60);gT.f+=(r.tobe_flex||60);});['p','d','c','f'].forEach(k=>{gT[k]=Math.round(gT[k]/compTobe.length);});}
    const gStrat=comp.length>0?getStrategy(gM.def,gM.prog,gM.con,gM.flex):null;
    const W=480,H=480,CX=240,CY=240,RD=170;
    const vBox='0 0 '+W+' '+H;
    function sp(p,d,co,f){
      const pts=[[CX,CY-(p/120)*RD],[CX+(f/120)*RD,CY],[CX,CY+(d/120)*RD],[CX-(co/120)*RD,CY]];
      return pts.map((pt,i)=>(i===0?'M':'L')+pt[0]+','+pt[1]).join(' ')+' Z';
    }
    function gp(pct){const r=RD*pct;return 'M'+CX+','+(CY-r)+' L'+(CX+r)+','+CY+' L'+CX+','+(CY+r)+' L'+(CX-r)+','+CY+' Z';}
    function toggleOne(name){
      const cur=new Set(visibleSet);
      if(cur.has(name))cur.delete(name);else cur.add(name);
      setSelectedForPresent(cur);
    }
    function selectAll(){setSelectedForPresent(new Set(comp.map(r=>r.respondent_name)));}
    function selectNone(){setSelectedForPresent(new Set());}
    return(
      <div className="pres-overlay" style={{justifyContent:'flex-start',overflowY:'auto',paddingTop:'1.5rem'}}>
        <button className="pres-exit" onClick={()=>setPresentationMode(false)}>✕ Exit</button>
        <div className="pres-title">{codeNorm} — Group Profile</div>
        <div className="pres-sub">{visible.length} of {comp.length} shown · {SLABELS[gStrat]||''}</div>
        <div className="pres-diamond-wrap">
          <svg width="100%" height="100%" viewBox={vBox} style={{overflow:'visible'}}>
            {[.25,.5,.75,1].map(pct=><path key={pct} d={gp(pct)} fill="none" stroke="rgba(255,255,255,.15)" strokeWidth={pct===1?1.5:0.8}/>)}
            <line x1={CX} y1={CY-RD} x2={CX} y2={CY+RD} stroke="rgba(255,255,255,.15)"/>
            <line x1={CX-RD} y1={CY} x2={CX+RD} y2={CY} stroke="rgba(255,255,255,.15)"/>
            {visible.map((r,i)=>{const ci=comp.findIndex(x=>x.respondent_name===r.respondent_name);const col=PAX_C[ci%PAX_C.length];return(<path key={i} d={sp(r.prog||0,r.def||0,r.con||0,r.flex||0)} fill={col} fillOpacity={.12} stroke={col} strokeWidth={2} strokeLinejoin="round"/>);})}
            {comp.length>0&&<path d={sp(gM.prog,gM.def,gM.con,gM.flex)} fill="none" stroke="#fff" strokeWidth={3} strokeLinejoin="round"/>}
            {compTobe.length>0&&<path d={sp(gT.p,gT.d,gT.c,gT.f)} fill="none" stroke="#e07030" strokeWidth={3} strokeLinejoin="round"/>}
            <text x={CX} y={CY-RD-14} textAnchor="middle" fill="rgba(255,255,255,.6)" fontSize={13} fontWeight={700} fontFamily="DM Sans,sans-serif">Progressive</text>
            <text x={CX+RD+12} y={CY+5} textAnchor="start" fill="rgba(255,255,255,.6)" fontSize={13} fontWeight={700} fontFamily="DM Sans,sans-serif">Flexible</text>
            <text x={CX} y={CY+RD+22} textAnchor="middle" fill="rgba(255,255,255,.6)" fontSize={13} fontWeight={700} fontFamily="DM Sans,sans-serif">Defensive</text>
            <text x={CX-RD-12} y={CY+5} textAnchor="end" fill="rgba(255,255,255,.6)" fontSize={13} fontWeight={700} fontFamily="DM Sans,sans-serif">Consistent</text>
          </svg>
        </div>
        <div style={{marginTop:'1.5rem',display:'flex',gap:'.5rem'}}>
          <button className="pres-btn" onClick={selectAll}>Show all</button>
          <button className="pres-btn" onClick={selectNone}>Hide all</button>
        </div>
        <div style={{marginTop:'1rem',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:'.4rem',width:'100%',maxWidth:'720px'}}>
          {comp.map((r,i)=>{
            const col=PAX_C[i%PAX_C.length];
            const on=visibleSet.has(r.respondent_name);
            return(
              <label key={i} onClick={()=>toggleOne(r.respondent_name)} style={{display:'flex',alignItems:'center',gap:'.5rem',padding:'.45rem .65rem',borderRadius:'3px',cursor:'pointer',background:on?'rgba(255,255,255,.08)':'transparent',border:`1px solid ${on?col:'rgba(255,255,255,.15)'}`,fontSize:'.78rem',color:on?'#fff':'#888',fontFamily:"'DM Sans',sans-serif",userSelect:'none'}}>
                <input type="checkbox" checked={on} readOnly style={{accentColor:col,width:14,height:14,pointerEvents:'none',flexShrink:0}}/>
                <div style={{width:10,height:10,borderRadius:'50%',background:col,flexShrink:0}}/>
                <span style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',fontWeight:on?700:400}}>{r.respondent_name}</span>
              </label>
            );
          })}
        </div>
        <div style={{marginTop:'1rem',display:'flex',gap:'1rem',flexWrap:'wrap',justifyContent:'center',fontSize:'.7rem',color:'rgba(255,255,255,.6)',fontFamily:"'DM Sans',sans-serif"}}>
          <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}><svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#fff" strokeWidth="3"/></svg>Group mean (as-is)</div>
          {compTobe.length>0&&<div style={{display:'flex',alignItems:'center',gap:'.4rem'}}><svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#e07030" strokeWidth="3"/></svg>Group mean (desired)</div>}
        </div>
      </div>
    );
  }

  return(
    <div className="shell" ref={topRef}>
      {presentationMode&&renderPresentationMode()}
      <Progress step={step} principlesStep={principlesStep}/>
      <div className="main">
        <div className="content fade" key={step}>
          {step===0&&renderLanding()}
          {step===1&&renderContext()}
          {step===2&&renderS1()}
          {step===3&&renderS2()}
          {step===4&&renderProfile()}
          {step===5&&!groupReportMode&&!principlesStep&&renderTobe()}
          {step===5&&!groupReportMode&&principlesStep&&renderPrinciples()}
          {step===5&&groupReportMode&&codeNorm&&(
            <div>
              <button className="back-btn" onClick={()=>setGroupReportMode(false)}>← Back to Profile Setup</button>
              <div className="sec-tag">Group Report</div>
              <h2 className="pg-title">Live Group Results</h2>
              <p className="pg-sub">See how your group is progressing and compare profiles in real-time.</p>
              {renderGroupReportTab()}
            </div>
          )}
          {step===6&&renderReport()}
        </div>
      </div>
    </div>
  );
}

// ── FIX: update renderProfile and go() calls ─────────────────────────────
// Steps: 0=landing 1=context 2=s1 3=s2 4=profile 5=tobe 6=report
// stepToNav: 0→0,1→1,2→2,3→2,4→3,5→4,6→5

// Override stepToNav and STEPS already defined above — patch here:
// (The Progress component above uses stepToNav — we redefine it correctly)
// Note: STEPS and stepToNav defined earlier in the file are now correct for 7 app steps.

// ── ERROR BOUNDARY ───────────────────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null,info:null};}
  componentDidCatch(error,info){this.setState({error:error.message,info:info.componentStack});}
  render(){
    if(this.state.error){
      return React.createElement('div',{style:{padding:'2rem',fontFamily:"'DM Sans',sans-serif",background:'#fff8f5',border:'2px solid #e07030',margin:'2rem',borderRadius:'8px'}},
        React.createElement('h3',{style:{color:'#e07030',marginBottom:'1rem'}},'Something went wrong'),
        React.createElement('pre',{style:{fontSize:'.75rem',color:'#555',whiteSpace:'pre-wrap',marginBottom:'1rem'}},this.state.error),
        React.createElement('button',{onClick:()=>this.setState({error:null,info:null}),style:{marginTop:'1rem',padding:'.5rem 1rem',background:'#e07030',color:'#fff',border:'none',borderRadius:'4px',cursor:'pointer'}},'Try Again')
      );
    }
    return this.props.children;
  }
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ErrorBoundary,null,React.createElement(App,null)));
</script>
</body>
</html>
